  <!-- Left motion arrow -->
  <path d="M52,148 L30,148" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <polygon points="28,148 40,140 40,156" fill="#000000"/>
  <path d="M52,140 L42,128" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <polygon points="40,126 48,136 36,134" fill="#000000"/>
  <!-- Right motion arrow -->
  <path d="M238,148 L260,148" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <polygon points="262,148 250,140 250,156" fill="#000000"/>
  <path d="M238,140 L248,128" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <polygon points="250,126 242,136 254,134" fill="#000000"/>
  <!-- Up motion arrow -->
  <path d="M145,62 L145,42" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <polygon points="145,38 137,50 153,50" fill="#000000"/>
