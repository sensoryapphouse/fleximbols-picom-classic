  <rect x="170" y="192" width="20" height="24" rx="4" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Arm rests -->
  <rect x="68" y="130" width="22" height="55" rx="8" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="200" y="130" width="22" height="55" rx="8" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Seat headrest -->
  <rect x="105" y="68" width="80" height="28" rx="10" fill="#d01424" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
