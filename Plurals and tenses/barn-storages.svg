  <line x1="150" y1="131" x2="172" y2="131" stroke="#000000" stroke-width="2"/>
  <!-- Hay bales stacked beside (right) -->
  <!-- Bottom row -->
  <rect x="200" y="170" width="36" height="36" fill="#f2e40d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="240" y="170" width="36" height="36" fill="#f2e40d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Top bale -->
  <rect x="220" y="134" width="36" height="36" fill="#f2e40d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Hay texture (straws) on each bale -->
  <line x1="206" y1="178" x2="230" y2="184" stroke="#7d5e23" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="206" y1="190" x2="230" y2="196" stroke="#7d5e23" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="246" y1="178" x2="270" y2="184" stroke="#7d5e23" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="246" y1="190" x2="270" y2="196" stroke="#7d5e23" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="226" y1="142" x2="250" y2="148" stroke="#7d5e23" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="226" y1="154" x2="250" y2="160" stroke="#7d5e23" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Twine bands -->
  <line x1="210" y1="170" x2="210" y2="206" stroke="#000000" stroke-width="1.5"/>
  <line x1="226" y1="170" x2="226" y2="206" stroke="#000000" stroke-width="1.5"/>
  <line x1="250" y1="170" x2="250" y2="206" stroke="#000000" stroke-width="1.5"/>
  <line x1="266" y1="170" x2="266" y2="206" stroke="#000000" stroke-width="1.5"/>
