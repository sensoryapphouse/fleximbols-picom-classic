  <!-- Red barn with X-cross door, hay bales stacked beside -->
  <!-- Ground -->
  <rect x="10" y="205" width="270" height="20" fill="#67832d" stroke="#000000" stroke-width="3"/>
  <!-- Barn body -->
  <rect x="40" y="100" width="140" height="106" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Barn roof (gambrel) -->
  <path d="M30 100 L60 70 L60 50 L160 50 L160 70 L190 100 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Hay loft door -->
  <rect x="96" y="62" width="28" height="28" fill="#9d7246" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Big barn door -->
  <rect x="80" y="130" width="60" height="76" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Door frame top -->
  <rect x="78" y="128" width="64" height="6" fill="#5e1f0a" stroke="#000000" stroke-width="2.5"/>
  <!-- Door split line -->
  <line x1="110" y1="134" x2="110" y2="206" stroke="#000000" stroke-width="2.5"/>
  <!-- X-cross on doors -->
  <line x1="80" y1="134" x2="140" y2="206" stroke="#5e1f0a" stroke-width="5" stroke-linecap="round"/>
  <line x1="140" y1="134" x2="80" y2="206" stroke="#5e1f0a" stroke-width="5" stroke-linecap="round"/>
  <!-- Side window -->
