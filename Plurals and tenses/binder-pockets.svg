  <path d="M 210 110 L 240 110 L 240 128 L 210 128 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <path d="M 210 115 Q 225 112 240 115" fill="none" stroke="#000000" stroke-width="2"/>
