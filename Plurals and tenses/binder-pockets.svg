  <!-- spine -->
  <rect x="139" y="25" width="12" height="190" fill="#392170" stroke="#000000" stroke-width="3"/>
  <!-- 3 rings (small, just to show binder context) -->
  <ellipse cx="145" cy="65" rx="10" ry="7" fill="none" stroke="#7f7f7f" stroke-width="4"/>
  <ellipse cx="145" cy="65" rx="10" ry="7" fill="none" stroke="#000000" stroke-width="2"/>
