  <!-- open binder showing inside pocket folder with papers -->
  <!-- left cover -->
  <path d="M 25 35 L 145 25 L 145 215 L 25 205 Z" fill="#7c3fac" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
