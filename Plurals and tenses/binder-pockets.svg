  <path d="M 200 150 Q 170 165 145 158" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 152 152 L 142 158 L 152 165 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
