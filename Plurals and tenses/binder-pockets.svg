  <ellipse cx="145" cy="175" rx="10" ry="7" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- pocket folder inside left cover -->
  <path d="M 38 60 L 130 55 L 130 195 L 38 190 Z" fill="#f266aa" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- pocket flap (the actual pocket - lower portion with curved opening) -->
