  <path d="M 55 70 L 100 67 L 100 135 L 55 138 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 70 65 L 115 62 L 115 135 L 70 138 Z" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
