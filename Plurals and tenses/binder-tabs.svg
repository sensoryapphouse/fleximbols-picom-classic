  <!-- binder divider page with tab sticking out -->
  <!-- main divider page (cardstock) -->
  <rect x="55" y="35" width="160" height="170" fill="#f5e7c4" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- 3 punched holes on left -->
  <circle cx="68" cy="60" r="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="68" cy="120" r="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="68" cy="180" r="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- the tab sticking out the right side -->
  <path d="M 215 90 L 260 90 L 260 150 L 215 150 Z" fill="#3aa6a0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- tab is plastic/cardstock - subtle highlight strip -->
  <rect x="220" y="95" width="35" height="5" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <!-- label area on tab (clear plastic window with paper insert) -->
  <rect x="222" y="108" width="33" height="28" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- label lines (writing space) -->
  <line x1="226" y1="118" x2="251" y2="118" stroke="#7f7f7f" stroke-width="2"/>
  <line x1="226" y1="126" x2="251" y2="126" stroke="#7f7f7f" stroke-width="2"/>
