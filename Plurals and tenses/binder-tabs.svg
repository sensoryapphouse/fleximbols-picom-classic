  <path d="M 145 70 Q 200 70 215 95" fill="none" stroke="#d01424" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 208 88 L 218 96 L 209 102 Z" fill="#d01424" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- callout indicator: "tab" emphasized by ring around the tab -->
