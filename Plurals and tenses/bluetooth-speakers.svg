  <!-- Bluetooth speaker: small rounded speaker box + bluetooth rune + sound waves -->
  <!-- Speaker body -->
  <rect x="70" y="65" width="150" height="120" rx="28" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Grille area -->
  <rect x="84" y="79" width="88" height="92" rx="16" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Main woofer cone -->
  <circle cx="128" cy="125" r="32" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <circle cx="128" cy="125" r="20" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <circle cx="128" cy="125" r="8" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Tweeter -->
  <circle cx="128" cy="93" r="8" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <circle cx="128" cy="93" r="3" fill="#000000" stroke="none"/>
  <!-- Bluetooth rune on right panel -->
  <!-- Vertical stem -->
  <line x1="186" y1="108" x2="186" y2="142" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Top-right arm -->
  <line x1="186" y1="108" x2="196" y2="118" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="196" y1="118" x2="186" y2="128" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottom-right arm -->
  <line x1="186" y1="128" x2="196" y2="138" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="196" y1="138" x2="186" y2="148" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Sound waves left side -->
  <path d="M68 105 Q50 125 68 145" fill="none" stroke="#2a4ec0" stroke-width="5" stroke-linecap="round"/>
  <path d="M58 95 Q32 125 58 155" fill="none" stroke="#2a4ec0" stroke-width="4" stroke-linecap="round"/>
  <!-- Status LED -->
  <circle cx="200" cy="90" r="6" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
