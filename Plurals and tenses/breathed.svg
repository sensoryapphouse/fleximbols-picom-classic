    <path d="M120,148 Q132,143 145,144 Q158,143 170,148 Q160,155 145,156 Q130,155 120,148 Z" fill="#f4a4b2" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <path d="M120,148 Q132,146 145,146 Q158,146 170,148" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <!-- Two-way air flow arrow at nose/mouth — in and out curved -->
    <!-- Inward arrow (left side — air coming in) -->
    <path d="M68,128 Q80,132 88,140" fill="none" stroke="#dff3fd" stroke-width="5" stroke-linecap="round"/>
    <polygon points="88,140 78,138 82,129" fill="#dff3fd" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
    <!-- Outward arrow (right side — air going out) -->
    <path d="M202,128 Q214,123 222,116" fill="none" stroke="#dff3fd" stroke-width="5" stroke-linecap="round"/>
    <polygon points="222,116 220,126 212,120" fill="#dff3fd" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
    <!-- Small breath wave lines near mouth -->
    <path d="M80,145 Q84,140 88,145 Q92,150 96,145" fill="none" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
    <path d="M194,145 Q198,140 202,145 Q206,150 210,145" fill="none" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  </g>
