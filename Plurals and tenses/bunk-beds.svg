  <!-- Plain wooden 2-tier bunk bed with ladder — just furniture, homely wood, no traveller items -->
  <!-- Left post (wood, warm brown) -->
  <rect x="38" y="28" width="18" height="196" rx="5" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
