  <rect x="226" y="180" width="50" height="22" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <!-- B -->
  <path d="M236,184 L236,198 L244,198 Q248,198 248,194 Q248,190 244,190 Q248,190 248,186 Q248,184 244,184 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- A -->
  <path d="M256,198 L260,184 L264,198 M258,192 L262,192" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

