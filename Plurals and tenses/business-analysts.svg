  <rect x="180" y="162" width="6" height="14" fill="#2a4ec0"/>
  <rect x="190" y="164" width="6" height="12" fill="#529929"/>
  <rect x="200" y="160" width="6" height="16" fill="#ff9900"/>

  <!-- Briefcase -->
  <rect x="226" y="130" width="50" height="42" rx="4" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="240" y="122" width="22" height="10" rx="2" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="226" y="148" width="50" height="3" fill="#000000"/>
  <rect x="248" y="146" width="6" height="8" rx="1" fill="#fff200" stroke="#000000" stroke-width="2"/>

