  <!-- business-analyst: full body + business chart + report + briefcase + BA label -->

  <!-- Business chart (top-right) -->
  <rect x="160" y="20" width="108" height="76" rx="4" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
