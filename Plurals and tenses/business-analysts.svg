  <!-- Data points -->
  <circle cx="188" cy="72" r="3" fill="#137827" stroke="#000000" stroke-width="2"/>
  <circle cx="206" cy="76" r="3" fill="#137827" stroke="#000000" stroke-width="2"/>
  <circle cx="224" cy="58" r="3" fill="#137827" stroke="#000000" stroke-width="2"/>
  <circle cx="244" cy="46" r="3" fill="#137827" stroke="#000000" stroke-width="2"/>
  <!-- Up arrow at end -->
  <polygon points="260,32 254,38 264,40" fill="#137827" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Axis -->
  <line x1="168" y1="22" x2="168" y2="90" stroke="#000000" stroke-width="3"/>
  <line x1="168" y1="90" x2="264" y2="90" stroke="#000000" stroke-width="3"/>

  <!-- Report document -->
  <rect x="160" y="108" width="60" height="80" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="166" y="116" width="48" height="6" fill="#2a4ec0"/>
  <rect x="166" y="128" width="40" height="4" fill="#7f7f7f"/>
  <rect x="166" y="136" width="44" height="4" fill="#7f7f7f"/>
  <rect x="166" y="144" width="38" height="4" fill="#7f7f7f"/>
  <rect x="166" y="156" width="48" height="22" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
