  <!-- Calf raise: figure standing on tiptoes, heels lifted high, body straight -->
  <!-- Figure head -->
  <circle cx="145" cy="44" r="22" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M124 36 Q126 20 145 18 Q164 20 166 36 Q158 26 145 27 Q132 26 124 36 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Torso: upright, straight -->
  <path d="M126 68 Q145 60 164 68 L168 128 Q145 134 122 128 Z" fill="#d01424" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Arms at sides -->
  <path d="M126 80 Q108 104 102 128" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M164 80 Q182 104 188 128" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Hands -->
  <circle cx="102" cy="128" r="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <circle cx="188" cy="128" r="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Shorts -->
  <path d="M122 128 Q145 136 168 128 L170 152 Q145 158 120 152 Z" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Thighs straight down -->
  <path d="M128 152 Q122 176 120 196" stroke="#000000" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M162 152 Q168 176 170 196" stroke="#000000" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Lower legs (calves) - straight, showing raised calf muscle) -->
  <path d="M120 196 Q118 210 118 222" stroke="#000000" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M170 196 Q172 210 172 222" stroke="#000000" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- HEELS LIFTED: feet on tiptoes - only ball-of-foot / toes on ground, heels HIGH up -->
  <!-- Left foot on tiptoe (toe-tip only, heel elevated) -->
  <ellipse cx="120" cy="228" rx="10" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Raised heel indicator: heel elevated well above ground -->
  <ellipse cx="112" cy="208" rx="8" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Right foot on tiptoe -->
  <ellipse cx="172" cy="228" rx="10" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Raised heel -->
  <ellipse cx="180" cy="208" rx="8" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Ground line -->
  <line x1="40" y1="234" x2="250" y2="234" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Dumbbell in each hand (optional weight) -->
  <!-- Left dumbbell -->
  <rect x="88" y="122" width="28" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="84" y="118" width="8" height="18" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="116" y="118" width="8" height="18" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right dumbbell -->
  <rect x="174" y="122" width="28" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="170" y="118" width="8" height="18" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="202" y="118" width="8" height="18" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
