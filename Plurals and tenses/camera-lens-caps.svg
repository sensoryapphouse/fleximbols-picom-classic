  <!-- camera body behind (partial) -->
  <rect x="40" y="80" width="80" height="100" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- viewfinder hump -->
  <rect x="65" y="65" width="35" height="18" rx="3" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- shutter button -->
  <circle cx="100" cy="92" r="5" fill="#d01424" stroke="#000000" stroke-width="2"/>
  <!-- lens barrel (cylinder from side) -->
  <rect x="115" y="105" width="55" height="50" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- lens rings -->
  <line x1="125" y1="105" x2="125" y2="155" stroke="#000000" stroke-width="2"/>
  <line x1="145" y1="105" x2="145" y2="155" stroke="#000000" stroke-width="2"/>
  <line x1="160" y1="105" x2="160" y2="155" stroke="#000000" stroke-width="2"/>
  <!-- round lens cap in front of lens (face-on, larger, dominant) -->
  <circle cx="200" cy="130" r="58" fill="#000000" stroke="#000000" stroke-width="4"/>
  <circle cx="200" cy="130" r="50" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- pinch grip tabs (center-pinch lens cap) -->
  <rect x="175" y="125" width="16" height="10" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="209" y="125" width="16" height="10" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
