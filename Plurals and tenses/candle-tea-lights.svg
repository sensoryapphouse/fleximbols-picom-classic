  <!-- Re-draw flame on top of halo -->
  <path d="M 145,118 Q 135,108 140,95 Q 145,108 145,90 Q 150,108 150,95 Q 155,108 145,118 Z" fill="#ff9900" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
