  <!-- CHARACTER-ARTIST: person at screen showing a character turnaround (front+side poses), stylus in hand -->
  <!-- Monitor stand -->
  <rect x="116" y="148" width="14" height="22" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="102" y="168" width="42" height="8" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Monitor body -->
  <rect x="62" y="68" width="156" height="84" rx="7" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Screen -->
  <rect x="70" y="75" width="140" height="70" rx="4" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Screen background soft -->
  <rect x="74" y="79" width="132" height="62" rx="2" fill="#efefef" stroke="none"/>
  <!-- Character front pose (left on screen) -->
  <!-- head -->
  <circle cx="110" cy="91" r="8" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M102 89 Q110 80 118 89" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- body -->
  <rect x="104" y="99" width="12" height="16" rx="2" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <!-- legs front -->
  <line x1="107" y1="115" x2="105" y2="131" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="113" y1="115" x2="115" y2="131" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- arms front -->
  <line x1="104" y1="104" x2="96" y2="112" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="116" y1="104" x2="124" y2="112" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Character side pose (right on screen) -->
  <!-- head side -->
  <circle cx="162" cy="91" r="8" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- hair side -->
  <path d="M154 89 Q162 80 170 89" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- body side -->
  <rect x="158" y="99" width="8" height="16" rx="2" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <!-- legs side -->
  <line x1="160" y1="115" x2="158" y2="131" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="164" y1="115" x2="166" y2="131" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- arm side (one arm visible) -->
  <line x1="158" y1="104" x2="152" y2="114" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Divider line between poses -->
  <line x1="140" y1="82" x2="140" y2="136" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Desk -->
  <rect x="38" y="170" width="210" height="12" rx="4" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="46" y="182" width="10" height="30" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <rect x="234" y="182" width="10" height="30" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <!-- Stylus on desk pointing toward screen -->
  <line x1="180" y1="170" x2="210" y2="158" stroke="#4d4d4d" stroke-width="5" stroke-linecap="round"/>
  <circle cx="178" cy="171" r="5" fill="#7c3fac" stroke="#000000" stroke-width="4"/>
  <!-- Chair seat -->
  <rect x="184" y="188" width="52" height="10" rx="4" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="226" y="166" width="12" height="28" rx="4" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <line x1="190" y1="198" x2="186" y2="216" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="228" y1="198" x2="232" y2="216" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Person: legs -->
  <line x1="196" y1="198" x2="190" y2="220" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="216" y1="198" x2="216" y2="220" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="188" cy="222" rx="8" ry="4" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <ellipse cx="216" cy="222" rx="8" ry="4" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Person: torso -->
  <rect x="194" y="152" width="28" height="36" rx="5" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Person: arms — right arm reaching toward desk/stylus -->
  <line x1="194" y1="162" x2="175" y2="172" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="173" cy="174" r="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <line x1="222" y1="162" x2="232" y2="170" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="233" cy="172" r="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Person: neck -->
  <rect x="202" y="143" width="10" height="10" rx="2" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Person: head -->
  <circle cx="207" cy="134" r="14" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M193 130 Q207 117 221 130" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
