  <!-- chuckle: closed-mouth small smile with one or two tiny "heh" puffs (quiet small laugh) -->
  <!-- Head (centered) -->
  <circle cx="130" cy="108" r="52" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair -->
  <path d="M 80 92 Q 82 50 130 47 Q 178 50 180 92 Q 168 65 130 65 Q 92 65 80 92 Z" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Eyes happy/squinting in a smile (crescent shape) -->
  <!-- Left eye crescent (happy squint) -->
  <path d="M 108 97 Q 116 88 124 97" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Right eye crescent -->
  <path d="M 136 97 Q 144 88 152 97" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Rosy cheeks (happy flush) -->
  <ellipse cx="105" cy="116" rx="12" ry="8" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="155" cy="116" rx="12" ry="8" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="105" cy="116" rx="12" ry="8" fill="none" stroke="#f266aa" stroke-width="2"/>
  <ellipse cx="155" cy="116" rx="12" ry="8" fill="none" stroke="#f266aa" stroke-width="2"/>
  <!-- Mouth: closed-lip gentle smile (no teeth - quiet laugh) -->
  <path d="M 110 128 Q 116 136 130 138 Q 144 136 150 128" fill="#d01424" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 110 128 Q 130 126 150 128" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Closed lip (upper lip line) -->
  <!-- Neck -->
  <rect x="118" y="158" width="24" height="20" rx="5" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <path d="M 65 235 L 80 178 Q 130 168 180 178 L 195 235 Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Two tiny "heh" puff bubbles (small rounded polygons, not text) -->
  <!-- Puff 1 (small cloud shape) -->
  <circle cx="188" cy="95" r="16" fill="#efefef" stroke="#000000" stroke-width="4"/>
  <circle cx="202" cy="90" r="14" fill="#efefef" stroke="#000000" stroke-width="4"/>
  <circle cx="214" cy="97" r="12" fill="#efefef" stroke="#000000" stroke-width="4"/>
  <rect x="188" y="95" width="26" height="20" fill="#efefef"/>
  <!-- Inner lines of puff 1 suggesting "heh" - small wavy strokes (not text, just abstract marks) -->
  <path d="M 192 96 Q 198 92 204 96 Q 210 100 216 96" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Puff tail -->
  <polygon points="188,112 178,125 196,112" fill="#efefef" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Puff 2 (even smaller, above puff 1) -->
  <circle cx="202" cy="62" r="11" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <circle cx="213" cy="58" r="9" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <circle cx="222" cy="65" r="8" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <rect x="202" y="62" width="20" height="14" fill="#efefef"/>
  <path d="M 204 64 Q 210 60 216 64 Q 222 68 228 64" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Puff 2 tail -->
  <polygon points="202,74 193,84 210,74" fill="#efefef" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
