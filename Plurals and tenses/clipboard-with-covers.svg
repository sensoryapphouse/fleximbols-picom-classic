  <!-- Clipboard with hinged cover: cover shown partly open -->
  <!-- Back board of clipboard -->
  <rect x="52" y="42" width="172" height="188" rx="8" ry="8" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Paper on clipboard (visible because cover is partly open) -->
  <rect x="62" y="58" width="152" height="162" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Ruled lines on paper -->
  <line x1="74" y1="82" x2="202" y2="82" stroke="#b8b8b8" stroke-width="2"/>
  <line x1="74" y1="96" x2="202" y2="96" stroke="#b8b8b8" stroke-width="2"/>
  <line x1="74" y1="110" x2="202" y2="110" stroke="#b8b8b8" stroke-width="2"/>
  <line x1="74" y1="124" x2="202" y2="124" stroke="#b8b8b8" stroke-width="2"/>
  <line x1="74" y1="138" x2="202" y2="138" stroke="#b8b8b8" stroke-width="2"/>
  <line x1="74" y1="152" x2="202" y2="152" stroke="#b8b8b8" stroke-width="2"/>
  <!-- Clip bar -->
  <rect x="82" y="32" width="112" height="30" rx="6" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Clip spring ring -->
  <rect x="112" y="22" width="52" height="20" rx="8" ry="8" fill="none" stroke="#000000" stroke-width="5"/>
  <rect x="118" y="26" width="40" height="12" rx="5" ry="5" fill="#7f7f7f" stroke="none"/>
  <!-- Hinged cover flap - partly open, pivoting from top-left corner -->
  <!-- Cover shown as rotated panel, hinged at top -->
  <path d="M 52 42 L 52 180 Q 52 186 58 186 L 80 186 Q 40 150 38 90 Q 36 60 52 42 Z" fill="#7d5e23" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Cover main panel angled open -->
  <rect x="14" y="42" width="50" height="148" rx="6" ry="6" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round" transform="rotate(-28 52 42)"/>
  <!-- Cover closure tab on flap edge -->
  <rect x="6" y="90" width="16" height="24" rx="4" ry="4" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round" transform="rotate(-28 52 42)"/>
  <!-- Hinge line -->
  <line x1="52" y1="42" x2="52" y2="190" stroke="#4d4d4d" stroke-width="4" stroke-linecap="round"/>
