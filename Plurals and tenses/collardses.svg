  <!-- collards: large round dark-green leaves with thick stems bunched -->
  <!-- bundle base & tie -->
  <ellipse cx="145" cy="215" rx="55" ry="9" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <rect x="118" y="190" width="54" height="20" rx="4" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- thick stems -->
  <path d="M128,195 Q100,150 85,95" stroke="#eed5b6" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M128,195 Q100,150 85,95" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M145,195 L145,55" stroke="#eed5b6" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M145,195 L145,55" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
