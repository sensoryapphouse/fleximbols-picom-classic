  <path d="M162,195 Q190,150 205,95" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- big round leaves (back layer lighter) -->
  <ellipse cx="85" cy="90" rx="50" ry="42" fill="#67832d" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="205" cy="90" rx="50" ry="42" fill="#67832d" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
