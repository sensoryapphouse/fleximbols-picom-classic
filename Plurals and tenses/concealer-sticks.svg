  <!-- TWIST-UP SOLID CONCEALER STICK (chunky cylinder like lipstick/crayon) -->

  <!-- OUTER CASING (lower body — the twist mechanism base) -->
  <!-- Main case cylinder body -->
  <rect x="95" y="130" width="100" height="88" rx="14" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Case base cap -->
  <rect x="95" y="202" width="100" height="20" rx="10" fill="#392170" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Twist ring groove (mid-case) -->
  <rect x="95" y="162" width="100" height="10" rx="3" fill="#f266aa" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Twist knurl dots -->
  <circle cx="108" cy="167" r="3" fill="#ffffff" stroke="none"/>
  <circle cx="120" cy="167" r="3" fill="#ffffff" stroke="none"/>
  <circle cx="132" cy="167" r="3" fill="#ffffff" stroke="none"/>
  <circle cx="144" cy="167" r="3" fill="#ffffff" stroke="none"/>
  <circle cx="156" cy="167" r="3" fill="#ffffff" stroke="none"/>
  <circle cx="168" cy="167" r="3" fill="#ffffff" stroke="none"/>
  <circle cx="180" cy="167" r="3" fill="#ffffff" stroke="none"/>

  <!-- UPPER SLEEVE (thinner ring around cream stick collar) -->
  <rect x="100" y="100" width="90" height="36" rx="10" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- CREAM STICK poking out the top (beige/skin tone) -->
  <!-- Stick body -->
  <rect x="108" y="44" width="74" height="62" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Stick top slightly domed / angled from use -->
  <ellipse cx="145" cy="44" rx="37" ry="10" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- Angled swipe mark on top -->
  <path d="M116 38 Q145 30 174 38" fill="none" stroke="#9d7246" stroke-width="3" stroke-linecap="round"/>
