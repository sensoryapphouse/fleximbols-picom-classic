  <!-- Contour stick: chunky twist-up stick, cool-brown/taupe cream poking out top -->
  <!-- Outer casing body (chunky, like thick lipstick tube) -->
  <rect x="113" y="118" width="64" height="90" rx="10" ry="10" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Twist mechanism lines on barrel -->
  <line x1="113" y1="150" x2="177" y2="150" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="113" y1="166" x2="177" y2="166" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom twist-wheel (wider, ribbed) -->
  <rect x="109" y="204" width="72" height="14" rx="7" ry="7" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Twist wheel ribs -->
  <line x1="122" y1="205" x2="122" y2="217" stroke="#7f7f7f" stroke-width="2"/>
  <line x1="133" y1="205" x2="133" y2="217" stroke="#7f7f7f" stroke-width="2"/>
  <line x1="145" y1="205" x2="145" y2="217" stroke="#7f7f7f" stroke-width="2"/>
  <line x1="157" y1="205" x2="157" y2="217" stroke="#7f7f7f" stroke-width="2"/>
  <line x1="168" y1="205" x2="168" y2="217" stroke="#7f7f7f" stroke-width="2"/>
  <!-- Collar ring where stick emerges -->
  <rect x="113" y="106" width="64" height="16" rx="5" ry="5" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Cool-brown/taupe cream stick poking up from collar -->
  <!-- Stick body: cool taupe (not warm orange) -->
  <rect x="124" y="44" width="42" height="66" rx="8" ry="8" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Cool taupe overlay to shift tone cooler -->
  <rect x="128" y="52" width="10" height="54" rx="4" fill="#7d5e23" stroke="none"/>
  <!-- Angled top of stick (worn/used cut) -->
  <path d="M 124,52 Q 128,38 166,46 L 166,52 Z" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
