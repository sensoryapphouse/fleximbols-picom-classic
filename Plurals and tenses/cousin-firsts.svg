  <ellipse cx="82" cy="210" rx="10" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="4"/>

  <!-- Family tree on right side (1-degree separation) -->
  <!-- grandparent shared node at top -->
  <circle cx="220" cy="32" r="9" fill="#f7de58" stroke="#000000" stroke-width="3"/>
