<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><g transform="translate(0.000,26.808) scale(0.8883)"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Single large brass cymbal on a thin tall stand, slightly tilted, with drumstick -->

  <!-- Stand base - tripod feet -->
  <line x1="100" y1="220" x2="130" y2="185" stroke="#4d4d4d" stroke-width="5" stroke-linecap="round"/>
  <line x1="160" y1="220" x2="138" y2="185" stroke="#4d4d4d" stroke-width="5" stroke-linecap="round"/>
  <line x1="130" y1="220" x2="134" y2="185" stroke="#4d4d4d" stroke-width="5" stroke-linecap="round"/>

  <!-- Stand pole - thin tall -->
  <rect x="129" y="95" width="8" height="95" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Wing nut / tilter on stand -->
  <ellipse cx="133" cy="98" rx="12" ry="7" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>

  <!-- Cymbal - tilted slightly, large, thin -->
  <!-- Using a parallelogram-like shape via path for tilt effect -->
  <ellipse cx="133" cy="88" rx="72" ry="18" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round" transform="rotate(-10, 133, 88)"/>
  <!-- Cymbal top surface highlight (inner ellipse for depth) -->
  <ellipse cx="133" cy="88" rx="60" ry="14" fill="none" stroke="#f2e40d" stroke-width="2" transform="rotate(-10, 133, 88)"/>
  <!-- Cymbal bell center -->
  <ellipse cx="133" cy="86" rx="18" ry="8" fill="#f2e40d" stroke="#000000" stroke-width="4" transform="rotate(-10, 133, 86)"/>
  <ellipse cx="133" cy="84" rx="9" ry="5" fill="#fff200" stroke="#000000" stroke-width="3" transform="rotate(-10, 133, 84)"/>

  <!-- Drumstick - thin, angled hitting the cymbal edge -->
  <!-- Stick handle -->
  <line x1="230" y1="30" x2="165" y2="75" stroke="#9d7246" stroke-width="7" stroke-linecap="round"/>
  <!-- Stick tip (small round bead) -->
  <circle cx="163" cy="77" r="7" fill="#7d5e23" stroke="#000000" stroke-width="3"/>

  <!-- Motion lines at impact point -->
  <line x1="155" y1="68" x2="148" y2="58" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="162" y1="64" x2="158" y2="52" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="62" x2="168" y2="50" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</g><g transform="translate(0,0) scale(0.5664,0.4688) translate(360 8) scale(0.2812)"><defs><radialGradient id="pcxpl671" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pcxpl671)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
