  <!-- bat: flat wooden blade + narrow handle, leaning diagonally -->
  <!-- handle (narrow) -->
  <path d="M200,30 L220,40 L175,110 L160,100 Z"
        fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- handle grip wrap -->
  <path d="M195,35 L218,46 M188,48 L213,60 M180,62 L203,73 M173,77 L195,88 M165,92 L188,102"
        fill="none" stroke="#f8130d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- splice between handle and blade -->
  <path d="M160,100 L175,110 L165,125 L150,115 Z" fill="#9d7246" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- blade (flat wide wood) -->
  <path d="M150,115 L165,125 L100,215 L65,195 Z"
        fill="#eed5b6" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- wood grain lines -->
  <path d="M140,130 L88,210 M130,123 L78,205 M120,118 L70,200 M155,135 L105,212"
        fill="none" stroke="#9d7246" stroke-width="1.5" stroke-linecap="round"/>
  <!-- bat edge highlight -->
  <path d="M150,115 L165,125 L102,213 L98,210 Z" fill="#e6b98a" stroke="none"/>
  <!-- cricket ball (red) -->
  <circle cx="210" cy="185" r="22" fill="#d01424" stroke="#000000" stroke-width="3.5"/>
  <!-- white stitched seam -->
  <path d="M190,182 Q210,168 230,182" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M192,183 L195,178 M200,180 L203,175 M210,179 L213,174 M220,180 L223,175 M228,182 L225,177"
        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- ball highlight -->
  <circle cx="202" cy="178" r="3.5" fill="#f8130d" stroke="none"/>
