  <!-- Crocheted handbag with open weave and handles -->
  <!-- Handles (two loops) -->
  <path d="M 110 70 Q 105 30 145 30 Q 185 30 180 70" fill="none" stroke="#9d7246" stroke-width="10" stroke-linecap="round"/>
  <path d="M 110 70 Q 105 30 145 30 Q 185 30 180 70" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Bag body (rounded trapezoid) -->
  <path d="M 70 75 L 220 75 Q 235 75 232 90 L 220 200 Q 218 215 200 215 L 90 215 Q 72 215 70 200 L 58 90 Q 55 75 70 75 Z" fill="#e65a00" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Open weave: diagonal lattice -->
  <g stroke="#7d5e23" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="75" y1="90" x2="225" y2="90"/>
    <line x1="72" y1="110" x2="228" y2="110"/>
    <line x1="70" y1="130" x2="230" y2="130"/>
    <line x1="68" y1="150" x2="232" y2="150"/>
    <line x1="68" y1="170" x2="232" y2="170"/>
    <line x1="70" y1="190" x2="230" y2="190"/>
    <line x1="72" y1="205" x2="228" y2="205"/>
  </g>

  <!-- Vertical weave -->
  <g stroke="#7d5e23" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="90" y1="78" x2="92" y2="212"/>
    <line x1="115" y1="76" x2="118" y2="213"/>
    <line x1="145" y1="75" x2="145" y2="215"/>
    <line x1="175" y1="76" x2="172" y2="213"/>
    <line x1="200" y1="78" x2="198" y2="212"/>
  </g>

  <!-- Crochet-stitch X marks (open weave dots) -->
  <g stroke="#000000" stroke-width="1.8" fill="none">
    <path d="M 100 100 l 6 6 M 106 100 l -6 6"/>
    <path d="M 130 100 l 6 6 M 136 100 l -6 6"/>
    <path d="M 160 100 l 6 6 M 166 100 l -6 6"/>
    <path d="M 190 100 l 6 6 M 196 100 l -6 6"/>
    <path d="M 100 140 l 6 6 M 106 140 l -6 6"/>
    <path d="M 130 140 l 6 6 M 136 140 l -6 6"/>
    <path d="M 160 140 l 6 6 M 166 140 l -6 6"/>
    <path d="M 190 140 l 6 6 M 196 140 l -6 6"/>
    <path d="M 100 180 l 6 6 M 106 180 l -6 6"/>
    <path d="M 130 180 l 6 6 M 136 180 l -6 6"/>
    <path d="M 160 180 l 6 6 M 166 180 l -6 6"/>
    <path d="M 190 180 l 6 6 M 196 180 l -6 6"/>
  </g>

  <!-- Top rim band -->
  <path d="M 70 75 L 220 75 Q 235 75 232 90 L 230 92 L 60 92 L 58 90 Q 55 75 70 75 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Decorative tassel hanging from bottom -->
  <line x1="145" y1="215" x2="145" y2="222" stroke="#000000" stroke-width="2"/>
  <path d="M 138 222 L 152 222 L 150 235 L 140 235 Z" fill="#f7de58" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
