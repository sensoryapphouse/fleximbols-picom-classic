  <!-- data-engineer: full-body person beside database-cylinder stack with pipes/flow arrows -->

  <!-- Person: full body, standing left -->
  <!-- Head -->
  <circle cx="68" cy="52" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="68" cy="38" rx="20" ry="10" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <rect x="48" y="74" width="40" height="52" rx="6" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm -->
  <line x1="48" y1="84" x2="28" y2="116" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="28" cy="118" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right arm pointing at DB -->
  <line x1="88" y1="84" x2="118" y2="100" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="120" cy="101" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Hips -->
  <rect x="46" y="124" width="44" height="22" rx="4" fill="#67832d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect x="46" y="144" width="16" height="52" rx="4" fill="#67832d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="74" y="144" width="16" height="52" rx="4" fill="#67832d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left foot -->
  <rect x="40" y="192" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right foot -->
  <rect x="72" y="192" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Database cylinders (stack of 3) -->
  <!-- DB bottom -->
  <ellipse cx="200" cy="188" rx="38" ry="12" fill="#90a7d6" stroke="#000000" stroke-width="4"/>
  <rect x="162" y="158" width="76" height="30" fill="#90a7d6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="200" cy="158" rx="38" ry="12" fill="#dff3fd" stroke="#000000" stroke-width="4"/>
  <!-- DB middle -->
  <ellipse cx="200" cy="148" rx="38" ry="12" fill="#90a7d6" stroke="#000000" stroke-width="4"/>
  <rect x="162" y="118" width="76" height="30" fill="#90a7d6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="200" cy="118" rx="38" ry="12" fill="#dff3fd" stroke="#000000" stroke-width="4"/>
  <!-- DB top -->
  <ellipse cx="200" cy="108" rx="38" ry="12" fill="#90a7d6" stroke="#000000" stroke-width="4"/>
  <rect x="162" y="78" width="76" height="30" fill="#90a7d6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="200" cy="78" rx="38" ry="12" fill="#dff3fd" stroke="#000000" stroke-width="4"/>

  <!-- Pipes / flow arrows from DB -->
  <!-- Pipe right out -->
  <line x1="238" y1="130" x2="262" y2="130" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <polyline points="254,122 264,130 254,138" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
