  <!-- Wavy heat lines -->
  <path d="M170,38 Q176,32 180,38 Q184,44 188,38" fill="none" stroke="#e65a00" stroke-width="3" stroke-linecap="round"/>
  <path d="M196,46 Q202,40 206,46 Q210,52 214,46" fill="none" stroke="#e65a00" stroke-width="3" stroke-linecap="round"/>
  <path d="M222,38 Q228,32 232,38 Q236,44 240,38" fill="none" stroke="#e65a00" stroke-width="3" stroke-linecap="round"/>

  <!-- Drying tray (mesh rack) -->
  <rect x="40" y="100" width="210" height="60" rx="6" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <line x1="60" y1="100" x2="60" y2="160" stroke="#000000" stroke-width="2"/>
