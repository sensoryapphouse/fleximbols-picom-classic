  <circle cx="115" cy="130" r="3" fill="#9d7246" stroke="none"/>
  <circle cx="111" cy="127" r="1.5" fill="#5e1f0a"/>
  <circle cx="119" cy="127" r="1.5" fill="#5e1f0a"/>

