  <circle cx="197" cy="125" r="1.5" fill="#f7de58"/>
  <circle cx="203" cy="125" r="1.5" fill="#f7de58"/>
  <circle cx="200" cy="133" r="1.5" fill="#f7de58"/>

  <!-- Pineapple ring (yellow ring) -->
  <circle cx="232" cy="130" r="16" fill="#f2e40d" stroke="#000000" stroke-width="4"/>
  <circle cx="232" cy="130" r="6" fill="#efefef" stroke="#000000" stroke-width="2"/>
