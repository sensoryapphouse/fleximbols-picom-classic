  <line x1="40" y1="140" x2="250" y2="140" stroke="#000000" stroke-width="2"/>

  <!-- Apple slice (round with hole in middle) -->
  <circle cx="70" cy="130" r="18" fill="#f5e7c4" stroke="#000000" stroke-width="4"/>
  <circle cx="70" cy="130" r="5" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <path d="M58,124 Q70,118 82,124" fill="none" stroke="#9d7246" stroke-width="2" stroke-linecap="round"/>

  <!-- Banana slice (round, beige) -->
