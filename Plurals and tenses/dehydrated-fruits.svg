  <path d="M148,118 Q170,118 175,130 Q170,142 148,142 Q142,130 148,118 Z" fill="#ff9900" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Strawberry slice (red triangular) -->
