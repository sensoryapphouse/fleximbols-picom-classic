  <!-- Dehydrated fruit: fruit slices on tray + sun + dehydration arrow + 'DEHYDRATED' label -->

  <!-- Sun in upper-left with rays -->
  <circle cx="46" cy="46" r="20" fill="#fff200" stroke="#000000" stroke-width="4"/>
  <line x1="46" y1="14" x2="46" y2="22" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="46" y1="70" x2="46" y2="78" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="46" x2="22" y2="46" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="46" x2="78" y2="46" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="22" x2="28" y2="28" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="70" y2="70" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="70" x2="28" y2="64" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="28" x2="70" y2="22" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Downward dehydration arrow (heat coming down) -->
