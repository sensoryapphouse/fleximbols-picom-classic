  <!-- Delivery Truck - generic brown/grey box truck with roll door + parcel, back-to-front -->
  <!-- Shadow -->
  <ellipse cx="145" cy="208" rx="108" ry="7" fill="#4d4d4d" stroke="none"/>
  <!-- Main box body -->
  <rect x="30" y="100" width="170" height="90" rx="6" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Box roof -->
  <rect x="30" y="87" width="170" height="18" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Roll door panel lines -->
  <line x1="68" y1="120" x2="158" y2="120" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="68" y1="130" x2="158" y2="130" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="68" y1="140" x2="158" y2="140" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="68" y1="150" x2="158" y2="150" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Roll door outline -->
  <rect x="68" y="112" width="90" height="60" rx="2" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Roll door handle -->
  <rect x="105" y="168" width="20" height="5" rx="2" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Parcel on ground in front of door -->
  <rect x="38" y="140" width="22" height="18" rx="2" fill="#f5e7c4" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <line x1="38" y1="149" x2="60" y2="149" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="49" y1="140" x2="49" y2="158" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Cab body -->
  <rect x="200" y="118" width="62" height="72" rx="8" fill="#7d5e23" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Cab roof -->
  <path d="M200 118 Q200 96 222 94 L248 94 Q262 94 262 118" fill="#5e1f0a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Windshield -->
  <path d="M222 96 L258 102 L258 120 L222 120 Z" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Cab side window -->
  <rect x="204" y="122" width="24" height="20" rx="3" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Rear bumper -->
  <rect x="30" y="182" width="12" height="8" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Front bumper -->
  <rect x="250" y="182" width="12" height="8" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Front wheel -->
  <circle cx="228" cy="192" r="20" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <circle cx="228" cy="192" r="9" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <!-- Rear wheel -->
  <circle cx="66" cy="192" r="20" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <circle cx="66" cy="192" r="9" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
