  <!-- Eye drop bottle: small squeeze bottle tilted ~25deg, single drop from nozzle -->
  <g transform="translate(130,128) rotate(-25)">
    <!-- Bottle body -->
    <rect x="-28" y="-52" width="56" height="96" rx="14" ry="14" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Label band -->
    <rect x="-28" y="-18" width="56" height="30" rx="0" ry="0" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
    <!-- Cross on label -->
    <rect x="-5" y="-15" width="10" height="24" fill="#ffffff" stroke="none"/>
    <rect x="-14" y="-7" width="28" height="8" fill="#ffffff" stroke="none"/>
    <!-- Shoulder taper -->
    <path d="M-28,-52 L-16,-72 L16,-72 L28,-52 Z" fill="#90a7d6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Neck -->
    <rect x="-10" y="-84" width="20" height="16" rx="4" ry="4" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Nozzle tip (narrow) -->
    <polygon points="-4,-84 4,-84 2,-100 -2,-100" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- Teardrop drop falling from nozzle -->
  <path d="M176,46 Q185,62 176,78 Q167,62 176,46 Z" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
