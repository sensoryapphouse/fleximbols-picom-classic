  <!-- Felt-tip liquid eyeliner pen: slim pen body, fine felt tip, precise drawn line -->
  <!-- Pen body (slim, long, diagonal) -->
  <rect x="40" y="80" width="170" height="34" rx="10" fill="#000000" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Pen label band -->
  <rect x="80" y="84" width="100" height="26" fill="#1d0e82" stroke="none"/>
  <line x1="90" y1="92" x2="170" y2="92" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="100" x2="170" y2="100" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <!-- Cap end (right) blunt -->
  <rect x="190" y="78" width="22" height="38" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Front nib housing (taper from body to tip) -->
  <polygon points="40,80 40,114 8,108 8,86" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Fine felt tip (very narrow pointed) -->
  <polygon points="8,90 8,104 -2,97" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Pen shine highlight -->
  <line x1="50" y1="86" x2="180" y2="86" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <!-- Precise drawn eyeliner line (fine, tapered) below pen -->
  <path d="M30,170 Q120,150 220,170 Q240,172 258,160" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Small wing flick at end -->
  <path d="M250,164 Q262,156 270,148" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Tiny ink dot from tip -->
  <circle cx="22" cy="178" r="3" fill="#000000" stroke="#000000" stroke-width="2"/>
<g transform="translate(0,0) scale(0.5664,0.4688) translate(360 8) scale(0.2812)"><defs><radialGradient id="pcxpl948" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pcxpl948)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
