  <line x1="255" y1="155" x2="255" y2="173" stroke="#000000" stroke-width="1.5"/>
  <!-- chassis frame visible under platform -->
  <rect x="105" y="173" width="170" height="10" fill="#4d4d4d" stroke="#000000" stroke-width="2.5"/>
  <!-- visible empty space ABOVE platform showing no walls/no roof -->
