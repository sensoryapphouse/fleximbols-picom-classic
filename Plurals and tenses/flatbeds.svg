  <rect x="105" y="155" width="170" height="18" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
  <!-- platform plank lines (wood grain detail) -->
  <line x1="135" y1="155" x2="135" y2="173" stroke="#000000" stroke-width="1.5"/>
  <line x1="165" y1="155" x2="165" y2="173" stroke="#000000" stroke-width="1.5"/>
