  <line x1="55" y1="150" x2="60" y2="150" stroke="#000000" stroke-width="1.5"/>
  <!-- Right-angle mark in corner -->
  <polyline points="60,190 60,170 80,170" fill="none" stroke="#000000" stroke-width="3"/>
