  <!-- L-shaped framing square: long arm goes right, short arm goes up -->
  <!-- Long arm (horizontal, bottom) -->
  <rect x="30" y="170" width="230" height="30" rx="3" ry="3" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Short arm (vertical, left) -->
  <rect x="30" y="30" width="30" height="142" rx="3" ry="3" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Inner corner fillet -->
  <rect x="60" y="170" width="4" height="4" fill="#b8b8b8" stroke="none"/>
  <!-- Graduation marks on long arm (top edge) -->
  <line x1="70" y1="170" x2="70" y2="178" stroke="#000000" stroke-width="2"/>
  <line x1="90" y1="170" x2="90" y2="178" stroke="#000000" stroke-width="2"/>
