  <line x1="150" y1="170" x2="150" y2="178" stroke="#000000" stroke-width="2"/>
  <line x1="170" y1="170" x2="170" y2="178" stroke="#000000" stroke-width="2"/>
  <line x1="190" y1="170" x2="190" y2="178" stroke="#000000" stroke-width="2"/>
  <line x1="210" y1="170" x2="210" y2="178" stroke="#000000" stroke-width="2"/>
  <line x1="230" y1="170" x2="230" y2="178" stroke="#000000" stroke-width="2"/>
  <!-- Minor marks long arm -->
  <line x1="80" y1="170" x2="80" y2="175" stroke="#000000" stroke-width="1.5"/>
  <line x1="100" y1="170" x2="100" y2="175" stroke="#000000" stroke-width="1.5"/>
  <line x1="120" y1="170" x2="120" y2="175" stroke="#000000" stroke-width="1.5"/>
  <line x1="140" y1="170" x2="140" y2="175" stroke="#000000" stroke-width="1.5"/>
  <line x1="160" y1="170" x2="160" y2="175" stroke="#000000" stroke-width="1.5"/>
  <line x1="180" y1="170" x2="180" y2="175" stroke="#000000" stroke-width="1.5"/>
  <line x1="200" y1="170" x2="200" y2="175" stroke="#000000" stroke-width="1.5"/>
  <line x1="220" y1="170" x2="220" y2="175" stroke="#000000" stroke-width="1.5"/>
  <!-- Graduation marks on short arm (right edge) -->
  <line x1="52" y1="60" x2="60" y2="60" stroke="#000000" stroke-width="2"/>
  <line x1="52" y1="80" x2="60" y2="80" stroke="#000000" stroke-width="2"/>
  <line x1="52" y1="100" x2="60" y2="100" stroke="#000000" stroke-width="2"/>
  <line x1="52" y1="120" x2="60" y2="120" stroke="#000000" stroke-width="2"/>
  <line x1="52" y1="140" x2="60" y2="140" stroke="#000000" stroke-width="2"/>
  <line x1="52" y1="160" x2="60" y2="160" stroke="#000000" stroke-width="2"/>
  <line x1="55" y1="50" x2="60" y2="50" stroke="#000000" stroke-width="1.5"/>
  <line x1="55" y1="70" x2="60" y2="70" stroke="#000000" stroke-width="1.5"/>
  <line x1="55" y1="90" x2="60" y2="90" stroke="#000000" stroke-width="1.5"/>
  <line x1="55" y1="110" x2="60" y2="110" stroke="#000000" stroke-width="1.5"/>
