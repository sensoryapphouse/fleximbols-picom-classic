  <!-- Single glucose test strip, angled slightly, large and clear -->
  <!-- Strip body: long thin rectangle, tilted ~15 degrees -->
  <g transform="rotate(-15, 145, 120)">
    <!-- Strip backing -->
    <rect x="90" y="48" width="110" height="34" rx="8" fill="#f5e7c4" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Contact end (left/insertion end): darker band -->
    <rect x="90" y="48" width="32" height="34" rx="8" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Contact fingers (gold lines) -->
    <line x1="100" y1="54" x2="100" y2="76" stroke="#f7de58" stroke-width="4" stroke-linecap="round"/>
    <line x1="110" y1="54" x2="110" y2="76" stroke="#f7de58" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="54" x2="120" y2="76" stroke="#f7de58" stroke-width="4" stroke-linecap="round"/>
    <!-- Reactive zone (right end): cream/tan with red reactive pad -->
    <rect x="166" y="50" width="30" height="30" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- Reactive pad colour (enzyme zone) -->
    <rect x="170" y="54" width="22" height="22" rx="4" fill="#f8130d" stroke="none"/>
    <!-- Blood drop sitting on the reactive tip -->
    <path d="M196,65 Q204,53 196,44 Q188,53 196,65 Z" fill="#d01424" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- Shadow/ground line beneath strip -->
  <ellipse cx="145" cy="190" rx="70" ry="8" fill="#b8b8b8" stroke="none"/>
<g transform="translate(0,0) scale(0.5664,0.4688) translate(360 8) scale(0.2812)"><defs><radialGradient id="pcxpl1161" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pcxpl1161)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
