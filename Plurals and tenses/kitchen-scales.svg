  <rect x="162" y="162" width="8" height="16" fill="#fff200" stroke="#000000" stroke-width="1.5"/>
  <!-- unit label dot (g) -->
  <rect x="175" y="170" width="8" height="8" fill="#7f7f7f" stroke="#000000" stroke-width="1"/>
  <!-- tare button -->
  <circle cx="70" cy="172" r="9" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- on/off button -->
  <circle cx="220" cy="172" r="9" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- feet -->
  <rect x="55" y="193" width="14" height="8" rx="3" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <rect x="221" y="193" width="14" height="8" rx="3" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
