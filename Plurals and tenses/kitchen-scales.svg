  <!-- digital kitchen scale, friendly red colour, flat platform + display -->
  <!-- base body -->
  <rect x="40" y="115" width="210" height="80" rx="14" fill="#d01424" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- platform top -->
  <ellipse cx="145" cy="115" rx="105" ry="20" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <!-- platform inner -->
  <ellipse cx="145" cy="115" rx="92" ry="14" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <!-- LCD display panel -->
  <rect x="100" y="155" width="90" height="30" rx="5" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- LCD digits as 7-segment shapes -->
