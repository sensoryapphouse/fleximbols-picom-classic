  <!-- Extension ladder: tall, leaning, two sections with overlap, rope/pulley -->
  <!-- Leaning against wall (right side), angled ~15deg from vertical -->
  <!-- Bottom section - left rail -->
  <line x1="72" y1="225" x2="108" y2="15" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <line x1="72" y1="225" x2="108" y2="15" stroke="#9d7246" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottom section - right rail -->
  <line x1="112" y1="225" x2="148" y2="15" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <line x1="112" y1="225" x2="148" y2="15" stroke="#9d7246" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottom section rungs (6 rungs) -->
  <line x1="74" y1="210" x2="114" y2="210" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="77" y1="185" x2="117" y2="185" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="160" x2="120" y2="160" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="83" y1="135" x2="123" y2="135" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="86" y1="110" x2="126" y2="110" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="89" y1="85" x2="129" y2="85" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Upper/fly section (overlapping, offset inward) -->
  <!-- Upper section - left rail (slightly inside) -->
  <line x1="84" y1="100" x2="115" y2="18" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="84" y1="100" x2="115" y2="18" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Upper section - right rail -->
  <line x1="120" y1="100" x2="151" y2="18" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="100" x2="151" y2="18" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Upper section rungs (4 rungs) -->
  <line x1="86" y1="85" x2="122" y2="85" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="89" y1="62" x2="125" y2="62" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="92" y1="40" x2="128" y2="40" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="94" y1="22" x2="130" y2="22" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Rope/pulley: rope hangs from top, loops down -->
  <path d="M 145 20 Q 168 60 162 110 Q 158 140 148 160" stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="5,3"/>
  <!-- Pulley wheel at top -->
  <circle cx="148" cy="20" r="6" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
