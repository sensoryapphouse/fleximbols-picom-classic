  <!-- Lead-acid battery: vent caps in a row on top, terminals, classic vented case -->
  <!-- Battery body -->
  <rect x="45" y="85" width="200" height="125" rx="8" ry="8" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Top surface -->
  <rect x="45" y="78" width="200" height="14" rx="0" ry="0" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Terminals -->
  <rect x="85" y="55" width="28" height="28" rx="4" ry="4" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="177" y="55" width="28" height="28" rx="4" ry="4" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- + on positive terminal -->
  <line x1="191" y1="61" x2="191" y2="75" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="184" y1="68" x2="198" y2="68" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- - on negative terminal -->
  <line x1="92" y1="68" x2="106" y2="68" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Vent caps: 6 round caps in a row across the top — KEY differentiator -->
  <circle cx="72" cy="78" r="9" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <circle cx="102" cy="78" r="9" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <circle cx="132" cy="78" r="9" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <circle cx="162" cy="78" r="9" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <circle cx="192" cy="78" r="9" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <circle cx="218" cy="78" r="9" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Cell dividers inside body -->
  <line x1="97" y1="95" x2="97" y2="200" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="95" x2="145" y2="200" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <line x1="193" y1="95" x2="193" y2="200" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <!-- Electrolyte level indicator lines -->
  <line x1="60" y1="130" x2="235" y2="130" stroke="#2a4ec0" stroke-width="2" stroke-linecap="round"/>
