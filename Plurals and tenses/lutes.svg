<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Lute: rounded pear/teardrop body, decorative rosette soundhole, bent-back pegbox, many strings -->
  <!-- Pear-shaped body -->
  <ellipse cx="145" cy="158" rx="70" ry="72" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <!-- Body shading lines for roundness -->
  <ellipse cx="145" cy="158" rx="55" ry="57" fill="#7d5e23" stroke="#000000" stroke-width="0"/>
  <!-- Re-outline body on top -->
  <ellipse cx="145" cy="158" rx="70" ry="72" fill="none" stroke="#000000" stroke-width="5"/>
  <!-- Decorative rosette soundhole -->
  <circle cx="145" cy="148" r="20" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <circle cx="145" cy="148" r="14" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <circle cx="145" cy="148" r="8" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <!-- Rosette petal decorations -->
  <line x1="145" y1="128" x2="145" y2="122" stroke="#000000" stroke-width="2"/>
  <line x1="145" y1="168" x2="145" y2="174" stroke="#000000" stroke-width="2"/>
  <line x1="125" y1="148" x2="119" y2="148" stroke="#000000" stroke-width="2"/>
  <line x1="165" y1="148" x2="171" y2="148" stroke="#000000" stroke-width="2"/>
  <!-- Neck — straight part -->
  <rect x="134" y="50" width="22" height="48" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="5"/>
  <!-- Neck joins body at top -->
  <!-- Frets (many) -->
  <line x1="134" y1="60" x2="156" y2="60" stroke="#000000" stroke-width="2"/>
  <line x1="134" y1="68" x2="156" y2="68" stroke="#000000" stroke-width="2"/>
  <line x1="134" y1="76" x2="156" y2="76" stroke="#000000" stroke-width="2"/>
  <line x1="134" y1="84" x2="156" y2="84" stroke="#000000" stroke-width="2"/>
  <line x1="134" y1="92" x2="156" y2="92" stroke="#000000" stroke-width="2"/>
  <!-- Bent-back pegbox: angled sharply backward (to the right from neck top) -->
  <!-- Pegbox at angle ~45 degrees back -->
  <polygon points="134,50 156,50 165,20 143,20" fill="#5e1f0a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Tuning pegs on bent pegbox (many strings = many pegs, shown as circles on sides) -->
  <circle cx="152" cy="25" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="158" cy="32" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="163" cy="39" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="143" cy="22" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="148" cy="16" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="155" cy="14" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <!-- Strings (6) from pegbox down to bridge on body -->
  <line x1="136" y1="50" x2="133" y2="218" stroke="#000000" stroke-width="2"/>
  <line x1="139" y1="50" x2="137" y2="218" stroke="#000000" stroke-width="2"/>
  <line x1="142" y1="50" x2="141" y2="218" stroke="#000000" stroke-width="2"/>
  <line x1="145" y1="50" x2="145" y2="218" stroke="#000000" stroke-width="2"/>
  <line x1="148" y1="50" x2="149" y2="218" stroke="#000000" stroke-width="2"/>
  <line x1="151" y1="50" x2="153" y2="218" stroke="#000000" stroke-width="2"/>
  <!-- Bridge -->
  <rect x="132" y="215" width="26" height="6" rx="2" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
<g transform="translate(0,0) scale(0.5664,0.4688) translate(360 8) scale(0.2812)"><defs><radialGradient id="pcxpl1640" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pcxpl1640)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
