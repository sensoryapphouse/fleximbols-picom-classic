  <!-- BRUSH HOLDER (cylindrical cup at bottom) -->
  <rect x="68" y="172" width="154" height="50" rx="10" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Cup rim ellipse -->
  <ellipse cx="145" cy="172" rx="77" ry="12" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <!-- Cup base ellipse -->
  <ellipse cx="145" cy="222" rx="77" ry="10" fill="#392170" stroke="#000000" stroke-width="4"/>

  <!-- BRUSH 1: Large fluffy round powder brush (left) -->
  <!-- Handle -->
  <rect x="82" y="76" width="12" height="100" rx="6" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Ferrule -->
  <rect x="80" y="100" width="16" height="10" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- Fluffy round head -->
  <ellipse cx="88" cy="68" rx="20" ry="26" fill="#f266aa" stroke="#000000" stroke-width="5"/>

  <!-- BRUSH 2: Flat foundation brush -->
  <!-- Handle -->
  <rect x="113" y="80" width="10" height="96" rx="5" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Ferrule -->
  <rect x="111" y="102" width="14" height="9" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- Flat wide head -->
  <rect x="104" y="56" width="30" height="48" rx="6" fill="#f4a4b2" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- BRUSH 3: Fan brush (centre) -->
  <!-- Handle -->
  <rect x="141" y="82" width="10" height="94" rx="5" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Ferrule -->
  <rect x="139" y="104" width="14" height="8" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- Fan bristle shape -->
  <path d="M146 112 Q118 95 110 70 Q115 60 120 68 Q130 85 146 96 Q162 85 170 68 Q175 60 180 70 Q172 95 146 112Z" fill="#7c3fac" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- BRUSH 4: Angled contour brush -->
  <!-- Handle -->
  <rect x="170" y="78" width="10" height="98" rx="5" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Ferrule -->
  <rect x="168" y="100" width="14" height="9" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- Angled head -->
  <polygon points="162,56 186,56 190,108 160,108" fill="#f4a4b2" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Angle cut -->
  <polygon points="162,56 186,56 174,40" fill="#f266aa" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- BRUSH 5: Thin tapered pencil/lip brush (right) -->
  <!-- Handle -->
  <rect x="200" y="80" width="9" height="96" rx="4" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Ferrule -->
  <rect x="198" y="102" width="13" height="8" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- Tapered pointed head -->
  <ellipse cx="204" cy="88" rx="7" ry="14" fill="#392170" stroke="#000000" stroke-width="4"/>
  <polygon points="197,88 211,88 204,58" fill="#392170" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
