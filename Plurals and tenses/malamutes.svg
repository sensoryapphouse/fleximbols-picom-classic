<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><g transform="translate(0.000,30.288) scale(0.8738)"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Malamute: larger/heavier than husky, grey/white, broader head, woolier coat, big plumed tail -->
  <!-- Back legs - thicker/heavier -->
  <rect x="178" y="162" width="22" height="50" rx="8" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <rect x="204" y="162" width="22" height="50" rx="8" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- Front legs - thicker/heavier -->
  <rect x="82" y="162" width="22" height="50" rx="8" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <rect x="108" y="162" width="22" height="50" rx="8" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- Main body: larger and bulkier -->
  <ellipse cx="150" cy="148" rx="90" ry="42" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- Grey/dark saddle (woolier, more diffuse) -->
  <ellipse cx="155" cy="128" rx="68" ry="26" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- White belly and sides -->
  <ellipse cx="148" cy="170" rx="62" ry="18" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Woolly coat texture sides -->
  <ellipse cx="90" cy="140" rx="20" ry="14" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <ellipse cx="210" cy="140" rx="20" ry="14" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- Neck - thick/heavy -->
  <rect x="68" y="112" width="42" height="50" rx="14" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- White chest -->
  <ellipse cx="76" cy="140" rx="18" ry="22" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Head: broad, heavier than husky -->
  <ellipse cx="68" cy="96" rx="40" ry="34" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- Dark cap on head -->
  <ellipse cx="68" cy="82" rx="34" ry="20" fill="#7f7f7f" stroke="none"/>
  <!-- White blaze/face markings -->
  <ellipse cx="56" cy="100" rx="20" ry="16" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Muzzle - broad -->
  <ellipse cx="36" cy="106" rx="16" ry="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Nose - big -->
  <ellipse cx="22" cy="104" rx="7" ry="6" fill="#000000"/>
  <!-- Eyes (brown, not blue like husky) -->
  <circle cx="56" cy="90" r="9" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="56" cy="90" r="6" fill="#9d7246" stroke="#000000" stroke-width="1"/>
  <circle cx="56" cy="90" r="3" fill="#000000"/>
  <circle cx="58" cy="88" r="2" fill="#ffffff"/>
  <!-- Erect triangular ears - broader based -->
  <polygon points="48,70 38,34 72,66" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="88,68 100,32 68,64" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="50,68 44,46 69,65" fill="#f4a4b2" stroke="none"/>
  <polygon points="86,66 96,44 70,63" fill="#f4a4b2" stroke="none"/>
  <!-- Big plumed tail - larger/more plumed than husky -->
  <path d="M232,142 C252,120 268,96 260,72 C252,52 230,58 226,76" fill="none" stroke="#b8b8b8" stroke-width="24" stroke-linecap="round"/>
  <path d="M232,142 C252,120 268,96 260,72 C252,52 230,58 226,76" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- White plume tip -->
  <ellipse cx="226" cy="74" rx="16" ry="14" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Fluffy tail accent -->
  <path d="M238,130 C256,114 262,98 255,80" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Paws -->
  <ellipse cx="93" cy="212" rx="13" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="119" cy="212" rx="13" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="189" cy="212" rx="13" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="215" cy="212" rx="13" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
</g><g transform="translate(0,0) scale(0.5664,0.4688) translate(360 8) scale(0.2812)"><defs><radialGradient id="pcxpl1664" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pcxpl1664)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
