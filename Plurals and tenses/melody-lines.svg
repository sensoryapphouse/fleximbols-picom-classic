  <!-- Music staff with single curving melodic line of notes flowing across -->

  <!-- Staff page -->
  <rect x="20" y="50" width="250" height="140" rx="6" fill="#f5e7c4" stroke="#000000" stroke-width="4"/>

  <!-- Five staff lines -->
  <line x1="32" y1="80" x2="258" y2="80" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="100" x2="258" y2="100" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="120" x2="258" y2="120" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="140" x2="258" y2="140" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="160" x2="258" y2="160" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Treble clef shape (simplified curl) -->
  <path d="M42 64 Q56 64 56 84 Q56 116 46 132 Q40 148 56 162 Q72 162 72 142 Q72 116 56 100" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="56" cy="152" r="4" fill="#000000"/>

  <!-- Flowing melodic curve line connecting notes -->
  <path d="M90 130 Q110 100 130 110 Q150 130 170 100 Q190 80 210 110 Q230 130 250 90" fill="none" stroke="#7c3fac" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Notes along curve, single line of single notes -->
  <ellipse cx="90" cy="130" rx="7" ry="5.5" fill="#000000" stroke="#000000" stroke-width="2" transform="rotate(-20 90 130)"/>
  <line x1="96" y1="128" x2="96" y2="100" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <ellipse cx="120" cy="118" rx="7" ry="5.5" fill="#000000" stroke="#000000" stroke-width="2" transform="rotate(-20 120 118)"/>
  <line x1="126" y1="116" x2="126" y2="88" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <ellipse cx="150" cy="118" rx="7" ry="5.5" fill="#000000" stroke="#000000" stroke-width="2" transform="rotate(-20 150 118)"/>
  <line x1="156" y1="116" x2="156" y2="88" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <ellipse cx="180" cy="92" rx="7" ry="5.5" fill="#000000" stroke="#000000" stroke-width="2" transform="rotate(-20 180 92)"/>
  <line x1="186" y1="90" x2="186" y2="62" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <ellipse cx="210" cy="110" rx="7" ry="5.5" fill="#000000" stroke="#000000" stroke-width="2" transform="rotate(-20 210 110)"/>
  <line x1="216" y1="108" x2="216" y2="80" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <ellipse cx="240" cy="98" rx="7" ry="5.5" fill="#000000" stroke="#000000" stroke-width="2" transform="rotate(-20 240 98)"/>
  <line x1="246" y1="96" x2="246" y2="68" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Bar lines -->
  <line x1="252" y1="80" x2="252" y2="160" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Decorative musical note above (large single melody note indicator) -->
  <ellipse cx="148" cy="32" rx="9" ry="7" fill="#7c3fac" stroke="#000000" stroke-width="3" transform="rotate(-20 148 32)"/>
  <line x1="156" y1="28" x2="156" y2="8" stroke="#7c3fac" stroke-width="4" stroke-linecap="round"/>
