  <!-- meteor: fiery streaking rock with bright tail blazing diagonally -->
  <!-- Space panel -->
  <rect x="26" y="26" width="238" height="188" rx="6" fill="#1d0e82" stroke="#000000" stroke-width="5"/>
  <!-- Stars -->
  <circle cx="45" cy="45" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="90" cy="38" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="220" cy="48" r="3" fill="#ffffff" stroke="none"/>
  <circle cx="255" cy="72" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="240" cy="175" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="45" cy="180" r="2" fill="#ffffff" stroke="none"/>
  <!-- Meteor trail/tail - wide outer glow orange -->
  <polygon points="45,195 80,170 240,50 220,38 55,160 35,185" fill="#e65a00" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Meteor tail inner flame - yellow -->
  <polygon points="58,192 88,168 220,58 206,48 72,162 48,186" fill="#f2e40d" stroke="none"/>
  <!-- Tail bright white hot centre -->
  <polygon points="70,188 96,168 205,65 196,56 82,162 62,183" fill="#ffffff" stroke="none"/>
  <!-- Flame wisps off trail -->
  <polyline points="120,125 110,112 125,100" fill="none" stroke="#ff9900" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="155,100 142,90 155,78" fill="none" stroke="#ff9900" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="88,152 76,140 90,128" fill="none" stroke="#f7de58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rock body of meteor at front (upper-right) -->
  <polygon points="215,42 240,38 255,48 252,68 238,78 218,72 208,58" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Rock surface detail -->
  <polyline points="220,55 232,50 248,55" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="218,65 228,60 240,68" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glowing leading edge -->
  <ellipse cx="248" cy="52" rx="10" ry="8" fill="#f8130d" stroke="#000000" stroke-width="3"/>
