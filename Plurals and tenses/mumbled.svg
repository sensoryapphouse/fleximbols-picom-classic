  <path d="M 126 83 Q 134 80 142 83" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Mouth: nearly closed, thin line with slight press -->
  <path d="M 106 113 Q 112 111 120 112 Q 128 111 134 113" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="108" y="141" width="24" height="22" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <path d="M 55 235 L 70 163 Q 120 153 170 163 L 185 235 Z" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shoulders -->
  <path d="M 55 180 Q 70 165 120 162 Q 170 165 185 180" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Muffled scribbled speech bubble (right side) -->
  <!-- Bubble outline irregular/scribbled -->
  <path d="M 175 45 Q 178 25 210 22 Q 255 18 262 45 Q 268 68 248 78 Q 242 85 235 88 L 225 100 L 218 86 Q 175 86 172 62 Q 170 50 175 45 Z" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Muffled scribble lines inside bubble (unclear speech) -->
  <path d="M 190 42 Q 196 36 202 42 Q 208 48 214 42 Q 220 36 226 42 Q 232 48 238 42 Q 244 36 250 42" fill="none" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <path d="M 188 56 Q 196 50 204 56 Q 212 62 220 56 Q 228 50 236 56 Q 244 62 252 56" fill="none" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <path d="M 193 70 Q 200 64 208 70 Q 216 76 224 70 Q 232 64 240 70" fill="none" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <!-- Tail of bubble pointing to mouth -->
  <path d="M 195 88 L 178 108 L 190 88" fill="#efefef" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
