  <!-- handheld rotary nail grinder for pets -->
  <!-- main body (handle) -->
  <rect x="60" y="95" width="130" height="50" rx="12" ry="12" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <!-- grip pad on handle -->
  <rect x="78" y="108" width="60" height="24" rx="6" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="2.5"/>
  <!-- power button -->
  <circle cx="160" cy="120" r="7" fill="#f8130d" stroke="#000000" stroke-width="2.5"/>
  <!-- collar between handle and tip -->
  <rect x="188" y="100" width="14" height="40" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <!-- cylindrical grinding tip (shaft) -->
  <rect x="202" y="112" width="22" height="16" fill="#b8b8b8" stroke="#000000" stroke-width="2.5"/>
  <!-- grinding drum (cylinder) -->
  <rect x="224" y="104" width="34" height="32" rx="3" ry="3" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- grit texture lines on drum -->
  <line x1="230" y1="110" x2="252" y2="110" stroke="#000000" stroke-width="2"/>
  <line x1="230" y1="116" x2="252" y2="116" stroke="#000000" stroke-width="2"/>
  <line x1="230" y1="122" x2="252" y2="122" stroke="#000000" stroke-width="2"/>
  <line x1="230" y1="128" x2="252" y2="128" stroke="#000000" stroke-width="2"/>
  <!-- end cap of drum -->
  <ellipse cx="258" cy="120" rx="4" ry="16" fill="#7d5e23" stroke="#000000" stroke-width="2.5"/>
  <!-- cable from rear -->
  <path d="M 60 120 Q 40 130 35 155 Q 32 175 50 190" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- motion dust flecks near drum -->
  <circle cx="240" cy="92" r="2.5" fill="#efefef" stroke="#000000" stroke-width="1.5"/>
  <circle cx="252" cy="86" r="2" fill="#efefef" stroke="#000000" stroke-width="1.5"/>
  <circle cx="246" cy="150" r="2" fill="#efefef" stroke="#000000" stroke-width="1.5"/>
