<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><g transform="translate(0.000,49.680) scale(0.793)"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Operating room: OR table + overhead surgical lamp + monitor -->
  <!-- Floor line -->
  <line x1="22" y1="205" x2="268" y2="205" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Back wall suggestion -->
  <rect x="22" y="30" width="246" height="175" rx="0" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Overhead surgical lamp arm from ceiling -->
  <rect x="130" y="30" width="12" height="40" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- Lamp arm horizontal -->
  <rect x="100" y="66" width="72" height="10" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- Lamp housing (circular) -->
  <circle cx="136" cy="90" r="26" fill="#efefef" stroke="#000000" stroke-width="5"/>
  <!-- Lamp lens / light face -->
  <circle cx="136" cy="90" r="18" fill="#f7de58" stroke="#000000" stroke-width="4"/>
  <!-- Lamp inner reflector -->
  <circle cx="136" cy="90" r="10" fill="#fff200" stroke="#000000" stroke-width="3"/>
  <!-- Lamp handle grips -->
  <rect x="128" y="112" width="16" height="8" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>

  <!-- Monitor on stand (right side) -->
  <rect x="220" y="80" width="40" height="30" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <rect x="224" y="84" width="32" height="22" rx="2" fill="#1d0e82" stroke="#000000" stroke-width="4"/>
  <!-- Monitor screen lines (vital signs suggestion) -->
  <polyline points="226,97 232,90 238,100 244,88 250,97 254,97" fill="none" stroke="#529929" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Monitor stand pole -->
  <rect x="236" y="110" width="8" height="40" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Monitor base -->
  <rect x="224" y="148" width="32" height="8" rx="3" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>

  <!-- Operating table top -->
  <rect x="45" y="148" width="170" height="22" rx="6" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Table pad / mattress -->
  <rect x="50" y="143" width="160" height="10" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <!-- Table pedestal column -->
  <rect x="110" y="170" width="40" height="20" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- Table base -->
  <rect x="80" y="188" width="100" height="12" rx="5" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>
  <!-- Table wheels -->
  <circle cx="100" cy="203" r="7" fill="#000000" stroke="#000000" stroke-width="4"/>
  <circle cx="160" cy="203" r="7" fill="#000000" stroke="#000000" stroke-width="4"/>

  <!-- IV pole on left -->
  <rect x="30" y="80" width="6" height="110" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <!-- IV bag -->
  <path d="M 24 80 Q 33 68 42 80 L 39 96 Q 33 100 27 96 Z" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- IV tube -->
  <line x1="33" y1="96" x2="33" y2="110" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</g><g transform="translate(0,0) scale(0.5664,0.4688) translate(360 8) scale(0.2812)"><defs><radialGradient id="pcxpl1965" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pcxpl1965)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
