  <!-- Oscilloscope: benchtop with screen showing sine waveform + knobs -->
  <!-- Main body -->
  <rect x="25" y="45" width="240" height="170" rx="10" ry="10" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Screen bezel -->
  <rect x="35" y="55" width="160" height="120" rx="8" ry="8" fill="#000000" stroke="#000000" stroke-width="5"/>
  <!-- Screen face -->
  <rect x="40" y="60" width="150" height="110" rx="5" ry="5" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <!-- Screen grid lines (graticule) -->
  <line x1="40" y1="88" x2="190" y2="88" stroke="#2a4ec0" stroke-width="1"/>
  <line x1="40" y1="115" x2="190" y2="115" stroke="#2a4ec0" stroke-width="1"/>
  <line x1="40" y1="143" x2="190" y2="143" stroke="#2a4ec0" stroke-width="1"/>
  <line x1="70" y1="60" x2="70" y2="170" stroke="#2a4ec0" stroke-width="1"/>
  <line x1="100" y1="60" x2="100" y2="170" stroke="#2a4ec0" stroke-width="1"/>
  <line x1="130" y1="60" x2="130" y2="170" stroke="#2a4ec0" stroke-width="1"/>
  <line x1="160" y1="60" x2="160" y2="170" stroke="#2a4ec0" stroke-width="1"/>
  <!-- Sine waveform on screen (channel 1 - yellow) -->
  <path d="M42,115 C52,115 58,75 70,75 C82,75 88,155 100,155 C112,155 118,75 130,75 C142,75 148,155 160,155 C172,155 178,95 188,115" fill="none" stroke="#f7de58" stroke-width="3" stroke-linecap="round"/>
  <!-- Channel 2 sine slightly offset (blue) -->
  <path d="M42,125 C52,125 58,90 70,90 C82,90 88,160 100,160 C112,160 118,90 130,90 C142,90 148,160 160,160 C170,160 178,130 188,125" fill="none" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <!-- Knob panel (right side) -->
  <!-- Large vertical scale knob -->
  <circle cx="220" cy="85" r="14" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <line x1="220" y1="74" x2="220" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Time/div knob -->
  <circle cx="220" cy="120" r="14" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <line x1="220" y1="109" x2="220" y2="115" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Trigger knob -->
  <circle cx="220" cy="155" r="10" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <line x1="220" y1="148" x2="220" y2="152" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- CH1/CH2 input BNCs -->
  <circle cx="65" cy="192" r="9" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <circle cx="65" cy="192" r="4" fill="#000000"/>
  <circle cx="100" cy="192" r="9" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <circle cx="100" cy="192" r="4" fill="#000000"/>
  <!-- Power button -->
  <circle cx="165" cy="192" r="10" fill="#529929" stroke="#000000" stroke-width="4"/>
  <!-- Power indicator LED -->
  <circle cx="180" cy="192" r="5" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- Feet -->
  <rect x="35" y="208" width="30" height="7" rx="3" fill="#000000" stroke="#000000" stroke-width="3"/>
  <rect x="225" y="208" width="30" height="7" rx="3" fill="#000000" stroke="#000000" stroke-width="3"/>
