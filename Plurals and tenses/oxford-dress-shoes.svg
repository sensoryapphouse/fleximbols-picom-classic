  <!-- Oxford dress shoe: formal, CLOSED lacing (defining), polished, plain toe -->
  <!-- Main shoe body -->
  <path d="M 32 178 Q 26 164 36 150 Q 52 136 92 128 Q 132 120 170 122 Q 205 124 226 136 L 244 152 Q 250 164 244 174 L 52 180 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Plain rounded toe cap -->
  <path d="M 32 178 Q 18 174 14 166 Q 10 156 18 149 Q 32 142 55 147 L 52 180 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Toe cap seam -->
  <path d="M 22 153 Q 38 146 58 150" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Thin dress sole -->
  <path d="M 12 166 L 244 174 L 246 182 L 14 184 Z" fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Sole welt -->
  <rect x="10" y="181" width="238" height="8" rx="3" ry="3" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- CLOSED lacing panel (quarterback stitched closed at top) -->
  <path d="M 105 128 L 102 158 Q 102 164 110 165 L 158 165 Q 166 164 166 158 L 163 128" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Closed seam at top (the defining feature of oxford) -->
  <line x1="105" y1="128" x2="163" y2="128" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Lace rows -->
  <line x1="106" y1="136" x2="162" y2="136" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="146" x2="163" y2="146" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="104" y1="156" x2="164" y2="156" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyelets -->
  <circle cx="109" cy="136" r="3" fill="#000000"/>
  <circle cx="159" cy="136" r="3" fill="#000000"/>
  <circle cx="108" cy="146" r="3" fill="#000000"/>
  <circle cx="160" cy="146" r="3" fill="#000000"/>
  <circle cx="107" cy="156" r="3" fill="#000000"/>
  <circle cx="161" cy="156" r="3" fill="#000000"/>
  <!-- Lace bow at top -->
  <path d="M 125 124 Q 134 116 134 128 Q 134 116 143 124" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Heel counter -->
  <path d="M 224 136 Q 248 148 246 164 L 244 174 Q 230 168 222 155 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Polish shine -->
  <path d="M 40 158 Q 55 154 75 154" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
