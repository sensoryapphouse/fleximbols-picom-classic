  <!-- rectangular fabric cube (slight 3D feel via top edge) -->
  <!-- main front face -->
  <rect x="40" y="60" width="210" height="150" rx="10" fill="#3aa6a0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
