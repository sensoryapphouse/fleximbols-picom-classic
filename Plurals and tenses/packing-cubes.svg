    <line x1="165" y1="78" x2="165" y2="143"/>
    <line x1="180" y1="78" x2="180" y2="143"/>
    <line x1="195" y1="78" x2="195" y2="143"/>
    <line x1="210" y1="78" x2="210" y2="143"/>
    <line x1="60" y1="92" x2="230" y2="92"/>
    <line x1="60" y1="106" x2="230" y2="106"/>
    <line x1="60" y1="120" x2="230" y2="120"/>
    <line x1="60" y1="134" x2="230" y2="134"/>
  </g>
  <!-- folded clothes visible through mesh window -->
  <rect x="65" y="98" width="160" height="10" rx="2" fill="#f8130d" stroke="#000000" stroke-width="1.8"/>
  <rect x="65" y="112" width="160" height="10" rx="2" fill="#f7de58" stroke="#000000" stroke-width="1.8"/>
  <rect x="65" y="126" width="160" height="10" rx="2" fill="#7c3fac" stroke="#000000" stroke-width="1.8"/>
