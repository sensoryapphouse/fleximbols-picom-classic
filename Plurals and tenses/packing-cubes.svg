  <path d="M 250 60 L 265 48 L 265 198 L 250 210" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- mesh-top window on front face -->
  <rect x="60" y="78" width="170" height="65" rx="6" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
