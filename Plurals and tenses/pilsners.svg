  <!-- Pilsner: tall slender flared glass, pale gold beer, white head -->
  <!-- Glass body (trapezoid, narrow at bottom, wider at top) -->
  <polygon points="100,210 190,210 175,55 115,55" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Beer head (white foam at top) -->
  <ellipse cx="145" cy="55" rx="30" ry="10" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <rect x="115" y="45" width="60" height="18" rx="5" fill="#ffffff" stroke="none"/>
  <ellipse cx="145" cy="45" rx="30" ry="10" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <!-- Foam bumps on top -->
  <circle cx="125" cy="43" r="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="145" cy="40" r="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="165" cy="43" r="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Glass outline over liquid - left and right sides and bottom -->
  <polygon points="100,210 190,210 175,55 115,55" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Bubble 1 -->
  <circle cx="138" cy="150" r="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Bubble 2 -->
  <circle cx="155" cy="120" r="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Bubble 3 -->
  <circle cx="143" cy="90" r="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Base bottom line -->
  <line x1="95" y1="210" x2="195" y2="210" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
