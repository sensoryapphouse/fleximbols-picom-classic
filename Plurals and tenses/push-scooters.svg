  <!-- Push scooter: handlebar + deck + 2 wheels + rear kickplate brake -->
  <!-- Rear wheel -->
  <circle cx="65" cy="195" r="22" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <circle cx="65" cy="195" r="10" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <circle cx="65" cy="195" r="3" fill="#000000"/>
  <!-- Front wheel -->
  <circle cx="225" cy="195" r="22" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <circle cx="225" cy="195" r="10" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <circle cx="225" cy="195" r="3" fill="#000000"/>
  <!-- Deck (flat platform) -->
  <path d="M 70 175 L 220 175 L 220 185 L 70 185 Z" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Rear kickplate brake (curved over rear wheel) -->
  <path d="M 50 175 Q 50 170 55 170 L 80 170 Q 85 170 85 175 L 85 178 Q 65 178 50 178 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Front stem (vertical) -->
  <path d="M 225 175 L 225 60" stroke="#7f7f7f" stroke-width="9" stroke-linecap="round"/>
  <path d="M 225 175 L 225 60" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Handlebar (T-shape) -->
  <path d="M 195 60 L 255 60" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Handlebar grips -->
  <rect x="190" y="55" width="14" height="12" rx="3" fill="#d01424" stroke="#000000" stroke-width="2"/>
  <rect x="246" y="55" width="14" height="12" rx="3" fill="#d01424" stroke="#000000" stroke-width="2"/>
  <!-- Front fork -->
  <path d="M 225 175 L 225 195" stroke="#000000" stroke-width="3"/>
