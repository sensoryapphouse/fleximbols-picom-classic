  <!-- Rabies tag: round tag with medical caduceus/cross emblem + split ring -->
  <!-- Split ring -->
  <path d="M135 50 C135 37 155 37 155 50 C155 55 150 58 145 58 C140 58 135 55 135 50" fill="none" stroke="#b8b8b8" stroke-width="5" stroke-linecap="round"/>
  <path d="M140 53 C140 45 150 45 150 53" fill="none" stroke="#b8b8b8" stroke-width="5" stroke-linecap="round"/>
  <!-- Connector -->
  <line x1="145" y1="58" x2="145" y2="75" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Round tag body -->
  <circle cx="145" cy="155" r="75" fill="#dff3fd" stroke="#000000" stroke-width="4"/>
  <!-- Tag hole -->
  <circle cx="145" cy="80" r="7" fill="none" stroke="#000000" stroke-width="4"/>
  <!-- Medical cross emblem (bold red cross) -->
  <rect x="128" y="120" width="34" height="70" rx="5" fill="#f8130d"/>
  <rect x="110" y="138" width="70" height="34" rx="5" fill="#f8130d"/>
  <!-- Caduceus staff vertical (over cross) -->
  <line x1="145" y1="118" x2="145" y2="192" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
