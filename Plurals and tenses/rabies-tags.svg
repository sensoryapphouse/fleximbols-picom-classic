  <!-- Wings at top of staff -->
  <path d="M145 120 C133 112 122 118 128 124" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M145 120 C157 112 168 118 162 124" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
