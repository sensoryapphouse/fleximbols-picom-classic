  <!-- Retractable leash: plastic housing + retracting cable + thumb button -->
  <!-- Housing body (rounded rectangle grip) -->
  <rect x="80" y="90" width="110" height="75" rx="22" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Housing spool detail circle -->
  <circle cx="135" cy="128" r="24" fill="none" stroke="#4d4d4d" stroke-width="4" stroke-linecap="round"/>
  <circle cx="135" cy="128" r="8" fill="#4d4d4d"/>
  <!-- Thumb button on top -->
  <rect x="118" y="82" width="34" height="14" rx="6" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Retracting cable extending right -->
  <path d="M190 128 Q220 120 250 100" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4"/>
  <!-- Cable end -->
  <circle cx="250" cy="100" r="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Handle grip lines -->
  <line x1="108" y1="118" x2="108" y2="138" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
