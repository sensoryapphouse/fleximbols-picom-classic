  <path d="M 98 88 Q 98 78 102 74" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Right hand on cheek -->
  <ellipse cx="202" cy="108" rx="16" ry="22" fill="#e6b98a" stroke="#000000" stroke-width="4" transform="rotate(-10,202,108)"/>
  <path d="M 210 90 Q 216 82 212 76" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 204 88 Q 208 78 204 72" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
