  <!-- screech: face with sharp narrow piercing zigzag sound spikes, gritted (high-pitched harsh) -->
  <!-- Head (centered-left) -->
  <circle cx="110" cy="100" r="48" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair -->
  <path d="M 64 86 Q 66 46 110 44 Q 154 46 156 86 Q 144 60 110 60 Q 76 60 64 86 Z" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Eyes squinted / intense / gritted expression -->
  <ellipse cx="96" cy="92" rx="9" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="96" cy="93" rx="6" ry="5" fill="#000000"/>
  <ellipse cx="124" cy="92" rx="9" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="124" cy="93" rx="6" ry="5" fill="#000000"/>
  <!-- Squinting eyelids (harsh/pained expression) -->
  <path d="M 87 88 Q 96 84 105 88" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <path d="M 115 88 Q 124 84 133 88" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Furrowed brows (tension/harshness) -->
  <path d="M 86 80 Q 96 75 106 79" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 114 79 Q 124 75 134 80" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Brow furrow V lines -->
  <line x1="106" y1="79" x2="110" y2="85" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="114" y1="79" x2="110" y2="85" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Mouth: clenched/gritted — narrow horizontal with teeth visible -->
  <rect x="90" y="117" width="40" height="14" rx="4" fill="#d01424" stroke="#000000" stroke-width="4"/>
  <!-- Gritted teeth (vertical lines across teeth) -->
  <rect x="92" y="119" width="36" height="10" rx="2" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <line x1="100" y1="119" x2="100" y2="129" stroke="#000000" stroke-width="2"/>
  <line x1="108" y1="119" x2="108" y2="129" stroke="#000000" stroke-width="2"/>
  <line x1="116" y1="119" x2="116" y2="129" stroke="#000000" stroke-width="2"/>
  <line x1="124" y1="119" x2="124" y2="129" stroke="#000000" stroke-width="2"/>
  <!-- Neck -->
  <rect x="98" y="146" width="24" height="20" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <path d="M 45 235 L 62 166 Q 110 155 158 166 L 175 235 Z" fill="#e65a00" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Sharp thin ZIGZAG piercing sound spikes radiating right (HIGH-PITCHED - thin and sharp) -->
  <!-- Spike cluster 1 (near) -->
  <polyline points="162,82 172,76 178,88 188,78 194,90 204,80 210,92" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Spike cluster 2 (medium distance, slightly above) -->
  <polyline points="165,65 178,55 185,68 198,55 205,68 218,55 225,68" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Spike cluster 3 (far, top — thinner/longest) -->
  <polyline points="168,48 185,34 193,50 210,32 218,50 235,34 243,50" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sharp spike tips (filled triangles to emphasize piercing quality) -->
  <polygon points="178,76 172,76 175,68" fill="#000000"/>
  <polygon points="188,78 194,90 198,76" fill="#000000"/>
  <!-- Additional jagged radiating lines upper right -->
  <line x1="160" y1="100" x2="265" y2="108" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="162" y1="110" x2="268" y2="125" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
