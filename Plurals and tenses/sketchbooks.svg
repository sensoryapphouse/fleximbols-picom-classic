  <line x1="207" y1="80" x2="240" y2="110" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
  <line x1="175" y1="110" x2="240" y2="110" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
  <rect x="193" y="130" width="20" height="20" fill="none" stroke="#7f7f7f" stroke-width="2"/>
