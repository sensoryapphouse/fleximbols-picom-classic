  <!-- Song track: single waveform bar strip with a play head -->
  <!-- Track background strip -->
  <rect x="25" y="100" width="240" height="40" rx="6" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
