  <rect x="212" y="110" width="6" height="20" rx="2" fill="#b8b8b8" stroke="none"/>
  <rect x="222" y="105" width="6" height="30" rx="2" fill="#b8b8b8" stroke="none"/>
  <rect x="232" y="112" width="6" height="16" rx="2" fill="#b8b8b8" stroke="none"/>
  <!-- Playhead line -->
  <line x1="135" y1="88" x2="135" y2="152" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
