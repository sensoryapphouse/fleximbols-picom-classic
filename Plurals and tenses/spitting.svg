    <ellipse cx="102" cy="88" rx="10" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <circle cx="103" cy="89" r="5" fill="#000000"/>
    <!-- Right eye — squinted -->
    <ellipse cx="162" cy="88" rx="10" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <circle cx="163" cy="89" r="5" fill="#000000"/>
    <!-- Eyebrows furrowed / effort -->
