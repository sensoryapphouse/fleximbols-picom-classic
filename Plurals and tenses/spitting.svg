    <!-- Right ear -->
    <ellipse cx="214" cy="102" rx="13" ry="19" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Hair -->
    <path d="M62,70 Q72,22 130,18 Q188,22 198,70 Q184,38 130,36 Q76,38 62,70 Z" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
