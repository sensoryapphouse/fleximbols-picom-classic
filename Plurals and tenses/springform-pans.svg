  <!-- Round springform cake pan with side latch -->
  <!-- Body cylinder (side view, slightly 3D) -->
  <path d="M 45 75 L 45 180 Q 45 195 145 195 Q 245 195 245 180 L 245 75 Z" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top rim ellipse -->
  <ellipse cx="145" cy="75" rx="100" ry="20" fill="#efefef" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner cavity -->
  <ellipse cx="145" cy="75" rx="88" ry="14" fill="#7f7f7f" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Removable bottom seam line around middle -->
  <path d="M 45 165 Q 145 178 245 165" fill="none" stroke="#4d4d4d" stroke-width="2" stroke-linecap="round"/>
  <!-- Side latch / clip mechanism on the right -->
  <rect x="245" y="100" width="22" height="40" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Latch lever sticking out -->
  <path d="M 267 110 L 282 105 L 282 120 L 267 125 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Latch hinge pin -->
  <circle cx="256" cy="120" r="3" fill="#000000"/>
  <!-- Latch band running around pan (horizontal) -->
  <path d="M 45 115 L 245 115" fill="none" stroke="#4d4d4d" stroke-width="2" stroke-linecap="round"/>
  <path d="M 45 125 L 245 125" fill="none" stroke="#4d4d4d" stroke-width="2" stroke-linecap="round"/>
