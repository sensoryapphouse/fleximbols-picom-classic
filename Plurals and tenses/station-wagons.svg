  <!-- ground line -->
  <line x1="10" y1="200" x2="280" y2="200" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- long station wagon: extended rear cargo area, flat back, no separate trunk -->
  <path d="M 20 195 L 20 160 L 55 115 L 260 115 L 270 130 L 270 195 Z" fill="#137827" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- front windshield -->
  <path d="M 70 125 L 80 135 L 110 135 L 110 118 Z" fill="#dff3fd" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- front passenger window -->
  <rect x="115" y="118" width="40" height="20" fill="#dff3fd" stroke="#000000" stroke-width="2.5"/>
  <!-- rear passenger window -->
  <rect x="160" y="118" width="40" height="20" fill="#dff3fd" stroke="#000000" stroke-width="2.5"/>
  <!-- EXTENDED CARGO AREA WINDOW (long, defining feature) -->
  <rect x="205" y="118" width="55" height="20" fill="#dff3fd" stroke="#000000" stroke-width="2.5"/>
  <!-- door pillars -->
  <line x1="155" y1="118" x2="155" y2="195" stroke="#000000" stroke-width="2.5"/>
  <line x1="200" y1="118" x2="200" y2="195" stroke="#000000" stroke-width="2.5"/>
  <!-- roof rails (typical station wagon) -->
  <line x1="60" y1="113" x2="258" y2="113" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="113" x2="80" y2="108" stroke="#000000" stroke-width="2"/>
  <line x1="240" y1="113" x2="240" y2="108" stroke="#000000" stroke-width="2"/>
  <!-- door handles -->
  <rect x="125" y="155" width="14" height="4" fill="#4d4d4d" stroke="#000000" stroke-width="1.5"/>
  <rect x="170" y="155" width="14" height="4" fill="#4d4d4d" stroke="#000000" stroke-width="1.5"/>
  <!-- headlight -->
  <rect x="24" y="160" width="14" height="10" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <!-- tail light (flat back) -->
  <rect x="252" y="135" width="14" height="40" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <!-- wheels -->
  <circle cx="75" cy="200" r="20" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <circle cx="75" cy="200" r="8" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
