  <!-- FULL BODY stepsister (left, young female) -->
  <!-- head -->
  <circle cx="75" cy="52" r="22" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- ponytail / long hair -->
  <path d="M53,52 Q53,30 75,28 Q97,30 97,52 L100,95 L92,75 L92,52 Q92,40 75,38 Q58,40 58,52 L58,75 L50,95 Z" fill="#ff9900" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="68" cy="52" r="2.5" fill="#000000"/>
  <circle cx="82" cy="52" r="2.5" fill="#000000"/>
  <!-- smile -->
  <path d="M68,60 Q75,65 82,60" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dress -->
  <path d="M55,76 L95,76 L115,165 L35,165 Z" fill="#f266aa" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- arms -->
  <line x1="55" y1="86" x2="28" y2="125" stroke="#eed5b6" stroke-width="11" stroke-linecap="round"/>
  <line x1="55" y1="86" x2="28" y2="125" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="95" y1="86" x2="122" y2="125" stroke="#eed5b6" stroke-width="11" stroke-linecap="round"/>
  <line x1="95" y1="86" x2="122" y2="125" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- legs -->
  <rect x="55" y="165" width="14" height="42" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <rect x="81" y="165" width="14" height="42" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- shoes -->
  <ellipse cx="62" cy="212" rx="10" ry="5" fill="#7c3fac" stroke="#000000" stroke-width="4"/>
  <ellipse cx="88" cy="212" rx="10" ry="5" fill="#7c3fac" stroke="#000000" stroke-width="4"/>

  <!-- Family tree: step relation (no shared blood) -->
  <!-- biological parent of stepsister -->
  <circle cx="180" cy="40" r="11" fill="#f266aa" stroke="#000000" stroke-width="4"/>
  <!-- partner = biological parent of "you" -->
  <circle cx="260" cy="40" r="11" fill="#2a4ec0" stroke="#000000" stroke-width="4"/>
  <!-- married/coupled line -->
  <line x1="191" y1="40" x2="249" y2="40" stroke="#000000" stroke-width="3"/>
  <!-- small heart on marriage line -->
  <path d="M220,38 C220,34 216,32 213,35 C210,32 206,34 206,38 C206,42 213,48 213,48 L220,42 C220,42 220,42 220,38 Z" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <!-- stepsister node (left, female) -->
  <circle cx="180" cy="100" r="13" fill="#f266aa" stroke="#000000" stroke-width="4"/>
  <!-- "you" node (right) -->
  <circle cx="260" cy="100" r="13" fill="#7c3fac" stroke="#000000" stroke-width="4"/>
  <!-- parent->child connectors -->
  <line x1="180" y1="51" x2="180" y2="87" stroke="#000000" stroke-width="3"/>
  <line x1="260" y1="51" x2="260" y2="87" stroke="#000000" stroke-width="3"/>
  <!-- step sibling link: dashed red (NOT solid -> indicates step, not biological) -->
  <line x1="193" y1="100" x2="247" y2="100" stroke="#f8130d" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,4"/>

  <!-- STEP block icon bottom right -->
  <path d="M155,205 L185,205 L185,190 L220,190 L220,175 L260,175 L260,160 L285,160 L285,215 L155,215 Z" fill="#f5e7c4" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
