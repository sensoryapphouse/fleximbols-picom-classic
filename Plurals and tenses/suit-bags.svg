  <!-- structured tri-fold suit bag, folded for travel (rectangular, on its side) -->
  <!-- main folded body -->
  <rect x="35" y="60" width="220" height="140" rx="10" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- tri-fold seam lines (three panels visible) -->
  <line x1="108" y1="60" x2="108" y2="200" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="182" y1="60" x2="182" y2="200" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- subtle panel shading -->
  <rect x="108" y="60" width="74" height="140" fill="#2a4ec0" stroke="none"/>
  <rect x="108" y="60" width="74" height="140" fill="none" stroke="#000000" stroke-width="2.5"/>
  <!-- top zipper line across width -->
  <line x1="45" y1="78" x2="245" y2="78" stroke="#000000" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- zipper pull -->
  <rect x="200" y="73" width="10" height="12" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- carry handle on top -->
  <path d="M 120 60 Q 145 30 170 60" fill="#5e1f0a" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 120 60 Q 145 40 170 60" fill="#9d7246" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- handle attachment buckles -->
  <rect x="115" y="56" width="12" height="10" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <rect x="163" y="56" width="12" height="10" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- side strap with buckle to keep it folded -->
  <rect x="32" y="125" width="226" height="16" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="135" y="120" width="20" height="26" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="2.5"/>
  <line x1="142" y1="126" x2="142" y2="140" stroke="#000000" stroke-width="2"/>
  <line x1="148" y1="126" x2="148" y2="140" stroke="#000000" stroke-width="2"/>
  <!-- small luggage tag -->
  <rect x="50" y="170" width="30" height="20" rx="2" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <line x1="55" y1="178" x2="75" y2="178" stroke="#000000" stroke-width="1.5"/>
  <line x1="55" y1="184" x2="70" y2="184" stroke="#000000" stroke-width="1.5"/>
