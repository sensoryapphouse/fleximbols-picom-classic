  <!-- Surgical mask doctor: full head + neck + shoulders, wearing surgical cap + tied mask -->

  <!-- Shoulders / scrub top -->
  <path d="M 55 240 L 55 175 Q 65 158 95 150 L 145 145 L 195 150 Q 225 158 235 175 L 235 240 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="125" y="130" width="40" height="28" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>

  <!-- Head -->
  <ellipse cx="145" cy="100" rx="58" ry="65" fill="#eed5b6" stroke="#000000" stroke-width="5"/>

  <!-- Surgical cap - covers top of head -->
  <path d="M 90 90 Q 92 38 145 36 Q 198 38 200 90 Z" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Cap band/rim -->
  <rect x="88" y="87" width="114" height="12" rx="6" fill="#90a7d6" stroke="#000000" stroke-width="5"/>
  <!-- Cap tie strings at back (right side visible) -->
  <path d="M 200 88 Q 218 82 224 72" fill="none" stroke="#dff3fd" stroke-width="4" stroke-linecap="round"/>
  <path d="M 200 94 Q 222 94 228 86" fill="none" stroke="#dff3fd" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyes (visible above mask) -->
  <ellipse cx="122" cy="108" rx="10" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="168" cy="108" rx="10" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="124" cy="109" r="5" fill="#000000"/>
  <circle cx="170" cy="109" r="5" fill="#000000"/>
  <!-- Eyebrows -->
  <path d="M 112 98 Q 122 94 132 98" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 158 98 Q 168 94 178 98" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Surgical mask body covering nose + mouth -->
  <path d="M 96 118 Q 97 115 145 113 Q 193 115 194 118 L 190 148 Q 185 158 145 160 Q 105 158 100 148 Z" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Mask pleats / fold lines -->
  <line x1="100" y1="128" x2="190" y2="128" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <line x1="101" y1="138" x2="189" y2="138" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <line x1="102" y1="148" x2="188" y2="148" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <!-- Mask nose wire ridge -->
  <path d="M 112 118 Q 145 114 178 118" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Mask ear ties (loops) -->
  <path d="M 96 120 Q 82 118 80 130 Q 80 142 96 144" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 194 120 Q 208 118 210 130 Q 210 142 194 144" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
