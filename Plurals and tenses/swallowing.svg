  <g>
    <!-- Neck — slightly tilted back, elongated to show swallow action -->
    <polygon points="122,188 127,232 163,232 168,188 158,193 145,195 132,193" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Throat bulge — visible lump on neck -->
    <ellipse cx="145" cy="208" rx="18" ry="14" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
    <!-- Down arrow on neck indicating swallow direction -->
    <polygon points="145,230 136,215 154,215" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <line x1="145" y1="198" x2="145" y2="218" stroke="#2a4ec0" stroke-width="4" stroke-linecap="round"/>
    <!-- Head tilted slightly back -->
    <path d="M72,102 Q75,52 145,26 Q215,52 218,102 Q220,140 200,165 Q172,192 145,193 Q118,192 90,165 Q70,140 72,102 Z" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Left ear -->
    <ellipse cx="67" cy="105" rx="14" ry="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Right ear -->
    <ellipse cx="223" cy="105" rx="14" ry="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Hair -->
    <path d="M84,72 Q94,26 145,20 Q196,26 206,72 Q192,40 145,38 Q98,40 84,72 Z" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Eyes slightly closed (swallowing) -->
    <path d="M104,88 Q114,82 124,88 Q114,94 104,88 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <path d="M166,88 Q176,82 186,88 Q176,94 166,88 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Eye pupils (half-lidded) -->
    <ellipse cx="114" cy="88" rx="6" ry="4" fill="#000000"/>
    <ellipse cx="176" cy="88" rx="6" ry="4" fill="#000000"/>
    <!-- Eyebrows -->
    <polyline points="103,77 118,74" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <polyline points="163,74 178,77" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M141,104 Q137,115 133,118 Q140,121 145,119 Q150,121 157,118 Q153,115 149,104" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- Mouth — lips pressed together, head back, lips slightly parted for after-swallow -->
    <path d="M115,140 Q130,135 145,134 Q160,135 175,140 Q162,148 145,149 Q128,148 115,140 Z" fill="#f4a4b2" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <path d="M115,140 Q130,138 145,137 Q160,138 175,140" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  </g>
