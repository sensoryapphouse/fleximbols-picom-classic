  <path d="M120,225 L122,232 M132,225 L134,232 M144,225 L146,225 L146,232 M156,225 L158,232 M168,225 L170,232 M180,225 L182,232" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
