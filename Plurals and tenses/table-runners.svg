  <path d="M147,130 L158,140 L149,150 L138,140 Z" fill="#fff200" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M150,165 L162,175 L152,185 L140,175 Z" fill="#fff200" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
