  <!-- Table legs -->
  <rect x="40" y="150" width="14" height="65" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="236" y="150" width="14" height="65" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Runner: long strip across the table with overhang -->
  <path d="M120,80 L170,80 L185,160 L190,225 L120,225 L105,160 Z" fill="#d01424" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
