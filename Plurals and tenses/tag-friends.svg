  <!-- tag-friend: photo with tag bubble pointing at a friend's face + @ symbol -->
  <!-- photo frame -->
  <rect x="25" y="25" width="240" height="180" rx="8" ry="8" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- background hills -->
  <polygon points="25,205 80,150 160,205" fill="#67832d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="120,205 200,140 265,205" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- friend's full bust standing in photo -->
  <!-- body/shoulders -->
  <path d="M125 205 Q125 175 145 170 Q150 168 155 170 Q175 175 175 205 Z" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="150" cy="148" r="22" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- hair -->
  <path d="M130 142 Q130 124 150 124 Q170 124 170 142 Q166 134 150 134 Q134 134 130 142 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="143" cy="148" r="2.5" fill="#000000" stroke="none"/>
  <circle cx="157" cy="148" r="2.5" fill="#000000" stroke="none"/>
  <!-- smile -->
  <path d="M143 158 Q150 162 157 158" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- tag bubble pointing at face -->
  <path d="M180 60 Q180 50 192 50 L256 50 Q268 50 268 60 L268 92 Q268 102 256 102 L210 102 L196 122 L198 102 L192 102 Q180 102 180 92 Z" fill="#fff200" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- @ glyph as path inside tag -->
  <circle cx="220" cy="76" r="15" fill="none" stroke="#000000" stroke-width="4"/>
  <circle cx="220" cy="76" r="6" fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M232 76 Q232 88 222 88 Q210 88 210 78" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- pointer line from tag tip toward friend's face -->
  <line x1="198" y1="118" x2="170" y2="142" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
