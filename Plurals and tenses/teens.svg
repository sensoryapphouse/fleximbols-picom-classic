  <!-- Teen: taller lanky figure, phone in hand, casual slouch -->

  <!-- Head -->
  <circle cx="145" cy="58" r="24" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hair (longer, side-swept) -->
  <path d="M121,52 Q124,36 145,34 Q164,35 169,48" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M121,52 Q118,58 120,65" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eyes (slightly heavy-lidded / cool) -->
  <circle cx="137" cy="57" r="3.5" fill="#000000"/>
  <circle cx="153" cy="57" r="3.5" fill="#000000"/>
  <!-- Slight smirk -->
  <path d="M138,66 Q145,71 152,67" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="140" y="80" width="10" height="10" rx="3" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Torso (taller, lanky — hoodie) -->
  <rect x="124" y="90" width="42" height="58" rx="6" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Hoodie pocket -->
  <rect x="133" y="126" width="24" height="14" rx="4" fill="#392170" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Left arm (down, relaxed) -->
  <line x1="124" y1="100" x2="104" y2="145" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>

  <!-- Right arm (bent, holding phone) -->
  <path d="M166,100 Q178,118 172,138" fill="none" stroke="#eed5b6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Phone -->
  <rect x="168" y="133" width="16" height="26" rx="4" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="170" y="135" width="12" height="20" rx="2" fill="#dff3fd" stroke="none"/>
  <!-- Screen glow lines -->
  <line x1="172" y1="139" x2="180" y2="139" stroke="#2a4ec0" stroke-width="2" stroke-linecap="round"/>
  <line x1="172" y1="143" x2="180" y2="143" stroke="#2a4ec0" stroke-width="2" stroke-linecap="round"/>
  <line x1="172" y1="147" x2="177" y2="147" stroke="#2a4ec0" stroke-width="2" stroke-linecap="round"/>

  <!-- Legs (long, lanky jeans) -->
  <rect x="126" y="146" width="16" height="70" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="148" y="146" width="16" height="70" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Trainers -->
  <ellipse cx="134" cy="216" rx="14" ry="7" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="156" cy="216" rx="14" ry="7" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="122" y1="215" x2="144" y2="212" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="144" y1="215" x2="166" y2="212" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
