  <!-- teeter: figure balancing precariously on ledge/beam, tipping, arms windmilling -->

  <!-- Ledge/beam the figure is balancing on -->
  <rect x="100" y="200" width="90" height="14" rx="4" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Edge highlight -->
  <rect x="100" y="200" width="90" height="5" rx="3" fill="#eed5b6" stroke="none"/>

  <!-- Support pillar below beam (narrow) -->
  <rect x="136" y="214" width="18" height="18" rx="2" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Left foot (on beam edge) -->
  <ellipse cx="126" cy="199" rx="16" ry="7" fill="#9d7246" stroke="#000000" stroke-width="4"/>
  <!-- Right foot (barely on beam, tipping) -->
  <ellipse cx="168" cy="198" rx="14" ry="7" fill="#9d7246" stroke="#000000" stroke-width="4"/>

  <!-- Left leg -->
  <path d="M118 198 L116 170 L130 160 L136 170 L132 198Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Right leg -->
  <path d="M162 198 L166 170 L156 160 L150 170 L156 198Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Torso — leaning right (tipping) -->
  <path d="M130 160 L156 160 L162 120 L136 118Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="143" y="103" width="13" height="15" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="4"/>

  <!-- Head (tilted, alarmed) -->
  <circle cx="155" cy="90" r="21" fill="#eed5b6" stroke="#000000" stroke-width="5"/>

  <!-- Face: wide eyes (alarmed) -->
  <circle cx="148" cy="86" r="4" fill="#000000"/>
  <circle cx="162" cy="86" r="4" fill="#000000"/>
  <!-- Open O mouth (scared) -->
  <ellipse cx="155" cy="96" rx="5" ry="4" fill="#000000"/>

  <!-- Hair -->
  <path d="M136 80 Q155 66 175 80" fill="none" stroke="#7d5e23" stroke-width="5" stroke-linecap="round"/>

  <!-- Left arm — windmilling upward/back (counterclockwise) -->
  <path d="M136 128 L90 108 L86 120 L132 140Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="82" cy="114" rx="12" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Windmill arc for left arm -->
  <path d="M72 130 Q65 110 80 98" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5,4"/>
  <polygon points="77,95 86,100 80,106" fill="#000000"/>

  <!-- Right arm — windmilling downward/forward -->
  <path d="M162 126 L210 145 L206 157 L158 138Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="214" cy="152" rx="12" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Windmill arc for right arm -->
  <path d="M225 140 Q235 158 222 170" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5,4"/>
  <polygon points="219,172 220,162 226,168" fill="#000000"/>

  <!-- Tipping arc showing figure about to fall -->
  <path d="M168 175 Q180 178 185 192" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
  <polygon points="183,195 178,187 186,188" fill="#000000"/>
