<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><g transform="translate(0.000,36.216) scale(0.8491)"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- test-engineer: full body test engineer + test-tube + pass/fail checklist + TEST label -->

  <!-- Person: full body, standing left -->
  <!-- Head -->
  <circle cx="60" cy="56" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="60" cy="42" rx="20" ry="10" fill="#000000" stroke="#000000" stroke-width="4"/>
  <!-- Lab coat torso -->
  <rect x="40" y="78" width="40" height="52" rx="6" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Coat lapels -->
  <line x1="60" y1="78" x2="50" y2="98" stroke="#000000" stroke-width="3"/>
  <line x1="60" y1="78" x2="70" y2="98" stroke="#000000" stroke-width="3"/>
  <!-- Pocket -->
  <rect x="64" y="100" width="12" height="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Left arm holding tube -->
  <line x1="40" y1="86" x2="20" y2="116" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <line x1="40" y1="86" x2="20" y2="116" stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="20" cy="118" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right arm -->
  <line x1="80" y1="86" x2="100" y2="116" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <line x1="80" y1="86" x2="100" y2="116" stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="102" cy="118" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Hips -->
  <rect x="38" y="128" width="44" height="22" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect x="38" y="148" width="16" height="52" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="66" y="148" width="16" height="52" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left foot -->
  <rect x="32" y="196" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right foot -->
  <rect x="64" y="196" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Test tube (held in left hand area, prominent) -->
  <!-- Tube body -->
  <path d="M0,60 L0,108 Q0,124 12,124 Q24,124 24,108 L24,60 Z" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Liquid -->
  <path d="M0,88 L0,108 Q0,124 12,124 Q24,124 24,108 L24,88 Z" fill="#3aa6a0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Bubbles -->
  <circle cx="8" cy="100" r="2.5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="16" cy="112" r="2" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <!-- Stopper -->
  <rect x="-2" y="56" width="28" height="10" rx="2" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Pass/Fail checklist (right side) -->
  <rect x="156" y="44" width="116" height="120" rx="3" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Clip -->
  <rect x="190" y="38" width="48" height="10" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Row 1: PASS green -->
  <circle cx="170" cy="68" r="8" fill="#529929" stroke="#000000" stroke-width="3"/>
  <polyline points="166,68 169,72 174,64" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="184" y="62" width="80" height="12" fill="#dff3fd" stroke="#000000" stroke-width="2"/>

  <!-- Row 2: PASS green -->
  <circle cx="170" cy="92" r="8" fill="#529929" stroke="#000000" stroke-width="3"/>
  <polyline points="166,92 169,96 174,88" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="184" y="86" width="80" height="12" fill="#dff3fd" stroke="#000000" stroke-width="2"/>

  <!-- Row 3: FAIL red -->
  <circle cx="170" cy="116" r="8" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <line x1="166" y1="112" x2="174" y2="120" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="174" y1="112" x2="166" y2="120" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="184" y="110" width="80" height="12" fill="#f4a4b2" stroke="#000000" stroke-width="2"/>

  <!-- Row 4: PASS green -->
  <circle cx="170" cy="140" r="8" fill="#529929" stroke="#000000" stroke-width="3"/>
  <polyline points="166,140 169,144 174,136" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="184" y="134" width="80" height="12" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <rect x="130" y="174" width="146" height="28" rx="4" fill="#ff9900" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- beaker + checkmark (replaces TEST banner) -->
  <rect x="105" y="190" width="140" height="36" rx="5" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
  <!-- beaker -->
  <path d="M122 196 L122 210 L112 228 L150 228 L140 210 L140 196 Z" fill="#dff3fd" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="120" y="193" width="22" height="5" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="1.5"/>
  <circle cx="125" cy="220" r="3" fill="#529929" stroke="#000000" stroke-width="1.5"/>
  <circle cx="135" cy="216" r="3" fill="#529929" stroke="#000000" stroke-width="1.5"/>
  <!-- pass check -->
  <path d="M165 205 L175 215 L192 196" fill="none" stroke="#f2e40d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</g><g transform="translate(0,0) scale(0.5664,0.4688) translate(360 8) scale(0.2812)"><defs><radialGradient id="pcxpl2884" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pcxpl2884)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
