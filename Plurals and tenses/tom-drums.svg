<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><g transform="translate(0.000,19.584) scale(0.9184)"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Medium rounded tom drum mounted on a stand, tilted, deeper than snare, no snare wires -->

  <!-- Mount arm (L-bracket from stand) -->
  <rect x="148" y="30" width="8" height="70" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Horizontal arm -->
  <rect x="118" y="30" width="50" height="10" rx="4" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Mount clamp on drum -->
  <rect x="138" y="88" width="20" height="14" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Tom drum shell - deeper cylinder, tilted ~10 degrees -->
  <!-- Shell sides -->
  <path d="M72 118 Q72 118 72 118 L80 188 L210 188 L218 118 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round" transform="rotate(-8, 145, 153)"/>

  <!-- Bottom head -->
  <ellipse cx="145" cy="185" rx="72" ry="14" fill="#dff3fd" stroke="#000000" stroke-width="5" transform="rotate(-8, 145, 185)"/>

  <!-- Top head (batter) -->
  <ellipse cx="145" cy="120" rx="72" ry="14" fill="#ffffff" stroke="#000000" stroke-width="5" transform="rotate(-8, 145, 120)"/>
  <!-- Hoop on top head -->
  <ellipse cx="145" cy="120" rx="72" ry="14" fill="none" stroke="#4d4d4d" stroke-width="4" transform="rotate(-8, 145, 120)"/>

  <!-- Lug casings on shell -->
  <rect x="84" y="130" width="12" height="22" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round" transform="rotate(-8, 90, 141)"/>
  <rect x="112" y="126" width="12" height="22" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round" transform="rotate(-8, 118, 137)"/>
  <rect x="162" y="126" width="12" height="22" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round" transform="rotate(-8, 168, 137)"/>
  <rect x="190" y="130" width="12" height="22" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round" transform="rotate(-8, 196, 141)"/>

  <!-- No snare wires (key differentiator from snare) -->
  <!-- Single drumstick poised above -->
  <line x1="230" y1="60" x2="168" y2="110" stroke="#9d7246" stroke-width="7" stroke-linecap="round"/>
  <circle cx="166" cy="112" r="6" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
</g><g transform="translate(0,0) scale(0.5664,0.4688) translate(360 8) scale(0.2812)"><defs><radialGradient id="pcxpl2928" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pcxpl2928)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
