  <!-- Toner bottle: tall slim glass bottle, screw cap, pale-blue liquid, leaf icon -->
  <!-- Bottle body: tall slim -->
  <rect x="112" y="70" width="66" height="140" rx="10" ry="10" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Liquid level inside bottle -->
  <rect x="117" y="110" width="56" height="95" rx="6" ry="6" fill="#90a7d6"/>
  <!-- Bottle body outline on top of liquid -->
  <rect x="112" y="70" width="66" height="140" rx="10" ry="10" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Bottle neck -->
  <rect x="126" y="50" width="38" height="24" rx="4" ry="4" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Screw cap -->
  <rect x="120" y="30" width="50" height="24" rx="6" ry="6" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Cap screw lines -->
  <line x1="128" y1="34" x2="128" y2="50" stroke="#7f7f7f" stroke-width="2.5"/>
  <line x1="138" y1="34" x2="138" y2="50" stroke="#7f7f7f" stroke-width="2.5"/>
  <line x1="148" y1="34" x2="148" y2="50" stroke="#7f7f7f" stroke-width="2.5"/>
  <line x1="158" y1="34" x2="158" y2="50" stroke="#7f7f7f" stroke-width="2.5"/>
  <!-- Small leaf icon on bottle -->
  <ellipse cx="145" cy="155" rx="14" ry="20" fill="#529929" stroke="#000000" stroke-width="3" transform="rotate(-20 145 155)"/>
  <line x1="145" y1="170" x2="145" y2="140" stroke="#137827" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Highlight on bottle -->
  <rect x="120" y="78" width="8" height="50" rx="4" ry="4" fill="#ffffff"/>
