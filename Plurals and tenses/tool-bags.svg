  <!-- tool-bag: open-top soft canvas tote tool bag with carry handles and tool tops poking out -->

  <!-- bag body (canvas tote, trapezoid shape) -->
  <path d="M 60 210 L 40 100 L 250 100 L 230 210 Z" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- bag fold/opening at top (lighter inner area) -->
  <path d="M 40 100 L 60 210 L 230 210 L 250 100 Z" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- stitching seam lines on bag body -->
  <line x1="80" y1="105" x2="68" y2="200" stroke="#7d5e23" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="210" y1="105" x2="222" y2="200" stroke="#7d5e23" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- bottom reinforcement band -->
  <path d="M 56 190 L 234 190 L 230 210 L 60 210 Z" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- carry handles (two arched straps) -->
  <path d="M 100 100 Q 100 55 125 55 Q 150 55 150 100" fill="none" stroke="#7d5e23" stroke-width="8" stroke-linecap="round"/>
  <path d="M 155 100 Q 155 55 175 55 Q 200 55 200 100" fill="none" stroke="#7d5e23" stroke-width="8" stroke-linecap="round"/>

  <!-- handle attachment patches -->
  <rect x="92" y="92" width="20" height="14" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <rect x="143" y="92" width="20" height="14" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <rect x="191" y="92" width="20" height="14" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="2"/>

  <!-- tool tops poking out of bag -->
  <!-- hammer handle -->
  <rect x="90" y="58" width="12" height="45" rx="4" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- hammer head -->
  <rect x="80" y="50" width="30" height="16" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>

  <!-- screwdriver handle -->
  <rect x="140" y="50" width="14" height="52" rx="5" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <!-- screwdriver shaft tip -->
  <rect x="145" y="44" width="5" height="14" rx="1" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>

  <!-- wrench top -->
  <rect x="185" y="55" width="10" height="46" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <ellipse cx="190" cy="52" rx="10" ry="8" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <ellipse cx="190" cy="52" rx="5" ry="4" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- pliers handle tip -->
  <rect x="222" y="65" width="11" height="37" rx="4" fill="#ff9900" stroke="#000000" stroke-width="3"/>
  <rect x="232" y="60" width="11" height="37" rx="4" fill="#ff9900" stroke="#000000" stroke-width="3"/>
</g><g transform="translate(0,0) scale(0.5664,0.4688) translate(360 8) scale(0.2812)"><defs><radialGradient id="pcxpl2933" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pcxpl2933)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
