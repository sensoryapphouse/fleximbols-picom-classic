  <circle cx="145" cy="170" r="48" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <circle cx="145" cy="170" r="32" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <!-- Spokes -->
  <path d="M 145 138 L 145 202 M 113 170 L 177 170 M 122 147 L 168 193 M 168 147 L 122 193" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Hub -->
  <circle cx="145" cy="170" r="6" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- Pedal crank arms -->
  <path d="M 145 170 L 110 180" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 145 170 L 180 160" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
