  <circle cx="185" cy="75" r="16" fill="#d01424" stroke="#000000" stroke-width="2.5"/>
  <path d="M185 65 Q180 72 185 75 Q190 72 185 65" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- yellow daisy lower-left -->
  <g transform="translate(95 130)">
    <circle r="9" fill="#f2e40d" stroke="#000000" stroke-width="2"/>
    <circle r="4" fill="#ff9900" stroke="#000000" stroke-width="1.5"/>
  </g>

  <!-- lavender flower lower-right -->
  <circle cx="195" cy="130" r="11" fill="#7c3fac" stroke="#000000" stroke-width="2.5"/>
  <circle cx="195" cy="130" r="4" fill="#f2e40d" stroke="#000000" stroke-width="1.5"/>

  <!-- small white buds dotted around -->
  <circle cx="120" cy="115" r="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
