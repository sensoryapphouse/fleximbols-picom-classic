  <path d="M80 105 Q60 100 55 80" fill="#67832d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M210 105 Q230 100 235 80" fill="#67832d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M85 135 Q70 140 60 155" fill="#67832d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M205 135 Q220 140 230 155" fill="#67832d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>

  <!-- variety of flowers -->
  <!-- big white rose center -->
  <circle cx="145" cy="95" r="22" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <path d="M145 80 Q138 88 145 95 Q152 88 145 80 M130 95 Q138 100 145 95 Q138 90 130 95 M160 95 Q152 90 145 95 Q152 100 160 95 M145 110 Q138 102 145 95 Q152 102 145 110" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- pink rose upper-left -->
  <circle cx="105" cy="75" r="16" fill="#f266aa" stroke="#000000" stroke-width="2.5"/>
  <path d="M105 65 Q100 72 105 75 Q110 72 105 65 M97 80 Q102 78 105 75" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>

