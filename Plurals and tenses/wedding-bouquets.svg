  <!-- wedding-bouquet: bride's bouquet with ribbon, variety of flowers, held -->

  <!-- hand holding bouquet at bottom -->
  <path d="M115 195 Q115 220 145 220 Q175 220 175 195 L170 175 L120 175 Z" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- fingers -->
  <path d="M125 195 Q128 215 135 215" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M145 195 L145 218" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M165 195 Q162 215 155 215" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- stems wrapped -->
  <rect x="125" y="155" width="40" height="30" fill="#67832d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- ribbon wrap -->
  <rect x="118" y="160" width="54" height="14" fill="#f4a4b2" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- ribbon trailing tails -->
  <path d="M125 174 Q115 195 110 215 L120 215 Q125 200 132 178 Z" fill="#f4a4b2" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M165 174 Q175 195 180 215 L170 215 Q165 200 158 178 Z" fill="#f4a4b2" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>

  <!-- big green leaf base -->
  <ellipse cx="145" cy="100" rx="70" ry="55" fill="#529929" stroke="#000000" stroke-width="3"/>
