  <!-- Head bust - childish droopy face -->
  <ellipse cx="145" cy="92" rx="62" ry="67" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="122" y="148" width="46" height="28" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Shoulders -->
  <ellipse cx="145" cy="198" rx="78" ry="28" fill="#f266aa" stroke="#000000" stroke-width="5"/>
