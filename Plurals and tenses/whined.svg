  <path d="M118 128 Q132 142 145 144 Q158 142 172 128" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Quivering lower lip hint -->
  <path d="M132 138 Q145 144 158 138" fill="#f4a4b2" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Single large tear from left eye -->
  <path d="M115 93 Q110 102 112 112 Q116 118 118 112 Q118 102 115 93 Z" fill="#dff3fd" stroke="#2a4ec0" stroke-width="3"/>
  <!-- Nasal wavy whiny lines (nasally sound waves) -->
