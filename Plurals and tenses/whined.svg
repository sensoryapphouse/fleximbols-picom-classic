  <path d="M172 107 Q180 102 188 107 Q196 112 204 107 Q212 102 220 107" fill="none" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M175 118 Q183 113 191 118 Q199 123 207 118" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Small pout/nose emphasis - nasal quality -->
