  <path d="M176 136 Q196 130 206 138 Q212 144 208 155" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round"/>
  <path d="M176 136 Q196 130 206 138 Q212 144 208 155" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

