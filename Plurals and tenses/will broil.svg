  <line x1="175" y1="136" x2="175" y2="152" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="195" y1="138" x2="195" y2="152" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
