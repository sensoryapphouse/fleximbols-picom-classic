  <!-- Knife mid-chop coming down hard, food split into chunks, motion lines -->

  <!-- Cutting board -->
  <rect x="20" y="185" width="250" height="30" rx="6" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Food chunks scattered (e.g. carrot/veg chunks) -->
  <!-- Chunk left -->
  <rect x="35" y="155" width="45" height="32" rx="5" fill="#ff9900" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Chunk centre-left -->
  <rect x="90" y="160" width="40" height="27" rx="5" fill="#ff9900" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Chunk centre-right -->
  <rect x="143" y="153" width="38" height="34" rx="5" fill="#ff9900" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Chunk right -->
  <rect x="193" y="158" width="44" height="29" rx="5" fill="#ff9900" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Split line between chunks -->
  <line x1="65" y1="155" x2="68" y2="187" stroke="#000000" stroke-width="3" stroke-dasharray="5,4"/>
  <line x1="118" y1="155" x2="121" y2="187" stroke="#000000" stroke-width="3" stroke-dasharray="5,4"/>
  <line x1="172" y1="153" x2="175" y2="187" stroke="#000000" stroke-width="3" stroke-dasharray="5,4"/>

  <!-- Knife blade (cleaver/heavy knife, angled downward) -->
  <polygon points="95,25 210,25 230,140 100,140" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Blade bevel -->
  <line x1="100" y1="133" x2="225" y2="133" stroke="#b8b8b8" stroke-width="3"/>
  <!-- Knife spine top -->
  <line x1="95" y1="25" x2="210" y2="25" stroke="#7f7f7f" stroke-width="3"/>
  <!-- Knife handle -->
  <rect x="210" y="18" width="60" height="42" rx="9" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Handle rivets -->
  <circle cx="225" cy="39" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="245" cy="39" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="260" cy="39" r="3" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>

  <!-- Motion lines above knife (forceful downstroke) -->
  <line x1="105" y1="15" x2="105" y2="5" stroke="#000000" stroke-width="3"/>
  <line x1="135" y1="18" x2="133" y2="8" stroke="#000000" stroke-width="3"/>
  <line x1="165" y1="18" x2="163" y2="8" stroke="#000000" stroke-width="3"/>
  <line x1="195" y1="15" x2="193" y2="5" stroke="#000000" stroke-width="3"/>
