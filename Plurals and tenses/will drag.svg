  <!-- Ground line -->
  <line x1="10" y1="210" x2="280" y2="210" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Heavy object being dragged (box on ground, right side) -->
  <rect x="178" y="158" width="90" height="52" rx="5" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Box weight lines -->
  <line x1="223" y1="158" x2="223" y2="210" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="178" y1="184" x2="268" y2="184" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Drag marks on floor (scratch lines behind box) -->
  <line x1="60" y1="212" x2="178" y2="212" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,4"/>
  <line x1="60" y1="217" x2="178" y2="217" stroke="#4d4d4d" stroke-width="2" stroke-linecap="round" stroke-dasharray="8,6"/>

  <!-- Figure leaning forward pulling -->
  <!-- Figure is left side, leaning toward right, pulling rope toward box -->
  <!-- Head (leaning forward) -->
  <circle cx="82" cy="72" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Eyes looking forward -->
  <circle cx="89" cy="69" r="3" fill="#000000"/>
  <circle cx="75" cy="70" r="3" fill="#000000"/>
  <!-- Mouth (effort) -->
  <path d="M77 81 L87 81" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Torso leaning forward ~30° -->
  <rect x="68" y="94" width="34" height="44" rx="6" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Left arm forward grabbing object -->
  <path d="M90 100 L125 128 L160 160" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M90 100 L125 128 L160 160" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="162" cy="162" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>

  <!-- Right arm also pulling -->
  <path d="M92 112 L130 140 L160 168" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M92 112 L130 140 L160 168" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="162" cy="170" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>

  <!-- Legs (front leg planted, back leg pushing) -->
  <!-- Front (right) leg -->
  <path d="M92 138 L100 175 L104 210" fill="none" stroke="#4d4d4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M92 138 L100 175 L104 210" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Back (left) leg -->
  <path d="M78 138 L58 175 L44 210" fill="none" stroke="#4d4d4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78 138 L58 175 L44 210" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Feet -->
  <ellipse cx="104" cy="212" rx="16" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="42" cy="212" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>

  <!-- Effort lines at figure's body -->
  <line x1="46" y1="100" x2="34" y2="92" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
  <line x1="44" y1="115" x2="30" y2="112" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="130" x2="34" y2="130" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
