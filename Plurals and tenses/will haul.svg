  <!-- Ground line -->
  <line x1="10" y1="215" x2="280" y2="215" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Heavy load on ground (large crate/sled, right side) -->
  <rect x="168" y="150" width="105" height="65" rx="5" fill="#7d5e23" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Crate detail -->
  <line x1="220" y1="150" x2="220" y2="215" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="168" y1="182" x2="273" y2="182" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Weight marks on crate -->
  <line x1="178" y1="160" x2="192" y2="172" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="155" x2="209" y2="167" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="230" y1="155" x2="244" y2="167" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Rope from load to figure -->
  <path d="M168 178 Q130 172 105 155" fill="none" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>

  <!-- Figure leaning heavily forward, pulling rope over shoulder -->
  <!-- Body strongly leaned ~45° -->
  <!-- Head -->
  <circle cx="72" cy="68" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Eyes (looking ahead/down with effort) -->
  <circle cx="80" cy="65" r="3" fill="#000000"/>
  <circle cx="65" cy="67" r="3" fill="#000000"/>
  <!-- Effort expression -->
  <path d="M66 78 L80 78" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Sweat drop -->
  <ellipse cx="90" cy="60" rx="4" ry="6" fill="#90a7d6" stroke="#000000" stroke-width="2"/>

  <!-- Torso leaning strongly forward -->
  <rect x="56" y="90" width="36" height="46" rx="6" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Right arm reaching back/up holding rope over shoulder -->
  <path d="M92 96 L108 152" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M92 96 L108 152" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="108" cy="154" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>

  <!-- Rope going from hand over shoulder -->
  <path d="M82 92 Q90 80 100 70 Q110 60 108 155" fill="none" stroke="#9d7246" stroke-width="5" stroke-linecap="round"/>

  <!-- Left arm swinging forward for balance -->
  <path d="M56 96 L32 120 L22 145" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M56 96 L32 120 L22 145" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="21" cy="147" r="7" fill="#eed5b6" stroke="#000000" stroke-width="4"/>

  <!-- Legs (strong stride, forward lean) -->
  <!-- Front leg (right) -->
  <path d="M80 136 L88 178 L92 215" fill="none" stroke="#4d4d4d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M80 136 L88 178 L92 215" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Back leg (left, pushing hard) -->
  <path d="M64 136 L42 172 L24 215" fill="none" stroke="#4d4d4d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M64 136 L42 172 L24 215" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Feet -->
  <ellipse cx="92" cy="216" rx="16" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="22" cy="216" rx="15" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>

  <!-- Heavy effort lines -->
  <line x1="30" y1="95" x2="14" y2="86" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <line x1="26" y1="110" x2="10" y2="108" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <line x1="28" y1="125" x2="12" y2="126" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
