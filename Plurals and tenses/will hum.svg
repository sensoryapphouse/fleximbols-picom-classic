  <!-- Content face: closed mouth, relaxed happy expression -->
  <!-- Head -->
  <circle cx="130" cy="115" r="72" fill="#eed5b6" stroke="#000000" stroke-width="5"/>

  <!-- Eyes: happy/content, slightly closed -->
  <path d="M 100 100 Q 112 92 122 100" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 138 100 Q 150 92 160 100" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- Cheeks (rosy content) -->
  <ellipse cx="95" cy="120" rx="14" ry="9" fill="#f4a4b2"/>
  <ellipse cx="165" cy="120" rx="14" ry="9" fill="#f4a4b2"/>

  <!-- Closed mouth (slight smile, lips pressed together — humming) -->
  <path d="M 104 140 Q 130 155 156 140" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lips closed line -->
  <path d="M 108 143 Q 130 148 152 143" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Gentle wavy sound lines from closed mouth area -->
  <!-- Wave 1 -->
  <path d="M 170 135 Q 182 128 188 138 Q 194 148 206 138" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Wave 2 (larger) -->
  <path d="M 178 120 Q 194 108 202 122 Q 210 136 226 122" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Wave 3 (largest) -->
  <path d="M 186 105 Q 206 89 216 107 Q 226 125 246 107" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Musical notes floating up-right -->
  <!-- Quarter note 1 -->
  <ellipse cx="220" cy="78" rx="8" ry="6" fill="#000000" transform="rotate(-15,220,78)"/>
  <line x1="228" y1="75" x2="228" y2="50" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Eighth note 2 (higher) -->
  <ellipse cx="248" cy="60" rx="7" ry="5" fill="#000000" transform="rotate(-15,248,60)"/>
  <line x1="255" y1="57" x2="255" y2="35" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Flag on eighth note -->
  <path d="M 255 35 Q 268 40 265 52" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Small eighth note 3 -->
  <ellipse cx="260" cy="90" rx="6" ry="5" fill="#000000" transform="rotate(-15,260,90)"/>
  <line x1="266" y1="87" x2="266" y2="67" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 266 67 Q 278 72 275 82" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
