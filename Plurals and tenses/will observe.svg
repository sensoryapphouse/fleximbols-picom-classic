  <!-- Full body figure watching through binoculars -->
  <!-- Ground line -->
  <line x1="20" y1="228" x2="270" y2="228" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M 122,175 L 108,220 L 125,222 L 138,180 Z" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 155,175 L 168,220 L 152,222 L 142,180 Z" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Shoes -->
  <ellipse cx="116" cy="223" rx="20" ry="8" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="160" cy="223" rx="20" ry="8" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Torso -->
  <path d="M 108,105 Q 118,96 138,94 Q 158,96 168,105 L 172,175 L 105,175 Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Arms raised holding binoculars -->
  <!-- Left arm up to binoculars -->
  <path d="M 112,112 L 80,105 Q 68,102 68,88 L 85,78 Q 98,78 100,90 L 118,98 Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right arm up to binoculars -->
  <path d="M 165,112 L 200,105 Q 210,102 210,88 L 196,78 Q 183,78 182,90 L 162,98 Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left hand -->
  <circle cx="78" cy="82" r="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right hand -->
  <circle cx="202" cy="82" r="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Binoculars body (centred at face, two barrels) -->
  <!-- Left barrel -->
  <path d="M 88,70 Q 88,50 108,50 L 130,50 Q 148,50 148,70 L 148,98 Q 148,108 130,108 L 108,108 Q 88,108 88,98 Z" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right barrel -->
  <path d="M 152,70 Q 152,50 172,50 L 192,50 Q 210,50 210,70 L 210,98 Q 210,108 192,108 L 172,108 Q 152,108 152,98 Z" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Bridge connecting barrels -->
  <rect x="146" y="72" width="12" height="10" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left lens (light blue) -->
  <circle cx="118" cy="76" r="18" fill="#dff3fd" stroke="#000000" stroke-width="4"/>
  <!-- Right lens (light blue) -->
  <circle cx="182" cy="76" r="18" fill="#dff3fd" stroke="#000000" stroke-width="4"/>
  <!-- Lens glare -->
  <ellipse cx="112" cy="70" rx="5" ry="4" fill="#ffffff" stroke="none"/>
  <ellipse cx="176" cy="70" rx="5" ry="4" fill="#ffffff" stroke="none"/>
  <!-- Head above binoculars -->
  <circle cx="145" cy="38" r="26" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M 122,30 Q 125,12 145,12 Q 165,12 168,30" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
