  <circle cx="137" cy="108" r="3.5" fill="#1d0e82"/>
  <circle cx="138" cy="107" r="1.5" fill="#ffffff"/>
  <ellipse cx="154" cy="107" rx="6" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="155" cy="108" r="3.5" fill="#1d0e82"/>
  <circle cx="156" cy="107" r="1.5" fill="#ffffff"/>
  <!-- Neutral confident mouth -->
  <line x1="138" y1="120" x2="152" y2="120" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
