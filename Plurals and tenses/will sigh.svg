  <path d="M190 98 Q212 120 218 148" fill="none" stroke="#eed5b6" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="218" cy="154" rx="12" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Legs -->
  <rect x="118" y="165" width="22" height="55" rx="10" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <rect x="150" y="165" width="22" height="55" rx="10" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <!-- Feet -->
  <ellipse cx="129" cy="222" rx="18" ry="9" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <ellipse cx="161" cy="222" rx="18" ry="9" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Face - tired/weary -->
  <!-- Eyes - half closed -->
  <ellipse cx="135" cy="37" rx="8" ry="5" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="155" cy="37" rx="8" ry="5" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="135" cy="38" rx="4" ry="3" fill="#4d4d4d" stroke="none"/>
  <ellipse cx="155" cy="38" rx="4" ry="3" fill="#4d4d4d" stroke="none"/>
  <!-- Heavy eyelids -->
  <path d="M127 34 Q135 30 143 34" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M147 34 Q155 30 163 34" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Small pursed mouth exhaling -->
  <ellipse cx="145" cy="54" rx="7" ry="5" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <!-- Long flowing breath stream to the right -->
  <path d="M152 52 Q172 45 192 48 Q212 51 225 42" fill="none" stroke="#b8b8b8" stroke-width="5" stroke-linecap="round"/>
  <path d="M152 54 Q175 54 198 57 Q215 59 228 52" fill="none" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Small cloud at end of breath -->
  <ellipse cx="236" cy="42" rx="12" ry="9" fill="#ffffff" stroke="#b8b8b8" stroke-width="3"/>
  <ellipse cx="248" cy="46" rx="9" ry="7" fill="#ffffff" stroke="#b8b8b8" stroke-width="3"/>
  <ellipse cx="242" cy="38" rx="8" ry="7" fill="#ffffff" stroke="#b8b8b8" stroke-width="3"/>
