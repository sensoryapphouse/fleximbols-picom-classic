  <!-- Full body figure - standing, shoulders drooped -->
  <!-- Head -->
  <ellipse cx="145" cy="42" rx="30" ry="33" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Neck -->
  <rect x="133" y="70" width="24" height="18" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Torso - drooped posture, slightly forward lean -->
  <path d="M98 88 Q105 80 133 80 L157 80 Q185 80 192 88 L200 155 Q185 165 145 168 Q105 165 90 155 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
