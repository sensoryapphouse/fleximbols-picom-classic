  <!-- Bust: wide unblinking fixed eyes, intense bold sight-lines at a target -->
  <!-- Shoulders -->
  <path d="M 55,222 Q 55,195 80,186 L 210,186 Q 235,195 235,222 L 235,240 L 55,240 Z" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="125" y="168" width="40" height="22" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="145" cy="108" rx="58" ry="60" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair (slicked/tight) -->
  <path d="M 89,96 Q 92,52 145,50 Q 198,52 201,96" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- VERY WIDE unblinking eyes — large, round, staring -->
  <!-- Left eye (very wide open) -->
  <ellipse cx="114" cy="106" rx="22" ry="20" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="114" cy="106" r="12" fill="#1d0e82"/>
  <circle cx="110" cy="102" r="3.5" fill="#ffffff"/>
  <!-- No eyelid drooping — eyes wide open; add small upper lash line -->
  <path d="M 92,96 Q 114,90 136,96" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Right eye (very wide open) -->
  <ellipse cx="176" cy="106" rx="22" ry="20" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="176" cy="106" r="12" fill="#1d0e82"/>
  <circle cx="172" cy="102" r="3.5" fill="#ffffff"/>
  <path d="M 154,96 Q 176,90 198,96" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Flat/tense mouth (unblinking, intense) -->
  <line x1="125" y1="138" x2="165" y2="138" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Bold straight intense sight-lines from eyes to target on right -->
  <line x1="198" y1="104" x2="255" y2="95" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <line x1="198" y1="108" x2="255" y2="108" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <line x1="198" y1="112" x2="255" y2="121" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <!-- Target (bullseye at right) -->
  <circle cx="265" cy="108" r="18" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="265" cy="108" r="11" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <circle cx="265" cy="108" r="4" fill="#000000" stroke="none"/>
