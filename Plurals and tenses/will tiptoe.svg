  <!-- Ground line -->
  <line x1="60" y1="230" x2="230" y2="230" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>

  <!-- Small quiet motion dots near feet -->
  <circle cx="108" cy="222" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="120" cy="215" r="3" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="132" cy="220" r="3" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>

  <!-- Single figure tiptoeing -->
  <!-- Body is slightly forward-leaning for balance on toes -->

  <!-- RIGHT FOOT on tiptoe (front foot, heel raised) -->
  <!-- Right leg straight, heel raised -->
  <line x1="155" y1="230" x2="160" y2="192" stroke="#eed5b6" stroke-width="14" stroke-linecap="round"/>
  <!-- Right foot on toes only (small pointed foot) -->
  <ellipse cx="162" cy="229" rx="8" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Heel raised indicator (gap under heel) -->
  <path d="M155 224 Q150 216 152 208" fill="none" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <path d="M155 224 Q150 216 152 208" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- LEFT LEG (back leg, also on tiptoe, slightly bent) -->
  <path d="M128 226 Q126 210 130 194 Q134 186 140 192" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round"/>
  <path d="M128 226 Q126 210 130 194 Q134 186 140 192" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Left foot tiptoe (toe pointing down) -->
  <ellipse cx="128" cy="226" rx="7" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>

  <!-- Trousers connecting both legs -->
  <rect x="124" y="186" width="40" height="20" rx="8" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Torso (slight forward lean) -->
  <path d="M122 130 Q120 145 122 186 L164 186 Q166 145 164 130 Q156 124 145 123 Q132 124 122 130 Z" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="136" y="118" width="14" height="16" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="3"/>

  <!-- Head -->
  <circle cx="143" cy="100" r="24" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M120 96 Q123 78 143 77 Q163 79 166 97" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Cautious/careful eyes (looking ahead) -->
  <ellipse cx="135" cy="98" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="137" cy="98" r="3.5" fill="#1d0e82"/>
  <ellipse cx="152" cy="98" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="154" cy="98" r="3.5" fill="#1d0e82"/>
  <!-- Careful/quiet expression (pursed lips) -->
  <path d="M137 112 Q143 115 149 112" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Arms: one slightly out for balance, one forward -->
  <!-- Right arm out to side for balance -->
  <path d="M164 140 Q180 132 192 128" fill="none" stroke="#eed5b6" stroke-width="13" stroke-linecap="round"/>
  <path d="M164 140 Q180 132 192 128" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <circle cx="194" cy="127" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>

  <!-- Left arm slightly forward for balance -->
  <path d="M122 140 Q106 132 96 128" fill="none" stroke="#eed5b6" stroke-width="13" stroke-linecap="round"/>
  <path d="M122 140 Q106 132 96 128" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <circle cx="94" cy="127" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>

  <!-- Height indicator arrows (heels raised) showing tiptoe -->
  <line x1="175" y1="230" x2="175" y2="210" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3"/>
  <polygon points="175,206 171,212 179,212" fill="#b8b8b8"/>
