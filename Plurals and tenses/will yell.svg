  <!-- FULL BODY person yelling -->
  <!-- Legs -->
  <rect x="118" y="178" width="14" height="38" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="138" y="178" width="14" height="38" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="125" cy="218" rx="10" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="145" cy="218" rx="10" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- Torso -->
  <path d="M 100,118 Q 100,108 135,108 Q 170,108 170,118 L 165,180 Q 135,185 105,180 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left arm - raised in yelling pose -->
  <path d="M 100,120 Q 75,115 70,90 L 80,88 Q 88,108 105,118 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left hand (fist) -->
  <circle cx="74" cy="85" r="8" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Right arm - down/clenched -->
  <path d="M 170,120 Q 185,140 188,170 L 178,172 Q 168,148 165,128 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right hand (fist) -->
  <circle cx="186" cy="174" r="8" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Neck -->
  <rect x="128" y="98" width="14" height="14" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Head -->
  <circle cx="135" cy="72" r="32" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- Eyes (squinting from yelling) -->
  <path d="M 118,68 L 128,72" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 142,72 L 152,68" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Angry eyebrows -->
  <path d="M 116,58 L 128,62" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 142,62 L 154,58" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Open mouth yelling -->
  <ellipse cx="135" cy="88" rx="12" ry="10" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Tongue -->
  <ellipse cx="135" cy="92" rx="7" ry="4" fill="#f266aa" stroke="#000000" stroke-width="2"/>
  <!-- Hair -->
  <path d="M 105,55 Q 110,38 135,38 Q 160,38 165,55 Q 155,48 135,46 Q 115,48 105,55 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Sound waves from mouth -->
  <path d="M 180,75 Q 195,75 200,85" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 185,60 Q 205,62 215,75" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 190,95 Q 210,100 220,105" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 195,45 Q 220,48 235,60" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- megaphone (amplifying the yell) -->
  <path d="M240 148 L256 138 L256 178 L240 168 Z" fill="#ff9900" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="226" y="148" width="14" height="20" rx="2" fill="#ff9900" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M240 168 L240 182 L232 182 L232 168 Z" fill="#9d7246" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M259 145 Q266 158 259 170" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
