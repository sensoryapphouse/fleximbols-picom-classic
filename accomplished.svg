  <!-- Mountain peak -->
  <polygon points="145,68 240,220 50,220" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Snow cap on peak -->
  <polygon points="145,68 168,120 122,120" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Green ground strip -->
  <rect x="20" y="218" width="250" height="14" rx="3" fill="#529929" stroke="#000000" stroke-width="3"/>

  <!-- Flag pole at peak -->
  <line x1="145" y1="68" x2="145" y2="36" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Flag -->
  <polygon points="145,36 178,46 145,56" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- PROUD FIGURE at peak, arms raised in V -->
  <!-- Body -->
  <rect x="121" y="92" width="48" height="56" rx="8" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm raised up-left -->
  <path d="M121 104 L92 76" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="89" cy="73" r="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right arm raised up-right -->
  <path d="M169 104 L198 76" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="201" cy="73" r="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Legs -->
  <rect x="125" y="144" width="18" height="36" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="5"/>
  <rect x="147" y="144" width="18" height="36" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="5"/>
  <!-- Feet -->
  <ellipse cx="134" cy="183" rx="14" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <ellipse cx="156" cy="183" rx="14" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Neck -->
  <rect x="131" y="72" width="28" height="22" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Head -->
  <ellipse cx="145" cy="52" rx="34" ry="34" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="145" cy="24" rx="34" ry="13" fill="#7d5e23" stroke="#000000" stroke-width="5"/>
  <rect x="111" y="19" width="68" height="14" rx="7" fill="#7d5e23" stroke="#000000" stroke-width="5"/>
  <!-- Proud raised brows -->
  <path d="M122 42 Q134 35 145 40" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M145 40 Q156 35 168 42" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Eyes wide beaming -->
  <ellipse cx="133" cy="52" rx="9" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="133" cy="51" rx="5" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <circle cx="131" cy="49" r="2" fill="#ffffff"/>
  <ellipse cx="157" cy="52" rx="9" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="157" cy="51" rx="5" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <circle cx="155" cy="49" r="2" fill="#ffffff"/>
  <!-- Big proud smile -->
  <path d="M124 65 Q145 80 166 65" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Cheeks glowing -->
  <ellipse cx="118" cy="57" rx="10" ry="7" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="172" cy="57" rx="10" ry="7" fill="#f4a4b2" stroke="none"/>

  <!-- Sparkle stars -->
  <polygon points="32,80 34,74 36,80 42,82 36,84 34,90 32,84 26,82" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <polygon points="254,78 256,72 258,78 264,80 258,82 256,88 254,82 248,80" fill="#f7de58" stroke="#000000" stroke-width="2"/>
