  <!-- Running figure: full body, vigorous motion -->
  <!-- Ground shadow -->
  <ellipse cx="148" cy="228" rx="60" ry="8" fill="#b8b8b8" stroke="none"/>
  <!-- Body / torso (leaning forward) -->
  <path d="M 112,90 Q 128,82 148,85 Q 165,87 172,100 L 168,128 Q 164,140 148,142 Q 132,142 122,130 L 112,110 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left arm swinging back -->
  <path d="M 115,98 L 82,130 Q 76,138 83,143 Q 90,148 96,140 L 122,112 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right arm swinging forward -->
  <path d="M 168,98 L 200,72 Q 206,64 213,68 Q 220,74 215,82 L 172,108 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left hand -->
  <circle cx="83" cy="141" r="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right hand -->
  <circle cx="215" cy="72" r="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left leg back -->
  <path d="M 122,138 L 100,178 L 88,210 Q 85,220 95,222 Q 105,224 110,214 L 128,178 L 142,148 Z" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right leg forward/up -->
  <path d="M 158,140 L 185,168 L 198,195 Q 204,205 195,208 Q 186,212 182,202 L 166,172 L 148,148 Z" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left shoe -->
  <ellipse cx="93" cy="220" rx="18" ry="9" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Right shoe -->
  <ellipse cx="192" cy="206" rx="18" ry="9" transform="rotate(15 192 206)" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Head -->
  <circle cx="148" cy="62" r="24" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M 126,55 Q 130,36 148,36 Q 166,36 170,55" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Eyes (determined, wide) -->
  <ellipse cx="140" cy="60" rx="5" ry="5" fill="#000000"/>
  <ellipse cx="156" cy="60" rx="5" ry="5" fill="#000000"/>
  <!-- Mouth (open, energetic) -->
  <path d="M 138,72 Q 148,80 158,72" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Motion lines -->
  <line x1="58" y1="100" x2="84" y2="100" stroke="#ff9900" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="115" x2="80" y2="115" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="130" x2="82" y2="130" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <!-- Sweat drops -->
  <path d="M 172,42 Q 175,36 178,42 Q 178,48 175,48 Q 172,48 172,42 Z" fill="#dff3fd" stroke="#000000" stroke-width="2.5"/>
  <path d="M 158,32 Q 161,26 164,32 Q 164,38 161,38 Q 158,38 158,32 Z" fill="#dff3fd" stroke="#000000" stroke-width="2.5"/>
</svg>
