  <!-- baby activity center: circular jumper/exersaucer with seat in middle and toys around -->
  <!-- base/legs -->
  <rect x="42" y="190" width="20" height="34" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <rect x="228" y="190" width="20" height="34" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <!-- tray ring (oval) -->
  <ellipse cx="145" cy="170" rx="120" ry="30" fill="#ff9900" stroke="#000000" stroke-width="4"/>
  <ellipse cx="145" cy="170" rx="105" ry="22" fill="#fff200" stroke="#000000" stroke-width="3"/>
  <!-- attached toys on tray -->
  <circle cx="60" cy="158" r="12" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <rect x="92" y="146" width="20" height="20" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <!-- spinner -->
  <circle cx="200" cy="158" r="14" fill="#529929" stroke="#000000" stroke-width="3"/>
  <path d="M186 158 L214 158 M200 144 L200 172" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- right end - mirror -->
  <ellipse cx="232" cy="158" rx="8" ry="10" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <!-- center seat well -->
  <ellipse cx="145" cy="156" rx="34" ry="14" fill="#7c3fac" stroke="#000000" stroke-width="3"/>
  <!-- baby in seat (full body simplified: head, torso, arms reaching out, legs hidden in seat well) -->
  <!-- torso peeking from seat -->
  <path d="M124 140 Q124 116 145 116 Q166 116 166 140 L166 156 L124 156 Z" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arms reaching to toys -->
  <path d="M124 128 Q108 130 100 144" fill="none" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <path d="M124 128 Q108 130 100 144" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M166 128 Q182 130 192 144" fill="none" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <path d="M166 128 Q182 130 192 144" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="145" cy="92" r="26" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- hair tuft -->
  <path d="M132 70 Q145 60 158 70" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="137" cy="92" r="2.5" fill="#000000"/>
  <circle cx="153" cy="92" r="2.5" fill="#000000"/>
  <!-- smile -->
  <path d="M138 102 Q145 108 152 102" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="130" cy="100" r="3" fill="#f4a4b2"/>
  <circle cx="160" cy="100" r="3" fill="#f4a4b2"/>
</svg>
