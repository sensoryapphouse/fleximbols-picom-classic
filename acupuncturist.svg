<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- acupuncturist: practitioner FULL BODY placing needles on patient FULL BODY back + meridian points -->
  <!-- treatment table -->
  <rect x="14" y="148" width="240" height="22" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="20" y="170" width="8" height="50" fill="#7d5e23" stroke="#000000" stroke-width="2.5"/>
  <rect x="240" y="170" width="8" height="50" fill="#7d5e23" stroke="#000000" stroke-width="2.5"/>
  <!-- pillow -->
  <rect x="20" y="136" width="40" height="14" rx="6" fill="#dff3fd" stroke="#000000" stroke-width="2.5"/>
  <!-- patient FULL BODY lying face-down on table -->
  <!-- head (in profile, on pillow) -->
  <circle cx="40" cy="128" r="16" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <path d="M28 122 Q26 110 40 108 Q54 110 52 122" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- ear -->
  <ellipse cx="48" cy="128" rx="2" ry="3" fill="#e6b98a" stroke="#000000" stroke-width="1.5"/>
  <!-- closed eye -->
  <path d="M44 128 Q46 130 49 128" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- mouth -->
  <path d="M42 137 L46 137" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- body lying flat -->
  <path d="M56 132 L182 132 Q188 132 188 138 L188 148 L56 148 Z" fill="#f5e7c4" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- exposed back (bare skin tone visible under towel) -->
  <rect x="76" y="116" width="100" height="22" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <!-- arm dangling -->
  <path d="M56 148 L48 168 L58 172 L66 152 Z" fill="#e6b98a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="52" cy="172" r="5" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <!-- legs -->
  <rect x="188" y="134" width="40" height="14" fill="#f5e7c4" stroke="#000000" stroke-width="2.5"/>
  <path d="M228 134 L240 142 L232 148 L222 142 Z" fill="#e6b98a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- feet -->
  <ellipse cx="240" cy="146" rx="6" ry="4" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <!-- meridian points (red dots) along spine/back -->
  <circle cx="92" cy="124" r="3" fill="#d01424" stroke="#000000" stroke-width="1.5"/>
  <circle cx="108" cy="124" r="3" fill="#d01424" stroke="#000000" stroke-width="1.5"/>
  <circle cx="124" cy="124" r="3" fill="#d01424" stroke="#000000" stroke-width="1.5"/>
  <circle cx="140" cy="124" r="3" fill="#d01424" stroke="#000000" stroke-width="1.5"/>
  <circle cx="156" cy="124" r="3" fill="#d01424" stroke="#000000" stroke-width="1.5"/>
  <circle cx="172" cy="124" r="3" fill="#d01424" stroke="#000000" stroke-width="1.5"/>
  <!-- needles sticking up from each point -->
  <g stroke="#7f7f7f" stroke-width="2" stroke-linecap="round">
    <line x1="92" y1="124" x2="92" y2="100"/>
    <line x1="108" y1="124" x2="108" y2="100"/>
    <line x1="124" y1="124" x2="124" y2="100"/>
    <line x1="140" y1="124" x2="140" y2="100"/>
    <line x1="156" y1="124" x2="156" y2="100"/>
    <line x1="172" y1="124" x2="172" y2="100"/>
  </g>
  <!-- needle tops (small handles) -->
  <g fill="#f8130d" stroke="#000000" stroke-width="1.5">
    <circle cx="92" cy="98" r="2.5"/>
    <circle cx="108" cy="98" r="2.5"/>
    <circle cx="124" cy="98" r="2.5"/>
    <circle cx="140" cy="98" r="2.5"/>
    <circle cx="156" cy="98" r="2.5"/>
    <circle cx="172" cy="98" r="2.5"/>
  </g>
  <!-- acupuncturist FULL BODY standing on the right -->
  <!-- legs -->
  <rect x="244" y="172" width="9" height="48" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <rect x="256" y="172" width="9" height="48" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <ellipse cx="248" cy="222" rx="6" ry="3" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="261" cy="222" rx="6" ry="3" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- white coat torso -->
  <path d="M238 90 Q238 84 244 84 L266 84 Q272 84 272 90 L272 174 L238 174 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- coat lapel -->
  <path d="M255 84 L249 100 L255 110 L261 100 Z" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <!-- arm reaching down toward back (holding needle) -->
  <path d="M238 92 L210 116 L218 124 L246 100 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- other arm at side -->
  <path d="M272 92 L280 130 L270 132 L268 100 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- hand holding needle -->
  <circle cx="214" cy="120" r="5" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <line x1="210" y1="118" x2="194" y2="106" stroke="#7f7f7f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="194" cy="104" r="2.5" fill="#f8130d" stroke="#000000" stroke-width="1.5"/>
  <circle cx="275" cy="132" r="5" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <!-- neck -->
  <rect x="251" y="76" width="9" height="10" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <!-- head -->
  <circle cx="255" cy="60" r="17" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <!-- hair -->
  <path d="M240 58 Q241 44 255 42 Q269 44 270 58 Q266 50 255 50 Q244 50 240 58 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="249" cy="60" r="1.5" fill="#000000"/>
  <circle cx="261" cy="60" r="1.5" fill="#000000"/>
  <path d="M251 68 Q255 71 259 68" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
</svg>
