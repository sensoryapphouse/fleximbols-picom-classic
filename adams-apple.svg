  <!-- Neck — slightly tilted to show side profile feel -->
  <rect x="108" y="185" width="74" height="46" rx="14" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head/face shape, 3/4 view -->
  <ellipse cx="145" cy="110" rx="80" ry="90" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="145" cy="44" rx="80" ry="40" fill="#5e1f0a" stroke="#000000" stroke-width="5"/>
  <!-- Eye right -->
  <ellipse cx="168" cy="104" rx="12" ry="9" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="168" cy="104" r="5" fill="#000000"/>
  <!-- Eye left (narrower — 3/4 view) -->
  <ellipse cx="118" cy="104" rx="8" ry="9" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="120" cy="104" r="4" fill="#000000"/>
  <!-- Nose -->
  <ellipse cx="145" cy="136" rx="13" ry="9" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <circle cx="139" cy="139" r="5" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <circle cx="151" cy="139" r="5" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <!-- Mouth -->
  <path d="M128 160 Q145 172 163 160" fill="#f4a4b2" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="160" x2="163" y2="160" stroke="#000000" stroke-width="2"/>
  <!-- Adams apple: prominent bump on front of neck -->
  <path d="M130 200 Q145 188 160 200" fill="#d01424" stroke="#d01424" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="145" cy="200" rx="18" ry="12" fill="#d01424" stroke="#000000" stroke-width="3"/>
  <!-- Pointer -->
  <line x1="163" y1="200" x2="200" y2="186" stroke="#d01424" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="186" r="5" fill="#d01424" stroke="#000000" stroke-width="2"/>
</svg>
