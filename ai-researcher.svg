  <!-- ai-researcher: full body person with brain+chip prop + lightbulb -->

  <!-- Person: full body, standing left-centre -->
  <!-- Head -->
  <circle cx="76" cy="52" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="76" cy="38" rx="20" ry="10" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <rect x="56" y="74" width="40" height="52" rx="6" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm down -->
  <line x1="56" y1="84" x2="36" y2="120" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="36" cy="122" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right arm raised toward prop -->
  <line x1="96" y1="84" x2="134" y2="62" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="136" cy="61" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Hips -->
  <rect x="54" y="124" width="44" height="22" rx="4" fill="#392170" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect x="54" y="144" width="16" height="52" rx="4" fill="#392170" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="82" y="144" width="16" height="52" rx="4" fill="#392170" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left foot -->
  <rect x="48" y="192" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right foot -->
  <rect x="80" y="192" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Brain shape (simplified two-lobe) -->
  <ellipse cx="176" cy="80" rx="22" ry="18" fill="#f4a4b2" stroke="#000000" stroke-width="4"/>
  <ellipse cx="210" cy="80" rx="22" ry="18" fill="#f4a4b2" stroke="#000000" stroke-width="4"/>
  <!-- Brain crease lines -->
  <path d="M176,68 Q183,72 183,80 Q183,88 176,92" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M210,68 Q203,72 203,80 Q203,88 210,92" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Chip overlay on brain -->
  <rect x="182" y="70" width="28" height="22" rx="3" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Chip pins top -->
  <line x1="188" y1="70" x2="188" y2="64" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="195" y1="70" x2="195" y2="64" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="202" y1="70" x2="202" y2="64" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Chip pins bottom -->
  <line x1="188" y1="92" x2="188" y2="98" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="195" y1="92" x2="195" y2="98" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="202" y1="92" x2="202" y2="98" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Chip inner grid -->
  <rect x="186" y="74" width="20" height="14" fill="#7f7f7f" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>

  <!-- Lightbulb (research idea) -->
  <circle cx="248" cy="64" r="18" fill="#f7de58" stroke="#000000" stroke-width="4"/>
  <!-- Bulb base -->
  <rect x="241" y="80" width="14" height="6" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="243" y="86" width="10" height="4" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Rays -->
  <line x1="248" y1="42" x2="248" y2="36" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <line x1="262" y1="50" x2="266" y2="46" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <line x1="234" y1="50" x2="230" y2="46" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <line x1="266" y1="64" x2="272" y2="64" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <line x1="224" y1="64" x2="218" y2="64" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>

  <!-- Paper/document below lightbulb -->
  <rect x="218" y="116" width="54" height="72" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <line x1="226" y1="130" x2="264" y2="130" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="226" y1="142" x2="264" y2="142" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="226" y1="154" x2="250" y2="154" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="226" y1="166" x2="264" y2="166" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
</svg>
