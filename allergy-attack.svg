<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Allergy-attack: figure with hives/spots + sneeze + watery eye -->

  <!-- Ground line -->
  <line x1="30" y1="218" x2="260" y2="218" stroke="#4d4d4d" stroke-width="4" stroke-linecap="round"/>

  <!-- Legs -->
  <line x1="126" y1="195" x2="112" y2="218" stroke="#1d0e82" stroke-width="11" stroke-linecap="round"/>
  <line x1="152" y1="195" x2="166" y2="218" stroke="#1d0e82" stroke-width="11" stroke-linecap="round"/>

  <!-- Torso -->
  <rect x="112" y="138" width="56" height="60" rx="12" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Hives on torso (raised red welts) -->
  <ellipse cx="124" cy="150" rx="8" ry="5" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <ellipse cx="148" cy="158" rx="7" ry="4" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <ellipse cx="130" cy="170" rx="9" ry="5" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <ellipse cx="155" cy="174" rx="6" ry="4" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <ellipse cx="120" cy="184" rx="7" ry="4" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>

  <!-- Left arm (bent, hand near face sneezing) -->
  <line x1="112" y1="152" x2="80" y2="148" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <line x1="80" y1="148" x2="78" y2="128" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>

  <!-- Right arm (down, hives on arm) -->
  <line x1="168" y1="152" x2="198" y2="165" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="190" cy="160" rx="6" ry="4" fill="#f8130d" stroke="#000000" stroke-width="3"/>

  <!-- Neck -->
  <rect x="128" y="122" width="24" height="18" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Head -->
  <ellipse cx="140" cy="100" rx="32" ry="34" fill="#eed5b6" stroke="#000000" stroke-width="5"/>

  <!-- Hives on face/neck -->
  <ellipse cx="118" cy="108" rx="6" ry="4" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <ellipse cx="160" cy="96" rx="5" ry="3" fill="#f8130d" stroke="#000000" stroke-width="3"/>

  <!-- Left eye watery (teardrop) -->
  <ellipse cx="128" cy="96" rx="7" ry="8" fill="#dff3fd" stroke="#000000" stroke-width="4"/>
  <circle cx="129" cy="97" r="3" fill="#1d0e82"/>
  <!-- Teardrop -->
  <path d="M 126 104 Q 124 112 128 115" fill="none" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>

  <!-- Right eye squinted (sneezing) -->
  <path d="M 148 95 Q 154 90 160 95" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 148 95 Q 154 99 160 95" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Nose red/irritated -->
  <ellipse cx="140" cy="108" rx="6" ry="5" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>

  <!-- Sneeze burst (from nose/mouth area, going left) -->
  <path d="M 108 118 Q 90 110 72 112" fill="none" stroke="#dff3fd" stroke-width="5" stroke-linecap="round"/>
  <path d="M 108 122 Q 88 120 68 126" fill="none" stroke="#dff3fd" stroke-width="5" stroke-linecap="round"/>
  <path d="M 108 126 Q 90 130 72 140" fill="none" stroke="#dff3fd" stroke-width="4" stroke-linecap="round"/>
  <!-- Sneeze droplets -->
  <circle cx="80" cy="111" r="4" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <circle cx="70" cy="125" r="3" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <circle cx="75" cy="138" r="3" fill="#dff3fd" stroke="#000000" stroke-width="3"/>

  <!-- Mouth open sneezing -->
  <path d="M 130 118 Q 140 126 150 118" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
