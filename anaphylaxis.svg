<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Anaphylaxis: figure with swollen face/throat + urgent alert + clutching throat -->

  <!-- Ground line -->
  <line x1="30" y1="218" x2="260" y2="218" stroke="#4d4d4d" stroke-width="4" stroke-linecap="round"/>

  <!-- Legs -->
  <line x1="126" y1="198" x2="114" y2="218" stroke="#1d0e82" stroke-width="11" stroke-linecap="round"/>
  <line x1="150" y1="198" x2="162" y2="218" stroke="#1d0e82" stroke-width="11" stroke-linecap="round"/>

  <!-- Torso -->
  <rect x="110" y="140" width="58" height="60" rx="12" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Both hands clutching throat -->
  <!-- Left arm bent up to throat -->
  <line x1="110" y1="155" x2="82" y2="148" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <line x1="82" y1="148" x2="100" y2="128" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <!-- Left hand at throat -->
  <circle cx="108" cy="124" r="9" fill="#e6b98a" stroke="#000000" stroke-width="4"/>

  <!-- Right arm bent up to throat -->
  <line x1="168" y1="155" x2="196" y2="148" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <line x1="196" y1="148" x2="178" y2="128" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <!-- Right hand at throat -->
  <circle cx="170" cy="124" r="9" fill="#e6b98a" stroke="#000000" stroke-width="4"/>

  <!-- Neck — swollen (wider than normal) -->
  <ellipse cx="139" cy="128" rx="24" ry="14" fill="#e6b98a" stroke="#000000" stroke-width="5"/>

  <!-- Head — swollen/puffy face (larger, rounder) -->
  <ellipse cx="139" cy="94" rx="42" ry="44" fill="#e6b98a" stroke="#000000" stroke-width="5"/>

  <!-- Swollen eyelids (puffy eyes, nearly shut) -->
  <!-- Left eye puffy -->
  <ellipse cx="124" cy="90" rx="10" ry="6" fill="#f4a4b2" stroke="#000000" stroke-width="4"/>
  <path d="M 114 90 Q 124 86 134 90" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Right eye puffy -->
  <ellipse cx="154" cy="90" rx="10" ry="6" fill="#f4a4b2" stroke="#000000" stroke-width="4"/>
  <path d="M 144 90 Q 154 86 164 90" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Swollen lips -->
  <ellipse cx="139" cy="112" rx="14" ry="8" fill="#f266aa" stroke="#000000" stroke-width="4"/>
  <!-- Mouth open struggling to breathe -->
  <ellipse cx="139" cy="114" rx="8" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>

  <!-- Swollen nose -->
  <ellipse cx="139" cy="102" rx="8" ry="6" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>

  <!-- Urgent alert triangle (top right) -->
  <polygon points="222,28 262,100 182,100" fill="#fff200" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Exclamation mark body -->
  <rect x="236" y="48" width="12" height="32" rx="4" fill="#000000"/>
  <!-- Exclamation dot -->
  <circle cx="242" cy="90" r="6" fill="#000000"/>
</svg>
