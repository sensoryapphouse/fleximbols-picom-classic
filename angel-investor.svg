  <!-- Wings (angel) -->
  <!-- Left wing -->
  <path d="M100,90 Q60,60 30,80 Q50,100 80,96 Q60,110 36,118 Q58,128 90,112 Z" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right wing -->
  <path d="M170,90 Q210,60 240,80 Q220,100 190,96 Q210,110 234,118 Q212,128 180,112 Z" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Halo -->
  <ellipse cx="135" cy="26" rx="28" ry="10" fill="none" stroke="#f7de58" stroke-width="6"/>
  <ellipse cx="135" cy="26" rx="22" ry="7" fill="none" stroke="#f2e40d" stroke-width="3"/>
  <!-- Person: head -->
  <circle cx="135" cy="52" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <path d="M115,48 Q119,30 135,32 Q151,30 155,48" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Robe/torso -->
  <path d="M108,74 Q102,80 100,120 L170,120 Q168,80 162,74 Z" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Robe belt -->
  <rect x="108" y="100" width="54" height="8" rx="4" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left arm down (reaching to sprout) -->
  <line x1="108" y1="82" x2="78" y2="128" stroke="#eed5b6" stroke-width="12" stroke-linecap="round"/>
  <circle cx="76" cy="130" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right arm raised -->
  <line x1="162" y1="82" x2="188" y2="108" stroke="#eed5b6" stroke-width="12" stroke-linecap="round"/>
  <circle cx="190" cy="110" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Legs (robe covers, just feet show) -->
  <rect x="120" y="118" width="13" height="50" rx="5" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="137" y="118" width="13" height="50" rx="5" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Feet (sandals) -->
  <rect x="114" y="166" width="22" height="8" rx="4" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="134" y="166" width="22" height="8" rx="4" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Tiny coin/seed money being handed down -->
  <circle cx="78" cy="148" r="10" fill="#f7de58" stroke="#000000" stroke-width="4"/>
  <!-- Dollar symbol on coin -->
  <line x1="78" y1="141" x2="78" y2="155" stroke="#9d7246" stroke-width="3" stroke-linecap="round"/>
  <!-- Tiny startup sprout -->
  <line x1="56" y1="220" x2="56" y2="172" stroke="#529929" stroke-width="6" stroke-linecap="round"/>
  <!-- Two small leaves -->
  <path d="M56,200 Q44,190 40,178 Q52,180 56,192 Z" fill="#67832d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M56,190 Q68,180 72,168 Q60,172 56,184 Z" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Sprout top bud -->
  <circle cx="56" cy="170" r="8" fill="#137827" stroke="#000000" stroke-width="4"/>
  <!-- Small startup box/pot below sprout -->
  <rect x="40" y="218" width="32" height="12" rx="3" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Seed money arrow from coin to sprout -->
  <path d="M70,154 Q66,168 62,172" fill="none" stroke="#f2e40d" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
  <!-- Small VC label: money bag in right hand -->
  <circle cx="206" cy="120" r="18" fill="#f2e40d" stroke="#000000" stroke-width="4"/>
  <line x1="206" y1="108" x2="206" y2="132" stroke="#9d7246" stroke-width="4" stroke-linecap="round"/>
  <path d="M198,114 Q206,110 214,114" fill="none" stroke="#9d7246" stroke-width="4" stroke-linecap="round"/>
  <rect x="200" y="104" width="12" height="6" rx="2" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
</svg>
