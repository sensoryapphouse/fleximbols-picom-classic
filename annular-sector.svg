  <!-- Annular sector: a ring segment (region between two concentric arcs).
       Centre (145,135), outer R=100, inner r=50, sweeping 200deg-340deg over the top. -->
  <path d="M51.0,100.8
           A100,100 0 0 1 238.97,100.8
           L191.98,117.9
           A50,50 0 0 0 98.02,117.9
           Z"
        fill="#f266aa" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- radial edge accents to emphasise the sector boundaries -->
  <line x1="51.0" y1="100.8" x2="98.02" y2="117.9" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="238.97" y1="100.8" x2="191.98" y2="117.9" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
</svg>
