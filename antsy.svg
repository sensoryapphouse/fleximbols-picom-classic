  <!-- Bust: neck + shoulders -->
  <rect x="100" y="185" width="90" height="40" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shirt collar -->
  <path d="M100 195 Q145 215 190 195" fill="#2a4ec0" stroke="#000000" stroke-width="4"/>
  <!-- Neck -->
  <rect x="128" y="168" width="34" height="24" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head -->
  <ellipse cx="145" cy="128" rx="52" ry="58" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M95 118 Q93 78 118 68 Q145 58 172 68 Q195 78 195 118" fill="#9d7246" stroke="#000000" stroke-width="4"/>
  <!-- Eyes: glancing sideways left (impatient darting look) -->
  <!-- Left eye - looking left -->
  <ellipse cx="122" cy="122" rx="14" ry="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="116" cy="122" rx="6" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="114" cy="120" rx="2" ry="2" fill="#ffffff"/>
  <!-- Right eye - looking left -->
  <ellipse cx="168" cy="122" rx="14" ry="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="162" cy="122" rx="6" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="160" cy="120" rx="2" ry="2" fill="#ffffff"/>
  <!-- Eyebrows raised/furrowed (impatient) -->
  <path d="M108 108 Q122 103 136 108" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M154 108 Q168 103 182 108" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Mouth: tight impatient line / slight frown -->
  <path d="M128 152 Q145 148 162 152" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Tapping foot below bust — small shoe shape -->
  <ellipse cx="145" cy="232" rx="22" ry="8" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Foot motion tick marks -->
  <line x1="130" y1="222" x2="127" y2="216" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="220" x2="145" y2="214" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="222" x2="163" y2="216" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Small impatient motion lines near right side of head -->
  <line x1="202" y1="112" x2="212" y2="108" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="204" y1="122" x2="215" y2="122" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="202" y1="132" x2="212" y2="136" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
