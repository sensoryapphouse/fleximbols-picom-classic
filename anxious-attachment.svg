  <!-- Child FULL BODY (left, reaching arms toward parent) -->
  <!-- Head -->
  <circle cx="70" cy="85" r="17" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Hair -->
  <path d="M55 80 Q57 68 70 66 Q83 68 85 80" fill="#9d7246" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Worried eyebrows (slanted up at inner) -->
  <path d="M60 78 L67 81" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M80 78 L73 81" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eyes (wide) -->
  <circle cx="64" cy="87" r="2.5" fill="#000000"/>
  <circle cx="76" cy="87" r="2.5" fill="#000000"/>
  <!-- Worried mouth -->
  <path d="M64 97 Q70 93 76 97" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tear -->
  <path d="M82 92 Q84 98 82 102 Q80 98 82 92 Z" fill="#90a7d6" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Torso -->
  <path d="M53 105 L53 160 Q70 167 87 160 L87 105 Z" fill="#f266aa" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Both arms reaching out toward parent (extended right) -->
  <path d="M86 112 Q120 110 150 115" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M86 128 Q120 130 150 132" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <!-- Hands at end of arms -->
  <circle cx="155" cy="115" r="7" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <circle cx="155" cy="133" r="7" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <!-- Legs -->
  <rect x="55" y="162" width="13" height="48" rx="5" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <rect x="72" y="162" width="13" height="48" rx="5" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <!-- Feet -->
  <ellipse cx="61" cy="215" rx="8" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="2.5"/>
  <ellipse cx="78" cy="215" rx="8" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="2.5"/>
  <!-- Parent FULL BODY (right, partly turned away - back/profile view) -->
  <!-- Head turned away (back-of-head visible) -->
  <circle cx="225" cy="70" r="19" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Hair covers most of head (turned away) -->
  <path d="M208 70 Q208 52 225 50 Q242 52 244 70 Q244 80 240 82 L210 82 Q206 80 208 70 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Small ear visible -->
  <ellipse cx="210" cy="72" rx="3" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- Torso (turned, narrower profile) -->
  <path d="M213 92 L211 175 Q225 180 240 175 L237 92 Z" fill="#137827" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Arms (one visible, hanging at side away from child) -->
  <path d="M236 105 Q252 125 252 155" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M213 105 Q205 120 207 140" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="213" y="177" width="12" height="35" rx="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <rect x="227" y="177" width="12" height="35" rx="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Feet -->
  <ellipse cx="219" cy="217" rx="8" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="2.5"/>
  <ellipse cx="233" cy="217" rx="8" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="2.5"/>
  <!-- Anxious/strained heart between them (cracked) -->
  <path d="M165 30 Q165 20 173 20 Q180 20 180 27 Q180 20 187 20 Q195 20 195 30 Q195 40 180 50 Q165 40 165 30 Z" fill="#d01424" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M180 25 L178 32 L182 36 L179 42" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Question/worry marks -->
  <path d="M155 50 Q155 45 159 45 Q163 45 163 49 Q163 53 159 54 L159 58" fill="none" stroke="#7c3fac" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="159" cy="63" r="1.5" fill="#7c3fac"/>
</svg>
