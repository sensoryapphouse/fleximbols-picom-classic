  <!-- Neck -->
  <rect x="125" y="150" width="40" height="28" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shoulders / bust -->
  <path d="M60 240 Q60 195 95 188 L145 180 L195 188 Q230 195 230 240 Z" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="145" cy="106" rx="62" ry="66" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair - flat/messy, unkempt to show deep apathy -->
  <ellipse cx="145" cy="55" rx="62" ry="24" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>
  <rect x="83" y="47" width="124" height="20" rx="8" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>
  <!-- Left eyebrow - completely flat, zero expression -->
  <path d="M100 79 L136 79" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Right eyebrow - completely flat -->
  <path d="M154 79 L190 79" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Left eye - barely open, half-lidded, dead stare -->
  <ellipse cx="118" cy="100" rx="14" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="118" cy="102" r="6" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- Very heavy upper lid left -->
  <rect x="104" y="91" width="28" height="13" rx="2" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right eye - barely open -->
  <ellipse cx="172" cy="100" rx="14" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="172" cy="102" r="6" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- Very heavy upper lid right -->
  <rect x="158" y="91" width="28" height="13" rx="2" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Nose -->
  <path d="M140 111 L136 125 L143 127 L150 125 L146 111" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Flat dash mouth - completely neutral, no expression -->
  <line x1="122" y1="140" x2="168" y2="140" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Grey shrug arms - raised shoulders with upturned palms -->
  <!-- Left shoulder raised/shrug -->
  <path d="M83 178 Q60 165 42 175 Q30 180 35 192" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Left palm up / shrug hand -->
  <ellipse cx="36" cy="196" rx="12" ry="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right shoulder raised/shrug -->
  <path d="M207 178 Q230 165 248 175 Q260 180 255 192" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Right palm up / shrug hand -->
  <ellipse cx="254" cy="196" rx="12" ry="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
</svg>
