<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Appendix (organ): vermiform appendix = a worm-like blind tube hanging off the cecum/large intestine -->
  <g transform="translate(6,-10)">
  <!-- ascending large intestine (colon) entering from top, turning to the cecum -->
  <path d="M210 24 C228 24 238 38 238 58 L238 96 C238 122 220 138 192 140 L168 140"
        fill="none" stroke="#000000" stroke-width="22" stroke-linecap="round"/>
  <path d="M210 24 C228 24 238 38 238 58 L238 96 C238 122 220 138 192 140 L168 140"
        fill="none" stroke="#e9a0a0" stroke-width="14" stroke-linecap="round"/>
  <!-- haustra (segmentation) marks on the colon -->
  <line x1="238" y1="62" x2="256" y2="62" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="238" y1="88" x2="256" y2="88" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- cecum: rounded pouch at the base of the colon -->
  <ellipse cx="140" cy="138" rx="56" ry="48" fill="#e9a0a0" stroke="#000000" stroke-width="5"/>
  <!-- subtle shading on cecum -->
  <path d="M112 116 C100 128 100 150 112 164" fill="none" stroke="#c97b7b" stroke-width="4" stroke-linecap="round"/>
  <!-- THE APPENDIX: a prominent worm-like blind tube curling down from the cecum -->
  <path d="M132 182 C128 200 138 214 132 230 C128 240 118 242 110 236"
        fill="none" stroke="#000000" stroke-width="22" stroke-linecap="round"/>
  <path d="M132 182 C128 200 138 214 132 230 C128 240 118 242 110 236"
        fill="none" stroke="#d9595b" stroke-width="14" stroke-linecap="round"/>
  <!-- second appendix curl variant for clear worm look (overlay tip highlight) -->
  <circle cx="110" cy="235" r="9" fill="#d9595b" stroke="#000000" stroke-width="5"/>
  </g>
</svg>
