  <!-- Neck -->
  <rect x="125" y="148" width="40" height="28" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shoulders / bust - upright, stiff posture -->
  <path d="M58 240 Q58 192 92 184 L145 174 L198 184 Q232 192 232 240 Z" fill="#392170" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head - chin raised high (face center moved up, chin prominent) -->
  <ellipse cx="145" cy="102" rx="60" ry="65" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Crown on head -->
  <rect x="100" y="44" width="90" height="20" rx="4" fill="#f7de58" stroke="#000000" stroke-width="4"/>
  <!-- Crown points -->
  <polygon points="100,44 110,22 122,44" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="130,44 145,18 160,44" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="168,44 180,22 190,44" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Crown jewels -->
  <circle cx="145" cy="28" r="5" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <circle cx="116" cy="34" r="4" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <circle cx="174" cy="34" r="4" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <!-- Hair under crown -->
  <rect x="85" y="50" width="120" height="15" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Eyebrows - high arched, looking down at viewer (positioned higher) -->
  <path d="M104 78 Q118 70 132 74" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M158 74 Q172 70 186 78" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Eyes - half-closed, looking downward (pupils at bottom of eye) -->
  <ellipse cx="118" cy="97" rx="13" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="118" cy="100" rx="8" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Heavy lid -->
  <rect x="105" y="88" width="26" height="11" rx="3" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <ellipse cx="172" cy="97" rx="13" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="172" cy="100" rx="8" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Heavy lid right -->
  <rect x="159" y="88" width="26" height="11" rx="3" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Upturned nose - prominent, tilted up -->
  <path d="M142 112 L136 126 L143 130 L152 130 L156 126 L148 112" stroke="#000000" stroke-width="4" fill="#e6b98a" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Nostrils visible (nose tilted up) -->
  <ellipse cx="141" cy="128" rx="5" ry="3" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <ellipse cx="153" cy="128" rx="5" ry="3" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <!-- Smug mouth - thin line, slightly upturned at one corner -->
  <path d="M124 142 L143 142 L162 138" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
