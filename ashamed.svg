  <!-- Shirt/shoulders - head bowed, hunched inward -->
  <path d="M68 240 Q72 214 102 204 Q122 197 145 199 Q168 197 188 204 Q218 214 222 240 Z" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Neck - shorter as head is bowed down -->
  <rect x="130" y="185" width="30" height="18" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head - bowed downward, tilted forward -->
  <ellipse cx="145" cy="128" rx="56" ry="56" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair - head bowed, hair falls forward -->
  <path d="M89 115 Q92 78 118 68 Q145 58 172 68 Q198 78 201 115" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hair falling forward on bowed head -->
  <path d="M89 115 Q86 130 92 138 Q104 130 108 118" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M95 112 Q90 128 96 140" fill="none" stroke="#5e1f0a" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes averted/cast down - looking away downward -->
  <ellipse cx="128" cy="122" rx="10" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="162" cy="122" rx="10" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Pupils looking sharply downward-left averted -->
  <circle cx="125" cy="126" r="5" fill="#000000"/>
  <circle cx="159" cy="126" r="5" fill="#000000"/>
  <!-- Ashamed pressed-together mouth - small tight line -->
  <path d="M133 152 Q145 148 157 152" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Deeply furrowed shameful brows - pointing sharply down inner -->
  <path d="M115 110 Q128 105 141 112" fill="none" stroke="#5e1f0a" stroke-width="5" stroke-linecap="round"/>
  <path d="M149 112 Q162 105 175 110" fill="none" stroke="#5e1f0a" stroke-width="5" stroke-linecap="round"/>
  <path d="M138 108 L145 103 L152 108" fill="none" stroke="#5e1f0a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Intense blushing red cheeks -->
  <ellipse cx="112" cy="136" rx="16" ry="11" fill="#d01424"/>
  <ellipse cx="178" cy="136" rx="16" ry="11" fill="#d01424"/>
  <!-- Hand partly covering face/mouth - right hand up -->
  <path d="M160 168 Q172 155 178 140 Q182 128 174 124 Q166 120 160 132 Q154 144 152 158 Q150 168 154 178 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Fingers curled covering lower face -->
  <path d="M178 140 Q186 134 184 124 Q182 116 176 120" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M180 132 Q188 126 186 116 Q184 108 178 112" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Blush lines radiating on cheeks -->
  <line x1="96" y1="130" x2="90" y2="126" stroke="#d01424" stroke-width="2" stroke-linecap="round"/>
  <line x1="94" y1="136" x2="86" y2="134" stroke="#d01424" stroke-width="2" stroke-linecap="round"/>
  <line x1="96" y1="142" x2="90" y2="146" stroke="#d01424" stroke-width="2" stroke-linecap="round"/>
</svg>
