  <path d="M60 240 Q60 195 95 188 L145 181 L195 188 Q230 195 230 240 Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="145" cy="112" rx="62" ry="66" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair - somewhat disheveled from the mind explosion -->
  <ellipse cx="145" cy="60" rx="62" ry="24" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <rect x="83" y="52" width="124" height="20" rx="8" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <!-- Exploding mind starburst FROM the top of the head -->
  <!-- Inner burst circle -->
  <circle cx="145" cy="38" r="24" fill="#f266aa" stroke="#000000" stroke-width="4"/>
  <!-- Burst rays (starburst) -->
  <polygon points="145,8 148,26 162,14 154,30 172,26 160,38 178,42 162,48 172,62 156,54 153,72 145,56 137,72 134,54 118,62 128,48 112,42 130,38 118,26 136,30 128,14 142,26" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
