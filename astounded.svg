  <circle cx="145" cy="38" r="18" fill="#f266aa" stroke="#000000" stroke-width="3"/>
  <!-- Eyebrows - bulging extreme, knit together at center -->
  <path d="M96 78 Q118 60 138 70" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M152 68 Q172 58 194 72" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Eyes - extreme bulging, very wide -->
  <ellipse cx="118" cy="100" rx="18" ry="20" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <!-- Bulge shadow to make eyes appear popped -->
  <circle cx="118" cy="102" r="12" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <circle cx="123" cy="97" r="5" fill="#ffffff"/>
  <ellipse cx="172" cy="100" rx="18" ry="20" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="172" cy="102" r="12" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <circle cx="177" cy="97" r="5" fill="#ffffff"/>
  <!-- Nose -->
  <path d="M140 115 L136 128 L143 130 L150 128 L146 115" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
