<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Smartphone running an audiobook app: book + audio waves -->
  <!-- Phone body -->
  <rect x="80" y="18" width="130" height="204" rx="16" ry="16" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Screen -->
  <rect x="90" y="34" width="110" height="172" rx="4" ry="4" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Speaker slot at top -->
  <rect x="130" y="24" width="30" height="4" rx="2" ry="2" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <!-- Home indicator -->
  <rect x="130" y="212" width="30" height="4" rx="2" ry="2" fill="#b8b8b8" stroke="#000000" stroke-width="1.5"/>
  <!-- App header bar -->
  <rect x="90" y="34" width="110" height="18" fill="#7c3fac" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Header label tick marks (app title placeholder, not text) -->
  <rect x="100" y="41" width="50" height="4" rx="1.5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="190" cy="43" r="3" fill="#fff200" stroke="#000000" stroke-width="1.5"/>
  <!-- Book cover artwork on screen -->
  <rect x="108" y="62" width="74" height="60" rx="3" ry="3" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Book spine highlight -->
  <rect x="108" y="62" width="10" height="60" fill="#9d7246" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Book page edges (pages peeking) -->
  <rect x="118" y="65" width="60" height="54" fill="#f5e7c4" stroke="#000000" stroke-width="2"/>
  <!-- Headphones icon on book -->
  <path d="M128 88 Q148 70 168 88" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="124" y="86" width="10" height="14" rx="2" fill="#000000" stroke="#000000" stroke-width="2"/>
  <rect x="162" y="86" width="10" height="14" rx="2" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- Audio waves left of book -->
  <path d="M96 82 Q92 92 96 102" fill="none" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round"/>
  <path d="M101 76 Q95 92 101 108" fill="none" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round"/>
  <!-- Audio waves right of book -->
  <path d="M194 82 Q198 92 194 102" fill="none" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round"/>
  <path d="M189 76 Q195 92 189 108" fill="none" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round"/>
  <!-- Progress bar -->
  <rect x="100" y="134" width="90" height="6" rx="3" ry="3" fill="#efefef" stroke="#000000" stroke-width="2"/>
  <rect x="100" y="134" width="38" height="6" rx="3" ry="3" fill="#529929" stroke="#000000" stroke-width="2"/>
  <circle cx="138" cy="137" r="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Title placeholder lines (no real text) -->
  <rect x="105" y="148" width="80" height="4" rx="1.5" fill="#4d4d4d" stroke="#000000" stroke-width="1.5"/>
  <rect x="115" y="156" width="60" height="3" rx="1.5" fill="#b8b8b8" stroke="#000000" stroke-width="1.5"/>
  <!-- Transport controls: previous -->
  <path d="M114 180 L104 188 L114 196 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="100" y="180" width="3" height="16" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <!-- Play button (centre) -->
  <circle cx="145" cy="188" r="12" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <path d="M141 182 L153 188 L141 194 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Transport controls: next -->
  <path d="M176 180 L186 188 L176 196 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="187" y="180" width="3" height="16" fill="#000000" stroke="#000000" stroke-width="1.5"/>
</svg>
