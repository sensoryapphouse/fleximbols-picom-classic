  <!-- "Distance" indicator: small X over heart between -->
  <path d="M125 35 Q125 25 132 25 Q139 25 139 32 Q139 25 146 25 Q154 25 154 35 Q154 45 139 55 Q125 45 125 35 Z" fill="#b8b8b8" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
