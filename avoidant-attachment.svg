  <rect x="210" y="160" width="13" height="50" rx="5" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
  <rect x="227" y="160" width="13" height="50" rx="5" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
