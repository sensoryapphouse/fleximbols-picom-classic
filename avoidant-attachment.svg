  <ellipse cx="83" cy="215" rx="8" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="2.5"/>
  <!-- Parent FULL BODY (right) -->
  <!-- Head facing child -->
  <circle cx="225" cy="65" r="19" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Hair -->
  <path d="M207 60 Q210 46 225 44 Q240 46 243 60" fill="#5e1f0a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
