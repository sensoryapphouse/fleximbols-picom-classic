  <!-- baby play gym: mat on floor with arch over it and dangling toys -->
  <!-- mat (padded, perspective oval) -->
  <ellipse cx="145" cy="200" rx="120" ry="28" fill="#3aa6a0" stroke="#000000" stroke-width="4"/>
  <!-- mat pattern -->
  <circle cx="90" cy="200" r="10" fill="#f2e40d" stroke="#000000" stroke-width="2"/>
  <circle cx="145" cy="206" r="10" fill="#f4a4b2" stroke="#000000" stroke-width="2"/>
  <circle cx="200" cy="200" r="10" fill="#ff9900" stroke="#000000" stroke-width="2"/>
  <!-- left arch -->
  <path d="M60 200 Q60 70 145 60" fill="none" stroke="#7c3fac" stroke-width="8" stroke-linecap="round"/>
  <!-- right arch (crossed) -->
  <path d="M230 200 Q230 70 145 60" fill="none" stroke="#2a4ec0" stroke-width="8" stroke-linecap="round"/>
  <!-- arch joint at top -->
  <circle cx="145" cy="60" r="10" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- dangling toys -->
  <line x1="100" y1="78" x2="100" y2="110" stroke="#000000" stroke-width="2"/>
  <circle cx="100" cy="122" r="14" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <line x1="145" y1="70" x2="145" y2="100" stroke="#000000" stroke-width="2"/>
  <!-- star toy -->
  <path d="M145 102 L150 116 L165 117 L153 126 L157 140 L145 132 L133 140 L137 126 L125 117 L140 116 Z" fill="#f2e40d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <line x1="190" y1="78" x2="190" y2="108" stroke="#000000" stroke-width="2"/>
  <!-- elephant plush -->
  <ellipse cx="190" cy="124" rx="16" ry="13" fill="#90a7d6" stroke="#000000" stroke-width="3"/>
  <circle cx="200" cy="118" r="6" fill="#90a7d6" stroke="#000000" stroke-width="2"/>
  <path d="M204 122 Q210 124 208 132" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
</svg>
