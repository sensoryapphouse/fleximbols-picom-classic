  <!-- pair: camera unit + parent handheld screen showing baby -->
  <!-- camera unit on left (small dome cam on stand) -->
  <rect x="32" y="180" width="60" height="14" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <rect x="58" y="120" width="8" height="62" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <!-- camera head -->
  <circle cx="62" cy="100" r="28" fill="#efefef" stroke="#000000" stroke-width="4"/>
  <!-- lens -->
  <circle cx="62" cy="100" r="16" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <circle cx="62" cy="100" r="9" fill="#000000"/>
  <circle cx="58" cy="96" r="3" fill="#ffffff"/>
  <!-- IR led indicator -->
  <circle cx="82" cy="86" r="3" fill="#f8130d" stroke="#000000" stroke-width="1.5"/>
  <!-- wifi signal between -->
  <path d="M104 80 Q120 70 136 80" fill="none" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 92 Q120 86 130 92" fill="none" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="100" r="3" fill="#2a4ec0" stroke="#000000" stroke-width="1.5"/>
  <!-- parent unit (handheld with screen) on right -->
  <rect x="150" y="50" width="120" height="170" rx="14" fill="#efefef" stroke="#000000" stroke-width="4"/>
  <!-- screen -->
  <rect x="162" y="64" width="96" height="118" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <!-- screen image: crib with baby (simplified) -->
  <rect x="170" y="140" width="80" height="34" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <line x1="180" y1="140" x2="180" y2="172" stroke="#000000" stroke-width="1.5"/>
  <line x1="195" y1="140" x2="195" y2="172" stroke="#000000" stroke-width="1.5"/>
  <line x1="210" y1="140" x2="210" y2="172" stroke="#000000" stroke-width="1.5"/>
  <line x1="225" y1="140" x2="225" y2="172" stroke="#000000" stroke-width="1.5"/>
  <line x1="240" y1="140" x2="240" y2="172" stroke="#000000" stroke-width="1.5"/>
  <!-- baby blob in crib -->
  <ellipse cx="210" cy="148" rx="30" ry="10" fill="#f4a4b2" stroke="#000000" stroke-width="2"/>
  <circle cx="222" cy="142" r="8" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- Zzz indicator -->
  <path d="M186 92 L200 92 L186 108 L200 108" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M210 80 L222 80 L210 94 L222 94" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- status LED -->
  <circle cx="210" cy="196" r="5" fill="#529929" stroke="#000000" stroke-width="2"/>
  <!-- antenna -->
  <line x1="160" y1="50" x2="148" y2="32" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="148" cy="32" r="4" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
</svg>
