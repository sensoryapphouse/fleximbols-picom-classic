<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- bacterial rod + spiral + cocci (cluster of three shapes labelled as bacteria types) -->
  <!-- petri-dish-ish circle backdrop (not full canvas) -->
  <circle cx="145" cy="120" r="105" fill="#f5e7c4" stroke="#000000" stroke-width="3"/>

  <!-- ROD (bacillus) - left -->
  <rect x="35" y="100" width="70" height="32" rx="16" ry="16" fill="#529929" stroke="#000000" stroke-width="3.5"/>
  <!-- flagellum -->
  <path d="M 35 116 Q 22 110 18 120 Q 14 130 22 132" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- inner detail -->
  <circle cx="55" cy="116" r="4" fill="#67832d" stroke="#000000" stroke-width="2"/>
  <circle cx="85" cy="116" r="4" fill="#67832d" stroke="#000000" stroke-width="2"/>

  <!-- SPIRAL (spirochete) - right -->
  <path d="M 175 90 Q 200 105 175 120 Q 150 135 175 150 Q 200 165 175 180" fill="none" stroke="#7c3fac" stroke-width="11" stroke-linecap="round"/>
  <path d="M 175 90 Q 200 105 175 120 Q 150 135 175 150 Q 200 165 175 180" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 175 90 Q 200 105 175 120 Q 150 135 175 150 Q 200 165 175 180" fill="none" stroke="#7c3fac" stroke-width="7" stroke-linecap="round"/>

  <!-- COCCI (cluster of round bacteria) - bottom -->
  <circle cx="100" cy="180" r="14" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <circle cx="120" cy="195" r="14" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <circle cx="85" cy="200" r="14" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <circle cx="110" cy="170" r="14" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- nucleoid dots in cocci -->
  <circle cx="100" cy="180" r="4" fill="#e65a00"/>
  <circle cx="120" cy="195" r="4" fill="#e65a00"/>
  <circle cx="85" cy="200" r="4" fill="#e65a00"/>
  <circle cx="110" cy="170" r="4" fill="#e65a00"/>

  <!-- magnifying ring detail (top) - small dot to indicate microscopy -->
  <circle cx="230" cy="55" r="14" fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M 240 65 L 252 77" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
