<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Bar dip: figure on parallel bars, arms bent, body dipped down -->
  <!-- Left parallel bar -->
  <line x1="60" y1="62" x2="60" y2="160" stroke="#4d4d4d" stroke-width="8" stroke-linecap="round"/>
  <!-- Left bar horizontal grip section -->
  <line x1="60" y1="62" x2="60" y2="62" stroke="#4d4d4d" stroke-width="8" stroke-linecap="round"/>
  <!-- Right parallel bar -->
  <line x1="230" y1="62" x2="230" y2="160" stroke="#4d4d4d" stroke-width="8" stroke-linecap="round"/>
  <!-- Left support post to floor -->
  <line x1="60" y1="160" x2="50" y2="210" stroke="#4d4d4d" stroke-width="7" stroke-linecap="round"/>
  <line x1="60" y1="160" x2="72" y2="210" stroke="#4d4d4d" stroke-width="7" stroke-linecap="round"/>
  <!-- Right support post to floor -->
  <line x1="230" y1="160" x2="220" y2="210" stroke="#4d4d4d" stroke-width="7" stroke-linecap="round"/>
  <line x1="230" y1="160" x2="242" y2="210" stroke="#4d4d4d" stroke-width="7" stroke-linecap="round"/>
  <!-- Cross brace at bottom -->
  <line x1="50" y1="208" x2="242" y2="208" stroke="#4d4d4d" stroke-width="6" stroke-linecap="round"/>
  <!-- Horizontal grip bars -->
  <line x1="40" y1="62" x2="106" y2="62" stroke="#4d4d4d" stroke-width="10" stroke-linecap="round"/>
  <line x1="184" y1="62" x2="250" y2="62" stroke="#4d4d4d" stroke-width="10" stroke-linecap="round"/>
  <!-- Figure: body suspended between bars, arms bent (dipped down) -->
  <!-- Head -->
  <circle cx="145" cy="68" r="16" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Torso hanging between bars, dipped low -->
  <rect x="127" y="86" width="36" height="54" rx="8" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm: bent at elbow, hand on left bar -->
  <path d="M127 96 Q90 80 76 62" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm: bent at elbow, hand on right bar -->
  <path d="M163 96 Q210 80 216 62" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hands gripping bars -->
  <ellipse cx="76" cy="62" rx="8" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <ellipse cx="216" cy="62" rx="8" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Legs hanging, slightly bent (knees tucked or ankles crossed) -->
  <path d="M134 140 l-8 36 l10 0" fill="none" stroke="#4d4d4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M156 140 l8 36 l-10 0" fill="none" stroke="#4d4d4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ground line -->
  <line x1="20" y1="212" x2="270" y2="212" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
