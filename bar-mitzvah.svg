  <!-- Boy full body in suit, kippah, tallit, holding open Torah scroll -->
  <!-- Legs (suit trousers) -->
  <rect x="118" y="170" width="22" height="50" fill="#392170" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="150" y="170" width="22" height="50" fill="#392170" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="129" cy="222" rx="14" ry="6" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="161" cy="222" rx="14" ry="6" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- Tallit (prayer shawl) draped behind shoulders, wider than torso -->
  <path d="M88 110 L202 110 L210 175 L80 175 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Tallit stripes -->
  <rect x="86" y="120" width="118" height="4" fill="#2a4ec0" stroke="#000000" stroke-width="1.5"/>
  <rect x="84" y="160" width="122" height="4" fill="#2a4ec0" stroke="#000000" stroke-width="1.5"/>
  <!-- Suit jacket (torso) -->
  <path d="M108 110 L182 110 L178 175 L112 175 Z" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- White shirt V -->
  <path d="M135 110 L145 135 L155 110 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Arms holding scroll forward -->
  <path d="M108 115 L82 150 L92 178 L112 165 Z" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M182 115 L208 150 L198 178 L178 165 Z" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Hands -->
  <circle cx="86" cy="170" r="9" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <circle cx="204" cy="170" r="9" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <!-- Head -->
  <circle cx="145" cy="78" r="30" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Hair fringe -->
  <path d="M118 70 Q130 56 145 60 Q160 56 172 70 Q165 64 145 66 Q125 64 118 70 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="136" cy="78" r="2.5" fill="#000000"/>
  <circle cx="154" cy="78" r="2.5" fill="#000000"/>
  <!-- Smile -->
  <path d="M138 90 Q145 96 152 90" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Kippah on head -->
  <path d="M128 56 Q145 40 162 56 Z" fill="#1d0e82" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Open Torah scroll held forward -->
  <!-- Left roller -->
  <rect x="78" y="158" width="10" height="40" fill="#9d7246" stroke="#000000" stroke-width="2.5"/>
  <circle cx="83" cy="156" r="6" fill="#7d5e23" stroke="#000000" stroke-width="2.5"/>
  <circle cx="83" cy="200" r="6" fill="#7d5e23" stroke="#000000" stroke-width="2.5"/>
  <!-- Right roller -->
  <rect x="202" y="158" width="10" height="40" fill="#9d7246" stroke="#000000" stroke-width="2.5"/>
  <circle cx="207" cy="156" r="6" fill="#7d5e23" stroke="#000000" stroke-width="2.5"/>
  <circle cx="207" cy="200" r="6" fill="#7d5e23" stroke="#000000" stroke-width="2.5"/>
  <!-- Parchment -->
  <rect x="88" y="160" width="114" height="36" fill="#f5e7c4" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Hebrew text lines (abstract) -->
  <rect x="95" y="167" width="100" height="2" fill="#000000"/>
  <rect x="95" y="174" width="100" height="2" fill="#000000"/>
  <rect x="95" y="181" width="100" height="2" fill="#000000"/>
  <rect x="95" y="188" width="80" height="2" fill="#000000"/>
</svg>
