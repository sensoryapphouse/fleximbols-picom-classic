  <!-- Barre class: figure at ballet barre, leg in tendu/extension, mirror behind -->
  <!-- Mirror on wall (rear) -->
  <rect x="20" y="20" width="80" height="150" rx="4" ry="4" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Mirror frame detail -->
  <rect x="24" y="24" width="72" height="142" rx="2" ry="2" fill="none" stroke="#b8b8b8" stroke-width="2"/>
  <!-- Mirror reflection hint (simplified figure outline) -->
  <circle cx="60" cy="64" r="12" fill="none" stroke="#b8b8b8" stroke-width="2"/>
  <path d="M 52,76 L 52,120 L 68,120 L 68,76 Z" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linejoin="round"/>
  <!-- Wall -->
  <path d="M 20,170 L 270,170" stroke="#9d7246" stroke-width="3" stroke-linecap="round" stroke-dasharray="8,4"/>
  <!-- Floor -->
  <path d="M 20,220 L 270,220" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Barre support post -->
  <rect x="96" y="100" width="10" height="120" rx="4" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Barre wall bracket (top) -->
  <rect x="94" y="98" width="14" height="8" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Barre horizontal rail -->
  <rect x="100" y="100" width="165" height="10" rx="5" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Standing left leg -->
  <path d="M 172,160 L 166,220 L 184,220 L 186,163 Z" fill="#f4a4b2" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Standing foot with ballet shoe -->
  <ellipse cx="175" cy="220" rx="14" ry="6" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <!-- Right leg extended in tendu to the right -->
  <path d="M 186,163 Q 210,155 240,148 Q 252,145 260,142" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 184,162 Q 208,154 238,147 Q 250,143 258,140 L 262,150 Q 248,152 222,159 Q 196,166 188,172 Z" fill="#f4a4b2" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Pointed foot of extended leg -->
  <ellipse cx="262" cy="144" rx="11" ry="6" fill="#eed5b6" stroke="#000000" stroke-width="3" transform="rotate(-15 262 144)"/>
  <!-- Torso -->
  <path d="M 168,105 Q 168,97 180,95 Q 192,97 192,105 L 190,162 L 166,162 Z" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm holding barre -->
  <path d="M 168,115 Q 148,112 124,108 L 126,118 Q 150,122 170,125 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Hand on barre -->
  <ellipse cx="117" cy="108" rx="10" ry="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right arm raised gracefully overhead -->
  <path d="M 192,115 Q 210,96 222,76 L 214,70 Q 202,90 184,109 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right hand -->
  <circle cx="218" cy="68" r="9" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Head -->
  <circle cx="180" cy="72" r="22" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair bun -->
  <path d="M 160,66 Q 162,50 180,50 Q 198,50 200,64 Q 190,56 180,57 Q 170,56 160,66 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="180" cy="50" r="9" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Eyes -->
  <ellipse cx="172" cy="72" rx="3" ry="3.5" fill="#000000"/>
  <ellipse cx="188" cy="72" rx="3" ry="3.5" fill="#000000"/>
  <!-- Smile -->
  <path d="M 171,84 Q 180,90 189,84" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
