  <!-- Barre plie: figure at barre, knees bent turned-out, feet in 2nd position, holding barre -->
  <!-- Floor -->
  <path d="M 20,222 L 270,222" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Barre support post (left wall) -->
  <rect x="22" y="90" width="10" height="132" rx="4" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Barre horizontal rail -->
  <rect x="28" y="90" width="185" height="10" rx="5" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Figure: torso upright, plie position -->
  <!-- Torso (upright, centered) -->
  <path d="M 138,88 Q 138,80 150,78 Q 162,80 162,88 L 162,152 L 138,152 Z" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hips -->
  <path d="M 136,152 Q 150,160 164,152 L 162,156 Q 150,164 138,156 Z" fill="#7c3fac" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left leg (turned out, knee bent to left) -->
  <path d="M 140,154 Q 114,166 96,178 Q 84,186 74,198" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 138,152 Q 112,164 94,176 Q 82,184 72,196 L 84,204 Q 92,192 104,184 Q 122,172 148,160 Z" fill="#f4a4b2" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left foot turned out (2nd position, heel down) -->
  <ellipse cx="76" cy="202" rx="14" ry="7" fill="#f4a4b2" stroke="#000000" stroke-width="3" transform="rotate(-30 76 202)"/>
  <!-- Right leg (turned out, knee bent to right) -->
  <path d="M 162,154 Q 186,166 204,178 Q 216,186 226,198" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 160,152 Q 184,164 202,176 Q 214,184 224,196 L 236,188 Q 224,176 212,168 Q 194,156 166,144 Z" fill="#f4a4b2" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right foot turned out -->
  <ellipse cx="230" cy="192" rx="14" ry="7" fill="#f4a4b2" stroke="#000000" stroke-width="3" transform="rotate(30 230 192)"/>
  <!-- Left arm extended to barre (left) -->
  <path d="M 140,104 Q 106,98 72,96 L 70,106 Q 104,108 138,114 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Hand on barre -->
  <ellipse cx="63" cy="100" rx="10" ry="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right arm raised to side (second position arm) -->
  <path d="M 162,104 Q 196,94 224,80 L 220,70 Q 192,84 160,94 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right hand -->
  <circle cx="222" cy="74" r="9" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Head -->
  <circle cx="150" cy="56" r="22" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair bun -->
  <path d="M 130,50 Q 132,34 150,34 Q 168,34 170,48 Q 160,40 150,41 Q 140,40 130,50 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="150" cy="34" r="9" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Eyes -->
  <ellipse cx="142" cy="56" rx="3" ry="3.5" fill="#000000"/>
  <ellipse cx="158" cy="56" rx="3" ry="3.5" fill="#000000"/>
  <!-- Smile -->
  <path d="M 141,68 Q 150,75 159,68" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Small turnout indicators at feet (dashes showing heel position) -->
  <path d="M 68,218 L 84,210" stroke="#b8b8b8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 220,206 L 236,214" stroke="#b8b8b8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
