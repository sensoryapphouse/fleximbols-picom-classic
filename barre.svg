  <path d="M 126,98 Q 98,108 68,120 L 72,130 Q 100,118 130,108 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Hand on barre -->
  <ellipse cx="60" cy="124" rx="10" ry="8" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
