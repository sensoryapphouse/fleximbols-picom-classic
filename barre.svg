  <path d="M 162,100 Q 185,80 200,62" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 160,98 Q 183,78 198,60 L 206,66 Q 190,84 168,104 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
