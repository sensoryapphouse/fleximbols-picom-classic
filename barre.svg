  <rect x="28" y="118" width="16" height="8" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Barre horizontal bar -->
  <rect x="42" y="118" width="110" height="10" rx="5" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Standing left leg -->
  <path d="M 128,162 L 122,218 L 140,218 L 142,165 Z" fill="#f4a4b2" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Raised right leg extended to right and back, arabesque style -->
  <path d="M 148,162 Q 165,155 195,148 Q 210,144 218,140" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 146,160 Q 163,153 193,146 Q 208,142 216,138 L 220,148 Q 206,150 180,158 Q 162,164 150,168 Z" fill="#f4a4b2" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Pointed foot of raised leg -->
  <ellipse cx="220" cy="140" rx="10" ry="6" fill="#eed5b6" stroke="#000000" stroke-width="3" transform="rotate(-20 220 140)"/>
  <!-- Standing foot + ballet shoe -->
  <ellipse cx="131" cy="218" rx="13" ry="6" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <!-- Torso -->
  <path d="M 126,88 Q 126,80 145,78 Q 164,80 164,88 L 162,162 L 128,162 Z" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
