  <!-- COUNTER / BAR -->
  <rect x="40" y="188" width="220" height="18" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Bar front panel -->
  <rect x="40" y="200" width="220" height="22" rx="4" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- PERSON (waist-up behind bar) -->
  <!-- Torso / waistcoat -->
  <rect x="108" y="128" width="64" height="62" rx="8" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- White shirt front -->
  <rect x="124" y="128" width="32" height="50" rx="4" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left arm (pouring) -->
  <line x1="108" y1="145" x2="78" y2="162" stroke="#eed5b6" stroke-width="14" stroke-linecap="round"/>
  <!-- Right arm (holding shaker up) -->
  <line x1="172" y1="142" x2="196" y2="118" stroke="#eed5b6" stroke-width="14" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="140" cy="106" r="26" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Eyes -->
  <circle cx="131" cy="103" r="3" fill="#000000"/>
  <circle cx="149" cy="103" r="3" fill="#000000"/>
  <!-- Smile -->
  <path d="M133 114 Q140 120 147 114" stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Hair -->
  <path d="M115 98 Q120 80 140 78 Q160 80 165 98" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Bow tie -->
  <polygon points="132,128 140,134 148,128 140,122" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- COCKTAIL SHAKER (right hand, raised) -->
  <rect x="193" y="96" width="22" height="42" rx="8" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shaker cap -->
  <rect x="196" y="90" width="16" height="10" rx="4" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- GLASS on bar (left side, being poured into) -->
  <!-- Pour stream from left hand -->
  <path d="M78 162 Q72 174 74 184" stroke="#f7de58" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Glass -->
  <path d="M60 168 L66 196 L92 196 L98 168 Z" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Liquid in glass -->
  <path d="M63 180 L66 196 L92 196 L95 180 Z" fill="#f7de58" stroke="none"/>
  <!-- Stem + base -->
  <rect x="72" y="196" width="16" height="6" rx="2" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="80" cy="205" rx="16" ry="5" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

