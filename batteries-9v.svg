<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- 9V battery: rectangular block with dual terminals (one + snap, one - snap) on top -->
  <!-- Body (rectangular, tall) -->
  <rect x="80" y="60" width="130" height="160" rx="6" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Coloured wrap label -->
  <rect x="88" y="80" width="114" height="130" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Top plate -->
  <rect x="80" y="48" width="130" height="14" rx="3" ry="3" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Positive snap terminal (hexagonal-ish post) -->
  <circle cx="115" cy="40" r="13" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <circle cx="115" cy="40" r="6" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <!-- Negative snap terminal (cup/socket) -->
  <circle cx="175" cy="40" r="11" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <circle cx="175" cy="40" r="5" fill="#efefef" stroke="#000000" stroke-width="2"/>
  <!-- Plus / minus labels next to terminals -->
  <line x1="112" y1="22" x2="118" y2="22" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="115" y1="19" x2="115" y2="25" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="172" y1="22" x2="178" y2="22" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- '9V' label as paths on body -->
  <!-- 9 -->
  <circle cx="125" cy="125" r="13" fill="none" stroke="#fff200" stroke-width="5"/>
  <line x1="138" y1="125" x2="138" y2="160" stroke="#fff200" stroke-width="5" stroke-linecap="round"/>
  <line x1="138" y1="160" x2="128" y2="170" stroke="#fff200" stroke-width="5" stroke-linecap="round"/>
  <!-- V -->
  <line x1="155" y1="110" x2="170" y2="160" stroke="#fff200" stroke-width="6" stroke-linecap="round"/>
  <line x1="185" y1="110" x2="170" y2="160" stroke="#fff200" stroke-width="6" stroke-linecap="round"/>
  <!-- Brand band at bottom -->
  <rect x="88" y="185" width="114" height="14" fill="#fff200" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
</svg>
