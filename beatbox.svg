  <!-- Face performing beatbox: mouth open with percussive burst, microphone nearby -->
  <!-- Head -->
  <circle cx="118" cy="112" r="72" fill="#eed5b6" stroke="#000000" stroke-width="5"/>

  <!-- Eyes: focused/intense wide eyes -->
  <ellipse cx="95" cy="95" rx="12" ry="13" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="97" cy="97" r="7" fill="#1d0e82"/>
  <circle cx="99" cy="95" r="2" fill="#ffffff"/>

  <ellipse cx="141" cy="95" rx="12" ry="13" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="143" cy="97" r="7" fill="#1d0e82"/>
  <circle cx="145" cy="95" r="2" fill="#ffffff"/>

  <!-- Raised eyebrows (intense) -->
  <path d="M 82 78 Q 95 70 108 76" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 128 76 Q 141 70 154 78" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Open mouth making percussive shape -->
  <path d="M 90 140 Q 88 130 95 124 Q 118 118 141 124 Q 148 130 146 140 Q 130 155 118 156 Q 105 155 90 140 Z" fill="#d01424" stroke="#000000" stroke-width="5"/>
  <!-- Teeth top -->
  <path d="M 95 124 Q 118 130 141 124" fill="none" stroke="#000000" stroke-width="3"/>
  <!-- Teeth visible (white) -->
  <rect x="97" y="124" width="14" height="9" rx="2" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="113" y="124" width="14" height="9" rx="2" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="129" y="124" width="10" height="9" rx="2" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Tongue -->
  <ellipse cx="118" cy="146" rx="18" ry="9" fill="#f8130d" stroke="#000000" stroke-width="3"/>

  <!-- Percussive sound burst shapes (bold spiky) from mouth -->
  <polygon points="160,112 170,100 165,115 178,108 167,120 182,118 168,128 178,140 162,132 165,148 155,135 148,150 148,133 135,145 145,128" fill="#f7de58" stroke="#000000" stroke-width="3"/>

  <!-- Additional burst lines -->
  <line x1="182" y1="95" x2="200" y2="80" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="190" y1="115" x2="212" y2="110" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="185" y1="138" x2="205" y2="148" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Musical notes (rhythm) -->
  <ellipse cx="210" cy="72" rx="8" ry="6" fill="#000000" transform="rotate(-20,210,72)"/>
  <line x1="218" y1="68" x2="218" y2="48" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <ellipse cx="232" cy="85" rx="7" ry="5" fill="#000000" transform="rotate(-20,232,85)"/>
  <line x1="239" y1="82" x2="239" y2="62" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 239 62 Q 252 66 250 78" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Microphone (handheld near mouth, bottom right area) -->
  <rect x="228" y="140" width="22" height="36" rx="11" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <ellipse cx="239" cy="140" rx="12" ry="12" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <!-- Mic grille lines -->
  <line x1="228" y1="140" x2="250" y2="140" stroke="#000000" stroke-width="2"/>
  <line x1="227" y1="148" x2="251" y2="148" stroke="#000000" stroke-width="2"/>
  <!-- Mic handle -->
  <rect x="232" y="176" width="14" height="28" rx="5" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
</svg>
