  <!-- Rope path from top-left down to belay device -->
  <path d="M 80 30 C 80 80 110 90 120 130 C 130 160 125 180 130 200" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Belayer body: legs -->
  <line x1="155" y1="175" x2="140" y2="220" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="155" y1="175" x2="170" y2="220" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Belayer torso -->
  <line x1="155" y1="120" x2="155" y2="175" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Belayer head -->
  <circle cx="155" cy="105" r="16" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Helmet -->
  <path d="M 140 102 Q 155 83 170 102" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Belayer left arm reaching up holding rope -->
  <line x1="155" y1="135" x2="130" y2="155" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Belayer right arm down feeding rope -->
  <line x1="155" y1="135" x2="178" y2="160" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left hand -->
  <circle cx="130" cy="155" r="5" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right hand -->
  <circle cx="178" cy="160" r="5" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Belay device on harness -->
  <rect x="148" y="170" width="14" height="10" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Harness waist band -->
  <path d="M 138 168 Q 155 163 172 168" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rope continuing through device -->
  <path d="M 130 155 Q 145 165 148 175 Q 152 185 130 200" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rock wall on left -->
  <path d="M 60 20 L 60 220 Q 70 215 75 220 Q 80 215 85 220" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wall texture cracks -->
  <path d="M 60 70 L 75 80 L 65 95" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 60 140 L 78 148" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Anchor bolt at top of wall -->
  <circle cx="70" cy="32" r="5" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rope anchor line -->
  <line x1="70" y1="37" x2="80" y2="30" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Climber on wall: feet -->
  <line x1="95" y1="80" x2="82" y2="95" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="95" y1="80" x2="95" y2="100" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Climber torso -->
  <line x1="95" y1="45" x2="95" y2="80" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Climber head -->
  <circle cx="95" cy="32" r="13" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Climber helmet -->
  <path d="M 83 30 Q 95 16 107 30" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Climber arms reaching holds -->
  <line x1="95" y1="58" x2="78" y2="45" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="95" y1="58" x2="112" y2="50" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Foot holds -->
  <rect x="79" y="94" width="8" height="5" rx="2" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="93" y="99" width="8" height="5" rx="2" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hand holds -->
  <rect x="72" y="40" width="9" height="6" rx="2" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="110" y="44" width="9" height="6" rx="2" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
