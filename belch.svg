  <!-- Ground line -->
  <line x1="40" y1="228" x2="250" y2="228" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs (wide stance - force) -->
  <line x1="125" y1="228" x2="130" y2="185" stroke="#eed5b6" stroke-width="16" stroke-linecap="round"/>
  <line x1="165" y1="228" x2="160" y2="185" stroke="#eed5b6" stroke-width="16" stroke-linecap="round"/>
  <!-- Trousers -->
  <rect x="122" y="178" width="46" height="22" rx="7" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Torso (head-back posture - chest out) -->
  <rect x="122" y="128" width="46" height="52" rx="10" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm (out to side slightly) -->
  <line x1="122" y1="143" x2="96" y2="158" stroke="#eed5b6" stroke-width="13" stroke-linecap="round"/>
  <!-- Right arm (out to side) -->
  <line x1="168" y1="143" x2="194" y2="158" stroke="#eed5b6" stroke-width="13" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="92" cy="161" r="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <circle cx="198" cy="161" r="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head tilted back -->
  <circle cx="145" cy="106" r="28" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M118 102 Q122 80 145 78 Q168 80 172 102" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Eyes - squinting/forced effort -->
  <path d="M132 103 Q138 99 144 103" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M147 103 Q153 99 159 103" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Mouth WIDE open (belch) -->
  <path d="M132 116 Q145 132 158 116" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M132 116 Q145 122 158 116" fill="#f8130d" stroke="none"/>
  <!-- Teeth visible -->
  <path d="M134 118 Q145 126 156 118" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <!-- Large burst of air bubbles from wide mouth -->
  <!-- Main large bubble -->
  <circle cx="145" cy="85" r="14" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <!-- Medium bubble left -->
  <circle cx="126" cy="74" r="10" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <!-- Medium bubble right -->
  <circle cx="163" cy="72" r="10" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <!-- Smaller bubbles -->
  <circle cx="140" cy="62" r="7" fill="#dff3fd" stroke="#000000" stroke-width="2.5"/>
  <circle cx="157" cy="57" r="6" fill="#dff3fd" stroke="#000000" stroke-width="2.5"/>
  <circle cx="124" cy="60" r="5" fill="#dff3fd" stroke="#000000" stroke-width="2.5"/>
  <!-- Tiny spray bubbles -->
  <circle cx="168" cy="82" r="4" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <circle cx="108" cy="82" r="4" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <circle cx="145" cy="50" r="4" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
