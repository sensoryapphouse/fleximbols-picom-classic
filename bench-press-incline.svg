<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Incline bench: head-end high (~30-40 deg), foot-end low -->
  <!-- Bench surface inclined: foot at (40,190), head at (200,130) -->
  <path d="M40 190 L200 130 L210 142 L50 202 Z" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Bench legs -->
  <line x1="50" y1="196" x2="44" y2="218" stroke="#7d5e23" stroke-width="8" stroke-linecap="round"/>
  <line x1="170" y1="160" x2="170" y2="218" stroke="#7d5e23" stroke-width="8" stroke-linecap="round"/>
  <!-- Back support post -->
  <line x1="200" y1="136" x2="200" y2="218" stroke="#7d5e23" stroke-width="8" stroke-linecap="round"/>
  <!-- Figure lying on incline: head upper-right -->
  <!-- Head -->
  <circle cx="212" cy="118" r="14" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Torso along bench angle -->
  <path d="M90 190 L196 128" fill="none" stroke="#f4a4b2" stroke-width="18" stroke-linecap="round"/>
  <!-- Legs: lower-left, slightly bent -->
  <path d="M90 190 l-28 8 l-8 16" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Foot hook hint -->
  <line x1="54" y1="214" x2="44" y2="214" stroke="#4d4d4d" stroke-width="8" stroke-linecap="round"/>
  <!-- Arms angled up-left from upper torso -->
  <line x1="164" y1="122" x2="138" y2="82" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <line x1="190" y1="112" x2="164" y2="72" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <!-- Barbell shaft perpendicular to body (angled) -->
  <line x1="68" y1="60" x2="232" y2="60" stroke="#4d4d4d" stroke-width="7" stroke-linecap="round"/>
  <!-- Plates left -->
  <rect x="68" y="44" width="14" height="32" rx="6" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Plates right -->
  <rect x="218" y="44" width="14" height="32" rx="6" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Plate holes -->
  <circle cx="75" cy="60" r="5" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <circle cx="225" cy="60" r="5" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- Ground line -->
  <line x1="20" y1="220" x2="270" y2="220" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
