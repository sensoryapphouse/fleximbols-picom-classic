  <!-- outer bento box (lacquer red) -->
  <rect x="25" y="40" width="240" height="170" rx="10" ry="10"
        fill="#d01424" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- inner tray -->
  <rect x="35" y="50" width="220" height="150" rx="6" ry="6"
        fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- left compartment: rice -->
  <rect x="45" y="60" width="95" height="130" rx="4" ry="4"
        fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- rice grain hints -->
  <ellipse cx="65" cy="80" rx="3" ry="2" fill="#efefef" stroke="#000000" stroke-width="1.5"/>
  <ellipse cx="85" cy="95" rx="3" ry="2" fill="#efefef" stroke="#000000" stroke-width="1.5"/>
  <ellipse cx="110" cy="85" rx="3" ry="2" fill="#efefef" stroke="#000000" stroke-width="1.5"/>
  <ellipse cx="75" cy="120" rx="3" ry="2" fill="#efefef" stroke="#000000" stroke-width="1.5"/>
  <ellipse cx="100" cy="135" rx="3" ry="2" fill="#efefef" stroke="#000000" stroke-width="1.5"/>
  <ellipse cx="120" cy="120" rx="3" ry="2" fill="#efefef" stroke="#000000" stroke-width="1.5"/>
  <ellipse cx="60" cy="155" rx="3" ry="2" fill="#efefef" stroke="#000000" stroke-width="1.5"/>
  <ellipse cx="90" cy="170" rx="3" ry="2" fill="#efefef" stroke="#000000" stroke-width="1.5"/>
  <ellipse cx="115" cy="170" rx="3" ry="2" fill="#efefef" stroke="#000000" stroke-width="1.5"/>
  <!-- umeboshi plum on rice -->
  <circle cx="92" cy="120" r="10" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <!-- right top: sushi/nigiri pieces -->
  <rect x="150" y="60" width="100" height="60" rx="4" ry="4"
        fill="#f5e7c4" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- nigiri 1: rice oval with salmon top -->
  <ellipse cx="175" cy="90" rx="18" ry="11" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="175" cy="85" rx="18" ry="7" fill="#ff9900" stroke="#000000" stroke-width="3"/>
  <line x1="160" y1="84" x2="190" y2="84" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="162" y1="88" x2="188" y2="88" stroke="#ffffff" stroke-width="1.5"/>
  <!-- nigiri 2: rice oval with tuna -->
  <ellipse cx="220" cy="90" rx="18" ry="11" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="220" cy="85" rx="18" ry="7" fill="#d01424" stroke="#000000" stroke-width="3"/>
  <!-- right bottom: vegetables compartment -->
  <rect x="150" y="130" width="100" height="60" rx="4" ry="4"
        fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- broccoli -->
  <circle cx="170" cy="155" r="8" fill="#529929" stroke="#000000" stroke-width="3"/>
  <circle cx="178" cy="148" r="6" fill="#67832d" stroke="#000000" stroke-width="3"/>
  <circle cx="163" cy="148" r="6" fill="#67832d" stroke="#000000" stroke-width="3"/>
  <rect x="167" y="160" width="6" height="10" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <!-- carrot slices -->
  <circle cx="210" cy="155" r="9" fill="#ff9900" stroke="#000000" stroke-width="3"/>
  <circle cx="210" cy="155" r="4" fill="#e65a00" stroke="#000000" stroke-width="1.5"/>
  <circle cx="235" cy="170" r="8" fill="#ff9900" stroke="#000000" stroke-width="3"/>
  <circle cx="235" cy="170" r="3.5" fill="#e65a00" stroke="#000000" stroke-width="1.5"/>
  <!-- yellow pickle -->
  <rect x="200" y="175" width="22" height="8" fill="#f2e40d" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
