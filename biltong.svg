  <!-- Biltong: thicker, chunkier South African dried meat strips (thicker than jerky) + 'BILTONG' label -->

  <!-- Hanging string at top (biltong is traditionally air-dried, hung) -->
  <line x1="40" y1="22" x2="250" y2="22" stroke="#7d5e23" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Strip 1 (thick chunk, dark, hanging by a string clip on top) -->
  <path d="M62,22 L66,30" stroke="#7d5e23" stroke-width="2" stroke-linecap="round"/>
  <path d="M60,32 Q56,30 56,34 L52,90 Q52,104 70,108 Q88,104 88,90 L84,34 Q84,30 80,32 Q72,38 60,32 Z" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Tough texture lines -->
  <path d="M58,46 Q70,42 84,46" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M58,58 Q70,54 84,58" fill="none" stroke="#7d5e23" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M58,72 Q70,68 84,72" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M58,86 Q70,82 84,86" fill="none" stroke="#7d5e23" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Fat seam on edge (signature biltong feature) -->
  <path d="M54,40 Q52,70 56,100" fill="none" stroke="#f5e7c4" stroke-width="3" stroke-linecap="round"/>

  <!-- Strip 2 (centre, thicker) -->
  <path d="M142,22 L146,32" stroke="#7d5e23" stroke-width="2" stroke-linecap="round"/>
  <path d="M138,34 Q132,32 132,38 L128,110 Q128,128 150,134 Q172,128 172,110 L168,38 Q168,32 162,34 Q150,40 138,34 Z" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M132,52 Q150,48 168,52" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M132,68 Q150,64 168,68" fill="none" stroke="#5e1f0a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M132,84 Q150,80 168,84" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M132,100 Q150,96 168,100" fill="none" stroke="#5e1f0a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M130,46 Q128,84 132,122" fill="none" stroke="#f5e7c4" stroke-width="3" stroke-linecap="round"/>

  <!-- Strip 3 (right) -->
  <path d="M218,22 L222,30" stroke="#7d5e23" stroke-width="2" stroke-linecap="round"/>
  <path d="M216,32 Q210,30 210,34 L206,96 Q206,112 226,116 Q246,112 246,96 L242,34 Q242,30 238,32 Q228,38 216,32 Z" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M212,48 Q226,44 242,48" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M212,62 Q226,58 242,62" fill="none" stroke="#7d5e23" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M212,76 Q226,72 242,76" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M212,92 Q226,88 242,92" fill="none" stroke="#7d5e23" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M208,42 Q206,78 212,108" fill="none" stroke="#f5e7c4" stroke-width="3" stroke-linecap="round"/>

  <!-- Plate or block underneath to ground the composition (small dish hint) -->
  <path d="M50,222 Q145,228 240,222" fill="none" stroke="#9d7246" stroke-width="3" stroke-linecap="round"/>
</svg>
