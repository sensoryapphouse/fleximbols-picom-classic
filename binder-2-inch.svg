  <!-- medium profile binder, thicker spine than 1-inch -->
  <!-- main cover -->
  <rect x="80" y="30" width="130" height="180" rx="3" fill="#d01424" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- thicker spine (2 inch) -->
  <rect x="80" y="30" width="44" height="180" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- recolor spine using palette colour -->
  <rect x="80" y="30" width="44" height="180" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- spine edge -->
  <line x1="124" y1="30" x2="124" y2="210" stroke="#000000" stroke-width="3"/>
  <!-- label on spine -->
  <rect x="86" y="75" width="32" height="90" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <line x1="90" y1="90" x2="114" y2="90" stroke="#7f7f7f" stroke-width="1"/>
  <line x1="90" y1="100" x2="114" y2="100" stroke="#7f7f7f" stroke-width="1"/>
  <line x1="90" y1="110" x2="114" y2="110" stroke="#7f7f7f" stroke-width="1"/>
  <line x1="90" y1="120" x2="114" y2="120" stroke="#7f7f7f" stroke-width="1"/>
  <line x1="90" y1="130" x2="114" y2="130" stroke="#7f7f7f" stroke-width="1"/>
  <line x1="90" y1="140" x2="114" y2="140" stroke="#7f7f7f" stroke-width="1"/>
  <line x1="90" y1="150" x2="114" y2="150" stroke="#7f7f7f" stroke-width="1"/>
  <!-- size badge "2 inch" -->
  <rect x="140" y="100" width="65" height="40" rx="6" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- 2 numeral as path -->
  <path d="M 152 112 Q 152 106 160 106 Q 170 106 170 114 Q 170 122 152 132 L 172 132" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- inch tick marks -->
  <line x1="183" y1="115" x2="183" y2="125" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="115" x2="190" y2="125" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="197" y1="115" x2="197" y2="125" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- width indicator at top (wider than 1-inch) -->
  <path d="M 80 20 L 124 20" fill="none" stroke="#1d0e82" stroke-width="3" stroke-linecap="round"/>
  <path d="M 80 18 L 80 22" stroke="#1d0e82" stroke-width="3" stroke-linecap="round"/>
  <path d="M 124 18 L 124 22" stroke="#1d0e82" stroke-width="3" stroke-linecap="round"/>
</svg>
