  <g>
    <!-- Neck -->
    <polygon points="120,195 125,230 165,230 170,195 158,200 145,202 132,200" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Head -->
    <ellipse cx="145" cy="110" rx="75" ry="85" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Left ear -->
    <ellipse cx="70" cy="110" rx="14" ry="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Right ear -->
    <ellipse cx="220" cy="110" rx="14" ry="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Hair -->
    <path d="M80,80 Q90,25 145,20 Q200,25 210,80 Q195,45 145,42 Q95,45 80,80 Z" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Left eye -->
    <ellipse cx="115" cy="95" rx="10" ry="11" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <circle cx="116" cy="96" r="5" fill="#000000"/>
    <!-- Right eye -->
    <ellipse cx="175" cy="95" rx="10" ry="11" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <circle cx="176" cy="96" r="5" fill="#000000"/>
    <!-- Eyebrows slightly furrowed -->
    <polyline points="104,82 117,78" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <polyline points="163,78 176,82" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M141,108 Q137,120 133,123 Q140,126 145,124 Q150,126 157,123 Q153,120 149,108" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- Open mouth biting down — top lip raised, bottom lip down, teeth showing -->
    <path d="M112,145 Q118,138 145,137 Q172,138 178,145 Q172,152 145,154 Q118,152 112,145 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Upper teeth row -->
    <line x1="118" y1="144" x2="118" y2="138" stroke="#000000" stroke-width="2"/>
    <line x1="128" y1="142" x2="128" y2="137" stroke="#000000" stroke-width="2"/>
    <line x1="138" y1="141" x2="138" y2="137" stroke="#000000" stroke-width="2"/>
    <line x1="152" y1="141" x2="152" y2="137" stroke="#000000" stroke-width="2"/>
    <line x1="162" y1="142" x2="162" y2="138" stroke="#000000" stroke-width="2"/>
    <line x1="172" y1="144" x2="172" y2="139" stroke="#000000" stroke-width="2"/>
    <!-- Tongue hint -->
    <ellipse cx="145" cy="151" rx="18" ry="6" fill="#f8130d" stroke="#000000" stroke-width="3"/>
    <!-- Food item — apple red -->
    <ellipse cx="145" cy="185" rx="28" ry="20" fill="#f8130d" stroke="#000000" stroke-width="5"/>
    <!-- Bite mark indentation on food -->
    <path d="M118,175 Q128,168 145,167 Q162,168 172,175" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <!-- Apple leaf -->
    <path d="M145,165 Q152,155 158,158 Q155,162 145,165 Z" fill="#529929" stroke="#000000" stroke-width="3"/>
    <!-- Apple stem -->
    <line x1="145" y1="165" x2="147" y2="158" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  </g>
