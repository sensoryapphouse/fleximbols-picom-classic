  <ellipse cx="124" cy="102" rx="12" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="122" cy="102" r="5" fill="#392170" stroke="#000000" stroke-width="2"/>
  <!-- Eyebrows -->
  <path d="M 64 90 Q 76 84 88 90" fill="none" stroke="#5e1f0a" stroke-width="4" stroke-linecap="round"/>
  <path d="M 112 90 Q 124 84 136 90" fill="none" stroke="#5e1f0a" stroke-width="4" stroke-linecap="round"/>
