  <path d="M 90 95 L 90 105 Q 90 108 94 108 Q 98 108 98 105 L 98 95" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- S -->
  <path d="M 110 96 Q 102 96 102 99 Q 102 102 106 102 Q 110 102 110 105 Q 110 108 102 108" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- H -->
  <path d="M 115 95 L 115 108 M 115 101 L 124 101 M 124 95 L 124 108" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- blush brush -->
  <!-- brush handle -->
  <rect x="185" y="55" width="14" height="100" rx="3" fill="#7c3fac" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- ferrule (metal band) -->
  <rect x="183" y="155" width="18" height="10" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
