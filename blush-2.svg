  <line x1="192" y1="170" x2="190" y2="212" stroke="#7f7f7f" stroke-width="1"/>
  <line x1="200" y1="170" x2="202" y2="212" stroke="#7f7f7f" stroke-width="1"/>
  <line x1="207" y1="170" x2="210" y2="208" stroke="#7f7f7f" stroke-width="1"/>
