  <!-- inner powder pan -->
  <ellipse cx="95" cy="160" rx="50" ry="34" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <!-- compact top half (mirror, open at angle) -->
  <ellipse cx="95" cy="75" rx="65" ry="40" fill="#efefef" stroke="#000000" stroke-width="4"/>
