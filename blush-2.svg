  <path d="M 65 60 Q 75 55 85 58" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- hinge between halves -->
  <rect x="80" y="113" width="30" height="8" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- "BLUSH" label drawn as path letters on compact lid edge -->
  <!-- B -->
  <path d="M 65 95 L 65 108 M 65 95 Q 72 95 72 99 Q 72 101 65 101 Q 73 101 73 105 Q 73 108 65 108" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- L -->
  <path d="M 78 95 L 78 108 L 86 108" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
