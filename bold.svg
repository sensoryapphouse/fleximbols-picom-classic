  <!-- Bold: confident upright stance, fists on hips, strong forward look, hero pose -->
  <!-- Body / torso -->
  <rect x="110" y="115" width="70" height="65" rx="8" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm out to hip -->
  <rect x="70" y="115" width="42" height="18" rx="8" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right arm out to hip -->
  <rect x="178" y="115" width="42" height="18" rx="8" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left fist -->
  <ellipse cx="75" cy="142" rx="14" ry="13" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right fist -->
  <ellipse cx="215" cy="142" rx="14" ry="13" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left arm lower -->
  <rect x="68" y="130" width="20" height="20" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right arm lower -->
  <rect x="202" y="130" width="20" height="20" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect x="112" y="178" width="26" height="42" rx="8" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="152" y="178" width="26" height="42" rx="8" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left foot -->
  <ellipse cx="125" cy="222" rx="18" ry="9" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Right foot -->
  <ellipse cx="165" cy="222" rx="18" ry="9" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Neck -->
  <rect x="131" y="95" width="28" height="24" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head -->
  <ellipse cx="145" cy="72" rx="40" ry="38" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="145" cy="40" rx="38" ry="16" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Eyes — strong forward look -->
  <ellipse cx="130" cy="68" rx="7" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="160" cy="68" rx="7" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="132" cy="68" r="4" fill="#000000"/>
  <circle cx="162" cy="68" r="4" fill="#000000"/>
  <!-- Bold eyebrows — strong, angled down toward centre -->
  <line x1="121" y1="58" x2="140" y2="62" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="169" y1="58" x2="150" y2="62" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Determined mouth — flat confident line -->
  <path d="M130 88 Q145 94 160 88" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Chin/jaw shading line -->
  <path d="M122 82 Q145 96 168 82" fill="none" stroke="#e6b98a" stroke-width="2" stroke-linecap="round"/>
</svg>
