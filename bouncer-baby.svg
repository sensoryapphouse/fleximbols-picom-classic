  <!-- baby bouncer: reclining seat on curved rocker frame with baby strapped in -->
  <!-- curved rocker base (left rail) -->
  <path d="M40 200 Q145 240 250 200" fill="none" stroke="#4d4d4d" stroke-width="6" stroke-linecap="round"/>
  <!-- seat support frame -->
  <path d="M60 200 L100 110" fill="none" stroke="#4d4d4d" stroke-width="6" stroke-linecap="round"/>
  <path d="M230 200 L210 90" fill="none" stroke="#4d4d4d" stroke-width="6" stroke-linecap="round"/>
  <!-- reclining seat cushion -->
  <path d="M70 175 L105 100 Q150 80 215 95 L225 175 Z" fill="#f4a4b2" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- seat inner padding -->
  <path d="M85 165 L115 110 Q150 95 205 108 L210 165 Z" fill="#f266aa" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- baby head -->
  <circle cx="170" cy="92" r="26" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- tuft of hair -->
  <path d="M160 70 Q170 62 182 72" fill="#9d7246" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- closed eyes -->
  <path d="M161 92 Q165 95 169 92" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M177 92 Q181 95 185 92" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M168 104 Q173 108 178 104" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="158" cy="100" r="3" fill="#f4a4b2" stroke="none"/>
  <circle cx="188" cy="100" r="3" fill="#f4a4b2" stroke="none"/>
  <!-- baby body (onesie) -->
  <path d="M145 118 Q150 150 160 175 L180 175 Q190 150 195 118 Z" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arms -->
  <path d="M145 128 L120 145" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M195 128 L218 145" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <!-- legs poking out -->
  <path d="M158 175 L150 195" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M182 175 L190 195" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <!-- harness strap -->
  <path d="M165 120 L175 120" fill="none" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <path d="M170 120 L170 145" fill="none" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <!-- dangle toy arch -->
  <path d="M105 100 Q135 60 175 65" fill="none" stroke="#7c3fac" stroke-width="5" stroke-linecap="round"/>
  <circle cx="130" cy="78" r="8" fill="#f2e40d" stroke="#000000" stroke-width="2"/>
  <circle cx="150" cy="68" r="7" fill="#f8130d" stroke="#000000" stroke-width="2"/>
</svg>
