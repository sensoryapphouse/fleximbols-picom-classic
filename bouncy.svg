  <!-- bouncy: ball mid-bounce with arc trajectory dotted line and ground -->
  <!-- Ground line -->
  <line x1="20" y1="210" x2="270" y2="210" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Ground shadow under ball -->
  <ellipse cx="215" cy="210" rx="28" ry="7" fill="#b8b8b8" stroke="none"/>
  <!-- Bounce arc dotted trajectory -->
  <path d="M 45 205 Q 80 90 145 55 Q 200 20 235 195" fill="none" stroke="#000000" stroke-width="3" stroke-dasharray="8,6" stroke-linecap="round"/>
  <!-- Directional arrow on arc -->
  <polygon points="238,185 228,196 242,202" fill="#000000"/>
  <!-- Ball mid-bounce (at peak) -->
  <circle cx="145" cy="55" r="38" fill="#f8130d" stroke="#000000" stroke-width="5"/>
  <!-- Ball shine -->
  <ellipse cx="132" cy="44" rx="12" ry="7" fill="#ffffff" stroke="none"/>
  <!-- Impact squish mark at ground left side -->
  <path d="M 30 210 Q 42 205 54 210" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Small impact lines at bounce point -->
  <line x1="45" y1="206" x2="38" y2="198" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="206" x2="30" y2="202" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="206" x2="52" y2="198" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
