  <!-- Ground line -->
  <line x1="20" y1="210" x2="270" y2="210" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Large bouncy arc (bigger than hop) -->
  <path d="M50,210 Q145,60 240,210" stroke="#b8b8b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="8,6"/>
  <!-- Figure at peak of big bound — energetic, legs extended -->
  <!-- Head -->
  <circle cx="148" cy="65" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Eyes (excited) -->
  <circle cx="141" cy="61" r="3" fill="#000000"/>
  <circle cx="154" cy="61" r="3" fill="#000000"/>
  <!-- Mouth open in excitement -->
  <path d="M141,73 Q148,80 156,73" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Hair -->
  <path d="M130,59 Q146,48 166,60" stroke="#7d5e23" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Neck -->
  <line x1="148" y1="84" x2="148" y2="94" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <!-- Torso (upright, energetic) -->
  <path d="M128,94 Q148,90 168,94 L172,138 Q148,144 124,138 Z" fill="#f8130d" stroke="#000000" stroke-width="5"/>
  <!-- Arms thrown wide and up — big energy -->
  <line x1="168" y1="100" x2="200" y2="78" stroke="#eed5b6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="206" cy="74" r="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <line x1="128" y1="100" x2="96" y2="78" stroke="#eed5b6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="90" cy="74" r="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right leg — extended forward/down -->
  <line x1="160" y1="138" x2="185" y2="165" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <line x1="185" y1="165" x2="200" y2="188" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="206" cy="193" rx="14" ry="6" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Left leg — pushed back/up (propulsion) -->
  <line x1="136" y1="138" x2="115" y2="162" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <line x1="115" y1="162" x2="100" y2="185" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="97" cy="190" rx="14" ry="6" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Spring/energy lines -->
  <path d="M148,205 Q142,198 148,192 Q154,186 148,180" stroke="#ff9900" stroke-width="3" fill="none" stroke-linecap="round"/>
