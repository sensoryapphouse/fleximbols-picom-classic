<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- bouquet-toss: bride FULL BODY throwing bouquet up, bouquet mid-air, crowd FULL BODY catching -->
  <!-- ground -->
  <rect x="10" y="218" width="270" height="14" fill="#f5e7c4" stroke="#000000" stroke-width="2"/>

  <!-- BRIDE on left (FULL BODY, back turned, arms raised tossing) -->
  <!-- legs -->
  <rect x="35" y="170" width="11" height="42" fill="#efefef" stroke="#000000" stroke-width="2"/>
  <rect x="48" y="170" width="11" height="42" fill="#efefef" stroke="#000000" stroke-width="2"/>
  <ellipse cx="40" cy="215" rx="8" ry="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <ellipse cx="54" cy="215" rx="8" ry="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- wedding dress (flowing) -->
  <path d="M25 130 L18 175 L80 175 L73 130 Q73 110 49 108 Q25 110 25 130 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- dress detail/sash -->
  <path d="M30 140 L70 140" stroke="#f4a4b2" stroke-width="3" stroke-linecap="round"/>
  <!-- arms raised up after toss -->
  <path d="M28 115 L18 65 L26 64 L36 118 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M70 115 L80 65 L72 64 L62 118 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- hands -->
  <circle cx="22" cy="62" r="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <circle cx="76" cy="62" r="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- head (from behind, hair bun) -->
  <circle cx="49" cy="86" r="20" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <path d="M31 82 Q31 65 49 63 Q67 65 67 82 Q65 73 49 71 Q33 73 31 82 Z" fill="#7d5e23" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="49" cy="62" r="7" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <!-- short veil -->
  <path d="M30 78 Q15 95 25 130 L30 130 Q22 105 35 85 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>

  <!-- BOUQUET MID-AIR (arcing toward crowd) -->
  <!-- motion trail -->
  <path d="M30 55 Q90 5 175 50" fill="none" stroke="#b8b8b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <!-- bouquet itself at apex -->
  <g transform="translate(140 35)">
    <ellipse cx="0" cy="0" rx="22" ry="18" fill="#529929" stroke="#000000" stroke-width="2.5"/>
    <circle cx="-10" cy="-4" r="7" fill="#f266aa" stroke="#000000" stroke-width="2"/>
    <circle cx="5" cy="-6" r="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <circle cx="12" cy="4" r="6" fill="#d01424" stroke="#000000" stroke-width="2"/>
    <circle cx="-3" cy="6" r="6" fill="#f4a4b2" stroke="#000000" stroke-width="2"/>
    <!-- ribbon -->
    <rect x="-4" y="14" width="8" height="14" fill="#f4a4b2" stroke="#000000" stroke-width="2"/>
    <path d="M-4 28 L-10 38 M4 28 L10 38" stroke="#f4a4b2" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- CROWD on right reaching up to catch (two figures FULL BODY) -->
  <!-- figure 1 (purple dress) -->
  <rect x="190" y="170" width="10" height="44" fill="#7c3fac" stroke="#000000" stroke-width="2"/>
  <rect x="202" y="170" width="10" height="44" fill="#7c3fac" stroke="#000000" stroke-width="2"/>
  <ellipse cx="195" cy="216" rx="7" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="207" cy="216" rx="7" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <path d="M183 130 L180 175 L222 175 L219 130 Q219 115 201 113 Q183 115 183 130 Z" fill="#7c3fac" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- arms up reaching -->
  <path d="M186 118 L172 70 L180 68 L194 120 Z" fill="#7c3fac" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M216 118 L230 70 L222 68 L208 120 Z" fill="#7c3fac" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="176" cy="66" r="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <circle cx="226" cy="66" r="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- head -->
  <circle cx="201" cy="92" r="19" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <path d="M184 88 Q184 71 201 69 Q218 71 218 88 Q216 78 201 76 Q186 78 184 88 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="195" cy="92" r="2" fill="#000000"/>
  <circle cx="207" cy="92" r="2" fill="#000000"/>
  <path d="M195 100 Q201 104 207 100" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- figure 2 (teal dress, smaller behind/right) -->
  <rect x="240" y="178" width="9" height="36" fill="#3aa6a0" stroke="#000000" stroke-width="2"/>
  <rect x="251" y="178" width="9" height="36" fill="#3aa6a0" stroke="#000000" stroke-width="2"/>
  <ellipse cx="244" cy="216" rx="6" ry="3" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="255" cy="216" rx="6" ry="3" fill="#000000" stroke="#000000" stroke-width="2"/>
  <path d="M234 140 L232 180 L268 180 L266 140 Q266 128 250 126 Q234 128 234 140 Z" fill="#3aa6a0" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M236 130 L230 85 L237 84 L243 132 Z" fill="#3aa6a0" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M264 130 L270 85 L263 84 L257 132 Z" fill="#3aa6a0" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="233" cy="82" r="4" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <circle cx="267" cy="82" r="4" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <circle cx="250" cy="108" r="16" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <path d="M236 105 Q236 90 250 88 Q264 90 264 105 Q262 96 250 94 Q238 96 236 105 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="245" cy="108" r="1.8" fill="#000000"/>
  <circle cx="255" cy="108" r="1.8" fill="#000000"/>
  <path d="M245 115 Q250 118 255 115" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- motion lines around bouquet -->
  <path d="M115 30 L108 25 M155 22 L160 16 M170 40 L180 38" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
</svg>
