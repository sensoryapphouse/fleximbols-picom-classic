  <!-- Bowing: a figure bent forward at the waist (ported from Cartoon set, flat Classic style) -->
  <g transform="translate(-11,-37) scale(0.57)" stroke="#000000" stroke-linejoin="round">
    <!-- ground line -->
    <line x1="40" y1="468" x2="472" y2="468" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <!-- legs (standing, vertical) -->
    <path d="M212 460 L212 320 L300 320 L300 460 Z" fill="#3a4f8a" stroke="#000000" stroke-width="7"/>
    <!-- feet -->
    <ellipse cx="208" cy="464" rx="32" ry="14" fill="#1a1a1a" stroke="#000000" stroke-width="4"/>
    <ellipse cx="304" cy="464" rx="32" ry="14" fill="#1a1a1a" stroke="#000000" stroke-width="4"/>
    <!-- torso bent forward (horizontal) -->
    <path d="M196 320 L316 320 L380 196 L300 168 Z" fill="#e88a45" stroke="#000000" stroke-width="7"/>
    <!-- hanging arm -->
    <path d="M300 200 Q360 220 408 256 Q420 268 408 280 Q380 268 348 264 Q318 250 296 244 Z" fill="#f4cfa3" stroke="#000000" stroke-width="7"/>
    <path d="M308 220 Q360 244 396 274" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
    <!-- head (down) -->
    <circle cx="384" cy="160" r="64" fill="#f4cfa3" stroke="#000000" stroke-width="7"/>
    <!-- hair -->
    <path d="M328 144 Q344 96 396 100 Q444 110 448 156 Q420 132 380 132 Q344 132 328 144 Z" fill="#3a2a1a" stroke="#000000" stroke-width="7"/>
    <!-- eye/brow (face pointing down) -->
    <path d="M360 168 Q380 160 396 168" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
    <line x1="368" y1="192" x2="388" y2="192" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
    <!-- forward-bow motion arc -->
    <path d="M100 200 Q140 140 220 144" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/>
    <polygon points="220,144 206,134 208,154" fill="#58c87a" stroke="#000000" stroke-width="3"/>
  </g>
</svg>
