  <!-- Brave-modern: facing fear, shield raised, determined face, small monster/dragon shadow -->
  <!-- Monster shadow (bottom-right) -->
  <ellipse cx="238" cy="185" rx="38" ry="30" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Monster eye -->
  <ellipse cx="228" cy="178" rx="8" ry="9" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <circle cx="230" cy="179" r="4" fill="#000000"/>
  <!-- Monster teeth -->
  <polygon points="215,192 222,185 229,192" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <polygon points="229,192 236,185 243,192" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Monster horns -->
  <polygon points="218,160 224,170 212,170" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <polygon points="248,158 254,168 242,168" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- Shield -->
  <path d="M48 100 L48 165 Q48 190 85 205 Q122 190 122 165 L122 100 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shield boss (centre circle) -->
  <circle cx="85" cy="152" r="18" fill="#f2e40d" stroke="#000000" stroke-width="4"/>
  <!-- Shield cross -->
  <line x1="85" y1="105" x2="85" y2="200" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="55" y1="152" x2="115" y2="152" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="115" y="120" width="58" height="62" rx="10" fill="#529929" stroke="#000000" stroke-width="5"/>
  <!-- Left arm holding shield -->
  <rect x="80" y="115" width="38" height="18" rx="8" fill="#529929" stroke="#000000" stroke-width="4"/>
  <!-- Right arm at side -->
  <rect x="173" y="118" width="18" height="40" rx="8" fill="#529929" stroke="#000000" stroke-width="4"/>
  <ellipse cx="182" cy="162" rx="12" ry="11" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left leg -->
  <rect x="118" y="180" width="24" height="44" rx="8" fill="#1d0e82" stroke="#000000" stroke-width="5"/>
  <!-- Right leg -->
  <rect x="148" y="180" width="24" height="44" rx="8" fill="#1d0e82" stroke="#000000" stroke-width="5"/>
  <!-- Feet -->
  <ellipse cx="130" cy="225" rx="18" ry="9" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="160" cy="225" rx="18" ry="9" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Neck -->
  <rect x="131" y="100" width="26" height="24" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head -->
  <ellipse cx="144" cy="76" rx="37" ry="36" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="144" cy="46" rx="35" ry="15" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
  <!-- Determined eyes — slightly narrowed -->
  <ellipse cx="131" cy="72" rx="7" ry="6" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="157" cy="72" rx="7" ry="6" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="133" cy="72" r="4" fill="#000000"/>
  <circle cx="159" cy="72" r="4" fill="#000000"/>
  <!-- Firm eyebrows, angled inward -->
  <line x1="122" y1="62" x2="140" y2="66" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="166" y1="62" x2="148" y2="66" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Firm closed mouth -->
  <line x1="132" y1="88" x2="156" y2="88" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
