  <!-- Back figure (leader) -->
  <!-- Head -->
  <circle cx="228" cy="58" r="16" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Body -->
  <rect x="216" y="76" width="24" height="40" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect x="216" y="114" width="10" height="32" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="230" y="114" width="10" height="32" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right arm dropping crumb -->
  <line x1="216" y1="86" x2="198" y2="102" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="196" cy="105" r="7" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Trail of hearts/crumbs -->
  <!-- Heart 1 (near leader) -->
  <path d="M182 116 c0-5 -8-5 -8 0 c0 5 8 12 8 12 c0 0 8-7 8-12 c0-5 -8-5 -8 0" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Crumb dot 1 -->
  <circle cx="166" cy="128" r="5" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- Heart 2 -->
  <path d="M148 118 c0-5 -8-5 -8 0 c0 5 8 12 8 12 c0 0 8-7 8-12 c0-5 -8-5 -8 0" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Crumb dot 2 -->
  <circle cx="130" cy="130" r="5" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- Heart 3 -->
  <path d="M114 120 c0-5 -7-5 -7 0 c0 5 7 11 7 11 c0 0 7-6 7-11 c0-5 -7-5 -7 0" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Crumb dot 3 -->
  <circle cx="97" cy="131" r="5" fill="#f7de58" stroke="#000000" stroke-width="3"/>

  <!-- Front figure (follower, reaching forward eagerly) -->
  <!-- Head -->
  <circle cx="58" cy="70" r="16" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Body -->
  <rect x="46" y="88" width="24" height="40" rx="6" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect x="46" y="126" width="10" height="32" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="60" y="126" width="10" height="32" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Arm reaching forward eagerly -->
  <line x1="70" y1="98" x2="92" y2="112" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="95" cy="115" r="7" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Hopeful expression: small smile arc -->
  <path d="M52 70 q6 6 12 0" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="54" cy="66" r="2" fill="#000000"/>
  <circle cx="62" cy="66" r="2" fill="#000000"/>

  <!-- Ground line -->
  <line x1="28" y1="165" x2="262" y2="165" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
