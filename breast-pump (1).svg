  <!-- manual breast pump: flange (funnel) on top of collection bottle with squeeze handle -->
  <!-- collection bottle body -->
  <path d="M105 130 L105 215 Q105 225 115 225 L185 225 Q195 225 195 215 L195 130 Z" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- bottle measurement marks -->
  <path d="M115 150 L130 150" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M115 170 L135 170" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M115 190 L130 190" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M115 210 L135 210" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- collected milk -->
  <path d="M108 175 L108 215 Q108 222 115 222 L185 222 Q192 222 192 215 L192 175 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- bottle collar/threads -->
  <rect x="100" y="120" width="100" height="14" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- flange funnel base -->
  <path d="M110 120 L95 90 L205 90 L190 120 Z" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- flange opening (cup) -->
  <ellipse cx="150" cy="78" rx="60" ry="18" fill="#efefef" stroke="#000000" stroke-width="4"/>
  <ellipse cx="150" cy="78" rx="42" ry="10" fill="#f4a4b2" stroke="#000000" stroke-width="2.5"/>
  <!-- squeeze handle/lever pivoting from top side -->
  <path d="M205 82 Q245 60 270 95 Q260 110 240 105 Q220 100 210 95 Z" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- handle pivot -->
  <circle cx="208" cy="92" r="4" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- handle grip ridges -->
  <path d="M245 75 L250 82" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M252 73 L258 80" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M258 78 L263 85" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
