  <!-- breathwork: whole standing figure, arms wide open, breath arc lines expanding outward -->

  <!-- expanding breath arcs (behind figure) -->
  <path d="M100 120 Q145 70 190 120" stroke="#dff3fd" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M80 132 Q145 55 210 132" stroke="#90a7d6" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M58 146 Q145 38 232 146" stroke="#2a4ec0" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="8 5"/>

  <!-- breath arrows on arcs -->
  <polygon points="190,118 198,112 196,124" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="100,118 92,112 94,124" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- legs (standing, feet apart slightly for grounded pose) -->
  <path d="M130 188 L124 228" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M160 188 L166 228" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
  <ellipse cx="122" cy="230" rx="16" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="168" cy="230" rx="16" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- torso -->
  <path d="M108 118 Q116 102 145 104 Q174 102 182 118 L178 188 Q145 196 112 188 Z" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- left arm raised and spread wide (inhale pose) -->
  <path d="M110 122 Q82 110 54 118" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="50" cy="120" rx="14" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- left fingers open -->
  <line x1="40" y1="114" x2="36" y2="108" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="46" y1="111" x2="44" y2="104" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="52" y1="110" x2="52" y2="103" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="112" x2="60" y2="105" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- right arm raised and spread wide -->
  <path d="M180 122 Q208 110 236 118" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="240" cy="120" rx="14" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- right fingers open -->
  <line x1="230" y1="114" x2="226" y2="108" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="236" y1="111" x2="234" y2="104" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="242" y1="110" x2="242" y2="103" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="248" y1="112" x2="252" y2="105" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- neck -->
  <rect x="139" y="88" width="12" height="18" rx="4" ry="4" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- head (upright, calm) -->
  <ellipse cx="145" cy="66" rx="28" ry="30" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- relaxed closed eyes -->
  <path d="M133 62 Q139 66 145 62" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M145 62 Q151 66 157 62" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- mouth slightly open (exhaling) -->
  <ellipse cx="145" cy="77" rx="7" ry="5" fill="#ffffff" stroke="#000000" stroke-width="3"/>

  <!-- breath puff from mouth -->
  <path d="M145 72 Q145 58 152 50" stroke="#dff3fd" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="154" cy="47" r="5" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <circle cx="162" cy="40" r="4" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <circle cx="168" cy="32" r="3" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
</svg>
