  <!-- Sofa seat cushion -->
  <rect x="26" y="150" width="238" height="62" rx="14" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Sofa back cushion -->
  <rect x="26" y="106" width="238" height="56" rx="10" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Sofa armrest left -->
  <rect x="20" y="128" width="34" height="84" rx="10" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Sofa armrest right -->
  <rect x="236" y="128" width="34" height="84" rx="10" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Sofa legs -->
  <rect x="50" y="206" width="16" height="26" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="224" y="206" width="16" height="26" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Figure: torso/shirt sitting on sofa, leaning back -->
  <rect x="76" y="124" width="52" height="50" rx="10" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Neck connector: ensures head touches body -->
  <rect x="94" y="110" width="16" height="18" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Head: positioned so it overlaps neck -->
  <circle cx="102" cy="92" r="28" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M75,80 Q82,55 102,55 Q122,55 130,80 Q120,64 102,66 Q84,64 75,80 Z" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Eyes looking down at phone -->
  <ellipse cx="92" cy="94" rx="5" ry="4" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <ellipse cx="112" cy="94" rx="5" ry="4" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <circle cx="93" cy="96" r="2.5" fill="#1d0e82"/>
  <circle cx="113" cy="96" r="2.5" fill="#1d0e82"/>
  <!-- Left arm resting on sofa armrest -->
  <path d="M76,148 Q58,150 52,160" fill="none" stroke="#eed5b6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm reaching to grip the phone in middle -->
  <path d="M128,138 Q150,148 160,170" fill="none" stroke="#eed5b6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Smartphone portrait, gripped at middle by hand -->
  <rect x="148" y="138" width="44" height="62" rx="7" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Screen -->
  <rect x="153" y="143" width="34" height="52" rx="3" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <!-- Feed content lines on screen -->
  <rect x="156" y="147" width="28" height="5" rx="2" fill="#90a7d6"/>
  <rect x="156" y="156" width="20" height="5" rx="2" fill="#90a7d6"/>
  <rect x="156" y="165" width="26" height="5" rx="2" fill="#90a7d6"/>
  <rect x="156" y="174" width="18" height="5" rx="2" fill="#90a7d6"/>
  <!-- Hand wrapping around the right edge of the phone (clearly gripping) -->
  <ellipse cx="190" cy="170" rx="12" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <path d="M186,162 Q198,162 200,170 Q198,178 186,178" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Thumb pressing on screen -->
  <ellipse cx="180" cy="186" rx="7" ry="5" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <!-- Scroll-up motion indicator above phone -->
  <path d="M170,128 L170,118" fill="none" stroke="#137827" stroke-width="3" stroke-linecap="round"/>
  <path d="M165,123 L170,118 L175,123" fill="none" stroke="#137827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Legs visible below sofa front (feet peeking out) -->
  <line x1="88" y1="174" x2="86" y2="205" stroke="#4d4d4d" stroke-width="6" stroke-linecap="round"/>
  <line x1="102" y1="174" x2="104" y2="205" stroke="#4d4d4d" stroke-width="6" stroke-linecap="round"/>
</svg>
