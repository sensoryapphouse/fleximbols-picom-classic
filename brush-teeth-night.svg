  <!-- Night window (top-left) -->
  <rect x="20" y="18" width="108" height="92" rx="6" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Window frame cross bars -->
  <line x1="74" y1="18" x2="74" y2="110" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="64" x2="128" y2="64" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Window sill -->
  <rect x="16" y="106" width="116" height="10" rx="3" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Crescent moon in window (clearly visible) -->
  <path d="M42,26 Q68,24 72,46 Q76,68 54,78 Q76,68 74,46 Q72,26 42,26 Z" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Stars in window -->
  <circle cx="96" cy="30" r="3" fill="#f7de58"/>
  <circle cx="30" cy="44" r="2" fill="#f7de58"/>
  <circle cx="110" cy="52" r="2" fill="#f7de58"/>
  <circle cx="52" cy="88" r="2" fill="#f7de58"/>
  <!-- Face (bust: large, clearly centred-right) -->
  <circle cx="185" cy="120" r="70" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M116,105 Q122,56 185,54 Q248,56 254,105 Q240,70 185,72 Q130,70 116,105 Z" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Sleepy/squinting eyes (night) -->
  <path d="M158,108 Q167,102 176,108" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M194,108 Q203,102 212,108" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Open mouth showing teeth being brushed -->
  <path d="M152,142 Q168,160 185,162 Q202,160 218,142" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tooth dividers -->
  <line x1="168" y1="142" x2="168" y2="160" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="185" y1="142" x2="185" y2="162" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="202" y1="142" x2="202" y2="160" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Toothpaste foam bubbles (left of mouth) -->
  <circle cx="148" cy="146" rx="10" r="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="134" cy="140" r="8" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="141" cy="156" r="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Toothbrush handle (coming from right) -->
  <rect x="216" y="156" width="74" height="18" rx="8" fill="#529929" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Toothbrush head (at mouth) -->
  <rect x="200" y="136" width="28" height="40" rx="6" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Bristles pointing left toward mouth -->
  <line x1="200" y1="143" x2="189" y2="143" stroke="#efefef" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="150" x2="187" y2="150" stroke="#efefef" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="157" x2="189" y2="157" stroke="#efefef" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="164" x2="187" y2="164" stroke="#efefef" stroke-width="3" stroke-linecap="round"/>
  <!-- Toothpaste stripe on head -->
  <rect x="203" y="148" width="22" height="7" rx="3" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <!-- Hand gripping brush -->
  <ellipse cx="254" cy="172" rx="14" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
