<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- platform top-left -->
  <rect x="22" y="22" width="80" height="18" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- platform support post -->
  <rect x="22" y="40" width="14" height="60" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- bungee cord – stretched, wavy -->
  <path d="M90 22 Q105 45 98 68 Q91 90 105 112 Q119 134 112 158 Q105 180 118 200" fill="none" stroke="#f8130d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- figure falling head-down: head lowest -->
  <!-- head -->
  <circle cx="124" cy="208" r="14" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- hair (gravity-pulled upward = toward cord) -->
  <path d="M112 200 Q124 192 136 200" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- neck -->
  <line x1="124" y1="194" x2="124" y2="184" stroke="#eed5b6" stroke-width="7" stroke-linecap="round"/>
  <!-- torso (upside-down) -->
  <path d="M108 183 Q124 178 140 183 L136 148 Q124 144 112 148 Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- arms dangling downward (toward head) -->
  <line x1="110" y1="172" x2="92" y2="192" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="90" cy="194" r="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <line x1="138" y1="172" x2="156" y2="192" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="158" cy="194" r="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- legs up (feet near cord attachment) -->
  <line x1="116" y1="148" x2="110" y2="118" stroke="#2a4ec0" stroke-width="8" stroke-linecap="round"/>
  <line x1="132" y1="148" x2="138" y2="118" stroke="#2a4ec0" stroke-width="8" stroke-linecap="round"/>
  <!-- feet -->
  <ellipse cx="108" cy="115" rx="10" ry="5" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="140" cy="115" rx="10" ry="5" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- ankle attachment to cord -->
  <line x1="124" y1="115" x2="118" y2="200" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5"/>
</svg>
