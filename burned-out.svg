  <!-- Burnt matchstick right side -->
  <!-- Match stick -->
  <rect x="226" y="80" width="8" height="110" rx="3" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- Burnt charred head (was match head, now black) -->
  <ellipse cx="230" cy="74" rx="10" ry="12" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Smoke wisps from match -->
  <path d="M226 68 Q220 58 226 48 Q232 38 226 28" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M234 66 Q240 56 234 46 Q228 36 234 26" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Smoke wisps from top of head -->
  <path d="M120 52 Q114 38 120 24 Q126 12 120 2" fill="none" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M145 48 Q139 34 145 20 Q151 8 145 -2" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M170 52 Q176 38 170 24 Q164 12 170 2" fill="none" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Singed top of head (charred dark band) -->
  <path d="M86 92 Q94 60 145 54 Q196 60 204 92" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Shoulders -->
  <path d="M62 240 Q72 192 106 182 Q145 176 184 182 Q218 192 228 240 Z" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="128" y="156" width="34" height="28" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Head - slightly ashen pale -->
  <ellipse cx="145" cy="118" rx="62" ry="66" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hollow stare eyes - wide open but blank/empty (no shine) -->
  <ellipse cx="112" cy="112" rx="18" ry="20" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="112" cy="114" r="11" fill="#4d4d4d"/>
  <!-- No light spot - hollow empty stare -->
  <ellipse cx="178" cy="112" rx="18" ry="20" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="178" cy="114" r="11" fill="#4d4d4d"/>
  <!-- Dark under-eye circles -->
  <path d="M94 124 Q112 132 130 124" fill="#b8b8b8" stroke="none"/>
  <path d="M160 124 Q178 132 196 124" fill="#b8b8b8" stroke="none"/>
  <!-- Flat expressionless mouth -->
  <line x1="118" y1="152" x2="172" y2="152" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Flat numb eyebrows -->
  <line x1="94" y1="90" x2="130" y2="90" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="160" y1="90" x2="196" y2="90" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M140 124 Q145 134 150 124" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
