  <!-- Ground line -->
  <line x1="40" y1="228" x2="250" y2="228" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="128" y1="228" x2="130" y2="185" stroke="#eed5b6" stroke-width="16" stroke-linecap="round"/>
  <line x1="162" y1="228" x2="160" y2="185" stroke="#eed5b6" stroke-width="16" stroke-linecap="round"/>
  <!-- Trousers -->
  <rect x="122" y="178" width="46" height="22" rx="7" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Torso -->
  <rect x="124" y="130" width="42" height="50" rx="10" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm (relaxed at side) -->
  <line x1="124" y1="145" x2="106" y2="165" stroke="#eed5b6" stroke-width="13" stroke-linecap="round"/>
  <!-- Right arm (hand near chest - mild discomfort) -->
  <line x1="166" y1="143" x2="175" y2="152" stroke="#eed5b6" stroke-width="13" stroke-linecap="round"/>
  <!-- Right hand at chest -->
  <circle cx="179" cy="156" r="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left hand -->
  <circle cx="103" cy="168" r="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head - slightly upright, mouth open -->
  <circle cx="145" cy="107" r="26" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M119 103 Q123 82 145 80 Q167 82 171 103" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Eyes - normal/mildly uncomfortable -->
  <ellipse cx="136" cy="103" rx="6" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="137" cy="104" r="3.5" fill="#1d0e82"/>
  <circle cx="138" cy="103" r="1.5" fill="#ffffff"/>
  <ellipse cx="154" cy="103" rx="6" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="155" cy="104" r="3.5" fill="#1d0e82"/>
  <circle cx="156" cy="103" r="1.5" fill="#ffffff"/>
  <!-- Mouth open, rounded (burp exit) -->
  <ellipse cx="145" cy="118" rx="7" ry="8" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <!-- Single round air bubble rising from mouth -->
  <circle cx="145" cy="98" r="10" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <!-- Smaller bubble above -->
  <circle cx="147" cy="83" r="6" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <!-- Tiny bubble at top -->
  <circle cx="148" cy="73" r="3.5" fill="#dff3fd" stroke="#000000" stroke-width="2.5"/>
  <!-- Slight wavy lines at mouth to indicate air -->
  <path d="M138 110 Q141 107 145 110 Q149 113 152 110" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
</svg>
