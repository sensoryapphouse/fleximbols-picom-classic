<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Burpee: 3-stage storyboard - squat-down, plank, jump-up -->
  <!-- Stage labels area dividers -->
  <line x1="96" y1="20" x2="96" y2="225" stroke="#b8b8b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="193" y1="20" x2="193" y2="225" stroke="#b8b8b8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- STAGE 1: SQUAT DOWN (left third) -->
  <!-- Head -->
  <circle cx="48" cy="62" r="16" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <path d="M 33,57 Q 35,44 48,44 Q 61,44 63,57 Q 57,50 48,51 Q 39,50 33,57 Z" fill="#4d4d4d" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="43" cy="61" rx="2" ry="2.5" fill="#000000"/>
  <ellipse cx="53" cy="61" rx="2" ry="2.5" fill="#000000"/>
  <!-- Torso (leaning forward in squat) -->
  <path d="M 42,76 Q 44,72 48,71 Q 52,72 54,76 L 56,108 L 40,108 Z" fill="#d01424" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Arms reaching down toward floor -->
  <path d="M 42,82 Q 32,92 24,108" stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 54,82 Q 64,92 72,108" stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="23" cy="110" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <circle cx="73" cy="110" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Left thigh bent deep -->
  <path d="M 42,108 Q 30,122 22,136" stroke="#1d0e82" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Left shin -->
  <path d="M 22,136 L 20,172" stroke="#1d0e82" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Right thigh -->
  <path d="M 54,108 Q 66,122 74,136" stroke="#1d0e82" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Right shin -->
  <path d="M 74,136 L 76,172" stroke="#1d0e82" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Feet -->
  <path d="M 14,172 L 28,172" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 68,172 L 82,172" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Arrow right -->
  <path d="M 82,140 L 88,140 L 86,136 M 88,140 L 86,144" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- STAGE 2: PLANK (middle third) -->
  <!-- Head (looking down) -->
  <circle cx="120" cy="118" r="15" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <path d="M 106,114 Q 108,101 120,101 Q 132,101 134,114 Q 128,107 120,108 Q 112,107 106,114 Z" fill="#4d4d4d" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="115" cy="118" rx="2" ry="2.5" fill="#000000"/>
  <ellipse cx="125" cy="118" rx="2" ry="2.5" fill="#000000"/>
  <!-- Torso horizontal -->
  <path d="M 130,118 L 168,118 L 168,130 L 130,130 Z" fill="#d01424" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left arm supporting (front arm) -->
  <path d="M 130,124 Q 126,132 122,144" stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="121" cy="146" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right arm supporting -->
  <path d="M 138,124 Q 134,132 130,144" stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="129" cy="146" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Left leg extended back -->
  <path d="M 168,124 Q 174,122 180,120" stroke="#1d0e82" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 180,120 Q 186,118 192,118" stroke="#1d0e82" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Right leg -->
  <path d="M 168,128 Q 174,128 180,128" stroke="#1d0e82" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 180,128 Q 186,128 192,130" stroke="#1d0e82" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Feet flat on floor -->
  <path d="M 190,115 L 190,122" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 190,125 L 190,133" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Arrow right -->
  <path d="M 182,140 L 188,140 L 186,136 M 188,140 L 186,144" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- STAGE 3: JUMP UP (right third) -->
  <!-- Figure airborne, arms overhead, legs extending -->
  <!-- Head -->
  <circle cx="241" cy="56" r="16" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <path d="M 226,51 Q 228,38 241,38 Q 254,38 256,51 Q 250,44 241,45 Q 232,44 226,51 Z" fill="#4d4d4d" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="236" cy="55" rx="2" ry="2.5" fill="#000000"/>
  <ellipse cx="246" cy="55" rx="2" ry="2.5" fill="#000000"/>
  <!-- Happy/excited mouth -->
  <path d="M 236,64 Q 241,68 246,64" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Torso -->
  <path d="M 235,70 Q 237,67 241,67 Q 245,67 247,70 L 248,102 L 234,102 Z" fill="#d01424" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Arms thrown up overhead -->
  <path d="M 236,76 Q 228,64 222,52" stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 246,76 Q 254,64 260,52" stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="221" cy="50" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <circle cx="261" cy="50" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Legs extending down (airborne, slightly bent) -->
  <path d="M 236,102 Q 228,118 222,136" stroke="#1d0e82" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 222,136 Q 220,148 220,160" stroke="#1d0e82" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 246,102 Q 254,118 260,136" stroke="#1d0e82" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 260,136 Q 262,148 262,160" stroke="#1d0e82" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Feet (not touching ground - airborne) -->
  <path d="M 214,160 L 228,162" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 256,160 L 270,162" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Motion lines under feet -->
  <path d="M 218,170 Q 222,174 226,170" stroke="#2a4ec0" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 258,170 Q 262,174 266,170" stroke="#2a4ec0" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Upward arrows above hands -->
  <path d="M 219,44 L 219,36 M 215,40 L 219,36 L 223,40" stroke="#2a4ec0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 263,44 L 263,36 M 259,40 L 263,36 L 267,40" stroke="#2a4ec0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
