  <!-- UPWARD BAR CHART (right side, key prop) -->
  <!-- Chart base line -->
  <line x1="148" y1="210" x2="268" y2="210" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="148" y1="210" x2="148" y2="100" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Bar 1 (short) -->
  <rect x="158" y="182" width="24" height="28" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Bar 2 (medium) -->
  <rect x="192" y="158" width="24" height="52" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Bar 3 (tall) -->
  <rect x="226" y="126" width="24" height="84" rx="4" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Upward arrow on chart -->
  <polyline points="165,178 192,152 226,120" stroke="#f8130d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polygon points="226,120 218,128 234,130" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- BRIEFCASE (lower left, key prop) -->
  <rect x="28" y="172" width="54" height="40" rx="6" fill="#7d5e23" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Briefcase handle -->
  <path d="M42 172 L42 162 Q42 156 55 156 Q68 156 68 162 L68 172" stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Briefcase clasp -->
  <rect x="47" y="188" width="16" height="10" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Briefcase divider line -->
  <line x1="28" y1="192" x2="82" y2="192" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- PERSON (waist-up, centre, business attire) -->
  <!-- Torso / suit jacket -->
  <rect x="82" y="130" width="60" height="62" rx="10" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shirt & tie -->
  <rect x="101" y="130" width="22" height="48" rx="4" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="112,134 108,148 112,152 116,148" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Lapels -->
  <polygon points="101,130 90,148 101,155" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="123,130 134,148 123,155" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left arm (gesturing toward chart) -->
  <line x1="142" y1="148" x2="162" y2="138" stroke="#eed5b6" stroke-width="14" stroke-linecap="round"/>
  <!-- Right arm (pointing down to briefcase) -->
  <line x1="82" y1="148" x2="62" y2="162" stroke="#eed5b6" stroke-width="14" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="112" cy="108" r="26" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Eyes -->
  <circle cx="103" cy="105" r="3" fill="#000000"/>
  <circle cx="121" cy="105" r="3" fill="#000000"/>
  <!-- Confident smile -->
  <path d="M105 116 Q112 124 119 116" stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Hair (neat, professional) -->
  <path d="M87 102 Q91 84 112 82 Q133 84 137 102" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Side parting -->
  <path d="M91 98 Q100 86 112 84" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round" fill="none"/>
