<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Butt kick: running in place, left heel kicked back up toward glutes, right leg planted -->
  <!-- Floor line -->
  <path d="M 50,220 L 240,220" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="145" cy="42" r="22" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M 124,36 Q 126,20 145,20 Q 164,20 166,36 Q 158,27 145,28 Q 132,27 124,36 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eyes -->
  <ellipse cx="138" cy="41" rx="2.5" ry="3" fill="#000000"/>
  <ellipse cx="152" cy="41" rx="2.5" ry="3" fill="#000000"/>
  <!-- Focused expression -->
  <path d="M 139,51 L 151,51" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Torso (upright, slight forward lean) -->
  <path d="M 134,62 Q 136,59 145,58 Q 154,59 156,62 L 157,108 L 133,108 Z" fill="#d01424" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- LEFT ARM: forward (pumping forward) -->
  <path d="M 134,74 Q 120,68 106,60" stroke="#000000" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 106,60 Q 94,53 82,44" stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="80" cy="42" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- RIGHT ARM: back (swinging back) -->
  <path d="M 156,74 Q 168,82 178,92" stroke="#000000" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 178,92 Q 188,102 196,114" stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="198" cy="116" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- LEFT LEG: planted (right side of body forward) -->
  <!-- Left upper thigh -->
  <path d="M 134,108 Q 130,132 128,158" stroke="#1d0e82" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Left shin going down to floor -->
  <path d="M 128,158 Q 127,185 126,220" stroke="#1d0e82" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Left foot on ground -->
  <path d="M 118,220 L 138,220" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <!-- RIGHT LEG: heel kicked UP toward butt -->
  <!-- Right upper thigh (going down but bent) -->
  <path d="M 156,108 Q 166,124 172,144" stroke="#1d0e82" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Right shin KICKING BACK upward - bend at knee = 172,144 -->
  <path d="M 172,144 Q 168,128 162,116 Q 158,108 156,104" stroke="#1d0e82" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Right foot (near buttocks level) -->
  <path d="M 154,104 L 164,96" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <!-- Butt-kick highlight: foot approaching glute zone -->
  <!-- Glute area of torso (back lower) -->
  <path d="M 155,108 Q 160,116 164,118" stroke="#f7de58" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,3" fill="none"/>
  <!-- Arrow showing heel kicking back/up -->
  <path d="M 162,108 Q 158,100 156,96 M 158,96 L 155,102 M 158,96 L 163,100" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Kick arc cue -->
  <path d="M 174,154 Q 168,130 156,102" stroke="#2a4ec0" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="5,3"/>
  <!-- Knee bent indicator (knee circle) -->
  <circle cx="172" cy="144" r="9" fill="none" stroke="#2a4ec0" stroke-width="2.5"/>
</svg>
