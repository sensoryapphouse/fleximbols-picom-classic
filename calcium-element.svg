  <!-- glass of milk on left + bone on right -->
  <!-- glass tumbler shape -->
  <path d="M30 60 L100 60 L92 215 L38 215 Z" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- milk inside -->
  <path d="M36 75 L94 75 L88 205 L42 205 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- milk surface ellipse -->
  <ellipse cx="65" cy="75" rx="29" ry="6" fill="#efefef" stroke="#000000" stroke-width="2"/>
  <!-- glass highlight -->
  <line x1="48" y1="90" x2="45" y2="195" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- glass rim highlight -->
  <path d="M35 62 Q65 56 95 62" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- bone (femur shape) on right -->
  <!-- bone shaft -->
  <path d="M150 95 L260 195" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- bone main body -->
  <path d="M165 80 Q180 95 195 110 L240 155 Q255 170 240 185 Q225 200 210 185 L165 140 Q150 125 150 110 Q150 95 165 80 Z" fill="#f5e7c4" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- top-left knob -->
  <circle cx="160" cy="90" r="18" fill="#f5e7c4" stroke="#000000" stroke-width="3"/>
  <!-- top-right knob -->
  <circle cx="195" cy="85" r="18" fill="#f5e7c4" stroke="#000000" stroke-width="3"/>
  <!-- bottom-left knob -->
  <circle cx="225" cy="180" r="18" fill="#f5e7c4" stroke="#000000" stroke-width="3"/>
  <!-- bottom-right knob -->
  <circle cx="255" cy="155" r="18" fill="#f5e7c4" stroke="#000000" stroke-width="3"/>
  <!-- shading detail line -->
  <path d="M175 110 L235 170" stroke="#e6b98a" stroke-width="2.5" stroke-linecap="round"/>
