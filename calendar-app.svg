  <line x1="224" y1="160" x2="224" y2="180" stroke="#000000" stroke-width="2"/>
  <!-- Row 5 -->
  <rect x="32" y="180" width="226" height="20" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <line x1="64" y1="180" x2="64" y2="200" stroke="#000000" stroke-width="2"/>
  <line x1="96" y1="180" x2="96" y2="200" stroke="#000000" stroke-width="2"/>
  <line x1="128" y1="180" x2="128" y2="200" stroke="#000000" stroke-width="2"/>
