  <line x1="160" y1="140" x2="160" y2="160" stroke="#000000" stroke-width="2"/>
  <line x1="192" y1="140" x2="192" y2="160" stroke="#000000" stroke-width="2"/>
  <line x1="224" y1="140" x2="224" y2="160" stroke="#000000" stroke-width="2"/>
  <!-- Marked day dot (red circle) in row 3, col 4 -->
  <circle cx="176" cy="150" r="8" fill="#d01424" stroke="#000000" stroke-width="3"/>
  <!-- Row 4 -->
  <rect x="32" y="160" width="226" height="20" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <line x1="64" y1="160" x2="64" y2="180" stroke="#000000" stroke-width="2"/>
