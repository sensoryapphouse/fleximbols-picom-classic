  <!-- Calendar outer body -->
  <rect x="26" y="32" width="238" height="178" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Header band (grey) -->
  <rect x="26" y="32" width="238" height="46" rx="10" ry="10" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="26" y="58" width="238" height="20" fill="#7f7f7f" stroke="none"/>
  <!-- Binder rings -->
  <rect x="82" y="22" width="14" height="24" rx="6" ry="6" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="194" y="22" width="14" height="24" rx="6" ry="6" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Day-of-week row -->
  <rect x="32" y="82" width="226" height="14" rx="2" ry="2" fill="#efefef" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- 7 column separators in header row -->
  <line x1="64" y1="82" x2="64" y2="96" stroke="#000000" stroke-width="2"/>
  <line x1="96" y1="82" x2="96" y2="96" stroke="#000000" stroke-width="2"/>
  <line x1="128" y1="82" x2="128" y2="96" stroke="#000000" stroke-width="2"/>
  <line x1="160" y1="82" x2="160" y2="96" stroke="#000000" stroke-width="2"/>
  <line x1="192" y1="82" x2="192" y2="96" stroke="#000000" stroke-width="2"/>
  <line x1="224" y1="82" x2="224" y2="96" stroke="#000000" stroke-width="2"/>
  <!-- Grid: 5 rows of 7 cells -->
  <!-- Row 1 -->
  <rect x="32" y="100" width="226" height="20" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <line x1="64" y1="100" x2="64" y2="120" stroke="#000000" stroke-width="2"/>
  <line x1="96" y1="100" x2="96" y2="120" stroke="#000000" stroke-width="2"/>
  <line x1="128" y1="100" x2="128" y2="120" stroke="#000000" stroke-width="2"/>
  <line x1="160" y1="100" x2="160" y2="120" stroke="#000000" stroke-width="2"/>
  <line x1="192" y1="100" x2="192" y2="120" stroke="#000000" stroke-width="2"/>
  <line x1="224" y1="100" x2="224" y2="120" stroke="#000000" stroke-width="2"/>
  <!-- Row 2 -->
  <rect x="32" y="120" width="226" height="20" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <line x1="64" y1="120" x2="64" y2="140" stroke="#000000" stroke-width="2"/>
  <line x1="96" y1="120" x2="96" y2="140" stroke="#000000" stroke-width="2"/>
  <line x1="128" y1="120" x2="128" y2="140" stroke="#000000" stroke-width="2"/>
  <line x1="160" y1="120" x2="160" y2="140" stroke="#000000" stroke-width="2"/>
  <line x1="192" y1="120" x2="192" y2="140" stroke="#000000" stroke-width="2"/>
  <line x1="224" y1="120" x2="224" y2="140" stroke="#000000" stroke-width="2"/>
  <!-- Row 3 - contains marked day -->
