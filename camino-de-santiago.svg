  <!-- sky -->
  <rect x="0" y="0" width="290" height="170" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <!-- path/ground -->
  <rect x="0" y="170" width="290" height="70" fill="#f5e7c4" stroke="#000000" stroke-width="2"/>
  <!-- sun -->
  <circle cx="40" cy="35" r="14" fill="#fff200" stroke="#000000" stroke-width="3"/>
  <!-- cathedral (Santiago) background -->
  <rect x="180" y="90" width="80" height="80" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- twin spires -->
  <path d="M190 90 L200 50 L210 90 Z" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M230 90 L240 50 L250 90 Z" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- spire crosses -->
  <line x1="200" y1="50" x2="200" y2="40" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="196" y1="44" x2="204" y2="44" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="50" x2="240" y2="40" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="236" y1="44" x2="244" y2="44" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- cathedral door -->
  <path d="M210 170 L210 135 Q220 125 230 135 L230 170 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- cathedral windows -->
  <rect x="190" y="110" width="10" height="18" fill="#f2e40d" stroke="#000000" stroke-width="2"/>
  <rect x="240" y="110" width="10" height="18" fill="#f2e40d" stroke="#000000" stroke-width="2"/>
  <!-- yellow arrow marker (signpost on left foreground) -->
  <line x1="155" y1="220" x2="155" y2="175" stroke="#7d5e23" stroke-width="4" stroke-linecap="round"/>
  <rect x="135" y="178" width="40" height="24" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <!-- yellow arrow pointing right -->
  <path d="M140 190 L160 190 L160 184 L170 191 L160 198 L160 192 L140 192 Z" fill="#f2e40d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- pilgrim FULL BODY (foreground left) -->
  <!-- wide-brim hat -->
  <ellipse cx="70" cy="100" rx="22" ry="5" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <path d="M58 100 L82 100 L80 86 L60 86 Z" fill="#9d7246" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="70" cy="112" r="10" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- scallop-shell badge on hat -->
  <path d="M64 92 L70 86 L76 92 L74 95 L72 90 L70 95 L68 90 L66 95 Z" fill="#f5e7c4" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- torso (brown pilgrim robe / jacket) -->
  <rect x="55" y="122" width="30" height="32" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <!-- gourd water bottle on belt -->
  <ellipse cx="88" cy="148" rx="4" ry="6" fill="#67832d" stroke="#000000" stroke-width="2"/>
  <!-- arms -->
  <line x1="55" y1="128" x2="42" y2="150" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="85" y1="128" x2="98" y2="145" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- staff (tall walking stick) in left hand -->
  <line x1="42" y1="150" x2="38" y2="80" stroke="#5e1f0a" stroke-width="4" stroke-linecap="round"/>
  <!-- staff knob -->
  <circle cx="38" cy="78" r="4" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <!-- scallop shell on staff -->
  <path d="M30 110 L38 104 L46 110 L43 114 L40 108 L38 114 L36 108 L33 114 Z" fill="#fff200" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- legs -->
  <rect x="58" y="154" width="10" height="32" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <rect x="72" y="154" width="10" height="32" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <!-- boots -->
  <ellipse cx="63" cy="190" rx="7" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="77" cy="190" rx="7" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
</svg>
