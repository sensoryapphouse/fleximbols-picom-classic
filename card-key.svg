  <!-- Hotel keycard: flat card with magnetic stripe + contactless wave symbol -->
  <!-- Card body -->
  <rect x="50" y="68" width="190" height="118" rx="12" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Card chip (contact chip, golden) -->
  <rect x="74" y="92" width="38" height="30" rx="5" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Chip contact lines -->
  <line x1="82" y1="92" x2="82" y2="122" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="92" y1="92" x2="92" y2="122" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="102" y1="92" x2="102" y2="122" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="74" y1="106" x2="112" y2="106" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Magnetic stripe across bottom of card -->
  <rect x="50" y="155" width="190" height="16" rx="0" fill="#000000"/>
  <!-- Magnetic stripe sheen -->
  <rect x="50" y="155" width="190" height="5" fill="#4d4d4d"/>
  <!-- Contactless wave symbol (arcs, right side of card) -->
  <path d="M165 107 Q178 107 178 120 Q178 133 165 133" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M165 96 Q194 96 194 120 Q194 144 165 144" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Center dot of contactless symbol -->
  <circle cx="161" cy="120" r="5" fill="#ffffff" stroke="none"/>
  <!-- Hotel key icon - small diamond or star highlight on card -->
  <rect x="194" y="88" width="28" height="18" rx="5" fill="#90a7d6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Small key silhouette in that box -->
  <circle cx="204" cy="95" r="5" fill="none" stroke="#000000" stroke-width="3"/>
  <rect x="207" y="93" width="12" height="4" rx="1" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <rect x="215" y="97" width="4" height="3" fill="none" stroke="#000000" stroke-width="2"/>
</svg>
