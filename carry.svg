  <!-- Figure walking and carrying box in front -->
  <!-- Head -->
  <circle cx="145" cy="42" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="138" cy="39" r="3" fill="#000000"/>
  <circle cx="152" cy="39" r="3" fill="#000000"/>
  <!-- Mouth -->
  <path d="M139 51 Q145 55 151 51" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Torso -->
  <rect x="127" y="64" width="36" height="44" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Box held in front at chest/waist level -->
  <rect x="88" y="88" width="68" height="54" rx="6" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Box detail -->
  <line x1="122" y1="88" x2="122" y2="142" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="88" y1="115" x2="156" y2="115" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Left arm under box (supporting from below) -->
  <path d="M127 80 L104 90 L92 108" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M127 80 L104 90 L92 108" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="91" cy="110" r="7" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right arm under box -->
  <path d="M163 80 L166 90 L158 108" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M163 80 L166 90 L158 108" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="158" cy="110" r="7" fill="#eed5b6" stroke="#000000" stroke-width="4"/>

  <!-- Walking legs (stride) -->
  <!-- Left leg (forward) -->
  <path d="M136 108 L120 155 L108 195" fill="none" stroke="#4d4d4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M136 108 L120 155 L108 195" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right leg (back) -->
  <path d="M154 108 L172 155 L185 195" fill="none" stroke="#4d4d4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M154 108 L172 155 L185 195" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Feet -->
  <ellipse cx="103" cy="198" rx="18" ry="8" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="188" cy="198" rx="14" ry="8" fill="#000000" stroke="#000000" stroke-width="3"/>

  <!-- Motion lines behind figure (walking) -->
  <line x1="230" y1="110" x2="250" y2="110" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
  <line x1="235" y1="125" x2="255" y2="125" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
  <line x1="230" y1="140" x2="250" y2="140" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>

  <!-- Forward direction arrow -->
  <line x1="38" y1="120" x2="18" y2="120" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <polygon points="12,120 26,112 26,128" fill="#f8130d" stroke="#f8130d" stroke-width="2" stroke-linejoin="round"/>
</svg>
