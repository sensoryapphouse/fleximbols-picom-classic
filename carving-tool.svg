<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- carving-tool: single hand gouge/chisel carving a curl of wood from a block -->
  <!-- Wood block being carved -->
  <rect x="30" y="145" width="175" height="72" rx="6" ry="6" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Wood grain lines on block -->
  <line x1="30" y1="160" x2="205" y2="160" stroke="#9d7246" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="174" x2="205" y2="174" stroke="#9d7246" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="188" x2="205" y2="188" stroke="#9d7246" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="202" x2="205" y2="202" stroke="#9d7246" stroke-width="2" stroke-linecap="round"/>
  <!-- Carved recess in top of block -->
  <path d="M 55,145 Q 80,128 125,132 Q 155,135 170,145" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Wood curl peeling off - the key visual cue -->
  <path d="M 125,132 Q 148,118 155,100 Q 160,82 145,72 Q 130,65 118,78 Q 108,90 120,105 Q 132,118 125,132" fill="#f5e7c4" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner curl shadow -->
  <path d="M 125,128 Q 144,116 150,100 Q 154,86 143,78 Q 133,72 124,83" fill="#e6b98a" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Gouge / chisel tool -->
  <!-- Handle - wooden, large grip -->
  <rect x="175" y="40" width="36" height="95" rx="10" ry="10" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Handle grip rings -->
  <rect x="175" y="68" width="36" height="7" rx="2" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="175" y="84" width="36" height="7" rx="2" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="175" y="100" width="36" height="7" rx="2" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Ferrule (metal collar at base of handle) -->
  <rect x="173" y="130" width="40" height="14" rx="3" ry="3" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Chisel/gouge blade -->
  <path d="M 178,144 L 208,144 L 205,175 L 181,175 Z" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Blade bevel / cutting edge (U-gouge shape) -->
  <path d="M 181,175 Q 193,168 205,175" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Blade shine -->
  <line x1="187" y1="148" x2="184" y2="170" stroke="#efefef" stroke-width="3" stroke-linecap="round"/>
</svg>
