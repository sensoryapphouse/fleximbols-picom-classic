  <!-- ground -->
  <rect x="20" y="210" width="250" height="14" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- central head circle -->
  <circle cx="145" cy="120" r="36" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- hair cap -->
  <path d="M112 110 Q115 80 145 82 Q175 80 178 110 Q170 95 145 95 Q120 95 112 110 Z" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="133" cy="118" r="3" fill="#000000"/>
  <circle cx="157" cy="118" r="3" fill="#000000"/>
  <!-- mouth -->
  <path d="M135 138 Q145 144 155 138" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- triangle: thoughts (top), feelings (bottom-left), behaviours (bottom-right) -->
  <!-- thought bubble TOP -->
  <ellipse cx="145" cy="40" rx="36" ry="22" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <circle cx="130" cy="62" r="5" fill="#dff3fd" stroke="#000000" stroke-width="2.5"/>
  <!-- gear inside thought -->
  <path d="M145 28 L149 28 L150 24 L156 24 L157 28 L161 30 L165 28 L168 32 L166 36 L168 40 L164 44 L165 48 L161 50 L157 54 L150 54 L149 50 L145 50 L141 54 L134 54 L130 50 L129 46 L125 44 L127 40 L125 36 L129 32 L132 28 Z" fill="#7c3fac" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="145" cy="39" r="4" fill="#dff3fd" stroke="#000000" stroke-width="1.5"/>
  <!-- feelings bubble BOTTOM-LEFT -->
  <ellipse cx="50" cy="180" rx="32" ry="20" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <!-- heart inside -->
  <path d="M50 175 C44 168 34 172 38 182 C42 190 50 194 50 194 C50 194 58 190 62 182 C66 172 56 168 50 175 Z" fill="#d01424" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- behaviours bubble BOTTOM-RIGHT -->
  <ellipse cx="240" cy="180" rx="32" ry="20" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- mini person inside -->
  <circle cx="240" cy="172" r="5" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <path d="M232 192 L232 183 Q232 178 240 178 Q248 178 248 183 L248 192 Z" fill="#2a4ec0" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- arrows forming triangle cycle -->
  <!-- thoughts -> behaviours (top to bottom-right) -->
  <path d="M175 60 Q210 110 222 158" fill="none" stroke="#137827" stroke-width="4" stroke-linecap="round"/>
  <polygon points="222,158 215,152 228,150" fill="#137827" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- behaviours -> feelings (bottom-right to bottom-left) -->
  <path d="M208 188 Q145 200 82 188" fill="none" stroke="#ff9900" stroke-width="4" stroke-linecap="round"/>
  <polygon points="82,188 92,184 92,194" fill="#ff9900" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- feelings -> thoughts (bottom-left to top) -->
  <path d="M68 158 Q80 110 115 60" fill="none" stroke="#2a4ec0" stroke-width="4" stroke-linecap="round"/>
  <polygon points="115,60 108,68 120,70" fill="#2a4ec0" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
