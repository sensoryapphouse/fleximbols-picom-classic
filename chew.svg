  <g>
    <!-- Neck -->
    <polygon points="120,192 126,228 164,228 170,192 157,197 145,199 133,197" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Head — slightly wider cheeks on left to show food bulge -->
    <path d="M70,110 Q68,60 145,28 Q222,60 220,110 Q225,145 205,170 Q175,195 145,197 Q115,195 85,170 Q65,145 70,110 Z" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Left cheek puffed with food -->
    <ellipse cx="88" cy="145" rx="28" ry="22" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
    <!-- Left ear -->
    <ellipse cx="65" cy="108" rx="14" ry="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Right ear -->
    <ellipse cx="225" cy="108" rx="14" ry="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Hair -->
    <path d="M82,78 Q92,28 145,22 Q198,28 208,78 Q194,42 145,40 Q96,42 82,78 Z" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Left eye -->
    <ellipse cx="113" cy="92" rx="10" ry="11" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <circle cx="114" cy="93" r="5" fill="#000000"/>
    <!-- Right eye -->
    <ellipse cx="177" cy="92" rx="10" ry="11" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <circle cx="178" cy="93" r="5" fill="#000000"/>
    <!-- Eyebrows neutral -->
    <polyline points="103,80 116,77" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <polyline points="165,77 178,80" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <!-- Nose -->
