  <ellipse cx="108" cy="120" rx="6.5" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <ellipse cx="132" cy="127" rx="6.5" ry="5" fill="#7a2410" stroke="#000000" stroke-width="2"/>
  <ellipse cx="156" cy="120" rx="6.5" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <ellipse cx="180" cy="127" rx="6.5" ry="5" fill="#7a2410" stroke="#000000" stroke-width="2"/>
  <ellipse cx="202" cy="122" rx="6.5" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- kidney beans -->
  <path d="M96 131 q6 -5 11 0 q-5 4 -11 0 z" fill="#8a3b1e" stroke="#000000" stroke-width="1.5"/>
