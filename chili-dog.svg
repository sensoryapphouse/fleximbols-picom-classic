  <!-- Chili dog: side view. Long sausage in a bun, chili heaped on top, sausage ends poke out -->
  <!-- sausage ends poking out of the bun (drawn first, behind bun) -->
  <ellipse cx="40" cy="138" rx="16" ry="13" fill="#9d4b2a" stroke="#000000" stroke-width="5"/>
  <ellipse cx="250" cy="138" rx="16" ry="13" fill="#9d4b2a" stroke="#000000" stroke-width="5"/>
  <!-- lower bun roll (the cradle) -->
  <path d="M44 150 Q40 178 78 180 L212 180 Q250 178 246 150 Q246 140 232 140 L58 140 Q44 140 44 150 Z"
        fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
