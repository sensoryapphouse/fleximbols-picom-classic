  <path d="M56 140 Q52 124 76 124 L214 124 Q238 124 234 140 Q234 150 214 148 L76 148 Q56 150 56 140 Z"
        fill="#9d4b2a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
