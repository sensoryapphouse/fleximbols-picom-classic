<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- ground -->
  <rect x="0" y="218" width="290" height="22" fill="#f5e7c4" stroke="#000000" stroke-width="2.5"/>

  <!-- treatment table -->
  <rect x="20" y="140" width="220" height="22" rx="3" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="30" y="162" width="8" height="56" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <rect x="222" y="162" width="8" height="56" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- head pillow with hole -->
  <ellipse cx="50" cy="140" rx="22" ry="6" fill="#90a7d6" stroke="#000000" stroke-width="2"/>

  <!-- PATIENT FULL BODY lying prone on the table -->
  <g>
    <!-- head face-down -->
    <ellipse cx="50" cy="138" rx="16" ry="10" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
    <path d="M34 134 Q40 124 50 124 Q60 124 66 134 Q60 130 50 130 Q40 130 34 134 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
    <!-- arms stretched along sides -->
    <rect x="62" y="132" width="60" height="10" fill="#e6b98a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="62" y="138" width="60" height="10" fill="#e6b98a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- back/torso (shirtless tan) -->
    <rect x="66" y="128" width="110" height="28" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- spine column (dashed bumpy) -->
    <circle cx="80" cy="142" r="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <circle cx="95" cy="142" r="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <circle cx="110" cy="142" r="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <circle cx="125" cy="142" r="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <circle cx="140" cy="142" r="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <circle cx="155" cy="142" r="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <!-- hips/shorts -->
    <rect x="176" y="128" width="22" height="28" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- legs -->
    <rect x="180" y="130" width="56" height="11" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
    <rect x="180" y="143" width="56" height="11" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
    <!-- feet hanging slightly off -->
    <ellipse cx="240" cy="135" rx="6" ry="4" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
    <ellipse cx="240" cy="148" rx="6" ry="4" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- crack sparkles over middle of spine -->
  <g>
    <path d="M120 100 L122 110 L118 110 L120 100 Z M125 95 L127 105 L123 105 Z M115 95 L117 105 L113 105 Z" fill="#f2e40d" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="130" cy="108" r="2" fill="#f2e40d" stroke="#000000" stroke-width="1.2"/>
    <circle cx="110" cy="108" r="2" fill="#f2e40d" stroke="#000000" stroke-width="1.2"/>
  </g>

  <!-- CHIROPRACTOR FULL BODY standing behind table, hands on patient spine -->
  <g transform="translate(140 80)">
    <circle cx="0" cy="-30" r="12" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
    <path d="M-12 -33 Q-12 -44 0 -44 Q12 -44 12 -33 Q6 -39 0 -39 Q-6 -39 -12 -33 Z" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
    <circle cx="-4" cy="-30" r="1.5" fill="#000000"/>
    <circle cx="4" cy="-30" r="1.5" fill="#000000"/>
    <path d="M-3 -24 Q0 -22 3 -24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="-5" y="-20" width="10" height="5" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
    <!-- torso (white coat) -->
    <rect x="-18" y="-15" width="36" height="40" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="0" y1="-15" x2="0" y2="25" stroke="#000000" stroke-width="1.5"/>
    <!-- arms both reaching down onto spine -->
    <path d="M-18 -10 L-30 22 L-22 26 L-12 -2 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M18 -10 L30 22 L22 26 L12 -2 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="-26" cy="26" r="5" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
    <circle cx="26" cy="26" r="5" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
    <!-- pants -->
    <rect x="-15" y="25" width="13" height="20" fill="#7f7f7f" stroke="#000000" stroke-width="2.5"/>
    <rect x="2" y="25" width="13" height="20" fill="#7f7f7f" stroke="#000000" stroke-width="2.5"/>
    <!-- legs continue below table behind front leg -->
    <rect x="-15" y="80" width="13" height="40" fill="#7f7f7f" stroke="#000000" stroke-width="2.5"/>
    <rect x="2" y="80" width="13" height="40" fill="#7f7f7f" stroke="#000000" stroke-width="2.5"/>
    <ellipse cx="-9" cy="122" rx="7" ry="3.5" fill="#000000" stroke="#000000" stroke-width="1.8"/>
    <ellipse cx="9" cy="122" rx="7" ry="3.5" fill="#000000" stroke="#000000" stroke-width="1.8"/>
  </g>
</svg>
