<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Chutes and Ladders: grid board with a ladder going up and a slide/chute going down -->
  <!-- board grid -->
  <rect x="35" y="25" width="220" height="190" fill="#f5e7c4" stroke="#000000" stroke-width="3"/>
  <!-- grid lines (5 cols x 5 rows) -->
  <line x1="79" y1="25" x2="79" y2="215" stroke="#000000" stroke-width="2"/>
  <line x1="123" y1="25" x2="123" y2="215" stroke="#000000" stroke-width="2"/>
  <line x1="167" y1="25" x2="167" y2="215" stroke="#000000" stroke-width="2"/>
  <line x1="211" y1="25" x2="211" y2="215" stroke="#000000" stroke-width="2"/>
  <line x1="35" y1="63" x2="255" y2="63" stroke="#000000" stroke-width="2"/>
  <line x1="35" y1="101" x2="255" y2="101" stroke="#000000" stroke-width="2"/>
  <line x1="35" y1="139" x2="255" y2="139" stroke="#000000" stroke-width="2"/>
  <line x1="35" y1="177" x2="255" y2="177" stroke="#000000" stroke-width="2"/>
  <!-- alternating cell tints -->
  <rect x="35" y="25" width="44" height="38" fill="#dff3fd" stroke="none"/>
  <rect x="123" y="25" width="44" height="38" fill="#dff3fd" stroke="none"/>
  <rect x="211" y="25" width="44" height="38" fill="#dff3fd" stroke="none"/>
  <rect x="79" y="63" width="44" height="38" fill="#dff3fd" stroke="none"/>
  <rect x="167" y="63" width="44" height="38" fill="#dff3fd" stroke="none"/>
  <rect x="35" y="101" width="44" height="38" fill="#dff3fd" stroke="none"/>
  <rect x="123" y="101" width="44" height="38" fill="#dff3fd" stroke="none"/>
  <rect x="211" y="101" width="44" height="38" fill="#dff3fd" stroke="none"/>
  <rect x="79" y="139" width="44" height="38" fill="#dff3fd" stroke="none"/>
  <rect x="167" y="139" width="44" height="38" fill="#dff3fd" stroke="none"/>
  <rect x="35" y="177" width="44" height="38" fill="#dff3fd" stroke="none"/>
  <rect x="123" y="177" width="44" height="38" fill="#dff3fd" stroke="none"/>
  <rect x="211" y="177" width="44" height="38" fill="#dff3fd" stroke="none"/>
  <!-- re-draw grid border + lines on top of tints -->
  <rect x="35" y="25" width="220" height="190" fill="none" stroke="#000000" stroke-width="3"/>
  <line x1="79" y1="25" x2="79" y2="215" stroke="#000000" stroke-width="2"/>
  <line x1="123" y1="25" x2="123" y2="215" stroke="#000000" stroke-width="2"/>
  <line x1="167" y1="25" x2="167" y2="215" stroke="#000000" stroke-width="2"/>
  <line x1="211" y1="25" x2="211" y2="215" stroke="#000000" stroke-width="2"/>
  <line x1="35" y1="63" x2="255" y2="63" stroke="#000000" stroke-width="2"/>
  <line x1="35" y1="101" x2="255" y2="101" stroke="#000000" stroke-width="2"/>
  <line x1="35" y1="139" x2="255" y2="139" stroke="#000000" stroke-width="2"/>
  <line x1="35" y1="177" x2="255" y2="177" stroke="#000000" stroke-width="2"/>
  <!-- ladder going up (lower-left to upper-middle) -->
  <line x1="55" y1="200" x2="100" y2="40" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <line x1="72" y1="200" x2="117" y2="40" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <!-- ladder rungs -->
  <line x1="59" y1="186" x2="74" y2="186" stroke="#9d7246" stroke-width="4" stroke-linecap="round"/>
  <line x1="63" y1="162" x2="79" y2="162" stroke="#9d7246" stroke-width="4" stroke-linecap="round"/>
  <line x1="69" y1="138" x2="86" y2="138" stroke="#9d7246" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="114" x2="92" y2="114" stroke="#9d7246" stroke-width="4" stroke-linecap="round"/>
  <line x1="81" y1="90" x2="98" y2="90" stroke="#9d7246" stroke-width="4" stroke-linecap="round"/>
  <line x1="87" y1="66" x2="105" y2="66" stroke="#9d7246" stroke-width="4" stroke-linecap="round"/>
  <!-- ladder outline -->
  <line x1="55" y1="200" x2="100" y2="40" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="200" x2="117" y2="40" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- chute/slide (curvy red slide from top-right going down) -->
  <path d="M 220 45 Q 240 90 200 130 Q 160 170 220 205" stroke="#f8130d" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M 220 45 Q 240 90 200 130 Q 160 170 220 205" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- slide centre highlight -->
  <path d="M 220 45 Q 240 90 200 130 Q 160 170 220 205" stroke="#f4a4b2" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- arrow at top of ladder pointing up -->
  <path d="M 108 32 L 102 42 L 114 42 Z" fill="#137827" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- arrow at bottom of slide pointing down -->
  <path d="M 220 215 L 213 205 L 227 205 Z" fill="#f8130d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
</svg>
