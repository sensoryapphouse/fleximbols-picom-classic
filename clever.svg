  <!-- Clever-modern: thoughtful smile, finger to temple, lightbulb idea above -->
  <!-- Bust: shoulders + head -->
  <rect x="88" y="152" width="114" height="72" rx="14" fill="#2a4ec0" stroke="#000000" stroke-width="5"/>
  <!-- Left arm resting -->
  <line x1="90" y1="168" x2="58" y2="185" stroke="#2a4ec0" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="52" cy="188" rx="11" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right arm raised — finger to temple -->
  <line x1="200" y1="162" x2="212" y2="130" stroke="#2a4ec0" stroke-width="16" stroke-linecap="round"/>
  <!-- Hand at temple -->
  <ellipse cx="214" cy="122" rx="12" ry="12" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Index finger pointing to temple -->
  <rect x="210" y="98" width="8" height="24" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Neck -->
  <rect x="130" y="132" width="30" height="24" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head -->
  <ellipse cx="145" cy="96" rx="44" ry="42" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="145" cy="57" rx="42" ry="17" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Thoughtful eyes — looking slightly up/sideways -->
  <ellipse cx="130" cy="90" rx="8" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="160" cy="90" rx="8" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="133" cy="88" r="4" fill="#000000"/>
  <circle cx="163" cy="88" r="4" fill="#000000"/>
  <!-- Eyebrows — one raised in thought -->
  <path d="M120 78 Q130 74 140 78" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 75 Q160 70 170 77" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Thoughtful pleasant smile -->
  <path d="M126 110 Q145 124 164 110" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Lightbulb above head -->
  <!-- Bulb glass -->
  <ellipse cx="145" cy="28" rx="24" ry="26" fill="#f2e40d" stroke="#000000" stroke-width="4"/>
  <!-- Bulb base sections -->
  <rect x="134" y="50" width="22" height="8" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <rect x="136" y="56" width="18" height="5" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- Filament squiggle inside -->
  <path d="M145 44 Q138 34 145 24 Q152 14 145 6" fill="none" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <!-- Light glow ring around bulb -->
  <ellipse cx="145" cy="28" rx="32" ry="34" fill="none" stroke="#f2e40d" stroke-width="3" stroke-dasharray="4,5"/>
  <!-- Light rays -->
  <line x1="112" y1="14" x2="104" y2="6" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <line x1="178" y1="14" x2="186" y2="6" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <line x1="108" y1="32" x2="98" y2="28" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <line x1="182" y1="32" x2="192" y2="28" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <!-- Connection line from bulb to head -->
  <line x1="145" y1="61" x2="145" y2="54" stroke="#f2e40d" stroke-width="3" stroke-dasharray="4,3"/>
