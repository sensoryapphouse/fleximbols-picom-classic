  <!-- cloud-engineer: full body person with big cloud + connected server boxes -->

  <!-- Person: full body, standing left -->
  <!-- Head -->
  <circle cx="66" cy="52" r="20" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="66" cy="38" rx="20" ry="10" fill="#000000" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <rect x="46" y="74" width="40" height="52" rx="6" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm -->
  <line x1="46" y1="84" x2="26" y2="116" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="26" cy="118" r="6" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Right arm pointing up at cloud -->
  <line x1="86" y1="80" x2="120" y2="56" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="122" cy="55" r="6" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Hips -->
  <rect x="44" y="124" width="44" height="22" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect x="44" y="144" width="16" height="52" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="72" y="144" width="16" height="52" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left foot -->
  <rect x="38" y="192" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right foot -->
  <rect x="70" y="192" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Cloud (big, centre-right) -->
  <ellipse cx="195" cy="72" rx="36" ry="26" fill="#dff3fd" stroke="#000000" stroke-width="5"/>
  <ellipse cx="166" cy="82" rx="24" ry="20" fill="#dff3fd" stroke="#000000" stroke-width="5"/>
  <ellipse cx="224" cy="82" rx="22" ry="18" fill="#dff3fd" stroke="#000000" stroke-width="5"/>
  <!-- Cloud bottom fill (cover lower arcs) -->
  <rect x="144" y="82" width="102" height="22" fill="#dff3fd" stroke="none"/>
  <line x1="144" y1="104" x2="246" y2="104" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="144" y1="82" x2="144" y2="104" stroke="none"/>

  <!-- Connection lines from cloud to servers -->
  <line x1="174" y1="106" x2="160" y2="136" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-dasharray="5,3"/>
  <line x1="195" y1="106" x2="195" y2="136" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-dasharray="5,3"/>
  <line x1="216" y1="106" x2="230" y2="136" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-dasharray="5,3"/>

  <!-- Server box left -->
  <rect x="136" y="136" width="46" height="30" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <line x1="136" y1="150" x2="182" y2="150" stroke="#000000" stroke-width="2"/>
  <circle cx="174" cy="143" r="3" fill="#529929" stroke="#000000" stroke-width="2"/>

  <!-- Server box centre -->
  <rect x="172" y="136" width="46" height="30" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <line x1="172" y1="150" x2="218" y2="150" stroke="#000000" stroke-width="2"/>
  <circle cx="210" cy="143" r="3" fill="#529929" stroke="#000000" stroke-width="2"/>

  <!-- Server box right -->
  <rect x="208" y="136" width="46" height="30" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <line x1="208" y1="150" x2="254" y2="150" stroke="#000000" stroke-width="2"/>
  <circle cx="246" cy="143" r="3" fill="#529929" stroke="#000000" stroke-width="2"/>
</svg>
