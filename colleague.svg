  <circle cx="244" cy="130" r="7" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- Legs -->
  <rect x="192" y="148" width="16" height="60" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="212" y="148" width="16" height="60" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="188" y="206" width="26" height="10" rx="4" fill="#000000" stroke="#000000" stroke-width="3"/>
  <rect x="212" y="206" width="26" height="10" rx="4" fill="#000000" stroke="#000000" stroke-width="3"/>
