  <line x1="188" y1="100" x2="152" y2="124" stroke="#000000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Right arm (down) -->
  <line x1="232" y1="94" x2="242" y2="128" stroke="#7c3fac" stroke-width="14" stroke-linecap="round"/>
