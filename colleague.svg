  <circle cx="210" cy="60" r="18" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <path d="M192,56 Q196,38 210,38 Q224,38 228,56 Q228,68 224,68 L196,68 Q192,68 192,56Z" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="204" cy="62" r="2.5" fill="#000000"/>
  <circle cx="216" cy="62" r="2.5" fill="#000000"/>
  <path d="M204,70 Q210,74 216,70" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <rect x="204" y="76" width="12" height="8" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
