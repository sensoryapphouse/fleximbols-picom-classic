  <line x1="102" y1="100" x2="138" y2="124" stroke="#000000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Legs -->
  <rect x="62" y="148" width="16" height="60" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="82" y="148" width="16" height="60" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="56" y="206" width="26" height="10" rx="4" fill="#000000" stroke="#000000" stroke-width="3"/>
  <rect x="82" y="206" width="26" height="10" rx="4" fill="#000000" stroke="#000000" stroke-width="3"/>
