  <line x1="126" y1="170" x2="164" y2="170" stroke="#000000" stroke-width="2"/>
  <line x1="126" y1="178" x2="164" y2="178" stroke="#000000" stroke-width="2"/>
  <line x1="126" y1="186" x2="156" y2="186" stroke="#000000" stroke-width="2"/>
  <!-- Connect dashed line from handshake to document -->
  <line x1="145" y1="134" x2="145" y2="160" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="4 3"/>
