  <!-- Neck -->
  <rect x="74" y="76" width="12" height="8" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Torso -->
  <path d="M58,86 L70,84 L80,90 L90,84 L102,86 L104,148 L56,148 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
