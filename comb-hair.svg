  <!-- Figure combing hair with a toothed comb -->
  <!-- Head -->
  <circle cx="128" cy="35" r="26" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M102 28 Q104 8 128 8 Q152 8 154 28 Q148 14 128 14 Q108 14 102 28Z" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Hair on side being combed -->
  <path d="M152 30 Q168 48 172 75 Q174 95 168 112" stroke="#9d7246" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M154 28 Q172 46 178 73 Q182 93 176 112" stroke="#9d7246" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="116" y="60" width="24" height="20" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <path d="M93 82 Q98 78 116 78 L128 80 L140 78 Q158 78 163 82 L166 148 Q166 155 158 155 L98 155 Q90 155 90 148Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right arm raised to hair, holding comb -->
  <path d="M158 88 Q180 82 192 70 Q198 62 195 55" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M155 86 Q176 80 190 68 Q198 60 196 52 Q198 50 200 52 Q200 60 196 70 Q184 84 162 90Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Hand at hair level -->
  <ellipse cx="192" cy="62" rx="13" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- COMB (distinctive toothed shape) -->
  <!-- Comb spine/back bar -->
  <rect x="188" y="28" width="52" height="14" rx="4" ry="4" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Comb teeth (7 teeth pointing down) -->
  <rect x="192" y="42" width="6" height="20" rx="2" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <rect x="202" y="42" width="6" height="20" rx="2" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <rect x="212" y="42" width="6" height="20" rx="2" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <rect x="222" y="42" width="6" height="18" rx="2" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <rect x="232" y="42" width="6" height="16" rx="2" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- Left arm down -->
  <path d="M93 88 Q74 100 70 125" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M90 86 Q70 98 66 124 Q65 132 72 135 Q79 137 82 130 Q86 108 104 96Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Legs -->
  <rect x="98" y="153" width="24" height="70" rx="8" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="134" y="153" width="24" height="70" rx="8" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="110" cy="222" rx="16" ry="8" fill="#5e1f0a" stroke="#000000" stroke-width="4"/>
  <ellipse cx="146" cy="222" rx="16" ry="8" fill="#5e1f0a" stroke="#000000" stroke-width="4"/>
</svg>
