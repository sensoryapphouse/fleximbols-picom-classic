  <!-- House body -->
  <rect x="140" y="120" width="130" height="100" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Roof -->
  <polygon points="130,125 205,60 280,125" fill="#d01424" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Window -->
  <rect x="220" y="135" width="28" height="24" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <line x1="234" y1="135" x2="234" y2="159" stroke="#000000" stroke-width="2"/>
  <line x1="220" y1="147" x2="248" y2="147" stroke="#000000" stroke-width="2"/>
  <!-- Door frame - open door (swung open showing figure entering) -->
  <rect x="152" y="155" width="42" height="65" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Open door panel (angled) -->
  <polygon points="152,155 138,162 138,218 152,220" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Door knob on open door -->
  <circle cx="150" cy="188" r="4" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <!-- Inside of doorway (darker) -->
  <rect x="153" y="156" width="40" height="63" fill="#b8b8b8" stroke="none"/>
  <!-- Figure arriving - facing toward house (front-ish view, stepping through door) -->
  <!-- Head -->
  <circle cx="105" cy="100" r="18" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M88,92 Q105,78 122,92" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Body -->
  <rect x="91" y="118" width="28" height="42" rx="4" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm (raised in greeting) -->
  <line x1="91" y1="122" x2="74" y2="105" stroke="#e6b98a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="70" cy="102" r="5" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Right arm (holding bag) -->
  <line x1="119" y1="122" x2="132" y2="140" stroke="#e6b98a" stroke-width="5" stroke-linecap="round"/>
  <!-- Bag -->
  <rect x="126" y="138" width="16" height="20" rx="3" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M129,138 Q134,130 139,138" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs - stepping forward -->
  <line x1="98" y1="160" x2="88" y2="195" stroke="#4d4d4d" stroke-width="6" stroke-linecap="round"/>
  <line x1="88" y1="195" x2="80" y2="196" stroke="#4d4d4d" stroke-width="5" stroke-linecap="round"/>
  <line x1="112" y1="160" x2="118" y2="192" stroke="#4d4d4d" stroke-width="6" stroke-linecap="round"/>
  <line x1="118" y1="192" x2="130" y2="192" stroke="#4d4d4d" stroke-width="5" stroke-linecap="round"/>
  <!-- Grass/ground -->
  <rect x="15" y="215" width="260" height="15" rx="3" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
</svg>
