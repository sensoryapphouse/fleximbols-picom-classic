  <!-- Figure seated on train/bus, window showing buildings passing -->
  <!-- Train/bus carriage exterior outline -->
  <rect x="18" y="68" width="252" height="152" rx="18" fill="#90a7d6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Carriage roof bar / top strip -->
  <rect x="18" y="68" width="252" height="22" rx="18" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Window frame (large window to right) -->
  <rect x="148" y="82" width="100" height="80" rx="8" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Buildings passing outside window (motion blurred feel) -->
  <!-- Building 1 -->
  <rect x="156" y="92" width="18" height="56" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <rect x="158" y="96" width="6" height="8" rx="1" fill="#f7de58" stroke="#000000" stroke-width="1"/>
  <rect x="166" y="96" width="6" height="8" rx="1" fill="#dff3fd" stroke="#000000" stroke-width="1"/>
  <rect x="158" y="110" width="6" height="8" rx="1" fill="#dff3fd" stroke="#000000" stroke-width="1"/>
  <!-- Building 2 (taller) -->
  <rect x="182" y="86" width="22" height="62" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <rect x="185" y="90" width="6" height="8" rx="1" fill="#dff3fd" stroke="#000000" stroke-width="1"/>
  <rect x="193" y="90" width="6" height="8" rx="1" fill="#f7de58" stroke="#000000" stroke-width="1"/>
  <rect x="185" y="104" width="6" height="8" rx="1" fill="#dff3fd" stroke="#000000" stroke-width="1"/>
  <rect x="193" y="104" width="6" height="8" rx="1" fill="#dff3fd" stroke="#000000" stroke-width="1"/>
  <!-- Building 3 (partial, moving off) -->
  <rect x="212" y="96" width="28" height="52" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <rect x="216" y="100" width="7" height="8" rx="1" fill="#dff3fd" stroke="#000000" stroke-width="1"/>
  <rect x="226" y="100" width="7" height="8" rx="1" fill="#f7de58" stroke="#000000" stroke-width="1"/>
  <!-- Motion lines on window edge -->
  <line x1="148" y1="110" x2="158" y2="110" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <line x1="148" y1="120" x2="160" y2="120" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <line x1="148" y1="130" x2="156" y2="130" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <!-- Seat / bench -->
  <rect x="34" y="162" width="108" height="16" rx="6" fill="#9d7246" stroke="#000000" stroke-width="4"/>
  <!-- Seat back -->
  <rect x="34" y="132" width="108" height="36" rx="6" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <!-- Seated figure -->
  <!-- Torso -->
  <rect x="62" y="110" width="42" height="52" rx="8" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="83" cy="90" r="22" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M62 86 Q65 68 83 66 Q101 68 104 86" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Eyes (looking at window/phone) -->
  <circle cx="76" cy="89" r="3" fill="#000000"/>
  <circle cx="90" cy="89" r="3" fill="#000000"/>
  <!-- Relaxed mouth -->
  <path d="M76 99 Q83 104 90 99" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legs (seated, bent at knees) -->
  <!-- Upper legs horizontal -->
  <rect x="56" y="162" width="22" height="16" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <rect x="84" y="162" width="22" height="16" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Lower legs hanging down -->
  <rect x="56" y="178" width="16" height="32" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <rect x="90" y="178" width="16" height="32" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Shoes -->
  <ellipse cx="64" cy="212" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="98" cy="212" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Arms / hands on lap -->
  <path d="M62 130 Q52 148 52 164" fill="none" stroke="#eed5b6" stroke-width="12" stroke-linecap="round"/>
  <path d="M104 130 Q114 148 114 164" fill="none" stroke="#eed5b6" stroke-width="12" stroke-linecap="round"/>
  <!-- Hands resting -->
  <ellipse cx="53" cy="166" rx="10" ry="8" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <ellipse cx="115" cy="166" rx="10" ry="8" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Train wheel hint at bottom -->
  <circle cx="60" cy="222" r="12" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <circle cx="60" cy="222" r="5" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <circle cx="220" cy="222" r="12" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <circle cx="220" cy="222" r="5" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- Rail -->
  <line x1="18" y1="234" x2="270" y2="234" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
</svg>
