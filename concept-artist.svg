<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- CONCEPT-ARTIST: person at easel painting sweeping environment vista, brush in hand -->
  <!-- Easel legs -->
  <line x1="80" y1="180" x2="72" y2="218" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="162" y1="180" x2="170" y2="218" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="180" x2="118" y2="218" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Easel crossbar -->
  <rect x="74" y="174" width="92" height="8" rx="3" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Canvas frame -->
  <rect x="78" y="76" width="122" height="96" rx="5" fill="#f5e7c4" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Painted vista: sky -->
  <rect x="82" y="80" width="114" height="50" rx="3" fill="#dff3fd" stroke="none"/>
  <!-- Mountains -->
  <polygon points="82,130 110,92 138,130" fill="#7f7f7f" stroke="none"/>
  <polygon points="116,130 148,84 180,130" fill="#b8b8b8" stroke="none"/>
  <!-- Foreground ground -->
  <rect x="82" y="130" width="114" height="38" rx="0" fill="#529929" stroke="none"/>
  <!-- Trees -->
  <polygon points="96,130 102,112 108,130" fill="#137827" stroke="none"/>
  <polygon points="168,130 174,108 180,130" fill="#137827" stroke="none"/>
  <!-- Sun -->
  <circle cx="176" cy="90" r="10" fill="#f2e40d" stroke="none"/>
  <!-- Canvas border on top of painting -->
  <rect x="78" y="76" width="122" height="96" rx="5" fill="none" stroke="#000000" stroke-width="5"/>
  <!-- Canvas ledge on easel -->
  <rect x="74" y="168" width="92" height="8" rx="3" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Brush (held by person pointing at canvas) -->
  <line x1="216" y1="148" x2="196" y2="128" stroke="#9d7246" stroke-width="5" stroke-linecap="round"/>
  <rect x="210" y="144" width="20" height="8" rx="2" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round" transform="rotate(-40 220 148)"/>
  <path d="M196 128 Q192 122 188 124" fill="#f266aa" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Person: legs -->
  <line x1="218" y1="204" x2="212" y2="226" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="236" y1="204" x2="236" y2="226" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="210" cy="228" rx="8" ry="4" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <ellipse cx="236" cy="228" rx="8" ry="4" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Person: torso -->
  <rect x="212" y="168" width="28" height="36" rx="5" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Person: right arm pointing at canvas -->
  <line x1="212" y1="178" x2="193" y2="158" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="191" cy="156" r="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Person: left arm down -->
  <line x1="240" y1="178" x2="248" y2="198" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="249" cy="200" r="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Person: neck -->
  <rect x="220" y="159" width="10" height="10" rx="2" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Person: head -->
  <circle cx="225" cy="150" r="14" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M211 147 Q225 133 239 147" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Palette in left hand -->
  <ellipse cx="249" cy="208" rx="10" ry="7" fill="#f5e7c4" stroke="#000000" stroke-width="4"/>
  <circle cx="244" cy="207" r="3" fill="#f8130d" stroke="none"/>
  <circle cx="250" cy="204" r="3" fill="#f2e40d" stroke="none"/>
  <circle cx="255" cy="208" r="3" fill="#2a4ec0" stroke="none"/>
</svg>
