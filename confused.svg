  <!-- Neck -->
  <rect x="130" y="152" width="40" height="28" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shoulders / bust - slightly off-center due to head tilt -->
  <path d="M62 240 Q62 195 97 188 L147 180 L197 188 Q232 195 232 240 Z" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head - tilted to one side (right tilt) -->
  <ellipse cx="150" cy="110" rx="62" ry="66" fill="#eed5b6" stroke="#000000" stroke-width="5" transform="rotate(12 150 110)"/>
  <!-- Hair on tilted head -->
  <ellipse cx="150" cy="58" rx="62" ry="24" fill="#5e1f0a" stroke="#000000" stroke-width="5" transform="rotate(12 150 58)"/>
  <rect x="88" y="50" width="124" height="20" rx="8" fill="#5e1f0a" stroke="#000000" stroke-width="5" transform="rotate(12 150 58)"/>
  <!-- Left eyebrow - scrunched/knit toward center -->
  <path d="M102 86 Q120 78 136 83" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" transform="rotate(12 119 82)"/>
  <!-- Right eyebrow - scrunched -->
  <path d="M158 80 Q174 73 190 78" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" transform="rotate(12 174 76)"/>
  <!-- Left eye - squinting slightly, confused -->
  <ellipse cx="118" cy="102" rx="13" ry="11" fill="#ffffff" stroke="#000000" stroke-width="4" transform="rotate(12 118 102)"/>
  <circle cx="120" cy="103" r="7" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <circle cx="123" cy="100" r="3" fill="#ffffff"/>
  <!-- Right eye - slightly wider -->
  <ellipse cx="172" cy="98" rx="13" ry="13" fill="#ffffff" stroke="#000000" stroke-width="4" transform="rotate(12 172 98)"/>
  <circle cx="174" cy="99" r="8" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <circle cx="177" cy="96" r="3" fill="#ffffff"/>
  <!-- Nose -->
  <path d="M143 114 L139 127 L146 129 L153 127 L149 114" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(12 146 121)"/>
  <!-- Wavy uncertain mouth - scrunched, puzzled -->
  <path d="M122 144 Q133 138 145 144 Q157 150 168 144" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Question mark "?" drawn as path (no text) - top right -->
  <!-- Q curve top of ? -->
  <path d="M228 45 Q246 32 256 45 Q264 56 250 68 Q244 74 244 82" stroke="#000000" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Q dot -->
  <circle cx="244" cy="92" r="5" fill="#000000"/>
  <!-- Small swirl above head - confusion indicator -->
  <path d="M178 48 Q188 38 196 44 Q202 50 196 56 Q190 62 182 58 Q176 54 178 48" stroke="#f266aa" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
