  <!-- Conga: tall single barrel drum on stand/legs -->
  <!-- Stand legs -->
  <line x1="108" y1="200" x2="88" y2="228" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="182" y1="200" x2="202" y2="228" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Leg feet -->
  <ellipse cx="88" cy="228" rx="10" ry="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="202" cy="228" rx="10" ry="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Stand crossbar -->
  <line x1="100" y1="210" x2="190" y2="210" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Drum barrel body (tall, slightly narrower at base) -->
  <path d="M102,58 L98,200 Q98,208 145,210 Q192,208 192,200 L188,58 Z" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Bottom rim oval -->
  <ellipse cx="145" cy="200" rx="47" ry="12" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Drum head (top, wide) -->
  <ellipse cx="145" cy="58" rx="44" ry="14" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head tensioning hoop -->
  <ellipse cx="145" cy="58" rx="44" ry="14" fill="none" stroke="#4d4d4d" stroke-width="4"/>
  <!-- Tuning lugs (6 around top) -->
  <rect x="100" y="68" width="9" height="16" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="119" y="65" width="9" height="16" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="140" y="64" width="9" height="16" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="161" y="65" width="9" height="16" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="180" y="68" width="9" height="16" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Wood stave lines on barrel -->
  <line x1="118" y1="60" x2="116" y2="198" stroke="#7d5e23" stroke-width="2" stroke-linecap="round"/>
  <line x1="131" y1="59" x2="130" y2="200" stroke="#7d5e23" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="59" x2="145" y2="200" stroke="#7d5e23" stroke-width="2" stroke-linecap="round"/>
  <line x1="159" y1="59" x2="160" y2="200" stroke="#7d5e23" stroke-width="2" stroke-linecap="round"/>
  <line x1="172" y1="60" x2="174" y2="198" stroke="#7d5e23" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom hoop band -->
  <path d="M100,185 Q100,194 145,196 Q190,194 190,185" fill="none" stroke="#5e1f0a" stroke-width="5" stroke-linecap="round"/>
</svg>
