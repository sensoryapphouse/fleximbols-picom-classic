  <!-- Tile frame -->
  <rect x="25" y="20" width="240" height="200" rx="18" ry="18" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- === PERSON (full body) === -->
  <!-- Head -->
  <circle cx="145" cy="52" r="22" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M123,48 Q124,30 145,28 Q166,30 167,48" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="137" y="70" width="16" height="14" rx="4" ry="4" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Torso (t-shirt) -->
  <path d="M112,84 L178,84 L182,140 L108,140 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Arms -->
  <!-- Left arm raised to hold camera -->
  <path d="M112,88 L82,100 L75,130" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left hand -->
  <circle cx="74" cy="133" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right arm raised slightly -->
  <path d="M178,88 L208,105 L215,130" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right hand -->
  <circle cx="216" cy="133" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Legs -->
  <!-- Left leg -->
  <path d="M122,140 L116,190 L108,215" fill="none" stroke="#4d4d4d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right leg -->
  <path d="M168,140 L174,190 L182,215" fill="none" stroke="#4d4d4d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="105" cy="217" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="184" cy="217" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="2"/>

  <!-- === CAMERA (held at left hand level) === -->
  <rect x="52" y="120" width="50" height="34" rx="6" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="90" cy="137" r="10" fill="#000000" stroke="#000000" stroke-width="3"/>
  <circle cx="90" cy="137" r="6" fill="#7f7f7f"/>
  <!-- Camera hot shoe -->
  <rect x="62" y="114" width="20" height="8" rx="2" ry="2" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- Record button -->
  <circle cx="64" cy="137" r="5" fill="#f8130d" stroke="#000000" stroke-width="2"/>

  <!-- === RING LIGHT (around camera, behind) === -->
  <circle cx="90" cy="137" r="26" fill="none" stroke="#f7de58" stroke-width="6"/>
  <circle cx="90" cy="137" r="20" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- === SCREEN / MONITOR (right side, at chest height) === -->
  <rect x="190" y="110" width="62" height="46" rx="6" ry="6" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Screen content: waveform lines -->
  <path d="M198,133 L205,120 L212,140 L218,122 L224,136 L230,126 L236,133 L242,128" fill="none" stroke="#f7de58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Screen stand -->
  <rect x="214" y="155" width="14" height="10" rx="2" ry="2" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <rect x="208" y="163" width="26" height="6" rx="2" ry="2" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
</svg>
