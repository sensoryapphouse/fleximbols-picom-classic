  <!-- frying pan with sizzling egg + steam + handle -->
  <!-- steam wisps -->
  <path d="M110 30 C100 50 120 60 110 80" fill="none" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M145 20 C135 40 155 55 145 75" fill="none" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M180 30 C170 50 190 60 180 80" fill="none" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <!-- pan body (ellipse top, side) -->
  <ellipse cx="135" cy="150" rx="100" ry="22" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <path d="M35 150 L45 185 C45 195 225 195 225 185 L235 150 Z" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- pan interior (inside ellipse on top) -->
  <ellipse cx="135" cy="150" rx="92" ry="18" fill="#000000"/>
  <!-- egg white (irregular) -->
  <path d="M85 138 C75 142 75 158 95 162 C100 170 130 168 145 162 C170 168 195 158 190 145 C195 135 175 130 160 135 C145 125 110 128 85 138 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- egg yolk -->
