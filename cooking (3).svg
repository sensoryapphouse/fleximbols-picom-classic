  <!-- yolk highlight -->
  <circle cx="130" cy="143" r="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <!-- handle -->
  <rect x="225" y="143" width="50" height="14" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
