  <!-- legs (seated, bent forward) -->
  <path d="M198 160 L218 160 L222 195 L202 195 Z" fill="#1d0e82" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M218 160 L238 160 L242 195 L222 195 Z" fill="#1d0e82" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
