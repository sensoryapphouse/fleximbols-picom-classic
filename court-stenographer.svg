  <!-- floor line -->
  <rect x="20" y="210" width="250" height="14" fill="#9d7246" stroke="#000000" stroke-width="2.5"/>
  <!-- stenographer FULL BODY seated -->
  <!-- head -->
  <circle cx="120" cy="62" r="22" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M100 56 Q102 40 120 38 Q140 40 140 56 Q140 50 130 48 Q120 46 110 50 Q102 52 100 56 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="113" cy="62" r="2.2" fill="#000000"/>
  <circle cx="127" cy="62" r="2.2" fill="#000000"/>
  <!-- mouth -->
  <path d="M115 72 Q120 75 125 72" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="114" y="82" width="12" height="8" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- torso (blouse) -->
  <path d="M86 92 Q120 86 154 92 L160 150 L80 150 Z" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- skirt / lap -->
  <path d="M80 150 L160 150 L168 188 L72 188 Z" fill="#392170" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- left leg -->
  <rect x="86" y="188" width="18" height="22" fill="#4d4d4d" stroke="#000000" stroke-width="2.5"/>
  <!-- right leg -->
  <rect x="138" y="188" width="18" height="22" fill="#4d4d4d" stroke="#000000" stroke-width="2.5"/>
  <!-- shoes -->
  <ellipse cx="95" cy="212" rx="14" ry="5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="147" cy="212" rx="14" ry="5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- chair back hint -->
  <rect x="64" y="120" width="6" height="60" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- left arm reaching to machine -->
  <path d="M90 100 Q70 130 95 150 L130 150" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- right arm -->
  <path d="M150 100 Q180 130 165 150 L140 150" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- hands (fingers typing) on machine -->
  <ellipse cx="200" cy="148" rx="10" ry="7" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <ellipse cx="230" cy="148" rx="10" ry="7" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <!-- finger lines -->
  <path d="M194 144 L194 152 M200 142 L200 152 M206 144 L206 152" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M224 144 L224 152 M230 142 L230 152 M236 144 L236 152" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- stenotype machine on tripod -->
  <rect x="180" y="152" width="80" height="30" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- keys grid -->
  <rect x="186" y="158" width="68" height="8" fill="#4d4d4d" stroke="#000000" stroke-width="1.5"/>
  <circle cx="194" cy="162" r="1.8" fill="#ffffff"/>
  <circle cx="204" cy="162" r="1.8" fill="#ffffff"/>
  <circle cx="214" cy="162" r="1.8" fill="#ffffff"/>
  <circle cx="224" cy="162" r="1.8" fill="#ffffff"/>
  <circle cx="234" cy="162" r="1.8" fill="#ffffff"/>
  <circle cx="244" cy="162" r="1.8" fill="#ffffff"/>
  <!-- paper tape feeding out -->
  <path d="M220 152 Q220 130 240 120 L256 120 L256 130 L242 130 Q230 134 230 152" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- tape lines -->
  <path d="M240 124 L252 124 M240 128 L252 128" stroke="#000000" stroke-width="1.2"/>
  <!-- tripod legs -->
  <path d="M195 182 L182 210" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M245 182 L258 210" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- recording dot -->
  <circle cx="252" cy="158" r="3" fill="#f8130d" stroke="#000000" stroke-width="1.5"/>
</svg>
