<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Cowardly: cringing, hiding behind tiny shield, knees knocking, fearful — opposite of brave -->
  <!-- Small ineffective shield (barely covers anything) -->
  <path d="M56 128 L56 165 Q56 178 75 185 Q94 178 94 165 L94 128 Z" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Tiny shield boss -->
  <circle cx="75" cy="155" r="11" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <line x1="75" y1="132" x2="75" y2="178" stroke="#b8b8b8" stroke-width="4"/>
  <line x1="60" y1="155" x2="90" y2="155" stroke="#b8b8b8" stroke-width="4"/>
  <!-- Body — hunched, leaning back away -->
  <rect x="115" y="128" width="52" height="58" rx="10" fill="#f4a4b2" stroke="#000000" stroke-width="5" transform="rotate(10,141,157)"/>
  <!-- Left arm clutching shield -->
  <rect x="86" y="125" width="36" height="16" rx="8" fill="#f4a4b2" stroke="#000000" stroke-width="4"/>
  <!-- Right arm raised defensively -->
  <line x1="165" y1="130" x2="195" y2="108" stroke="#f4a4b2" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="200" cy="104" rx="12" ry="11" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left leg — knocking knees -->
  <path d="M120 184 Q108 200 115 222" fill="none" stroke="#1d0e82" stroke-width="16" stroke-linecap="round"/>
  <!-- Right leg — knocking knees, touching left at knee -->
  <path d="M148 184 Q140 200 148 222" fill="none" stroke="#1d0e82" stroke-width="16" stroke-linecap="round"/>
  <!-- Feet turned inward -->
  <ellipse cx="118" cy="225" rx="16" ry="8" fill="#000000" stroke="#000000" stroke-width="3" transform="rotate(-15,118,225)"/>
  <ellipse cx="150" cy="225" rx="16" ry="8" fill="#000000" stroke="#000000" stroke-width="3" transform="rotate(15,150,225)"/>
  <!-- Neck -->
  <rect x="130" y="108" width="24" height="24" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head — tilted/pulled back -->
  <ellipse cx="148" cy="82" rx="36" ry="36" fill="#eed5b6" stroke="#000000" stroke-width="5" transform="rotate(8,148,82)"/>
  <!-- Hair -->
  <ellipse cx="148" cy="53" rx="33" ry="14" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
  <!-- Wide scared eyes -->
  <ellipse cx="135" cy="78" rx="9" ry="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="161" cy="78" rx="9" ry="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="136" cy="79" r="5" fill="#000000"/>
  <circle cx="162" cy="79" r="5" fill="#000000"/>
  <!-- Scared highlight dots in eyes -->
  <circle cx="139" cy="75" r="2" fill="#ffffff"/>
  <circle cx="165" cy="75" r="2" fill="#ffffff"/>
  <!-- Eyebrows raised high in fear -->
  <path d="M124 64 Q134 58 143 63" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M152 63 Q161 58 171 64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Trembling scared mouth — downward arc -->
  <path d="M133 96 Q148 90 163 96" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Sweat drops -->
  <ellipse cx="175" cy="68" rx="5" ry="7" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <ellipse cx="185" cy="78" rx="4" ry="6" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <!-- Vibration/shake lines at knees -->
  <line x1="100" y1="202" x2="110" y2="202" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="208" x2="108" y2="208" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
