  <!-- Amigurumi crocheted doll: cute kawaii figure -->
  <!-- Legs (short stubby) -->
  <ellipse cx="120" cy="210" rx="22" ry="14" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <ellipse cx="170" cy="210" rx="22" ry="14" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>

  <!-- Body (round ball) -->
  <ellipse cx="145" cy="170" rx="55" ry="42" fill="#f266aa" stroke="#000000" stroke-width="4"/>
  <!-- Crochet stitch texture on body: V stitches -->
  <g stroke="#d01424" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 105 150 q 4 5 8 0 M 115 150 q 4 5 8 0 M 125 150 q 4 5 8 0 M 135 150 q 4 5 8 0 M 145 150 q 4 5 8 0 M 155 150 q 4 5 8 0 M 165 150 q 4 5 8 0 M 175 150 q 4 5 8 0"/>
    <path d="M 100 165 q 4 5 8 0 M 110 165 q 4 5 8 0 M 120 165 q 4 5 8 0 M 130 165 q 4 5 8 0 M 140 165 q 4 5 8 0 M 150 165 q 4 5 8 0 M 160 165 q 4 5 8 0 M 170 165 q 4 5 8 0 M 180 165 q 4 5 8 0"/>
    <path d="M 100 180 q 4 5 8 0 M 110 180 q 4 5 8 0 M 120 180 q 4 5 8 0 M 130 180 q 4 5 8 0 M 140 180 q 4 5 8 0 M 150 180 q 4 5 8 0 M 160 180 q 4 5 8 0 M 170 180 q 4 5 8 0 M 180 180 q 4 5 8 0"/>
    <path d="M 110 195 q 4 5 8 0 M 120 195 q 4 5 8 0 M 130 195 q 4 5 8 0 M 140 195 q 4 5 8 0 M 150 195 q 4 5 8 0 M 160 195 q 4 5 8 0 M 170 195 q 4 5 8 0"/>
  </g>

  <!-- Arms (stubby) -->
  <ellipse cx="83" cy="155" rx="14" ry="22" fill="#f266aa" stroke="#000000" stroke-width="3" transform="rotate(-25 83 155)"/>
  <ellipse cx="207" cy="155" rx="14" ry="22" fill="#f266aa" stroke="#000000" stroke-width="3" transform="rotate(25 207 155)"/>

  <!-- Head (large round) -->
  <circle cx="145" cy="85" r="55" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head stitch texture -->
  <g stroke="#9d7246" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M 100 60 q 4 5 8 0 M 110 60 q 4 5 8 0 M 120 60 q 4 5 8 0 M 130 60 q 4 5 8 0 M 140 60 q 4 5 8 0 M 150 60 q 4 5 8 0 M 160 60 q 4 5 8 0 M 170 60 q 4 5 8 0 M 180 60 q 4 5 8 0"/>
    <path d="M 95 78 q 4 5 8 0 M 105 78 q 4 5 8 0 M 115 78 q 4 5 8 0 M 175 78 q 4 5 8 0 M 185 78 q 4 5 8 0"/>
    <path d="M 95 110 q 4 5 8 0 M 105 110 q 4 5 8 0 M 175 110 q 4 5 8 0 M 185 110 q 4 5 8 0"/>
  </g>

  <!-- Yarn-hair tuft on top -->
  <path d="M 125 35 Q 135 22 145 32 Q 155 20 165 35" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cute face: big black dot eyes with white sparkle -->
  <circle cx="125" cy="88" r="8" fill="#000000"/>
  <circle cx="165" cy="88" r="8" fill="#000000"/>
  <circle cx="128" cy="85" r="3" fill="#ffffff"/>
  <circle cx="168" cy="85" r="3" fill="#ffffff"/>

  <!-- Cheek blush -->
  <circle cx="110" cy="100" r="6" fill="#f4a4b2" stroke="#000000" stroke-width="1.5"/>
  <circle cx="180" cy="100" r="6" fill="#f4a4b2" stroke="#000000" stroke-width="1.5"/>

  <!-- Tiny smile -->
  <path d="M 138 105 Q 145 112 152 105" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
</svg>
