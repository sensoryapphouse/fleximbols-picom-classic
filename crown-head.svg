  <!-- Head shape -->
  <ellipse cx="145" cy="130" rx="88" ry="95" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Neck -->
  <rect x="122" y="210" width="46" height="24" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left ear -->
  <ellipse cx="57" cy="132" rx="14" ry="20" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Right ear -->
  <ellipse cx="233" cy="132" rx="14" ry="20" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Hair cap -->
  <path d="M78 88 Q145 42 212 88 Q205 60 145 50 Q85 60 78 88Z" fill="#7d5e23" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left eye -->
  <ellipse cx="108" cy="130" rx="18" ry="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="112" cy="130" r="7" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Right eye -->
  <ellipse cx="182" cy="130" rx="18" ry="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="178" cy="130" r="7" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Nose -->
  <path d="M145 134 L137 158 Q145 164 153 158 L145 134" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Mouth -->
  <path d="M122 180 Q145 194 168 180" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- CROWN HIGHLIGHT: topmost point of skull — a bold arc/ellipse at very top of head -->
  <ellipse cx="145" cy="58" rx="40" ry="18" fill="#d01424" stroke="#000000" stroke-width="4"/>
  <!-- Pointer line from crown highlight downward -->
  <line x1="185" y1="52" x2="220" y2="38" stroke="#d01424" stroke-width="4" stroke-linecap="round"/>
  <circle cx="220" cy="38" r="5" fill="#d01424" stroke="#000000" stroke-width="3"/>
