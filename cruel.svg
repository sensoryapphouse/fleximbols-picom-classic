<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Cruel: cold evil grin, sharp eyebrows, clenched fist, broken heart -->
  <!-- Background broken heart (centred upper-right area) -->
  <!-- Left half heart -->
  <path d="M195,22 Q180,12 170,22 Q160,32 195,58 L195,22Z" fill="#d01424" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right half heart -->
  <path d="M195,22 Q210,12 220,22 Q230,32 195,58 L195,22Z" fill="#d01424" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Crack/break line down heart -->
  <path d="M195,18 L188,32 L200,38 L192,58" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Head - slightly angled, cold look -->
  <ellipse cx="130" cy="108" rx="46" ry="50" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair - sharp angular dark -->
  <path d="M84,96 Q90,62 130,56 Q170,62 176,96" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Sharp angular widow's peak -->
  <polygon points="130,56 118,70 142,70" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <!-- Ears -->
  <ellipse cx="84" cy="108" rx="12" ry="15" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <ellipse cx="176" cy="108" rx="12" ry="15" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Cold cruel eyes - narrow, half-lidded -->
  <ellipse cx="114" cy="100" rx="14" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="146" cy="100" rx="14" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Cold grey irises -->
  <ellipse cx="115" cy="101" rx="8" ry="6" fill="#b8b8b8"/>
  <ellipse cx="147" cy="101" rx="8" ry="6" fill="#b8b8b8"/>
  <ellipse cx="116" cy="102" rx="5" ry="4" fill="#000000"/>
  <ellipse cx="148" cy="102" rx="5" ry="4" fill="#000000"/>
  <!-- Heavy upper lids half-covering eyes (cold calculating look) -->
  <path d="M100,96 Q114,90 128,96" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M132,96 Q146,90 160,96" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Sharp pointed evil eyebrows - V shape downward -->
  <polygon points="100,88 114,94 106,86" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="160,88 146,94 154,86" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Nose - sharp -->
  <polyline points="130,108 124,118 136,118" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Evil grin - curled at ends, cold/sharp -->
  <path d="M106,132 Q118,126 130,130 Q142,126 154,132" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M106,132 Q110,140 116,136" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M154,132 Q150,140 144,136" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Teeth - visible in grin, slightly sharp -->
  <path d="M112,132 Q130,138 148,132" fill="#ffffff" stroke="none"/>
  <line x1="120" y1="132" x2="120" y2="137" stroke="#000000" stroke-width="2"/>
  <line x1="130" y1="132" x2="130" y2="138" stroke="#000000" stroke-width="2"/>
  <line x1="140" y1="132" x2="140" y2="137" stroke="#000000" stroke-width="2"/>
  <!-- Neck -->
  <rect x="116" y="157" width="30" height="14" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Dark cold body - rigid posture -->
  <path d="M88,172 Q82,215 92,228 L168,228 Q178,215 172,172 Q158,162 130,164 Q102,162 88,172Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Clenched fist raised - right arm up threatening -->
  <line x1="170" y1="175" x2="212" y2="148" stroke="#eed5b6" stroke-width="11" stroke-linecap="round"/>
  <line x1="170" y1="175" x2="212" y2="148" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Clenched fist shape -->
  <rect x="208" y="136" width="22" height="18" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Finger lines on fist -->
  <line x1="210" y1="142" x2="228" y2="142" stroke="#000000" stroke-width="2"/>
  <line x1="210" y1="148" x2="228" y2="148" stroke="#000000" stroke-width="2"/>
  <!-- Thumb on side -->
  <ellipse cx="207" cy="144" rx="6" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="4" transform="rotate(-30,207,144)"/>
  <!-- Other arm down -->
  <line x1="90" y1="178" x2="62" y2="198" stroke="#eed5b6" stroke-width="11" stroke-linecap="round"/>
  <line x1="90" y1="178" x2="62" y2="198" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <rect x="52" y="195" width="18" height="14" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Sharp jagged lines radiating from fist - impact lines -->
  <line x1="226" y1="128" x2="238" y2="118" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="232" y1="132" x2="248" y2="126" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="234" y1="140" x2="252" y2="138" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
