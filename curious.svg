  <!-- Bust: neck + shoulders — leaning in (offset right slightly) -->
  <rect x="98" y="182" width="100" height="46" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shirt -->
  <path d="M98 194 Q148 213 198 194" fill="#f4a4b2" stroke="#000000" stroke-width="4"/>
  <!-- Neck -->
  <rect x="130" y="165" width="34" height="24" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head — slightly forward lean (centered a bit right) -->
  <ellipse cx="148" cy="112" rx="52" ry="56" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M98 102 Q97 64 120 54 Q148 44 174 54 Q199 64 198 102" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <!-- Left eyebrow: normal -->
  <path d="M110 95 Q125 91 138 95" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Right eyebrow: raised (the curious raised brow) -->
  <path d="M158 90 Q173 84 185 90" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Eyes: bright, wide, intrigued — left normal, right slightly wider -->
  <ellipse cx="124" cy="110" rx="14" ry="11" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="124" cy="110" rx="7" ry="8" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="122" cy="108" rx="2" ry="2" fill="#ffffff"/>
  <ellipse cx="172" cy="108" rx="15" ry="13" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="172" cy="108" rx="8" ry="9" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="170" cy="106" rx="2" ry="2" fill="#ffffff"/>
  <!-- Mouth: slight smile, intrigued -->
  <path d="M130 148 Q148 156 166 148" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Question mark — bold drawn path, right side -->
  <!-- Q-mark arc top -->
  <path d="M230 52 Q254 46 258 64 Q262 78 244 88 L244 96" fill="none" stroke="#f8130d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Q-mark dot -->
  <circle cx="244" cy="106" r="5" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <!-- Small sparkle dots (curiosity bright cues) around question mark -->
  <circle cx="268" cy="52" r="4" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <circle cx="272" cy="72" r="3" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <circle cx="258" cy="46" r="3" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <!-- Leaning line from bust (slight forward lean indicator) -->
  <line x1="145" y1="182" x2="148" y2="178" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
