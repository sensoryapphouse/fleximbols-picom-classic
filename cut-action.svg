  <!-- Document behind scissors -->
  <rect x="85" y="45" width="110" height="145" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Folded corner -->
  <polyline points="165,45 165,72 192,72" fill="none" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="165,45 192,72 192,45" fill="#dff3fd" stroke="none"/>
  <!-- Dashed cut line across document -->
  <line x1="85" y1="145" x2="195" y2="145" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-dasharray="8,6"/>
  <!-- Scissors body - left blade -->
  <path d="M55,175 Q65,155 100,145" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Scissors left handle ring -->
  <circle cx="50" cy="185" r="16" fill="#f7de58" stroke="#000000" stroke-width="4"/>
  <!-- Scissors body - right blade -->
  <path d="M55,115 Q65,135 100,145" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Scissors right handle ring -->
  <circle cx="50" cy="105" r="16" fill="#f7de58" stroke="#000000" stroke-width="4"/>
  <!-- Scissors pivot -->
  <circle cx="100" cy="145" r="6" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Blade tips pointing right -->
  <path d="M100,145 L175,128" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M100,145 L175,162" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Lines on document -->
  <line x1="100" y1="90" x2="165" y2="90" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="105" x2="155" y2="105" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="165" y2="120" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
</svg>
