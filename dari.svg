  <!-- Speech bubble: rounded rect + tail -->
  <!-- Afghan scheme: black / red / green vertical bands + white emblem -->
  <!-- Bubble clip path -->
  <defs>
    <clipPath id="dari-bubble">
      <path d="M25,20 Q25,20 265,20 Q275,20 275,30 L275,175 Q275,185 265,185 L165,185 L150,215 L135,185 L35,185 Q25,185 25,175 Z"/>
    </clipPath>
  </defs>
  <!-- Band 1: black -->
  <rect x="25" y="20" width="83" height="166" fill="#000000" clip-path="url(#dari-bubble)"/>
  <!-- Band 2: red -->
  <rect x="108" y="20" width="84" height="166" fill="#d01424" clip-path="url(#dari-bubble)"/>
  <!-- Band 3: green -->
  <rect x="192" y="20" width="83" height="166" fill="#137827" clip-path="url(#dari-bubble)"/>
  <!-- Bubble outline + tail -->
  <path d="M25,20 Q25,20 265,20 Q275,20 275,30 L275,175 Q275,185 265,185 L165,185 L150,215 L135,185 L35,185 Q25,185 25,175 Z" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- White emblem: simple mosque dome on red band centre -->
  <ellipse cx="150" cy="95" rx="18" ry="12" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <rect x="137" y="107" width="26" height="14" rx="2" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <line x1="150" y1="83" x2="150" y2="72" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="150" cy="70" r="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
</svg>
