<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Daring: mid-air leap over a gap, arms out, excitement — full body -->
  <!-- Ground left platform -->
  <rect x="10" y="195" width="80" height="25" rx="6" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Ground right platform (lower, gap visible) -->
  <rect x="200" y="205" width="80" height="20" rx="6" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Gap line (visual gap) -->
  <line x1="92" y1="220" x2="198" y2="220" stroke="#000000" stroke-width="3" stroke-dasharray="8,6"/>
  <!-- Body mid-air — tilted torso -->
  <rect x="120" y="120" width="50" height="55" rx="10" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round" transform="rotate(-8,145,147)"/>
  <!-- Left arm stretched out back -->
  <line x1="120" y1="135" x2="68" y2="115" stroke="#f8130d" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="62" cy="113" rx="12" ry="11" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right arm stretched forward -->
  <line x1="170" y1="132" x2="222" y2="112" stroke="#f8130d" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="228" cy="110" rx="12" ry="11" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left leg trailing behind -->
  <line x1="130" y1="174" x2="100" y2="205" stroke="#1d0e82" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="95" cy="210" rx="14" ry="9" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Right leg forward kick -->
  <line x1="160" y1="172" x2="192" y2="198" stroke="#1d0e82" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="198" cy="204" rx="14" ry="9" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Neck -->
  <rect x="133" y="102" width="24" height="22" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head -->
  <ellipse cx="145" cy="78" rx="36" ry="36" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="145" cy="47" rx="35" ry="14" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Excited open eyes -->
  <ellipse cx="132" cy="74" rx="7" ry="8" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="158" cy="74" rx="7" ry="8" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="134" cy="75" r="4" fill="#000000"/>
  <circle cx="160" cy="75" r="4" fill="#000000"/>
  <!-- Eyebrows raised high -->
  <path d="M124 62 Q132 57 140 61" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 61 Q158 57 166 62" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Big excited open mouth / whoop -->
  <ellipse cx="145" cy="92" rx="14" ry="10" fill="#d01424" stroke="#000000" stroke-width="3"/>
  <ellipse cx="145" cy="88" rx="12" ry="5" fill="#eed5b6" stroke="none"/>
  <!-- Motion lines -->
  <line x1="38" y1="108" x2="58" y2="114" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="120" x2="54" y2="122" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="132" x2="58" y2="130" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
</svg>
