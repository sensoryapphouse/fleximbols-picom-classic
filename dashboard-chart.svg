  <!-- Dashboard: rounded panel containing gauge + sparkline + donut -->
  <!-- Outer panel -->
  <rect x="24" y="26" width="242" height="188" rx="14" ry="14" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- === GAUGE (top-left, centre 78,105, r=46) === -->
  <!-- Gauge background arc ~180° semicircle (grey) -->
  <path d="M32,105 A46,46 0 0,1 124,105" fill="none" stroke="#b8b8b8" stroke-width="9" stroke-linecap="round"/>
  <!-- Gauge filled arc ~120° (green, left portion) -->
  <path d="M32,105 A46,46 0 0,1 101,62" fill="none" stroke="#529929" stroke-width="9" stroke-linecap="round"/>
  <!-- Gauge needle -->
  <line x1="78" y1="105" x2="100" y2="65" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Gauge pivot -->
  <circle cx="78" cy="105" r="6" fill="#000000"/>

  <!-- === DONUT (top-right, centre 213,95, r=38) === -->
  <!-- Donut ring segments -->
  <path d="M213,57 A38,38 0 0,1 251,95" fill="none" stroke="#2a4ec0" stroke-width="16" stroke-linecap="butt"/>
  <path d="M251,95 A38,38 0 0,1 213,133" fill="none" stroke="#f7de58" stroke-width="16" stroke-linecap="butt"/>
  <path d="M213,133 A38,38 0 1,1 213,57" fill="none" stroke="#f8130d" stroke-width="16" stroke-linecap="butt"/>
  <!-- Donut hole -->
  <circle cx="213" cy="95" r="22" fill="#efefef" stroke="#000000" stroke-width="4"/>

  <!-- === SPARKLINE (bottom strip) === -->
  <rect x="32" y="148" width="226" height="58" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="42,192 72,168 102,178 132,155 162,165 192,143 222,152 248,135" fill="none" stroke="#2a4ec0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
