<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Small simple two-strap day backpack — clearly smaller and simpler than backpack-travel -->
  <!-- Main body: short and compact -->
  <rect x="95" y="75" width="100" height="120" rx="18" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Small top handle loop -->
  <path d="M130 75 Q145 55 160 75" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Single front pocket (smaller) -->
  <rect x="110" y="115" width="70" height="55" rx="10" fill="#67832d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Pocket zip -->
  <line x1="112" y1="132" x2="178" y2="132" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="145" cy="132" rx="5" ry="4" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- Main zip across top of main body -->
  <path d="M100 90 Q145 82 190 90" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="145" cy="86" rx="5" ry="4" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- Two shoulder straps — simple, no frame -->
  <path d="M108 80 C92 105 90 155 100 195" fill="none" stroke="#137827" stroke-width="5" stroke-linecap="round"/>
  <path d="M182 80 C198 105 200 155 190 195" fill="none" stroke="#137827" stroke-width="5" stroke-linecap="round"/>
  <!-- Strap adjuster clips (simple) -->
  <rect x="84" y="140" width="16" height="10" rx="3" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <rect x="190" y="140" width="16" height="10" rx="3" fill="#f7de58" stroke="#000000" stroke-width="3"/>
</svg>
