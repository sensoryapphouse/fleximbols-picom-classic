  <!-- Explosion/speaker source - jagged burst shape -->
  <polygon points="30,120 45,105 38,85 58,95 70,75 78,95 98,82 90,102 110,105 90,118 108,132 86,130 90,152 70,140 60,160 54,138 34,146" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Bold jagged sound blast waves -->
  <!-- Wave 1 -->
  <path d="M115,95 Q130,100 135,120 Q130,140 115,145" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Wave 2 larger -->
  <path d="M128,80 Q152,92 158,120 Q152,148 128,160" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Wave 3 largest jagged -->
  <path d="M142,65 Q162,72 175,85 Q185,105 185,120 Q185,135 175,150 Q162,165 142,172" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Person covering ears - full body figure -->
  <!-- Body -->
  <ellipse cx="242" cy="148" rx="16" ry="22" fill="#dff3fd" stroke="#000000" stroke-width="4"/>
  <!-- Legs -->
  <line x1="234" y1="168" x2="228" y2="200" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="250" y1="168" x2="256" y2="200" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="225" cy="202" rx="8" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <ellipse cx="259" cy="202" rx="8" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Head -->
  <circle cx="242" cy="118" r="20" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Grimace/pain expression - eyes scrunched -->
  <path d="M234,113 Q238,110 242,113" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M242,113 Q246,110 250,113" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Open mouth in distress -->
  <ellipse cx="242" cy="123" rx="6" ry="4" fill="#d01424" stroke="#000000" stroke-width="2"/>
  <!-- Arms covering ears -->
  <path d="M228,135 Q215,120 220,108" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M256,135 Q269,120 264,108" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Hands on ears -->
  <circle cx="220" cy="107" r="8" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <circle cx="264" cy="107" r="8" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
