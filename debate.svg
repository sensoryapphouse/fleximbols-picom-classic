  <circle cx="55" cy="35" r="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="75" cy="35" r="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="95" cy="35" r="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
