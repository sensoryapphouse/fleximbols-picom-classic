  <path d="M275 35 Q275 10 245 10 L190 10 Q160 10 160 35 Q160 60 190 60 L235 60 L250 78 L240 60 L245 60 Q275 60 275 35 Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Bubble content dashes -->
  <rect x="178" y="28" width="26" height="8" rx="3" fill="#ffffff"/>
  <rect x="210" y="28" width="18" height="8" rx="3" fill="#ffffff"/>
  <rect x="178" y="42" width="40" height="8" rx="3" fill="#ffffff"/>
