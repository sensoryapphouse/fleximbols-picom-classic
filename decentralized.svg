  <circle cx="145" cy="40" r="16" fill="#137827" stroke="#000000" stroke-width="4"/>
  <circle cx="230" cy="50" r="16" fill="#7c3fac" stroke="#000000" stroke-width="4"/>
  <circle cx="40" cy="120" r="16" fill="#ff9900" stroke="#000000" stroke-width="4"/>
