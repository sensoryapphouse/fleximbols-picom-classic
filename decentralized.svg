  <line x1="130" y1="106" x2="160" y2="134" stroke="#d01424" stroke-width="5" stroke-linecap="round"/>
  <!-- DECENTRALISED label band -->
  <rect x="10" y="208" width="270" height="26" rx="3" fill="#000000" stroke="#000000" stroke-width="2"/>
