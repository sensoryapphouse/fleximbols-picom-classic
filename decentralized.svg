  <!-- Decentralized mesh: peer nodes connected to each other, NO central hub. -->
  <!-- Edges (mesh) -->
  <line x1="60" y1="50" x2="145" y2="40" stroke="#000000" stroke-width="3"/>
  <line x1="145" y1="40" x2="230" y2="50" stroke="#000000" stroke-width="3"/>
  <line x1="60" y1="50" x2="40" y2="120" stroke="#000000" stroke-width="3"/>
