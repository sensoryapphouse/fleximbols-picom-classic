  <line x1="80" y1="180" x2="210" y2="180" stroke="#000000" stroke-width="3"/>
  <line x1="60" y1="50" x2="145" y2="120" stroke="#000000" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="230" y1="50" x2="145" y2="120" stroke="#000000" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="40" y1="120" x2="145" y2="120" stroke="#000000" stroke-width="2" stroke-dasharray="4 3"/>
