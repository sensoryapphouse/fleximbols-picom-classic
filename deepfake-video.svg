  <!-- Video frame border -->
  <rect x="28" y="36" width="234" height="158" rx="10" ry="10" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="40" y="48" width="210" height="134" rx="6" ry="6" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Face left half (real) — skin tone -->
  <path d="M100,82 A45,55 0 0,0 100,192 L145,192 L145,82 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left eye -->
  <ellipse cx="118" cy="120" rx="10" ry="12" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="118" cy="120" r="6" fill="#5e1f0a"/>
  <circle cx="118" cy="120" r="3" fill="#000000"/>
  <!-- Left eyebrow -->
  <path d="M106,104 Q118,98 130,104" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Face right half (fake) — different skin + mask edge -->
  <path d="M145,82 L145,192 A45,55 0 0,0 145,82 Z" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right eye different — stylised/uncanny -->
  <ellipse cx="172" cy="120" rx="10" ry="12" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="172" cy="120" r="6" fill="#2a4ec0"/>
  <circle cx="172" cy="120" r="3" fill="#000000"/>
  <!-- Right eyebrow slightly off -->
  <path d="M160,106 Q172,100 184,106" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Centre seam / glitch line -->
  <line x1="145" y1="82" x2="145" y2="192" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
  <!-- Glitch offset bars -->
  <rect x="138" y="105" width="24" height="6" rx="2" ry="2" fill="#f8130d"/>
  <rect x="140" y="148" width="20" height="5" rx="2" ry="2" fill="#f7de58"/>
  <!-- Warning triangle badge -->
  <polygon points="220,170 258,202 182,202" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="216" y="178" width="8" height="14" rx="3" ry="3" fill="#000000"/>
  <circle cx="220" cy="197" r="4" fill="#000000"/>
  <!-- Mask seam at chin -->
  <path d="M120,182 Q145,192 170,182" fill="none" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
</svg>
