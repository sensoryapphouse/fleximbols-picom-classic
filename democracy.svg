  <!-- ballot box on right -->
  <rect x="170" y="120" width="100" height="80" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="170" y="120" width="100" height="20" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- ballot slot -->
  <rect x="195" y="128" width="50" height="6" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- ballot paper going in -->
  <rect x="205" y="100" width="30" height="40" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- checkmark on ballot -->
  <path d="M210 118 L218 126 L232 110" fill="none" stroke="#137827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- candidate list / squiggles on side -->
  <line x1="178" y1="155" x2="200" y2="155" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="178" y1="165" x2="200" y2="165" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="178" y1="175" x2="200" y2="175" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="178" y1="185" x2="200" y2="185" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- person FULL BODY voting on left, reaching to put ballot in -->
  <!-- head -->
  <circle cx="70" cy="65" r="14" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <path d="M64 67 Q70 71 76 67" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <circle cx="65" cy="63" r="1.5" fill="#000000"/>
  <circle cx="75" cy="63" r="1.5" fill="#000000"/>
  <!-- torso -->
  <path d="M55 80 L85 80 L92 150 L48 150 Z" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- left arm raised in hand-up gesture -->
  <path d="M58 84 Q35 60 30 30" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M58 84 Q35 60 30 30" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- raised hand -->
  <circle cx="30" cy="26" r="8" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- right arm reaching to ballot slot (extending toward the box) -->
  <path d="M82 88 Q130 95 180 115" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M82 88 Q130 95 180 115" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- legs -->
  <path d="M55 150 L52 210 L68 210 L70 150 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M70 150 L72 210 L88 210 L85 150 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- shoes -->
  <ellipse cx="60" cy="214" rx="12" ry="6" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="80" cy="214" rx="12" ry="6" fill="#000000" stroke="#000000" stroke-width="2"/>
</svg>
