<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Battery gauge - large, right side, EMPTY -->
  <!-- Battery body outline -->
  <rect x="196" y="68" width="72" height="136" rx="8" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <!-- Battery cap (positive terminal) -->
  <rect x="212" y="58" width="40" height="14" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <!-- Battery empty interior (shows empty cell divisions) -->
  <rect x="202" y="74" width="60" height="28" rx="3" fill="#efefef" stroke="#000000" stroke-width="2"/>
  <rect x="202" y="108" width="60" height="28" rx="3" fill="#efefef" stroke="#000000" stroke-width="2"/>
  <rect x="202" y="142" width="60" height="28" rx="3" fill="#efefef" stroke="#000000" stroke-width="2"/>
  <rect x="202" y="176" width="60" height="20" rx="3" fill="#efefef" stroke="#000000" stroke-width="2"/>
  <!-- Zero indicator - small cross/X in battery -->
  <line x1="214" y1="102" x2="250" y2="134" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
  <line x1="250" y1="102" x2="214" y2="134" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
  <!-- Shoulders -->
  <path d="M58 240 Q70 192 104 182 Q135 176 166 182 Q196 192 208 240 Z" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="117" y="156" width="34" height="28" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Head - shifted left to give battery space -->
  <ellipse cx="134" cy="118" rx="60" ry="62" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Blank weary face - flat line mouth -->
  <line x1="112" y1="152" x2="156" y2="152" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Half-lidded blank eyes -->
  <ellipse cx="108" cy="110" rx="16" ry="14" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="109" cy="112" r="8" fill="#4d4d4d"/>
  <path d="M92 110 Q108 100 124 110" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="160" cy="110" rx="16" ry="14" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="161" cy="112" r="8" fill="#4d4d4d"/>
  <path d="M144 110 Q160 100 176 110" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Flat neutral eyebrows -->
  <line x1="92" y1="92" x2="124" y2="92" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="144" y1="92" x2="176" y2="92" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M129 124 Q134 134 139 124" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
