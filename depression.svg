  <!-- depression: whole figure seated, slumped forward, head bowed, arms limp -->

  <!-- ground line -->
  <line x1="60" y1="220" x2="230" y2="220" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- legs folded/seated on ground -->
  <!-- left leg -->
  <path d="M118 178 Q105 198 88 210 Q78 216 72 218" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right leg -->
  <path d="M162 178 Q175 198 192 210 Q202 216 208 218" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- feet -->
  <ellipse cx="70" cy="219" rx="16" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="210" cy="219" rx="16" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- torso slumped -->
  <path d="M105 120 Q108 96 145 94 Q182 96 185 120 L178 178 Q145 184 112 178 Z" fill="#90a7d6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- arms hanging limp at sides -->
  <!-- left arm drooping -->
  <path d="M108 128 Q88 148 82 172 Q80 180 84 185" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="84" cy="188" rx="11" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- right arm drooping -->
  <path d="M182 128 Q202 148 208 172 Q210 180 206 185" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="206" cy="188" rx="11" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- neck -->
  <rect x="138" y="80" width="14" height="16" rx="4" ry="4" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- head bowed forward -->
  <ellipse cx="145" cy="58" rx="30" ry="32" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- downcast eyes (half closed) -->
  <path d="M131 52 Q137 56 143 52" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M147 52 Q153 56 159 52" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- sad mouth -->
  <path d="M133 70 Q145 64 157 70" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- tear drops -->
  <path d="M133 74 Q135 78 133 82 Q131 78 133 74 Z" fill="#dff3fd" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M157 74 Q159 78 157 82 Q155 78 157 74 Z" fill="#dff3fd" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>

  <!-- rain/gloom lines above -->
  <line x1="100" y1="18" x2="96" y2="32" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="12" x2="116" y2="26" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="10" x2="141" y2="24" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="12" x2="166" y2="26" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="18" x2="186" y2="32" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>

  <!-- small cloud -->
  <ellipse cx="108" cy="18" rx="18" ry="10" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="128" cy="14" rx="20" ry="11" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="152" cy="14" rx="18" ry="10" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="172" cy="18" rx="16" ry="9" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="90" y="18" width="96" height="10" rx="0" ry="0" fill="#b8b8b8" stroke="none"/>
</svg>
