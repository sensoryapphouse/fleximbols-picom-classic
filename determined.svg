  <!-- Shoulders -->
  <path d="M55 240 Q65 188 108 178 Q145 172 182 178 Q225 188 235 240 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="127" y="156" width="36" height="28" rx="7" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Head -->
  <ellipse cx="145" cy="110" rx="66" ry="68" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M79 98 Q84 36 145 34 Q206 36 211 98 Q194 56 145 54 Q96 56 79 98 Z" fill="#000000" stroke="#000000" stroke-width="4"/>
  <!-- Brows - furrowed, inner corners down = determination -->
  <path d="M98 84 Q112 76 126 82" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <path d="M164 82 Q178 76 192 84" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Brow inner furrow lines -->
  <line x1="124" y1="82" x2="130" y2="90" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="166" y1="82" x2="160" y2="90" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Eyes - narrowed focused, forward -->
  <ellipse cx="114" cy="102" rx="13" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="117" cy="102" r="7" fill="#4d4d4d"/>
  <circle cx="119" cy="99" r="2" fill="#ffffff"/>
  <!-- Upper eyelid narrowing left -->
  <path d="M101 97 Q114 90 127 97" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="176" cy="102" rx="13" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="173" cy="102" r="7" fill="#4d4d4d"/>
  <circle cx="175" cy="99" r="2" fill="#ffffff"/>
  <!-- Upper eyelid narrowing right -->
  <path d="M163 97 Q176 90 189 97" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Firm set mouth - straight line, slight tension -->
  <path d="M116 136 Q145 140 174 136" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Jaw tension lines -->
  <line x1="100" y1="128" x2="104" y2="140" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="128" x2="186" y2="140" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Target / bullseye - right side -->
  <!-- Outer circle -->
  <circle cx="248" cy="60" r="22" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Middle ring -->
  <circle cx="248" cy="60" r="14" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <!-- Inner bullseye -->
  <circle cx="248" cy="60" r="6" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Centre dot -->
  <circle cx="248" cy="60" r="2" fill="#f8130d"/>
  <!-- Arrow aimed at target from left -->
  <line x1="196" y1="60" x2="228" y2="60" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <polygon points="228,54 242,60 228,66" fill="#000000"/>
</svg>
