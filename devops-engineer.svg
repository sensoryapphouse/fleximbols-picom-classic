<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- devops-engineer: full body person with infinity loop (dev-ops) + gear -->

  <!-- Person: full body, standing left -->
  <!-- Head -->
  <circle cx="64" cy="52" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="64" cy="38" rx="20" ry="10" fill="#5e1f0a" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <rect x="44" y="74" width="40" height="52" rx="6" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm -->
  <line x1="44" y1="84" x2="24" y2="118" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="24" cy="120" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right arm gesturing at infinity -->
  <line x1="84" y1="84" x2="118" y2="80" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="120" cy="80" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Hips -->
  <rect x="42" y="124" width="44" height="22" rx="4" fill="#d01424" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect x="42" y="144" width="16" height="52" rx="4" fill="#d01424" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="70" y="144" width="16" height="52" rx="4" fill="#d01424" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left foot -->
  <rect x="36" y="192" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right foot -->
  <rect x="68" y="192" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Infinity loop (∞) — two interlocked circles traced as path -->
  <!-- Left lobe -->
  <ellipse cx="172" cy="90" rx="32" ry="22" fill="none" stroke="#2a4ec0" stroke-width="6"/>
  <!-- Right lobe -->
  <ellipse cx="228" cy="90" rx="32" ry="22" fill="none" stroke="#2a4ec0" stroke-width="6"/>
  <!-- Overlap mask (white fill to give crossing effect) -->
  <ellipse cx="200" cy="90" rx="10" ry="22" fill="#ffffff" stroke="none"/>
  <!-- Re-draw crossing strokes for correct over/under -->
  <path d="M190,72 Q200,90 190,108" fill="none" stroke="#2a4ec0" stroke-width="6" stroke-linecap="round"/>
  <path d="M210,72 Q200,90 210,108" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <path d="M210,72 Q200,90 210,108" fill="none" stroke="#2a4ec0" stroke-width="6" stroke-linecap="round"/>

  <!-- DEV label arrow (left lobe top arc) -->
  <polyline points="156,76 162,68 170,76" fill="none" stroke="#2a4ec0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- OPS label arrow (right lobe bottom arc) -->
  <polyline points="244,104 238,112 230,104" fill="none" stroke="#2a4ec0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gear (cog) below infinity -->
  <circle cx="200" cy="158" r="22" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <circle cx="200" cy="158" r="12" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- Gear teeth -->
  <rect x="194" y="132" width="12" height="10" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="194" y="174" width="12" height="10" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="174" y="152" width="10" height="12" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="216" y="152" width="10" height="12" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="180" y="137" width="10" height="10" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="210" y="137" width="10" height="10" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="180" y="169" width="10" height="10" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="210" y="169" width="10" height="10" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
</svg>
