  <path d="M105 35 L105 135 Q105 150 115 155 Q125 160 145 163 Q165 165 185 157 Q200 150 200 135 L200 55 Q200 45 195 43 L190 43 L190 35 Q188 27 180 27 Q172 27 170 35 L170 43 L160 43 L160 30 Q158 22 150 22 Q142 22 140 30 L140 43 L130 43 L130 32 Q128 24 120 24 Q112 24 110 32 L110 43 Z" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
