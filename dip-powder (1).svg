  <ellipse cx="145" cy="163" rx="9" ry="7" fill="#90a7d6" stroke="#000000" stroke-width="2"/>
  <ellipse cx="170" cy="160" rx="9" ry="7" fill="#90a7d6" stroke="#000000" stroke-width="2"/>
