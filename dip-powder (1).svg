  <!-- Hand dipping into open jar of coloured nail powder (synonym of dip-powder) -->
  <!-- Open jar -->
  <ellipse cx="145" cy="175" rx="82" ry="18" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
