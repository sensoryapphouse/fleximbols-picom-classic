  <!-- Shirt/shoulders - slight slump, lower shoulder line -->
  <path d="M72 240 Q76 212 106 202 Q126 195 145 197 Q164 195 184 202 Q214 212 218 240 Z" fill="#90a7d6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="128" y="180" width="34" height="22" rx="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head - slight forward droop -->
  <ellipse cx="145" cy="122" rx="56" ry="57" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M89 110 Q92 74 118 64 Q145 54 172 64 Q198 74 201 110" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Downturned mouth - mild unhappiness -->
  <path d="M132 154 Q145 146 158 154" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Lowered cast-down eyes - half lidded -->
  <ellipse cx="127" cy="116" rx="10" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="163" cy="116" rx="10" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Heavy upper eyelids -->
  <path d="M117 112 Q127 108 137 112" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M153 112 Q163 108 173 112" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="127" cy="117" r="5" fill="#000000"/>
  <circle cx="163" cy="117" r="5" fill="#000000"/>
  <!-- Sad downward inner eyebrows -->
  <path d="M115 104 Q127 100 139 106" fill="none" stroke="#9d7246" stroke-width="5" stroke-linecap="round"/>
  <path d="M151 106 Q163 100 175 104" fill="none" stroke="#9d7246" stroke-width="5" stroke-linecap="round"/>
  <!-- Inner brows up (sad brow shape) -->
  <path d="M136 104 Q145 100 154 104" fill="none" stroke="#9d7246" stroke-width="4" stroke-linecap="round"/>
  <!-- Single small tear on left cheek -->
  <path d="M118 128 Q121 124 118 118 Q115 124 118 128 Z" fill="#dff3fd" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Slight slump line across shoulders -->
  <path d="M90 210 Q118 204 145 205 Q172 204 200 210" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
