  <!-- Full body figure serving food -->
  <!-- Head -->
  <circle cx="145" cy="38" r="28" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="135" cy="33" r="4" fill="#000000"/>
  <circle cx="155" cy="33" r="4" fill="#000000"/>
  <!-- Smile -->
  <path d="M134 46 Q145 54 156 46" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Torso -->
  <path d="M118 66 Q112 68 110 80 L105 150 Q105 158 118 158 L172 158 Q185 158 185 150 L180 80 Q178 68 172 66 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="136" y="64" width="18" height="14" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Legs -->
  <path d="M118 158 L112 218" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
  <path d="M172 158 L178 218" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
  <!-- Shoes -->
  <ellipse cx="110" cy="221" rx="16" ry="8" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <ellipse cx="180" cy="221" rx="16" ry="8" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Left arm (holding pot handle) -->
  <path d="M112 90 Q78 95 68 120" fill="none" stroke="#eed5b6" stroke-width="11" stroke-linecap="round"/>
  <path d="M112 90 Q78 95 68 120" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Right arm (holding ladle) -->
  <path d="M178 90 Q205 88 215 75" fill="none" stroke="#eed5b6" stroke-width="11" stroke-linecap="round"/>
  <path d="M178 90 Q205 88 215 75" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Pot on left -->
  <path d="M42 105 L42 148 Q42 156 52 156 L88 156 Q98 156 98 148 L98 105 Z" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="38" y="100" width="64" height="12" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Food in pot (orange/red mound) -->
  <ellipse cx="70" cy="104" rx="22" ry="8" fill="#ff9900" stroke="#000000" stroke-width="3"/>
  <!-- Ladle in right hand -->
  <path d="M210 70 L230 42" fill="none" stroke="#b8b8b8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="232" cy="38" r="10" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <!-- Food dollop falling from ladle -->
  <ellipse cx="232" cy="38" rx="8" ry="5" fill="#ff9900" stroke="#000000" stroke-width="3"/>
  <!-- Plate on right side -->
  <ellipse cx="232" cy="88" rx="28" ry="10" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <ellipse cx="232" cy="88" rx="18" ry="6" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <!-- Food on plate -->
  <ellipse cx="232" cy="82" rx="12" ry="5" fill="#ff9900" stroke="#000000" stroke-width="3"/>
  <!-- Motion arc for serving action -->
  <path d="M215 52 Q226 60 226 76" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
