<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Dishonest: sly face, fingers crossed behind back, growing nose hint, shifty eyes -->
  <!-- Head -->
  <circle cx="145" cy="55" r="34" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shifty eyes: looking to side -->
  <ellipse cx="133" cy="50" rx="7" ry="8" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="157" cy="50" rx="7" ry="8" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Pupils shifted right (shifty) -->
  <circle cx="137" cy="50" r="4" fill="#000000"/>
  <circle cx="161" cy="50" r="4" fill="#000000"/>
  <!-- Sly eyebrows: one raised, one lowered -->
  <path d="M125 39 Q132 36 139 40" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 37 Q157 33 164 36" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Sly smirk -->
  <path d="M132 68 Q141 64 152 70" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Growing nose (pinocchio hint) -->
  <path d="M145 57 L145 66" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M145 66 L164 70 L145 68" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="137" y="87" width="16" height="14" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Torso (dark/shifty) -->
  <path d="M102 100 Q110 90 136 92 L154 92 Q180 90 188 100 L194 174 L96 174 Z" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left arm: bent behind back -->
  <path d="M102 104 Q84 120 86 148 Q88 162 108 164" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M102 104 Q84 120 86 148 Q88 162 108 164" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm: bent behind back -->
  <path d="M188 104 Q206 120 204 148 Q202 162 182 164" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M188 104 Q206 120 204 148 Q202 162 182 164" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crossed fingers behind back (at waist level) -->
  <!-- Left hand -->
  <ellipse cx="116" cy="166" rx="12" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right hand -->
  <ellipse cx="174" cy="166" rx="12" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Crossed fingers symbol between hands -->
  <line x1="136" y1="162" x2="154" y2="172" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="154" y1="162" x2="136" y2="172" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="118" y="172" width="22" height="44" rx="8" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="150" y="172" width="22" height="44" rx="8" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="129" cy="217" rx="17" ry="8" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="161" cy="217" rx="17" ry="8" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Crossed-out X over figure (dishonesty marker) -->
  <circle cx="230" cy="30" r="16" fill="#f8130d" stroke="#000000" stroke-width="4"/>
  <line x1="222" y1="22" x2="238" y2="38" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="238" y1="22" x2="222" y2="38" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>
