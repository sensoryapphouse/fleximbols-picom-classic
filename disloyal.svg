  <path d="M199 96 Q180 108 176 130" fill="none" stroke="#e6b98a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M199 96 Q180 108 176 130" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="175" cy="138" rx="11" ry="9" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
