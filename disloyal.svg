  <path d="M52 63 Q62 57 72 63" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Tear drop -->
  <ellipse cx="51" cy="56" rx="3" ry="4" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <!-- Left neck -->
  <rect x="55" y="79" width="14" height="12" rx="3" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left torso -->
  <path d="M32 90 Q38 82 54 83 L70 83 Q86 82 92 90 L96 172 L28 172 Z" fill="#90a7d6" stroke="#000000" stroke-width="5"/>
  <!-- Left arm reaching out -->
