  <!-- Disloyal: figure walking away/turning back, broken cracked heart between two people -->
  <!-- === FIGURE LEFT (staying, sad) === -->
  <!-- Left figure head -->
  <circle cx="62" cy="56" r="25" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
