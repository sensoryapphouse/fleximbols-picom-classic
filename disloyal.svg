  <path d="M92 94 Q110 100 118 114" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="122" cy="120" rx="11" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left arm (other, down) -->
  <path d="M33 93 Q18 106 16 128" fill="none" stroke="#eed5b6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 93 Q18 106 16 128" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="15" cy="135" rx="10" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left legs -->
  <rect x="44" y="170" width="18" height="46" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <rect x="66" y="170" width="18" height="46" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <ellipse cx="53" cy="217" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="75" cy="217" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- === BROKEN CRACKED HEART (center) === -->
  <path d="M134 98 Q134 88 145 95 Q156 88 156 98 Q156 112 145 122 Q134 112 134 98 Z" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crack through heart -->
  <path d="M145 89 L141 98 L148 104 L142 122" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Small crack pieces -->
  <line x1="141" y1="98" x2="136" y2="94" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="148" y1="104" x2="153" y2="102" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- === FIGURE RIGHT (walking away, back turned) === -->
  <!-- Right figure: seen from behind, walking away -->
  <!-- Head (back of head) -->
  <circle cx="228" cy="56" r="25" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Hair (back of head) -->
  <path d="M210 56 Q212 38 228 36 Q244 38 246 56" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
  <!-- Right neck -->
  <rect x="221" y="79" width="14" height="12" rx="3" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
