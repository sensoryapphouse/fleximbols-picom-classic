  <path d="M257 96 Q270 110 274 132" fill="none" stroke="#e6b98a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M257 96 Q270 110 274 132" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="275" cy="140" rx="11" ry="9" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- Right legs (walking stride) -->
  <rect x="210" y="172" width="18" height="46" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <rect x="234" y="170" width="18" height="44" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <ellipse cx="219" cy="219" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="243" cy="215" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Arrow indicating walking away -->
  <path d="M245 55 L262 55 L257 49 M262 55 L257 61" fill="none" stroke="#f8130d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
