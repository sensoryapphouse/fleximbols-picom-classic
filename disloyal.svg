  <ellipse cx="53" cy="51" rx="4" ry="5" fill="#000000"/>
  <ellipse cx="71" cy="51" rx="4" ry="5" fill="#000000"/>
  <circle cx="55" cy="49" r="1.5" fill="#ffffff"/>
  <circle cx="73" cy="49" r="1.5" fill="#ffffff"/>
  <!-- Sad eyebrows (inner up) -->
  <path d="M47 44 Q53 40 59 44" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M63 44 Q69 40 75 44" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
