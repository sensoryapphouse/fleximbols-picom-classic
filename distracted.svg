  <!-- Bust: neck + shoulders -->
  <rect x="95" y="182" width="100" height="46" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shirt -->
  <path d="M95 194 Q145 212 195 194" fill="#90a7d6" stroke="#000000" stroke-width="4"/>
  <!-- Neck -->
  <rect x="128" y="165" width="34" height="24" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head — turned slightly toward the phone (right side) -->
  <ellipse cx="145" cy="114" rx="52" ry="56" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M95 104 Q94 66 118 56 Q145 46 172 56 Q196 66 195 104" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <!-- Left eye: looking far right (pulled toward phone) -->
  <ellipse cx="122" cy="113" rx="14" ry="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="131" cy="113" rx="7" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="133" cy="111" rx="2" ry="2" fill="#ffffff"/>
  <!-- Right eye: also pulled right -->
  <ellipse cx="168" cy="113" rx="14" ry="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="176" cy="113" rx="7" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="178" cy="111" rx="2" ry="2" fill="#ffffff"/>
  <!-- Eyebrows: raised (surprised/drawn away) -->
  <path d="M108 98 Q122 93 136 97" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M154 97 Q168 93 182 98" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Mouth: open slightly, caught off guard -->
  <path d="M130 150 Q145 156 160 150" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <path d="M130 150 Q145 156 160 150" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Phone — right side, buzzing -->
  <rect x="220" y="78" width="36" height="60" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Phone screen lit up with notification -->
  <rect x="226" y="84" width="24" height="36" rx="3" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <!-- Notification bell icon on screen -->
  <path d="M238 90 Q234 93 234 98 L234 103 L242 103 L242 98 Q242 93 238 90" fill="#ff9900" stroke="#000000" stroke-width="2"/>
  <line x1="236" y1="105" x2="240" y2="105" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Notification dot -->
  <circle cx="248" cy="82" r="6" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <!-- Buzz vibration lines -->
  <path d="M258 85 Q264 92 258 99" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M263 82 Q271 92 263 102" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Attention arrow from head to phone -->
  <path d="M197 110 Q210 105 218 100" fill="none" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
  <polygon points="218,100 210,96 215,104" fill="#f8130d" stroke="#000000" stroke-width="2"/>
</svg>
