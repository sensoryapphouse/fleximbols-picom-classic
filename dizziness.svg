<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Dizziness: full figure swaying off-balance + small swirl over head -->

  <!-- Ground line -->
  <line x1="30" y1="218" x2="260" y2="218" stroke="#4d4d4d" stroke-width="4" stroke-linecap="round"/>

  <!-- Body (tilted/swaying — leaning right) -->
  <!-- Torso (tilted) -->
  <rect x="126" y="138" width="36" height="52" rx="10" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round" transform="rotate(12 144 164)"/>

  <!-- Left leg (splayed for balance) -->
  <line x1="134" y1="188" x2="108" y2="218" stroke="#1d0e82" stroke-width="10" stroke-linecap="round"/>
  <!-- Right leg (crossing) -->
  <line x1="154" y1="190" x2="168" y2="218" stroke="#1d0e82" stroke-width="10" stroke-linecap="round"/>

  <!-- Left arm (out for balance) -->
  <line x1="126" y1="148" x2="90" y2="135" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <!-- Right arm (raised) -->
  <line x1="162" y1="144" x2="196" y2="128" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="133" y="124" width="22" height="18" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Head (slightly tilted) -->
  <ellipse cx="144" cy="106" rx="28" ry="30" fill="#eed5b6" stroke="#000000" stroke-width="5"/>

  <!-- Eyes (unfocused spirals) -->
  <circle cx="135" cy="104" r="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="135" cy="104" r="3" fill="#000000"/>
  <circle cx="153" cy="104" r="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="153" cy="104" r="3" fill="#000000"/>

  <!-- Mouth (wobbly open) -->
  <path d="M 136 118 Q 144 123 152 118" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Swirl symbol above head -->
  <path d="M 144 58 Q 162 48 168 62 Q 174 76 160 82 Q 146 88 140 76 Q 136 66 144 62 Q 150 58 154 64 Q 158 70 152 73" fill="none" stroke="#3aa6a0" stroke-width="5" stroke-linecap="round"/>

  <!-- Motion sway lines beside body -->
  <path d="M 96 155 Q 88 165 96 175" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 88 158 Q 80 168 88 178" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 192 150 Q 200 160 192 170" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 200 153 Q 208 163 200 173" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
</svg>
