  <!-- yoga mat -->
  <rect x="20" y="200" width="250" height="20" rx="8" fill="#f266aa" stroke="#000000" stroke-width="3"/>
  <path d="M30 210 h230" stroke="#7c3fac" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- chakras column behind figure -->
  <circle cx="145" cy="30" r="6" fill="#7c3fac" stroke="#000000" stroke-width="2"/>
  <circle cx="145" cy="50" r="6" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <circle cx="145" cy="70" r="6" fill="#3aa6a0" stroke="#000000" stroke-width="2"/>
  <circle cx="145" cy="90" r="6" fill="#529929" stroke="#000000" stroke-width="2"/>
  <circle cx="145" cy="110" r="6" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <circle cx="145" cy="130" r="6" fill="#ff9900" stroke="#000000" stroke-width="2"/>
  <circle cx="145" cy="150" r="6" fill="#f8130d" stroke="#000000" stroke-width="2"/>

  <!-- warrior pose FULL BODY -->
  <!-- back leg extended -->
  <path d="M70 200 L110 140" stroke="#5e1f0a" stroke-width="14" stroke-linecap="round"/>
  <path d="M70 200 L110 140" stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- back foot -->
  <ellipse cx="68" cy="200" rx="12" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- front leg bent -->
  <path d="M190 200 L170 140" stroke="#5e1f0a" stroke-width="14" stroke-linecap="round"/>
  <path d="M190 200 L170 140" stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="190" cy="200" rx="14" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- pelvis/torso -->
  <path d="M108 144 q34 -8 64 0 q4 -22 -2 -40 q-28 -8 -60 0 z" fill="#ff9900" stroke="#000000" stroke-width="3"/>
  <!-- arms extended horizontally (warrior II) -->
  <rect x="30" y="100" width="80" height="12" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <rect x="170" y="100" width="80" height="12" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- hands -->
  <circle cx="32" cy="106" r="7" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <circle cx="248" cy="106" r="7" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- head looking front-hand direction -->
  <circle cx="158" cy="80" r="16" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair tied -->
  <path d="M142 76 q16 -18 32 0 q-2 -12 -16 -12 q-14 0 -16 12 z" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- face -->
  <circle cx="166" cy="80" r="1.5" fill="#000000"/>
  <circle cx="154" cy="80" r="1.5" fill="#000000"/>
  <path d="M156 88 q6 3 12 0" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- breath wave -->
  <path d="M198 50 q8 -6 16 0 q8 6 16 0 q8 -6 16 0" fill="none" stroke="#3aa6a0" stroke-width="3" stroke-linecap="round"/>
</svg>
