  <!-- Grey overcast sky pall across top -->
  <rect x="8" y="8" width="274" height="52" rx="6" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- Layered cloud shapes for overcast look -->
  <ellipse cx="80" cy="32" rx="52" ry="18" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <ellipse cx="160" cy="25" rx="70" ry="20" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <ellipse cx="230" cy="35" rx="48" ry="16" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <!-- Grey drizzle lines falling -->
  <line x1="60" y1="58" x2="55" y2="75" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="58" x2="85" y2="75" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="58" x2="115" y2="75" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="58" x2="145" y2="75" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="180" y1="58" x2="175" y2="75" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="210" y1="58" x2="205" y2="75" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="240" y1="58" x2="235" y2="75" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <!-- Shoulders - grey-blue dull tone -->
  <path d="M58 240 Q68 192 102 182 Q145 176 188 182 Q222 192 232 240 Z" fill="#90a7d6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="128" y="156" width="34" height="26" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Head - slightly greyish/pallid skin -->
  <ellipse cx="145" cy="122" rx="60" ry="60" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair - flat dull -->
  <path d="M87 105 Q90 64 145 60 Q200 64 203 105" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>
  <ellipse cx="145" cy="65" rx="58" ry="18" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>
  <!-- Eyebrows - utterly flat, no expression -->
  <path d="M108 98 Q120 97 132 98" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M158 98 Q170 97 182 98" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Eyes - bored, very heavy lidded, barely open -->
  <ellipse cx="120" cy="114" rx="13" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Very heavy lid covering top half -->
  <path d="M107 110 Q120 105 133 110" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="116" r="6" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="170" cy="114" rx="13" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <path d="M157 110 Q170 105 183 110" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="170" cy="116" r="6" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- Nose -->
  <path d="M140 123 L137 133 L145 135 L153 133 L150 123" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lifeless, flat mouth - barely a line -->
  <line x1="122" y1="146" x2="168" y2="146" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Pale grey cheeks - no life -->
  <ellipse cx="102" cy="130" rx="14" ry="9" fill="#b8b8b8" stroke="none"/>
  <ellipse cx="188" cy="130" rx="14" ry="9" fill="#b8b8b8" stroke="none"/>
