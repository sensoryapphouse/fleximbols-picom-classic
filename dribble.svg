<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <g>
    <!-- Neck -->
    <polygon points="120,192 126,230 164,230 170,192 158,197 145,199 132,197" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Head -->
    <path d="M70,108 Q72,58 145,28 Q218,58 220,108 Q222,148 202,172 Q174,196 145,197 Q116,196 88,172 Q68,148 70,108 Z" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Left ear -->
    <ellipse cx="65" cy="110" rx="13" ry="19" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Right ear -->
    <ellipse cx="225" cy="110" rx="13" ry="19" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Hair -->
    <path d="M82,78 Q90,28 145,22 Q200,28 208,78 Q196,45 145,42 Q94,45 82,78 Z" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Eyes — alert, in act of drinking -->
    <ellipse cx="113" cy="95" rx="10" ry="11" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <circle cx="114" cy="96" r="5" fill="#000000"/>
    <ellipse cx="177" cy="95" rx="10" ry="11" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <circle cx="178" cy="96" r="5" fill="#000000"/>
    <!-- Eyebrows neutral -->
    <polyline points="103,82 116,79" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <polyline points="165,79 178,82" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M141,110 Q137,122 133,125 Q140,128 145,126 Q150,128 157,125 Q153,122 149,110" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- Cup/beaker being held up to mouth -->
    <path d="M160,135 L155,185 L175,185 L170,135 Z" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <rect x="153" y="132" width="20" height="6" rx="2" fill="#90a7d6" stroke="#000000" stroke-width="3"/>
    <!-- Liquid in cup -->
    <path d="M158,160 L156,183 L174,183 L172,160 Z" fill="#90a7d6" stroke="none"/>
    <!-- Mouth drinking — slightly open -->
    <path d="M118,148 Q130,143 145,144 Q160,143 172,148 Q162,157 145,158 Q128,157 118,148 Z" fill="#f4a4b2" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <path d="M118,148 Q131,146 145,146 Q159,146 172,148" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <!-- Multiple small drips down chin — trickling while drinking -->
    <!-- Drip 1 (center) -->
    <path d="M143,158 Q142,168 141,175" fill="none" stroke="#dff3fd" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="140" cy="179" rx="5" ry="6" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
    <!-- Drip 2 (left of center) -->
    <path d="M130,156 Q128,163 127,170" fill="none" stroke="#dff3fd" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="127" cy="174" rx="4" ry="5" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
    <!-- Drip 3 (right of center) -->
    <path d="M157,156 Q158,164 158,170" fill="none" stroke="#dff3fd" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="158" cy="175" rx="4" ry="5" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
    <!-- Drip 4 — falling drop mid-air below chin -->
    <ellipse cx="141" cy="193" rx="4" ry="5" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  </g>
</svg>
