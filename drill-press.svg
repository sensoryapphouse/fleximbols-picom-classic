<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Drill press: vertical post/column, motor head top, feed lever, flat table, drill bit down -->

  <!-- Base (heavy foot at bottom) -->
  <rect x="90" y="215" width="110" height="18" rx="5" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <!-- Column / vertical post -->
  <rect x="136" y="60" width="18" height="158" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>

  <!-- Work table (flat horizontal table mid-column) -->
  <rect x="78" y="162" width="134" height="14" rx="4" ry="4" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- Table support bracket -->
  <polygon points="136,162 154,162 145,180" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Motor head housing (top) -->
  <rect x="100" y="28" width="90" height="52" rx="10" ry="10" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <!-- Motor ribbing lines -->
  <line x1="115" y1="28" x2="115" y2="80" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>
  <line x1="130" y1="28" x2="130" y2="80" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>
  <!-- Pulley/belt cover bump -->
  <ellipse cx="170" cy="52" rx="16" ry="22" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>

  <!-- Quill / spindle housing below head -->
  <rect x="126" y="78" width="38" height="38" rx="5" ry="5" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>
  <!-- Chuck -->
  <rect x="130" y="114" width="30" height="22" rx="6" ry="6" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <line x1="136" y1="114" x2="136" y2="136" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="154" y1="114" x2="154" y2="136" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Drill bit pointing down -->
  <line x1="145" y1="136" x2="145" y2="162" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <polygon points="138,158 145,172 152,158" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Feed lever (3-spoke wheel handle on right side) -->
  <circle cx="200" cy="100" r="12" fill="none" stroke="#000000" stroke-width="5"/>
  <!-- Lever arm -->
  <line x1="164" y1="100" x2="188" y2="100" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Spoke handles -->
  <circle cx="208" cy="88" r="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <line x1="200" y1="88" x2="208" y2="88" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <circle cx="212" cy="100" r="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <line x1="200" y1="100" x2="212" y2="100" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <circle cx="208" cy="112" r="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <line x1="200" y1="112" x2="208" y2="112" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
