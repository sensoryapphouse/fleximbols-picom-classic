  <g>
    <!-- Neck -->
    <polygon points="120,192 126,230 164,230 170,192 158,197 145,199 132,197" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Head — relaxed/sleepy, slightly tilted -->
    <path d="M70,108 Q72,58 145,28 Q218,58 220,108 Q222,148 202,172 Q174,196 145,197 Q116,196 88,172 Q68,148 70,108 Z" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Left ear -->
    <ellipse cx="65" cy="110" rx="13" ry="19" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Right ear -->
    <ellipse cx="225" cy="110" rx="13" ry="19" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Hair — a bit messy/relaxed -->
    <path d="M82,78 Q90,28 145,22 Q200,28 208,78 Q196,45 145,42 Q94,45 82,78 Z" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Sleepy left eye — half-closed -->
    <ellipse cx="113" cy="95" rx="11" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <ellipse cx="113" cy="97" rx="7" ry="5" fill="#000000"/>
    <!-- Heavy eyelid left -->
    <path d="M102,95 Q113,88 124,95" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <!-- Sleepy right eye — half-closed -->
    <ellipse cx="177" cy="95" rx="11" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <ellipse cx="177" cy="97" rx="7" ry="5" fill="#000000"/>
    <!-- Heavy eyelid right -->
    <path d="M166,95 Q177,88 188,95" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <!-- Eyebrows relaxed/drooping -->
    <polyline points="102,82 116,80" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <polyline points="165,80 179,82" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M141,110 Q137,122 133,125 Q140,128 145,126 Q150,128 157,125 Q153,122 149,110" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- Relaxed mouth — slightly open, corners drooping -->
    <path d="M112,150 Q125,145 145,146 Q165,145 178,150 Q168,160 145,162 Q122,160 112,150 Z" fill="#f4a4b2" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <path d="M112,150 Q128,147 145,147 Q162,147 178,150" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <!-- Single drool string from mouth corner down — passive single thread -->
    <path d="M118,155 Q116,170 115,185 Q115,195 118,200" fill="none" stroke="#dff3fd" stroke-width="5" stroke-linecap="round"/>
    <path d="M118,155 Q116,172 116,186 Q116,196 118,202" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <!-- Drool drop at bottom -->
    <ellipse cx="118" cy="207" rx="7" ry="9" fill="#dff3fd" stroke="#000000" stroke-width="4"/>
    <!-- ZZZ indicating sleepiness -->
    <path d="M195,65 L210,65 L197,80 L212,80" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M210,52 L220,52 L212,62 L222,62" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M215,40 L222,40 L216,48 L224,48" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
