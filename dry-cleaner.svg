  <!-- Left window -->
  <rect x="42" y="115" width="60" height="46" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right window -->
  <rect x="188" y="115" width="60" height="46" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- GARMENT IN CLEAR BAG on hanger (center) -->
  <!-- Hanger hook -->
  <path d="M145,100 Q145,95 150,93 Q160,90 163,98" fill="none" stroke="#7f7f7f" stroke-width="4" stroke-linecap="round"/>
  <!-- Hanger bar -->
  <line x1="118" y1="108" x2="172" y2="108" stroke="#7f7f7f" stroke-width="4" stroke-linecap="round"/>
  <!-- Hanger left arm -->
  <line x1="118" y1="108" x2="128" y2="116" stroke="#7f7f7f" stroke-width="4" stroke-linecap="round"/>
  <!-- Hanger right arm -->
  <line x1="172" y1="108" x2="162" y2="116" stroke="#7f7f7f" stroke-width="4" stroke-linecap="round"/>
  <!-- CLEAR PLASTIC BAG outline -->
  <path d="M118,112 L120,155 Q145,165 170,155 L172,112 Z" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- GARMENT inside bag (shirt/jacket) -->
