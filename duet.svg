  <!-- stage floor -->
  <ellipse cx="145" cy="220" rx="120" ry="13" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- SINGER 1 (left) - full body, facing right -->
  <!-- head -->
  <circle cx="80" cy="75" r="17" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M 64 70 Q 66 56 80 56 Q 94 56 96 70 Q 92 64 80 64 Q 68 64 64 70 Z" fill="#7d5e23" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- face features (looking right toward other singer) -->
  <circle cx="86" cy="75" r="1.5" fill="#000000"/>
  <circle cx="92" cy="75" r="1.5" fill="#000000"/>
  <!-- mouth singing -->
  <ellipse cx="92" cy="83" rx="3" ry="4" fill="#5e1f0a" stroke="#000000" stroke-width="1.5"/>
  <!-- torso -->
  <path d="M 65 93 L 95 93 L 100 152 L 60 152 Z" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arm holding mic (right side, raised toward partner) -->
  <line x1="95" y1="98" x2="115" y2="110" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="115" y1="110" x2="118" y2="98" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- other arm -->
  <line x1="65" y1="98" x2="50" y2="130" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="130" x2="52" y2="148" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="72" y1="152" x2="68" y2="195" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="90" y1="152" x2="94" y2="195" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="66" cy="200" rx="8" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="96" cy="200" rx="8" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- pants division -->
  <line x1="80" y1="152" x2="81" y2="190" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- mic 1 -->
  <ellipse cx="118" cy="93" rx="7" ry="8" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <line x1="118" y1="86" x2="118" y2="98" stroke="#b8b8b8" stroke-width="1.5"/>
  <line x1="114" y1="90" x2="122" y2="90" stroke="#b8b8b8" stroke-width="1.5"/>

  <!-- SINGER 2 (right) - full body, facing left -->
  <!-- head -->
  <circle cx="210" cy="75" r="17" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- hair (longer style) -->
  <path d="M 193 72 Q 194 55 210 55 Q 226 55 227 72 L 225 90 L 222 88 Q 222 70 210 70 Q 198 70 198 88 L 195 90 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- face features (looking left toward partner) -->
  <circle cx="198" cy="75" r="1.5" fill="#000000"/>
  <circle cx="204" cy="75" r="1.5" fill="#000000"/>
  <!-- mouth singing -->
  <ellipse cx="198" cy="83" rx="3" ry="4" fill="#5e1f0a" stroke="#000000" stroke-width="1.5"/>
  <!-- torso -->
  <path d="M 195 93 L 225 93 L 230 152 L 190 152 Z" fill="#7c3fac" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arm holding mic (left side, raised toward partner) -->
  <line x1="195" y1="98" x2="175" y2="110" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="175" y1="110" x2="172" y2="98" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- other arm -->
  <line x1="225" y1="98" x2="240" y2="130" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="130" x2="238" y2="148" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="202" y1="152" x2="198" y2="195" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="220" y1="152" x2="224" y2="195" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="196" cy="200" rx="8" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="226" cy="200" rx="8" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- pants division -->
  <line x1="210" y1="152" x2="211" y2="190" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- mic 2 -->
  <ellipse cx="172" cy="93" rx="7" ry="8" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <line x1="172" y1="86" x2="172" y2="98" stroke="#b8b8b8" stroke-width="1.5"/>
  <line x1="168" y1="90" x2="176" y2="90" stroke="#b8b8b8" stroke-width="1.5"/>
  <!-- music notes between them -->
  <circle cx="145" cy="50" r="5" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <line x1="150" y1="50" x2="150" y2="32" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="125" cy="40" r="4" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <line x1="129" y1="40" x2="129" y2="25" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <circle cx="165" cy="35" r="4" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <line x1="169" y1="35" x2="169" y2="20" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
</svg>
