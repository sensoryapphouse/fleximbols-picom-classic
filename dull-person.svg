<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Dull-person: bored blank face, droopy eyes, grey flat aura, zzz/flat line cue -->
  <!-- Grey aura / haze behind figure -->
  <ellipse cx="145" cy="130" rx="110" ry="100" fill="#efefef" stroke="#b8b8b8" stroke-width="2" stroke-dasharray="6,6"/>
  <!-- Bust: shoulders + head -->
  <rect x="92" y="155" width="106" height="68" rx="12" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- Left arm drooping -->
  <line x1="93" y1="168" x2="62" y2="192" stroke="#b8b8b8" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="57" cy="196" rx="11" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right arm drooping -->
  <line x1="197" y1="168" x2="228" y2="192" stroke="#b8b8b8" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="233" cy="196" rx="11" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Neck -->
  <rect x="129" y="135" width="32" height="24" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head -->
  <ellipse cx="145" cy="98" rx="44" ry="42" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Dull flat hair (grey/flat) -->
  <rect x="104" y="58" width="82" height="20" rx="8" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- Droopy half-closed eyes — heavy lids -->
  <!-- Left eye -->
  <ellipse cx="128" cy="94" rx="10" ry="9" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="128" cy="95" r="5" fill="#000000"/>
  <!-- Heavy drooping upper lid (half covers eye) -->
  <rect x="117" y="85" width="22" height="10" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right eye -->
  <ellipse cx="162" cy="94" rx="10" ry="9" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="162" cy="95" r="5" fill="#000000"/>
  <!-- Heavy drooping upper lid -->
  <rect x="151" y="85" width="22" height="10" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Flat drooping eyebrows -->
  <line x1="116" y1="82" x2="140" y2="84" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="84" x2="174" y2="82" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Flat expressionless mouth line -->
  <line x1="128" y1="116" x2="162" y2="116" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- ZZZ floating above head -->
  <!-- Z1 small -->
  <polygon points="195,48 210,48 200,38 215,38" fill="none" stroke="#7f7f7f" stroke-width="3" stroke-linejoin="round"/>
  <!-- Z2 medium -->
  <polygon points="205,35 224,35 212,22 231,22" fill="none" stroke="#7f7f7f" stroke-width="4" stroke-linejoin="round"/>
  <!-- Z3 large -->
  <polygon points="217,19 242,19 226,4 251,4" fill="none" stroke="#7f7f7f" stroke-width="4" stroke-linejoin="round"/>
  <!-- Flat line / EKG flat line below face (boring "no activity") -->
  <line x1="60" y1="200" x2="230" y2="200" stroke="#b8b8b8" stroke-width="3" stroke-dasharray="10,4"/>
</svg>
