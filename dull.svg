  <!-- Flat grey circle — no highlights, no reflections -->
  <circle cx="145" cy="118" r="88" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Inner darker flat tone to suggest dull muted surface -->
  <circle cx="145" cy="118" r="58" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <!-- No-shine badge: circle with diagonal line bottom-right -->
  <circle cx="218" cy="185" r="22" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <line x1="203" y1="170" x2="233" y2="200" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Small star-like glint crossed out -->
  <line x1="205" y1="175" x2="231" y2="195" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
