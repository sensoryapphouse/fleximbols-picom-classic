  <!-- Silicone ear plug: smooth rounded moulded form, bulbous dome top, tapered flanged insert -->
  <!-- Main rounded body dome (top bulge) -->
  <ellipse cx="145" cy="100" rx="52" ry="58" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Lower stem / shank -->
  <rect x="126" y="142" width="38" height="52" rx="10" ry="10" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Pull-tab: small flat tab at the bottom -->
  <rect x="132" y="186" width="26" height="18" rx="5" ry="5" fill="#3aa6a0" stroke="#000000" stroke-width="4"/>
  <ellipse cx="145" cy="204" rx="13" ry="6" fill="#3aa6a0" stroke="#000000" stroke-width="4"/>
  <!-- Smooth gloss highlight (small ellipse near top) -->
  <ellipse cx="128" cy="72" rx="14" ry="8" fill="#ffffff" stroke="none"/>
  <!-- Flange ring 1 (smooth moulded ring near stem top) -->
  <ellipse cx="145" cy="148" rx="26" ry="7" fill="none" stroke="#000000" stroke-width="3"/>
  <!-- Flange ring 2 -->
  <ellipse cx="145" cy="162" rx="22" ry="5.5" fill="none" stroke="#000000" stroke-width="2.5"/>
  <!-- Smooth surface - no pore texture, just clean shape -->
</svg>
