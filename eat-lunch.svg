  <!-- High midday sun (top centre-right, full circle, high) -->
  <circle cx="228" cy="34" r="28" fill="#f2e40d" stroke="#000000" stroke-width="5"/>
  <!-- Sun rays (shorter, more vertical = high in sky) -->
  <line x1="228" y1="0" x2="228" y2="6" stroke="#f2e40d" stroke-width="6" stroke-linecap="round"/>
  <line x1="228" y1="62" x2="228" y2="68" stroke="#f2e40d" stroke-width="6" stroke-linecap="round"/>
  <line x1="194" y1="34" x2="188" y2="34" stroke="#f2e40d" stroke-width="6" stroke-linecap="round"/>
  <line x1="262" y1="34" x2="268" y2="34" stroke="#f2e40d" stroke-width="6" stroke-linecap="round"/>
  <line x1="204" y1="10" x2="200" y2="6" stroke="#f2e40d" stroke-width="6" stroke-linecap="round"/>
  <line x1="252" y1="58" x2="256" y2="62" stroke="#f2e40d" stroke-width="6" stroke-linecap="round"/>
  <line x1="252" y1="10" x2="256" y2="6" stroke="#f2e40d" stroke-width="6" stroke-linecap="round"/>
  <line x1="204" y1="58" x2="200" y2="62" stroke="#f2e40d" stroke-width="6" stroke-linecap="round"/>
  <!-- Redraw sun on top of rays -->
  <circle cx="228" cy="34" r="28" fill="#f2e40d" stroke="#000000" stroke-width="5"/>

  <!-- Table -->
  <rect x="10" y="188" width="270" height="16" rx="6" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <rect x="28" y="204" width="16" height="28" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <rect x="246" y="204" width="16" height="28" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="4"/>

  <!-- Lunch bowl (noodle/rice bowl) -->
  <!-- Bowl -->
  <path d="M 114 178 Q 114 210 158 210 Q 202 210 202 178 Z" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <path d="M 108 178 L 208 178" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Rim -->
  <ellipse cx="158" cy="178" rx="50" ry="10" fill="#efefef" stroke="#000000" stroke-width="4"/>
  <!-- Bowl contents — rice/noodles -->
  <path d="M 124 178 Q 130 168 158 166 Q 186 168 192 178" fill="#f5e7c4" stroke="#000000" stroke-width="3"/>
  <!-- Chopstick or spoon -->
  <line x1="190" y1="155" x2="170" y2="195" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <line x1="178" y1="155" x2="162" y2="192" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>

  <!-- Sandwich on plate (side of bowl) -->
  <!-- Plate -->
  <ellipse cx="248" cy="184" rx="34" ry="10" fill="#efefef" stroke="#000000" stroke-width="4"/>
  <!-- Bottom bread -->
  <path d="M 218 184 L 218 176 Q 218 170 248 170 Q 278 170 278 176 L 278 184 Z" fill="#ff9900" stroke="#000000" stroke-width="4"/>
  <!-- Filling (lettuce green) -->
  <path d="M 220 176 Q 248 168 276 176" fill="#529929" stroke="#000000" stroke-width="3"/>
  <!-- Top bread -->
  <path d="M 222 174 Q 222 158 248 156 Q 274 158 274 174 Z" fill="#ff9900" stroke="#000000" stroke-width="4"/>
  <!-- Bread crust highlight -->
  <path d="M 226 164 Q 248 158 270 164" fill="none" stroke="#e65a00" stroke-width="3" stroke-linecap="round"/>

  <!-- Person (left side) -->
  <!-- Head -->
  <circle cx="62" cy="82" r="34" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M 32 68 Q 30 38 62 32 Q 94 38 92 68" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <!-- Eyes -->
  <ellipse cx="50" cy="80" rx="8" ry="6" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="52" cy="80" r="4" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <ellipse cx="74" cy="80" rx="8" ry="6" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="72" cy="80" r="4" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <!-- Mouth open eating -->
  <path d="M 52 98 Q 62 106 72 98" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Body -->
  <path d="M 28 116 Q 24 118 24 140 L 24 188 L 100 188 L 100 140 Q 100 118 96 116 Q 80 108 62 108 Q 44 108 28 116 Z" fill="#529929" stroke="#000000" stroke-width="5"/>
  <!-- Arm to bowl -->
  <path d="M 92 144 Q 106 150 118 162" fill="none" stroke="#e6b98a" stroke-width="16" stroke-linecap="round"/>
  <path d="M 92 144 Q 106 150 118 162" fill="none" stroke="#000000" stroke-width="21" stroke-linecap="round"/>
  <path d="M 92 144 Q 106 150 118 162" fill="none" stroke="#e6b98a" stroke-width="16" stroke-linecap="round"/>
  <!-- Hand -->
