  <!-- Person sitting casually, nibbling a small apple -->
  <!-- Floor line -->
  <line x1="30" y1="210" x2="260" y2="210" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Body torso -->
  <rect x="108" y="118" width="50" height="52" rx="8" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="133" cy="98" r="24" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M110 94 Q113 74 133 72 Q153 74 156 94" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- Eye left -->
  <circle cx="125" cy="96" r="3" fill="#000000"/>
  <!-- Eye right -->
  <circle cx="141" cy="96" r="3" fill="#000000"/>
  <!-- Smile -->
  <path d="M125 106 Q133 113 141 106" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs sitting on stool/bench -->
  <rect x="100" y="170" width="16" height="40" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="150" y="170" width="16" height="40" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Feet -->
  <ellipse cx="108" cy="210" rx="12" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="158" cy="210" rx="12" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Right arm raising apple to mouth -->
  <path d="M158 135 Q185 120 192 105" fill="none" stroke="#eed5b6" stroke-width="12" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="192" cy="103" r="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Apple (small, red) -->
  <circle cx="200" cy="93" r="14" fill="#f8130d" stroke="#000000" stroke-width="4"/>
  <!-- Apple stem -->
  <path d="M200 79 Q202 73 207 70" fill="none" stroke="#529929" stroke-width="3" stroke-linecap="round"/>
  <!-- Apple leaf -->
  <ellipse cx="207" cy="73" rx="6" ry="4" fill="#529929" stroke="#000000" stroke-width="2" transform="rotate(-30 207 73)"/>
  <!-- Apple bite mark -->
  <path d="M188 88 Q192 84 196 88 Q194 93 188 88" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- Left arm relaxed -->
  <path d="M108 135 Q90 150 88 165" fill="none" stroke="#eed5b6" stroke-width="12" stroke-linecap="round"/>
  <!-- Left hand -->
  <circle cx="88" cy="167" r="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Small stool/bench under person -->
  <rect x="88" y="168" width="80" height="10" rx="4" fill="#9d7246" stroke="#000000" stroke-width="4"/>
  <line x1="96" y1="178" x2="96" y2="210" stroke="#9d7246" stroke-width="5" stroke-linecap="round"/>
  <line x1="160" y1="178" x2="160" y2="210" stroke="#9d7246" stroke-width="5" stroke-linecap="round"/>
</svg>
