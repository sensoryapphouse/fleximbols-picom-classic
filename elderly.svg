  <!-- Older adult seated in chair with walker frame beside them -->
  <!-- Walker frame -->
  <line x1="185" y1="110" x2="185" y2="205" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="210" y1="110" x2="210" y2="205" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="180" y1="110" x2="215" y2="110" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="180" y1="145" x2="215" y2="145" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Walker feet -->
  <ellipse cx="185" cy="207" rx="8" ry="4" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="210" cy="207" rx="8" ry="4" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chair seat -->
  <rect x="88" y="155" width="75" height="14" rx="4" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chair back -->
  <rect x="148" y="110" width="14" height="60" rx="4" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chair legs -->
  <line x1="95" y1="169" x2="90" y2="210" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="155" y1="169" x2="158" y2="210" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Person legs (seated, pointing forward/down) -->
  <line x1="115" y1="168" x2="100" y2="205" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="132" y1="168" x2="120" y2="205" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="98" cy="207" rx="11" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="118" cy="207" rx="11" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Torso -->
  <rect x="98" y="108" width="48" height="50" rx="8" fill="#529929" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm (toward walker) -->
  <line x1="146" y1="118" x2="178" y2="130" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left arm -->
  <line x1="98" y1="118" x2="85" y2="148" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="115" y="92" width="14" height="18" rx="3" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="122" cy="76" rx="25" ry="27" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Grey hair -->
  <path d="M97 66 Q100 46 122 44 Q144 46 147 66" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="113" cy="74" r="3" fill="#000000"/>
  <circle cx="131" cy="74" r="3" fill="#000000"/>
  <!-- Smile -->
  <path d="M113 83 Q122 90 131 83" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
