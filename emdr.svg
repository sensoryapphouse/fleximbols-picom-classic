  <!-- ground -->
  <rect x="20" y="210" width="250" height="14" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- head profile on left, facing right -->
  <path d="M48 75 Q40 65 45 50 Q55 28 85 28 Q120 28 130 65 L135 110 L128 128 L118 132 L118 155 Q118 172 100 175 L70 175 Q55 175 55 158 L55 145 L48 138 Q35 126 38 110 Z" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- hair -->
  <path d="M45 70 Q45 30 85 28 Q125 28 130 60 Q120 42 90 42 Q60 44 55 75 Z" fill="#000000" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- eye (large, looking forward) -->
  <ellipse cx="98" cy="92" rx="9" ry="6" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <circle cx="100" cy="92" r="3.5" fill="#1d0e82"/>
  <circle cx="101" cy="91" r="1" fill="#ffffff"/>
  <!-- eyebrow -->
  <path d="M89 82 Q98 78 108 82" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M128 92 L138 110 L128 113" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- mouth -->
  <path d="M110 125 Q118 128 124 125" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- moving dot trail: dots growing in size left to right with arrow trail -->
  <!-- trail line (sinusoidal-ish) -->
  <path d="M155 100 Q175 80 195 100 Q215 120 235 100 Q255 80 270 100" fill="none" stroke="#90a7d6" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <!-- small ghost dots (trailing) -->
  <circle cx="160" cy="100" r="5" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <circle cx="185" cy="92" r="6" fill="#90a7d6" stroke="#000000" stroke-width="2"/>
  <circle cx="215" cy="108" r="7" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
  <!-- main moving dot (largest, rightmost) -->
  <circle cx="248" cy="92" r="10" fill="#d01424" stroke="#000000" stroke-width="3"/>
  <!-- horizontal left-right arrow under the trail -->
  <line x1="160" y1="155" x2="260" y2="155" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="160,155 170,150 170,160" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="260,155 250,150 250,160" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
</svg>
