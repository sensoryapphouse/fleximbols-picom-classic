  <!-- Face circle -->
  <circle cx="145" cy="108" r="72" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Left eye -->
  <circle cx="118" cy="94" r="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="120" cy="94" r="4" fill="#1d0e82"/>
  <!-- Right eye -->
  <circle cx="172" cy="94" r="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="174" cy="94" r="4" fill="#1d0e82"/>
  <!-- Calm neutral mouth -->
  <line x1="126" y1="128" x2="164" y2="128" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Storm cloud top-left (stormy emotion being turned down) -->
  <ellipse cx="68" cy="44" rx="26" ry="16" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <ellipse cx="52" cy="50" rx="18" ry="14" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <ellipse cx="84" cy="50" rx="16" ry="12" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Lightning bolt from cloud -->
  <polyline points="62,62 56,76 64,76 58,92" fill="none" stroke="#f7de58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dial / thermostat knob on right side of face -->
  <!-- Dial track arc -->
  <path d="M230,80 A40,40 0 0,1 270,140" fill="none" stroke="#b8b8b8" stroke-width="8" stroke-linecap="round"/>
  <!-- Dial circle -->
  <circle cx="250" cy="136" r="22" fill="#efefef" stroke="#000000" stroke-width="5"/>
  <!-- Dial pointer pointing to low/calm position -->
  <line x1="250" y1="136" x2="250" y2="118" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Dial tick marks -->
  <line x1="232" y1="118" x2="236" y2="124" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="228" y1="136" x2="233" y2="136" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="268" y1="118" x2="264" y2="124" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="272" y1="136" x2="267" y2="136" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Red hot zone top of dial arc -->
  <path d="M232,84 A40,40 0 0,1 244,76" fill="none" stroke="#f8130d" stroke-width="6" stroke-linecap="round"/>
  <!-- Cool blue zone bottom of dial arc -->
  <path d="M256,76 A40,40 0 0,1 270,140" fill="none" stroke="#3aa6a0" stroke-width="6" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="133" y="178" width="24" height="22" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
