  <circle cx="248" cy="212" r="8" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Mattress on stretcher -->
  <rect x="102" y="155" width="156" height="18" rx="5" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Patient on stretcher (lying) -->
  <rect x="112" y="144" width="100" height="16" rx="8" fill="#90a7d6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Patient head -->
  <circle cx="220" cy="150" r="13" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
