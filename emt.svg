  <!-- EMT head -->
  <circle cx="68" cy="102" r="22" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Face -->
  <circle cx="61" cy="99" r="2.5" fill="#000000"/>
  <circle cx="75" cy="99" r="2.5" fill="#000000"/>
  <path d="M61 109 Q68 115 75 109" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cap -->
  <rect x="48" y="80" width="40" height="16" rx="5" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
