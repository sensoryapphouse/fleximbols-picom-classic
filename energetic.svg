  <line x1="64" y1="67" x2="62" y2="60" stroke="#eed5b6" stroke-width="5" stroke-linecap="round"/>
  <line x1="71" y1="67" x2="71" y2="60" stroke="#eed5b6" stroke-width="5" stroke-linecap="round"/>
  <line x1="233" y1="70" x2="237" y2="63" stroke="#eed5b6" stroke-width="5" stroke-linecap="round"/>
  <line x1="226" y1="67" x2="228" y2="60" stroke="#eed5b6" stroke-width="5" stroke-linecap="round"/>
  <line x1="219" y1="67" x2="219" y2="60" stroke="#eed5b6" stroke-width="5" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="132" y="95" width="26" height="18" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
