  <line x1="145" y1="120" x2="55" y2="210" stroke="#f7de58" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="120" x2="240" y2="208" stroke="#f7de58" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="120" x2="145" y2="230" stroke="#f7de58" stroke-width="3" stroke-linecap="round"/>
  <!-- Shorter accent lines -->
  <line x1="145" y1="120" x2="88" y2="32" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="120" x2="202" y2="32" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>

  <!-- Figure jumping - legs apart and bent (airborne) -->
  <!-- Left leg bent back -->
  <path d="M128 175 Q112 190 108 210" fill="none" stroke="#2a4ec0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right leg bent forward/out -->
  <path d="M162 175 Q178 188 182 208" fill="none" stroke="#2a4ec0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Feet -->
  <ellipse cx="106" cy="214" rx="14" ry="9" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <ellipse cx="183" cy="212" rx="14" ry="9" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>

  <!-- Torso -->
  <rect x="112" y="110" width="66" height="68" rx="12" fill="#ff9900" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Left arm raised high and wide -->
  <path d="M112 118 Q90 100 68 80" fill="none" stroke="#eed5b6" stroke-width="15" stroke-linecap="round"/>
  <!-- Right arm raised high and wide -->
  <path d="M178 118 Q200 100 222 80" fill="none" stroke="#eed5b6" stroke-width="15" stroke-linecap="round"/>
  <!-- Hands open/splayed at tips -->
  <ellipse cx="65" cy="76" rx="12" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <ellipse cx="225" cy="76" rx="12" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
