  <path d="M115 60 Q120 42 132 38 Q138 28 145 36 Q152 28 158 38 Q170 42 175 60 Q165 52 155 55 Q150 44 145 50 Q140 44 135 55 Q125 52 115 60 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
