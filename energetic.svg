  <ellipse cx="135" cy="72" rx="6" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="155" cy="72" rx="6" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="135" cy="73" rx="4" ry="4.5" fill="#1d0e82" stroke="none"/>
