  <ellipse cx="166" cy="82" rx="8" ry="5.5" fill="#f4a4b2" stroke="none"/>

  <!-- Lightning bolt left -->
  <path d="M36 50 L28 72 L38 72 L26 96 L46 68 L36 68 Z" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Lightning bolt right -->
