  <!-- BACKGROUND PANEL -->
  <rect x="22" y="22" width="246" height="196" rx="14" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- LAPTOP (person holds it open) -->
  <!-- Laptop screen -->
  <rect x="130" y="90" width="110" height="76" rx="6" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="138" y="98" width="94" height="60" rx="3" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Laptop base -->
  <rect x="122" y="164" width="126" height="14" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- GREEN TICK + LOCK on screen -->
  <!-- Lock icon -->
  <rect x="162" y="108" width="22" height="20" rx="4" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M166 108 Q166 100 173 100 Q180 100 180 108" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="173" cy="119" r="3" fill="#529929"/>
  <!-- Green tick next to lock -->
  <polyline points="188,116 194,122 208,106" fill="none" stroke="#529929" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- PERSON (full body, left of laptop) -->
  <!-- WHITE HAT (cowboy style) -->
  <ellipse cx="74" cy="44" rx="26" ry="7" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <path d="M58 44 Q58 26 74 24 Q90 26 90 44 Z" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Head -->
  <circle cx="74" cy="62" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Eyes -->
  <circle cx="67" cy="60" r="3" fill="#000000"/>
  <circle cx="81" cy="60" r="3" fill="#000000"/>
  <!-- Mouth -->
  <path d="M68 69 Q74 73 80 69" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Torso -->
  <path d="M52 84 Q50 84 48 96 L48 144 Q48 148 52 148 L96 148 Q100 148 100 144 L100 96 Q98 84 96 84 L88 78 L74 82 L60 78 Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Collar -->
