<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- ground -->
  <rect x="20" y="210" width="250" height="14" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- ladder of steps (back-left): rising staircase -->
  <g>
    <rect x="20" y="190" width="38" height="20" fill="#7d5e23" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="20" y="165" width="38" height="25" fill="#9d7246" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="20" y="135" width="38" height="30" fill="#7d5e23" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="20" y="100" width="38" height="35" fill="#9d7246" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- arrow up the steps -->
    <path d="M30 200 L30 95" fill="none" stroke="#137827" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="30,95 24,105 36,105" fill="#137827" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- person FULL BODY, confident posture, facing right toward spider -->
  <!-- head -->
  <circle cx="115" cy="70" r="16" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M100 65 Q100 50 115 50 Q130 50 130 65 Q125 56 115 56 Q105 56 100 65 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- eyes (looking forward, confident) -->
  <circle cx="110" cy="70" r="1.8" fill="#000000"/>
  <circle cx="120" cy="70" r="1.8" fill="#000000"/>
  <!-- determined mouth -->
  <path d="M108 80 Q115 84 122 80" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="110" y="85" width="10" height="6" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <!-- torso (chest out, confident) -->
  <path d="M92 90 Q90 95 92 100 L92 145 Q92 152 100 152 L130 152 Q138 152 138 145 L138 100 Q140 95 138 90 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arms: right arm pointing forward (toward spider), left on hip -->
  <!-- right arm extended forward -->
  <path d="M138 100 Q160 105 172 110 L178 118 L172 120 L158 115 Q150 113 138 110 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- right hand -->
  <circle cx="178" cy="116" r="6" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <!-- left arm on hip -->
  <path d="M92 100 L75 115 L78 138 L88 138 L88 122 L102 110 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- left hand -->
  <circle cx="83" cy="135" r="5" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <!-- legs -->
  <rect x="98" y="152" width="14" height="50" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="118" y="152" width="14" height="50" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- feet -->
  <ellipse cx="103" cy="206" rx="10" ry="5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="127" cy="206" rx="10" ry="5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- feared object: spider on the right -->
  <g transform="translate(225 130)">
    <!-- body -->
    <ellipse cx="0" cy="0" rx="20" ry="16" fill="#000000" stroke="#000000" stroke-width="2.5"/>
    <!-- head -->
    <circle cx="-18" cy="-2" r="9" fill="#000000" stroke="#000000" stroke-width="2.5"/>
    <!-- eyes -->
    <circle cx="-22" cy="-5" r="2" fill="#d01424"/>
    <circle cx="-15" cy="-5" r="2" fill="#d01424"/>
    <!-- legs (8) -->
    <path d="M-5 -10 Q-15 -22 -25 -20" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 -12 Q-2 -25 -10 -28" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <path d="M5 -12 Q8 -25 18 -28" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 -10 Q22 -22 30 -20" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <path d="M-5 10 Q-15 22 -25 20" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 12 Q-2 25 -10 28" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <path d="M5 12 Q8 25 18 28" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 10 Q22 22 30 20" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
