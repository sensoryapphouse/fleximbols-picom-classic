<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Eyeliner pencil with twist-up tip + sharpener nearby -->
  <!-- Twist-up pencil (no wood, mechanical) - diagonal -->
  <g transform="rotate(-25 140 110)">
    <!-- Twist dial base -->
    <rect x="40" y="92" width="32" height="36" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Twist ridges -->
    <line x1="42" y1="100" x2="70" y2="100" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
    <line x1="42" y1="110" x2="70" y2="110" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
    <line x1="42" y1="120" x2="70" y2="120" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
    <!-- Pencil barrel (sleek modern, dark plum) -->
    <rect x="72" y="92" width="130" height="36" rx="4" fill="#392170" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Label band -->
    <rect x="88" y="100" width="100" height="20" rx="2" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
    <!-- Ferrule before tip -->
    <rect x="202" y="92" width="10" height="36" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
    <!-- Twist-up cone tip (extends out) -->
    <polygon points="212,92 212,128 244,110" fill="#392170" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Inky tip point -->
    <polygon points="244,110 230,102 230,118" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Sharpener nearby (small cube with hole, bottom right) -->
  <rect x="186" y="170" width="74" height="52" rx="6" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Sharpener hole (round opening for pencil) -->
  <circle cx="223" cy="196" r="14" fill="#000000" stroke="#000000" stroke-width="4"/>
  <!-- Blade screw -->
  <circle cx="223" cy="196" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <line x1="219" y1="196" x2="227" y2="196" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Shaving curls beside sharpener -->
  <path d="M 178 214 Q 172 210 174 204 Q 178 200 184 204" fill="none" stroke="#392170" stroke-width="3" stroke-linecap="round"/>
  <path d="M 168 222 Q 162 218 164 212 Q 168 208 174 212" fill="none" stroke="#392170" stroke-width="3" stroke-linecap="round"/>
</svg>
