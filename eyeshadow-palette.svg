  <!-- Eyeshadow palette: flat rectangular open palette with 9 coloured pans (3x3 grid) -->
  <!-- Palette case base -->
  <rect x="30" y="128" width="230" height="96" rx="10" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Inner tray -->
  <rect x="40" y="136" width="210" height="80" rx="6" fill="#1d0e82" stroke="#000000" stroke-width="4"/>
  <!-- 9 eyeshadow pans arranged 3 rows x 3 cols -->
  <!-- Row 1 -->
  <circle cx="84" cy="158" r="22" fill="#f4a4b2" stroke="#000000" stroke-width="4"/>
  <circle cx="145" cy="158" r="22" fill="#f266aa" stroke="#000000" stroke-width="4"/>
  <circle cx="206" cy="158" r="22" fill="#7c3fac" stroke="#000000" stroke-width="4"/>
  <!-- Row 2 -->
  <circle cx="84" cy="196" r="22" fill="#e65a00" stroke="#000000" stroke-width="4"/>
  <circle cx="145" cy="196" r="22" fill="#9d7246" stroke="#000000" stroke-width="4"/>
  <circle cx="206" cy="196" r="22" fill="#5e1f0a" stroke="#000000" stroke-width="4"/>
  <!-- Row 3 — partial, peek below, but fit within tray -->
  <!-- Use a clip-like approach: smaller circles at bottom edge -->
  <!-- Actually place row 3 as a third row; palette is tall enough -->
  <!-- Re-layout: 3 rows of 3 pans in 80px tall tray — use radius 12 -->
  <!-- Redo with radius 12, 3x3 grid -->
  <!-- Clear and re-draw tighter -->
  <!-- Tray background already drawn; overdraw pans with radius 12 in 3x3 -->
  <!-- Row 1 y=154 -->
  <circle cx="84" cy="154" r="14" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <circle cx="145" cy="154" r="14" fill="#f266aa" stroke="#000000" stroke-width="3"/>
  <circle cx="206" cy="154" r="14" fill="#7c3fac" stroke="#000000" stroke-width="3"/>
  <!-- Row 2 y=176 -->
  <circle cx="84" cy="176" r="14" fill="#e65a00" stroke="#000000" stroke-width="3"/>
  <circle cx="145" cy="176" r="14" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <circle cx="206" cy="176" r="14" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Row 3 y=198 -->
  <circle cx="84" cy="198" r="14" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <circle cx="145" cy="198" r="14" fill="#3aa6a0" stroke="#000000" stroke-width="3"/>
  <circle cx="206" cy="198" r="14" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- Palette lid (open, flipped back above) -->
  <rect x="30" y="30" width="230" height="96" rx="10" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Mirror in lid -->
  <rect x="42" y="40" width="206" height="76" rx="6" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- Mirror sheen line -->
  <line x1="54" y1="50" x2="120" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Hinge connecting lid to base -->
  <rect x="125" y="122" width="40" height="10" rx="5" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
</svg>