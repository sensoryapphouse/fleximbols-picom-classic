  <!-- face-mask-skin: person face with thick MUD/CLAY mask all over, two eye holes -->
  <!-- Neck -->
  <rect x="126" y="188" width="38" height="40" rx="8" ry="8" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head base (skin under mask) -->
  <ellipse cx="145" cy="125" rx="78" ry="88" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Clay/mud mask covering the face (cream/beige colour) -->
  <ellipse cx="145" cy="130" rx="72" ry="82" fill="#f5e7c4" stroke="#000000" stroke-width="4.5"/>
  <!-- Mask texture lines (suggest thick clay) -->
  <path d="M80,105 Q90,95 100,105" fill="none" stroke="#e6b98a" stroke-width="3" stroke-linecap="round"/>
  <path d="M188,105 Q198,95 208,105" fill="none" stroke="#e6b98a" stroke-width="3" stroke-linecap="round"/>
  <path d="M100,170 Q115,180 130,172" fill="none" stroke="#e6b98a" stroke-width="3" stroke-linecap="round"/>
  <path d="M160,172 Q175,180 190,170" fill="none" stroke="#e6b98a" stroke-width="3" stroke-linecap="round"/>
  <!-- Drip lines suggesting wet clay -->
  <path d="M90,145 Q87,160 88,170" fill="none" stroke="#e6b98a" stroke-width="3" stroke-linecap="round"/>
  <path d="M200,145 Q203,160 202,170" fill="none" stroke="#e6b98a" stroke-width="3" stroke-linecap="round"/>
  <!-- Eye holes cut out of mask (skin colour showing through) -->
  <ellipse cx="116" cy="118" rx="20" ry="14" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <ellipse cx="174" cy="118" rx="20" ry="14" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Eyes (irises in the holes) -->
  <ellipse cx="116" cy="118" rx="10" ry="11" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <circle cx="116" cy="118" r="5" fill="#000000"/>
  <circle cx="118" cy="115" r="2.5" fill="#ffffff"/>
  <ellipse cx="174" cy="118" rx="10" ry="11" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <circle cx="174" cy="118" r="5" fill="#000000"/>
  <circle cx="176" cy="115" r="2.5" fill="#ffffff"/>
  <!-- Hair on top -->
  <path d="M67,110 Q68,50 145,42 Q222,50 223,110" fill="#5e1f0a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
</svg>
