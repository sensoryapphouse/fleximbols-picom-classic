  <!-- Tablet/phone screen frame -->
  <rect x="22" y="18" width="210" height="204" rx="16" ry="16" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Screen area -->
  <rect x="34" y="36" width="186" height="170" rx="8" ry="8" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Camera dot top centre of frame -->
  <circle cx="127" cy="27" r="5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- Person face in video call — skin tone circle (head) -->
  <circle cx="127" cy="98" r="38" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Hair -->
  <path d="M89 98 Q89 60 127 60 Q165 60 165 98 L165 86 Q155 68 127 68 Q99 68 89 86 Z" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="113" cy="96" r="6" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="141" cy="96" r="6" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="115" cy="97" r="3" fill="#4d4d4d" stroke="#000000" stroke-width="1"/>
  <circle cx="143" cy="97" r="3" fill="#4d4d4d" stroke="#000000" stroke-width="1"/>
  <!-- Smile -->
  <path d="M113 114 Q127 128 141 114" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Shoulders (bust outline) -->
  <path d="M50 180 Q68 148 127 148 Q186 148 204 180 L204 206 L50 206 Z" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Video camera icon badge — top right corner of frame -->
  <rect x="214" y="68" width="54" height="36" rx="6" ry="6" fill="#529929" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Camera lens -->
  <circle cx="231" cy="86" r="9" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="231" cy="86" r="5" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <!-- Camera viewfinder triangle -->
  <polygon points="248,78 268,86 248,94" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
</svg>
