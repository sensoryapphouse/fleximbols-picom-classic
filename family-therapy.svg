    <path d="M-7 -3 Q-7 -10 0 -10 Q7 -10 7 -3 Q3 -7 0 -7 Q-3 -7 -7 -3 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
    <!-- pigtails -->
