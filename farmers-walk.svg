  <!-- Hair -->
  <path d="M 124,40 Q 126,24 145,24 Q 164,24 166,40 Q 156,30 145,31 Q 134,30 124,40 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
