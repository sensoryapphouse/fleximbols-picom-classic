  <ellipse cx="137" cy="45" rx="3" ry="3.5" fill="#000000"/>
  <ellipse cx="153" cy="45" rx="3" ry="3.5" fill="#000000"/>
  <!-- Determined mouth -->
  <path d="M 138,57 L 152,57" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
