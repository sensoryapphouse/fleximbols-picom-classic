  <!-- security scanner arch -->
  <path d="M170 200 L170 90 Q170 60 200 60 L250 60 Q280 60 280 90 L280 200 Z" fill="#90a7d6" stroke="#000000" stroke-width="3.5"/>
  <rect x="175" y="195" width="100" height="20" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <!-- scanner inner panel -->
  <rect x="195" y="100" width="60" height="90" rx="6" fill="#dff3fd" stroke="#000000" stroke-width="2.5"/>
  <!-- scanner light strip -->
  <rect x="200" y="108" width="50" height="10" fill="#f8130d" stroke="#000000" stroke-width="2"/>

  <!-- VIP queue rope posts on left -->
  <rect x="20" y="125" width="8" height="80" fill="#f2e40d" stroke="#000000" stroke-width="2.5"/>
  <circle cx="24" cy="120" r="7" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <rect x="90" y="125" width="8" height="80" fill="#f2e40d" stroke="#000000" stroke-width="2.5"/>
  <circle cx="94" cy="120" r="7" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- red rope -->
  <path d="M24 120 Q60 95 94 120" fill="none" stroke="#d01424" stroke-width="5" stroke-linecap="round"/>

  <!-- arrow indicating fast flow -->
  <polygon points="105,155 145,155 145,145 165,165 145,185 145,175 105,175" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- giant green checkmark above scanner -->
  <circle cx="225" cy="40" r="28" fill="#529929" stroke="#000000" stroke-width="3"/>
  <path d="M212 42 L222 53 L240 30" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- floor base -->
  <line x1="10" y1="218" x2="280" y2="218" stroke="#000000" stroke-width="2"/>
