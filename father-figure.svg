  <circle cx="197" cy="170" r="8" fill="#eed5b6" stroke="#000000" stroke-width="3"/>

  <!-- heart over chest (caring) -->
  <path d="M134 102 C134 96 142 96 142 102 C142 96 150 96 150 102 C150 110 142 118 142 118 C142 118 134 110 134 102 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

