  <circle cx="152" cy="56" r="2.2" fill="#000000"/>
  <!-- friendly smile -->
  <path d="M137 64 Q145 70 153 64" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- beard -->
  <path d="M128 60 Q130 76 145 78 Q160 76 162 60 Q160 70 145 72 Q130 70 128 60 Z" fill="#4d4d4d" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
