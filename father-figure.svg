  <!-- ground -->
  <ellipse cx="145" cy="228" rx="80" ry="6" fill="#9d7246" stroke="#000000" stroke-width="2"/>

  <!-- FATHER FIGURE FULL BODY (warm, protective, sturdy) -->
  <!-- trouser legs -->
  <path d="M114 138 L108 220 L132 220 L134 138 Z" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M156 138 L158 220 L182 220 L176 138 Z" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
