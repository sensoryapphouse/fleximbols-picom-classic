<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Person bust (left side) -->
  <!-- Head -->
  <circle cx="70" cy="65" r="30" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Neck -->
  <rect x="58" y="90" width="24" height="18" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Shoulders / upper body -->
  <path d="M 20 175 Q 20 108 70 108 Q 120 108 120 175 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Main thermometer (left of figure — actual reading) -->
  <rect x="130" y="30" width="22" height="130" rx="11" fill="#efefef" stroke="#000000" stroke-width="4"/>
  <!-- Mercury mid-level (actual temp) -->
  <rect x="137" y="90" width="8" height="78" rx="4" fill="#f8130d"/>
  <circle cx="141" cy="172" r="15" fill="#f8130d" stroke="#000000" stroke-width="4"/>
  <!-- Tick marks on main thermometer -->
  <line x1="152" y1="50" x2="160" y2="50" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="152" y1="70" x2="160" y2="70" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="152" y1="90" x2="160" y2="90" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="152" y1="110" x2="160" y2="110" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="152" y1="130" x2="160" y2="130" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Speech/thought bubble from figure's head toward right -->
  <path d="M 105 55 Q 108 40 130 38 L 265 38 Q 280 38 280 53 L 280 115 Q 280 130 265 130 L 130 130 Q 115 130 115 115 L 115 70 Q 115 55 130 55 Z" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Thought bubble tail dots -->
  <circle cx="112" cy="62" r="5" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="107" cy="57" r="4" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Second thermometer inside bubble (perceived / different reading) -->
  <rect x="185" y="50" width="18" height="68" rx="9" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <!-- Mercury LOW inside bubble (feels colder / different) -->
  <rect x="191" y="88" width="6" height="36" rx="3" fill="#2a4ec0"/>
  <circle cx="194" cy="126" r="12" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <!-- Tick marks on bubble thermometer -->
  <line x1="203" y1="60" x2="210" y2="60" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="203" y1="73" x2="210" y2="73" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="203" y1="86" x2="210" y2="86" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- "Actual vs Perceived" visual cue: arrow between levels inside bubble -->
  <line x1="220" y1="75" x2="245" y2="75" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <polygon points="243,70 249,75 243,80" fill="#000000"/>
  <!-- Small actual-temp mark in bubble (higher level bar for contrast) -->
  <rect x="250" y="58" width="12" height="36" rx="4" fill="#f8130d" stroke="#000000" stroke-width="2"/>
</svg>
