  <line x1="118" y1="105" x2="118" y2="135" stroke="#000000" stroke-width="2.5"/>
  <line x1="131" y1="105" x2="131" y2="135" stroke="#000000" stroke-width="2.5"/>
  <line x1="144" y1="105" x2="144" y2="135" stroke="#000000" stroke-width="2.5"/>
  <line x1="157" y1="105" x2="157" y2="135" stroke="#000000" stroke-width="2.5"/>
  <line x1="170" y1="105" x2="170" y2="135" stroke="#000000" stroke-width="2.5"/>
  <line x1="183" y1="105" x2="183" y2="135" stroke="#000000" stroke-width="2.5"/>
