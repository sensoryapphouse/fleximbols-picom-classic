  <!-- Fidget spinner — three-lobed classic shape -->
  <!-- Centre bearing cap -->
  <!-- Lobe 1 top -->
  <ellipse cx="145" cy="72" rx="34" ry="34" fill="#2a4ec0" stroke="#000000" stroke-width="5"/>
  <!-- Lobe 2 bottom-left -->
  <ellipse cx="107" cy="140" rx="34" ry="34" fill="#f8130d" stroke="#000000" stroke-width="5"/>
  <!-- Lobe 3 bottom-right -->
  <ellipse cx="183" cy="140" rx="34" ry="34" fill="#529929" stroke="#000000" stroke-width="5"/>
  <!-- Connector body triangle -->
  <polygon points="145,86 116,132 174,132" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Centre bearing -->
  <circle cx="145" cy="118" r="20" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <circle cx="145" cy="118" r="10" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <circle cx="145" cy="118" r="4" fill="#efefef" stroke="#000000" stroke-width="2"/>
  <!-- Highlight dots on lobes -->
  <circle cx="145" cy="66" r="8" fill="#dff3fd" stroke="#000000" stroke-width="2.5"/>
  <circle cx="107" cy="134" r="8" fill="#f4a4b2" stroke="#000000" stroke-width="2.5"/>
  <circle cx="183" cy="134" r="8" fill="#f7de58" stroke="#000000" stroke-width="2.5"/>
  <!-- Motion arc lines suggesting spin -->
  <path d="M115 45 Q88 68 96 100" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,5"/>
  <path d="M175 45 Q202 68 194 100" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,5"/>
</svg>
