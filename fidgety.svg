  <ellipse cx="188" cy="202" rx="6" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <ellipse cx="181" cy="198" rx="6" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <ellipse cx="173" cy="196" rx="6" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
