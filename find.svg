  <!-- Found item (star/gem shape) inside magnifier -->
  <!-- Glow ring around found item -->
  <circle cx="155" cy="110" r="52" fill="#f7de58" stroke="none"/>
  <!-- Magnifying glass circle -->
  <circle cx="155" cy="110" r="45" fill="#dff3fd" stroke="#000000" stroke-width="6"/>
  <circle cx="155" cy="110" r="36" fill="none" stroke="#000000" stroke-width="8"/>
  <!-- Found item inside: a small star/dot with highlight -->
  <polygon points="155,82 161,98 178,98 165,109 170,126 155,116 140,126 145,109 132,98 149,98" fill="#ff9900" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Handle -->
  <line x1="188" y1="143" x2="248" y2="205" stroke="#000000" stroke-width="11" stroke-linecap="round"/>
  <!-- Checkmark badge (success — found!) in bottom right of magnifier -->
  <!-- Green circle badge -->
  <circle cx="192" cy="147" r="22" fill="#529929" stroke="#000000" stroke-width="4"/>
  <!-- Check mark drawn as polyline -->
  <polyline points="181,147 190,158 206,136" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
