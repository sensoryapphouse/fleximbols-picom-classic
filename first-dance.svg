  <!-- spotlight cone behind couple -->
  <path d="M145 10 L70 230 L220 230 Z" fill="#f5e7c4" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- dance floor disc -->
  <ellipse cx="145" cy="225" rx="100" ry="10" fill="#9d7246" stroke="#000000" stroke-width="3"/>

  <!-- BRIDE (left) FULL BODY -->
  <!-- dress (long flowing) -->
  <path d="M110 130 Q92 195 96 220 L150 220 Q150 195 138 130 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- dress shadow line -->
  <path d="M105 175 Q120 185 145 180" fill="none" stroke="#b8b8b8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- legs/feet peek -->
  <ellipse cx="115" cy="222" rx="6" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="135" cy="222" rx="6" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- torso (bodice) -->
  <path d="M114 95 L112 132 L138 132 L136 95 Q125 90 114 95 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- neck -->
  <rect x="120" y="85" width="10" height="12" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="125" cy="72" rx="16" ry="17" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- hair (updo) -->
  <path d="M108 70 Q108 52 125 50 Q142 52 142 70 Q140 60 125 58 Q110 60 108 70 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- veil -->
  <path d="M118 55 Q102 70 105 105" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="120" cy="73" r="2" fill="#000000"/>
  <circle cx="130" cy="73" r="2" fill="#000000"/>
  <!-- smile -->
  <path d="M120 80 Q125 83 130 80" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- bride arm to groom shoulder -->
  <path d="M138 110 L168 95 L172 102 L140 118 Z" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- bride arm out to side (held by groom) -->
  <path d="M114 110 L92 130 L96 138 L116 122 Z" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- GROOM (right) FULL BODY -->
  <!-- legs (trousers) -->
  <path d="M158 145 L152 220 L168 220 L170 145 Z" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M182 145 L184 220 L200 220 L194 145 Z" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- shoes -->
  <ellipse cx="160" cy="222" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="192" cy="222" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- jacket/torso -->
  <path d="M152 100 L150 148 L200 148 L198 100 Q180 92 175 92 Q165 92 152 100 Z" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- shirt V + tie -->
  <path d="M170 100 L175 128 L180 100 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M173 105 L175 124 L177 105 Z" fill="#000000"/>
  <!-- neck -->
  <rect x="170" y="85" width="10" height="12" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="175" cy="72" rx="16" ry="17" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- hair -->
  <path d="M159 68 Q162 52 175 50 Q188 52 191 68 Q188 60 175 58 Q162 60 159 68 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="170" cy="73" r="2" fill="#000000"/>
  <circle cx="180" cy="73" r="2" fill="#000000"/>
  <!-- smile -->
  <path d="M170 80 Q175 83 180 80" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- groom arm around bride waist -->
  <path d="M152 118 L122 135 L126 142 L154 130 Z" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- groom arm holding bride hand (extended) -->
  <path d="M198 110 L218 130 L214 138 L194 122 Z" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- their clasped hands -->
  <ellipse cx="92" cy="132" rx="7" ry="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>

  <!-- heart above -->
  <path d="M132 22 C132 15 142 15 142 22 C142 15 152 15 152 22 C152 30 142 38 142 38 C142 38 132 30 132 22 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
