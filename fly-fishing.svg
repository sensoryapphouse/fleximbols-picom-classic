  <!-- Rod handle (cork grip) -->
  <rect x="22" y="188" width="60" height="14" rx="7" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Rod blank (tapers to tip) -->
  <polygon points="82,192 82,198 268,196 268,194" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Reel seat -->
  <rect x="72" y="186" width="28" height="18" rx="4" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Fly reel body (circular) -->
  <circle cx="86" cy="208" r="22" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <circle cx="86" cy="208" r="12" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <circle cx="86" cy="208" r="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Reel handle arm -->
  <line x1="98" y1="208" x2="108" y2="200" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="110" cy="199" r="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Fly line loops (casting arc) -->
  <path d="M 268,195 C 255,150 210,110 175,130 C 150,145 160,175 140,160 C 120,145 130,105 100,115" fill="none" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
  <!-- Tippet (fine leader to fly) -->
  <line x1="100" y1="115" x2="78" y2="100" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Artificial fly lure (small, at line end) -->
  <ellipse cx="72" cy="96" rx="8" ry="4" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- Fly hook -->
  <path d="M 75,99 Q 82,106 78,112" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Fly feather hackle -->
  <ellipse cx="66" cy="93" rx="6" ry="3" fill="#f8130d" stroke="#000000" stroke-width="2" transform="rotate(-30 66 93)"/>
  <ellipse cx="70" cy="90" rx="5" ry="2" fill="#529929" stroke="#000000" stroke-width="2" transform="rotate(-15 70 90)"/>
  <!-- Rod guides (rings along blank) -->
  <ellipse cx="120" cy="195" rx="5" ry="3" fill="none" stroke="#000000" stroke-width="3"/>
  <ellipse cx="160" cy="195" rx="4" ry="2" fill="none" stroke="#000000" stroke-width="3"/>
  <ellipse cx="200" cy="195" rx="3" ry="2" fill="none" stroke="#000000" stroke-width="3"/>
  <ellipse cx="235" cy="195" rx="2" ry="2" fill="none" stroke="#000000" stroke-width="2"/>
</svg>
