  <!-- Bust: neck + shoulders -->
  <rect x="95" y="182" width="100" height="46" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shirt -->
  <path d="M95 193 Q145 212 195 193" fill="#1d0e82" stroke="#000000" stroke-width="4"/>
  <!-- Neck -->
  <rect x="128" y="165" width="34" height="24" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head -->
  <ellipse cx="145" cy="114" rx="52" ry="56" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M95 104 Q94 66 118 56 Q145 46 172 56 Q196 66 195 104" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Intense focused eyebrows — angled inward sharply -->
  <path d="M108 94 Q122 86 136 92" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M154 92 Q168 86 182 94" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Eyes: narrow intense gaze locked forward -->
  <ellipse cx="122" cy="108" rx="15" ry="9" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="122" cy="108" rx="8" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="120" cy="106" rx="2" ry="2" fill="#ffffff"/>
  <ellipse cx="168" cy="108" rx="15" ry="9" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="168" cy="108" rx="8" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="166" cy="106" rx="2" ry="2" fill="#ffffff"/>
  <!-- Mouth: firm determined set -->
  <path d="M126 146 Q145 142 164 146" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Bullseye target — top right, eyes locked toward it -->
  <!-- Outer ring -->
  <circle cx="238" cy="68" r="26" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Middle ring -->
  <circle cx="238" cy="68" r="16" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <!-- Inner bullseye -->
  <circle cx="238" cy="68" r="7" fill="#d01424" stroke="#000000" stroke-width="3"/>
  <!-- Gaze line from eyes to target -->
  <line x1="197" y1="108" x2="212" y2="88" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
  <!-- Sharp focus lines radiating from bullseye -->
  <line x1="265" y1="54" x2="272" y2="47" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="270" y1="68" x2="278" y2="68" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="265" y1="82" x2="272" y2="89" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
