  <!-- FOLEY-ARTIST: person performing live sound with coconut shells near a mic, sound-burst marks -->
  <!-- Mic stand base -->
  <ellipse cx="145" cy="222" rx="28" ry="8" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>
  <!-- Mic stand pole -->
  <rect x="141" y="120" width="8" height="102" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Mic stand boom arm -->
  <line x1="145" y1="130" x2="118" y2="118" stroke="#b8b8b8" stroke-width="5" stroke-linecap="round"/>
  <!-- Microphone -->
  <rect x="108" y="108" width="20" height="30" rx="10" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Mic grille lines -->
  <line x1="110" y1="114" x2="126" y2="114" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="120" x2="126" y2="120" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="126" x2="126" y2="126" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
  <!-- Sound burst marks near mic -->
  <path d="M94 108 Q86 116 94 124" fill="none" stroke="#f7de58" stroke-width="4" stroke-linecap="round"/>
  <path d="M86 102 Q72 116 86 130" fill="none" stroke="#f7de58" stroke-width="4" stroke-linecap="round"/>
  <path d="M78 96 Q58 116 78 136" fill="none" stroke="#f2e40d" stroke-width="4" stroke-linecap="round"/>
  <!-- Person: legs -->
  <line x1="196" y1="196" x2="188" y2="222" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="218" y1="196" x2="222" y2="222" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="186" cy="224" rx="9" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <ellipse cx="222" cy="224" rx="9" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Person: torso -->
  <rect x="194" y="156" width="30" height="40" rx="5" fill="#d01424" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Person: left arm reaching down holding coconut shell -->
  <line x1="194" y1="166" x2="172" y2="192" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Left coconut shell -->
  <path d="M158 196 Q172 184 178 198 Q164 210 158 196Z" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <line x1="168" y1="196" x2="172" y2="210" stroke="#7d5e23" stroke-width="3" stroke-linecap="round"/>
  <!-- Person: right arm -->
  <line x1="224" y1="166" x2="246" y2="190" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Right coconut shell -->
  <path d="M244 194 Q258 182 262 196 Q250 208 244 194Z" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Person: neck -->
  <rect x="202" y="147" width="10" height="10" rx="2" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Person: head -->
  <circle cx="207" cy="136" r="14" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M193 133 Q207 120 221 133" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Headset/ear piece -->
  <circle cx="221" cy="138" r="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
