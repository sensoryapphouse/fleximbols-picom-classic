  <!-- Foolish: dunce hat, silly mistaken look, banana peel slip -->
  <!-- Dunce hat (tall pointed) -->
  <polygon points="145,8 108,82 182,82" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="145,8 118,52 172,52" fill="#f7de58" stroke="none"/>
  <!-- Hat band -->
  <rect x="108" y="76" width="74" height="12" rx="3" fill="#f7de58" stroke="#000000" stroke-width="4"/>
  <!-- 'D' on hat as shape - diamond -->
  <ellipse cx="145" cy="46" rx="10" ry="14" fill="none" stroke="#000000" stroke-width="3"/>
  <!-- Head tilted, dopey look -->
  <ellipse cx="145" cy="122" rx="44" ry="46" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Ears -->
  <ellipse cx="100" cy="122" rx="12" ry="16" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <ellipse cx="190" cy="122" rx="12" ry="16" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Wide wide eyes - surprised mistaken look, different sizes for silliness -->
  <circle cx="128" cy="116" r="14" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="162" cy="115" r="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="129" cy="118" r="7" fill="#2a4ec0"/>
  <circle cx="162" cy="116" r="6" fill="#2a4ec0"/>
  <!-- Slightly crossed pupils -->
  <circle cx="131" cy="119" r="4" fill="#000000"/>
  <circle cx="160" cy="117" r="4" fill="#000000"/>
  <!-- Nose - bulbous -->
  <ellipse cx="145" cy="132" rx="10" ry="8" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Dopey open mouth with gap tooth -->
  <path d="M124,148 Q145,164 166,148" fill="#000000" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <rect x="138" y="148" width="10" height="10" rx="2" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="150" y="148" width="10" height="10" rx="2" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Neck -->
  <rect x="130" y="165" width="30" height="16" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Body - tumbling/slipping posture (arms out) -->
  <path d="M100,180 Q95,220 115,228 L175,228 Q195,220 190,180 Q170,172 145,172 Q120,172 100,180Z" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Arms out to sides - slipping pose -->
  <line x1="102" y1="188" x2="60" y2="172" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <line x1="60" y1="172" x2="44" y2="164" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <line x1="188" y1="188" x2="230" y2="175" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <line x1="230" y1="175" x2="248" y2="182" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <!-- Arm outlines -->
  <line x1="102" y1="188" x2="44" y2="164" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="188" y1="188" x2="248" y2="182" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Banana peel on ground -->
  <ellipse cx="162" cy="232" rx="30" ry="8" fill="#f7de58" stroke="#000000" stroke-width="4"/>
  <path d="M138,228 Q128,218 134,210" fill="none" stroke="#f2e40d" stroke-width="6" stroke-linecap="round"/>
  <path d="M148,226 Q142,214 148,206" fill="none" stroke="#f2e40d" stroke-width="6" stroke-linecap="round"/>
  <path d="M158,226 Q158,214 165,206" fill="none" stroke="#f2e40d" stroke-width="6" stroke-linecap="round"/>
  <path d="M168,226 Q176,216 172,208" fill="none" stroke="#f2e40d" stroke-width="6" stroke-linecap="round"/>
  <!-- Stars of dizziness -->
  <polygon points="72,152 75,162 85,162 77,168 80,178 72,172 64,178 67,168 59,162 69,162" fill="#f7de58" stroke="#000000" stroke-width="2"/>
</svg>
