  <!-- thermometer body -->
  <rect x="95" y="40" width="30" height="140" rx="14" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <!-- bulb -->
  <circle cx="110" cy="190" r="26" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <!-- low mercury column -->
  <rect x="103" y="160" width="14" height="30" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <!-- tick marks (no text) -->
  <line x1="125" y1="60" x2="135" y2="60" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="125" y1="85" x2="135" y2="85" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="125" y1="110" x2="135" y2="110" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="125" y1="135" x2="140" y2="135" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="125" y1="160" x2="135" y2="160" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- ice crystal (snowflake) -->
  <g stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="210" y1="80" x2="210" y2="170"/>
    <line x1="165" y1="125" x2="255" y2="125"/>
    <line x1="178" y1="93" x2="242" y2="157"/>
    <line x1="242" y1="93" x2="178" y2="157"/>
  </g>
  <!-- snowflake tips -->
  <g fill="#dff3fd" stroke="#000000" stroke-width="2" stroke-linejoin="round">
    <polygon points="210,75 205,85 215,85"/>
    <polygon points="210,175 205,165 215,165"/>
    <polygon points="160,125 170,120 170,130"/>
    <polygon points="260,125 250,120 250,130"/>
  </g>
  <circle cx="210" cy="125" r="6" fill="#90a7d6" stroke="#000000" stroke-width="2"/>
</svg>
