  <path d="M 120,148 Q 96,156 78,178 L 94,185 Q 110,165 128,158 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left lower leg -->
  <path d="M 78,178 L 74,218 L 98,218 L 96,183 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right upper leg -->
  <path d="M 170,148 Q 194,156 212,178 L 196,185 Q 180,165 162,158 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right lower leg -->
  <path d="M 212,178 L 216,218 L 192,218 L 194,183 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
