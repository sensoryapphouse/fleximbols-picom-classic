  <!-- Right shoe -->
  <ellipse cx="204" cy="218" rx="15" ry="6" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Head (in front of bar, elbows flanking it) -->
  <circle cx="145" cy="70" r="23" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Hair -->
  <path d="M 123,63 Q 125,47 145,47 Q 165,47 167,63 Q 158,53 145,54 Q 132,53 123,63 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eyes -->
  <ellipse cx="137" cy="68" rx="3" ry="3.5" fill="#000000"/>
  <ellipse cx="153" cy="68" rx="3" ry="3.5" fill="#000000"/>
  <!-- Focused mouth -->
  <path d="M 138,79 L 152,79" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
