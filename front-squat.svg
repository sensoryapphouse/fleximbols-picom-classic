  <!-- Floor -->
  <path d="M 30,218 L 260,218" stroke="#000000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Barbell bar across front shoulders/clavicles (in front of head, elbows high) -->
  <rect x="50" y="96" width="190" height="9" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left weight plate -->
  <rect x="50" y="82" width="20" height="37" rx="6" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right weight plate -->
  <rect x="220" y="82" width="20" height="37" rx="6" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left collar -->
  <rect x="70" y="91" width="10" height="19" rx="3" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right collar -->
  <rect x="210" y="91" width="10" height="19" rx="3" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left elbow pointing forward/up (clean grip: arm under bar, elbow up) -->
  <path d="M 118,105 Q 104,105 80,100" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 118,102 Q 104,102 78,97 L 78,107 Q 104,112 120,110 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left elbow tip (pointing outward and up) -->
  <path d="M 118,102 Q 108,96 102,84" fill="none" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <path d="M 118,102 Q 108,96 102,84" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="102" cy="83" r="9" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right elbow pointing forward/up -->
  <path d="M 172,105 Q 186,105 210,100" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 170,102 Q 186,102 212,97 L 212,107 Q 186,112 170,110 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right elbow tip (pointing outward and up) -->
  <path d="M 172,102 Q 182,96 188,84" fill="none" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <path d="M 172,102 Q 182,96 188,84" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="188" cy="83" r="9" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
