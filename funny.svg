<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Funny-modern: laughing face making others laugh, rubber chicken prop, one chuckle -->
  <!-- Bust/upper body only -->
  <!-- Torso -->
  <rect x="95" y="148" width="100" height="68" rx="12" fill="#ff9900" stroke="#000000" stroke-width="5"/>
  <!-- Left arm holding rubber chicken -->
  <line x1="96" y1="160" x2="48" y2="185" stroke="#ff9900" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="42" cy="188" rx="12" ry="11" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Rubber chicken (yellow, simple squeaky shape) -->
  <!-- Chicken body -->
  <ellipse cx="24" cy="175" rx="16" ry="22" fill="#f2e40d" stroke="#000000" stroke-width="3"/>
  <!-- Chicken head -->
  <ellipse cx="24" cy="152" rx="10" ry="10" fill="#f2e40d" stroke="#000000" stroke-width="3"/>
  <!-- Chicken beak -->
  <polygon points="24,152 32,156 24,160" fill="#ff9900" stroke="#000000" stroke-width="2"/>
  <!-- Chicken eye -->
  <circle cx="20" cy="150" r="3" fill="#000000"/>
  <!-- Chicken legs dangling -->
  <line x1="18" y1="196" x2="14" y2="210" stroke="#ff9900" stroke-width="5" stroke-linecap="round"/>
  <line x1="30" y1="196" x2="34" y2="210" stroke="#ff9900" stroke-width="5" stroke-linecap="round"/>
  <!-- Right arm raised -->
  <line x1="194" y1="158" x2="230" y2="140" stroke="#ff9900" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="236" cy="137" rx="12" ry="11" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Neck -->
  <rect x="128" y="128" width="34" height="24" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head -->
  <ellipse cx="145" cy="92" rx="46" ry="44" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="145" cy="52" rx="44" ry="18" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Laughing eyes — squinted crescents -->
  <path d="M118 84 Q126 76 134 84" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M156 84 Q164 76 172 84" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <ellipse cx="118" cy="98" rx="12" ry="8" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="172" cy="98" rx="12" ry="8" fill="#f4a4b2" stroke="none"/>
  <!-- Big laughing open mouth -->
  <path d="M122 104 Q145 126 168 104" fill="#d01424" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Teeth -->
  <rect x="128" y="104" width="34" height="12" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Tongue -->
  <ellipse cx="145" cy="118" rx="14" ry="8" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <!-- "HA" chuckle burst as polygon shapes -->
  <!-- H left vertical -->
  <rect x="218" y="78" width="7" height="26" rx="2" fill="#f2e40d" stroke="#000000" stroke-width="2"/>
  <!-- H crossbar -->
  <rect x="218" y="88" width="16" height="6" rx="2" fill="#f2e40d" stroke="#000000" stroke-width="2"/>
  <!-- H right vertical -->
  <rect x="227" y="78" width="7" height="26" rx="2" fill="#f2e40d" stroke="#000000" stroke-width="2"/>
  <!-- A -->
  <polygon points="244,104 252,78 260,104" fill="#f2e40d" stroke="#000000" stroke-width="2"/>
  <rect x="246" y="94" width="12" height="5" rx="1" fill="#ff9900" stroke="#000000" stroke-width="1"/>
  <!-- Exclamation burst around HA -->
  <circle cx="252" cy="92" r="20" fill="none" stroke="#f2e40d" stroke-width="3" stroke-dasharray="5,5"/>
</svg>
