  <!-- garter-toss: groom FULL BODY tossing garter back, crowd FULL BODY catching, chair -->
  <!-- ground -->
  <rect x="10" y="218" width="270" height="14" fill="#f5e7c4" stroke="#000000" stroke-width="2"/>

  <!-- CHAIR on left (where bride sat) -->
  <rect x="20" y="175" width="35" height="40" fill="#9d7246" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="20" y="125" width="35" height="55" fill="#9d7246" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="18" y="212" width="6" height="14" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <rect x="51" y="212" width="6" height="14" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- chair sash ribbon -->
  <path d="M37 130 L37 175" stroke="#f266aa" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 138 Q37 145 44 138" fill="#f266aa" stroke="#000000" stroke-width="1.5"/>

  <!-- GROOM in middle, back to viewer, tossing garter behind him over shoulder -->
  <!-- legs (trousers) -->
  <rect x="80" y="160" width="13" height="52" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <rect x="95" y="160" width="13" height="52" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="87" cy="215" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="102" cy="215" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- jacket -->
  <path d="M72 100 L70 165 L118 165 L116 100 Q116 84 94 82 Q72 84 72 100 Z" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- white shirt collar V -->
  <path d="M88 85 L94 100 L100 85 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- arm tossing back over shoulder (right arm raised back) -->
  <path d="M116 105 L150 75 L156 82 L120 115 Z" fill="#000000" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="152" cy="76" r="6" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- left arm down -->
  <path d="M72 105 L62 150 L72 152 L82 110 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="67" cy="153" r="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- head (back) -->
  <circle cx="94" cy="65" r="20" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <path d="M76 61 Q76 44 94 42 Q112 44 112 61 Q110 52 94 50 Q78 52 76 61 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>

  <!-- GARTER MID-AIR (flying back over shoulder toward crowd) -->
  <!-- motion trail -->
  <path d="M150 70 Q190 30 230 50" fill="none" stroke="#b8b8b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <!-- the garter (blue lacy ring) -->
  <g transform="translate(195 40)">
    <ellipse cx="0" cy="0" rx="22" ry="10" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="22" ry="10" fill="none" stroke="#90a7d6" stroke-width="1.5" stroke-dasharray="3 2"/>
    <!-- lace ruffle top -->
    <path d="M-22 -1 Q-18 -7 -14 -1 Q-10 -7 -6 -1 Q-2 -7 2 -1 Q6 -7 10 -1 Q14 -7 18 -1 Q22 -7 22 -1" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <!-- bow -->
    <path d="M-5 -4 L-12 -10 L-12 -2 L-5 -6 L5 -6 L12 -2 L12 -10 L5 -4 Z" fill="#d01424" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- white flower on garter -->
    <circle cx="0" cy="-4" r="3" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  </g>

  <!-- CROWD on right (two men FULL BODY reaching up to catch) -->
  <!-- man 1 -->
  <rect x="218" y="172" width="10" height="42" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <rect x="230" y="172" width="10" height="42" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <ellipse cx="223" cy="216" rx="7" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="235" cy="216" rx="7" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <path d="M211 130 L208 178 L250 178 L247 130 Q247 115 229 113 Q211 115 211 130 Z" fill="#1d0e82" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M213 117 L202 75 L210 73 L221 120 Z" fill="#1d0e82" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M245 117 L256 75 L248 73 L237 120 Z" fill="#1d0e82" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="206" cy="72" r="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <circle cx="252" cy="72" r="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <circle cx="229" cy="94" r="19" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <path d="M212 90 Q212 73 229 71 Q246 73 246 90 Q244 80 229 78 Q214 80 212 90 Z" fill="#7d5e23" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="223" cy="94" r="2" fill="#000000"/>
  <circle cx="235" cy="94" r="2" fill="#000000"/>
  <path d="M223 102 Q229 106 235 102" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- man 2 (smaller, behind) -->
  <rect x="258" y="180" width="8" height="34" fill="#137827" stroke="#000000" stroke-width="2"/>
  <rect x="268" y="180" width="8" height="34" fill="#137827" stroke="#000000" stroke-width="2"/>
  <ellipse cx="262" cy="216" rx="6" ry="3" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="272" cy="216" rx="6" ry="3" fill="#000000" stroke="#000000" stroke-width="2"/>
  <path d="M253 145 L251 182 L283 182 L281 145 Q281 133 267 131 Q253 133 253 145 Z" fill="#137827" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M254 135 L248 95 L255 94 L261 137 Z" fill="#137827" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M280 135 L286 95 L279 94 L273 137 Z" fill="#137827" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="251" cy="92" r="4" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <circle cx="283" cy="92" r="4" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <circle cx="267" cy="115" r="16" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <path d="M253 112 Q253 97 267 95 Q281 97 281 112 Q279 103 267 101 Q255 103 253 112 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="262" cy="115" r="1.8" fill="#000000"/>
  <circle cx="272" cy="115" r="1.8" fill="#000000"/>
  <path d="M262 122 Q267 125 272 122" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- motion lines -->
  <path d="M175 45 L168 38 M210 28 L213 22 M220 60 L228 60" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
</svg>
