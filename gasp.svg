  <!-- Head -->
  <ellipse cx="145" cy="118" rx="78" ry="88" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair top -->
  <ellipse cx="145" cy="55" rx="78" ry="32" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <!-- Left eye - wide open shocked -->
  <ellipse cx="108" cy="105" rx="18" ry="20" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="108" cy="107" r="9" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <circle cx="103" cy="102" r="3" fill="#ffffff"/>
  <!-- Right eye - wide open shocked -->
  <ellipse cx="182" cy="105" rx="18" ry="20" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="182" cy="107" r="9" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <circle cx="177" cy="102" r="3" fill="#ffffff"/>
  <!-- Eyebrows raised high in shock -->
  <path d="M90 82 Q108 70 126 78" fill="none" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <path d="M164 78 Q182 70 200 82" fill="none" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <!-- Round open mouth - O shape for gasp -->
  <ellipse cx="145" cy="165" rx="24" ry="26" fill="#000000" stroke="#000000" stroke-width="5"/>
  <ellipse cx="145" cy="165" rx="17" ry="19" fill="#d01424"/>
  <!-- Surprise/shock marks radiating -->
  <line x1="60" y1="60" x2="48" y2="46" stroke="#f2e40d" stroke-width="4" stroke-linecap="round"/>
  <line x1="52" y1="75" x2="36" y2="68" stroke="#f2e40d" stroke-width="4" stroke-linecap="round"/>
  <line x1="230" y1="60" x2="242" y2="46" stroke="#f2e40d" stroke-width="4" stroke-linecap="round"/>
  <line x1="238" y1="75" x2="254" y2="68" stroke="#f2e40d" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="28" x2="145" y2="12" stroke="#f2e40d" stroke-width="4" stroke-linecap="round"/>
  <!-- Inward air arrow at mouth (quick intake) -->
  <path d="M145 210 L145 195" stroke="#2a4ec0" stroke-width="4" stroke-linecap="round"/>
  <polygon points="145,191 139,200 151,200" fill="#2a4ec0" stroke="#2a4ec0" stroke-width="2"/>
