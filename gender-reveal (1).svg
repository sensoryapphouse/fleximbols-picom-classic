  <!-- floating question mark above cake -->
  <path d="M132 30 Q132 14 145 14 Q162 14 162 30 Q162 42 148 48 Q145 50 145 60" fill="none" stroke="#7c3fac" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
