  <!-- Gender reveal: box releasing pink AND blue balloons/confetti with question-mark shape (no text) -->
  <!-- Box body -->
  <rect x="85" y="140" width="120" height="85" rx="8" fill="#f5e7c4" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Box lid (open, flipped back) -->
  <path d="M 80 140 L 85 140 L 205 140 L 210 140 L 200 112 L 90 112 Z" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lid left flap open -->
  <path d="M 85 140 L 62 120 L 68 112 L 90 132 Z" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lid right flap open -->
  <path d="M 205 140 L 228 120 L 222 112 L 200 132 Z" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Box ribbon vertical -->
  <rect x="138" y="140" width="14" height="85" rx="3" fill="#f266aa" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Box ribbon horizontal -->
  <rect x="85" y="178" width="120" height="14" rx="3" fill="#f266aa" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pink balloon emerging left -->
  <ellipse cx="100" cy="88" rx="32" ry="38" fill="#f4a4b2" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="88" cy="70" rx="9" ry="12" fill="#f266aa" stroke="none"/>
  <ellipse cx="84" cy="65" rx="5" ry="6" fill="#ffffff" stroke="none"/>
  <ellipse cx="100" cy="126" rx="5" ry="4" fill="#f266aa" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 100 130 C 103 136 99 141 102 145" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Blue balloon emerging right -->
  <ellipse cx="190" cy="82" rx="32" ry="38" fill="#90a7d6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="178" cy="64" rx="9" ry="12" fill="#2a4ec0" stroke="none"/>
  <ellipse cx="174" cy="59" rx="5" ry="6" fill="#ffffff" stroke="none"/>
  <ellipse cx="190" cy="120" rx="5" ry="4" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 190 124 C 187 130 191 136 188 140" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Question mark shape (drawn as path, no text) -->
  <!-- Q-mark arc top -->
  <path d="M 135 48 C 135 35 155 30 160 40 C 165 50 155 58 148 65 C 144 70 144 76 144 80" fill="none" stroke="#392170" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Q-mark dot -->
  <circle cx="144" cy="90" r="5" fill="#392170" stroke="#000000" stroke-width="3"/>
  <!-- Confetti pieces -->
  <rect x="58" y="108" width="10" height="6" rx="2" fill="#f8130d" stroke="#000000" stroke-width="2" transform="rotate(-20 63 111)"/>
  <rect x="72" y="95" width="10" height="6" rx="2" fill="#f7de58" stroke="#000000" stroke-width="2" transform="rotate(15 77 98)"/>
  <rect x="210" y="100" width="10" height="6" rx="2" fill="#529929" stroke="#000000" stroke-width="2" transform="rotate(25 215 103)"/>
  <rect x="222" y="115" width="10" height="6" rx="2" fill="#f266aa" stroke="#000000" stroke-width="2" transform="rotate(-30 227 118)"/>
