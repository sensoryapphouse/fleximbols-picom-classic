  <!-- Flag-inspired bands: lavender, white, green -->
  <rect x="45" y="22" width="200" height="59" rx="8" fill="#7c3fac" stroke="none"/>
  <rect x="45" y="81" width="200" height="58" rx="0" fill="#ffffff" stroke="none"/>
  <rect x="45" y="139" width="200" height="59" rx="8" fill="#529929" stroke="none"/>
  <!-- Band outline -->
  <rect x="45" y="22" width="200" height="176" rx="8" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Band dividers -->
  <line x1="45" y1="81" x2="245" y2="81" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="139" x2="245" y2="139" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Genderqueer symbol: Mars + Venus + combined diagonal arrow -->
  <!-- Central circle -->
  <circle cx="145" cy="115" r="38" fill="none" stroke="#000000" stroke-width="5"/>
  <!-- Venus stem down -->
  <line x1="145" y1="153" x2="145" y2="178" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Venus cross -->
  <line x1="128" y1="170" x2="162" y2="170" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Mars arrow upper-right -->
  <line x1="170" y1="90" x2="195" y2="65" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <polyline points="178,65 195,65 195,82" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Combined/androgyne diagonal arrow upper-left -->
  <line x1="120" y1="90" x2="95" y2="65" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <polyline points="112,65 95,65 95,82" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
