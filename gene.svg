  <!-- Long chromosome bar (horizontal) -->
  <rect x="20" y="135" width="250" height="40" rx="20" ry="20" fill="#2a4ec0" stroke="#000000" stroke-width="4"/>
  <!-- Banding on chromosome -->
  <line x1="60" y1="135" x2="60" y2="175" stroke="#000000" stroke-width="3"/>
  <line x1="90" y1="135" x2="90" y2="175" stroke="#000000" stroke-width="3"/>
  <line x1="200" y1="135" x2="200" y2="175" stroke="#000000" stroke-width="3"/>
  <line x1="235" y1="135" x2="235" y2="175" stroke="#000000" stroke-width="3"/>
  <!-- Highlighted gene segment -->
  <rect x="120" y="125" width="60" height="60" rx="6" ry="6" fill="#fff200" stroke="#000000" stroke-width="4"/>
  <!-- DNA helix inside gene box -->
  <path d="M 130 135 Q 145 150 160 135 Q 175 120 175 135" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 130 175 Q 145 160 160 175 Q 175 190 175 175" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="138" y1="142" x2="138" y2="168" stroke="#e65a00" stroke-width="3"/>
  <line x1="150" y1="145" x2="150" y2="165" stroke="#529929" stroke-width="3"/>
  <line x1="162" y1="142" x2="162" y2="168" stroke="#e65a00" stroke-width="3"/>
  <!-- Arrow pointing to gene -->
  <line x1="150" y1="50" x2="150" y2="115" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <polygon points="150,115 142,103 158,103" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- Label dot -->
  <circle cx="150" cy="35" r="14" fill="#f8130d" stroke="#000000" stroke-width="4"/>
</svg>
