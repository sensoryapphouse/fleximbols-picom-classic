  <!-- Gentle: soft tender smile, cradling small bird carefully, light touch -->
  <!-- Head -->
  <ellipse cx="145" cy="86" rx="44" ry="48" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair - soft gentle waves -->
  <path d="M101,72 Q105,44 145,40 Q185,44 189,72" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Soft hair strands -->
  <path d="M101,72 Q96,60 104,52" fill="none" stroke="#e6b98a" stroke-width="5" stroke-linecap="round"/>
  <path d="M189,72 Q194,60 186,52" fill="none" stroke="#e6b98a" stroke-width="5" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="101" cy="86" rx="12" ry="16" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <ellipse cx="189" cy="86" rx="12" ry="16" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Soft gentle eyes - warm, slightly lowered lids, calm -->
  <ellipse cx="128" cy="80" rx="13" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="162" cy="80" rx="13" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="129" cy="81" r="7" fill="#9d7246"/>
  <circle cx="163" cy="81" r="7" fill="#9d7246"/>
  <circle cx="130" cy="81" r="4" fill="#000000"/>
  <circle cx="164" cy="81" r="4" fill="#000000"/>
  <!-- Gentle upper lid slight droop (calm not sleepy) -->
  <path d="M115,76 Q128,72 141,76" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M149,76 Q162,72 175,76" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Soft light in eyes -->
  <circle cx="133" cy="77" r="2" fill="#ffffff"/>
  <circle cx="167" cy="77" r="2" fill="#ffffff"/>
  <!-- Soft eyebrows - gently arched, not heavy -->
  <path d="M115,70 Q128,64 141,70" fill="none" stroke="#9d7246" stroke-width="4" stroke-linecap="round"/>
  <path d="M149,70 Q162,64 175,70" fill="none" stroke="#9d7246" stroke-width="4" stroke-linecap="round"/>
  <!-- Rosy cheeks, very soft -->
  <ellipse cx="110" cy="94" rx="12" ry="9" fill="#f4a4b2"/>
  <ellipse cx="180" cy="94" rx="12" ry="9" fill="#f4a4b2"/>
  <!-- Nose - delicate -->
  <ellipse cx="145" cy="96" rx="8" ry="6" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Very soft tender smile - gentle upward curve -->
  <path d="M124,112 Q145,126 166,112" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="130" y="131" width="30" height="16" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Body - soft pastel green top -->
  <path d="M100,148 Q92,198 102,220 L188,220 Q198,198 190,148 Q172,138 145,140 Q118,138 100,148Z" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Both arms gently extended, cradling -->
  <!-- Left arm curved forward gently -->
  <path d="M104,158 Q90,172 88,190" stroke="#eed5b6" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M104,158 Q90,172 88,190" stroke="#000000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Right arm curved forward gently -->
  <path d="M186,158 Q200,172 202,190" stroke="#eed5b6" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M186,158 Q200,172 202,190" stroke="#000000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Cupped hands together -->
  <path d="M78,192 Q88,186 100,188 Q112,186 122,192 Q122,206 100,210 Q78,206 78,192Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Small bird sitting in cupped hands -->
  <!-- Bird body -->
  <ellipse cx="100" cy="196" rx="14" ry="10" fill="#2a4ec0" stroke="#000000" stroke-width="4"/>
  <!-- Bird head -->
  <circle cx="114" cy="192" r="9" fill="#2a4ec0" stroke="#000000" stroke-width="4"/>
  <!-- Bird beak -->
  <polygon points="122,192 130,190 122,195" fill="#ff9900" stroke="#000000" stroke-width="2"/>
  <!-- Bird eye -->
  <circle cx="118" cy="190" r="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="119" cy="190" r="2" fill="#000000"/>
  <!-- Bird wing -->
  <path d="M92,196 Q96,188 104,192" fill="#90a7d6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Bird tail -->
  <path d="M86,198 Q78,194 80,202 Q76,206 82,204" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Small flower near other hand -->
  <circle cx="188" cy="196" r="6" fill="#f266aa" stroke="#000000" stroke-width="3"/>
  <circle cx="178" cy="190" r="5" fill="#f266aa" stroke="#000000" stroke-width="3"/>
  <circle cx="182" cy="200" r="5" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <circle cx="194" cy="190" r="5" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <circle cx="196" cy="200" r="5" fill="#f266aa" stroke="#000000" stroke-width="3"/>
  <circle cx="186" cy="194" r="5" fill="#fff200" stroke="#000000" stroke-width="3"/>
  <!-- Flower stem -->
  <line x1="186" y1="200" x2="186" y2="216" stroke="#529929" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="190" cy="210" rx="6" ry="4" fill="#529929" stroke="#000000" stroke-width="2" transform="rotate(30,190,210)"/>
