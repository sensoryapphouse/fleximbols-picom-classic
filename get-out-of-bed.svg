  <!-- FLOOR -->
  <rect x="10" y="214" width="270" height="10" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>

  <!-- BED - headboard left side -->
  <rect x="10" y="106" width="28" height="110" rx="6" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <!-- Bed frame / mattress -->
  <rect x="10" y="162" width="210" height="52" rx="8" fill="#efefef" stroke="#000000" stroke-width="5"/>
  <!-- Mattress surface detail -->
  <rect x="14" y="166" width="202" height="44" rx="6" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <!-- Pillow -->
  <rect x="20" y="152" width="72" height="36" rx="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <!-- BLANKET pulled back (person has pushed it aside) -->
  <!-- Blanket main mass still on bed but pushed to right -->
  <path d="M100 162 Q160 156 220 162 L220 214 L100 214 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Blanket fold/rumple edge -->
  <path d="M100 162 Q130 158 160 160 Q190 158 220 162" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Fold wrinkle lines -->
  <path d="M120 168 Q140 164 160 168" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M160 172 Q180 168 200 172" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- PERSON stepping out of bed -->
  <!-- ONE FOOT ON FLOOR (right foot, stepping out) -->
  <!-- Right leg down to floor -->
  <rect x="136" y="172" width="20" height="44" rx="5" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right foot on floor -->
  <path d="M132 214 Q136 210 156 210 L164 214 Q160 220 148 220 Q136 220 132 214 Z" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- LEFT LEG still on/over bed edge -->
  <path d="M110 162 Q108 180 112 196 L128 196 Q128 180 122 162 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left foot (dangling, just above floor level) -->
  <path d="M108 196 Q112 192 130 192 L136 196 Q134 204 122 206 Q110 204 108 196 Z" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Torso / upper body sitting up, leaning forward to get up -->
  <rect x="96" y="110" width="64" height="62" rx="10" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm pushing off bed (hand on mattress) -->
  <path d="M96 128 L68 150" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="62" cy="154" rx="12" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right arm forward (reaching/balance) -->
  <path d="M160 124 L188 108" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="192" cy="104" r="11" fill="#eed5b6" stroke="#000000" stroke-width="4"/>

  <!-- Neck -->
  <rect x="112" y="90" width="32" height="22" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- HEAD -->
  <ellipse cx="128" cy="68" rx="38" ry="38" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair - messy morning -->
  <ellipse cx="128" cy="38" rx="38" ry="14" fill="#7d5e23" stroke="#000000" stroke-width="5"/>
  <rect x="90" y="32" width="76" height="16" rx="8" fill="#7d5e23" stroke="#000000" stroke-width="5"/>
  <!-- Messy hair tuft -->
  <path d="M108 36 Q102 22 112 26" stroke="#7d5e23" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M146 38 Q152 24 144 28" stroke="#7d5e23" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Eyebrows (sleepy-effort) -->
  <path d="M108 58 Q120 52 130 57" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M126 57 Q138 52 150 58" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Eyes (half open - groggy) -->
  <ellipse cx="116" cy="68" rx="11" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="116" cy="70" rx="7" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Sleepy eyelid -->
  <path d="M105 68 Q116 60 127 68" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <ellipse cx="140" cy="68" rx="11" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="140" cy="70" rx="7" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <path d="M129 68 Q140 60 151 68" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Groggy neutral mouth -->
  <path d="M112 83 Q128 90 144 83" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <ellipse cx="102" cy="72" rx="9" ry="6" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="154" cy="72" rx="9" ry="6" fill="#f4a4b2" stroke="none"/>

  <!-- Motion arrow indicating getting up direction -->
  <path d="M224 148 L242 148 L242 138 L260 154 L242 170 L242 160 L224 160 Z" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
</svg>
