  <path d="M84,138 L88,138 L100,210 L80,210 Z" fill="#efefef" stroke="#7f7f7f" stroke-width="3" stroke-dasharray="5,4" stroke-linejoin="round"/>
  <!-- Ghost floating away (top right) -->
  <path d="M168,52 Q168,28 200,28 Q232,28 232,52 L232,114 Q232,118 228,118 Q224,118 222,114 L218,108 L214,116 Q212,120 208,118 L204,112 L200,118 Q196,120 194,116 L190,108 L186,116 Q182,120 178,114 L174,108 Q170,118 168,114 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Ghost eyes -->
  <ellipse cx="188" cy="58" rx="3.5" ry="5" fill="#000000"/>
  <ellipse cx="212" cy="58" rx="3.5" ry="5" fill="#000000"/>
