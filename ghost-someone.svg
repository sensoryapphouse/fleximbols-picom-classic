  <rect x="186" y="138" width="62" height="90" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="192" y="148" width="50" height="68" rx="2" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <circle cx="217" cy="222" r="3" fill="#7f7f7f" stroke="#000000" stroke-width="1.5"/>
