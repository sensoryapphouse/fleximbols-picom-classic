  <circle cx="130" cy="80" r="4" fill="#dff3fd" stroke="#7f7f7f" stroke-width="2"/>
  <circle cx="148" cy="68" r="5" fill="#dff3fd" stroke="#7f7f7f" stroke-width="2"/>
