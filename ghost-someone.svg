  <line x1="102" y1="86" x2="118" y2="124" stroke="#7f7f7f" stroke-width="6" stroke-dasharray="5,4" stroke-linecap="round"/>
  <!-- Hands dashed -->
  <circle cx="38" cy="128" r="6" fill="#efefef" stroke="#7f7f7f" stroke-width="2.5" stroke-dasharray="3,3"/>
  <circle cx="120" cy="128" r="6" fill="#efefef" stroke="#7f7f7f" stroke-width="2.5" stroke-dasharray="3,3"/>
