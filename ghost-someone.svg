  <path d="M236,156 L200,156 Q196,156 196,160 L196,176 Q196,180 200,180 L228,180 L236,186 L234,180 L236,180 Q240,180 240,176 L240,160 Q240,156 236,156 Z" fill="#529929" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
