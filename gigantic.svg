  <!-- Giant head -->
  <circle cx="145" cy="62" r="34" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Giant eyes -->
  <circle cx="134" cy="57" r="5" fill="#000000"/>
  <circle cx="156" cy="57" r="5" fill="#000000"/>
  <!-- Giant mouth -->
  <path d="M136 73 Q145 80 154 73" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Giant shirt -->
  <rect x="118" y="90" width="54" height="60" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Giant arms -->
  <rect x="88" y="93" width="30" height="18" rx="9" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="172" y="93" width="30" height="18" rx="9" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Giant legs -->
  <rect x="120" y="148" width="22" height="72" rx="8" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="148" y="148" width="22" height="72" rx="8" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
