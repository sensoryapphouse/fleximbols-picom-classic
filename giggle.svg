<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- giggle-modern: face hand over mouth, eyes happy, small bubbly laugh marks (light playful) -->
  <!-- Head (centered) -->
  <circle cx="130" cy="105" r="52" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair (modern style - side part) -->
  <path d="M 80 90 Q 82 48 130 45 Q 178 48 180 90 Q 168 62 130 62 Q 92 62 80 90 Z" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Hair side swoop detail -->
  <path d="M 80 90 Q 85 70 95 72" fill="none" stroke="#5e1f0a" stroke-width="8" stroke-linecap="round"/>
  <!-- Eyes: happy crescent / laughing eyes with little crinkles -->
  <!-- Left eye (happy arc) -->
  <path d="M 106 95 Q 116 83 126 95" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Left eye crinkle lines -->
  <line x1="107" y1="92" x2="102" y2="85" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="124" y1="92" x2="128" y2="85" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right eye (happy arc) -->
  <path d="M 134 95 Q 144 83 154 95" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Right eye crinkle lines -->
  <line x1="135" y1="92" x2="130" y2="85" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="152" y1="92" x2="157" y2="85" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <ellipse cx="104" cy="116" rx="14" ry="9" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="156" cy="116" rx="14" ry="9" fill="#f4a4b2" stroke="none"/>
  <!-- Hand over mouth (right hand covering mouth/giggle) -->
  <ellipse cx="140" cy="130" rx="30" ry="20" fill="#e6b98a" stroke="#000000" stroke-width="4" transform="rotate(-8,140,130)"/>
  <!-- Finger lines on hand -->
  <path d="M 116 122 Q 115 112 120 108" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 125 118 Q 124 107 128 103" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 134 116 Q 134 105 138 101" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 143 116 Q 145 106 148 103" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 152 118 Q 155 110 158 108" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Laughing mouth peeking behind hand (hint of smile) -->
  <path d="M 118 133 Q 130 142 150 133" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="118" y="155" width="24" height="20" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <path d="M 65 235 L 80 175 Q 130 164 180 175 L 195 235 Z" fill="#f266aa" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Small bubbly laugh marks (circles/bubbles near mouth, upper right) -->
  <circle cx="192" cy="88" r="12" fill="#f7de58" stroke="#000000" stroke-width="4"/>
  <circle cx="210" cy="72" r="10" fill="#fff200" stroke="#000000" stroke-width="3"/>
  <circle cx="228" cy="58" r="7" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <circle cx="240" cy="80" r="8" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- Small star sparkles on bubbles (playful) -->
  <line x1="192" y1="82" x2="192" y2="78" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="189" y1="84" x2="185" y2="81" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="195" y1="84" x2="199" y2="81" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Musical note-like squiggles inside bigger bubble -->
  <circle cx="210" cy="72" r="4" fill="#000000"/>
  <path d="M 214 72 L 214 64" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 214 64 L 220 62" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
</svg>
