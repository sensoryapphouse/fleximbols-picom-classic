  <!-- Bust: face with eyes darting sideways, quick curved motion arrow -->
  <!-- Shoulders -->
  <path d="M 62,215 Q 62,188 86,180 L 204,180 Q 228,188 228,215 L 228,235 L 62,235 Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="126" y="162" width="38" height="22" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="145" cy="106" rx="55" ry="58" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M 92,92 Q 96,52 145,52 Q 194,52 198,92" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Eyes DARTING SIDEWAYS to the right — both pupils shifted hard right -->
  <!-- Left eye -->
  <ellipse cx="118" cy="102" rx="16" ry="11" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="128" cy="102" r="7" fill="#1d0e82"/>
  <circle cx="126" cy="100" r="2" fill="#ffffff"/>
  <!-- Right eye -->
  <ellipse cx="172" cy="102" rx="16" ry="11" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="182" cy="102" r="7" fill="#1d0e82"/>
  <circle cx="180" cy="100" r="2" fill="#ffffff"/>
  <!-- Eyebrows raised slightly (quick look reaction) -->
  <path d="M 102,88 Q 118,83 134,88" fill="none" stroke="#4d4d4d" stroke-width="4" stroke-linecap="round"/>
  <path d="M 156,88 Q 172,83 188,88" fill="none" stroke="#4d4d4d" stroke-width="4" stroke-linecap="round"/>
  <!-- Neutral / slightly open mouth -->
  <path d="M 128,128 Q 145,136 162,128" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Short curved motion arrow showing quick sideways glance (from centre toward right) -->
  <!-- Arrow arc: curving rightward from just right of face -->
  <path d="M 188,95 Q 220,88 240,102" fill="none" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <!-- Arrowhead pointing right/down along arc -->
  <polygon points="240,102 226,96 232,110" fill="#f8130d" stroke="#f8130d" stroke-width="2" stroke-linejoin="round"/>
  <!-- Speed lines from pupils to the right -->
  <line x1="188" y1="100" x2="215" y2="100" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,3"/>
  <line x1="188" y1="106" x2="210" y2="110" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,3"/>
</svg>
