  <!-- Neck -->
  <rect x="125" y="158" width="40" height="26" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shoulders/torso -->
  <path d="M55 240 Q55 195 75 185 Q110 175 145 175 Q180 175 215 185 Q235 195 235 240 Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="145" cy="112" rx="70" ry="70" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Raised eyebrows (arched high) -->
  <path d="M108 80 Q125 68 138 78" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M152 78 Q165 68 182 80" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Mischievous wide grin showing teeth -->
  <path d="M100 130 Q145 168 190 130" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Teeth row -->
  <rect x="112" y="130" width="18" height="12" rx="2" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="131" y="130" width="18" height="12" rx="2" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="150" y="130" width="18" height="12" rx="2" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Eyes open wide -->
  <ellipse cx="120" cy="100" rx="11" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="120" cy="101" rx="6" ry="6" fill="#4d4d4d" stroke="none"/>
  <ellipse cx="170" cy="100" rx="11" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="170" cy="101" rx="6" ry="6" fill="#4d4d4d" stroke="none"/>
  <!-- Hands rubbing together -->
  <ellipse cx="72" cy="200" rx="22" ry="14" fill="#eed5b6" stroke="#000000" stroke-width="4" transform="rotate(-30 72 200)"/>
  <ellipse cx="96" cy="210" rx="22" ry="14" fill="#eed5b6" stroke="#000000" stroke-width="4" transform="rotate(20 96 210)"/>
  <!-- Motion lines between hands -->
  <line x1="82" y1="196" x2="90" y2="206" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="88" y1="192" x2="96" y2="202" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
