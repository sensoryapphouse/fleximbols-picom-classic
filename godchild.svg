  <!-- GODCHILD (foreground) + adoring godparent FULL BODY + heart + ceremony cross -->
  <!-- ground -->
  <ellipse cx="145" cy="232" rx="100" ry="5" fill="#dff3fd" stroke="#000000" stroke-width="2"/>

  <!-- GODPARENT (left, taller, full body) -->
  <!-- legs -->
  <path d="M52 150 L46 222 L66 222 L68 150 Z" fill="#7c3fac" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M82 150 L84 222 L100 222 L96 150 Z" fill="#7c3fac" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- shoes -->
  <ellipse cx="56" cy="224" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="92" cy="224" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- robe top -->
  <path d="M46 96 L42 152 L102 152 L100 96 Q74 86 46 96 Z" fill="#7c3fac" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- neck -->
  <rect x="68" y="78" width="12" height="14" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="74" cy="62" rx="17" ry="18" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- hair -->
  <path d="M57 60 Q57 42 74 40 Q91 42 91 60 Q88 48 74 46 Q60 48 57 60 Z" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="69" cy="63" r="2" fill="#000000"/>
  <circle cx="79" cy="63" r="2" fill="#000000"/>
  <!-- adoring smile -->
  <path d="M68 70 Q74 74 80 70" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round"/>
  <!-- arm reaching toward godchild -->
  <path d="M102 110 L138 130 L134 138 L100 122 Z" fill="#7c3fac" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- other arm down -->
  <path d="M46 110 L34 162 L44 166 L54 122 Z" fill="#7c3fac" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- GODCHILD (right, smaller child, full body) -->
  <!-- legs -->
  <path d="M178 168 L172 222 L188 222 L188 168 Z" fill="#2a4ec0" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M204 168 L204 222 L220 222 L214 168 Z" fill="#2a4ec0" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- shoes -->
  <ellipse cx="180" cy="224" rx="8" ry="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <ellipse cx="212" cy="224" rx="8" ry="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- white christening / formal outfit -->
  <path d="M172 122 L168 170 L222 170 L218 122 Q196 114 172 122 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- neck -->
  <rect x="190" y="108" width="10" height="12" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="195" cy="94" rx="15" ry="16" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- hair -->
  <path d="M180 92 Q180 76 195 74 Q210 76 210 92 Q207 82 195 80 Q183 82 180 92 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- eyes (looking up adoring) -->
  <circle cx="189" cy="95" r="2" fill="#000000"/>
  <circle cx="201" cy="95" r="2" fill="#000000"/>
  <!-- smile -->
  <path d="M189 101 Q195 104 201 101" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- cheeks rosy -->
  <circle cx="183" cy="100" r="2.5" fill="#f4a4b2" stroke="#000000" stroke-width="1.2"/>
  <circle cx="207" cy="100" r="2.5" fill="#f4a4b2" stroke="#000000" stroke-width="1.2"/>
  <!-- arm up reaching godparent -->
  <path d="M172 130 L138 132 L140 140 L174 140 Z" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- other arm down -->
  <path d="M222 130 L234 168 L226 172 L216 138 Z" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- HEART between them -->
  <path d="M124 50 C124 42 134 42 134 50 C134 42 144 42 144 50 C144 60 134 70 134 70 C134 70 124 60 124 50 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- ceremony CROSS top right (ceremony marker) -->
  <rect x="246" y="20" width="6" height="28" fill="#f2e40d" stroke="#000000" stroke-width="2.5"/>
  <rect x="238" y="28" width="22" height="6" fill="#f2e40d" stroke="#000000" stroke-width="2.5"/>

  <!-- sparkle -->
  <path d="M20 100 L24 92 L28 100 L36 98 L30 104 L34 112 L26 110 L20 116 L18 108 L12 104 Z" fill="#fff200" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
</svg>
