  <!-- Goofy: clumsy big-grin, buck teeth, wonky posture, trip/wobble -->
  <!-- Head slightly tilted (clumsy lean) -->
  <ellipse cx="148" cy="95" rx="46" ry="50" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round" transform="rotate(-8,148,95)"/>
  <!-- Hair - messy -->
  <ellipse cx="148" cy="56" rx="46" ry="18" fill="#7d5e23" stroke="#000000" stroke-width="5" transform="rotate(-8,148,56)"/>
  <path d="M102,62 Q98,50 106,44" fill="none" stroke="#7d5e23" stroke-width="8" stroke-linecap="round"/>
  <path d="M115,52 Q110,38 120,34" fill="none" stroke="#7d5e23" stroke-width="8" stroke-linecap="round"/>
  <path d="M130,46 Q128,32 138,28" fill="none" stroke="#7d5e23" stroke-width="8" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="102" cy="92" rx="13" ry="17" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <ellipse cx="196" cy="88" rx="13" ry="17" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Wide goofy eyes - one higher than other (wonky) -->
  <circle cx="130" cy="86" r="14" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="164" cy="80" r="13" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="131" cy="88" r="8" fill="#9d7246"/>
  <circle cx="165" cy="82" r="7" fill="#9d7246"/>
  <circle cx="133" cy="89" r="5" fill="#000000"/>
  <circle cx="167" cy="83" r="5" fill="#000000"/>
  <!-- Light dots in eyes -->
  <circle cx="138" cy="84" r="3" fill="#ffffff"/>
  <circle cx="172" cy="78" r="3" fill="#ffffff"/>
  <!-- Nose - large bulbous -->
  <ellipse cx="148" cy="104" rx="12" ry="10" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Big goofy grin -->
  <path d="M114,120 Q148,148 182,120" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Buck teeth - big protruding -->
  <rect x="134" y="120" width="14" height="18" rx="3" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <rect x="150" y="120" width="14" height="18" rx="3" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Bottom of mouth -->
  <path d="M114,120 Q148,122 182,120" fill="#000000" stroke="none"/>
  <!-- Neck -->
  <rect x="132" y="143" width="30" height="18" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Body - wonky/off-balance posture -->
  <path d="M98,162 Q88,210 100,228 L190,228 Q202,210 196,162 Q176,150 145,152 Q118,150 98,162Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round" transform="rotate(5,145,190)"/>
  <!-- Left arm - flailing out -->
  <line x1="100" y1="172" x2="56" y2="152" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <line x1="56" y1="152" x2="38" y2="168" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <line x1="100" y1="172" x2="38" y2="168" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Right arm - other direction -->
  <line x1="190" y1="170" x2="238" y2="158" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <line x1="238" y1="158" x2="254" y2="145" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <line x1="190" y1="170" x2="254" y2="145" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Feet - one tripping on ledge -->
  <ellipse cx="118" cy="232" rx="22" ry="10" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <ellipse cx="172" cy="230" rx="22" ry="10" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Trip bump/wobble lines -->
  <path d="M56,220 Q60,212 68,220 Q72,212 80,220" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Motion wobble arcs around head -->
  <path d="M195,72 Q204,82 196,94" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M202,68 Q214,80 204,95" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
