  <!-- Palm of hand -->
  <ellipse cx="145" cy="148" rx="62" ry="66" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Thumb -->
  <ellipse cx="83" cy="132" rx="18" ry="30" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-20 83 132)"/>
  <!-- Index finger -->
  <rect x="100" y="58" width="26" height="68" rx="13" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Middle finger -->
  <rect x="132" y="48" width="26" height="76" rx="13" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ring finger -->
  <rect x="164" y="54" width="24" height="72" rx="12" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Little finger -->
  <rect x="192" y="72" width="20" height="60" rx="10" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Grime patches — dark grey-brown smears on palm -->
  <ellipse cx="130" cy="150" rx="28" ry="18" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="165" cy="165" rx="20" ry="13" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="110" cy="172" rx="14" ry="10" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Grime smudge on index finger -->
  <ellipse cx="113" cy="88" rx="9" ry="16" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Grime smudge on middle finger -->
  <ellipse cx="145" cy="72" rx="8" ry="14" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Smudge streak across knuckle area -->
  <path d="M96,124 Q145,116 208,124" fill="none" stroke="#4d4d4d" stroke-width="8" stroke-linecap="round"/>
  <!-- Small grime dots -->
  <circle cx="170" cy="140" r="5" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <circle cx="152" cy="180" r="4" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <circle cx="120" cy="164" r="4" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
