  <path d="M110 196 Q102 200 96 198" fill="none" stroke="#5e1f0a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M180 196 Q188 200 194 198" fill="none" stroke="#5e1f0a" stroke-width="2.5" stroke-linecap="round"/>
