  <!-- GROWTH-MARKETER: person with hockey-stick growth curve + funnel + A/B split arrows -->
  <!-- Graph area -->
  <rect x="26" y="46" width="150" height="110" rx="6" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Graph axes -->
  <line x1="44" y1="148" x2="44" y2="60" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="44" y1="148" x2="168" y2="148" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Hockey stick curve: flat then sharp upward -->
  <polyline points="44,142 70,140 90,136 104,130 116,116 128,96 140,72 152,52" fill="none" stroke="#f8130d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow at top of curve -->
  <polygon points="152,44 160,54 144,54" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Funnel (right side) -->
  <polygon points="196,56 256,56 238,90 214,90" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="214" y="90" width="24" height="12" rx="2" fill="#f2e40d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="218" y="102" width="16" height="12" rx="3" fill="#fff200" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="221" y="114" width="10" height="10" rx="2" fill="#f2e40d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- A/B split arrows below funnel -->
  <!-- A branch -->
  <line x1="226" y1="124" x2="208" y2="146" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <polygon points="200,148 212,140 210,154" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="192" y="148" width="22" height="16" rx="4" fill="#529929" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- B branch -->
  <line x1="226" y1="124" x2="244" y2="146" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <polygon points="252,148 240,140 242,154" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="242" y="148" width="22" height="16" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Person: legs -->
  <line x1="188" y1="200" x2="182" y2="222" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="208" y1="200" x2="210" y2="222" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="180" cy="224" rx="9" ry="4" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <ellipse cx="210" cy="224" rx="9" ry="4" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Person: torso -->
  <rect x="184" y="162" width="30" height="38" rx="5" fill="#ff9900" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Person: left arm pointing at graph curve -->
  <line x1="184" y1="172" x2="162" y2="156" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="160" cy="154" r="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Person: right arm -->
  <line x1="214" y1="172" x2="230" y2="164" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="232" cy="162" r="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Person: neck -->
  <rect x="194" y="153" width="10" height="10" rx="2" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Person: head -->
  <circle cx="199" cy="142" r="14" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M185 138 Q199 125 213 138" fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
</svg>
