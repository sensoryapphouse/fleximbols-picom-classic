  <!-- Left arm crossing right -->
  <path d="M95 185 Q120 195 165 188" fill="none" stroke="#eed5b6" stroke-width="18" stroke-linecap="round"/>
  <!-- Right arm crossing left (on top) -->
  <path d="M195 185 Q170 198 115 190" fill="none" stroke="#eed5b6" stroke-width="18" stroke-linecap="round"/>
  <!-- Arms outline -->
  <path d="M95 185 Q120 195 165 188" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M195 185 Q170 198 115 190" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Eyes - annoyed, downturned brows -->
  <ellipse cx="122" cy="88" rx="11" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="122" cy="89" rx="5" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="168" cy="88" rx="11" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="168" cy="89" rx="5" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- Angry/annoyed brows pointing down in middle -->
  <path d="M110 74 Q122 80 132 72" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M158 72 Q168 80 180 74" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Nose -->
  <ellipse cx="144" cy="103" rx="9" ry="7" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
