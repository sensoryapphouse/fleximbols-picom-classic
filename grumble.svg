  <!-- Body with crossed arms -->
  <path d="M95 178 Q100 165 122 162 L168 162 Q190 165 195 178 L200 220 Q172 228 145 230 Q118 228 90 220 Z" fill="#d01424" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
