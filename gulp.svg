  <!-- Bust: face swallowing big mouthful, throat bulge, wide-open mouth -->
  <!-- Shoulders bust -->
  <path d="M58 178 Q58 150 80 140 L128 126 L162 126 L210 140 Q232 150 232 178 L232 240 L58 240 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Neck with prominent bulge (swallow) -->
  <path d="M130 118 Q118 132 120 148 Q122 160 130 162 L160 162 Q168 160 170 148 Q172 132 160 118 Z" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Throat bulge — prominent lump on neck left side -->
  <ellipse cx="125" cy="148" rx="14" ry="12" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- Head -->
  <ellipse cx="145" cy="72" rx="55" ry="56" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair short -->
  <path d="M92 60 Q95 18 145 14 Q195 18 198 60 Q186 34 145 30 Q104 34 92 60 Z" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Eyes wide, looking up slightly -->
  <ellipse cx="124" cy="62" rx="9" ry="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="166" cy="62" rx="9" ry="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="125" cy="63" r="5" fill="#1d0e82"/>
  <circle cx="167" cy="63" r="5" fill="#1d0e82"/>
  <!-- Brows raised in effort of swallowing -->
  <path d="M115 50 Q124 44 133 49" fill="none" stroke="#7d5e23" stroke-width="4" stroke-linecap="round"/>
  <path d="M157 49 Q166 43 175 50" fill="none" stroke="#7d5e23" stroke-width="4" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M141 74 Q138 80 141 85 Q145 87 149 85 Q152 80 149 74" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wide-open mouth ready to swallow, full cheeks -->
  <path d="M118 98 Q120 92 145 90 Q170 92 172 98 Q165 118 145 120 Q125 118 118 98 Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Tongue -->
  <ellipse cx="145" cy="112" rx="18" ry="7" fill="#d01424" stroke="#000000" stroke-width="3"/>
  <!-- Upper teeth row -->
  <path d="M122 98 L128 104 L136 98 L144 104 L152 98 L160 104 L168 98" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <!-- Cheeks puffed full of liquid -->
  <ellipse cx="108" cy="98" rx="16" ry="12" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <ellipse cx="182" cy="98" rx="16" ry="12" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- Hands at chin (holding cup tilted) -->
  <path d="M80 145 Q58 125 48 105" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round"/>
  <path d="M80 145 Q58 125 48 105" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Cup tilted -->
  <path d="M30 88 L22 118 Q22 124 28 124 L60 124 Q66 124 66 118 L58 88 Z" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="20" y="83" width="48" height="10" rx="4" fill="#90a7d6" stroke="#000000" stroke-width="4"/>
  <!-- Liquid pour from cup to mouth (motion line) -->
  <path d="M44 102 Q80 100 112 100" fill="none" stroke="#90a7d6" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 3"/>
  <!-- Downward swallow motion arrow on neck -->
  <path d="M140 132 L140 155" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <polygon points="140,160 136,152 144,152" fill="#000000"/>
</svg>
