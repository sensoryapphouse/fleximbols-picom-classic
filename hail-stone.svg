  <!-- Single large isolated hailstone specimen, centred, filling canvas -->
  <!-- Outer shell - largest ring, icy blue-white -->
  <circle cx="145" cy="120" r="90" fill="#dff3fd" stroke="#000000" stroke-width="5"/>
  <!-- Concentric icy layer 1 -->
  <circle cx="145" cy="120" r="74" fill="#ffffff" stroke="#90a7d6" stroke-width="3"/>
  <!-- Concentric icy layer 2 -->
  <circle cx="145" cy="120" r="58" fill="#dff3fd" stroke="#90a7d6" stroke-width="3"/>
  <!-- Concentric icy layer 3 -->
  <circle cx="145" cy="120" r="42" fill="#ffffff" stroke="#90a7d6" stroke-width="2"/>
  <!-- Concentric icy layer 4 -->
  <circle cx="145" cy="120" r="28" fill="#dff3fd" stroke="#90a7d6" stroke-width="2"/>
  <!-- Core - darker grey -->
  <circle cx="145" cy="120" r="14" fill="#b8b8b8" stroke="#7f7f7f" stroke-width="2"/>
  <!-- Specular highlight (top-left glint - white sheen of ice) -->
  <ellipse cx="112" cy="88" rx="18" ry="10" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
  <!-- Smaller secondary glint -->
  <ellipse cx="100" cy="100" rx="8" ry="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
  <!-- Radial crack lines radiating outward (icy texture) -->
  <line x1="145" y1="30" x2="145" y2="55" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="185" x2="145" y2="210" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="120" x2="80" y2="120" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="210" y1="120" x2="235" y2="120" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="81" y1="56" x2="98" y2="73" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="209" y1="56" x2="192" y2="73" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="81" y1="184" x2="98" y2="167" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="209" y1="184" x2="192" y2="167" stroke="#90a7d6" stroke-width="2" stroke-linecap="round"/>
</svg>
