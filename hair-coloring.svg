  <!-- Client head in profile (left), getting colour applied -->
  <!-- shoulders -->
  <path d="M 30 220 Q 30 180 60 175 L 130 175 Q 145 195 130 220 Z" fill="#90a7d6" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- neck -->
  <rect x="75" y="155" width="30" height="25" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- head -->
  <ellipse cx="90" cy="115" rx="42" ry="48" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair on head -->
  <path d="M 50 105 Q 48 60 90 55 Q 132 60 130 105 L 130 130 Q 110 120 90 125 Q 70 120 50 130 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ear hint -->
  <path d="M 128 110 Q 138 112 138 120 Q 138 128 128 130" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- FOILS (foil packets in hair) -->
  <rect x="55" y="60" width="14" height="40" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <rect x="80" y="50" width="14" height="40" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <rect x="105" y="60" width="14" height="40" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <!-- foil crinkle lines -->
  <path d="M 58 70 L 66 70 M 58 80 L 66 80 M 58 90 L 66 90" stroke="#000000" stroke-width="1.5"/>
  <path d="M 83 60 L 91 60 M 83 70 L 91 70 M 83 80 L 91 80" stroke="#000000" stroke-width="1.5"/>
  <path d="M 108 70 L 116 70 M 108 80 L 116 80 M 108 90 L 116 90" stroke="#000000" stroke-width="1.5"/>
  <!-- Hairdresser's HAND + BRUSH on right applying colour -->
  <!-- arm sleeve -->
  <path d="M 285 60 L 285 95 L 230 110 L 220 90 Z" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- hand -->
  <ellipse cx="215" cy="105" rx="22" ry="16" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- brush handle -->
  <rect x="160" y="105" width="55" height="10" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- brush head -->
  <path d="M 140 100 L 165 100 L 165 120 L 140 120 L 132 110 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- bristle hint -->
  <path d="M 135 105 L 142 105 M 135 110 L 142 110 M 135 115 L 142 115" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- colour drop falling -->
  <path d="M 135 125 Q 132 135 134 142 Q 138 146 140 142 Q 142 135 138 125 Z" fill="#7c3fac" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
</svg>
