  <!-- staff lines -->
  <line x1="30" y1="80" x2="260" y2="80" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="105" x2="260" y2="105" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="130" x2="260" y2="130" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="155" x2="260" y2="155" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="180" x2="260" y2="180" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- stem rising from the right side of the head -->
  <rect x="170" y="40" width="6" height="135" fill="#000000" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- hollow tilted oval note head -->
  <ellipse cx="135" cy="170" rx="38" ry="22" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-22 135 170)"/>
  <!-- inner hole to show hollow head -->
  <ellipse cx="135" cy="170" rx="22" ry="8" fill="#efefef" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-22 135 170)"/>
