  <!-- FULL BODY sister figure (left) -->
  <!-- head -->
  <circle cx="75" cy="52" r="22" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- long hair -->
  <path d="M53,52 Q53,30 75,28 Q97,30 97,52 L100,90 L92,72 L92,52 Q92,40 75,38 Q58,40 58,52 L58,72 L50,90 Z" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="68" cy="52" r="2.5" fill="#000000"/>
  <circle cx="82" cy="52" r="2.5" fill="#000000"/>
  <!-- smile -->
  <path d="M68,60 Q75,65 82,60" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dress (triangle) -->
  <path d="M55,76 L95,76 L115,165 L35,165 Z" fill="#f266aa" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- arms -->
  <line x1="55" y1="86" x2="28" y2="125" stroke="#eed5b6" stroke-width="11" stroke-linecap="round"/>
  <line x1="55" y1="86" x2="28" y2="125" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="95" y1="86" x2="122" y2="125" stroke="#eed5b6" stroke-width="11" stroke-linecap="round"/>
  <line x1="95" y1="86" x2="122" y2="125" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- legs -->
  <rect x="55" y="165" width="14" height="42" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <rect x="81" y="165" width="14" height="42" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- shoes -->
  <ellipse cx="62" cy="212" rx="10" ry="5" fill="#f8130d" stroke="#000000" stroke-width="4"/>
  <ellipse cx="88" cy="212" rx="10" ry="5" fill="#f8130d" stroke="#000000" stroke-width="4"/>

  <!-- Family graph showing shared parent (half relation) -->
  <!-- Shared parent (yellow, highlighted) -->
  <circle cx="220" cy="38" r="16" fill="#fff200" stroke="#000000" stroke-width="5"/>
  <!-- "half-shaded" left side of shared parent (right half darkened to show one parent shared) -->
  <path d="M220,22 A16,16 0 0,1 220,54 Z" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- Other parent A (left, dad of sister) -->
  <circle cx="175" cy="38" r="11" fill="#dff3fd" stroke="#000000" stroke-width="4"/>
  <!-- Other parent B (right, dad of half-sib) -->
  <circle cx="265" cy="38" r="11" fill="#90a7d6" stroke="#000000" stroke-width="4"/>
  <!-- couple lines -->
  <line x1="186" y1="38" x2="204" y2="38" stroke="#000000" stroke-width="3"/>
  <line x1="236" y1="38" x2="254" y2="38" stroke="#000000" stroke-width="3"/>
  <!-- child connectors -->
  <line x1="195" y1="48" x2="195" y2="100" stroke="#000000" stroke-width="3"/>
  <line x1="245" y1="48" x2="245" y2="100" stroke="#000000" stroke-width="3"/>
  <!-- child nodes -->
  <circle cx="195" cy="115" r="14" fill="#f266aa" stroke="#000000" stroke-width="4"/>
  <circle cx="245" cy="115" r="14" fill="#f266aa" stroke="#000000" stroke-width="4"/>
  <!-- HALF indicator: divided circle big at bottom right -->
  <circle cx="220" cy="180" r="32" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <!-- right half filled (the "half" visual cue) -->
  <path d="M220,148 A32,32 0 0,1 220,212 Z" fill="#f266aa" stroke="#000000" stroke-width="4"/>
  <!-- vertical divider line -->
  <line x1="220" y1="148" x2="220" y2="212" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- small "=1/2" hint via slash -->
  <line x1="208" y1="200" x2="232" y2="160" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
