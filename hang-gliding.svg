  <!-- Main sail surface -->
  <polygon points="145,38 22,155 268,155" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Wing keel (spine from nose to tail) -->
  <line x1="145" y1="38" x2="145" y2="155" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Leading edge left -->
  <line x1="145" y1="38" x2="22" y2="155" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Leading edge right -->
  <line x1="145" y1="38" x2="268" y2="155" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Cross-bar (control frame horizontal bar) -->
  <line x1="90" y1="130" x2="200" y2="130" stroke="#4d4d4d" stroke-width="6" stroke-linecap="round"/>
  <!-- Control frame uprights to pilot hang point -->
  <line x1="90" y1="130" x2="145" y2="108" stroke="#4d4d4d" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="130" x2="145" y2="108" stroke="#4d4d4d" stroke-width="5" stroke-linecap="round"/>
  <!-- Wing sail inner panel line -->
  <line x1="145" y1="38" x2="90" y2="130" stroke="#d01424" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="38" x2="200" y2="130" stroke="#d01424" stroke-width="2" stroke-linecap="round"/>
  <!-- Hang strap from frame to pilot -->
  <line x1="145" y1="108" x2="145" y2="163" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Pilot — prone, hanging below frame -->
  <!-- Harness/body bag -->
