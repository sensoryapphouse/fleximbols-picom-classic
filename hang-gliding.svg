  <!-- Head -->
  <ellipse cx="145" cy="149" rx="13" ry="13" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Helmet -->
  <path d="M132 145 Q145 132 158 145" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arms gripping control bar -->
  <line x1="128" y1="166" x2="90" y2="132" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
