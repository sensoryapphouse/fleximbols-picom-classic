<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Harsh: stern severe scowl, rigid jabbing, jagged hard lines, cold grey tones -->
  <!-- Hard jagged background lines (impersonal severity) -->
  <polyline points="20,30 40,20 35,40 55,28 50,50" fill="none" stroke="#b8b8b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="240,22 258,12 252,34 272,20 265,44" fill="none" stroke="#b8b8b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head - stern, cold, angular feel via strong brow -->
  <ellipse cx="145" cy="100" rx="46" ry="50" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair - rigid flat dark grey -->
  <rect x="100" y="54" width="90" height="28" rx="0" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>
  <!-- Side hair flat cut -->
  <rect x="99" y="54" width="16" height="46" rx="0" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>
  <rect x="175" y="54" width="16" height="46" rx="0" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>
  <!-- Severe straight-line eyebrows - absolutely flat, heavy, no curve -->
  <rect x="100" y="80" width="40" height="8" rx="0" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <rect x="150" y="80" width="40" height="8" rx="0" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Deep V furrow between brows -->
  <polygon points="138,88 145,96 152,88" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Stern cold eyes - narrow rectangular, heavy lids, grey iris -->
  <rect x="102" y="92" width="38" height="18" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <rect x="150" y="92" width="38" height="18" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Grey cold irises -->
  <rect x="113" y="95" width="16" height="12" rx="2" fill="#b8b8b8"/>
  <rect x="161" y="95" width="16" height="12" rx="2" fill="#b8b8b8"/>
  <rect x="117" y="97" width="8" height="8" rx="1" fill="#4d4d4d"/>
  <rect x="165" y="97" width="8" height="8" rx="1" fill="#4d4d4d"/>
  <!-- Heavy upper lids - not squinting, just flat and hard -->
  <rect x="102" y="92" width="38" height="7" rx="2" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <rect x="150" y="92" width="38" height="7" rx="2" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Nose - straight, strong -->
  <line x1="145" y1="112" x2="145" y2="125" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="135" y1="125" x2="155" y2="125" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Stern straight-line mouth - no curve at all, pressed thin -->
  <line x1="118" y1="138" x2="172" y2="138" stroke="#000000" stroke-width="6" stroke-linecap="butt"/>
  <!-- Mouth corner downturns - rigid -->
  <line x1="118" y1="138" x2="112" y2="146" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="172" y1="138" x2="178" y2="146" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="128" y="149" width="34" height="16" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Body - cold grey rigid upright -->
  <rect x="100" y="164" width="90" height="62" rx="0" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- Rigid collar / uniform -->
  <polygon points="145,164 132,178 145,174 158,178" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Right arm rigid, jabbing outward hard -->
  <line x1="190" y1="170" x2="252" y2="155" stroke="#eed5b6" stroke-width="12" stroke-linecap="square"/>
  <line x1="190" y1="170" x2="252" y2="155" stroke="#000000" stroke-width="4" stroke-linecap="square"/>
  <!-- Jabbing finger - sharp pointed -->
  <polygon points="252,148 266,152 252,162 250,158 260,152 250,147" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left arm stiffly to side -->
  <line x1="100" y1="174" x2="68" y2="185" stroke="#eed5b6" stroke-width="12" stroke-linecap="square"/>
  <line x1="100" y1="174" x2="68" y2="185" stroke="#000000" stroke-width="4" stroke-linecap="square"/>
  <rect x="52" y="183" width="18" height="12" rx="0" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Jagged hard lines radiating from jab -->
  <line x1="258" y1="144" x2="272" y2="134" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="262" y1="152" x2="278" y2="148" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="260" y1="160" x2="276" y2="162" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Angular severity marks (like bang/impact lines) - cold and impersonal -->
  <polyline points="22,180 34,172 30,184 42,176" fill="none" stroke="#7f7f7f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="246,200 258,192 254,204 266,196" fill="none" stroke="#7f7f7f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
