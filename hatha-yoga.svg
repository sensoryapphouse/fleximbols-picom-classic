  <!-- Yin-yang symbol top-right (drawn as paths, no text) -->
  <!-- Outer circle -->
  <circle cx="248" cy="38" r="26" fill="none" stroke="#000000" stroke-width="3"/>
  <!-- White half (top) -->
  <path d="M 248,12 A 26,26 0 0 1 248,64 A 13,13 0 0 1 248,38 A 13,13 0 0 0 248,12 Z" fill="#ffffff" stroke="none"/>
  <!-- Black half (bottom) -->
  <path d="M 248,12 A 26,26 0 0 0 248,64 A 13,13 0 0 0 248,38 A 13,13 0 0 1 248,12 Z" fill="#000000" stroke="none"/>
  <!-- Small dots -->
  <circle cx="248" cy="25" r="5" fill="#000000"/>
  <circle cx="248" cy="51" r="5" fill="#ffffff"/>
  <!-- Outer ring re-stroke -->
  <circle cx="248" cy="38" r="26" fill="none" stroke="#000000" stroke-width="3"/>
  <!-- Floor line -->
  <path d="M 30,218 L 260,218" stroke="#000000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Mat -->
  <rect x="55" y="210" width="180" height="10" rx="5" fill="#3aa6a0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Tree pose / Vrikshasana: single balanced standing pose -->
  <!-- Standing left leg straight -->
  <path d="M 140,158 L 134,210" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <ellipse cx="132" cy="212" rx="12" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right leg bent, foot against left inner thigh -->
  <path d="M 150,158 Q 168,165 172,185 Q 175,200 162,207 Q 152,210 148,200 Q 143,188 152,178 Z" fill="#529929" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="163" cy="205" rx="10" ry="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Torso upright still -->
  <path d="M 130,95 Q 130,90 145,88 Q 160,90 160,95 L 158,158 L 132,158 Z" fill="#529929" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Arms in prayer at chest (namasté) -->
  <path d="M 132,112 Q 118,120 110,128" stroke="#000000" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="108" cy="131" r="8" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <path d="M 158,112 Q 172,120 180,128" stroke="#000000" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="182" cy="131" r="8" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Prayer hands meeting arc -->
  <path d="M 108,131 Q 145,118 182,131" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="145" cy="68" r="22" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Hair bun -->
  <path d="M 125,64 Q 127,48 145,48 Q 163,48 165,64 Q 156,54 145,55 Q 134,54 125,64 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="145" cy="48" r="8" fill="#5e1f0a" stroke="#000000" stroke-width="2.5"/>
  <!-- Eyes closed, calm -->
  <path d="M 136,68 Q 138,66 140,68" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 150,68 Q 152,66 154,68" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Gentle smile -->
  <path d="M 138,78 Q 145,84 152,78" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
