<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <clipPath id="hi-clip">
      <rect x="22" y="18" width="246" height="174" rx="28" ry="28"/>
    </clipPath>
  </defs>
  <!-- 8 horizontal stripes: alternating white and red (Hawaii flag body) -->
  <rect x="22" y="18" width="246" height="174" rx="28" ry="28" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Stripes: 8 rows each ~21.75px -->
  <rect x="22" y="40" width="246" height="22" fill="#d01424" clip-path="url(#hi-clip)"/>
  <rect x="22" y="62" width="246" height="22" fill="#ffffff" clip-path="url(#hi-clip)"/>
  <rect x="22" y="84" width="246" height="22" fill="#1d0e82" clip-path="url(#hi-clip)"/>
  <rect x="22" y="106" width="246" height="22" fill="#ffffff" clip-path="url(#hi-clip)"/>
  <rect x="22" y="128" width="246" height="22" fill="#d01424" clip-path="url(#hi-clip)"/>
  <rect x="22" y="150" width="246" height="22" fill="#ffffff" clip-path="url(#hi-clip)"/>
  <rect x="22" y="172" width="246" height="20" fill="#1d0e82" clip-path="url(#hi-clip)"/>
  <!-- Canton: Union Jack simplified in top-left corner -->
  <rect x="22" y="18" width="100" height="70" fill="#1d0e82" clip-path="url(#hi-clip)"/>
  <!-- White diagonals -->
  <line x1="22" y1="18" x2="122" y2="88" stroke="#ffffff" stroke-width="8" clip-path="url(#hi-clip)" stroke-linecap="square"/>
  <line x1="122" y1="18" x2="22" y2="88" stroke="#ffffff" stroke-width="8" clip-path="url(#hi-clip)" stroke-linecap="square"/>
  <!-- Red diagonals -->
  <line x1="22" y1="18" x2="122" y2="88" stroke="#d01424" stroke-width="4" clip-path="url(#hi-clip)" stroke-linecap="square"/>
  <line x1="122" y1="18" x2="22" y2="88" stroke="#d01424" stroke-width="4" clip-path="url(#hi-clip)" stroke-linecap="square"/>
  <!-- White cross on canton -->
  <rect x="62" y="18" width="18" height="70" fill="#ffffff" clip-path="url(#hi-clip)"/>
  <rect x="22" y="44" width="100" height="18" fill="#ffffff" clip-path="url(#hi-clip)"/>
  <!-- Red cross on canton -->
  <rect x="67" y="18" width="8" height="70" fill="#d01424" clip-path="url(#hi-clip)"/>
  <rect x="22" y="49" width="100" height="8" fill="#d01424" clip-path="url(#hi-clip)"/>
  <rect x="22" y="18" width="246" height="174" rx="28" ry="28" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 72 192 L 50 228 L 118 192 Z" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
