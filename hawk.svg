  <!-- Perch branch -->
  <rect x="55" y="202" width="180" height="15" rx="7" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Tail (barred), hanging down behind the perch -->
  <polygon points="158,176 150,222 188,214" fill="#6b4f26" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="158" y1="200" x2="186" y2="196" stroke="#3d2c17" stroke-width="3"/>
  <line x1="156" y1="188" x2="180" y2="184" stroke="#3d2c17" stroke-width="3"/>

  <!-- Body: upright raptor torso -->
  <path d="M118 132 Q108 188 138 204 L172 200 Q186 150 174 120 Q150 108 118 132 Z"
        fill="#7a5a35" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Folded wing hugging the back (down-swept, at rest) -->
  <path d="M168 122 Q198 138 190 196 L172 200 Q182 150 160 128 Z"
        fill="#5e441f" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- wing covert lines -->
  <path d="M176 150 Q186 156 184 170" fill="none" stroke="#3d2c17" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pale barred chest -->
  <path d="M122 138 Q116 184 140 198 Q160 188 160 150 Q150 124 122 138 Z"
        fill="#f0e6d2" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M124 146 Q140 150 156 146" fill="none" stroke="#7a5a35" stroke-width="3" stroke-linecap="round"/>
  <path d="M122 158 Q140 162 158 158" fill="none" stroke="#7a5a35" stroke-width="3" stroke-linecap="round"/>
  <path d="M124 170 Q140 174 156 170" fill="none" stroke="#7a5a35" stroke-width="3" stroke-linecap="round"/>
  <path d="M128 182 Q140 185 152 182" fill="none" stroke="#7a5a35" stroke-width="3" stroke-linecap="round"/>

  <!-- HEAD: side-profile raptor head facing LEFT, flat-crowned -->
  <path d="M150 76 Q186 78 188 108 Q188 130 162 134 L130 130 Q120 124 120 108 Q122 82 150 76 Z"
        fill="#6b4f26" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- dark malar (cheek) stripe under the eye -->
  <path d="M150 116 Q146 126 150 134" fill="none" stroke="#3d2c17" stroke-width="6" stroke-linecap="round"/>
  <!-- pale supercilium brow stripe -->
  <path d="M132 98 Q150 90 176 96" fill="none" stroke="#d9c8a6" stroke-width="5" stroke-linecap="round"/>

  <!-- HOOKED BEAK projecting forward-left into clear space (key hawk cue) -->
  <!-- upper mandible, large, with down-curved hooked tip -->
  <path d="M120 104 Q96 102 86 112 Q92 116 100 116 Q94 124 102 128 Q112 124 120 122 Z"
        fill="#f2c10d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- dark hooked tip -->
  <path d="M86 112 Q92 116 100 116 Q96 122 100 126 Q90 122 86 112 Z"
        fill="#2e2a22" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- nostril on the cere -->
  <circle cx="116" cy="110" r="2" fill="#000000"/>

  <!-- fierce eye with heavy dark brow ridge (single side eye = NOT owl) -->
  <path d="M138 96 Q152 91 164 99" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <circle cx="150" cy="108" r="10" fill="#f2c10d" stroke="#000000" stroke-width="3"/>
  <circle cx="150" cy="108" r="5" fill="#000000"/>
  <circle cx="151.6" cy="106.4" r="1.7" fill="#ffffff"/>

  <!-- Talons gripping the branch -->
  <line x1="138" y1="204" x2="124" y2="213" stroke="#f2c10d" stroke-width="4" stroke-linecap="round"/>
  <line x1="138" y1="204" x2="132" y2="215" stroke="#f2c10d" stroke-width="4" stroke-linecap="round"/>
  <line x1="138" y1="204" x2="140" y2="215" stroke="#f2c10d" stroke-width="4" stroke-linecap="round"/>
  <line x1="166" y1="202" x2="180" y2="211" stroke="#f2c10d" stroke-width="4" stroke-linecap="round"/>
  <line x1="166" y1="202" x2="172" y2="214" stroke="#f2c10d" stroke-width="4" stroke-linecap="round"/>
  <line x1="166" y1="202" x2="164" y2="214" stroke="#f2c10d" stroke-width="4" stroke-linecap="round"/>
</svg>
