  <circle cx="200" cy="80" r="3.5" fill="#f2e40d" stroke="#000000" stroke-width="1.5"/>
  <circle cx="155" cy="90" r="3.5" fill="#f2e40d" stroke="#000000" stroke-width="1.5"/>
  <circle cx="220" cy="55" r="3.5" fill="#f2e40d" stroke="#000000" stroke-width="1.5"/>
  <circle cx="170" cy="110" r="3.5" fill="#f2e40d" stroke="#000000" stroke-width="1.5"/>
  <circle cx="245" cy="95" r="3.5" fill="#f2e40d" stroke="#000000" stroke-width="1.5"/>
  <!-- person FULL BODY sneezing -->
  <!-- head -->
  <circle cx="85" cy="65" r="20" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M65 60 Q65 45 85 42 Q105 45 105 60" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
