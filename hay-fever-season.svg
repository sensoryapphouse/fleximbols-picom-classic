  <path d="M92 130 L98 175" fill="none" stroke="#1d0e82" stroke-width="11" stroke-linecap="round"/>
  <!-- shoes -->
  <ellipse cx="70" cy="178" rx="8" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="100" cy="178" rx="8" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- ACHOO puff above tissue -->
  <path d="M35 40 Q25 32 35 25 Q45 23 45 33 Q55 33 53 45 Q45 50 35 40 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
