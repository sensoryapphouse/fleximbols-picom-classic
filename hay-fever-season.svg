  <!-- red nose -->
  <circle cx="85" cy="71" r="4" fill="#f4a4b2" stroke="#000000" stroke-width="2"/>
  <!-- open mouth -->
  <ellipse cx="85" cy="79" rx="5" ry="4" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- torso -->
  <rect x="70" y="85" width="30" height="45" fill="#3aa6a0" stroke="#000000" stroke-width="3"/>
