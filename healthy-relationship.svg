  <!-- Two balanced figures, whole heart between them, equal footing on a shared baseline -->

  <!-- Shared ground line (equal footing) -->
  <line x1="30" y1="215" x2="260" y2="215" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- Person LEFT -->
  <circle cx="78" cy="52" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <path d="M60 76 Q78 68 96 76 L100 140 L56 140 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Arm toward centre (open/welcoming) -->
  <path d="M96 94 Q112 88 124 96" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Arm outward -->
  <path d="M60 94 Q46 86 36 92" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="68" y1="140" x2="64" y2="215" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="88" y1="140" x2="92" y2="215" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- Person RIGHT -->
  <circle cx="212" cy="52" r="20" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <path d="M194 76 Q212 68 230 76 L234 140 L190 140 Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Arm toward centre (open/welcoming) -->
  <path d="M194 94 Q178 88 166 96" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Arm outward -->
  <path d="M230 94 Q244 86 254 92" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="202" y1="140" x2="198" y2="215" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="222" y1="140" x2="226" y2="215" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- Whole heart centred between them -->
  <path d="M145 118 C145 118 118 98 118 80 C118 68 126 61 133 63 C138 64.5 145 71 145 71 C145 71 152 64.5 157 63 C164 61 172 68 172 80 C172 98 145 118 145 118 Z" fill="#f4a4b2" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Small equal-sign below heart (equal footing symbol) -->
  <line x1="131" y1="132" x2="159" y2="132" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="131" y1="142" x2="159" y2="142" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
