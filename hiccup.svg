  <line x1="136" y1="72" x2="130" y2="64" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="72" x2="166" y2="64" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
