  <!-- Bubble body clipped to rounded rect via clipPath -->
  <defs>
    <clipPath id="bubble-h">
      <rect x="20" y="20" width="250" height="175" rx="28" ry="28"/>
    </clipPath>
  </defs>
  <!-- Three horizontal bands inside bubble -->
  <rect x="20" y="20" width="250" height="59" fill="#ff9900" clip-path="url(#bubble-h)"/>
  <rect x="20" y="79" width="250" height="58" fill="#ffffff" clip-path="url(#bubble-h)"/>
  <rect x="20" y="137" width="250" height="58" fill="#137827" clip-path="url(#bubble-h)"/>
  <!-- Bubble outline -->
  <rect x="20" y="20" width="250" height="175" rx="28" ry="28" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Bubble tail -->
  <polygon points="70,195 50,225 110,195" fill="#137827" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="55" y="188" width="62" height="12" fill="#137827" stroke="none"/>
  <!-- Chakra wheel (Ashoka) simplified: spokes -->
  <circle cx="145" cy="108" r="25" fill="none" stroke="#1d0e82" stroke-width="4"/>
  <circle cx="145" cy="108" r="5" fill="#1d0e82" stroke="#1d0e82" stroke-width="2"/>
  <line x1="145" y1="83" x2="145" y2="133" stroke="#1d0e82" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="108" x2="170" y2="108" stroke="#1d0e82" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="127" y1="90" x2="163" y2="126" stroke="#1d0e82" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="163" y1="90" x2="127" y2="126" stroke="#1d0e82" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="101" x2="170" y2="115" stroke="#1d0e82" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="101" x2="120" y2="115" stroke="#1d0e82" stroke-width="2" stroke-linecap="round"/>
  <line x1="138" y1="84" x2="152" y2="132" stroke="#1d0e82" stroke-width="2" stroke-linecap="round"/>
  <line x1="152" y1="84" x2="138" y2="132" stroke="#1d0e82" stroke-width="2" stroke-linecap="round"/>
