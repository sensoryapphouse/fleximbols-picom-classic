  <!-- Honest: figure with open hand on heart, checkmark halo, calm sincere face -->
  <!-- Head -->
  <circle cx="145" cy="52" r="32" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eyes: calm, sincere -->
  <ellipse cx="134" cy="47" rx="5" ry="6" fill="#000000"/>
  <ellipse cx="156" cy="47" rx="5" ry="6" fill="#000000"/>
  <!-- Eye shine -->
  <circle cx="136" cy="45" r="2" fill="#ffffff"/>
  <circle cx="158" cy="45" r="2" fill="#ffffff"/>
  <!-- Eyebrows: gentle, calm -->
  <path d="M127 38 Q134 34 141 38" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M149 38 Q156 34 163 38" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Warm smile -->
  <path d="M133 62 Q145 72 157 62" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="136" y="82" width="18" height="16" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Torso / shirt (blue) -->
  <path d="M100 98 Q108 88 136 90 L154 90 Q182 88 190 98 L196 170 L94 170 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left arm: raised, hand on heart -->
  <path d="M101 102 Q78 110 72 128 Q70 140 80 148" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M101 102 Q78 110 72 128 Q70 140 80 148" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hand on heart area (open palm) -->
  <ellipse cx="112" cy="138" rx="18" ry="14" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Fingers -->
  <line x1="100" y1="130" x2="97" y2="122" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="106" y1="126" x2="104" y2="117" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="112" y1="124" x2="112" y2="115" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="118" y1="126" x2="120" y2="117" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="124" y1="130" x2="128" y2="123" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Right arm: down, relaxed -->
  <path d="M189 102 Q210 114 215 138" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M189 102 Q210 114 215 138" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right hand -->
  <ellipse cx="216" cy="148" rx="13" ry="11" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Legs -->
  <rect x="116" y="168" width="24" height="46" rx="8" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="150" y="168" width="24" height="46" rx="8" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="128" cy="215" rx="18" ry="9" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="162" cy="215" rx="18" ry="9" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Heart on chest -->
  <path d="M138 118 Q138 112 145 118 Q152 112 152 118 Q152 126 145 132 Q138 126 138 118 Z" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Checkmark halo above head -->
  <circle cx="145" cy="12" r="14" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M137 12 L142 18 L153 7" fill="none" stroke="#529929" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
