  <!-- Ground line -->
  <line x1="20" y1="205" x2="270" y2="205" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Small hop arc (low, short) -->
  <path d="M100,205 Q145,170 190,205" stroke="#b8b8b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6,5"/>
  <!-- Figure mid small one-footed hop, one leg tucked up -->
  <!-- Head -->
  <circle cx="155" cy="100" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Eyes -->
  <circle cx="148" cy="96" r="3" fill="#000000"/>
  <circle cx="161" cy="96" r="3" fill="#000000"/>
  <!-- Mouth (smile) -->
  <path d="M149,106 Q155,112 162,106" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Hair -->
  <path d="M137,93 Q153,82 171,93" stroke="#7d5e23" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Neck -->
  <line x1="155" y1="119" x2="155" y2="130" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <!-- Torso -->
  <path d="M135,130 Q155,126 175,130 L178,168 Q155,174 132,168 Z" fill="#ff9900" stroke="#000000" stroke-width="5"/>
  <!-- Right arm up for balance -->
  <line x1="175" y1="138" x2="195" y2="122" stroke="#eed5b6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="200" cy="118" r="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Left arm out -->
  <line x1="135" y1="138" x2="115" y2="128" stroke="#eed5b6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="110" cy="125" r="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Left leg — straight down, foot off ground (landing leg) -->
  <line x1="145" y1="168" x2="140" y2="188" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <line x1="140" y1="188" x2="138" y2="200" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <!-- Left foot -->
  <ellipse cx="140" cy="204" rx="12" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Right leg tucked up (raised, bent knee) -->
  <line x1="165" y1="168" x2="180" y2="178" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <line x1="180" y1="178" x2="175" y2="192" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <!-- Right foot (tucked up) -->
  <ellipse cx="173" cy="196" rx="11" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
</svg>
