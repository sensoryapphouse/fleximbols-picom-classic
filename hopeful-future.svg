  <!-- Rising sun at top - horizon scene -->
  <!-- Sky background strip -->
  <rect x="8" y="8" width="274" height="52" rx="6" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <!-- Sun rising over horizon -->
  <rect x="8" y="46" width="274" height="8" rx="0" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <!-- Sun semi-circle (rising) -->
  <path d="M110 54 A35 35 0 0 1 180 54" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Sun rays -->
  <line x1="145" y1="14" x2="145" y2="10" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="20" x2="168" y2="16" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="34" x2="184" y2="32" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <line x1="125" y1="20" x2="122" y2="16" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="34" x2="106" y2="32" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <!-- Upward path arrow on horizon -->
  <path d="M40 52 Q90 35 145 20 Q200 35 250 52" fill="none" stroke="#f8130d" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
  <!-- Shoulders -->
  <path d="M60 240 Q70 192 104 182 Q145 176 186 182 Q220 192 230 240 Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="128" y="155" width="34" height="26" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Head - looking forward/ahead -->
  <ellipse cx="145" cy="118" rx="60" ry="62" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M87 100 Q90 56 145 52 Q200 56 203 100" fill="#5e1f0a" stroke="#000000" stroke-width="5"/>
  <ellipse cx="145" cy="57" rx="58" ry="20" fill="#5e1f0a" stroke="#000000" stroke-width="5"/>
  <!-- Eyebrows - raised, forward-looking optimism -->
  <path d="M108 94 Q120 88 132 93" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M158 93 Q170 88 182 94" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Eyes looking ahead (level, bright) -->
  <ellipse cx="120" cy="110" rx="13" ry="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="122" cy="110" r="7" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <circle cx="124" cy="108" r="2" fill="#ffffff"/>
  <ellipse cx="170" cy="110" rx="13" ry="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="172" cy="110" r="7" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <circle cx="174" cy="108" r="2" fill="#ffffff"/>
  <!-- Nose -->
  <path d="M140 120 L137 130 L145 132 L153 130 L150 120" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Warm forward-looking smile -->
  <path d="M120 142 Q145 160 170 142" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="103" cy="128" rx="13" ry="8" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="187" cy="128" rx="13" ry="8" fill="#f4a4b2" stroke="none"/>
</svg>
