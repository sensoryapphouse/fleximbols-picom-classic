  <!-- Shoulders - slumped (raised at centre, hunched) -->
  <path d="M60 240 Q75 195 105 188 Q145 182 185 188 Q215 195 230 240 Z" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="128" y="158" width="34" height="28" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Head - tilted/drooped (shifted down slightly) -->
  <ellipse cx="145" cy="128" rx="58" ry="60" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Downcast eyes (half-closed / looking down) -->
  <ellipse cx="122" cy="118" rx="10" ry="8" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="168" cy="118" rx="10" ry="8" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="122" cy="121" r="5" fill="#4d4d4d"/>
  <circle cx="168" cy="121" r="5" fill="#4d4d4d"/>
  <!-- Heavy eyelids -->
  <path d="M112 113 Q122 109 132 113" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M158 113 Q168 109 178 113" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Furrowed brow - sad -->
  <path d="M110 103 Q122 98 132 105" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M158 105 Q168 98 180 103" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Flat sad mouth -->
  <path d="M124 152 Q145 143 166 152" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Dark small rain cloud above left -->
  <ellipse cx="68" cy="52" rx="28" ry="18" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <ellipse cx="52" cy="60" rx="18" ry="13" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <ellipse cx="84" cy="60" rx="18" ry="13" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Raindrops -->
  <line x1="52" y1="75" x2="48" y2="90" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round"/>
  <line x1="68" y1="75" x2="64" y2="90" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round"/>
  <line x1="84" y1="75" x2="80" y2="90" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round"/>
  <!-- Wilted droop line from head area -->
  <path d="M185 100 Q205 90 215 105 Q225 120 210 130" fill="none" stroke="#529929" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="208" cy="134" rx="10" ry="6" fill="#529929" stroke="#000000" stroke-width="3"/>
  <path d="M208 134 Q218 145 214 158" fill="none" stroke="#529929" stroke-width="3" stroke-linecap="round"/>
  <!-- Tear drop -->
  <path d="M128 135 Q126 145 130 148 Q134 150 133 145 Z" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
</svg>
