<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- soft wall background hint -->
  <rect x="0" y="0" width="290" height="170" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <!-- floor -->
  <rect x="0" y="210" width="290" height="20" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- window with sunlight -->
  <rect x="20" y="20" width="60" height="60" fill="#dff3fd" stroke="#000000" stroke-width="3.5"/>
  <line x1="50" y1="20" x2="50" y2="80" stroke="#000000" stroke-width="2.5"/>
  <line x1="20" y1="50" x2="80" y2="50" stroke="#000000" stroke-width="2.5"/>
  <!-- sun in window -->
  <circle cx="65" cy="35" r="8" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <!-- comfortable bed -->
  <rect x="50" y="160" width="220" height="50" fill="#f266aa" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- bed headboard cushion -->
  <rect x="46" y="100" width="20" height="100" fill="#7c3fac" stroke="#000000" stroke-width="3.5"/>
  <!-- footboard -->
  <rect x="260" y="130" width="14" height="70" fill="#7c3fac" stroke="#000000" stroke-width="3"/>
  <!-- bed legs -->
  <rect x="54" y="200" width="8" height="14" fill="#5e1f0a" stroke="#000000" stroke-width="2.5"/>
  <rect x="258" y="200" width="8" height="14" fill="#5e1f0a" stroke="#000000" stroke-width="2.5"/>
  <!-- pillow -->
  <rect x="70" y="120" width="60" height="32" rx="6" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- blanket -->
  <path d="M130 158 L260 158 L260 192 L130 192 Z" fill="#3aa6a0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- feet bumps -->
  <ellipse cx="248" cy="166" rx="10" ry="6" fill="#3aa6a0" stroke="#000000" stroke-width="2.5"/>
  <!-- patient peaceful head -->
  <circle cx="100" cy="130" r="15" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- white hair -->
  <path d="M86 127 Q100 113 114 127 L114 120 Q100 110 86 120 Z" fill="#efefef" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- peaceful closed eyes -->
  <path d="M92 130 Q96 133 100 130" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M102 130 Q106 133 110 130" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- small soft smile -->
  <path d="M96 138 Q100 141 104 138" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- patient arm resting on blanket -->
  <path d="M130 168 Q150 174 168 172" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="170" cy="172" r="4.5" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <!-- caregiver FULL BODY sitting beside bed (right side) -->
  <!-- head -->
  <circle cx="200" cy="115" r="12" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M188 112 Q200 100 212 112 L212 106 Q200 96 188 106 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="196" cy="115" r="1.6" fill="#000000"/>
  <circle cx="204" cy="115" r="1.6" fill="#000000"/>
  <!-- caring smile -->
  <path d="M196 121 Q200 124 204 121" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- caregiver torso -->
  <path d="M188 128 L212 128 L218 175 L182 175 Z" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- caregiver arm reaching to patient's hand (compassion) -->
  <path d="M188 134 Q176 158 170 172" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- other arm -->
  <path d="M212 134 Q224 144 226 158" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="226" cy="160" r="4" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <!-- caregiver legs (seated, slightly bent) -->
  <polygon points="182,175 200,175 204,210 188,210" fill="#1d0e82" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="200,175 218,175 224,210 208,210" fill="#1d0e82" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- flowers on bedside (left of bed) -->
  <rect x="155" y="180" width="22" height="18" fill="#9d7246" stroke="#000000" stroke-width="2.5"/>
  <line x1="166" y1="180" x2="166" y2="160" stroke="#67832d" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="180" x2="156" y2="164" stroke="#67832d" stroke-width="3" stroke-linecap="round"/>
  <line x1="172" y1="180" x2="176" y2="164" stroke="#67832d" stroke-width="3" stroke-linecap="round"/>
  <circle cx="156" cy="160" r="6" fill="#f7de58" stroke="#000000" stroke-width="2.5"/>
  <circle cx="166" cy="156" r="6" fill="#d01424" stroke="#000000" stroke-width="2.5"/>
  <circle cx="176" cy="160" r="6" fill="#f266aa" stroke="#000000" stroke-width="2.5"/>
</svg>
