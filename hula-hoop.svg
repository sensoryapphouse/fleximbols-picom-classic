  <!-- hula hoop (large ellipse around waist) -->
  <ellipse cx="145" cy="138" rx="70" ry="26" fill="none" stroke="#f8130d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="145" cy="32" r="18" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- hair -->
  <path d="M127 26 Q145 14 163 26" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- neck -->
  <line x1="145" y1="50" x2="145" y2="60" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <!-- torso -->
  <path d="M122 62 Q145 58 168 62 L162 130 Q145 136 128 130 Z" fill="#f266aa" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- left arm out -->
  <line x1="122" y1="72" x2="78" y2="100" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <circle cx="78" cy="100" r="7" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- right arm out -->
  <line x1="168" y1="72" x2="212" y2="100" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <circle cx="212" cy="100" r="7" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- left leg -->
  <line x1="133" y1="130" x2="118" y2="188" stroke="#2a4ec0" stroke-width="9" stroke-linecap="round"/>
  <!-- right leg -->
  <line x1="157" y1="130" x2="172" y2="188" stroke="#2a4ec0" stroke-width="9" stroke-linecap="round"/>
  <!-- feet -->
  <ellipse cx="115" cy="192" rx="12" ry="6" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="175" cy="192" rx="12" ry="6" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- motion dots on hoop -->
  <circle cx="75" cy="138" r="5" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <circle cx="215" cy="138" r="5" fill="#f8130d" stroke="#000000" stroke-width="3"/>
</svg>
