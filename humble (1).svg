  <!-- Hair - short neat -->
  <ellipse cx="143" cy="64" rx="58" ry="20" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <rect x="85" y="56" width="116" height="22" rx="10" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <!-- Hair sides -->
  <ellipse cx="90" cy="90" rx="12" ry="26" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <ellipse cx="196" cy="90" rx="12" ry="26" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>

  <!-- Eyebrows - soft gentle slightly downward inner (humble expression) -->
  <path d="M102 98 Q118 92 132 97" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M154 97 Q168 92 184 98" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Eyes - warm, soft, slightly downcast gaze -->
  <ellipse cx="118" cy="116" rx="14" ry="11" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="118" cy="118" rx="8" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <circle cx="122" cy="115" r="3" fill="#ffffff"/>
  <ellipse cx="168" cy="116" rx="14" ry="11" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="168" cy="118" rx="8" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <circle cx="172" cy="115" r="3" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M138 126 L134 138 L141 140 L148 138 L144 126" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Modest gentle smile - soft and genuine -->
  <path d="M120 150 Q143 162 166 150" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Soft blush cheeks -->
  <ellipse cx="102" cy="128" rx="12" ry="8" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="184" cy="128" rx="12" ry="8" fill="#f4a4b2" stroke="none"/>

