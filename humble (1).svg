  <!-- Soft warm glow behind figure (modesty warmth) -->
  <ellipse cx="145" cy="148" rx="96" ry="78" fill="#f5e7c4" stroke="none"/>

  <!-- BUST - modest figure, slight bow, hand on heart -->
  <!-- Shoulders / torso bust -->
  <path d="M48 240 Q48 196 88 186 L145 176 L202 186 Q242 196 242 240 Z" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Slight bow tilt - collar area lower -->
  <!-- Hand on heart (left hand over chest) -->
  <path d="M90 206 Q96 192 112 196 Q118 210 108 218 Q96 222 88 214 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Heart on chest -->
  <path d="M106 196 Q111 190 116 196 Q121 190 126 196 Q126 204 116 212 Q106 204 106 196 Z" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right hand slight gesture down (humble, open palm) -->
  <path d="M194 210 Q200 196 214 200 Q218 212 212 220 Q202 222 194 216 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Neck - slightly tilted for bow -->
  <rect x="127" y="152" width="36" height="26" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Head - slight bow (tilted slightly down) -->
