  <!-- Soft glow behind figure (genuine modesty warmth) - small circle, under max size -->
  <ellipse cx="145" cy="140" rx="100" ry="80" fill="#f5e7c4" stroke="none"/>
  <!-- Neck -->
  <rect x="126" y="150" width="38" height="28" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shoulders / bust - slight bow (head angled, bust lower) -->
  <path d="M62 240 Q62 194 96 186 L145 178 L194 186 Q228 194 228 240 Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hand over heart (left hand on chest) -->
  <path d="M98 205 Q108 196 122 200 Q126 212 118 218 Q108 220 100 214 Z" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Heart shape on chest -->
  <path d="M112 197 Q116 192 120 197 Q124 192 128 197 Q128 204 120 210 Q112 204 112 197 Z" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <!-- Head - slight bow (lowered slightly) -->
  <ellipse cx="145" cy="110" rx="60" ry="63" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="145" cy="62" rx="60" ry="22" fill="#7d5e23" stroke="#000000" stroke-width="5"/>
  <rect x="85" y="54" width="120" height="20" rx="8" fill="#7d5e23" stroke="#000000" stroke-width="5"/>
  <!-- Eyebrows - gentle, soft arch -->
  <path d="M106 88 Q120 82 133 86" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M157 86 Q170 82 184 88" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Eyes - warm, gentle, slightly downcast -->
  <ellipse cx="120" cy="107" rx="13" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="120" cy="109" rx="8" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <ellipse cx="170" cy="107" rx="13" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="170" cy="109" rx="8" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Highlight -->
  <circle cx="124" cy="105" r="3" fill="#ffffff"/>
  <circle cx="174" cy="105" r="3" fill="#ffffff"/>
  <!-- Nose -->
  <path d="M140 118 L136 130 L143 132 L150 130 L146 118" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Gentle modest smile -->
  <path d="M124 142 Q145 154 166 142" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rosy cheeks (soft blush) -->
  <ellipse cx="105" cy="122" rx="12" ry="8" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="185" cy="122" rx="12" ry="8" fill="#f4a4b2" stroke="none"/>
</svg>
