  <!-- Ice wall background -->
  <rect x="26" y="30" width="238" height="180" rx="10" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Ice wall texture cracks -->
  <line x1="60" y1="20" x2="45" y2="90" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="20" x2="140" y2="80" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="30" x2="220" y2="110" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="140" x2="70" y2="200" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="150" x2="230" y2="210" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <!-- Ice fracture shards -->
  <polygon points="110,60 125,45 138,68" fill="#ffffff" stroke="#90a7d6" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="170,100 185,88 195,108" fill="#ffffff" stroke="#90a7d6" stroke-width="2" stroke-linejoin="round"/>

  <!-- Climbing rope -->
  <path d="M145,20 Q150,50 145,80 Q140,110 145,140" fill="none" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>

  <!-- Climber body (full figure, facing wall) -->
  <!-- Helmet -->
  <ellipse cx="145" cy="88" rx="16" ry="13" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="145" cy="103" rx="12" ry="12" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Torso -->
  <rect x="131" y="114" width="28" height="38" rx="5" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm (up, holding axe) -->
  <line x1="131" y1="120" x2="108" y2="98" stroke="#2a4ec0" stroke-width="12" stroke-linecap="round"/>
  <!-- Right arm (up, holding axe) -->
  <line x1="159" y1="120" x2="178" y2="100" stroke="#2a4ec0" stroke-width="12" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="137" y1="152" x2="128" y2="185" stroke="#4d4d4d" stroke-width="12" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="153" y1="152" x2="162" y2="185" stroke="#4d4d4d" stroke-width="12" stroke-linecap="round"/>

  <!-- Left ice axe -->
  <line x1="108" y1="98" x2="94" y2="70" stroke="#7f7f7f" stroke-width="5" stroke-linecap="round"/>
  <!-- Left axe pick (hooked into wall) -->
  <path d="M94,70 Q88,62 96,58" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Right ice axe -->
  <line x1="178" y1="100" x2="192" y2="74" stroke="#7f7f7f" stroke-width="5" stroke-linecap="round"/>
  <!-- Right axe pick -->
  <path d="M192,74 Q198,66 190,62" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- Crampons (spikes on boots) -->
  <!-- Left boot + crampons -->
  <rect x="122" y="183" width="14" height="8" rx="2" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <line x1="125" y1="191" x2="124" y2="198" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="129" y1="191" x2="129" y2="199" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="133" y1="191" x2="134" y2="198" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Right boot + crampons -->
  <rect x="156" y="183" width="14" height="8" rx="2" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <line x1="159" y1="191" x2="158" y2="198" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="163" y1="191" x2="163" y2="199" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="167" y1="191" x2="168" y2="198" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
