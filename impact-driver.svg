  <!-- Impact driver: stubby compact short-nosed, hex quick-chuck collet, battery base, shorter snout than drill -->

  <!-- Main motor body (compact, short) -->
  <rect x="60" y="70" width="120" height="62" rx="14" ry="14" fill="#f7de58" stroke="#000000" stroke-width="5"/>
  <!-- Body details -->
  <line x1="100" y1="70" x2="100" y2="132" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Vent slots on body -->
  <line x1="72" y1="82" x2="90" y2="82" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="90" x2="90" y2="90" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="98" x2="90" y2="98" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="106" x2="90" y2="106" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="114" x2="90" y2="114" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>

  <!-- Hex quick-chuck collet (short stubby nose, hexagonal) -->
  <!-- Collet ring -->
  <rect x="178" y="82" width="30" height="38" rx="6" ry="6" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>
  <!-- Hex socket opening (hexagonal shape at nose) -->
  <polygon points="207,91 212,101 207,111 200,111 195,101 200,91" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Short hex bit extending from collet -->
  <rect x="208" y="95" width="32" height="12" rx="3" ry="3" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Hex bit tip (Phillips or hex) -->
  <polygon points="240,95 248,101 240,107" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Pistol grip handle (compact, shorter) -->
  <path d="M 85,130 L 105,130 L 112,195 L 76,195 Z" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Trigger -->
  <rect x="102" y="142" width="16" height="22" rx="4" ry="4" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>

  <!-- Battery at base (chunky pack) -->
  <rect x="58" y="190" width="68" height="30" rx="6" ry="6" fill="#1d0e82" stroke="#000000" stroke-width="5"/>
  <!-- Battery contacts -->
  <rect x="65" y="186" width="9" height="8" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <rect x="82" y="186" width="9" height="8" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <rect x="99" y="186" width="9" height="8" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- Battery stripe -->
  <rect x="58" y="204" width="68" height="8" rx="2" ry="2" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
</svg>
