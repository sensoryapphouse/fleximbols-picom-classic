  <!-- Legs - one foot tapping (slightly raised) -->
  <rect x="118" y="178" width="20" height="48" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="150" y="175" width="20" height="51" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left foot flat -->
  <rect x="110" y="218" width="32" height="14" rx="5" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right foot slightly raised at toe (tapping) -->
  <path d="M148 224 Q162 220 180 226 L178 234 Q162 234 148 230 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Tap motion lines under foot -->
  <line x1="168" y1="236" x2="168" y2="242" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="175" y1="234" x2="178" y2="240" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="161" y1="236" x2="158" y2="242" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Torso -->
  <rect x="110" y="108" width="70" height="72" rx="10" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Arms CROSSED tightly on chest -->
  <!-- Left arm crossing right -->
  <path d="M110 125 Q128 133 160 128" fill="none" stroke="#eed5b6" stroke-width="13" stroke-linecap="round"/>
  <!-- Right arm crossing left -->
  <path d="M180 125 Q162 133 128 130" fill="none" stroke="#eed5b6" stroke-width="13" stroke-linecap="round"/>
  <!-- Fists clenched at ends of crossed arms -->
  <ellipse cx="166" cy="128" rx="10" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="3.5"/>
  <ellipse cx="124" cy="130" rx="10" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="3.5"/>
  <!-- Neck -->
  <rect x="132" y="94" width="26" height="18" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="145" cy="74" rx="30" ry="28" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="145" cy="51" rx="30" ry="14" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Glaring narrowed eyes with furrowed brows -->
  <ellipse cx="135" cy="70" rx="5.5" ry="3.5" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <ellipse cx="155" cy="70" rx="5.5" ry="3.5" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <!-- Heavy furrowed brows pointing inward (angry V) -->
  <path d="M127 62 L138 67" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M163 62 L152 67" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Tight irritated mouth/scowl -->
  <path d="M136 85 Q145 80 154 85" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Steam/frustration marks from head -->
  <path d="M170 52 Q178 44 172 36" fill="none" stroke="#f8130d" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M180 56 Q190 46 184 36" fill="none" stroke="#f8130d" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Clock on wall - figure glaring at it -->
  <circle cx="228" cy="68" r="30" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="228" cy="68" r="3.5" fill="#000000"/>
  <!-- Clock hands - slow pointing ~11 -->
  <line x1="228" y1="68" x2="220" y2="44" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="228" y1="68" x2="248" y2="68" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Clock tick marks -->
  <line x1="228" y1="40" x2="228" y2="46" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="228" y1="90" x2="228" y2="96" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="68" x2="206" y2="68" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="250" y1="68" x2="256" y2="68" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Frustration lines radiating from clock glare -->
  <line x1="196" y1="42" x2="190" y2="36" stroke="#f7de58" stroke-width="3" stroke-linecap="round"/>
  <line x1="260" y1="42" x2="266" y2="36" stroke="#f7de58" stroke-width="3" stroke-linecap="round"/>
</svg>
