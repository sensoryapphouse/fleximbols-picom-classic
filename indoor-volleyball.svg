  <circle cx="200" cy="55" r="18" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <path d="M 200,37 Q 192,55 200,73 M 184,48 Q 200,55 216,48 M 184,64 Q 200,55 216,64" fill="none" stroke="#000000" stroke-width="2"/>
