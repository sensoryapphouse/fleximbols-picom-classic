  <line x1="85" y1="75" x2="85" y2="120" stroke="#4d4d4d" stroke-width="1.5"/>
  <line x1="105" y1="75" x2="105" y2="120" stroke="#4d4d4d" stroke-width="1.5"/>
  <line x1="125" y1="75" x2="125" y2="120" stroke="#4d4d4d" stroke-width="1.5"/>
