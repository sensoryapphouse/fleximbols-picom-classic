  <line x1="145" y1="0" x2="145" y2="160" stroke="#9d7246" stroke-width="2"/>
  <line x1="230" y1="0" x2="230" y2="160" stroke="#9d7246" stroke-width="2"/>
  <!-- gym floor (wood) -->
  <rect x="0" y="160" width="290" height="80" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <line x1="0" y1="175" x2="290" y2="175" stroke="#9d7246" stroke-width="2"/>
  <line x1="0" y1="190" x2="290" y2="190" stroke="#9d7246" stroke-width="2"/>
