  <path d="M178 152 Q188 145 200 158" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Feet bump at bottom -->
  <ellipse cx="125" cy="190" rx="14" ry="9" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="163" cy="190" rx="14" ry="9" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="145" cy="98" rx="34" ry="32" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
