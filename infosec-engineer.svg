  <!-- infosec-engineer: full body infosec + shield + firewall + INFOSEC label + encryption -->

  <!-- Person: full body, standing left -->
  <!-- Head -->
  <circle cx="58" cy="50" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="58" cy="36" rx="20" ry="10" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <rect x="38" y="72" width="40" height="52" rx="6" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm -->
  <line x1="38" y1="82" x2="18" y2="112" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="18" cy="114" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right arm -->
  <line x1="78" y1="82" x2="98" y2="112" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="100" cy="114" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Hips -->
  <rect x="36" y="122" width="44" height="22" rx="4" fill="#392170" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect x="36" y="142" width="16" height="56" rx="4" fill="#392170" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="64" y="142" width="16" height="56" rx="4" fill="#392170" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left foot -->
  <rect x="30" y="194" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right foot -->
  <rect x="62" y="194" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Shield (top right of person) -->
  <path d="M114,46 L160,46 L160,86 Q160,118 137,134 Q114,118 114,86 Z" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Lock on shield -->
  <path d="M131,72 Q131,64 137,64 Q143,64 143,72 L143,80 L131,80 Z" fill="none" stroke="#fff200" stroke-width="4" stroke-linejoin="round"/>
  <rect x="128" y="80" width="18" height="18" rx="2" fill="#fff200" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="137" cy="88" r="2" fill="#000000"/>

  <!-- Firewall (brick wall with flames on top) -->
  <g>
    <!-- Wall bricks -->
    <rect x="180" y="100" width="100" height="14" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <rect x="180" y="114" width="100" height="14" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <rect x="180" y="128" width="100" height="14" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- Brick vertical lines (row 1 - offset) -->
    <line x1="210" y1="100" x2="210" y2="114" stroke="#000000" stroke-width="2"/>
    <line x1="250" y1="100" x2="250" y2="114" stroke="#000000" stroke-width="2"/>
    <!-- Row 2 -->
    <line x1="195" y1="114" x2="195" y2="128" stroke="#000000" stroke-width="2"/>
    <line x1="230" y1="114" x2="230" y2="128" stroke="#000000" stroke-width="2"/>
    <line x1="265" y1="114" x2="265" y2="128" stroke="#000000" stroke-width="2"/>
    <!-- Row 3 -->
    <line x1="210" y1="128" x2="210" y2="142" stroke="#000000" stroke-width="2"/>
    <line x1="250" y1="128" x2="250" y2="142" stroke="#000000" stroke-width="2"/>
    <!-- Flames -->
    <path d="M196,100 Q190,86 200,80 Q198,90 206,82 Q204,96 196,100 Z" fill="#ff9900" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <path d="M230,100 Q224,82 234,74 Q230,90 240,78 Q238,96 230,100 Z" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <path d="M262,100 Q256,86 266,80 Q264,90 272,82 Q270,96 262,100 Z" fill="#ff9900" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Encryption (binary trail - rows of 0/1 as small squares) -->
  <g>
    <!-- Row indicator dots/squares acting as encrypted bits -->
    <rect x="106" y="148" width="6" height="6" fill="#529929" stroke="#000000" stroke-width="1.5"/>
    <rect x="116" y="148" width="6" height="6" fill="#7f7f7f" stroke="#000000" stroke-width="1.5"/>
    <rect x="126" y="148" width="6" height="6" fill="#529929" stroke="#000000" stroke-width="1.5"/>
    <rect x="136" y="148" width="6" height="6" fill="#529929" stroke="#000000" stroke-width="1.5"/>
    <rect x="146" y="148" width="6" height="6" fill="#7f7f7f" stroke="#000000" stroke-width="1.5"/>
    <rect x="156" y="148" width="6" height="6" fill="#529929" stroke="#000000" stroke-width="1.5"/>
    <rect x="166" y="148" width="6" height="6" fill="#7f7f7f" stroke="#000000" stroke-width="1.5"/>

    <rect x="106" y="158" width="6" height="6" fill="#7f7f7f" stroke="#000000" stroke-width="1.5"/>
    <rect x="116" y="158" width="6" height="6" fill="#529929" stroke="#000000" stroke-width="1.5"/>
    <rect x="126" y="158" width="6" height="6" fill="#7f7f7f" stroke="#000000" stroke-width="1.5"/>
    <rect x="136" y="158" width="6" height="6" fill="#529929" stroke="#000000" stroke-width="1.5"/>
    <rect x="146" y="158" width="6" height="6" fill="#529929" stroke="#000000" stroke-width="1.5"/>
    <rect x="156" y="158" width="6" height="6" fill="#7f7f7f" stroke="#000000" stroke-width="1.5"/>
    <rect x="166" y="158" width="6" height="6" fill="#529929" stroke="#000000" stroke-width="1.5"/>
  </g>

  <!-- INFOSEC label banner -->
  <rect x="100" y="174" width="186" height="28" rx="4" fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- I -->
  <path d="M114,180 L114,196" fill="none" stroke="#3aa6a0" stroke-width="3" stroke-linecap="round"/>
  <!-- N -->
  <path d="M124,196 L124,180 L138,196 L138,180" fill="none" stroke="#3aa6a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- F -->
  <path d="M148,196 L148,180 L160,180 M148,188 L158,188" fill="none" stroke="#3aa6a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- O -->
  <ellipse cx="178" cy="188" rx="7" ry="8" fill="none" stroke="#3aa6a0" stroke-width="3"/>
  <!-- S -->
  <path d="M205,180 Q195,180 195,184 Q195,188 205,188 Q215,188 215,192 Q215,196 205,196" fill="none" stroke="#3aa6a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- E -->
  <path d="M224,180 L235,180 M224,180 L224,196 L235,196 M224,188 L233,188" fill="none" stroke="#3aa6a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- C -->
  <path d="M254,180 Q244,180 244,188 Q244,196 254,196" fill="none" stroke="#3aa6a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
