  <g>
    <!-- Shoulders / chest bust — expanded chest from inhale -->
    <path d="M55,240 Q58,195 98,182 Q118,175 145,173 Q172,175 192,182 Q232,195 235,240 Z" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Shirt -->
    <path d="M57,240 Q60,210 98,200 Q118,194 145,193 Q172,194 192,200 Q230,210 233,240 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Chest expansion arcs on shirt showing inhale expansion -->
    <path d="M100,210 Q145,198 190,210" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M90,222 Q145,208 200,222" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Neck -->
    <polygon points="122,175 127,194 163,194 168,175 157,180 145,182 133,180" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Head -->
    <path d="M72,108 Q74,58 145,28 Q216,58 218,108 Q220,148 200,172 Q172,196 145,197 Q118,196 90,172 Q70,148 72,108 Z" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Left ear -->
    <ellipse cx="67" cy="110" rx="13" ry="19" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Right ear -->
    <ellipse cx="223" cy="110" rx="13" ry="19" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Hair -->
    <path d="M84,78 Q92,28 145,22 Q198,28 206,78 Q192,42 145,40 Q98,42 84,78 Z" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Eyes wide open — alert inhale -->
    <ellipse cx="113" cy="95" rx="11" ry="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <circle cx="114" cy="96" r="6" fill="#000000"/>
    <circle cx="115" cy="93" r="2" fill="#ffffff"/>
    <ellipse cx="177" cy="95" rx="11" ry="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <circle cx="178" cy="96" r="6" fill="#000000"/>
    <circle cx="179" cy="93" r="2" fill="#ffffff"/>
    <!-- Eyebrows raised high — inhale surprise/alertness -->
    <polyline points="100,76 116,72" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <polyline points="165,72 181,76" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <!-- Nostrils flared — air pulling in -->
    <ellipse cx="138" cy="122" rx="7" ry="5" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
    <ellipse cx="152" cy="122" rx="7" ry="5" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
    <!-- Nose bridge -->
    <path d="M141,108 Q137,118 133,122 Q137,124 138,122 M149,108 Q153,118 157,122 Q153,124 152,122" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <!-- Mouth open pulling air in -->
    <path d="M118,145 Q130,138 145,137 Q160,138 172,145 Q162,155 145,157 Q128,155 118,145 Z" fill="#f4a4b2" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <path d="M118,145 Q131,142 145,142 Q159,142 172,145" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <!-- Arrows pointing INTO nose — air being drawn in -->
    <polygon points="145,100 138,86 152,86" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <line x1="145" y1="100" x2="145" y2="72" stroke="#dff3fd" stroke-width="4" stroke-linecap="round"/>
    <!-- Side arrows converging in -->
    <path d="M100,80 Q112,90 128,118" fill="none" stroke="#dff3fd" stroke-width="4" stroke-linecap="round"/>
    <polygon points="128,118 120,108 131,106" fill="#dff3fd" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
    <path d="M190,80 Q178,90 162,118" fill="none" stroke="#dff3fd" stroke-width="4" stroke-linecap="round"/>
    <polygon points="162,118 159,106 170,108" fill="#dff3fd" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  </g>
