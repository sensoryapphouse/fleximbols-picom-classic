  <!-- person + dark shadow figure beside whispering + frown -->
  <!-- main person (full body) -->
  <!-- head -->
  <circle cx="110" cy="50" r="22" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M88 46 Q92 24 110 20 Q128 24 132 46 Q128 34 110 30 Q92 34 88 46 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- sad eyes (slightly droopy) -->
  <path d="M98 48 Q102 52 106 50" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M114 50 Q118 52 122 48" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="102" cy="50" r="2" fill="#000000"/>
  <circle cx="118" cy="50" r="2" fill="#000000"/>
  <!-- frown -->
  <path d="M100 64 Q110 58 120 64" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- tear -->
  <path d="M122 56 Q126 62 124 68 Q120 68 122 62 Z" fill="#2a4ec0" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- neck -->
  <rect x="103" y="68" width="14" height="12" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <!-- torso -->
  <path d="M76 78 L144 78 L148 150 L72 150 Z" fill="#67832d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arms hanging dejected -->
  <rect x="58" y="82" width="16" height="70" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <rect x="146" y="82" width="16" height="70" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <!-- legs (shorts/trousers) -->
  <rect x="80" y="150" width="26" height="80" rx="5" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <rect x="114" y="150" width="26" height="80" rx="5" fill="#1d0e82" stroke="#000000" stroke-width="3"/>

  <!-- DARK SHADOW figure beside (right) - menacing -->
  <!-- shadow head -->
  <circle cx="206" cy="56" r="22" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- shadow horns/spiky hair -->
  <path d="M186 50 L192 30 L198 46 L206 28 L214 46 L220 30 L226 50 Z" fill="#000000" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- glowing red eyes -->
  <ellipse cx="200" cy="56" rx="3" ry="4" fill="#f8130d" stroke="#000000" stroke-width="1.5"/>
  <ellipse cx="212" cy="56" rx="3" ry="4" fill="#f8130d" stroke="#000000" stroke-width="1.5"/>
  <!-- evil grin -->
  <path d="M196 68 Q206 76 216 68" fill="none" stroke="#f8130d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- shadow body (translucent-feeling via dark grey) -->
  <path d="M178 76 L234 76 L238 220 L174 220 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- shadow arm reaching toward person -->
  <path d="M178 90 Q150 100 158 130 Q166 132 168 122 Q172 110 178 110 Z" fill="#4d4d4d" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- shadow feet -->
  <ellipse cx="186" cy="226" rx="14" ry="6" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="222" cy="226" rx="14" ry="6" fill="#000000" stroke="#000000" stroke-width="2"/>

  <!-- whisper bubble from shadow to person's ear -->
  <path d="M148 32 Q170 24 184 36 Q190 50 178 58 Q166 60 156 56 L148 62 L150 54 Q138 46 142 38 Z" fill="#efefef" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- jagged lines suggesting harsh words -->
  <path d="M154 40 L160 44 L156 46 L162 50" fill="none" stroke="#f8130d" stroke-width="2" stroke-linecap="round"/>
  <path d="M168 42 L174 46 L170 48 L176 50" fill="none" stroke="#f8130d" stroke-width="2" stroke-linecap="round"/>
</svg>
