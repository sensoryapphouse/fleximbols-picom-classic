  <!-- floor -->
  <rect x="0" y="210" width="290" height="20" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- back wall hint with hospital cross -->
  <rect x="40" y="20" width="34" height="34" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <rect x="50" y="24" width="14" height="26" fill="#d01424" stroke="#000000" stroke-width="2.5"/>
  <rect x="44" y="30" width="26" height="14" fill="#d01424" stroke="#000000" stroke-width="2.5"/>
  <!-- IV pole -->
  <line x1="30" y1="60" x2="30" y2="210" stroke="#4d4d4d" stroke-width="4" stroke-linecap="round"/>
  <!-- IV bag -->
  <rect x="18" y="60" width="24" height="36" rx="3" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <line x1="30" y1="96" x2="30" y2="110" stroke="#000000" stroke-width="2"/>
  <!-- IV tube to patient -->
  <path d="M30 110 Q60 130 95 145" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- bed base -->
  <rect x="60" y="160" width="200" height="40" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- bed legs -->
  <rect x="64" y="200" width="8" height="14" fill="#4d4d4d" stroke="#000000" stroke-width="2.5"/>
  <rect x="248" y="200" width="8" height="14" fill="#4d4d4d" stroke="#000000" stroke-width="2.5"/>
  <!-- head board -->
  <rect x="56" y="110" width="14" height="80" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <!-- foot board -->
  <rect x="250" y="130" width="14" height="60" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <!-- pillow -->
  <rect x="74" y="138" width="50" height="28" rx="5" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- blanket over body -->
  <path d="M120 160 L250 160 L250 188 L120 188 Z" fill="#3aa6a0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- feet bumps -->
  <ellipse cx="240" cy="168" rx="10" ry="6" fill="#3aa6a0" stroke="#000000" stroke-width="2.5"/>
  <!-- patient FULL BODY: head visible -->
  <circle cx="100" cy="148" r="16" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M86 144 Q100 132 114 144 L113 138 Q100 128 87 138 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- closed eyes resting -->
  <path d="M93 148 Q96 150 99 148" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M101 148 Q104 150 107 148" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- mouth -->
  <path d="M96 156 Q100 158 104 156" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- shoulders/torso hint above blanket -->
  <path d="M82 164 Q100 158 122 164 L120 162 L84 162 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- arm resting on blanket -->
  <path d="M120 170 Q150 178 170 176" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="172" cy="177" r="4.5" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <!-- monitor -->
  <rect x="190" y="60" width="80" height="56" fill="#4d4d4d" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="196" y="66" width="68" height="44" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- heart line -->
  <polyline points="200,90 210,90 215,78 222,102 230,82 238,90 264,90" fill="none" stroke="#529929" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- monitor stand -->
  <rect x="226" y="116" width="8" height="20" fill="#7f7f7f" stroke="#000000" stroke-width="2.5"/>
  <!-- cable to bed -->
  <path d="M210 116 Q190 130 175 165" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
</svg>
