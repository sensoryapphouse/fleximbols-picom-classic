  <!-- BACKGROUND PANEL -->
  <rect x="22" y="22" width="246" height="196" rx="14" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- SCREEN 1 (left screen, smaller) -->
  <rect x="100" y="36" width="64" height="80" rx="6" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="106" y="42" width="52" height="66" rx="3" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Tap circle on screen 1 -->
  <circle cx="132" cy="75" r="10" fill="none" stroke="#f7de58" stroke-width="3"/>
  <circle cx="132" cy="75" r="4" fill="#f7de58"/>

  <!-- FLOW ARROW between screens -->
  <path d="M164 76 Q178 68 184 76" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <polygon points="184,70 192,76 184,82" fill="#000000"/>

  <!-- SCREEN 2 (right screen, slightly larger) -->
  <rect x="192" y="30" width="72" height="90" rx="6" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="198" y="36" width="60" height="76" rx="3" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Gesture arc on screen 2 -->
  <path d="M210 80 Q222 62 234 80" fill="none" stroke="#f7de58" stroke-width="4" stroke-linecap="round"/>
  <!-- Arrow on arc end -->
  <polygon points="234,74 240,82 228,84" fill="#f7de58"/>

  <!-- GESTURE ARC (tap arcs near person) -->
  <path d="M96 92 Q90 80 96 68" fill="none" stroke="#ff9900" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 96 Q90 80 100 64" fill="none" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <!-- Finger point -->
  <circle cx="97" cy="90" r="4" fill="#ff9900" stroke="#000000" stroke-width="3"/>

  <!-- PERSON (full body, left) -->
  <!-- Head -->
  <circle cx="56" cy="62" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M38 56 Q40 42 56 40 Q72 42 74 56 L71 54 Q66 44 56 44 Q46 44 41 54 Z" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="49" cy="60" r="3" fill="#000000"/>
  <circle cx="63" cy="60" r="3" fill="#000000"/>
  <!-- Mouth -->
  <path d="M50 69 Q56 73 62 69" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Torso -->
  <path d="M34 84 Q32 84 30 96 L30 146 Q30 150 34 150 L78 150 Q82 150 82 146 L82 96 Q80 84 78 84 L70 78 L56 82 L42 78 Z" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Collar -->
  <path d="M50 82 L56 92 L62 82" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Left arm pointing at screen 1 -->
  <path d="M30 96 L34 108 Q36 116 44 116 L60 116 Q66 114 66 108 L62 96" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Extended index finger -->
  <line x1="66" y1="110" x2="80" y2="96" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <line x1="66" y1="110" x2="80" y2="96" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Right arm down -->
  <path d="M82 96 L90 118 Q92 126 86 130 L82 132 Q76 132 74 126 L72 104" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="83" cy="132" rx="8" ry="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>

  <!-- Trousers -->
  <path d="M34 150 L30 204 L46 204 L56 170 L66 204 L82 204 L78 150 Z" fill="#392170" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Shoes -->
  <ellipse cx="38" cy="204" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="4"/>
  <ellipse cx="74" cy="204" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="4"/>
