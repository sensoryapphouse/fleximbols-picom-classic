<!-- iridescent: soap bubble with distinct colour band segments (blue/purple/teal/pink) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Bubble segments drawn as arcs using clipPath simulation via overlapping wedge shapes -->
  <!-- Full circle base -->
  <circle cx="145" cy="120" r="90" fill="#dff3fd" stroke="#000000" stroke-width="5"/>
  <!-- Colour band wedges — pie slices of the circle -->
  <!-- Blue band top -->
  <path d="M145,120 L145,30 A90,90 0 0,1 235,120 Z" fill="#2a4ec0" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Purple band right -->
  <path d="M145,120 L235,120 A90,90 0 0,1 145,210 Z" fill="#7c3fac" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Teal band bottom -->
  <path d="M145,120 L145,210 A90,90 0 0,1 55,120 Z" fill="#3aa6a0" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Pink band left -->
  <path d="M145,120 L55,120 A90,90 0 0,1 145,30 Z" fill="#f266aa" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Outer circle border redrawn clean on top -->
  <circle cx="145" cy="120" r="90" fill="none" stroke="#000000" stroke-width="5"/>
  <!-- White highlight glint (soap bubble sheen) -->
  <ellipse cx="108" cy="76" rx="22" ry="13" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Small secondary glint -->
  <ellipse cx="92" cy="90" rx="8" ry="5" fill="#ffffff" stroke="none"/>
</svg>
