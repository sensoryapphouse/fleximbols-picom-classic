  <rect x="52" y="100" width="186" height="44" rx="22" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Tube ridges/texture -->
  <line x1="90" y1="102" x2="88" y2="142" stroke="#9d7246" stroke-width="3" stroke-linecap="round"/>
  <line x1="115" y1="100" x2="113" y2="143" stroke="#9d7246" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="100" x2="138" y2="143" stroke="#9d7246" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="100" x2="163" y2="143" stroke="#9d7246" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="102" x2="188" y2="142" stroke="#9d7246" stroke-width="3" stroke-linecap="round"/>
  <!-- Left cream filling end -->
  <ellipse cx="62" cy="122" rx="22" ry="22" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right cream filling end -->
  <ellipse cx="228" cy="122" rx="22" ry="22" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Chocolate chips on left end -->
  <circle cx="54" cy="116" r="5" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <circle cx="66" cy="128" r="5" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <circle cx="56" cy="130" r="4" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <circle cx="70" cy="114" r="4" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- Pistachio bits on right end (green) -->
  <circle cx="220" cy="116" r="5" fill="#529929" stroke="#000000" stroke-width="2"/>
  <circle cx="234" cy="128" r="5" fill="#529929" stroke="#000000" stroke-width="2"/>
