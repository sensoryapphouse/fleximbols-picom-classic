  <!-- Cannoli tube shell — fried pastry cylinder, angled -->
  <!-- Shadow/underside of tube -->
  <ellipse cx="145" cy="145" rx="105" ry="24" fill="#7d5e23" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
