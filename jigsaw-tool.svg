<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- jigsaw power tool, side profile: long horizontal body, motor barrel out the back,
       front gear-nose low at the front, top D-handle swept toward the back,
       flat shoe baseplate under the nose, thin toothed blade pointing down. -->

  <!-- flat shoe / base plate under the front nose -->
  <rect x="40" y="178" width="120" height="18" rx="4" fill="#c2c2c2" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- thin reciprocating blade pointing straight down through the shoe, near the front -->
  <rect x="74" y="196" width="9" height="36" fill="#9a9a9a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="83,200 88,206 83,212 88,218 83,224 88,230" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- long motor barrel sticking out the BACK (this is what makes it a jigsaw, not a padlock) -->
  <rect x="150" y="96" width="96" height="62" rx="28" fill="#ff8a1e" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- vent slots on the back barrel -->
  <line x1="196" y1="106" x2="196" y2="148" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="208" y1="106" x2="208" y2="148" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="220" y1="106" x2="220" y2="148" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- rounded back cap -->
  <circle cx="240" cy="127" r="6" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>

  <!-- front gear-nose / body block, lower and forward, sitting on the shoe -->
  <path d="M 56,118 L 150,108 Q 168,108 168,134 L 168,160 Q 168,176 150,176 L 70,176 Q 56,176 56,160 Z"
        fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- orange collar joining nose to barrel -->
  <rect x="120" y="112" width="44" height="60" rx="10" fill="#ff8a1e" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- top D-handle: closed loop, clearly toward the back of the tool -->
  <path d="M 120,100 Q 122,46 168,46 Q 232,46 232,98"
        fill="none" stroke="#ff8a1e" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 120,100 Q 122,46 168,46 Q 232,46 232,98"
        fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 138,100 Q 140,64 168,64 Q 214,64 214,98"
        fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- trigger switch under the handle, at the front of the grip -->
  <rect x="126" y="120" width="18" height="26" rx="5" fill="#c2c2c2" stroke="#000000" stroke-width="4"/>
</svg>
