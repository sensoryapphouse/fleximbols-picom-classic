  <!-- Knee joint, large and clear, centred -->
  <!-- Upper leg bone (femur shaft) -->
  <rect x="122" y="22" width="46" height="84" rx="16" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Femur condyle (rounded bottom of upper bone) -->
  <ellipse cx="145" cy="108" rx="34" ry="22" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Lower leg bone (tibia shaft) -->
  <rect x="126" y="148" width="38" height="72" rx="14" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Tibia plateau (flat top of lower bone) -->
  <ellipse cx="145" cy="148" rx="30" ry="14" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Kneecap (patella) -->
  <ellipse cx="145" cy="130" rx="20" ry="24" fill="#f5e7c4" stroke="#000000" stroke-width="5"/>
  <!-- Joint gap / cartilage zone -->
  <ellipse cx="145" cy="130" rx="28" ry="10" fill="none" stroke="#9d7246" stroke-width="3" stroke-dasharray="5,3"/>
  <!-- Pain burst (red throb) centred on joint -->
  <circle cx="145" cy="130" r="42" fill="#f8130d" stroke="#d01424" stroke-width="4" stroke-dasharray="6,4"/>
  <!-- Burst spikes radiating out -->
  <line x1="145" y1="84"  x2="145" y2="72"  stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <line x1="175" y1="94"  x2="183" y2="86"  stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <line x1="187" y1="130" x2="200" y2="130" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <line x1="175" y1="166" x2="183" y2="174" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <line x1="145" y1="176" x2="145" y2="188" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <line x1="115" y1="166" x2="107" y2="174" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <line x1="103" y1="130" x2="90"  y2="130" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <line x1="115" y1="94"  x2="107" y2="86"  stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <!-- Redraw bones and patella on top of burst so they remain visible -->
  <rect x="122" y="22" width="46" height="84" rx="16" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="145" cy="108" rx="34" ry="22" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <rect x="126" y="148" width="38" height="72" rx="14" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="145" cy="148" rx="30" ry="14" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <ellipse cx="145" cy="130" rx="20" ry="24" fill="#f5e7c4" stroke="#000000" stroke-width="5"/>
</svg>
