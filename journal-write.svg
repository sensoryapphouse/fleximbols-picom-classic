  <!-- desk surface -->
  <rect x="20" y="170" width="250" height="14" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- desk legs -->
  <rect x="30" y="184" width="10" height="40" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <rect x="248" y="184" width="10" height="40" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- lamp on desk -->
  <rect x="220" y="120" width="6" height="48" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <path d="M210 90 l28 0 l-6 28 l-16 0 z" fill="#fff200" stroke="#000000" stroke-width="3"/>
  <ellipse cx="224" cy="170" rx="14" ry="4" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- light glow -->
  <path d="M220 120 L196 170 L252 170 L228 120 z" fill="#f7de58" stroke="#000000" stroke-width="2"/>

  <!-- open journal on desk -->
  <path d="M70 168 l28 -8 l28 8 l-28 6 z" fill="#efefef" stroke="#000000" stroke-width="2"/>
  <path d="M70 168 q28 -10 56 0 v-12 q-28 -10 -56 0 z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <path d="M70 156 q28 -10 56 0" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M98 162 v-12" stroke="#000000" stroke-width="2"/>
  <!-- writing lines -->
  <path d="M76 152 q14 -4 22 -2" fill="none" stroke="#90a7d6" stroke-width="1.5"/>
  <path d="M76 156 q14 -4 22 -2" fill="none" stroke="#90a7d6" stroke-width="1.5"/>
  <path d="M102 150 q14 -2 22 2" fill="none" stroke="#90a7d6" stroke-width="1.5"/>
  <path d="M102 154 q14 -2 22 2" fill="none" stroke="#90a7d6" stroke-width="1.5"/>

  <!-- person FULL BODY seated at desk -->
  <!-- chair -->
  <rect x="40" y="170" width="6" height="50" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- head -->
  <circle cx="78" cy="62" r="16" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M62 58 q16 -20 32 0 q-2 -12 -16 -12 q-14 0 -16 12 z" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <!-- face -->
  <circle cx="72" cy="62" r="1.5" fill="#000000"/>
  <circle cx="84" cy="62" r="1.5" fill="#000000"/>
  <path d="M72 70 q6 3 12 0" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- torso (leaning forward to write) -->
  <path d="M58 80 q20 -6 40 0 q4 26 -2 50 q-18 4 -36 0 z" fill="#3aa6a0" stroke="#000000" stroke-width="3"/>
  <!-- writing arm reaching to journal -->
  <path d="M96 92 q14 12 6 60" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- other arm resting on desk -->
  <path d="M60 96 q-10 26 18 50" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- hands -->
  <circle cx="102" cy="152" r="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <circle cx="78" cy="146" r="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- pen in writing hand -->
  <path d="M104 156 l16 -14" stroke="#2a4ec0" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 142 l4 -4" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
  <!-- legs under desk visible at side -->
  <rect x="48" y="130" width="14" height="50" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <rect x="62" y="130" width="14" height="50" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <!-- shoes -->
  <rect x="44" y="200" width="22" height="8" rx="2" fill="#000000" stroke="#000000" stroke-width="2"/>

  <!-- thought wisps -->
  <circle cx="150" cy="44" r="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="162" cy="34" r="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="180" cy="22" r="9" fill="#ffffff" stroke="#000000" stroke-width="2"/>
</svg>
