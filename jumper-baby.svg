  <!-- doorframe-hanging seat with spring straps -->
  <!-- doorframe (top + sides, partial) -->
  <rect x="20" y="15" width="250" height="14" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="20" y="15" width="14" height="210" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="256" y="15" width="14" height="210" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- clamp on top of frame -->
  <rect x="120" y="22" width="50" height="20" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- spring straps (zigzag = springs) -->
  <path d="M 130 42 L 125 50 L 135 55 L 125 60 L 135 65 L 125 70 L 135 75 L 130 82" fill="none" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 160 42 L 155 50 L 165 55 L 155 60 L 165 65 L 155 70 L 165 75 L 160 82" fill="none" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- straps below springs -->
  <line x1="130" y1="82" x2="115" y2="125" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <line x1="160" y1="82" x2="175" y2="125" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <line x1="130" y1="82" x2="115" y2="125" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="160" y1="82" x2="175" y2="125" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- seat (saucer-shape) -->
  <ellipse cx="145" cy="140" rx="50" ry="18" fill="#7c3fac" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 95 140 Q 95 175 145 180 Q 195 175 195 140" fill="#392170" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- leg holes (two) -->
  <ellipse cx="130" cy="170" rx="9" ry="5" fill="#000000"/>
  <ellipse cx="160" cy="170" rx="9" ry="5" fill="#000000"/>
  <!-- baby in seat -->
  <!-- head -->
  <circle cx="145" cy="105" r="22" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M 127 92 Q 145 82 163 92 L 161 100 Q 145 93 129 100 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="138" cy="105" r="2.5" fill="#000000"/>
  <circle cx="152" cy="105" r="2.5" fill="#000000"/>
  <!-- smile -->
  <path d="M 138 114 Q 145 119 152 114" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- arms out -->
  <path d="M 125 130 Q 108 138 100 150" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M 125 130 Q 108 138 100 150" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 165 130 Q 182 138 190 150" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M 165 130 Q 182 138 190 150" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- legs dangling below seat -->
  <path d="M 128 180 Q 124 200 122 215" fill="none" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <path d="M 128 180 Q 124 200 122 215" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 162 180 Q 166 200 168 215" fill="none" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <path d="M 162 180 Q 166 200 168 215" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
