<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Jumping jack: X-shape body mid-air, arms up and wide, legs spread wide -->
  <!-- Head -->
  <circle cx="145" cy="36" r="22" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M 124,30 Q 126,14 145,14 Q 164,14 166,30 Q 158,21 145,22 Q 132,21 124,30 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eyes -->
  <ellipse cx="138" cy="35" rx="2.5" ry="3" fill="#000000"/>
  <ellipse cx="152" cy="35" rx="2.5" ry="3" fill="#000000"/>
  <!-- Happy expression mid-jump -->
  <path d="M 138,45 Q 145,50 152,45" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Torso -->
  <path d="M 133,56 Q 135,53 145,52 Q 155,53 157,56 L 158,100 L 132,100 Z" fill="#d01424" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- LEFT ARM: up and wide (upper left diagonal) -->
  <path d="M 135,66 Q 116,54 96,38" stroke="#000000" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Left forearm continues outward -->
  <path d="M 96,38 Q 82,28 68,18" stroke="#000000" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Left hand -->
  <circle cx="65" cy="16" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- RIGHT ARM: up and wide (upper right diagonal) -->
  <path d="M 155,66 Q 174,54 194,38" stroke="#000000" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 194,38 Q 208,28 222,18" stroke="#000000" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Right hand -->
  <circle cx="225" cy="16" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- LEFT LEG: wide spread lower-left diagonal -->
  <path d="M 134,100 Q 112,122 88,148" stroke="#1d0e82" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Left shin -->
  <path d="M 88,148 Q 70,172 54,196" stroke="#1d0e82" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Left foot -->
  <path d="M 54,196 L 40,202" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <!-- RIGHT LEG: wide spread lower-right diagonal -->
  <path d="M 156,100 Q 178,122 202,148" stroke="#1d0e82" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M 202,148 Q 220,172 236,196" stroke="#1d0e82" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Right foot -->
  <path d="M 236,196 L 250,202" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <!-- X-shape indicator (faint diagonal guides) -->
  <line x1="65" y1="16" x2="250" y2="202" stroke="#f7de58" stroke-width="1.5" stroke-dasharray="5,4" stroke-linecap="round"/>
  <line x1="225" y1="16" x2="40" y2="202" stroke="#f7de58" stroke-width="1.5" stroke-dasharray="5,4" stroke-linecap="round"/>
  <!-- Airborne cue: motion arcs under feet -->
  <path d="M 34,210 Q 40,218 46,210" stroke="#2a4ec0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 244,210 Q 250,218 256,210" stroke="#2a4ec0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
