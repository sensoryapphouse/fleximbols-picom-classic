  <path d="M 90 50 L 200 50 L 196 70 L 94 70 Z" fill="#7c3fac" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- sip hole -->
  <ellipse cx="160" cy="50" rx="14" ry="4" fill="#392170" stroke="#000000" stroke-width="2"/>
  <rect x="115" y="170" width="70" height="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- gap -->
