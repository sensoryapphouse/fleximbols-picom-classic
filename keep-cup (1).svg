  <!-- KeepCup-style: tapered reusable cup, silicone band mid-body, sip lid -->
  <!-- body (clear/light) -->
  <path d="M 95 65 L 195 65 L 180 215 L 110 215 Z" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- silicone band (the signature KeepCup feature) -->
  <path d="M 102 115 L 188 115 L 184 145 L 106 145 Z" fill="#f266aa" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- band ridges -->
  <path d="M 108 122 L 184 122 M 108 130 L 184 130 M 108 138 L 184 138" stroke="#000000" stroke-width="1"/>
