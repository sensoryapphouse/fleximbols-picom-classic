  <!-- Keep-cup: reusable cup, coloured silicone band, flat push-on lid, no sleeve texture -->
  <!-- Cup body (more cylindrical than paper cup, straighter sides) -->
  <path d="M95,200 L95,100 Q95,92 103,92 L187,92 Q195,92 195,100 L195,200 Z" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Silicone grip band (coloured, bold) -->
  <rect x="95" y="148" width="100" height="28" rx="4" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Cup outline on top -->
  <path d="M95,200 L95,100 Q95,92 103,92 L187,92 Q195,92 195,100 L195,200 Z" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Base -->
  <ellipse cx="145" cy="200" rx="50" ry="9" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- Flat push-on lid (clear, sits flush on top) -->
  <rect x="90" y="80" width="110" height="18" rx="9" fill="#90a7d6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Lid top surface ellipse -->
  <ellipse cx="145" cy="80" rx="55" ry="9" fill="#90a7d6" stroke="#000000" stroke-width="5"/>
  <!-- Drink hole on lid -->
  <ellipse cx="165" cy="80" rx="10" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Small tab on lid -->
  <rect x="85" y="77" width="12" height="8" rx="4" fill="#90a7d6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
</svg>
