  <!-- Floor -->
  <path d="M 30,218 L 260,218" stroke="#000000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Figure standing upright, kettlebell in RACK position at left shoulder/chest -->
  <!-- Head -->
  <circle cx="145" cy="46" r="22" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Hair -->
  <path d="M 124,40 Q 126,24 145,24 Q 164,24 166,40 Q 156,30 145,31 Q 134,30 124,40 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eyes -->
  <ellipse cx="137" cy="45" rx="3" ry="3.5" fill="#000000"/>
  <ellipse cx="153" cy="45" rx="3" ry="3.5" fill="#000000"/>
  <!-- Focused mouth -->
  <path d="M 138,57 L 152,57" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Torso upright -->
  <path d="M 126,70 Q 128,62 145,60 Q 162,62 164,70 L 162,150 L 128,150 Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left leg -->
  <path d="M 128,150 L 122,218 L 142,218 L 145,152 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right leg -->
  <path d="M 162,150 L 168,218 L 148,218 L 145,152 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left shoe -->
  <ellipse cx="132" cy="218" rx="14" ry="5" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Right shoe -->
  <ellipse cx="158" cy="218" rx="14" ry="5" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Right arm relaxed at side -->
  <path d="M 162,80 Q 186,100 188,140 L 176,142 Q 174,104 156,86 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="182" cy="144" rx="9" ry="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Left arm BENT: upper arm close to body, forearm horizontal at shoulder height (rack) -->
  <!-- Upper arm -->
  <path d="M 128,78 Q 110,88 104,104 L 114,110 Q 118,96 132,86 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Forearm horizontal at shoulder/chest height -->
  <path d="M 104,104 Q 96,104 84,106 L 84,116 Q 96,114 106,114 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Fist/hand at end of forearm -->
  <ellipse cx="84" cy="111" rx="9" ry="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Kettlebell RESTING on forearm at shoulder/rack position: bell on forearm, handle looping under wrist -->
  <!-- Bell body resting on forearm -->
  <rect x="100" y="86" width="28" height="22" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Handle arc (wraps around wrist from rack position) -->
  <path d="M 104,86 Q 104,72 114,72 Q 124,72 124,86" fill="none" stroke="#4d4d4d" stroke-width="7" stroke-linecap="round"/>
  <!-- Wrist through handle -->
  <ellipse cx="114" cy="110" rx="9" ry="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
</svg>
