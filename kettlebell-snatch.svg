  <!-- Floor -->
  <path d="M 30,218 L 260,218" stroke="#000000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Figure standing, ONE ARM raised fully overhead in lockout, kettlebell overhead -->
  <!-- Head -->
  <circle cx="145" cy="110" r="22" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Hair -->
  <path d="M 124,104 Q 126,88 145,88 Q 164,88 166,104 Q 156,94 145,95 Q 134,94 124,104 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eyes looking up toward bell -->
  <ellipse cx="138" cy="108" rx="3" ry="3.5" fill="#000000"/>
  <ellipse cx="154" cy="108" rx="3" ry="3.5" fill="#000000"/>
  <!-- Focused mouth -->
  <path d="M 139,120 L 153,120" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Torso upright, slight lean from overhead load -->
  <path d="M 128,132 Q 130,124 145,122 Q 160,124 162,132 L 160,195 L 130,195 Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left leg -->
  <path d="M 130,195 L 124,218 L 142,218 L 145,197 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right leg, slight step for balance -->
  <path d="M 160,195 L 168,218 L 148,218 L 145,197 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left shoe -->
  <ellipse cx="133" cy="218" rx="13" ry="5" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Right shoe -->
  <ellipse cx="158" cy="218" rx="13" ry="5" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Right arm (non-working) at side, slightly out for balance -->
  <path d="M 162,140 Q 188,158 192,185 L 180,188 Q 176,164 156,148 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="186" cy="188" rx="9" ry="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- LEFT ARM: raised STRAIGHT UP overhead, full lockout -->
  <!-- Upper arm from shoulder to elbow, straight up -->
  <path d="M 130,134 Q 118,110 112,80 L 122,76 Q 130,106 138,130 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Lower arm from elbow continuing straight up -->
  <path d="M 112,80 Q 108,56 108,32 L 118,32 Q 118,56 120,78 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Hand gripping bell handle overhead -->
  <ellipse cx="113" cy="30" rx="9" ry="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Kettlebell OVERHEAD in lockout: handle then bell body -->
  <path d="M 100,30 Q 100,16 113,16 Q 126,16 126,30" fill="none" stroke="#4d4d4d" stroke-width="7" stroke-linecap="round"/>
  <rect x="96" y="30" width="34" height="26" rx="7" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
</svg>
