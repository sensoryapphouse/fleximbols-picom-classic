  <defs>
    <clipPath id="bubble-clip-khm">
      <path d="M25,20 Q15,20 15,30 L15,170 Q15,180 25,180 L130,180 L145,210 L160,180 L265,180 Q275,180 275,170 L275,30 Q275,20 265,20 Z"/>
    </clipPath>
  </defs>
  <!-- Cambodia 3 bands: blue / red(wide) / blue -->
  <rect x="15" y="20" width="260" height="40" fill="#1d0e82" clip-path="url(#bubble-clip-khm)"/>
  <rect x="15" y="60" width="260" height="80" fill="#d01424" clip-path="url(#bubble-clip-khm)"/>
  <rect x="15" y="140" width="260" height="40" fill="#1d0e82" clip-path="url(#bubble-clip-khm)"/>
  <!-- Angkor Wat silhouette: small white temple -->
  <g clip-path="url(#bubble-clip-khm)">
    <!-- base platform -->
    <rect x="112" y="128" width="66" height="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <!-- middle tier -->
    <rect x="120" y="119" width="50" height="9" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <!-- 3 towers -->
    <rect x="125" y="105" width="14" height="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect x="138" y="96" width="14" height="23" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect x="151" y="105" width="14" height="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <!-- tower peaks -->
    <polygon points="132,105 139,97 146,105" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="145,96 152,86 159,96" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="158,105 165,97 172,105" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- Bubble outline -->
  <path d="M25,20 Q15,20 15,30 L15,170 Q15,180 25,180 L130,180 L145,210 L160,180 L265,180 Q275,180 275,170 L275,30 Q275,20 265,20 Z" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
