  <defs>
    <clipPath id="bubble-clip-kor">
      <path d="M25,20 Q15,20 15,30 L15,170 Q15,180 25,180 L130,180 L145,210 L160,180 L265,180 Q275,180 275,170 L275,30 Q275,20 265,20 Z"/>
    </clipPath>
  </defs>
  <!-- White background -->
  <rect x="15" y="20" width="260" height="160" fill="#ffffff" clip-path="url(#bubble-clip-kor)"/>
  <!-- Taegeuk circle: red upper, blue lower -->
  <circle cx="145" cy="100" r="45" fill="#ffffff" clip-path="url(#bubble-clip-kor)"/>
  <!-- Red half (top) -->
  <path d="M100,100 A45,45 0 0 1 190,100 Z" fill="#d01424" clip-path="url(#bubble-clip-kor)"/>
  <!-- Blue half (bottom) -->
  <path d="M100,100 A45,45 0 0 0 190,100 Z" fill="#2a4ec0" clip-path="url(#bubble-clip-kor)"/>
  <!-- Yin-yang small circles -->
  <circle cx="145" cy="77.5" r="11.25" fill="#d01424" clip-path="url(#bubble-clip-kor)"/>
  <circle cx="145" cy="77.5" r="5.5" fill="#2a4ec0" clip-path="url(#bubble-clip-kor)"/>
  <circle cx="145" cy="122.5" r="11.25" fill="#2a4ec0" clip-path="url(#bubble-clip-kor)"/>
  <circle cx="145" cy="122.5" r="5.5" fill="#d01424" clip-path="url(#bubble-clip-kor)"/>
  <!-- Taegeuk outline -->
  <circle cx="145" cy="100" r="45" fill="none" stroke="#000000" stroke-width="3" clip-path="url(#bubble-clip-kor)"/>
  <!-- Trigrams (simplified 3-bar marks) top-left -->
  <g clip-path="url(#bubble-clip-kor)" stroke="#000000" stroke-width="4" stroke-linecap="round">
    <line x1="38" y1="50" x2="58" y2="50"/>
    <line x1="38" y1="60" x2="58" y2="60"/>
    <line x1="38" y1="70" x2="58" y2="70"/>
    <!-- top-right -->
    <line x1="232" y1="50" x2="252" y2="50"/>
    <line x1="232" y1="60" x2="243" y2="60"/>
    <line x1="247" y1="60" x2="252" y2="60"/>
    <line x1="232" y1="70" x2="252" y2="70"/>
    <!-- bottom-left -->
    <line x1="38" y1="130" x2="58" y2="130"/>
    <line x1="38" y1="140" x2="49" y2="140"/>
    <line x1="47" y1="140" x2="58" y2="140"/>
    <line x1="38" y1="150" x2="58" y2="150"/>
    <!-- bottom-right -->
    <line x1="232" y1="130" x2="252" y2="130"/>
    <line x1="232" y1="140" x2="242" y2="140"/>
    <line x1="242" y1="140" x2="252" y2="140"/>
    <line x1="232" y1="150" x2="242" y2="150"/>
    <line x1="242" y1="150" x2="252" y2="150"/>
  </g>
  <!-- Bubble outline -->
  <path d="M25,20 Q15,20 15,30 L15,170 Q15,180 25,180 L130,180 L145,210 L160,180 L265,180 Q275,180 275,170 L275,30 Q275,20 265,20 Z" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
