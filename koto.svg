  <!-- Koto: long horizontal zither, long flat board, ~13 strings, movable bridges under each string -->
  <!-- Long flat board body (horizontal) -->
  <rect x="18" y="110" width="254" height="60" rx="10" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <!-- Top surface (slightly lighter) -->
  <rect x="18" y="110" width="254" height="38" rx="10" fill="#7d5e23" stroke="#000000" stroke-width="0"/>
  <!-- Re-outline -->
  <rect x="18" y="110" width="254" height="60" rx="10" fill="none" stroke="#000000" stroke-width="5"/>
  <!-- End caps / decorative ends -->
  <rect x="18" y="110" width="22" height="60" rx="10" fill="#5e1f0a" stroke="#000000" stroke-width="4"/>
  <rect x="250" y="110" width="22" height="60" rx="10" fill="#5e1f0a" stroke="#000000" stroke-width="4"/>
  <!-- 13 strings running length of the board -->
  <line x1="40" y1="114" x2="250" y2="114" stroke="#000000" stroke-width="2"/>
  <line x1="40" y1="118" x2="250" y2="118" stroke="#000000" stroke-width="2"/>
  <line x1="40" y1="122" x2="250" y2="122" stroke="#000000" stroke-width="2"/>
  <line x1="40" y1="126" x2="250" y2="126" stroke="#000000" stroke-width="2"/>
  <line x1="40" y1="130" x2="250" y2="130" stroke="#000000" stroke-width="2"/>
  <line x1="40" y1="134" x2="250" y2="134" stroke="#000000" stroke-width="2"/>
  <line x1="40" y1="138" x2="250" y2="138" stroke="#000000" stroke-width="2"/>
  <line x1="40" y1="142" x2="250" y2="142" stroke="#000000" stroke-width="2"/>
  <line x1="40" y1="146" x2="250" y2="146" stroke="#000000" stroke-width="2"/>
  <line x1="40" y1="150" x2="250" y2="150" stroke="#000000" stroke-width="0"/>
  <!-- String count label area — movable bridges (small triangular pegs under each string) -->
  <!-- Bridges: placed at varying positions (ji) -->
  <polygon points="56,148 60,138 64,148" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <polygon points="73,148 77,138 81,148" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <polygon points="89,148 93,137 97,148" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <polygon points="105,148 109,136 113,148" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <polygon points="121,148 125,136 129,148" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <polygon points="137,148 141,136 145,148" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <polygon points="153,148 157,136 161,148" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <polygon points="169,148 173,136 177,148" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <polygon points="185,148 189,137 193,148" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <polygon points="201,148 205,138 209,148" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <polygon points="217,148 221,139 225,148" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <polygon points="232,148 236,139 240,148" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <polygon points="244,148 248,140 252,148" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- Feet/legs at bottom corners -->
  <rect x="35" y="170" width="10" height="25" rx="3" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <rect x="245" y="170" width="10" height="25" rx="3" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
</svg>
