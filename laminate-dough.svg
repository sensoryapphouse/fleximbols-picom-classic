  <!-- Side-view block of laminated dough: alternating dough and butter layers -->
  <!-- Outer dough block -->
  <rect x="40" y="70" width="180" height="120" rx="6" ry="6" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Butter layer 1 -->
  <rect x="44" y="88" width="172" height="10" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <!-- Dough layer -->
  <rect x="44" y="98" width="172" height="10" fill="#f5e7c4" stroke="#000000" stroke-width="2"/>
  <!-- Butter layer 2 -->
  <rect x="44" y="108" width="172" height="10" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <!-- Dough layer -->
  <rect x="44" y="118" width="172" height="10" fill="#f5e7c4" stroke="#000000" stroke-width="2"/>
  <!-- Butter layer 3 -->
  <rect x="44" y="128" width="172" height="10" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <!-- Dough layer -->
  <rect x="44" y="138" width="172" height="10" fill="#f5e7c4" stroke="#000000" stroke-width="2"/>
  <!-- Butter layer 4 -->
  <rect x="44" y="148" width="172" height="10" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <!-- Dough layer -->
  <rect x="44" y="158" width="172" height="10" fill="#f5e7c4" stroke="#000000" stroke-width="2"/>
  <!-- Butter pat on top right (being folded in) -->
  <rect x="170" y="40" width="55" height="22" rx="3" ry="3" fill="#fff200" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Fold-in arrow (curving from butter into block) -->
  <path d="M196 64 Q205 78 230 100 Q240 116 232 130" fill="none" stroke="#d01424" stroke-width="4" stroke-linecap="round"/>
  <path d="M226 124 L232 132 L240 128" fill="none" stroke="#d01424" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Layer count label arrow on left, pointing at layers -->
  <path d="M14 130 L36 130" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 124 L38 130 L30 136" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right-side bracket showing layers -->
  <path d="M232 90 L240 90 L240 168 L232 168" fill="none" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Surface line -->
  <rect x="20" y="195" width="250" height="20" rx="4" ry="4" fill="#9d7246" stroke="#000000" stroke-width="4"/>
</svg>
