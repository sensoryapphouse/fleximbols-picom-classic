  <!-- LARGE INTESTINE (colon): thick tube in the characteristic inverted-U frame -->
  <!-- cecum (lower right) -> ascending (up right) -> hepatic flexure -> transverse (across top)
       -> splenic flexure -> descending (down left) -> sigmoid S-curve -> rectum (centre bottom). -->

  <!-- dark Classic outline (wider stroke drawn first) -->
  <path d="M 214,206 C 214,176 214,150 214,120 C 214,84 206,70 166,70 L 122,70 C 82,70 76,86 76,118 C 76,150 76,176 76,196 C 76,214 100,214 104,196 C 108,176 96,166 118,160 C 150,151 150,196 134,214"
        fill="none" stroke="#000000" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pink/mauve tube fill on top -->
  <path d="M 214,206 C 214,176 214,150 214,120 C 214,84 206,70 166,70 L 122,70 C 82,70 76,86 76,118 C 76,150 76,176 76,196 C 76,214 100,214 104,196 C 108,176 96,166 118,160 C 150,151 150,196 134,214"
        fill="none" stroke="#e58a9a" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- haustra: short cross lines giving the segmented-pouch colon look -->
  <!-- ascending colon (right vertical) -->
  <line x1="197" y1="100" x2="231" y2="100" stroke="#b85f6e" stroke-width="4" stroke-linecap="round"/>
  <line x1="197" y1="124" x2="231" y2="124" stroke="#b85f6e" stroke-width="4" stroke-linecap="round"/>
  <line x1="197" y1="148" x2="231" y2="148" stroke="#b85f6e" stroke-width="4" stroke-linecap="round"/>
  <line x1="197" y1="172" x2="231" y2="172" stroke="#b85f6e" stroke-width="4" stroke-linecap="round"/>
  <!-- transverse colon (top horizontal) -->
  <line x1="122" y1="54" x2="122" y2="86" stroke="#b85f6e" stroke-width="4" stroke-linecap="round"/>
  <line x1="146" y1="54" x2="146" y2="86" stroke="#b85f6e" stroke-width="4" stroke-linecap="round"/>
  <line x1="170" y1="54" x2="170" y2="86" stroke="#b85f6e" stroke-width="4" stroke-linecap="round"/>
  <!-- descending colon (left vertical) -->
  <line x1="59" y1="104" x2="93" y2="104" stroke="#b85f6e" stroke-width="4" stroke-linecap="round"/>
  <line x1="59" y1="128" x2="93" y2="128" stroke="#b85f6e" stroke-width="4" stroke-linecap="round"/>
  <line x1="59" y1="152" x2="93" y2="152" stroke="#b85f6e" stroke-width="4" stroke-linecap="round"/>

  <!-- subtle highlight along the upper tube -->
  <path d="M 209,118 C 209,88 203,79 166,79 L 124,79"
        fill="none" stroke="#f2b3bf" stroke-width="7" stroke-linecap="round"/>
</svg>
