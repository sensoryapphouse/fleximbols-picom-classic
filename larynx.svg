<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <g stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- larynx / voice box: bell-shaped cartilage on top of a ringed trachea -->
    <!-- thyroid cartilage (the bell / voice box body) -->
    <path d="M78 60 Q88 44 110 44 Q132 44 142 60 L150 110 Q150 128 132 132 L88 132 Q70 128 70 110 Z"
          fill="#e7a07a"/>
    <!-- laryngeal prominence notch (Adam's apple V) -->
    <path d="M98 52 L110 70 L122 52" fill="none" stroke="#9c5b3a" stroke-width="4"/>
    <!-- two small horns at top -->
    <path d="M82 56 Q76 44 80 36" fill="none" stroke="#000000" stroke-width="5"/>
    <path d="M138 56 Q144 44 140 36" fill="none" stroke="#000000" stroke-width="5"/>
    <!-- trachea: stack of cartilage rings -->
    <g fill="#e7b48f">
      <rect x="82" y="136" width="56" height="14" rx="7"/>
      <rect x="82" y="154" width="56" height="14" rx="7"/>
      <rect x="82" y="172" width="56" height="14" rx="7"/>
      <rect x="82" y="190" width="56" height="14" rx="7"/>
    </g>
    <!-- sound waves emanating to the right (voice) -->
    <g fill="none" stroke="#3b6fb0" stroke-width="6">
      <path d="M168 76 Q188 96 168 116"/>
      <path d="M188 64 Q220 96 188 128"/>
      <path d="M208 52 Q252 96 208 140"/>
    </g>
  </g>
</svg>
