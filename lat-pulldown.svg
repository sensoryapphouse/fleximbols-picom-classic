<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Lat pulldown machine: overhead frame + high pulley + wide bar -->
  <!-- Overhead frame crossbar -->
  <rect x="30" y="20" width="230" height="12" rx="5" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left upright -->
  <rect x="30" y="20" width="14" height="160" rx="4" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right upright -->
  <rect x="246" y="20" width="14" height="160" rx="4" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Pulley at top center -->
  <circle cx="145" cy="24" r="10" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Wide lat-pulldown bar (long, horizontal) -->
  <rect x="50" y="68" width="190" height="10" rx="5" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Angled grips at bar ends -->
  <rect x="40" y="62" width="18" height="22" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="232" y="62" width="18" height="22" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Cable from pulley to bar center -->
  <line x1="145" y1="34" x2="145" y2="72" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Knee pad (thigh restraint) -->
  <rect x="108" y="182" width="74" height="16" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Machine seat -->
  <rect x="108" y="164" width="74" height="20" rx="5" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Seat support post -->
  <rect x="136" y="184" width="18" height="28" rx="4" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Figure: seated, torso upright, arms raised wide gripping bar ends -->
  <!-- Legs: thighs under knee pad, shins down -->
  <!-- Left thigh (under pad) -->
  <path d="M112 178 Q96 178 80 174" stroke="#000000" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M80 174 Q70 194 68 210" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <ellipse cx="60" cy="216" rx="16" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Right thigh -->
  <path d="M178 178 Q194 178 210 174" stroke="#000000" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M210 174 Q220 194 222 210" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <ellipse cx="230" cy="216" rx="16" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Torso: upright, seated -->
  <path d="M122 124 Q145 116 168 124 L172 164 Q145 168 118 164 Z" fill="#d01424" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="145" cy="102" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M126 94 Q128 80 145 78 Q162 80 164 94 Q156 85 145 86 Q134 85 126 94 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Arms raised wide, pulling bar DOWN toward chest -->
  <!-- Left arm up and out to left grip -->
  <path d="M122 132 Q90 108 52 76" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Right arm up and out to right grip -->
  <path d="M168 132 Q200 108 238 76" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Hands on grips -->
  <circle cx="52" cy="76" r="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <circle cx="238" cy="76" r="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
</svg>
