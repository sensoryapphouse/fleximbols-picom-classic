  <!-- floor -->
  <rect x="0" y="215" width="290" height="25" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <!-- prosecutor FULL BODY left, pointing right at evidence -->
  <!-- legs -->
  <rect x="38" y="158" width="12" height="58" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <rect x="54" y="158" width="12" height="58" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <ellipse cx="44" cy="218" rx="10" ry="4.5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="60" cy="218" rx="10" ry="4.5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- suit (dark grey to distinguish from green defense) -->
  <path d="M22 105 L86 105 L90 162 L18 162 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- white shirt + red tie -->
  <path d="M46 105 L62 105 L64 148 L44 148 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M50 107 L58 107 L60 145 L54 152 L48 145 Z" fill="#d01424" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- left arm down holding briefcase -->
  <path d="M22 108 L10 162 L18 165 L32 115 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="14" cy="166" r="6" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <rect x="0" y="168" width="34" height="26" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="10" y="160" width="14" height="10" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- right arm pointing forward toward evidence -->
  <path d="M86 108 L160 108 L160 122 L86 124 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- hand pointing index finger -->
  <circle cx="165" cy="115" r="6" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <path d="M165 113 L185 113 L185 117 L165 117 Z" fill="#eed5b6" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="54" cy="88" r="17" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <path d="M37 86 Q54 70 71 86 L71 78 Q54 64 37 78 Z" fill="#4d4d4d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="49" cy="90" r="1.6" fill="#000000"/>
  <circle cx="59" cy="90" r="1.6" fill="#000000"/>
  <!-- stern mouth -->
  <path d="M48 98 L60 96" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- evidence table on right: knife or bag (use bag) -->
  <rect x="190" y="160" width="86" height="50" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- evidence bag (clear/grey) on table -->
  <path d="M204 130 L262 130 L268 162 L198 162 Z" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- evidence tag -->
  <rect x="215" y="125" width="36" height="10" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <!-- bag fold/handle -->
  <path d="M220 130 L220 122 L246 122 L246 130" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- item inside bag (knife silhouette) -->
  <path d="M212 152 L255 142 L258 148 L215 158 Z" fill="#b8b8b8" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="252" y="140" width="10" height="10" fill="#5e1f0a" stroke="#000000" stroke-width="2" transform="rotate(-12 257 145)"/>
  <!-- GUILTY indicator: red stamp top-right -->
  <rect x="200" y="22" width="80" height="34" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round" transform="rotate(-6 240 39)"/>
  <!-- thick X mark inside stamp (guilt indicator) -->
  <path d="M212 32 L268 52 M268 32 L212 52" stroke="#ffffff" stroke-width="5" stroke-linecap="round" transform="rotate(-6 240 42)"/>
  <!-- exclamation indicator below stamp -->
  <path d="M260 70 L260 90" stroke="#d01424" stroke-width="6" stroke-linecap="round"/>
  <circle cx="260" cy="100" r="4" fill="#d01424" stroke="#000000" stroke-width="2"/>
</svg>
