  <!-- Grey heavy aura (exhaustion cloud) — drawn as soft shapes, no opacity/filter -->
  <ellipse cx="148" cy="155" rx="100" ry="65" fill="#b8b8b8" stroke="#7f7f7f" stroke-width="4"/>
  <!-- Slumped figure: seated/slouched, dragging feet -->
  <!-- Left leg dragging forward -->
  <path d="M 108,170 L 80,205 Q 76,215 85,218 Q 94,220 100,210 L 128,178 Z" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right leg half-dragging -->
  <path d="M 135,172 L 152,205 Q 156,215 165,212 Q 174,208 170,198 L 152,170 Z" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left dragging foot (barely off ground) -->
  <ellipse cx="86" cy="218" rx="20" ry="8" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Right dragging foot -->
  <ellipse cx="163" cy="214" rx="20" ry="8" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Torso (slumped forward, rounded) -->
  <path d="M 100,130 Q 108,118 128,118 Q 155,118 168,128 L 168,170 Q 155,180 128,180 Q 108,178 100,168 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left arm hanging down limply -->
  <path d="M 104,135 L 78,170 Q 73,178 80,183 Q 87,186 92,178 L 115,148 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right arm hanging down limply -->
  <path d="M 164,135 L 190,170 Q 196,178 189,183 Q 182,186 177,178 L 152,148 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left hand -->
  <circle cx="80" cy="183" r="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right hand -->
  <circle cx="189" cy="183" r="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head drooping forward/down -->
  <circle cx="138" cy="96" r="26" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M 115,88 Q 118,68 138,68 Q 158,68 161,88" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- HEAVY drooping eyelids — upper lid covers most of eye -->
  <!-- Left eye: white, mostly covered by drooping lid -->
  <ellipse cx="128" cy="96" rx="9" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <path d="M 119,93 Q 128,88 137,93" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right eye -->
  <ellipse cx="148" cy="96" rx="9" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <path d="M 139,93 Q 148,88 157,93" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Downturned tired mouth -->
  <path d="M 128,108 Q 138,104 148,108" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Small heavy downward arrows on aura to convey weight/tiredness -->
  <polygon points="128,195 122,185 134,185" fill="#7f7f7f" stroke="none"/>
  <polygon points="150,200 144,190 156,190" fill="#7f7f7f" stroke="none"/>
  <polygon points="170,196 164,186 176,186" fill="#7f7f7f" stroke="none"/>
</svg>
