<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Box being lifted overhead -->
  <rect x="105" y="10" width="80" height="58" rx="6" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Box detail lines -->
  <line x1="145" y1="10" x2="145" y2="68" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="39" x2="185" y2="39" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Effort lines around box -->
  <line x1="98" y1="18" x2="82" y2="10" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
  <line x1="93" y1="30" x2="75" y2="28" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
  <line x1="192" y1="18" x2="208" y2="10" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
  <line x1="197" y1="30" x2="215" y2="28" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>

  <!-- Figure squatting and pushing box up -->
  <!-- Head -->
  <circle cx="145" cy="100" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="138" cy="97" r="3" fill="#000000"/>
  <circle cx="152" cy="97" r="3" fill="#000000"/>
  <!-- Effort expression / gritted teeth -->
  <path d="M137 108 L153 108" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Torso (leaning slightly) -->
  <rect x="127" y="122" width="36" height="40" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Arms reaching up to box -->
  <!-- Left arm -->
  <path d="M127 128 L110 90 L115 70" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M127 128 L110 90 L115 70" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm -->
  <path d="M163 128 L180 90 L175 70" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M163 128 L180 90 L175 70" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hands on box -->
  <circle cx="115" cy="70" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <circle cx="175" cy="70" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>

  <!-- Squatting legs (bent wide) -->
  <!-- Left leg -->
  <path d="M133 162 L112 192 L98 220" fill="none" stroke="#4d4d4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M133 162 L112 192 L98 220" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right leg -->
  <path d="M157 162 L178 192 L192 220" fill="none" stroke="#4d4d4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M157 162 L178 192 L192 220" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Feet -->
  <ellipse cx="96" cy="222" rx="16" ry="8" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="194" cy="222" rx="16" ry="8" fill="#000000" stroke="#000000" stroke-width="3"/>

  <!-- Upward arrow showing motion -->
  <line x1="50" y1="120" x2="50" y2="55" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <polygon points="50,40 40,62 60,62" fill="#f8130d" stroke="#f8130d" stroke-width="2" stroke-linejoin="round"/>
</svg>
