  <ellipse cx="120" cy="116" rx="22" ry="16" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="170" cy="140" rx="18" ry="14" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Heart in centre of globe -->
  <path d="M145 124 c0-7 -10-7 -10 0 c0 7 10 14 10 14 c0 0 10-7 10-14 c0-7 -10-7 -10 0" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Dotted connection line from left figure to right figure -->
