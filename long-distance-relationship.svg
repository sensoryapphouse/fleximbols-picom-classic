  <ellipse cx="145" cy="128" rx="72" ry="52" fill="none" stroke="#90a7d6" stroke-width="2"/>
  <!-- Globe longitude line (vertical) -->
  <line x1="145" y1="56" x2="145" y2="200" stroke="#90a7d6" stroke-width="3"/>
  <!-- Globe outline (re-draw on top) -->
  <circle cx="145" cy="128" r="72" fill="none" stroke="#000000" stroke-width="5"/>
