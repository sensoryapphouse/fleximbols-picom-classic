  <!-- Neck -->
  <rect x="127" y="188" width="36" height="28" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Head - upright, scanning -->
  <ellipse cx="145" cy="118" rx="78" ry="82" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair -->
  <ellipse cx="145" cy="58" rx="78" ry="30" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <!-- Left eye - wide alert, pupil shifted left -->
  <ellipse cx="112" cy="108" rx="17" ry="15" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="104" cy="108" r="9" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <circle cx="100" cy="104" r="3" fill="#ffffff"/>
  <!-- Right eye - wide alert, pupil shifted right -->
  <ellipse cx="178" cy="108" rx="17" ry="15" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="186" cy="108" r="9" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <circle cx="182" cy="104" r="3" fill="#ffffff"/>
  <!-- Eyebrows raised alert -->
  <path d="M95 88 Q112 80 129 88" fill="none" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <path d="M161 88 Q178 80 195 88" fill="none" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="145" cy="138" rx="11" ry="8" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <circle cx="139" cy="140" r="4" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <circle cx="151" cy="140" r="4" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- Mouth - slightly open, attentive -->
  <path d="M130 162 Q145 170 160 162" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Double-sided curved arrows left and right (scanning motion) -->
  <!-- Left curved arrow -->
  <path d="M48 118 Q36 100 48 82" fill="none" stroke="#f8130d" stroke-width="6" stroke-linecap="round"/>
  <polygon points="44,78 38,92 54,88" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="52,122 38,116 44,130" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right curved arrow -->
  <path d="M242 118 Q254 100 242 82" fill="none" stroke="#f8130d" stroke-width="6" stroke-linecap="round"/>
  <polygon points="246,78 252,92 236,88" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="238,122 252,116 246,130" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
</svg>
