  <!-- Neck -->
  <rect x="127" y="188" width="36" height="28" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Head - tilted forward/downward -->
  <ellipse cx="145" cy="118" rx="78" ry="82" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair - more visible on top since head tilted down -->
  <ellipse cx="145" cy="60" rx="78" ry="36" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <!-- Left eye - pupils directed DOWN -->
  <ellipse cx="112" cy="108" rx="17" ry="15" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <!-- Pupil shifted downward in eye socket -->
  <circle cx="112" cy="116" r="9" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <circle cx="108" cy="113" r="3" fill="#ffffff"/>
  <!-- Right eye - pupils directed DOWN -->
  <ellipse cx="178" cy="108" rx="17" ry="15" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="178" cy="116" r="9" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <circle cx="174" cy="113" r="3" fill="#ffffff"/>
  <!-- Eyebrows - lowered/furrowed looking down -->
  <path d="M95 90 Q112 96 129 90" fill="none" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <path d="M161 90 Q178 96 195 90" fill="none" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="145" cy="138" rx="11" ry="8" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <circle cx="139" cy="140" r="4" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <circle cx="151" cy="140" r="4" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- Mouth - neutral -->
  <path d="M128 162 Q145 168 162 162" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Sight line / arrow pointing downward -->
  <line x1="145" y1="205" x2="145" y2="228" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <polygon points="145,236 133,222 157,222" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
</svg>
