  <!-- Head tilted upward - shift oval up and tilt -->
  <!-- Neck -->
  <rect x="127" y="188" width="36" height="30" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Head - tilted back slightly -->
  <ellipse cx="145" cy="145" rx="78" ry="80" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair -->
  <ellipse cx="145" cy="88" rx="78" ry="30" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <!-- Chin/jaw highlight — face tilted up shows more forehead -->
  <!-- Left eye - pupils directed UP -->
  <ellipse cx="112" cy="138" rx="17" ry="15" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <!-- Pupil shifted upward in eye socket -->
  <circle cx="112" cy="131" r="9" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <circle cx="108" cy="128" r="3" fill="#ffffff"/>
  <!-- Right eye - pupils directed UP -->
  <ellipse cx="178" cy="138" rx="17" ry="15" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="178" cy="131" r="9" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <circle cx="174" cy="128" r="3" fill="#ffffff"/>
  <!-- Eyebrows raised - looking up -->
  <path d="M95 120 Q112 110 129 118" fill="none" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <path d="M161 118 Q178 110 195 120" fill="none" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <!-- Nose (chin tilted up, nose more visible) -->
  <ellipse cx="145" cy="160" rx="11" ry="8" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <circle cx="139" cy="162" r="4" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <circle cx="151" cy="162" r="4" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- Mouth - neutral/slightly open, looking up -->
  <path d="M128 182 Q145 188 162 182" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Sight line / arrow pointing upward -->
  <line x1="145" y1="62" x2="145" y2="22" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <polygon points="145,12 133,28 157,28" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
</svg>
