  <!-- Person figure with sad expression and open hands -->
  <!-- Head -->
  <circle cx="145" cy="52" r="28" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Sad mouth -->
  <path d="M133,60 Q145,52 157,60" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes (downcast) -->
  <circle cx="136" cy="46" r="4" fill="#000000"/>
  <circle cx="154" cy="46" r="4" fill="#000000"/>
  <!-- Eyebrows (sad angle) -->
  <line x1="130" y1="38" x2="142" y2="42" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="148" y1="42" x2="160" y2="38" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="118" y="80" width="54" height="55" rx="10" fill="#2a4ec0" stroke="#000000" stroke-width="5"/>
  <!-- Arms outstretched, palms up (empty hands) -->
  <!-- Left arm -->
  <line x1="118" y1="95" x2="68" y2="118" stroke="#eed5b6" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="60" cy="124" rx="14" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4" transform="rotate(-20 60 124)"/>
  <!-- Right arm -->
  <line x1="172" y1="95" x2="222" y2="118" stroke="#eed5b6" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="230" cy="124" rx="14" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4" transform="rotate(20 230 124)"/>
  <!-- Legs -->
  <line x1="133" y1="135" x2="120" y2="190" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="157" y1="135" x2="170" y2="190" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Poof cloud where object was (right side) with question mark symbol (drawn) -->
  <!-- Poof cloud -->
  <ellipse cx="220" cy="65" rx="30" ry="20" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <circle cx="200" cy="60" r="14" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <circle cx="235" cy="58" r="12" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <circle cx="218" cy="52" r="13" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- Question mark drawn as path (no text) -->
  <path d="M212,52 Q212,43 220,43 Q228,43 228,52 Q228,60 220,62" fill="none" stroke="#4d4d4d" stroke-width="4" stroke-linecap="round"/>
  <circle cx="220" cy="69" r="3" fill="#4d4d4d"/>
</svg>
