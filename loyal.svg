  <!-- Loyal: person beside faithful dog, hand on dog, heart linking them -->
  <!-- === PERSON (left side) === -->
  <!-- Person head -->
  <circle cx="80" cy="55" r="28" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Person eyes -->
  <ellipse cx="70" cy="50" rx="5" ry="5.5" fill="#000000"/>
  <ellipse cx="90" cy="50" rx="5" ry="5.5" fill="#000000"/>
  <circle cx="72" cy="48" r="1.5" fill="#ffffff"/>
  <circle cx="92" cy="48" r="1.5" fill="#ffffff"/>
  <!-- Eyebrows -->
  <path d="M63 43 Q70 39 77 43" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M83 43 Q90 39 97 43" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Warm smile -->
  <path d="M69 63 Q80 72 91 63" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Person neck -->
  <rect x="73" y="81" width="14" height="12" rx="3" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Person torso -->
  <path d="M46 92 Q52 83 72 84 L88 84 Q108 83 114 92 L120 174 L40 174 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Person left arm (down) -->
  <path d="M47 96 Q30 110 28 132" fill="none" stroke="#eed5b6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M47 96 Q30 110 28 132" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="28" cy="139" rx="10" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Person right arm: extended, hand on dog's back -->
  <path d="M113 96 Q138 100 154 110" fill="none" stroke="#eed5b6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M113 96 Q138 100 154 110" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hand on dog -->
  <ellipse cx="158" cy="114" rx="12" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Person legs -->
  <rect x="58" y="172" width="20" height="44" rx="7" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <rect x="82" y="172" width="20" height="44" rx="7" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <ellipse cx="68" cy="217" rx="15" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="92" cy="217" rx="15" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- === DOG (right side) === -->
  <!-- Dog body -->
  <ellipse cx="210" cy="158" rx="44" ry="30" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Dog head -->
  <circle cx="248" cy="128" r="26" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Dog snout -->
  <ellipse cx="260" cy="136" rx="14" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Dog nose -->
  <ellipse cx="260" cy="131" rx="6" ry="5" fill="#000000"/>
  <!-- Dog eye -->
  <circle cx="248" cy="122" r="5" fill="#000000"/>
  <circle cx="250" cy="120" r="1.5" fill="#ffffff"/>
  <!-- Dog ear (floppy) -->
  <path d="M228 112 Q218 102 222 122 Q224 128 234 122 Z" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dog tail (wagging) -->
  <path d="M168 148 Q152 130 158 114 Q162 104 172 112" fill="none" stroke="#e6b98a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M168 148 Q152 130 158 114 Q162 104 172 112" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dog legs (4) -->
  <rect x="182" y="182" width="14" height="36" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <rect x="202" y="184" width="14" height="34" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <rect x="220" y="184" width="14" height="34" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <rect x="238" y="182" width="14" height="36" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- Dog mouth / happy panting tongue -->
  <path d="M252 138 Q256 145 260 138" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="256" cy="144" rx="6" ry="8" fill="#f266aa" stroke="#000000" stroke-width="3"/>
  <!-- Heart linking person and dog (center) -->
  <path d="M136 82 Q136 72 145 79 Q154 72 154 82 Q154 94 145 102 Q136 94 136 82 Z" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
