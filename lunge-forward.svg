  <!-- Floor -->
  <path d="M 30,218 L 260,218" stroke="#000000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Movement arrow pointing forward (left) -->
  <path d="M 210,210 L 180,210" stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 183,206 L 178,210 L 183,214" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Back leg: straight, extending behind figure (right side) -->
  <!-- Back thigh (angled back and down) -->
  <path d="M 152,148 Q 182,158 208,168 L 204,180 Q 178,172 146,160 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Back shin (nearly vertical down from hip) -->
  <path d="M 208,168 L 212,218 L 192,218 L 190,176 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Back foot -->
  <ellipse cx="202" cy="218" rx="14" ry="6" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Front leg: bent, stepped forward (left side, knee over ankle) -->
  <!-- Front thigh (angled forward and down) -->
  <path d="M 136,148 Q 112,158 88,178 L 102,186 Q 122,168 140,158 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Front shin (vertical) -->
  <path d="M 88,178 L 84,218 L 108,218 L 106,182 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Front foot -->
  <ellipse cx="96" cy="218" rx="16" ry="6" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Torso (upright) -->
  <path d="M 132,90 Q 134,82 148,80 Q 162,82 163,90 L 161,148 L 134,148 Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left arm swung back (opposite to front leg) -->
  <path d="M 161,106 Q 178,120 192,138" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 163,104 Q 180,118 194,136 L 188,142 Q 174,124 159,110 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="192" cy="140" r="9" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right arm swung forward -->
  <path d="M 134,106 Q 118,120 104,138" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 132,104 Q 116,118 102,136 L 108,142 Q 122,124 136,110 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="104" cy="140" r="9" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Head -->
  <circle cx="148" cy="56" r="23" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Hair -->
  <path d="M 126,49 Q 128,33 148,33 Q 168,33 170,49 Q 161,39 148,40 Q 135,39 126,49 Z" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eyes -->
  <ellipse cx="140" cy="54" rx="3" ry="3.5" fill="#000000"/>
  <ellipse cx="156" cy="54" rx="3" ry="3.5" fill="#000000"/>
  <!-- Focused mouth -->
  <path d="M 141,66 L 155,66" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
