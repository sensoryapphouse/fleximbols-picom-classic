  <path d="M 164,104 Q 180,118 192,138 L 186,144 Q 174,124 160,110 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="190" cy="142" r="9" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right arm back -->
  <path d="M 130,106 Q 116,120 106,140" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
