  <path d="M 108,172 L 104,218 L 126,218 L 124,176 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Front foot (planted) -->
  <ellipse cx="115" cy="218" rx="16" ry="6" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Back leg: knee bent behind figure, knee near ground (right side steps back) -->
  <!-- Back thigh (angled backward and down) -->
  <path d="M 152,148 Q 182,162 206,176 L 200,188 Q 176,175 146,160 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
