  <!-- Back knee cap detail -->
  <circle cx="204" cy="185" r="8" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Back foot/toe pointing down -->
  <ellipse cx="236" cy="180" rx="12" ry="6" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Torso (upright) -->
  <path d="M 128,90 Q 130,82 145,80 Q 160,82 162,90 L 160,148 L 130,148 Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
