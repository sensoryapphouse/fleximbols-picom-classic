  <!-- Floor -->
  <path d="M 30,218 L 260,218" stroke="#000000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Movement arrow pointing backward (right) -->
  <path d="M 76,210 L 106,210" stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 103,206 L 108,210 L 103,214" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front leg: straight, planted forward (left side) -->
  <!-- Front thigh (mostly vertical, knee slightly bent) -->
  <path d="M 130,148 Q 116,155 108,172 L 122,178 Q 128,164 140,158 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
