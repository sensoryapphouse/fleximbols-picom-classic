  <circle cx="145" cy="56" r="23" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Hair -->
  <path d="M 123,49 Q 125,33 145,33 Q 165,33 167,49 Q 158,39 145,40 Q 132,39 123,49 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
