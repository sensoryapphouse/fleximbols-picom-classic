  <!-- Hair -->
  <path d="M 126,51 Q 128,35 148,35 Q 168,35 170,51 Q 161,41 148,42 Q 135,41 126,51 Z" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
