  <path d="M 220,164 L 224,218 L 204,218 L 202,170 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right foot -->
  <ellipse cx="213" cy="218" rx="16" ry="6" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Left leg (straight, weight on right): thigh pointing left, leg straight -->
  <path d="M 130,148 Q 102,154 72,160 L 70,172 Q 100,167 132,160 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
