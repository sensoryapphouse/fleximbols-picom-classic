  <!-- Floor -->
  <path d="M 20,218 L 270,218" stroke="#000000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Lateral movement arrow (pointing right) -->
  <path d="M 248,210 L 268,210" stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 265,206 L 270,210 L 265,214" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right leg (bent, stepped to side): thigh angled right and down -->
  <path d="M 158,148 Q 190,152 220,164 L 216,178 Q 186,168 152,162 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
