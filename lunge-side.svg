  <!-- Right arm out to side for balance -->
  <path d="M 164,108 Q 180,108 198,106" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 166,106 Q 182,106 200,104 L 200,114 Q 182,116 164,116 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="202" cy="109" r="9" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
