  <path d="M 72,160 L 68,218 L 88,218 L 86,162 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left foot -->
  <ellipse cx="78" cy="218" rx="14" ry="6" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Torso (leaning slightly toward bent leg) -->
  <path d="M 130,92 Q 132,84 148,82 Q 164,84 164,92 L 162,148 L 132,148 Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left arm reaching toward bent knee for balance -->
  <path d="M 132,108 Q 130,128 126,148" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 130,106 Q 128,126 122,148 L 130,152 Q 136,130 138,108 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
