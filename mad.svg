  <path d="M 125 134 Q 145 127 165 134" fill="#ffffff" stroke="none"/>
  <!-- Cheek flush - mild anger pink/red -->
  <ellipse cx="94" cy="112" rx="12" ry="8" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="196" cy="112" rx="12" ry="8" fill="#f4a4b2" stroke="none"/>
