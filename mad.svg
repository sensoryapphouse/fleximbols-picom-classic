  <!-- Shoulders -->
  <path d="M 48 240 Q 48 185 145 185 Q 242 185 242 240" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="120" y="158" width="50" height="30" rx="8" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Head - slightly warm toned for mild anger -->
  <ellipse cx="145" cy="98" rx="72" ry="73" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M 73 86 Q 78 20 145 18 Q 212 20 217 86 Q 200 44 145 42 Q 90 44 73 86 Z" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Left brow - lowered, angled inward (anger) -->
  <path d="M 88 66 Q 105 74 124 68" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Right brow - lowered, angled inward -->
  <path d="M 166 68 Q 185 74 202 66" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Left eye - narrowed -->
  <ellipse cx="110" cy="90" rx="17" ry="11" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="110" cy="90" r="7" fill="#4d4d4d"/>
  <circle cx="113" cy="87" r="2.5" fill="#ffffff"/>
  <!-- Right eye - narrowed -->
  <ellipse cx="180" cy="90" rx="17" ry="11" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="180" cy="90" r="7" fill="#4d4d4d"/>
  <circle cx="183" cy="87" r="2.5" fill="#ffffff"/>
  <!-- Angry frown - down-turned mouth -->
  <path d="M 110 138 Q 145 128 180 138" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
