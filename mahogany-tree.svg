  <rect x="133" y="100" width="24" height="65" rx="4" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Broad dense canopy — large multi-layered ellipses -->
  <ellipse cx="145" cy="90" rx="110" ry="75" fill="#137827" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Inner canopy detail — darker green areas -->
