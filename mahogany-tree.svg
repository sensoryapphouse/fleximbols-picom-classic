  <!-- Trunk — RED-BROWN, broad and tall -->
  <rect x="123" y="155" width="44" height="65" rx="5" fill="#5e1f0a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Trunk highlights (bark texture bands) -->
  <rect x="129" y="162" width="32" height="5" rx="2" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <rect x="129" y="178" width="32" height="5" rx="2" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <rect x="129" y="194" width="32" height="5" rx="2" fill="#9d7246" stroke="#000000" stroke-width="2"/>
