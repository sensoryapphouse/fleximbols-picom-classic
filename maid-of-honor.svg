  <!-- floor -->
  <rect x="20" y="220" width="250" height="6" fill="#eed5b6" stroke="#000000" stroke-width="2"/>

  <!-- BRIDE on right (faded white dress, just to give context) -->
  <!-- bride legs hidden by dress -->
  <path d="M186,100 L222,100 L242,210 L168,210 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- sash bride -->
  <rect x="170" y="135" width="70" height="5" fill="#dff3fd" stroke="#000000" stroke-width="1.5"/>
  <!-- bride head -->
  <circle cx="204" cy="80" r="18" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- veil -->
  <path d="M186,73 L184,110 L224,110 L222,73 C222,73 215,62 204,62 C193,62 186,73 186,73 Z" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="204" cy="82" r="16" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <path d="M190,77 C195,68 213,68 218,77 C216,73 210,69 204,69 C198,69 192,73 190,77 Z" fill="#7d5e23" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="199" cy="82" r="1.8" fill="#000000"/>
  <circle cx="209" cy="82" r="1.8" fill="#000000"/>
  <path d="M199,88 Q204,91 209,88" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- bride bouquet (small) -->
  <circle cx="178" cy="148" r="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="175" cy="146" r="4" fill="#f4a4b2" stroke="#000000" stroke-width="1.5"/>
  <circle cx="181" cy="146" r="4" fill="#f4a4b2" stroke="#000000" stroke-width="1.5"/>

  <!-- MAID OF HONOR — front-and-center, FULL BODY, in matching dress -->
  <!-- dress -->
  <path d="M75,105 L125,105 L142,210 L58,210 Z" fill="#7c3fac" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- bodice highlight -->
  <path d="M75,105 L125,105 L124,135 L76,135 Z" fill="#392170" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- sash -->
  <rect x="58" y="142" width="84" height="8" fill="#f266aa" stroke="#000000" stroke-width="2"/>
  <!-- feet peek -->
  <ellipse cx="80" cy="213" rx="8" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="120" cy="213" rx="8" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- arms -->
  <rect x="62" y="108" width="13" height="55" fill="#7c3fac" stroke="#000000" stroke-width="3" transform="rotate(12 68 135)"/>
  <rect x="125" y="108" width="13" height="55" fill="#7c3fac" stroke="#000000" stroke-width="3" transform="rotate(-15 131 135)"/>
  <!-- hands -->
  <circle cx="78" cy="170" r="6" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <circle cx="118" cy="170" r="6" fill="#eed5b6" stroke="#000000" stroke-width="2"/>

  <!-- bouquet in front held by both hands -->
  <circle cx="98" cy="170" r="18" fill="#f266aa" stroke="#000000" stroke-width="3"/>
  <circle cx="90" cy="166" r="7" fill="#d01424" stroke="#000000" stroke-width="2"/>
  <circle cx="106" cy="166" r="7" fill="#d01424" stroke="#000000" stroke-width="2"/>
  <circle cx="98" cy="158" r="7" fill="#f4a4b2" stroke="#000000" stroke-width="2"/>
  <circle cx="92" cy="176" r="6" fill="#f4a4b2" stroke="#000000" stroke-width="2"/>
  <circle cx="105" cy="178" r="6" fill="#d01424" stroke="#000000" stroke-width="2"/>
  <!-- bouquet stems wrap -->
  <rect x="93" y="186" width="12" height="14" fill="#f7de58" stroke="#000000" stroke-width="2"/>

  <!-- head -->
  <circle cx="100" cy="80" r="22" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair (longer) -->
  <path d="M78,80 C76,55 124,55 122,80 L124,108 L118,108 L118,90 C118,80 110,75 100,75 C90,75 82,80 82,90 L82,108 L76,108 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- face -->
  <circle cx="93" cy="83" r="2" fill="#000000"/>
  <circle cx="107" cy="83" r="2" fill="#000000"/>
  <path d="M94,91 Q100,95 106,91" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- earring/cheek -->
  <circle cx="115" cy="85" r="2" fill="#fff200" stroke="#000000" stroke-width="1.5"/>
