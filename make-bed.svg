  <!-- Bed frame -->
  <rect x="30" y="130" width="230" height="80" rx="6" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Mattress base -->
  <rect x="40" y="120" width="210" height="20" rx="4" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Duvet/blanket being pulled over -->
  <rect x="40" y="75" width="210" height="65" rx="8" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Duvet fold lines -->
  <line x1="70" y1="85" x2="70" y2="135" stroke="#90a7d6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="110" y1="80" x2="110" y2="138" stroke="#90a7d6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="150" y1="78" x2="150" y2="140" stroke="#90a7d6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="190" y1="80" x2="190" y2="138" stroke="#90a7d6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="220" y1="85" x2="220" y2="135" stroke="#90a7d6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pillow left -->
  <rect x="52" y="55" width="72" height="42" rx="10" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Pillow right -->
  <rect x="166" y="55" width="72" height="42" rx="10" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Headboard -->
  <rect x="30" y="40" width="230" height="22" rx="6" fill="#7d5e23" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Figure standing right of bed smoothing duvet -->
  <!-- Head -->
  <circle cx="255" cy="60" r="16" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Body -->
  <rect x="243" y="78" width="24" height="38" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left arm reaching over duvet -->
  <line x1="243" y1="85" x2="200" y2="110" stroke="#eed5b6" stroke-width="7" stroke-linecap="round"/>
  <!-- Right arm reaching over duvet -->
  <line x1="267" y1="85" x2="240" y2="115" stroke="#eed5b6" stroke-width="7" stroke-linecap="round"/>
  <!-- Hands on duvet -->
  <circle cx="200" cy="112" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <circle cx="240" cy="117" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Legs -->
  <line x1="249" y1="116" x2="249" y2="155" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <line x1="261" y1="116" x2="261" y2="155" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <!-- Smoothing arrow on duvet -->
  <path d="M170 92 Q155 88 140 92" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <polygon points="140,92 146,86 146,98" fill="#000000"/>
