  <!-- Room background -->
  <rect x="22" y="22" width="246" height="196" rx="8" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Ceiling band -->
  <rect x="22" y="22" width="246" height="26" rx="8" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Floor -->
  <line x1="22" y1="198" x2="268" y2="198" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Workbench surface -->
  <rect x="30" y="152" width="230" height="16" rx="5" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Bench legs -->
  <rect x="34" y="168" width="12" height="30" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="244" y="168" width="12" height="30" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="136" y="168" width="12" height="30" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- 3D PRINTER (right side of bench) -->
  <!-- Printer frame -->
  <rect x="188" y="88" width="58" height="64" rx="5" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Printer bed -->
  <rect x="194" y="132" width="46" height="8" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Print head rail -->
  <line x1="194" y1="108" x2="240" y2="108" stroke="#efefef" stroke-width="4" stroke-linecap="round"/>
  <!-- Print head -->
  <rect x="211" y="102" width="14" height="14" rx="3" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Filament nozzle -->
  <line x1="218" y1="116" x2="218" y2="122" stroke="#ff9900" stroke-width="4" stroke-linecap="round"/>
  <!-- Object being printed -->
  <rect x="210" y="120" width="16" height="12" rx="2" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Spool of filament on side -->
  <circle cx="200" cy="100" r="10" fill="#7c3fac" stroke="#000000" stroke-width="4"/>
  <circle cx="200" cy="100" r="4" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <!-- Printer label panel -->
  <rect x="226" y="92" width="14" height="10" rx="2" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- TOOLS on bench surface -->
  <!-- Hammer -->
  <rect x="38" y="138" width="8" height="26" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="30" y="132" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Screwdriver -->
  <rect x="60" y="134" width="5" height="22" rx="2" fill="#ff9900" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="60,155 65,155 63,163" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Wrench -->
  <rect x="76" y="136" width="5" height="20" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M74,136 Q78,128 82,136" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Circuit board / parts -->
  <rect x="98" y="138" width="30" height="18" rx="3" fill="#529929" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="104" cy="144" r="3" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <circle cx="112" cy="144" r="3" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <circle cx="120" cy="144" r="3" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <line x1="104" y1="147" x2="104" y2="155" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="112" y1="147" x2="112" y2="155" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="147" x2="120" y2="155" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- Wall-mounted tool rack -->
  <rect x="30" y="52" width="148" height="10" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
