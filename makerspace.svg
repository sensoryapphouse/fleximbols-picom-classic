  <line x1="85" y1="62" x2="85" y2="88" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="93" y1="62" x2="93" y2="88" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M85,80 Q89,76 93,80" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Ruler -->
  <rect x="108" y="62" width="8" height="30" rx="2" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <line x1="109" y1="68" x2="115" y2="68" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="109" y1="74" x2="115" y2="74" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="109" y1="80" x2="115" y2="80" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- PERSON at bench -->
  <!-- Head -->
  <circle cx="158" cy="106" r="13" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M145,103 Q158,93 171,103" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Safety goggles -->
  <rect x="147" y="105" width="10" height="7" rx="3" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="161" y="105" width="10" height="7" rx="3" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <line x1="157" y1="108" x2="161" y2="108" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="143" y="119" width="30" height="34" rx="6" fill="#ff9900" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Apron -->
  <rect x="148" y="124" width="20" height="26" rx="4" fill="#f5e7c4" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left arm reaching to bench -->
  <line x1="143" y1="128" x2="118" y2="148" stroke="#eed5b6" stroke-width="5" stroke-linecap="round"/>
  <!-- Right arm reaching to bench -->
  <line x1="173" y1="128" x2="185" y2="148" stroke="#eed5b6" stroke-width="5" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="116" cy="150" r="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <circle cx="187" cy="150" r="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Legs -->
  <rect x="148" y="152" width="11" height="28" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="161" y="152" width="11" height="28" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="153" cy="181" rx="9" ry="5" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="167" cy="181" rx="9" ry="5" fill="#000000" stroke="#000000" stroke-width="3"/>
