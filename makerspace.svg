  <!-- Saw -->
  <line x1="45" y1="62" x2="45" y2="82" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M45,70 Q60,66 65,76 Q60,82 45,82" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
