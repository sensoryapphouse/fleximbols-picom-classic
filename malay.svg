  <!-- Malaysia: red/white stripes + blue canton with yellow crescent+star -->
  <defs>
    <clipPath id="malay-bubble">
      <path d="M25,20 Q25,20 265,20 Q275,20 275,30 L275,175 Q275,185 265,185 L165,185 L150,215 L135,185 L35,185 Q25,185 25,175 Z"/>
    </clipPath>
  </defs>
  <!-- Alternating red/white stripes (7 stripes, simplified to 6 for space) -->
  <rect x="25" y="20" width="250" height="166" fill="#ffffff" clip-path="url(#malay-bubble)"/>
  <rect x="25" y="20" width="250" height="24" fill="#d01424" clip-path="url(#malay-bubble)"/>
  <rect x="25" y="68" width="250" height="24" fill="#d01424" clip-path="url(#malay-bubble)"/>
  <rect x="25" y="116" width="250" height="24" fill="#d01424" clip-path="url(#malay-bubble)"/>
  <rect x="25" y="162" width="250" height="24" fill="#d01424" clip-path="url(#malay-bubble)"/>
  <!-- Blue canton (top-left) -->
  <rect x="25" y="20" width="120" height="83" fill="#1d0e82" clip-path="url(#malay-bubble)"/>
  <!-- Yellow crescent -->
  <circle cx="73" cy="62" r="22" fill="#f7de58" stroke="none" clip-path="url(#malay-bubble)"/>
  <circle cx="82" cy="57" r="18" fill="#1d0e82" stroke="none" clip-path="url(#malay-bubble)"/>
  <!-- Yellow 4-point star -->
  <polygon points="110,50 113,58 121,58 115,63 117,71 110,66 103,71 105,63 99,58 107,58" fill="#f7de58" clip-path="url(#malay-bubble)"/>
  <!-- Bubble outline + tail -->
  <path d="M25,20 Q25,20 265,20 Q275,20 275,30 L275,175 Q275,185 265,185 L165,185 L150,215 L135,185 L35,185 Q25,185 25,175 Z" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
