<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Mammography machine with compression plates and breast positioning -->
  <!-- Floor line -->
  <path d="M10 222 L280 222" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Machine base -->
  <rect x="40" y="190" width="60" height="32" rx="4" fill="#90a7d6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Vertical column -->
  <rect x="58" y="40" width="24" height="152" fill="#90a7d6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Top head of machine -->
  <rect x="40" y="30" width="60" height="22" rx="4" fill="#90a7d6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Indicator light -->
  <circle cx="50" cy="41" r="4" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <circle cx="62" cy="41" r="4" fill="#f2e40d" stroke="#000000" stroke-width="2"/>

  <!-- Upper compression arm -->
  <rect x="82" y="78" width="115" height="12" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Upper compression plate (clear) -->
  <rect x="120" y="90" width="78" height="10" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Lower platform arm -->
  <rect x="82" y="135" width="115" height="14" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Lower platform (detector) -->
  <rect x="120" y="125" width="78" height="10" fill="#efefef" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Compression arrows -->
  <path d="M210 92 L210 102 L205 102 L213 110 L221 102 L216 102 L216 92 Z" fill="#f8130d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M210 133 L210 123 L205 123 L213 115 L221 123 L216 123 L216 133 Z" fill="#f8130d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>

  <!-- Patient silhouette (head + torso + arm positioned) - bust style is OK for identity but here showing positioning, so include torso clearly -->
  <!-- Head -->
  <circle cx="240" cy="60" r="20" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Hair -->
  <path d="M222 56 Q222 40 240 38 Q258 40 258 56 L256 50 Q248 44 240 44 Q232 44 224 50 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="234" y="78" width="12" height="10" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Torso/gown -->
  <path d="M212 88 L268 88 L274 200 L206 200 Z" fill="#f4a4b2" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Breast being positioned between plates (overlap into machine plates) -->
  <path d="M212 100 Q200 108 200 115 Q200 122 212 122 Z" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Arm raised -->
  <path d="M215 95 Q190 80 192 60" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M215 95 Q190 80 192 60" fill="none" stroke="#f4a4b2" stroke-width="0"/>
  <!-- Other arm down -->
  <path d="M268 100 L275 150" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs (visible below gown bottom) -->
  <rect x="218" y="200" width="14" height="20" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <rect x="248" y="200" width="14" height="20" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
</svg>
