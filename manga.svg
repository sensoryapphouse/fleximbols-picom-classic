<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- manga book read right-to-left, black & white panels -->
  <!-- open book base (two pages) -->
  <path d="M 30,40 L 145,32 L 260,40 L 260,210 L 145,218 L 30,210 Z" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- spine fold -->
  <line x1="145" y1="32" x2="145" y2="218" stroke="#000000" stroke-width="4"/>
  <!-- LEFT page: page-2 panels (since right-to-left, left page is read second; show panel layout) -->
  <!-- page borders -->
  <rect x="40" y="48" width="98" height="160" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- left page panel grid: 2 panels top, 1 wide bottom -->
  <rect x="46" y="54" width="42" height="60" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <rect x="90" y="54" width="42" height="60" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- action lines in black panel -->
  <line x1="96" y1="64" x2="126" y2="74" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="94" y1="78" x2="128" y2="86" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="96" y1="92" x2="126" y2="104" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- character face in left panel (manga big eyes) -->
  <circle cx="67" cy="84" r="16" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <path d="M 53,76 Q 67,62 81,76 L 78,84 Q 67,72 56,84 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="61" cy="86" r="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="73" cy="86" r="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="61" cy="86" r="1.5" fill="#000000"/>
  <circle cx="73" cy="86" r="1.5" fill="#000000"/>
  <path d="M 64,94 Q 67,96 70,94" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- bottom wide panel -->
  <rect x="46" y="120" width="86" height="82" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- speed lines -->
  <line x1="50" y1="140" x2="128" y2="140" stroke="#000000" stroke-width="2"/>
  <line x1="50" y1="150" x2="128" y2="150" stroke="#000000" stroke-width="2"/>
  <line x1="50" y1="160" x2="128" y2="160" stroke="#000000" stroke-width="2"/>
  <line x1="50" y1="170" x2="128" y2="170" stroke="#000000" stroke-width="2"/>
  <line x1="50" y1="180" x2="128" y2="180" stroke="#000000" stroke-width="2"/>
  <line x1="50" y1="190" x2="128" y2="190" stroke="#000000" stroke-width="2"/>
  <!-- RIGHT page: page-1 (start, right-to-left) -->
  <rect x="152" y="48" width="98" height="160" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- right page panels: big top panel, 2 below -->
  <rect x="158" y="54" width="86" height="74" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <!-- character with big eyes (right panel) -->
  <circle cx="201" cy="92" r="20" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <!-- spiky hair -->
  <path d="M 181,82 L 184,68 L 192,78 L 196,64 L 204,76 L 210,66 L 215,80 L 222,72 L 222,86 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- big manga eyes -->
  <ellipse cx="194" cy="93" rx="4" ry="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <ellipse cx="208" cy="93" rx="4" ry="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="194" cy="94" r="2.5" fill="#000000"/>
  <circle cx="208" cy="94" r="2.5" fill="#000000"/>
  <circle cx="193" cy="92" r="0.8" fill="#ffffff"/>
  <circle cx="207" cy="92" r="0.8" fill="#ffffff"/>
  <path d="M 196,106 Q 201,108 206,106" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- two bottom panels on right page -->
  <rect x="158" y="134" width="42" height="68" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <rect x="202" y="134" width="42" height="68" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- starburst in black panel -->
  <path d="M 223,156 L 230,164 L 238,158 L 234,168 L 240,176 L 230,176 L 223,184 L 219,176 L 210,176 L 216,168 L 212,158 L 220,164 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
  <!-- arrow showing right-to-left reading direction -->
  <path d="M 230,30 L 200,30 L 200,26 L 188,32 L 200,38 L 200,34 L 230,34 Z" fill="#d01424" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
</svg>
