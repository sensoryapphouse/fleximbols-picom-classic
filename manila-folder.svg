  <!-- Folder body - slightly open to show papers inside -->
  <!-- Back cover -->
  <rect x="30" y="75" width="230" height="148" rx="6" ry="6" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
