  <rect x="46" y="88" width="200" height="8" rx="2" ry="2" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <rect x="50" y="94" width="192" height="8" rx="2" ry="2" fill="#ffffff" stroke="#000000" stroke-width="3"/>
