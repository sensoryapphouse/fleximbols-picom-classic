  <!-- Mean: nasty sneer, narrowed eyes, pointing finger mocking, storm cloud -->
  <!-- Storm cloud upper area -->
  <circle cx="52" cy="38" r="20" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <circle cx="72" cy="28" r="24" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <circle cx="96" cy="32" r="20" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <ellipse cx="74" cy="48" rx="44" ry="20" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Lightning bolt -->
  <polygon points="74,56 66,76 74,76 66,96 82,72 72,72 80,56" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="168" cy="98" rx="44" ry="48" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair - slicked/sharp -->
  <path d="M124,82 Q128,56 168,52 Q208,56 212,82" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Narrowed mean eyes - heavy brow pulled down centre -->
  <ellipse cx="152" cy="92" rx="12" ry="7" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="184" cy="92" rx="12" ry="7" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="153" cy="93" rx="7" ry="5" fill="#4d4d4d"/>
  <ellipse cx="185" cy="93" rx="7" ry="5" fill="#4d4d4d"/>
  <!-- Angry inner brows pressed down toward nose -->
  <line x1="140" y1="80" x2="158" y2="86" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="196" y1="80" x2="178" y2="86" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Outer brows raised to emphasise sneer -->
  <line x1="140" y1="80" x2="128" y2="76" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="196" y1="80" x2="210" y2="76" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Nose - upturned sneer -->
  <ellipse cx="168" cy="106" rx="10" ry="8" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <circle cx="162" cy="106" r="4" fill="#7d5e23"/>
  <circle cx="174" cy="106" r="4" fill="#7d5e23"/>
  <!-- Nasty sneer - one side pulled up -->
  <path d="M148,122 Q158,118 166,120" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M166,120 Q178,128 186,122" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="152" y="144" width="32" height="16" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Body -->
  <path d="M124,160 Q118,210 128,228 L208,228 Q218,210 212,160 Q196,150 168,152 Q140,150 124,160Z" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Pointing mocking arm/finger - pointing left accusingly -->
  <line x1="126" y1="170" x2="66" y2="148" stroke="#eed5b6" stroke-width="11" stroke-linecap="round"/>
  <line x1="66" y1="148" x2="48" y2="142" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <line x1="126" y1="170" x2="48" y2="142" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Pointing finger extended -->
  <ellipse cx="40" cy="138" rx="10" ry="7" fill="#eed5b6" stroke="#000000" stroke-width="4" transform="rotate(-20,40,138)"/>
  <!-- Other arm at side -->
  <line x1="210" y1="172" x2="234" y2="185" stroke="#eed5b6" stroke-width="11" stroke-linecap="round"/>
  <line x1="234" y1="185" x2="244" y2="200" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <line x1="210" y1="172" x2="244" y2="200" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Fist at end -->
  <rect x="238" y="198" width="18" height="14" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
</svg>
