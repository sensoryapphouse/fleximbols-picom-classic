  <!-- meat with bone (drumstick) - bone visible on left -->
  <!-- bone shaft -->
  <rect x="35" y="100" width="80" height="30" fill="#f5e7c4" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- bone knuckles (two bumps on left end) -->
  <circle cx="40" cy="100" r="15" fill="#f5e7c4" stroke="#000000" stroke-width="4"/>
  <circle cx="40" cy="130" r="15" fill="#f5e7c4" stroke="#000000" stroke-width="4"/>
  <!-- meat body (oval ham shape on right) -->
  <ellipse cx="180" cy="120" rx="80" ry="65" fill="#e65a00" stroke="#000000" stroke-width="4"/>
  <!-- darker meat shading band on bottom -->
  <path d="M115 145 C145 195 215 195 245 145" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- meat highlight (fat marbling) -->
  <path d="M140 90 C170 80 200 85 220 95" fill="none" stroke="#f5e7c4" stroke-width="5" stroke-linecap="round"/>
  <path d="M140 90 C170 80 200 85 220 95" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- second marbling line -->
  <path d="M150 115 C180 108 210 112 225 120" fill="none" stroke="#f4a4b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 115 C180 108 210 112 225 120" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
</svg>
