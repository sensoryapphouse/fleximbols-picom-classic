  <!-- meditation: full seated cross-legged figure, hands on knees, calm, aura rings -->

  <!-- aura/glow rings (behind figure) -->
  <ellipse cx="145" cy="130" rx="110" ry="95" fill="none" stroke="#f7de58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <ellipse cx="145" cy="130" rx="88" ry="75" fill="none" stroke="#f7de58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <!-- crossed legs -->
  <!-- left leg folded -->
  <path d="M105 185 Q90 195 75 192 Q60 188 58 200 Q56 210 70 215 Q90 220 108 212" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- right leg folded -->
  <path d="M185 185 Q200 195 215 192 Q230 188 232 200 Q234 210 220 215 Q200 220 182 212" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- feet visible -->
  <ellipse cx="90" cy="215" rx="18" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="200" cy="215" rx="18" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- torso upright -->
  <path d="M108 118 Q116 100 145 100 Q174 100 182 118 L185 185 Q145 196 105 185 Z" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- left arm resting on left knee, hand in mudra -->
  <path d="M110 130 Q90 155 78 182" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="76" cy="186" rx="14" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- mudra gesture: thumb and index touching -->
  <path d="M70 182 Q72 176 78 178 Q82 180 80 186" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- right arm resting on right knee, hand in mudra -->
  <path d="M180 130 Q200 155 212 182" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="214" cy="186" rx="14" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- mudra gesture -->
  <path d="M220 182 Q218 176 212 178 Q208 180 210 186" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- neck -->
  <rect x="139" y="86" width="12" height="16" rx="4" ry="4" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- head (upright, serene) -->
  <ellipse cx="145" cy="65" rx="28" ry="30" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- closed eyes (peaceful) -->
  <path d="M133 61 Q139 65 145 61" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M145 61 Q151 65 157 61" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- gentle smile -->
  <path d="M136 75 Q145 80 154 75" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- third eye / bindi dot -->
  <circle cx="145" cy="52" r="5" fill="#f266aa" stroke="#000000" stroke-width="3"/>

  <!-- om symbol above head -->
  <text x="145" y="28" font-family="serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#7c3fac" stroke="#000000" stroke-width="1">ॐ</text>

  <!-- breath lines / floating particles -->
  <circle cx="118" cy="38" r="4" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <circle cx="172" cy="38" r="4" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <circle cx="105" cy="52" r="3" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <circle cx="185" cy="52" r="3" fill="#f7de58" stroke="#000000" stroke-width="2"/>
</svg>
