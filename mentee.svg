    <ellipse cx="76" cy="127" rx="4" ry="3" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  </g>
  <rect x="71" y="135" width="10" height="6" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
