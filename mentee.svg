  <!-- learning arrow from mentor (right) curving toward mentee (left), with study symbol -->
  <path d="M200 70 Q145 50 90 80 L98 74 M90 80 L98 88" fill="none" stroke="#3aa6a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- small book floating between (knowledge being passed) -->
  <rect x="135" y="40" width="20" height="14" fill="#d01424" stroke="#000000" stroke-width="2"/>
  <line x1="145" y1="40" x2="145" y2="54" stroke="#000000" stroke-width="1.5"/>

