  <!-- mention-friend: speech bubble with @username + person icon + notification dot -->
  <!-- person bust (left) -->
  <ellipse cx="60" cy="190" rx="40" ry="32" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="60" cy="135" r="28" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- hair -->
  <path d="M34 128 Q34 108 60 108 Q86 108 86 128 Q80 118 60 118 Q40 118 34 128 Z" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="52" cy="136" r="3" fill="#000000" stroke="none"/>
  <circle cx="68" cy="136" r="3" fill="#000000" stroke="none"/>
  <!-- smile -->
  <path d="M50 148 Q60 154 70 148" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- speech bubble pointing back at person -->
  <path d="M110 30 Q110 20 122 20 L260 20 Q272 20 272 30 L272 110 Q272 120 260 120 L150 120 L130 138 L138 120 L122 120 Q110 120 110 110 Z" fill="#fff200" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- big @ as path -->
  <circle cx="140" cy="70" r="20" fill="none" stroke="#000000" stroke-width="5"/>
  <circle cx="140" cy="70" r="8" fill="none" stroke="#000000" stroke-width="4"/>
  <path d="M156 70 Q156 86 142 86 Q124 86 124 70" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- username squiggle next to @ -->
  <rect x="170" y="58" width="86" height="10" rx="4" fill="#4d4d4d" stroke="none"/>
  <rect x="170" y="76" width="64" height="10" rx="4" fill="#b8b8b8" stroke="none"/>
  <!-- notification badge on person -->
  <circle cx="92" cy="110" r="16" fill="#f8130d" stroke="#000000" stroke-width="4"/>
  <path d="M92 102 L92 116 M88 116 L96 116" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M88 102 L96 102" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
