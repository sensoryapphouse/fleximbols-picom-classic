  <path d="M 130 155 L 130 100 C 130 90 138 82 148 82 L 175 82" fill="none" stroke="#2a4ec0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 130 155 L 130 100 C 130 90 138 82 148 82 L 175 82" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
