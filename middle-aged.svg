  <!-- Middle-aged adult: full height, slight belly, glasses, salt-and-pepper hair -->

  <!-- Head -->
  <circle cx="145" cy="52" r="24" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hair (salt-and-pepper, receding slightly at temples) -->
  <path d="M124,44 Q128,30 145,28 Q162,30 166,44" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Temple recession -->
  <path d="M121,48 Q122,42 126,40" fill="none" stroke="#eed5b6" stroke-width="6" stroke-linecap="round"/>
  <path d="M169,48 Q168,42 164,40" fill="none" stroke="#eed5b6" stroke-width="6" stroke-linecap="round"/>

  <!-- Glasses frames -->
  <rect x="128" y="46" width="16" height="11" rx="4" fill="none" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="146" y="46" width="16" height="11" rx="4" fill="none" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Bridge -->
  <line x1="144" y1="51" x2="146" y2="51" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Temple arms -->
  <line x1="128" y1="51" x2="121" y2="51" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="162" y1="51" x2="169" y2="51" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyes (behind glasses) -->
  <circle cx="136" cy="51" r="2.5" fill="#000000"/>
  <circle cx="154" cy="51" r="2.5" fill="#000000"/>
  <!-- Smile (warm, slight crow's feet) -->
  <path d="M137,62 Q145,68 153,62" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Crow's feet -->
  <line x1="121" y1="54" x2="118" y2="51" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="121" y1="56" x2="117" y2="55" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="169" y1="54" x2="172" y2="51" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="169" y1="56" x2="173" y2="55" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="140" y="74" width="10" height="10" rx="3" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Torso with slight belly (wider at waist) -->
  <path d="M122,84 L168,84 L174,140 L116,140 Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Collar -->
  <path d="M138,84 L145,96 L152,84" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Arms (slightly heavier) -->
  <line x1="122" y1="96" x2="98" y2="148" stroke="#eed5b6" stroke-width="12" stroke-linecap="round"/>
  <line x1="168" y1="96" x2="192" y2="148" stroke="#eed5b6" stroke-width="12" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="97" cy="151" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <circle cx="193" cy="151" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>

  <!-- Legs (chinos/trousers) -->
  <rect x="118" y="138" width="20" height="72" rx="7" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="152" y="138" width="20" height="72" rx="7" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Shoes (smart casual) -->
  <ellipse cx="128" cy="210" rx="16" ry="8" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="162" cy="210" rx="16" ry="8" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
