<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Seated figure in lotus pose -->
  <!-- Crossed legs base -->
  <ellipse cx="145" cy="195" rx="52" ry="18" fill="#2a4ec0" stroke="#000000" stroke-width="5"/>
  <!-- Torso -->
  <rect x="127" y="140" width="36" height="52" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="145" cy="122" r="18" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Closed peaceful eyes -->
  <path d="M137,122 Q140,118 143,122" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M147,122 Q150,118 153,122" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Left arm resting on knee -->
  <line x1="127" y1="158" x2="100" y2="182" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="97" cy="185" r="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right arm resting on knee -->
  <line x1="163" y1="158" x2="190" y2="182" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="193" cy="185" r="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Breath ring expanding outward (inhale arc left, exhale arc right) -->
  <!-- Inhale arcs coming in from left -->
  <path d="M60,115 Q80,100 100,115" fill="none" stroke="#3aa6a0" stroke-width="5" stroke-linecap="round"/>
  <path d="M48,128 Q72,106 100,122" fill="none" stroke="#3aa6a0" stroke-width="4" stroke-linecap="round"/>
  <!-- Exhale arcs going out to right -->
  <path d="M190,115 Q210,100 230,115" fill="none" stroke="#dff3fd" stroke-width="5" stroke-linecap="round"/>
  <path d="M190,122 Q218,106 242,128" fill="none" stroke="#dff3fd" stroke-width="4" stroke-linecap="round"/>
  <!-- Central breath ring around figure -->
  <circle cx="145" cy="155" r="68" fill="none" stroke="#3aa6a0" stroke-width="4" stroke-dasharray="12,8"/>
  <!-- Lotus petals at bottom -->
  <ellipse cx="118" cy="210" rx="18" ry="10" fill="#f4a4b2" stroke="#000000" stroke-width="4" transform="rotate(-30,118,210)"/>
  <ellipse cx="145" cy="215" rx="18" ry="10" fill="#f4a4b2" stroke="#000000" stroke-width="4"/>
  <ellipse cx="172" cy="210" rx="18" ry="10" fill="#f4a4b2" stroke="#000000" stroke-width="4" transform="rotate(30,172,210)"/>
</svg>
