<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Person scratching head, looking at empty spot -->
  <!-- Head -->
  <circle cx="80" cy="52" r="26" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Eyes looking sideways (searching) -->
  <circle cx="72" cy="48" r="4" fill="#000000"/>
  <circle cx="88" cy="48" r="4" fill="#000000"/>
  <!-- Pupils shifted right (looking toward empty spot) -->
  <circle cx="74" cy="48" r="2" fill="#ffffff"/>
  <circle cx="90" cy="48" r="2" fill="#ffffff"/>
  <!-- Confused mouth (slight frown/flat) -->
  <line x1="72" y1="62" x2="88" y2="62" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Arm scratching head -->
  <path d="M80,78 Q60,72 55,48" fill="none" stroke="#eed5b6" stroke-width="7" stroke-linecap="round"/>
  <!-- Fingers on head (scratch) -->
  <line x1="55" y1="48" x2="52" y2="38" stroke="#eed5b6" stroke-width="4" stroke-linecap="round"/>
  <line x1="58" y1="44" x2="56" y2="34" stroke="#eed5b6" stroke-width="4" stroke-linecap="round"/>
  <line x1="62" y1="42" x2="61" y2="32" stroke="#eed5b6" stroke-width="4" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="55" y="78" width="50" height="52" rx="9" fill="#f266aa" stroke="#000000" stroke-width="5"/>
  <!-- Other arm pointing at empty spot -->
  <line x1="105" y1="90" x2="155" y2="105" stroke="#eed5b6" stroke-width="6" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="70" y1="130" x2="60" y2="185" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="90" y1="130" x2="98" y2="185" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Empty spot (dotted outline where object should be) -->
  <rect x="145" y="90" width="55" height="55" rx="8" fill="none" stroke="#7f7f7f" stroke-width="3" stroke-dasharray="6,5"/>
  <!-- Question arrow path from empty spot (dotted curved arrow) -->
  <path d="M172,85 Q172,70 165,62" fill="none" stroke="#7f7f7f" stroke-width="3" stroke-dasharray="5,4" stroke-linecap="round"/>
  <!-- Object hidden behind/under table (visible peeking out) -->
  <!-- Table -->
  <rect x="195" y="130" width="80" height="18" rx="5" fill="#9d7246" stroke="#000000" stroke-width="4"/>
  <line x1="205" y1="148" x2="200" y2="185" stroke="#9d7246" stroke-width="5" stroke-linecap="round"/>
  <line x1="265" y1="148" x2="270" y2="185" stroke="#9d7246" stroke-width="5" stroke-linecap="round"/>
  <!-- Hidden object (peeking from behind table) — small coloured box corner visible -->
  <rect x="218" y="122" width="28" height="22" rx="5" fill="#ff9900" stroke="#000000" stroke-width="3"/>
</svg>
