<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- DJ Mixer: channel faders, crossfader, EQ knobs, level meters. No round platter. -->

  <!-- Main body -->
  <rect x="22" y="22" width="246" height="196" rx="8" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Top face panel (angled look) -->
  <rect x="22" y="22" width="246" height="12" rx="8" fill="#000000" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- ===== CHANNEL 1 (left) ===== -->
  <!-- Channel 1 label area -->
  <rect x="34" y="38" width="54" height="10" rx="3" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- EQ knobs ch1: HI / MID / LOW -->
  <circle cx="50" cy="68" r="9" fill="#ff9900" stroke="#000000" stroke-width="4"/>
  <line x1="50" y1="68" x2="50" y2="60" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="92" r="9" fill="#ff9900" stroke="#000000" stroke-width="4"/>
  <line x1="50" y1="92" x2="50" y2="84" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="116" r="9" fill="#ff9900" stroke="#000000" stroke-width="4"/>
  <line x1="50" y1="116" x2="50" y2="108" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Gain knob ch1 -->
  <circle cx="72" cy="68" r="7" fill="#f7de58" stroke="#000000" stroke-width="4"/>
  <line x1="72" y1="68" x2="72" y2="62" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- Channel fader ch1 -->
  <rect x="44" y="130" width="10" height="72" rx="3" fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="40" y="168" width="18" height="12" rx="3" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Level meter ch1 -->
  <rect x="60" y="130" width="10" height="72" rx="2" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="61" y="188" width="8" height="8" rx="1" fill="#529929" stroke="none"/>
  <rect x="61" y="179" width="8" height="8" rx="1" fill="#529929" stroke="none"/>
  <rect x="61" y="170" width="8" height="8" rx="1" fill="#f7de58" stroke="none"/>
  <rect x="61" y="161" width="8" height="8" rx="1" fill="#f7de58" stroke="none"/>
  <rect x="61" y="152" width="8" height="8" rx="1" fill="#f8130d" stroke="none"/>

  <!-- ===== CHANNEL 2 (right) ===== -->
  <rect x="202" y="38" width="54" height="10" rx="3" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- EQ knobs ch2 -->
  <circle cx="220" cy="68" r="9" fill="#ff9900" stroke="#000000" stroke-width="4"/>
  <line x1="220" y1="68" x2="220" y2="60" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="220" cy="92" r="9" fill="#ff9900" stroke="#000000" stroke-width="4"/>
  <line x1="220" y1="92" x2="220" y2="84" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="220" cy="116" r="9" fill="#ff9900" stroke="#000000" stroke-width="4"/>
  <line x1="220" y1="116" x2="220" y2="108" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Gain knob ch2 -->
  <circle cx="242" cy="68" r="7" fill="#f7de58" stroke="#000000" stroke-width="4"/>
  <line x1="242" y1="68" x2="242" y2="62" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- Channel fader ch2 -->
  <rect x="222" y="130" width="10" height="72" rx="3" fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="218" y="148" width="18" height="12" rx="3" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Level meter ch2 -->
  <rect x="236" y="130" width="10" height="72" rx="2" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="237" y="188" width="8" height="8" rx="1" fill="#529929" stroke="none"/>
  <rect x="237" y="179" width="8" height="8" rx="1" fill="#529929" stroke="none"/>
  <rect x="237" y="170" width="8" height="8" rx="1" fill="#529929" stroke="none"/>
  <rect x="237" y="161" width="8" height="8" rx="1" fill="#f7de58" stroke="none"/>
  <rect x="237" y="152" width="8" height="8" rx="1" fill="#f7de58" stroke="none"/>

  <!-- ===== CENTRE SECTION ===== -->
  <!-- Headphone cue knob -->
  <circle cx="145" cy="60" r="11" fill="#7c3fac" stroke="#000000" stroke-width="4"/>
  <line x1="145" y1="60" x2="145" y2="50" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Master volume knob -->
  <circle cx="115" cy="60" r="9" fill="#3aa6a0" stroke="#000000" stroke-width="4"/>
  <line x1="115" y1="60" x2="115" y2="52" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Mic / FX knob -->
  <circle cx="175" cy="60" r="9" fill="#3aa6a0" stroke="#000000" stroke-width="4"/>
  <line x1="175" y1="60" x2="175" y2="52" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Crossfader track -->
  <rect x="88" y="196" width="114" height="12" rx="5" fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Crossfader cap -->
  <rect x="118" y="192" width="24" height="20" rx="4" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Crossfader curve knobs (small) -->
  <circle cx="96" cy="186" r="6" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <circle cx="194" cy="186" r="6" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>

  <!-- Filter / FX knob centre -->
  <circle cx="145" cy="110" r="13" fill="#7c3fac" stroke="#000000" stroke-width="5"/>
  <line x1="145" y1="110" x2="145" y2="98" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Send/return buttons row -->
  <rect x="100" y="130" width="18" height="10" rx="3" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="124" y="130" width="18" height="10" rx="3" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="148" y="130" width="18" height="10" rx="3" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="172" y="130" width="18" height="10" rx="3" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
</svg>
