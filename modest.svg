  <!-- Neck -->
  <rect x="126" y="150" width="38" height="28" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shoulders / bust -->
  <path d="M65 240 Q65 194 98 186 L145 178 L192 186 Q225 194 225 240 Z" fill="#f266aa" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hands clasped together (in front) -->
  <ellipse cx="145" cy="210" rx="28" ry="16" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Finger lines on clasped hands -->
  <path d="M130 206 Q145 202 160 206" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M128 212 Q145 216 162 212" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Head - looking slightly down (eye centers lower in head) -->
  <ellipse cx="145" cy="108" rx="60" ry="64" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair - pulled back, neat -->
  <ellipse cx="145" cy="58" rx="60" ry="22" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <rect x="85" y="50" width="120" height="20" rx="8" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <!-- Eyebrows - soft, slightly inward modest look -->
  <path d="M106 86 Q120 80 133 84" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M157 84 Q170 80 184 86" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Eyes - looking slightly downward, pleased -->
  <ellipse cx="120" cy="107" rx="13" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="120" cy="110" rx="8" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <ellipse cx="170" cy="107" rx="13" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="170" cy="110" rx="8" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Slight downcast lid lines -->
  <path d="M107 103 Q120 98 133 103" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M157 103 Q170 98 183 103" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M140 118 L136 130 L143 132 L150 130 L146 118" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shy pleased smile - small, one side more lifted -->
  <path d="M126 140 Q140 150 162 143" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stronger blush - bashful -->
  <ellipse cx="103" cy="122" rx="14" ry="9" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="187" cy="122" rx="14" ry="9" fill="#f4a4b2" stroke="none"/>
  <!-- Small dots on blush -->
  <circle cx="100" cy="122" r="2.5" fill="#f266aa"/>
  <circle cx="106" cy="118" r="2" fill="#f266aa"/>
  <circle cx="108" cy="126" r="2" fill="#f266aa"/>
  <circle cx="184" cy="122" r="2.5" fill="#f266aa"/>
  <circle cx="190" cy="118" r="2" fill="#f266aa"/>
  <circle cx="188" cy="126" r="2" fill="#f266aa"/>
</svg>
