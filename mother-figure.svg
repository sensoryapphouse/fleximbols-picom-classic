  <path d="M232 30 C232 24 240 24 240 30 C240 24 248 24 248 30 C248 38 240 46 240 46 C240 46 232 38 232 30 Z" fill="#f266aa" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
