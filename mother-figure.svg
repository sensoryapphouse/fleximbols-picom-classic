  <path d="M108 132 Q145 138 182 132" fill="none" stroke="#d01424" stroke-width="3" stroke-linecap="round"/>
  <!-- shoes peek -->
  <ellipse cx="118" cy="222" rx="9" ry="4" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <ellipse cx="172" cy="222" rx="9" ry="4" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- torso top / bodice -->
  <path d="M118 84 L112 124 L178 124 L172 84 Q145 76 118 84 Z" fill="#f266aa" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
