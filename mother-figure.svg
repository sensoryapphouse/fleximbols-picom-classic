  <circle cx="188" cy="166" r="8" fill="#eed5b6" stroke="#000000" stroke-width="3"/>

  <!-- heart over chest (caring) -->
  <path d="M134 100 C134 94 142 94 142 100 C142 94 150 94 150 100 C150 108 142 116 142 116 C142 116 134 108 134 100 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

