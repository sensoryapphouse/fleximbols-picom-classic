  <!-- ground -->
  <ellipse cx="145" cy="228" rx="80" ry="6" fill="#9d7246" stroke="#000000" stroke-width="2"/>

  <!-- MOTHER FIGURE FULL BODY (warm, motherly, comforting) -->
  <!-- long dress / skirt -->
  <path d="M108 122 Q88 200 92 220 L198 220 Q202 200 182 122 Z" fill="#f266aa" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- apron front -->
