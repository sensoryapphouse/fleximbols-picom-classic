  <circle cx="145" cy="22" r="8" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- eyes -->
  <circle cx="138" cy="54" r="2.2" fill="#000000"/>
  <circle cx="152" cy="54" r="2.2" fill="#000000"/>
  <!-- warm smile -->
  <path d="M137 62 Q145 68 153 62" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- rosy cheeks -->
  <circle cx="130" cy="60" r="3" fill="#f4a4b2" stroke="#000000" stroke-width="1.5"/>
  <circle cx="160" cy="60" r="3" fill="#f4a4b2" stroke="#000000" stroke-width="1.5"/>
  <!-- arms hugging forward (comforting) -->
