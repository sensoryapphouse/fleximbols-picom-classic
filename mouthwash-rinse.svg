  <!-- Mouthwash bottle (left side) -->
  <rect x="18" y="90" width="32" height="80" rx="8" fill="#3aa6a0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Bottle cap -->
