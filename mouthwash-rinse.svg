  <path d="M236,175 L238,215 L270,215 L272,175 Z" fill="#2a4ec0" stroke="none"/>
  <line x1="234" y1="175" x2="276" y2="175" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Face — puffed cheeks -->
  <ellipse cx="148" cy="88" rx="76" ry="70" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
