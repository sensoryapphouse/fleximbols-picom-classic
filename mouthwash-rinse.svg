  <ellipse cx="122" cy="78" rx="10" ry="8" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="174" cy="78" rx="10" ry="8" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="124" cy="79" r="5" fill="#1d0e82"/>
  <circle cx="176" cy="79" r="5" fill="#1d0e82"/>
  <!-- Mouth closed, rounded for swishing -->
  <path d="M110,118 Q148,132 186,118" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
