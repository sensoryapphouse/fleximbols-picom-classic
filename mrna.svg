<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Straight mRNA strand backbone -->
  <line x1="20" y1="160" x2="270" y2="160" stroke="#e65a00" stroke-width="7" stroke-linecap="round"/>
  <!-- Codon triplets — grouped boxes of three bases -->
  <!-- Codon 1 -->
  <rect x="25" y="148" width="14" height="24" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <rect x="40" y="148" width="14" height="24" fill="#529929" stroke="#000000" stroke-width="2"/>
  <rect x="55" y="148" width="14" height="24" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <!-- Codon 2 -->
  <rect x="75" y="148" width="14" height="24" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <rect x="90" y="148" width="14" height="24" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <rect x="105" y="148" width="14" height="24" fill="#529929" stroke="#000000" stroke-width="2"/>
  <!-- Codon 3 (under ribosome) -->
  <rect x="125" y="148" width="14" height="24" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <rect x="140" y="148" width="14" height="24" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <rect x="155" y="148" width="14" height="24" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <!-- Codon 4 -->
  <rect x="195" y="148" width="14" height="24" fill="#529929" stroke="#000000" stroke-width="2"/>
  <rect x="210" y="148" width="14" height="24" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <rect x="225" y="148" width="14" height="24" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <!-- Ribosome — two-lobed shape attached on top of strand -->
  <ellipse cx="147" cy="110" rx="50" ry="35" fill="#9d7246" stroke="#000000" stroke-width="4"/>
  <ellipse cx="147" cy="90" rx="38" ry="22" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Ribosome bottom groove around the codon -->
  <path d="M 115 145 Q 147 130 180 145" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Growing protein chain coming off ribosome top -->
  <circle cx="125" cy="60" r="9" fill="#7c3fac" stroke="#000000" stroke-width="3"/>
  <circle cx="105" cy="40" r="9" fill="#3aa6a0" stroke="#000000" stroke-width="3"/>
  <circle cx="85" cy="25" r="9" fill="#f266aa" stroke="#000000" stroke-width="3"/>
  <line x1="125" y1="60" x2="105" y2="40" stroke="#000000" stroke-width="2"/>
  <line x1="105" y1="40" x2="85" y2="25" stroke="#000000" stroke-width="2"/>
  <line x1="135" y1="78" x2="125" y2="60" stroke="#000000" stroke-width="2"/>
</svg>
