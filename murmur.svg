<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- murmur: face with soft low gentle wavy sound lines, calm — slightly louder/continuous than mumble -->
  <!-- Head (centered-left) -->
  <circle cx="110" cy="95" r="46" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair -->
  <path d="M 66 82 Q 68 43 110 41 Q 152 43 154 82 Q 144 56 110 56 Q 76 56 66 82 Z" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Eyes (calm, relaxed) -->
  <ellipse cx="96" cy="88" rx="7" ry="7" fill="#000000"/>
  <ellipse cx="124" cy="88" rx="7" ry="7" fill="#000000"/>
  <ellipse cx="98" cy="86" rx="3" ry="3" fill="#ffffff"/>
  <ellipse cx="126" cy="86" rx="3" ry="3" fill="#ffffff"/>
  <!-- Calm relaxed eyebrows (slightly raised) -->
  <path d="M 88 78 Q 96 75 104 78" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 116 78 Q 124 75 132 78" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Mouth: slightly open, soft/gentle — small oval opening -->
  <ellipse cx="110" cy="114" rx="12" ry="7" fill="#d01424" stroke="#000000" stroke-width="4"/>
  <ellipse cx="110" cy="114" rx="8" ry="4" fill="#4d4d4d"/>
  <!-- Neck -->
  <rect x="98" y="139" width="24" height="22" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <path d="M 45 235 L 60 160 Q 110 150 160 160 L 175 235 Z" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Soft continuous wavy sound lines (right side, 3 gentle waves, increasing size) -->
  <!-- Wave 1 (closest, smallest) -->
  <path d="M 168 78 Q 176 70 184 78 Q 192 86 200 78" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Wave 2 (medium) -->
  <path d="M 172 62 Q 184 48 196 62 Q 208 76 220 62" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Wave 3 (largest, outermost) -->
  <path d="M 176 44 Q 193 22 210 44 Q 227 66 244 44" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Small filled dots on waves to suggest continuous/flowing sound -->
  <circle cx="184" cy="78" r="4" fill="#000000"/>
  <circle cx="196" cy="62" r="4" fill="#000000"/>
  <circle cx="210" cy="44" r="4" fill="#000000"/>
</svg>
