<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Muscle-up: figure mid-transition, lower body below bar, upper body rising above bar -->
  <!-- Horizontal bar -->
  <line x1="40" y1="90" x2="250" y2="90" stroke="#4d4d4d" stroke-width="10" stroke-linecap="round"/>
  <!-- Bar mounting supports -->
  <line x1="60" y1="90" x2="60" y2="10" stroke="#4d4d4d" stroke-width="6" stroke-linecap="round"/>
  <line x1="230" y1="90" x2="230" y2="10" stroke="#4d4d4d" stroke-width="6" stroke-linecap="round"/>
  <!-- Figure: chest at bar level, hips below, arms pressing DOWN to push body above bar -->
  <!-- Head (above bar, transitioning up) -->
  <circle cx="145" cy="62" r="16" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Torso: chest crossing bar, torso angled - upper body partially above -->
  <path d="M118 86 Q130 70 162 68 Q176 80 172 96" fill="none" stroke="#2a4ec0" stroke-width="18" stroke-linecap="round"/>
  <!-- Arms pressing DOWN on bar (transition from pull to push) -->
  <!-- Left arm: elbow down, pressing bar -->
  <line x1="118" y1="86" x2="98" y2="90" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <!-- Right arm: elbow down, pressing bar -->
  <line x1="172" y1="88" x2="196" y2="90" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <!-- Hands on bar -->
  <ellipse cx="98" cy="90" rx="8" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <ellipse cx="196" cy="90" rx="8" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Lower body hanging / swinging below bar -->
  <path d="M145 96 l0 52" fill="none" stroke="#4d4d4d" stroke-width="18" stroke-linecap="round"/>
  <!-- Legs hanging below -->
  <path d="M136 148 l-14 40" fill="none" stroke="#4d4d4d" stroke-width="9" stroke-linecap="round"/>
  <path d="M154 148 l14 40" fill="none" stroke="#4d4d4d" stroke-width="9" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="122" cy="193" rx="12" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="168" cy="193" rx="12" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Motion arc showing upward transition path -->
  <path d="M100 120 Q80 80 100 50 Q118 30 145 28" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,5"/>
  <!-- Arrow head at arc end -->
  <polygon points="145,28 136,38 152,36" fill="#000000"/>
</svg>
