  <!-- "Near": one small object (far) and one large object (near), with arrow pointing at the near (large, lower) one -->

  <!-- Far object: small circle higher on screen -->
  <circle cx="180" cy="170" r="34" fill="#f5c800" stroke="#1a1a1a" stroke-width="5"/>

  <!-- Near object: large circle lower on screen -->
  <circle cx="320" cy="370" r="90" fill="#f5c800" stroke="#1a1a1a" stroke-width="5"/>

  <!-- Arrow pointing DOWN at the NEAR (large, lower) object -->
  <line x1="320" y1="200" x2="320" y2="266" stroke="#e23b34" stroke-width="10" stroke-linecap="round"/>
  <polyline points="296,250 320,278 344,250" fill="none" stroke="#e23b34" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
