  <!-- nursing cover: cloth draped from neck strap, baby feet/foot peeking, mother bust -->
  <!-- mother head/shoulders -->
  <circle cx="80" cy="55" r="26" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M55 50 Q60 28 80 25 Q102 28 105 50 Q102 38 80 35 Q58 38 55 50 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="88" cy="55" r="2.5" fill="#000000"/>
  <!-- smile -->
  <path d="M82 65 Q88 70 94 65" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- neck -->
  <path d="M70 80 L70 95 L92 95 L92 80" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- cover neck strap -->
  <path d="M62 90 Q80 78 100 90" stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- strap rigid loop with adjuster -->
  <rect x="92" y="86" width="10" height="8" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- main draped cover fabric -->
  <path d="M55 95 Q40 130 50 200 Q145 215 240 200 Q250 130 235 95 Q200 105 145 105 Q90 105 55 95 Z" fill="#f266aa" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- cover folds/drape lines -->
  <path d="M75 110 Q80 150 70 200" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M130 115 Q132 160 125 205" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M180 115 Q183 160 178 205" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M220 110 Q225 150 220 200" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- polka dots decoration -->
  <circle cx="100" cy="140" r="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="160" cy="155" r="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="205" cy="140" r="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="145" cy="185" r="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <!-- baby foot peeking out bottom right -->
  <path d="M210 205 Q225 195 235 200 Q240 210 232 215 Q220 218 210 215 Z" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- toes -->
  <circle cx="232" cy="202" r="2" fill="#eed5b6" stroke="#000000" stroke-width="1.2"/>
  <circle cx="236" cy="206" r="2" fill="#eed5b6" stroke="#000000" stroke-width="1.2"/>
