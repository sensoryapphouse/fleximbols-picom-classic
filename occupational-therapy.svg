    <rect x="-20" y="57" width="40" height="14" fill="#7c3fac" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- legs under table (visible below) -->
    <rect x="-15" y="71" width="12" height="64" fill="#4d4d4d" stroke="#000000" stroke-width="2.5"/>
    <rect x="3" y="71" width="12" height="64" fill="#4d4d4d" stroke="#000000" stroke-width="2.5"/>
    <ellipse cx="-9" cy="135" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="1.8"/>
    <ellipse cx="9" cy="135" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="1.8"/>
  </g>

  <!-- plate on table in front of patient -->
