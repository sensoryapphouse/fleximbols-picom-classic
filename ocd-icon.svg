  <!-- head silhouette -->
  <circle cx="145" cy="105" r="52" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- neck -->
  <rect x="133" y="152" width="24" height="18" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- calm neutral eyes -->
  <circle cx="130" cy="102" r="4" fill="#000000"/>
  <circle cx="160" cy="102" r="4" fill="#000000"/>
  <!-- neutral mouth -->
  <line x1="134" y1="118" x2="156" y2="118" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- repeating loop arrow — circular cycle inside head area, above face -->
  <!-- loop arc -->
  <path d="M118 80 A36 30 0 1 1 172 80" fill="none" stroke="#2a4ec0" stroke-width="4" stroke-linecap="round"/>
  <!-- arrowhead at end of arc — tip on axis pointing right-downward -->
  <polygon points="172,80 160,72 164,84" fill="#2a4ec0" stroke="#2a4ec0" stroke-width="2" stroke-linejoin="round"/>
  <!-- check mark symbol inside loop (repeated thought) -->
  <polyline points="130,86 138,95 158,72" fill="none" stroke="#529929" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- second smaller repeat indicator — dashed inner ring -->
  <path d="M126 88 A24 20 0 1 1 164 88" fill="none" stroke="#2a4ec0" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
</svg>
