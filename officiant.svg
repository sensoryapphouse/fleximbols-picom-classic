  <!-- officiant: full body, open book, arms raised, presiding -->
  <!-- ground -->
  <rect x="20" y="218" width="250" height="10" fill="#f5e7c4" stroke="#000000" stroke-width="2"/>

  <!-- small altar/podium behind -->
  <rect x="55" y="180" width="60" height="38" fill="#9d7246" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="50" y="172" width="70" height="10" fill="#7d5e23" stroke="#000000" stroke-width="2"/>

  <!-- legs (under robe) -->
  <rect x="150" y="180" width="14" height="40" fill="#000000" stroke="#000000" stroke-width="2"/>
  <rect x="166" y="180" width="14" height="40" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="157" cy="222" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="173" cy="222" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>

  <!-- ceremonial robe (long black with white collar bands) -->
  <path d="M130 110 L120 195 L210 195 L200 110 Q200 95 165 92 Q130 95 130 110 Z" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- white collar bands -->
  <rect x="158" y="100" width="5" height="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="167" y="100" width="5" height="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <!-- robe trim -->
  <path d="M165 110 L165 190" fill="none" stroke="#7c3fac" stroke-width="4" stroke-linecap="round"/>

  <!-- arms raised (open) holding book -->
  <path d="M132 115 Q110 100 105 130 L115 132 Q120 115 138 122 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M198 115 Q220 100 225 130 L215 132 Q210 115 192 122 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- hands -->
  <circle cx="108" cy="135" r="6" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <circle cx="222" cy="135" r="6" fill="#eed5b6" stroke="#000000" stroke-width="2"/>

  <!-- open book held in front -->
  <path d="M120 140 L165 132 L210 140 L210 162 L165 154 L120 162 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M165 132 L165 154" stroke="#000000" stroke-width="2"/>
  <path d="M130 145 L155 140 M130 150 L155 145 M175 140 L200 145 M175 145 L200 150" stroke="#7f7f7f" stroke-width="1.5" stroke-linecap="round"/>
  <!-- book cover edges -->
  <path d="M120 162 L120 165 L165 157 L210 165 L210 162" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>

  <!-- head -->
  <circle cx="165" cy="68" r="24" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M143 64 Q143 44 165 42 Q187 44 187 64 Q185 54 165 52 Q145 54 143 64 Z" fill="#7f7f7f" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="156" cy="68" r="2" fill="#000000"/>
  <circle cx="174" cy="68" r="2" fill="#000000"/>
  <!-- smile -->
  <path d="M156 78 Q165 82 174 78" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- small cross pendant -->
  <rect x="163" y="124" width="4" height="10" fill="#f2e40d" stroke="#000000" stroke-width="1"/>
  <rect x="160" y="127" width="10" height="4" fill="#f2e40d" stroke="#000000" stroke-width="1"/>
</svg>
