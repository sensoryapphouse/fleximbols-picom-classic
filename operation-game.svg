<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Operation: red game board with cartoon patient + red nose + tweezers -->
  <!-- game board (red rectangle) -->
  <rect x="35" y="25" width="220" height="190" rx="10" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- inner white patient area -->
  <rect x="50" y="40" width="190" height="160" rx="6" fill="#fff200" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- patient body outline -->
  <ellipse cx="145" cy="135" rx="55" ry="55" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <!-- head -->
  <circle cx="145" cy="78" r="26" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <!-- arms -->
  <ellipse cx="85" cy="135" rx="14" ry="32" fill="#f4a4b2" stroke="#000000" stroke-width="3" transform="rotate(20 85 135)"/>
  <ellipse cx="205" cy="135" rx="14" ry="32" fill="#f4a4b2" stroke="#000000" stroke-width="3" transform="rotate(-20 205 135)"/>
  <!-- legs -->
  <ellipse cx="120" cy="195" rx="14" ry="20" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <ellipse cx="170" cy="195" rx="14" ry="20" fill="#f4a4b2" stroke="#000000" stroke-width="3"/>
  <!-- eyes -->
  <circle cx="137" cy="74" r="3" fill="#000000"/>
  <circle cx="153" cy="74" r="3" fill="#000000"/>
  <!-- mouth (worried) -->
  <path d="M 137 88 Q 145 84 153 88" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- big red glowing nose (operation signature) -->
  <circle cx="145" cy="82" r="7" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <circle cx="143" cy="80" r="2" fill="#ffffff"/>
  <!-- cavity holes on torso -->
  <ellipse cx="125" cy="125" rx="9" ry="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <ellipse cx="165" cy="125" rx="9" ry="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <ellipse cx="145" cy="150" rx="10" ry="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <ellipse cx="125" cy="170" rx="8" ry="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- bone in one cavity -->
  <path d="M 159 122 L 171 122 M 159 122 Q 156 119 159 117 Q 162 119 159 122 M 159 122 Q 156 125 159 127 Q 162 125 159 122 M 171 122 Q 174 119 171 117 Q 168 119 171 122 M 171 122 Q 174 125 171 127 Q 168 125 171 122" stroke="#000000" stroke-width="1.5" fill="#ffffff" stroke-linejoin="round"/>
  <!-- tweezers on the right reaching in -->
  <path d="M 245 50 L 200 105 L 205 110 L 250 55 Z" fill="#b8b8b8" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 245 50 L 200 100 L 195 95 L 240 45 Z" fill="#7f7f7f" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="248" cy="48" r="4" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
</svg>
