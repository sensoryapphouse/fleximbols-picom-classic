  <!-- Rising sun (half circle at bottom right) -->
  <clipPath id="sunclip">
    <rect x="186" y="158" width="80" height="50"/>
  </clipPath>
  <!-- Sun rays first (behind) -->
  <line x1="226" y1="145" x2="226" y2="136" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="246" y1="152" x2="252" y2="145" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
