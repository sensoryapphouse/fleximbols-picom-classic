  <line x1="38" y1="150" x2="100" y2="150" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="125" y="158" width="40" height="28" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shoulders -->
  <ellipse cx="145" cy="208" rx="70" ry="26" fill="#529929" stroke="#000000" stroke-width="5"/>
  <!-- Head -->
  <ellipse cx="145" cy="108" rx="62" ry="62" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Eyes looking slightly upward (pupils up) -->
  <ellipse cx="122" cy="96" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="122" cy="93" rx="6" ry="6" fill="#4d4d4d" stroke="none"/>
