  <line x1="186" y1="190" x2="272" y2="190" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Half sun -->
  <path d="M190 190 A36 36 0 0 1 262 190 Z" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Glass half full -->
  <!-- Glass body -->
  <path d="M38 150 L50 210 L88 210 L100 150 Z" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Liquid fill (top half = full) -->
  <path d="M45 180 L50 210 L88 210 L93 180 Z" fill="#2a4ec0" stroke="none"/>
