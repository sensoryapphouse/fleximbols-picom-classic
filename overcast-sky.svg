  <!-- Sky panel filled entirely with dark grey -->
  <rect x="26" y="32" width="238" height="176" rx="18" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>
  <!-- Dark heavy cloud layer top -->
  <rect x="1" y="1" width="288" height="110" rx="18" fill="#4d4d4d"/>
  <!-- Overcast bumpy top edge of lower cloud mass -->
  <circle cx="30" cy="112" r="28" fill="#7f7f7f"/>
  <circle cx="70" cy="100" r="34" fill="#7f7f7f"/>
  <circle cx="120" cy="92" r="38" fill="#7f7f7f"/>
  <circle cx="170" cy="98" r="35" fill="#7f7f7f"/>
  <circle cx="220" cy="105" r="30" fill="#7f7f7f"/>
  <circle cx="262" cy="112" r="26" fill="#7f7f7f"/>
  <!-- Fill below clouds -->
  <rect x="1" y="112" width="288" height="88" fill="#7f7f7f"/>
  <!-- Outline the whole panel again for border integrity -->
  <rect x="1" y="1" width="288" height="200" rx="18" fill="none" stroke="#000000" stroke-width="5"/>
  <!-- A few subtle darker streaks to show thick blanket -->
  <line x1="20" y1="150" x2="270" y2="150" stroke="#4d4d4d" stroke-width="8" stroke-linecap="round"/>
  <line x1="20" y1="170" x2="270" y2="170" stroke="#4d4d4d" stroke-width="6" stroke-linecap="round"/>
  <line x1="20" y1="135" x2="180" y2="135" stroke="#4d4d4d" stroke-width="6" stroke-linecap="round"/>
</svg>
