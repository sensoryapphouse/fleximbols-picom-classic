  <!-- Standing overhead press with barbell fully extended overhead -->
  <!-- Head -->
  <circle cx="145" cy="42" r="16" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Torso -->
  <rect x="126" y="60" width="38" height="58" rx="8" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm: up overhead, fully extended -->
  <line x1="126" y1="72" x2="82" y2="26" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <!-- Right arm: up overhead, fully extended -->
  <line x1="164" y1="72" x2="208" y2="26" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <!-- Barbell shaft fully overhead (horizontal) -->
  <line x1="38" y1="22" x2="252" y2="22" stroke="#4d4d4d" stroke-width="7" stroke-linecap="round"/>
  <!-- Barbell plates left -->
  <rect x="38" y="6" width="16" height="32" rx="7" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Barbell plates right -->
  <rect x="236" y="6" width="16" height="32" rx="7" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Plate holes -->
  <circle cx="46" cy="22" r="5" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <circle cx="244" cy="22" r="5" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- Left leg -->
  <rect x="126" y="116" width="16" height="72" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="148" y="116" width="16" height="72" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Feet -->
  <ellipse cx="134" cy="194" rx="16" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="156" cy="194" rx="16" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Ground line -->
  <line x1="20" y1="204" x2="270" y2="204" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
