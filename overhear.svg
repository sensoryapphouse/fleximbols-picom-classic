  <!-- Background subtle scene: two small talking figures on left -->
  <!-- Small figure 1 (left talker) -->
  <circle cx="42" cy="68" r="12" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <rect x="33" y="82" width="18" height="28" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="4"/>
  <line x1="42" y1="110" x2="37" y2="130" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="42" y1="110" x2="47" y2="130" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Speech bubble from figure 1 -->
  <ellipse cx="74" cy="58" rx="20" ry="13" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <polygon points="60,66 56,75 68,68" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Small dots inside speech bubble -->
  <circle cx="66" cy="58" r="3" fill="#000000"/>
  <circle cx="74" cy="58" r="3" fill="#000000"/>
  <circle cx="82" cy="58" r="3" fill="#000000"/>

  <!-- Small figure 2 (right talker) -->
  <circle cx="110" cy="68" r="12" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <rect x="101" y="82" width="18" height="28" rx="4" fill="#529929" stroke="#000000" stroke-width="4"/>
  <line x1="110" y1="110" x2="105" y2="130" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="110" x2="115" y2="130" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Speech bubble from figure 2 (pointing left) -->
  <ellipse cx="78" cy="85" rx="20" ry="13" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <polygon points="90,90 100,95 92,78" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="70" cy="85" r="3" fill="#000000"/>
  <circle cx="78" cy="85" r="3" fill="#000000"/>
  <circle cx="86" cy="85" r="3" fill="#000000"/>

  <!-- Sound waves travelling right toward the large ear -->
  <path d="M 138 100 Q 148 90 148 110" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 148 95 Q 162 82 162 118" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 158 90 Q 175 75 175 125" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Large passive ear (right side) - the listener -->
  <!-- Ear outer shape -->
  <path d="M 195 55 Q 230 50 240 100 Q 245 140 225 168 Q 210 185 195 178 L 200 155 Q 215 148 218 120 Q 222 90 210 75 L 195 78 Z" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Inner ear detail -->
  <path d="M 202 80 Q 220 82 222 110 Q 224 135 212 148 L 205 145 Q 215 133 213 110 Q 211 90 202 88 Z" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Ear canal dot -->
  <circle cx="204" cy="115" r="7" fill="#e65a00" stroke="#000000" stroke-width="3"/>

  <!-- Passive figure head (looking away, relaxed) -->
  <circle cx="165" cy="175" r="28" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Face: neutral eyes -->
  <circle cx="156" cy="170" r="4" fill="#000000"/>
  <circle cx="174" cy="170" r="4" fill="#000000"/>
  <!-- Neutral mouth -->
  <path d="M 157 182 Q 165 186 173 182" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="140" y="205" width="50" height="30" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="5"/>
