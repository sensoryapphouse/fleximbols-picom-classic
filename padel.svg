  <path d="M 113,34 Q 116,20 130,18 Q 144,20 146,36" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="124" cy="44" r="2" fill="#000000"/>
  <circle cx="136" cy="44" r="2" fill="#000000"/>
