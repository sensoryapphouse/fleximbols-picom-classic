  <!-- glass wall (rear, padel differentiator) -->
  <rect x="20" y="18" width="12" height="210" rx="4" ry="4" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <line x1="26" y1="70" x2="26" y2="160" stroke="#90a7d6" stroke-width="2" stroke-linecap="round" stroke-dasharray="8,6"/>
  <!-- figure: head -->
