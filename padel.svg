  <ellipse cx="153" cy="171" rx="12" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- padel racket: thick perforated face (no strings) -->
  <!-- handle -->
  <rect x="186" y="55" width="11" height="34" rx="5" ry="5" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- racket face (rounded square, solid) -->
  <rect x="176" y="16" width="42" height="44" rx="10" ry="10" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
