  <circle cx="204" cy="40" r="3.5" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="218" cy="40" r="3.5" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="190" cy="52" r="3.5" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="204" cy="52" r="3.5" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="218" cy="52" r="3.5" fill="none" stroke="#000000" stroke-width="2"/>
