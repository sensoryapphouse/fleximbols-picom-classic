  <path d="M 120,62 Q 115,66 115,100 Q 117,107 130,107 Q 143,107 144,100 L 142,66 Q 138,62 130,62 Z" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- left arm back toward wall -->
  <path d="M 118,70 Q 90,80 60,88" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right arm swinging racket -->
  <path d="M 142,68 Q 168,62 192,52" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
