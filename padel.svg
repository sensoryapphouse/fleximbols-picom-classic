  <path d="M 140,105 L 152,152 L 158,170 L 146,172 L 140,152 L 134,107" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- shoes -->
