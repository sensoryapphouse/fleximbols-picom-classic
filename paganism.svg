<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- ground / nature -->
  <ellipse cx="145" cy="230" rx="140" ry="14" fill="#67832d" stroke="#000000" stroke-width="2"/>

  <!-- triple-moon symbol (top-left) -->
  <g transform="translate(55,55)">
    <!-- waxing crescent (left) -->
    <path d="M-30 -22 A22 22 0 1 0 -30 22 A14 22 0 1 1 -30 -22 Z" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- full moon -->
    <circle cx="0" cy="0" r="20" fill="#f7de58" stroke="#000000" stroke-width="3"/>
    <!-- waning crescent (right) -->
    <path d="M30 -22 A22 22 0 1 1 30 22 A14 22 0 1 0 30 -22 Z" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- pentagram (top-right) -->
  <g transform="translate(230,60)">
    <circle cx="0" cy="0" r="32" fill="#7c3fac" stroke="#000000" stroke-width="3"/>
    <polygon points="0,-26 7,-8 26,-8 11,4 17,22 0,12 -17,22 -11,4 -26,-8 -7,-8" fill="#fff200" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- horned god (full body, centre-bottom) -->
  <g transform="translate(145,175)">
    <!-- antlers -->
    <path d="M-12 -54 L-22 -68 L-18 -68 L-16 -76 L-12 -68 L-8 -78 L-6 -68 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
    <path d="M12 -54 L22 -68 L18 -68 L16 -76 L12 -68 L8 -78 L6 -68 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
    <!-- head -->
    <ellipse cx="0" cy="-40" rx="16" ry="18" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
    <!-- beard -->
    <path d="M-10 -32 Q-12 -16 0 -14 Q12 -16 10 -32 Z" fill="#9d7246" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
    <!-- eyes -->
    <circle cx="-6" cy="-42" r="1.5" fill="#000000"/>
    <circle cx="6" cy="-42" r="1.5" fill="#000000"/>
    <!-- body in green tunic -->
    <path d="M-22 -20 L-28 30 L28 30 L22 -20 Q12 -16 0 -16 Q-12 -16 -22 -20 Z" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- arms -->
    <path d="M-22 -16 L-40 14 L-34 18 L-18 -8 Z" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <path d="M22 -16 L40 14 L34 18 L18 -8 Z" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- hands -->
    <circle cx="-37" cy="16" r="4" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
    <circle cx="37" cy="16" r="4" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
    <!-- legs -->
    <rect x="-18" y="30" width="14" height="28" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
    <rect x="4" y="30" width="14" height="28" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
    <!-- feet -->
    <ellipse cx="-11" cy="60" rx="8" ry="3" fill="#000000"/>
    <ellipse cx="11" cy="60" rx="8" ry="3" fill="#000000"/>
  </g>

  <!-- small leaves either side -->
  <path d="M30 200 Q40 188 50 200 Q40 208 30 200 Z" fill="#529929" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <line x1="30" y1="200" x2="50" y2="200" stroke="#000000" stroke-width="1.5"/>
  <path d="M240 200 Q250 188 260 200 Q250 208 240 200 Z" fill="#529929" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <line x1="240" y1="200" x2="260" y2="200" stroke="#000000" stroke-width="1.5"/>
</svg>
