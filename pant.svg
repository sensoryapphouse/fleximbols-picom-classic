  <!-- Head -->
  <ellipse cx="145" cy="118" rx="78" ry="88" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair -->
  <ellipse cx="145" cy="55" rx="78" ry="32" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <!-- Left eye - half-closed tired -->
  <ellipse cx="108" cy="105" rx="16" ry="11" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="108" cy="108" r="7" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <!-- Heavy eyelid left -->
  <path d="M92 100 Q108 94 124 100" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Right eye - half-closed tired -->
  <ellipse cx="182" cy="105" rx="16" ry="11" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="182" cy="108" r="7" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <!-- Heavy eyelid right -->
  <path d="M166 100 Q182 94 198 100" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Eyebrows - furrowed/flat tired -->
  <path d="M92 88 Q108 84 124 88" fill="none" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <path d="M166 88 Q182 84 198 88" fill="none" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <!-- Open mouth with tongue out (panting) -->
  <path d="M118 152 Q132 148 145 152 Q158 148 172 152 Q172 175 145 177 Q118 175 118 152 Z" fill="#f8130d" stroke="#000000" stroke-width="5"/>
  <!-- Tongue -->
  <ellipse cx="145" cy="172" rx="16" ry="12" fill="#f4a4b2" stroke="#000000" stroke-width="4"/>
  <!-- Upper teeth -->
  <rect x="121" y="152" width="48" height="10" rx="3" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Short rapid breath puffs - both sides -->
  <path d="M88 145 Q78 140 70 145" fill="none" stroke="#dff3fd" stroke-width="5" stroke-linecap="round"/>
  <path d="M85 158 Q75 153 67 158" fill="none" stroke="#dff3fd" stroke-width="5" stroke-linecap="round"/>
  <path d="M202 145 Q212 140 220 145" fill="none" stroke="#dff3fd" stroke-width="5" stroke-linecap="round"/>
  <path d="M205 158 Q215 153 223 158" fill="none" stroke="#dff3fd" stroke-width="5" stroke-linecap="round"/>
  <!-- Sweat drop -->
  <path d="M76 82 Q73 90 76 96 Q79 90 76 82 Z" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <path d="M218 88 Q215 96 218 102 Q221 96 218 88 Z" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
