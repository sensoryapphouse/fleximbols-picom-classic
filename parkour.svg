  <!-- wall / obstacle -->
  <rect x="148" y="130" width="52" height="80" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- wall brick lines -->
  <line x1="148" y1="155" x2="200" y2="155" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>
  <line x1="148" y1="178" x2="200" y2="178" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>
  <line x1="174" y1="130" x2="174" y2="155" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>
  <line x1="162" y1="155" x2="162" y2="178" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>
  <line x1="186" y1="155" x2="186" y2="178" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>
  <!-- ground -->
  <line x1="22" y1="210" x2="268" y2="210" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- figure vaulting: body nearly horizontal over wall, one hand on top -->
  <!-- head (leading, tilted forward-right) -->
  <circle cx="210" cy="88" r="16" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- hair -->
  <path d="M196 82 Q210 72 224 82" fill="#000000" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- torso (near-horizontal, vaulting right) -->
  <path d="M192 100 Q220 94 240 104 L236 122 Q212 128 188 118 Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- left arm: pushing off wall top -->
  <line x1="192" y1="108" x2="172" y2="128" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <circle cx="172" cy="128" r="7" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- right arm: extended forward -->
  <line x1="236" y1="104" x2="258" y2="96" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <circle cx="258" cy="95" r="7" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- left leg: trailing back-up -->
  <line x1="190" y1="118" x2="155" y2="108" stroke="#1d0e82" stroke-width="9" stroke-linecap="round"/>
  <line x1="155" y1="108" x2="130" y2="92" stroke="#1d0e82" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="127" cy="90" rx="10" ry="5" transform="rotate(-20 127 90)" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- right leg: tucked under/forward -->
  <line x1="234" y1="120" x2="248" y2="140" stroke="#1d0e82" stroke-width="9" stroke-linecap="round"/>
  <line x1="248" y1="140" x2="256" y2="162" stroke="#1d0e82" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="258" cy="165" rx="10" ry="5" transform="rotate(10 258 165)" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- motion lines behind figure -->
  <line x1="172" y1="95" x2="155" y2="90" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="108" x2="152" y2="108" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="172" y1="120" x2="155" y2="125" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
