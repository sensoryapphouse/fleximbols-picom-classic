  <!-- paternity-test: two cheek swab samples + DNA comparison strip showing matching bands -->

  <!-- swab 1 (left) -->
  <line x1="40" y1="200" x2="78" y2="60" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="80" cy="52" rx="14" ry="20" fill="#ffffff" stroke="#000000" stroke-width="4" transform="rotate(-15 80 52)"/>
  <!-- swab tip texture -->
  <line x1="72" y1="44" x2="84" y2="48" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="74" y1="54" x2="86" y2="58" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>

  <!-- swab 2 (right) -->
  <line x1="250" y1="200" x2="212" y2="60" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="210" cy="52" rx="14" ry="20" fill="#ffffff" stroke="#000000" stroke-width="4" transform="rotate(15 210 52)"/>
  <line x1="206" y1="44" x2="218" y2="48" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="204" y1="54" x2="216" y2="58" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>

  <!-- person silhouette labels (small) -->
  <circle cx="50" cy="215" r="9" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <circle cx="240" cy="215" r="9" fill="#f266aa" stroke="#000000" stroke-width="3"/>

  <!-- DNA comparison strip (center) -->
  <rect x="95" y="80" width="100" height="135" rx="6" ry="6" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- two columns labelled (top markers) -->
  <circle cx="120" cy="92" r="6" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
  <circle cx="170" cy="92" r="6" fill="#f266aa" stroke="#000000" stroke-width="2.5"/>

  <!-- vertical track lines -->
  <line x1="120" y1="105" x2="120" y2="205" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="105" x2="170" y2="205" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>

  <!-- matching bands (some aligned across both lanes) -->
  <rect x="108" y="110" width="24" height="8" fill="#000000" stroke="#000000" stroke-width="1"/>
  <rect x="158" y="110" width="24" height="8" fill="#000000" stroke="#000000" stroke-width="1"/>

  <rect x="108" y="130" width="24" height="6" fill="#000000" stroke="#000000" stroke-width="1"/>
  <rect x="158" y="138" width="24" height="6" fill="#000000" stroke="#000000" stroke-width="1"/>

  <rect x="108" y="150" width="24" height="10" fill="#000000" stroke="#000000" stroke-width="1"/>
  <rect x="158" y="150" width="24" height="10" fill="#000000" stroke="#000000" stroke-width="1"/>

  <rect x="108" y="172" width="24" height="6" fill="#000000" stroke="#000000" stroke-width="1"/>
  <rect x="158" y="172" width="24" height="6" fill="#000000" stroke="#000000" stroke-width="1"/>

  <rect x="108" y="188" width="24" height="8" fill="#000000" stroke="#000000" stroke-width="1"/>
  <rect x="158" y="188" width="24" height="8" fill="#000000" stroke="#000000" stroke-width="1"/>

  <!-- match indicator (checkmark badge at top) -->
  <circle cx="145" cy="60" r="20" fill="#529929" stroke="#000000" stroke-width="4"/>
  <path d="M 134,60 L 142,68 L 156,52" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
