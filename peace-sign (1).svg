<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- peace sign: index + middle fingers raised in V, palm facing viewer, yellow hand -->
  <!-- palm body -->
  <rect x="94" y="128" width="104" height="86" rx="22" ry="22" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- ring finger curled (short bump on palm) -->
  <rect x="156" y="116" width="22" height="24" rx="11" ry="11" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- little finger curled (short bump on palm) -->
  <rect x="182" y="120" width="18" height="22" rx="9" ry="9" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- thumb tucked at side -->
  <rect x="66" y="148" width="40" height="52" rx="18" ry="18" fill="#f7de58" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- index finger raised (left of V) -->
  <rect x="96" y="30" width="26" height="108" rx="13" ry="13" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- middle finger raised (right of V) -->
  <rect x="130" y="24" width="26" height="114" rx="13" ry="13" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- palm crease lines -->
  <line x1="106" y1="134" x2="106" y2="150" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="143" y1="132" x2="143" y2="148" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- wrist -->
  <rect x="110" y="202" width="72" height="26" rx="10" ry="10" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
</svg>
