  <!-- Pedestrian crossing SIGN: blue/yellow diamond sign with walking figure -->
  <!-- Yellow diamond sign shape -->
  <polygon points="145,22 268,120 145,218 22,120" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Blue inner diamond -->
  <polygon points="145,42 248,120 145,198 42,120" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Walking pedestrian figure (white) -->
  <!-- Head -->
  <circle cx="145" cy="74" r="16" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Body -->
  <line x1="145" y1="90" x2="145" y2="138" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <!-- Left arm swinging forward -->
  <line x1="145" y1="104" x2="124" y2="122" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Right arm swinging back -->
  <line x1="145" y1="104" x2="164" y2="118" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Left leg forward -->
  <line x1="145" y1="138" x2="130" y2="166" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Right leg back -->
  <line x1="145" y1="138" x2="158" y2="164" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
</svg>
