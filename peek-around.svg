<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Wall/corner edge - vertical bar on left side -->
  <rect x="0" y="0" width="72" height="240" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- Wall edge highlight -->
  <rect x="64" y="0" width="8" height="240" fill="#7f7f7f" stroke="none"/>
  <!-- Head peeking out from right side of wall -->
  <!-- Only right ~60% of head visible beyond wall edge -->
  <ellipse cx="118" cy="118" rx="78" ry="82" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair -->
  <ellipse cx="118" cy="58" rx="78" ry="30" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <!-- Clip the left part of head behind wall using wall rectangle on top -->
  <rect x="0" y="0" width="72" height="240" fill="#b8b8b8"/>
  <rect x="64" y="0" width="8" height="240" fill="#7f7f7f"/>
  <!-- Wall edge border -->
  <line x1="72" y1="0" x2="72" y2="240" stroke="#000000" stroke-width="5"/>
  <!-- ONE visible eye - the right eye of the face peering around corner -->
  <ellipse cx="152" cy="108" rx="18" ry="15" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <!-- Pupil looking leftward (toward wall/around corner) -->
  <circle cx="144" cy="108" r="9" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <circle cx="140" cy="104" r="3" fill="#ffffff"/>
  <!-- Eyebrow for visible eye -->
  <path d="M134 88 Q152 80 170 88" fill="none" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <!-- Nose - partially visible -->
  <ellipse cx="140" cy="138" rx="10" ry="8" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <circle cx="148" cy="140" r="4" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- Mouth - slight smile, curious -->
  <path d="M120 162 Q142 172 164 162" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Hand gripping wall edge - fingers visible at wall edge -->
  <!-- Hand -->
  <ellipse cx="80" cy="162" rx="18" ry="14" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Fingers -->
  <rect x="76" y="148" width="8" height="18" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <rect x="87" y="145" width="8" height="20" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <rect x="98" y="147" width="8" height="18" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Thumb -->
  <ellipse cx="72" cy="165" rx="7" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Cover finger bases with wall colour -->
  <rect x="0" y="0" width="72" height="240" fill="#b8b8b8"/>
  <rect x="64" y="0" width="8" height="240" fill="#7f7f7f"/>
  <line x1="72" y1="0" x2="72" y2="240" stroke="#000000" stroke-width="5"/>
</svg>
