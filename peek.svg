  <!-- Wall/door edge (thick vertical bar on left side) -->
  <rect x="18" y="10" width="52" height="225" rx="4" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Wall edge detail/highlight line -->
  <line x1="62" y1="10" x2="62" y2="235" stroke="#7d5e23" stroke-width="3" stroke-linecap="round"/>
  <!-- Figure: most of body behind wall, only part of face + hands visible -->
  <!-- Body behind wall (partially hidden, show edge) -->
  <path d="M 30,120 L 70,120 L 70,220 L 30,220 Z" fill="#2a4ec0" stroke="none"/>
  <!-- Head peeking around right edge of wall -->
  <!-- Head (3/4 visible: left side behind wall, right and front visible) -->
  <circle cx="88" cy="100" r="40" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair covering top/left of head -->
  <path d="M 50,90 Q 55,62 88,60 Q 115,62 118,85" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Wall clips head on left — draw wall-coloured rect to obscure left of head -->
  <rect x="18" y="62" width="52" height="80" fill="#9d7246" stroke="none"/>
  <line x1="62" y1="62" x2="62" y2="142" stroke="#7d5e23" stroke-width="3"/>
  <!-- Visible right side eye only (peeking) — one eye visible -->
  <ellipse cx="96" cy="96" rx="13" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="100" cy="96" r="6" fill="#1d0e82"/>
  <circle cx="98" cy="94" r="2" fill="#ffffff"/>
  <!-- Eyebrow above visible eye -->
  <path d="M 85,86 Q 96,81 107,86" fill="none" stroke="#5e1f0a" stroke-width="4" stroke-linecap="round"/>
  <!-- Mouth (half visible, cautious/curious slight smile) -->
  <path d="M 74,114 Q 88,122 102,116" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Left hand on wall edge (gripping) -->
  <path d="M 62,140 Q 72,136 80,140 L 82,160 Q 78,168 68,166 Q 58,164 58,155 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Fingers gripping edge -->
  <line x1="68" y1="136" x2="68" y2="146" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="74" y1="135" x2="74" y2="145" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="137" x2="80" y2="147" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Second hand slightly lower -->
  <path d="M 62,168 Q 72,164 80,168 L 80,185 Q 76,192 66,190 Q 58,188 58,180 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="68" y1="164" x2="68" y2="172" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="74" y1="163" x2="74" y2="171" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
