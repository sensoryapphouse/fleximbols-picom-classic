  <g stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- water line -->
    <path d="M10 200 Q150 210 280 200" fill="none" stroke="#3b6fb0" stroke-width="5"/>
    <!-- body: plump white pelican floating -->
    <path d="M70 150 Q60 110 110 102 Q160 96 200 120 Q236 140 236 168 Q236 196 196 198 L100 198 Q66 192 70 150 Z"
          fill="#f2f2f2"/>
    <!-- neck: filled column from body up to head -->
    <path d="M104 132 Q84 92 110 64 L132 70 Q116 100 124 134 Z" fill="#f2f2f2"/>
    <!-- folded wing -->
    <path d="M120 130 Q170 122 210 150 Q190 172 150 172 Q120 168 120 130 Z" fill="#dcdcdc"/>
    <!-- head -->
    <circle cx="128" cy="58" r="22" fill="#f2f2f2"/>
    <!-- eye -->
    <circle cx="136" cy="52" r="3.2" fill="#000000" stroke="none"/>
    <!-- upper bill: long, pointing left -->
    <path d="M108 50 L40 58 Q34 60 40 64 L110 70 Z" fill="#f2b84a"/>
    <!-- gular pouch (the iconic throat pouch) hanging under the bill -->
    <path d="M44 62 Q40 96 78 102 Q112 104 110 70 L46 62 Z" fill="#f6cf86"/>
    <!-- hook tip of bill -->
    <path d="M40 58 Q30 58 32 66 L40 64 Z" fill="#d98e2a"/>
  </g>
</svg>
