  <!-- staircase rising left to right -->
  <polyline points="22,218 22,178 72,178 72,138 122,138 122,98 172,98 172,58 240,58" fill="none" stroke="#4d4d4d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- step fills -->
  <rect x="22" y="178" width="50" height="40" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="72" y="138" width="50" height="40" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="122" y="98" width="50" height="40" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="172" y="58" width="68" height="40" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- figure at top step, stepping up -->
  <!-- legs -->
  <line x1="200" y1="58" x2="190" y2="30" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="214" y1="58" x2="224" y2="30" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- torso -->
  <rect x="188" y="22" width="36" height="6" rx="0" fill="none"/>
  <rect x="186" y="14" width="38" height="42" rx="9" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="205" cy="4" r="16" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- arm raised upward in triumph -->
  <line x1="186" y1="26" x2="168" y2="10" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="224" y1="26" x2="240" y2="8" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- footprints on lower steps to show journey -->
  <ellipse cx="48" cy="174" rx="6" ry="4" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <ellipse cx="98" cy="134" rx="6" ry="4" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <ellipse cx="148" cy="94" rx="6" ry="4" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
</svg>
