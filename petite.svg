  <!-- Petite: small dainty figure beside an average figure (person body-size comparison) -->

  <!-- Average figure (right side, taller): head ~y=45, feet ~y=225, ~180px -->
  <!-- Average body -->
  <rect x="172" y="105" width="38" height="88" rx="8" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Average head -->
  <circle cx="191" cy="75" r="30" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Average eyes -->
  <circle cx="182" cy="70" r="4" fill="#000000"/>
  <circle cx="200" cy="70" r="4" fill="#000000"/>
  <!-- Average mouth -->
  <path d="M183 83 Q191 88 199 83" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Average arms -->
  <rect x="148" y="108" width="24" height="13" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="210" y="108" width="24" height="13" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Average legs -->
  <rect x="173" y="191" width="15" height="34" rx="6" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="193" y="191" width="15" height="34" rx="6" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Petite figure (left side, shorter/smaller): head ~y=85, feet ~y=225, ~140px -->
  <!-- Petite body -->
  <rect x="72" y="140" width="28" height="64" rx="7" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Petite head -->
  <circle cx="86" cy="113" r="22" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Petite eyes -->
  <circle cx="79" cy="109" r="3" fill="#000000"/>
  <circle cx="93" cy="109" r="3" fill="#000000"/>
  <!-- Petite mouth (smile) -->
  <path d="M80 119 Q86 124 92 119" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Petite arms -->
  <rect x="52" y="143" width="20" height="10" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="100" y="143" width="20" height="10" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Petite legs -->
  <rect x="73" y="202" width="11" height="23" rx="5" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="88" y="202" width="11" height="23" rx="5" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Ground line -->
  <line x1="30" y1="228" x2="260" y2="228" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
