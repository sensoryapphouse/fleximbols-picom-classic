  <!-- Shoulders - stiff/squared -->
  <rect x="42" y="183" width="206" height="57" rx="10" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- Neck - stiff rectangle -->
  <rect x="122" y="158" width="46" height="30" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="5"/>
  <!-- Head - slightly grey tinted (pale with fear) -->
  <ellipse cx="145" cy="97" rx="73" ry="73" fill="#efefef" stroke="#000000" stroke-width="5"/>
  <!-- Hair - flat, stiff -->
  <path d="M 72 85 Q 77 22 145 20 Q 213 22 218 85 Q 202 44 145 42 Q 88 44 72 85 Z" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Left brow - flat horizontal (blank stare) -->
  <path d="M 88 70 L 125 70" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Right brow - flat horizontal -->
  <path d="M 165 70 L 202 70" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Left eye - wide, blank, staring (no life) -->
  <ellipse cx="110" cy="90" rx="20" ry="20" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="110" cy="90" r="10" fill="#b8b8b8"/>
  <!-- Right eye - wide, blank, staring -->
  <ellipse cx="180" cy="90" rx="20" ry="20" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="180" cy="90" r="10" fill="#b8b8b8"/>
  <!-- Mouth - straight flat line (frozen) -->
  <path d="M 112 140 L 178 140" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Crack lines on face - frozen with fear cracks -->
  <path d="M 140 60 Q 143 70 138 78" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 165 75 Q 170 82 167 90" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 118 105 Q 112 112 115 120" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Stone crack on forehead - prominent -->
  <path d="M 130 48 Q 137 58 132 66 Q 127 74 133 80" fill="none" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 158 52 Q 162 60 157 68" fill="none" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>
  <!-- Arms frozen stiff at sides -->
  <path d="M 42 183 L 30 175 L 28 195 L 42 195" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <path d="M 248 183 L 260 175 L 262 195 L 248 195" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <!-- Grey pale cheeks -->
  <ellipse cx="94" cy="115" rx="14" ry="9" fill="#b8b8b8" stroke="none"/>
  <ellipse cx="196" cy="115" rx="14" ry="9" fill="#b8b8b8" stroke="none"/>
</svg>
