  <rect x="10" y="220" width="270" height="10" fill="#9d7246" stroke="#000000" stroke-width="2"/>

  <!-- figure FULL BODY (right, wary) -->
  <circle cx="220" cy="76" r="16" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <path d="M204 68 Q206 54 220 52 Q234 54 236 68 Q230 60 220 60 Q210 60 204 68 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <circle cx="214" cy="78" r="1.8" fill="#000000"/>
  <circle cx="226" cy="78" r="1.8" fill="#000000"/>
  <!-- worried mouth -->
  <path d="M214 88 Q220 84 226 88" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- torso -->
  <path d="M198 100 Q220 92 242 100 L246 160 L194 160 Z" fill="#7c3fac" stroke="#000000" stroke-width="3"/>
  <!-- left arm reaching toward email -->
  <path d="M198 102 Q176 116 156 130" fill="none" stroke="#7c3fac" stroke-width="6" stroke-linecap="round"/>
  <circle cx="154" cy="132" r="6" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <!-- right arm -->
  <path d="M242 102 Q260 130 252 158" fill="none" stroke="#7c3fac" stroke-width="6" stroke-linecap="round"/>
  <circle cx="252" cy="160" r="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- legs -->
  <rect x="200" y="158" width="18" height="50" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <rect x="222" y="158" width="18" height="50" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <ellipse cx="209" cy="214" rx="12" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="231" cy="214" rx="12" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>

  <!-- fishing hook descending from top -->
  <path d="M60 10 L60 92 Q60 110 76 110 Q88 110 88 100" fill="none" stroke="#7f7f7f" stroke-width="3.5" stroke-linecap="round"/>
  <!-- hook barb -->
  <path d="M88 100 L92 96" stroke="#7f7f7f" stroke-width="3.5" stroke-linecap="round"/>

  <!-- fake email envelope (hooked) -->
  <g transform="translate(36, 96)">
    <rect x="0" y="0" width="120" height="74" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- envelope flap -->
    <path d="M0 0 L60 40 L120 0" fill="#efefef" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- @ symbol -->
    <circle cx="22" cy="54" r="8" fill="none" stroke="#000000" stroke-width="2"/>
    <circle cx="22" cy="54" r="3" fill="none" stroke="#000000" stroke-width="1.6"/>
    <path d="M30 54 Q34 62 28 64" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- subject line (suspicious link, blue underline) -->
    <rect x="40" y="50" width="60" height="3" fill="#2a4ec0"/>
    <rect x="40" y="55" width="44" height="3" fill="#2a4ec0"/>
    <!-- warning triangle on email -->
    <path d="M98 14 L110 32 L86 32 Z" fill="#f2e40d" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M98 20 L98 26" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <circle cx="98" cy="29" r="1.2" fill="#000000"/>
  </g>

  <!-- prohibition / warning on link -->
  <circle cx="100" cy="190" r="16" fill="none" stroke="#f8130d" stroke-width="4"/>
  <path d="M88 178 L112 202" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
  <!-- suspicious link icon inside -->
  <path d="M92 188 L96 184 L100 188 M98 196 L102 192" stroke="#2a4ec0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
