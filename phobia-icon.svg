<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- looming feared object shadow — large dark amorphous shape right side -->
  <ellipse cx="218" cy="130" rx="48" ry="72" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- shadow detail bumps to suggest a looming presence -->
  <ellipse cx="200" cy="80" rx="28" ry="22" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="230" cy="90" rx="22" ry="18" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- figure recoiling left — leaning away, arms up defensively -->
  <!-- torso leaning left -->
  <rect x="76" y="120" width="56" height="64" rx="12" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round" transform="rotate(-10 104 152)"/>
  <!-- head recoiling back-left -->
  <circle cx="92" cy="88" r="26" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- wide fearful eyes looking right -->
  <circle cx="82" cy="86" r="5" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="100" cy="84" r="6" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="83" cy="87" r="2.5" fill="#000000"/>
  <circle cx="102" cy="85" r="3" fill="#000000"/>
  <!-- fearful brows -->
  <line x1="76" y1="76" x2="86" y2="80" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="94" y1="78" x2="106" y2="74" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- open alarmed mouth -->
  <ellipse cx="90" cy="98" rx="7" ry="5" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- arms raised defensively toward threat -->
  <line x1="100" y1="128" x2="130" y2="106" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="136" cy="102" rx="10" ry="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- other arm also raised -->
  <line x1="76" y1="126" x2="52" y2="108" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="46" cy="104" rx="10" ry="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- legs stumbling back -->
  <line x1="88" y1="182" x2="68" y2="218" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="112" y1="180" x2="118" y2="218" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- fear lines between figure and shadow -->
  <line x1="142" y1="110" x2="168" y2="108" stroke="#f8130d" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
  <line x1="140" y1="124" x2="168" y2="122" stroke="#f8130d" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
  <line x1="138" y1="138" x2="168" y2="138" stroke="#f8130d" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
</svg>
