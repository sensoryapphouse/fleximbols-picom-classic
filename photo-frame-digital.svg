  <!-- outer frame body -->
  <rect x="45" y="22" width="200" height="164" rx="10" ry="10" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- screen bezel -->
  <rect x="60" y="35" width="170" height="138" rx="6" ry="6" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- photo inside — landscape/mountain scene -->
  <!-- sky -->
  <rect x="62" y="37" width="166" height="70" rx="4" ry="4" fill="#dff3fd" stroke="none"/>
  <!-- ground -->
  <rect x="62" y="107" width="166" height="64" rx="0" ry="0" fill="#529929" stroke="none"/>
  <!-- mountain -->
  <polygon points="90,110 145,52 200,110" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="120,110 145,78 170,110" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- sun -->
  <circle cx="205" cy="58" r="16" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- grass foreground -->
  <ellipse cx="100" cy="168" rx="18" ry="8" fill="#137827" stroke="#000000" stroke-width="2"/>
  <ellipse cx="185" cy="166" rx="14" ry="7" fill="#137827" stroke="#000000" stroke-width="2"/>
  <!-- frame bottom bar / stand base -->
  <rect x="110" y="186" width="70" height="10" rx="5" ry="5" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- stand leg -->
  <line x1="145" y1="186" x2="145" y2="216" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- stand foot -->
  <rect x="112" y="212" width="66" height="10" rx="5" ry="5" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
</svg>
