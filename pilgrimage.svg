  <!-- sky -->
  <rect x="0" y="0" width="290" height="170" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <!-- path -->
  <rect x="0" y="170" width="290" height="70" fill="#f5e7c4" stroke="#000000" stroke-width="2"/>
  <!-- sun rays -->
  <circle cx="220" cy="50" r="20" fill="#fff200" stroke="#000000" stroke-width="3"/>
  <line x1="220" y1="20" x2="220" y2="10" stroke="#fff200" stroke-width="3" stroke-linecap="round"/>
  <line x1="245" y1="35" x2="255" y2="28" stroke="#fff200" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="35" x2="185" y2="28" stroke="#fff200" stroke-width="3" stroke-linecap="round"/>
  <!-- sacred destination: temple/shrine on hill -->
  <path d="M150 170 Q190 130 230 170 Z" fill="#67832d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- temple base -->
  <rect x="172" y="118" width="36" height="30" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- temple roof (pagoda style) -->
  <path d="M168 118 L190 95 L212 118 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- finial -->
  <line x1="190" y1="95" x2="190" y2="82" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="190" cy="80" r="3" fill="#f2e40d" stroke="#000000" stroke-width="2"/>
  <!-- temple door -->
  <rect x="184" y="130" width="12" height="18" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- pilgrim FULL BODY (foreground left, walking toward shrine) -->
  <!-- head -->
  <circle cx="80" cy="120" r="11" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- hair / simple cap -->
  <path d="M70 117 L90 117 L88 108 L72 108 Z" fill="#4d4d4d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- robe / tunic -->
  <path d="M62 132 L98 132 L102 200 L58 200 Z" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- belt -->
  <rect x="60" y="158" width="42" height="5" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- arms -->
  <line x1="62" y1="138" x2="48" y2="160" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="98" y1="138" x2="112" y2="155" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- walking staff in left hand -->
  <line x1="48" y1="160" x2="44" y2="80" stroke="#5e1f0a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="44" cy="78" r="4" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <!-- prayer beads in right hand -->
  <circle cx="112" cy="158" r="2" fill="#f7de58" stroke="#000000" stroke-width="1"/>
  <circle cx="116" cy="162" r="2" fill="#f7de58" stroke="#000000" stroke-width="1"/>
  <circle cx="118" cy="168" r="2" fill="#f7de58" stroke="#000000" stroke-width="1"/>
  <circle cx="116" cy="174" r="2" fill="#f7de58" stroke="#000000" stroke-width="1"/>
  <circle cx="112" cy="178" r="2" fill="#f7de58" stroke="#000000" stroke-width="1"/>
  <circle cx="108" cy="174" r="2" fill="#f7de58" stroke="#000000" stroke-width="1"/>
  <circle cx="106" cy="168" r="2" fill="#f7de58" stroke="#000000" stroke-width="1"/>
  <circle cx="108" cy="162" r="2" fill="#f7de58" stroke="#000000" stroke-width="1"/>
  <!-- cross/tassel on beads -->
  <line x1="112" y1="180" x2="112" y2="190" stroke="#7d5e23" stroke-width="2" stroke-linecap="round"/>
  <!-- legs (under robe) -->
  <rect x="68" y="200" width="10" height="20" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <rect x="84" y="200" width="10" height="20" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- feet/sandals -->
  <ellipse cx="73" cy="222" rx="7" ry="3" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="89" cy="222" rx="7" ry="3" fill="#000000" stroke="#000000" stroke-width="2"/>
