  <!-- palm body -->
  <ellipse cx="145" cy="162" rx="72" ry="60" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- wrist base -->
  <rect x="110" y="200" width="70" height="26" rx="10" ry="10" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- middle finger (curled, stub) -->
  <rect x="148" y="102" width="28" height="52" rx="14" ry="14" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- ring finger (curled, stub) -->
  <rect x="178" y="112" width="26" height="48" rx="13" ry="13" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- pinky (curled, short stub) -->
  <rect x="204" y="126" width="22" height="40" rx="11" ry="11" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- index finger angled down to pinch point -->
  <path d="M118 150 C108 130 104 100 114 80 C120 66 132 58 140 68 C148 78 144 104 138 124" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- index fingertip rounded cap -->
  <ellipse cx="126" cy="74" rx="14" ry="14" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round" transform="rotate(20 126 74)"/>
  <!-- thumb arcing in from left to pinch point -->
  <path d="M82 148 C72 132 70 106 80 86 C88 70 102 62 114 72 C126 82 126 106 126 126" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- thumb tip rounded -->
  <ellipse cx="88" cy="88" rx="14" ry="14" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round" transform="rotate(-20 88 88)"/>
  <!-- small pinch gap between finger and thumb tips -->
  <line x1="110" y1="74" x2="126" y2="80" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
</svg>
