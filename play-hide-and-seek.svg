  <!-- bark lines -->
  <line x1="143" y1="115" x2="143" y2="170" stroke="#5e1f0a" stroke-width="2"/>
  <line x1="157" y1="120" x2="157" y2="180" stroke="#5e1f0a" stroke-width="2"/>
  <!-- canopy -->
