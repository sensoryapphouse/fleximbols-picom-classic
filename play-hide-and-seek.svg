  <ellipse cx="92" cy="120" rx="6" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- mouth -->
  <path d="M82 132 Q85 134 88 132" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- torso (facing tree, slight lean) -->
  <path d="M68 138 L102 138 L100 188 L70 188 Z" fill="#f266aa" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arms going up to face -->
  <path d="M72 142 Q72 130 78 122" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M98 142 Q98 130 92 122" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M72 142 Q72 130 78 122" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M98 142 Q98 130 92 122" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
