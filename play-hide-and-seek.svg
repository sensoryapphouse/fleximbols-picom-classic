  <ellipse cx="68" cy="225" rx="9" ry="4" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="102" cy="225" rx="9" ry="4" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>

  <!-- HIDING CHILD peeking behind tree on right -->
  <!-- head visible to right of trunk -->
  <circle cx="180" cy="135" r="14" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <path d="M166 132 Q172 120 180 119 Q190 120 194 132 Q188 127 180 127 Q172 127 166 132 Z" fill="#7d5e23" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
