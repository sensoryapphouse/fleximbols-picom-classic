  <circle cx="118" cy="75" r="28" fill="#529929" stroke="#000000" stroke-width="3"/>
  <circle cx="182" cy="75" r="28" fill="#529929" stroke="#000000" stroke-width="3"/>

  <!-- COUNTING CHILD (left side, FULL BODY, face against tree, hands over eyes) -->
  <!-- head -->
  <circle cx="85" cy="120" r="16" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <path d="M70 116 Q75 102 85 100 Q95 102 100 116 Q95 110 85 110 Q75 110 70 116 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
