  <!-- indoor play tent with child full body inside -->
  <!-- tent body (colourful triangle/cone) -->
  <path d="M145 20 L40 210 L250 210 Z" fill="#f266aa" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- vertical stripes for colour -->
  <path d="M145 20 L100 210 L70 210 L122 20 Z" fill="#3aa6a0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M145 20 L190 210 L220 210 L168 20 Z" fill="#fff200" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- tent door opening (D-shape revealing child) -->
  <path d="M115 210 Q115 120 145 100 Q175 120 175 210 Z" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- child inside, full body visible through opening -->
  <!-- legs -->
  <rect x="132" y="180" width="10" height="26" fill="#2a4ec0" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="148" y="180" width="10" height="26" fill="#2a4ec0" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- torso -->
  <path d="M126 148 L126 184 L164 184 L164 148 Z" fill="#d01424" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- arms -->
  <path d="M126 152 L116 174 L122 178 L130 158 Z" fill="#eed5b6" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M164 152 L174 174 L168 178 L160 158 Z" fill="#eed5b6" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="145" cy="136" r="16" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <path d="M130 132 Q132 120 145 118 Q158 120 160 132 Q156 126 145 126 Q134 126 130 132 Z" fill="#7d5e23" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="140" cy="137" r="1.5" fill="#000000"/>
  <circle cx="150" cy="137" r="1.5" fill="#000000"/>
  <path d="M140 142 Q145 146 150 142" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- tent top finial/pennant -->
  <circle cx="145" cy="20" r="6" fill="#7c3fac" stroke="#000000" stroke-width="3"/>
  <path d="M145 20 L170 14 L168 24 Z" fill="#ff9900" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- door tie-backs -->
  <ellipse cx="118" cy="160" rx="4" ry="6" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <ellipse cx="172" cy="160" rx="4" ry="6" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <!-- ground line -->
  <line x1="30" y1="212" x2="260" y2="212" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
