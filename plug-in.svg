  <rect x="200" y="96" width="16" height="26" rx="5" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right socket hole -->
  <rect x="232" y="96" width="16" height="26" rx="5" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Plug body being inserted — moving right (connection made, prongs entering) -->
  <rect x="60" y="78" width="110" height="84" rx="12" ry="12" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Plug face plate detail -->
