  <!-- PMR synonym: body with sequential muscle-relaxation indicators (1,2,3 dots cascading) -->
  <!-- head -->
  <circle cx="145" cy="40" r="22" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <path d="M125 34 Q145 12 165 34 Q165 24 145 20 Q125 24 125 34 Z" fill="#7d5e23" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- closed eyes (relaxed) -->
  <path d="M133 40 Q138 44 143 40" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M147 40 Q152 44 157 40" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M139 50 Q145 53 151 50" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="138" y="58" width="14" height="10" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <!-- torso -->
  <path d="M108 68 L182 68 L188 138 L102 138 Z" fill="#7c3fac" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arms relaxed at sides -->
  <rect x="86" y="72" width="16" height="80" rx="7" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <rect x="188" y="72" width="16" height="80" rx="7" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <!-- legs -->
  <rect x="116" y="138" width="22" height="92" rx="8" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <rect x="152" y="138" width="22" height="92" rx="8" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <!-- sequential muscle relaxation dots cascading down (numbered conceptually by position) -->
  <!-- dot 1: shoulder -->
  <circle cx="60" cy="76" r="9" fill="#f8130d" stroke="#000000" stroke-width="2.5"/>
  <circle cx="60" cy="76" r="3" fill="#ffffff"/>
  <!-- arrow -->
  <path d="M60 88 L60 110" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M55 104 L60 112 L65 104" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dot 2: torso/arm -->
  <circle cx="60" cy="124" r="9" fill="#ff9900" stroke="#000000" stroke-width="2.5"/>
  <circle cx="60" cy="124" r="3" fill="#ffffff"/>
  <path d="M60 136 L60 158" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M55 152 L60 160 L65 152" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dot 3: thigh -->
  <circle cx="60" cy="172" r="9" fill="#f2e40d" stroke="#000000" stroke-width="2.5"/>
  <circle cx="60" cy="172" r="3" fill="#000000"/>
  <path d="M60 184 L60 206" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M55 200 L60 208 L65 200" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dot 4: calf/foot -->
  <circle cx="60" cy="220" r="9" fill="#529929" stroke="#000000" stroke-width="2.5"/>
  <circle cx="60" cy="220" r="3" fill="#ffffff"/>
  <!-- right side: relaxation waves -->
  <path d="M218 88 Q230 96 218 104 Q230 112 218 120" fill="none" stroke="#3aa6a0" stroke-width="3" stroke-linecap="round"/>
  <path d="M232 100 Q244 108 232 116 Q244 124 232 132" fill="none" stroke="#3aa6a0" stroke-width="3" stroke-linecap="round"/>
  <path d="M218 152 Q230 160 218 168 Q230 176 218 184" fill="none" stroke="#3aa6a0" stroke-width="3" stroke-linecap="round"/>
</svg>
