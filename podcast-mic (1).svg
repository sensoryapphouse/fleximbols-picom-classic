  <!-- boom arm base clamp on left edge of desk -->
  <rect x="20" y="195" width="30" height="35" rx="3" ry="3" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <rect x="22" y="200" width="26" height="6" fill="#7f7f7f" stroke="#000000" stroke-width="1.5"/>
  <!-- desk/table line -->
  <line x1="0" y1="225" x2="290" y2="225" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- boom arm segment 1 (lower diagonal) -->
  <line x1="35" y1="195" x2="100" y2="120" stroke="#4d4d4d" stroke-width="8" stroke-linecap="round"/>
  <line x1="35" y1="195" x2="100" y2="120" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
  <line x1="35" y1="195" x2="100" y2="120" stroke="#7f7f7f" stroke-width="5" stroke-linecap="round"/>
  <!-- pivot 1 -->
  <circle cx="100" cy="120" r="8" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- boom arm segment 2 (upper to horizontal) -->
  <line x1="100" y1="120" x2="180" y2="80" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="180" y2="80" stroke="#7f7f7f" stroke-width="5" stroke-linecap="round"/>
  <!-- pivot 2 -->
  <circle cx="180" cy="80" r="8" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- shock mount (cradle around mic) -->
  <ellipse cx="200" cy="115" rx="40" ry="48" fill="none" stroke="#000000" stroke-width="3"/>
  <line x1="180" y1="80" x2="200" y2="80" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="115" x2="178" y2="115" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="222" y1="115" x2="240" y2="115" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="167" y1="92" x2="178" y2="100" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="167" y1="138" x2="178" y2="130" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="233" y1="92" x2="222" y2="100" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="233" y1="138" x2="222" y2="130" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- microphone body (cylindrical capsule) -->
  <rect x="185" y="78" width="30" height="100" rx="14" ry="14" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- mic grille -->
  <rect x="188" y="83" width="24" height="55" rx="10" ry="10" fill="#000000" stroke="#000000" stroke-width="2"/>
  <line x1="190" y1="92" x2="210" y2="92" stroke="#7f7f7f" stroke-width="1.5"/>
  <line x1="190" y1="100" x2="210" y2="100" stroke="#7f7f7f" stroke-width="1.5"/>
  <line x1="190" y1="108" x2="210" y2="108" stroke="#7f7f7f" stroke-width="1.5"/>
  <line x1="190" y1="116" x2="210" y2="116" stroke="#7f7f7f" stroke-width="1.5"/>
  <line x1="190" y1="124" x2="210" y2="124" stroke="#7f7f7f" stroke-width="1.5"/>
  <line x1="190" y1="132" x2="210" y2="132" stroke="#7f7f7f" stroke-width="1.5"/>
  <!-- LED indicator on mic body -->
  <circle cx="200" cy="155" r="3" fill="#f8130d" stroke="#000000" stroke-width="1"/>
  <!-- pop filter (round disc in front of mic) -->
  <ellipse cx="155" cy="115" rx="10" ry="42" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <ellipse cx="155" cy="115" rx="6" ry="36" fill="none" stroke="#b8b8b8" stroke-width="1.5"/>
  <!-- pop filter arm -->
  <path d="M165,115 Q175,115 180,100" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- cable hanging from mic -->
  <path d="M200,178 Q205,200 215,210 Q230,222 250,220" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
