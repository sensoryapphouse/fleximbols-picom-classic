  <!-- ppc-specialist: full body + click counter + dollar per click + ad -->

  <!-- Ad banner (top right) -->
  <rect x="148" y="14" width="130" height="46" rx="4" fill="#fff200" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- AD badge -->
  <rect x="156" y="22" width="30" height="18" rx="3" fill="#ff9900" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- A path -->
  <path d="M162,36 L166,26 L170,36 M163,32 L169,32" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- D path -->
  <path d="M174,26 L174,36 L178,36 Q182,36 182,31 Q182,26 178,26 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
  <line x1="192" y1="28" x2="270" y2="28" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round"/>
  <line x1="192" y1="38" x2="256" y2="38" stroke="#4d4d4d" stroke-width="2" stroke-linecap="round"/>
  <line x1="156" y1="48" x2="270" y2="48" stroke="#4d4d4d" stroke-width="2" stroke-linecap="round"/>

  <!-- Cursor click pointer on ad -->
  <path d="M212,40 L212,68 L220,60 L226,72 L232,68 L226,58 L236,58 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Click ripple -->
  <path d="M204,42 L200,38 M236,42 L240,38 M220,30 L220,24" fill="none" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>

  <!-- Click counter (mid right) -->
  <rect x="148" y="86" width="86" height="48" rx="6" fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="154" y="92" width="74" height="36" rx="3" fill="#137827" stroke="#000000" stroke-width="2"/>
  <!-- Digit 1 -->
  <path d="M164,100 L164,120" fill="none" stroke="#fff200" stroke-width="4" stroke-linecap="round"/>
  <!-- Digit 2 -->
  <path d="M174,100 L184,100 L184,110 L174,110 L174,120 L184,120" fill="none" stroke="#fff200" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Digit 3 -->
  <path d="M192,100 L202,100 L202,110 L194,110 L202,110 L202,120 L192,120" fill="none" stroke="#fff200" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Digit 4 -->
  <path d="M210,100 L210,110 L222,110 M222,100 L222,120" fill="none" stroke="#fff200" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dollar coin per click -->
  <circle cx="252" cy="162" r="22" fill="#fff200" stroke="#000000" stroke-width="5"/>
  <circle cx="252" cy="162" r="16" fill="none" stroke="#7d5e23" stroke-width="2"/>
  <path d="M256,150 Q246,150 246,158 Q246,164 252,164 Q258,164 258,170 Q258,176 248,176 M252,146 L252,180" fill="none" stroke="#7d5e23" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Person full body (left) -->
  <circle cx="70" cy="76" r="20" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <path d="M50,72 Q50,54 70,52 Q90,54 90,72 L86,64 Q70,58 54,64 Z" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="64" cy="78" r="2" fill="#000000"/>
  <circle cx="78" cy="78" r="2" fill="#000000"/>
  <path d="M64,86 Q70,90 78,86" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Torso -->
  <rect x="48" y="98" width="44" height="56" rx="6" fill="#e65a00" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Arms -->
  <line x1="52" y1="110" x2="28" y2="156" stroke="#e6b98a" stroke-width="9" stroke-linecap="round"/>
  <circle cx="26" cy="158" r="7" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <line x1="88" y1="110" x2="128" y2="142" stroke="#e6b98a" stroke-width="9" stroke-linecap="round"/>
  <circle cx="130" cy="144" r="7" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Hips -->
  <rect x="46" y="152" width="48" height="22" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Legs -->
  <rect x="50" y="172" width="16" height="46" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="74" y="172" width="16" height="46" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="44" y="214" width="22" height="10" rx="4" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="72" y="214" width="22" height="10" rx="4" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
