  <!-- Tie -->
  <polygon points="130,108 124,118 130,165 136,118" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- 'PI' badge on lapel (path shapes only) -->
  <rect x="105" y="118" width="20" height="20" rx="3" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- 'P' formed by paths -->
  <rect x="109" y="121" width="3" height="14" fill="#000000" stroke="none"/>
  <path d="M 112 121 L 117 121 Q 120 121 120 124 Q 120 127 117 127 L 112 127" fill="#000000" stroke="none"/>
