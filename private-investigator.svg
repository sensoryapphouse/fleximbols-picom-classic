  <rect x="195" y="158" width="60" height="42" rx="4" fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="225" cy="180" r="14" fill="#4d4d4d" stroke="#ffffff" stroke-width="3"/>
  <circle cx="225" cy="180" r="8" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <rect x="240" y="163" width="10" height="5" fill="#f7de58" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Camera strap to right hand -->
  <path d="M 195 168 Q 185 175 178 178" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Small magnifying glass upper left -->
  <circle cx="35" cy="60" r="20" fill="#dff3fd" stroke="#000000" stroke-width="4"/>
  <line x1="50" y1="75" x2="68" y2="98" stroke="#7d5e23" stroke-width="8" stroke-linecap="round"/>
  <path d="M 24 50 Q 30 44 38 44" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
