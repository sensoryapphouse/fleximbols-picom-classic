  <rect x="120" y="121" width="3" height="14" fill="#000000" stroke="none"/>
  <!-- Arms -->
  <rect x="73" y="105" width="22" height="65" rx="8" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="165" y="105" width="22" height="65" rx="8" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Hands -->
  <circle cx="84" cy="178" r="9" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <circle cx="176" cy="178" r="9" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Legs (full body) -->
  <rect x="105" y="208" width="22" height="18" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="133" y="208" width="22" height="18" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="116" cy="228" rx="14" ry="5" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="144" cy="228" rx="14" ry="5" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Head -->
  <circle cx="130" cy="70" r="22" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Eyes -->
  <circle cx="123" cy="69" r="2.5" fill="#000000"/>
  <circle cx="137" cy="69" r="2.5" fill="#000000"/>
  <!-- Hat (small fedora) -->
  <ellipse cx="130" cy="50" rx="32" ry="6" fill="#2a4ec0" stroke="#000000" stroke-width="4"/>
  <path d="M 113 50 Q 113 32 130 32 Q 147 32 147 50 Z" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="113" y="46" width="34" height="5" fill="#1d0e82" stroke="none"/>
