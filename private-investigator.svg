  <!-- Suit body (dark grey/black) -->
  <path d="M 100 100 L 100 180 L 85 200 L 85 220 L 175 220 L 175 200 L 160 180 L 160 100 Z" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Shirt collar V -->
