  <!-- Standing person (receiver) -->
  <!-- Head -->
  <circle cx="210" cy="65" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M192,58 Q210,46 228,58 L228,65 Q210,54 192,65 Z" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eyes + smile -->
  <circle cx="204" cy="66" r="2" fill="#000000"/>
  <circle cx="216" cy="66" r="2" fill="#000000"/>
  <path d="M205,75 Q210,80 215,75" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <ellipse cx="200" cy="72" rx="5" ry="3" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="220" cy="72" rx="5" ry="3" fill="#f4a4b2" stroke="none"/>
  <!-- Body dress -->
  <path d="M193,85 L188,200 L232,200 L227,85 Q210,95 193,85 Z" fill="#f266aa" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Arms -->
  <line x1="193" y1="92" x2="178" y2="125" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <line x1="227" y1="92" x2="242" y2="125" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="196" y="198" width="12" height="28" rx="4" fill="#f266aa" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="212" y="198" width="12" height="28" rx="4" fill="#f266aa" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Kneeling person (proposer) -->
  <!-- Head -->
  <circle cx="90" cy="85" r="20" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Short hair -->
  <path d="M72,78 Q90,68 108,78 L108,85 Q90,75 72,85 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eyes + smile -->
  <circle cx="84" cy="86" r="2" fill="#000000"/>
  <circle cx="96" cy="86" r="2" fill="#000000"/>
  <path d="M85,95 Q90,100 95,95" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Upper body / jacket -->
  <rect x="72" y="105" width="36" height="55" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Tie -->
  <polygon points="90,108 87,128 90,135 93,128" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <!-- Kneeling leg (one knee on ground) -->
  <rect x="74" y="158" width="15" height="30" rx="5" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Foot on ground -->
  <ellipse cx="81" cy="192" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- Other leg bent/upright -->
  <path d="M89,158 L89,185 L106,185" fill="none" stroke="#2a4ec0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M89,158 L89,185 L106,185" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arm extended with ring box -->
  <line x1="108" y1="118" x2="150" y2="140" stroke="#e6b98a" stroke-width="9" stroke-linecap="round"/>
  <!-- Ring box -->
  <rect x="148" y="133" width="28" height="20" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Box lid open -->
  <path d="M148,133 Q162,118 176,133" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Ring in box -->
  <circle cx="162" cy="138" r="7" fill="none" stroke="#f7de58" stroke-width="4"/>
  <!-- Diamond on ring -->
  <polygon points="162,128 157,134 162,137 167,134" fill="#dff3fd" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>

  <!-- Hearts floating -->
  <path d="M145,55 Q145,45 152,45 Q159,45 159,55 Q159,45 166,45 Q173,45 173,55 Q173,67 159,76 Q145,67 145,55 Z" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M60,45 Q60,38 65,38 Q70,38 70,45 Q70,38 75,38 Q80,38 80,45 Q80,54 70,61 Q60,54 60,45 Z" fill="#f266aa" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
</svg>
