  <!-- ground -->
  <rect x="10" y="212" width="270" height="12" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- COUCH on left with reclining client -->
  <!-- couch arm/headrest (raised left end) -->
  <path d="M12 130 Q12 115 27 115 L48 115 L48 175 L12 175 Z" fill="#7c3fac" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- couch body -->
  <rect x="48" y="135" width="135" height="55" fill="#7c3fac" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- couch backrest (low) -->
  <rect x="48" y="118" width="135" height="22" fill="#392170" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- couch legs -->
  <rect x="55" y="190" width="10" height="18" fill="#5e1f0a" stroke="#000000" stroke-width="2.5"/>
  <rect x="165" y="190" width="10" height="18" fill="#5e1f0a" stroke="#000000" stroke-width="2.5"/>
  <!-- reclining client: head on raised end (left), full body lying along couch -->
  <!-- head -->
  <circle cx="38" cy="105" r="13" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M26 102 Q26 90 38 90 Q50 90 50 102 Q45 95 38 95 Q31 95 26 102 Z" fill="#7d5e23" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- eyes (closed, resting) -->
  <path d="M32 105 Q35 107 38 105" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 105 Q43 107 46 105" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- mouth -->
  <path d="M35 113 Q38 115 41 113" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- neck (short, sloping into body lying down) -->
  <path d="M48 115 L55 120 L55 130 L48 130 Z" fill="#e6b98a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- torso (lying horizontal along couch) -->
  <rect x="55" y="120" width="70" height="22" rx="4" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arms: one resting on body, one along side -->
  <path d="M75 142 L78 162 L88 162 L86 140 Z" fill="#529929" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="83" cy="163" r="5" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <path d="M62 122 L55 110 L48 112 L52 122" fill="#529929" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- legs (extending right along couch) -->
  <rect x="120" y="120" width="55" height="14" rx="3" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="120" y="135" width="55" height="14" rx="3" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- feet -->
  <ellipse cx="178" cy="127" rx="8" ry="5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="178" cy="142" rx="8" ry="5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- THERAPIST in chair on right taking notes -->
  <!-- chair back -->
  <rect x="262" y="100" width="14" height="100" fill="#9d7246" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="220" y="158" width="60" height="10" fill="#7d5e23" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="222" y="168" width="8" height="35" fill="#7d5e23" stroke="#000000" stroke-width="2.5"/>
  <!-- therapist head -->
  <circle cx="240" cy="80" r="14" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M228 78 Q228 64 240 64 Q252 64 252 78 Q247 70 240 70 Q233 70 228 78 Z" fill="#4d4d4d" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- glasses -->
  <circle cx="236" cy="82" r="3.5" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="244" cy="82" r="3.5" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="240" y1="82" x2="240" y2="82" stroke="#000000" stroke-width="2"/>
  <!-- eyes -->
  <circle cx="236" cy="82" r="1.3" fill="#000000"/>
  <circle cx="244" cy="82" r="1.3" fill="#000000"/>
  <!-- mouth -->
  <path d="M236 90 Q240 92 244 90" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="235" y="92" width="10" height="6" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <!-- torso -->
  <path d="M222 100 L222 155 Q222 160 226 160 L254 160 Q258 160 258 155 L258 100 Q258 97 254 97 L226 97 Q222 97 222 100 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arms: both forward, holding clipboard on lap -->
  <path d="M222 115 L208 125 L208 145 L218 145 L218 128 L226 122 Z" fill="#d01424" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M258 115 L266 122 L266 145 L260 145 L260 128 L254 122 Z" fill="#d01424" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- clipboard on lap -->
  <rect x="206" y="138" width="58" height="36" rx="2" fill="#f5e7c4" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- clip -->
  <rect x="228" y="134" width="14" height="8" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- note lines -->
  <line x1="212" y1="150" x2="258" y2="150" stroke="#000000" stroke-width="1.8"/>
  <line x1="212" y1="158" x2="258" y2="158" stroke="#000000" stroke-width="1.8"/>
  <line x1="212" y1="166" x2="244" y2="166" stroke="#000000" stroke-width="1.8"/>
  <!-- pen -->
  <path d="M196 132 L210 146" stroke="#1d0e82" stroke-width="4" stroke-linecap="round"/>
  <!-- therapist legs (seated) -->
  <rect x="222" y="174" width="14" height="30" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <rect x="244" y="174" width="14" height="30" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <ellipse cx="228" cy="207" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="250" cy="207" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
</svg>
