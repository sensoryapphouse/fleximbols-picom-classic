  <rect x="221" y="100" width="8" height="14" fill="#efefef" stroke="#000000" stroke-width="2"/>
  <!-- readout bars below lungs -->
  <rect x="194" y="148" width="62" height="8" fill="#3aa6a0" stroke="#000000" stroke-width="2"/>
  <rect x="194" y="160" width="48" height="8" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <rect x="194" y="172" width="32" height="8" fill="#ff9900" stroke="#000000" stroke-width="2"/>
