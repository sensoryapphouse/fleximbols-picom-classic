  <!-- purse-modern: structured women's handbag with top handle, shoulder strap, clasp -->
  <!-- Shoulder strap (diagonal) -->
  <path d="M85 100 Q60 80 50 55" fill="none" stroke="#7d5e23" stroke-width="5" stroke-linecap="round"/>
  <!-- Top handle arc -->
  <path d="M118 95 Q145 65 172 95" fill="none" stroke="#7d5e23" stroke-width="6" stroke-linecap="round"/>
  <!-- Bag body: structured rectangle with rounded bottom -->
  <rect x="80" y="100" width="130" height="110" rx="10" ry="10" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Front panel detail line -->
  <rect x="93" y="113" width="104" height="84" rx="6" ry="6" fill="none" stroke="#7d5e23" stroke-width="2.5"/>
  <!-- Clasp hardware on top edge -->
  <rect x="125" y="96" width="40" height="14" rx="5" ry="5" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <!-- Clasp turn-lock circle -->
  <circle cx="145" cy="103" r="5" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <!-- Clasp center bar -->
  <rect x="140" y="100" width="10" height="6" rx="2" ry="2" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- Bottom feet -->
  <circle cx="100" cy="207" r="5" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <circle cx="190" cy="207" r="5" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
</svg>
