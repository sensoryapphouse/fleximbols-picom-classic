  <!-- qa-engineer: full body QA engineer + bug-magnifier + checklist + QA label -->

  <!-- Person: full body, standing left -->
  <!-- Head -->
  <circle cx="60" cy="56" r="20" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="60" cy="42" rx="20" ry="10" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <rect x="40" y="78" width="40" height="52" rx="6" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm holding magnifier -->
  <line x1="40" y1="86" x2="20" y2="106" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="20" cy="108" r="6" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Right arm holding checklist -->
  <line x1="80" y1="90" x2="100" y2="118" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="102" cy="120" r="6" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Hips -->
  <rect x="38" y="128" width="44" height="22" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect x="38" y="148" width="16" height="52" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="66" y="148" width="16" height="52" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left foot -->
  <rect x="32" y="196" width="22" height="10" rx="4" fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right foot -->
  <rect x="64" y="196" width="22" height="10" rx="4" fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Magnifier with bug (top-right area) -->
  <!-- Magnifier lens -->
  <circle cx="200" cy="80" r="32" fill="#dff3fd" stroke="#000000" stroke-width="5"/>
  <circle cx="200" cy="80" r="32" fill="none" stroke="#90a7d6" stroke-width="2"/>
  <!-- Magnifier handle -->
  <line x1="224" y1="104" x2="252" y2="132" stroke="#7f7f7f" stroke-width="10" stroke-linecap="round"/>
  <line x1="224" y1="104" x2="252" y2="132" stroke="#000000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Bug body -->
  <ellipse cx="200" cy="82" rx="12" ry="10" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <!-- Bug head -->
  <circle cx="200" cy="70" r="5" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- Bug antennae -->
  <line x1="197" y1="66" x2="194" y2="60" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="203" y1="66" x2="206" y2="60" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Bug legs -->
  <line x1="188" y1="80" x2="182" y2="76" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="188" y1="84" x2="182" y2="84" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="188" y1="88" x2="182" y2="92" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="212" y1="80" x2="218" y2="76" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="212" y1="84" x2="218" y2="84" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="212" y1="88" x2="218" y2="92" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Bug centre stripe -->
  <line x1="200" y1="72" x2="200" y2="92" stroke="#000000" stroke-width="2"/>

  <!-- Checklist (bottom-right) -->
  <rect x="118" y="138" width="60" height="78" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="134" y="132" width="28" height="10" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Row 1 -->
  <rect x="124" y="148" width="10" height="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <polyline points="125,153 128,156 133,150" fill="none" stroke="#529929" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="140" y1="153" x2="172" y2="153" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Row 2 -->
  <rect x="124" y="164" width="10" height="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <polyline points="125,169 128,172 133,166" fill="none" stroke="#529929" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="140" y1="169" x2="172" y2="169" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Row 3 (X red) -->
  <rect x="124" y="180" width="10" height="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <line x1="125" y1="181" x2="133" y2="189" stroke="#f8130d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="133" y1="181" x2="125" y2="189" stroke="#f8130d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="140" y1="185" x2="172" y2="185" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Row 4 -->
  <rect x="124" y="196" width="10" height="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <polyline points="125,201 128,204 133,198" fill="none" stroke="#529929" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="140" y1="201" x2="172" y2="201" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- QA label banner -->
  <rect x="218" y="160" width="60" height="30" rx="4" fill="#7c3fac" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Q -->
  <circle cx="234" cy="175" r="7" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="238" y1="179" x2="244" y2="184" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- A -->
  <path d="M253,184 L260,166 L267,184 M255,178 L265,178" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
