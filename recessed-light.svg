  <!-- recessed-light: ceiling with two flush round downlights casting cones -->
  <!-- ceiling band -->
  <rect x="22" y="22" width="246" height="36" rx="6" ry="6" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ceiling texture lines -->
  <line x1="22" y1="40" x2="268" y2="40" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- === recessed housing left === -->
  <ellipse cx="90" cy="46" rx="30" ry="10" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- inner ring flush -->
  <ellipse cx="90" cy="46" rx="20" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bulb aperture glow -->
  <ellipse cx="90" cy="46" rx="12" ry="4" fill="#fff200" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- light cone left -->
  <path d="M72 56 L42 185 L138 185 L118 56 Z" fill="#f7de58" stroke="#f2e40d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cone highlight centre line -->
  <line x1="90" y1="56" x2="90" y2="185" stroke="#fff200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- === recessed housing right === -->
  <ellipse cx="200" cy="46" rx="30" ry="10" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="200" cy="46" rx="20" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="200" cy="46" rx="12" ry="4" fill="#fff200" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- light cone right -->
  <path d="M182 56 L152 185 L248 185 L228 56 Z" fill="#f7de58" stroke="#f2e40d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="200" y1="56" x2="200" y2="185" stroke="#fff200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
