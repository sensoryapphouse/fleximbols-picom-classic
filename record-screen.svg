  <!-- phone body -->
  <rect x="55" y="20" width="180" height="200" rx="20" ry="20" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <rect x="67" y="38" width="156" height="164" rx="4" ry="4" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <rect x="125" y="28" width="40" height="5" rx="2" ry="2" fill="#000000" stroke="#000000" stroke-width="1"/>
  <circle cx="145" cy="211" r="6" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <!-- status bar across top of screen -->
  <rect x="67" y="38" width="156" height="22" fill="#d01424" stroke="#000000" stroke-width="2"/>
  <!-- recording dot in status bar -->
  <circle cx="82" cy="49" r="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- screen content: play/film -->
  <rect x="80" y="80" width="130" height="80" rx="6" ry="6" fill="#000000" stroke="#000000" stroke-width="2"/>
  <path d="M125 100 L160 120 L125 140 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- red REC dot circled (record badge), bottom of screen -->
  <circle cx="100" cy="180" r="14" fill="#d01424" stroke="#000000" stroke-width="3"/>
  <circle cx="100" cy="180" r="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- screen-recording outline frame (dashed-ish via small rects) showing the screen itself is being captured -->
  <rect x="45" y="10" width="200" height="220" rx="24" ry="24" fill="none" stroke="#d01424" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- corner brackets emphasising capture of whole screen -->
  <path d="M40 30 L40 10 L60 10" fill="none" stroke="#d01424" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M230 10 L250 10 L250 30" fill="none" stroke="#d01424" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 210 L40 230 L60 230" fill="none" stroke="#d01424" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M230 230 L250 230 L250 210" fill="none" stroke="#d01424" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- big REC badge in corner -->
  <circle cx="245" cy="195" r="22" fill="#d01424" stroke="#000000" stroke-width="3"/>
  <circle cx="245" cy="195" r="9" fill="#ffffff" stroke="#000000" stroke-width="2"/>
</svg>
