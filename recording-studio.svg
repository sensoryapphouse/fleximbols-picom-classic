<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Booth window (glass panel separating booth from desk) -->
  <rect x="22" y="25" width="100" height="130" rx="6" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Window frame crossbar -->
  <line x1="22" y1="90" x2="122" y2="90" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="72" y1="25" x2="72" y2="155" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Mic stand inside booth (visible through glass) -->
  <!-- Stand base -->
  <ellipse cx="62" cy="148" rx="18" ry="6" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Stand pole -->
  <rect x="59" y="75" width="6" height="73" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- Mic body (condenser) inside booth -->
  <rect x="50" y="55" width="24" height="44" rx="12" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Mic grille -->
  <ellipse cx="62" cy="63" rx="10" ry="4" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <line x1="53" y1="68" x2="71" y2="68" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="52" y1="75" x2="72" y2="75" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="53" y1="82" x2="71" y2="82" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Pop filter (circular ring in front of mic) -->
  <circle cx="62" cy="70" r="18" fill="none" stroke="#000000" stroke-width="4"/>
  <circle cx="62" cy="70" r="14" fill="none" stroke="#b8b8b8" stroke-width="2"/>
  <!-- Pop filter arm -->
  <line x1="62" y1="88" x2="62" y2="99" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Mixing desk (right side, control room) -->
  <!-- Desk surface angled -->
  <path d="M138,100 L268,80 L268,210 L138,210 Z" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Desk top surface -->
  <path d="M138,100 L268,80 L268,105 L138,125 Z" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Fader channels on desk -->
  <!-- Channel 1 -->
  <rect x="150" y="115" width="16" height="60" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="148" y="140" width="20" height="10" rx="3" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Channel 2 -->
  <rect x="175" y="113" width="16" height="60" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="173" y="133" width="20" height="10" rx="3" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Channel 3 -->
  <rect x="200" y="111" width="16" height="60" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="198" y="150" width="20" height="10" rx="3" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Channel 4 -->
  <rect x="225" y="109" width="16" height="60" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="223" y="125" width="20" height="10" rx="3" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Knobs on top section -->
  <circle cx="155" cy="108" r="6" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <circle cx="180" cy="105" r="6" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <circle cx="205" cy="103" r="6" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <circle cx="230" cy="101" r="6" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <circle cx="252" cy="99" r="6" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <circle cx="252" cy="115" r="6" fill="#f8130d" stroke="#000000" stroke-width="3"/>

  <!-- VU meter panel -->
  <rect x="245" y="125" width="18" height="45" rx="3" fill="#000000" stroke="#000000" stroke-width="3"/>
  <rect x="248" y="128" width="5" height="35" rx="2" fill="#529929" stroke="none"/>
  <rect x="256" y="135" width="5" height="28" rx="2" fill="#529929" stroke="none"/>
  <rect x="248" y="128" width="5" height="10" rx="2" fill="#f8130d" stroke="none"/>

  <!-- Cable from booth to desk -->
  <path d="M122,100 Q130,100 138,110" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
