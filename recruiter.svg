  <rect x="64" y="170" width="16" height="46" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="34" y="212" width="22" height="10" rx="4" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="62" y="212" width="22" height="10" rx="4" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
