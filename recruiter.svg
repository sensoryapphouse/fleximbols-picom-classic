  <line x1="198" y1="98" x2="248" y2="98" stroke="#4d4d4d" stroke-width="2" stroke-linecap="round"/>

  <!-- Interview chair (mid right) -->
  <!-- Chair back -->
  <rect x="200" y="122" width="36" height="44" rx="5" fill="#7c3fac" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Chair seat -->
  <rect x="194" y="164" width="48" height="14" rx="3" fill="#392170" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Chair legs -->
  <line x1="206" y1="178" x2="206" y2="206" stroke="#4d4d4d" stroke-width="5" stroke-linecap="round"/>
  <line x1="230" y1="178" x2="230" y2="206" stroke="#4d4d4d" stroke-width="5" stroke-linecap="round"/>
  <!-- Floor base -->
  <line x1="196" y1="206" x2="240" y2="206" stroke="#4d4d4d" stroke-width="5" stroke-linecap="round"/>

  <!-- Handshake (center) -->
  <!-- Hand 1 (from left, recruiter) -->
  <path d="M100,138 Q116,134 134,142 L150,150 Q156,154 152,160 L140,164 Q126,160 116,156 L100,150 Z" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Hand 2 (from right, candidate) -->
  <path d="M180,138 Q164,134 146,142 L130,150 Q124,154 128,160 L140,164 Q154,160 164,156 L180,150 Z" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
