  <rect x="92" y="134" width="14" height="22" rx="2" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="178" y="134" width="14" height="22" rx="2" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Person full body (left, recruiter) -->
  <circle cx="60" cy="74" r="20" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <path d="M40,70 Q40,52 60,50 Q80,52 80,70 L76,62 Q60,56 44,62 Z" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="54" cy="76" r="2" fill="#000000"/>
  <circle cx="68" cy="76" r="2" fill="#000000"/>
  <path d="M54,84 Q60,88 68,84" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Torso -->
  <rect x="38" y="96" width="44" height="56" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Tie -->
  <path d="M60,96 L56,104 L60,132 L64,104 Z" fill="#d01424" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
