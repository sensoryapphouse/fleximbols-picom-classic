  <path d="M201,46 Q201,38 209,38 Q217,38 217,46 Z" fill="#2a4ec0" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Name lines next to photo -->
  <line x1="226" y1="26" x2="268" y2="26" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="226" y1="34" x2="262" y2="34" stroke="#4d4d4d" stroke-width="2" stroke-linecap="round"/>
  <line x1="226" y1="42" x2="266" y2="42" stroke="#4d4d4d" stroke-width="2" stroke-linecap="round"/>
  <!-- Body lines -->
  <line x1="198" y1="58" x2="268" y2="58" stroke="#4d4d4d" stroke-width="2" stroke-linecap="round"/>
  <line x1="198" y1="66" x2="262" y2="66" stroke="#4d4d4d" stroke-width="2" stroke-linecap="round"/>
