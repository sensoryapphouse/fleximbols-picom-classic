  <!-- recruiter-modern: full body + interview chair + resume + handshake -->

  <!-- Resume (top right) -->
  <rect x="190" y="14" width="86" height="96" rx="4" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
