  <!-- Cake slice body - deep red interior -->
  <path d="M 60,215 L 60,95 L 230,95 L 230,215 Z" fill="#d01424" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Angled top of slice -->
  <path d="M 60,95 L 145,55 L 230,95" fill="#d01424" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- White cream-cheese frosting layer 1 (between cake layers) -->
  <rect x="60" y="138" width="170" height="12" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- White cream-cheese frosting layer 2 -->
  <rect x="60" y="177" width="170" height="12" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Top frosting on angled face -->
  <path d="M 60,95 L 145,55 L 230,95 Q 210,86 190,94 Q 170,84 145,90 Q 120,84 100,94 Q 80,86 60,95 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Front frosting coat -->
  <path d="M 60,95 Q 50,100 60,105 L 60,215 Q 50,220 60,222" fill="none" stroke="#ffffff" stroke-width="0"/>
  <!-- Side frosting left -->
  <rect x="55" y="95" width="10" height="120" rx="2" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Side frosting right -->
  <rect x="225" y="95" width="10" height="120" rx="2" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Bottom base frosting -->
  <rect x="55" y="210" width="180" height="14" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Red crumb decoration on top frosting -->
  <circle cx="120" cy="68" r="4" fill="#d01424" stroke="#000000" stroke-width="1.5"/>
  <circle cx="145" cy="62" r="4" fill="#d01424" stroke="#000000" stroke-width="1.5"/>
  <circle cx="170" cy="68" r="4" fill="#d01424" stroke="#000000" stroke-width="1.5"/>
</svg>
