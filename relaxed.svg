  <!-- Reclined body/torso suggestion (leaning back) -->
  <path d="M45 220 Q60 195 95 185 Q120 180 145 182 Q170 180 195 185 Q230 195 245 220 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Loose arms out to sides -->
  <!-- Left arm -->
  <path d="M95 195 Q65 185 42 200 Q38 215 55 218 Q72 210 95 205 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right arm -->
  <path d="M195 195 Q225 185 248 200 Q252 215 235 218 Q218 210 195 205 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="128" y="152" width="34" height="30" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Head - slightly tilted back (shifted slightly higher) -->
  <ellipse cx="145" cy="115" rx="58" ry="60" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Easy open eyes, relaxed -->
  <ellipse cx="122" cy="110" rx="10" ry="9" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="168" cy="110" rx="10" ry="9" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="122" cy="112" r="5" fill="#4d4d4d"/>
  <circle cx="168" cy="112" r="5" fill="#4d4d4d"/>
  <!-- Slight droopy lids -->
  <path d="M112 107 Q122 104 132 107" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M158 107 Q168 104 178 107" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Easy wide smile -->
  <path d="M118 138 Q145 158 172 138" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <ellipse cx="104" cy="127" rx="13" ry="8" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="186" cy="127" rx="13" ry="8" fill="#f4a4b2" stroke="none"/>
  <!-- Small lounge/recline cue: a simple chaise/couch outline at bottom -->
  <path d="M22 232 Q22 224 30 224 L260 224 Q268 224 268 232" fill="none" stroke="#9d7246" stroke-width="5" stroke-linecap="round"/>
  <rect x="22" y="232" width="246" height="8" rx="4" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- Nose -->
  <path d="M140 118 Q145 126 150 118" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
