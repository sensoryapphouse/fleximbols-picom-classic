  <line x1="228" y1="34" x2="228" y2="40" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="228" y1="76" x2="228" y2="82" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="204" y1="58" x2="210" y2="58" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="246" y1="58" x2="252" y2="58" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Small checkmark near clock -->
  <polyline points="215,88 220,95 232,80" fill="none" stroke="#529929" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
