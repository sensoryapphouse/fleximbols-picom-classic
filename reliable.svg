  <!-- Ground/base platform - solid rock -->
  <rect x="80" y="195" width="130" height="18" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Pillar legs -->
  <rect x="108" y="165" width="22" height="35" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="160" y="165" width="22" height="35" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Body torso -->
  <rect x="105" y="105" width="80" height="65" rx="10" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Arms outstretched down at sides, firm stance -->
  <rect x="68" y="108" width="40" height="16" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="182" y="108" width="40" height="16" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="132" y="90" width="26" height="20" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="145" cy="73" rx="30" ry="28" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="145" cy="50" rx="30" ry="14" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <!-- Eyes - calm, steady -->
  <ellipse cx="135" cy="70" rx="4" ry="5" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <ellipse cx="155" cy="70" rx="4" ry="5" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <!-- Calm smile -->
  <path d="M136 82 Q145 90 154 82" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Checkmark badge on chest -->
  <circle cx="145" cy="132" r="14" fill="#529929" stroke="#000000" stroke-width="3"/>
  <polyline points="137,132 143,139 155,124" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Clock (upper right) -->
  <circle cx="228" cy="58" r="26" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="228" cy="58" r="3" fill="#000000"/>
  <!-- Clock hands - on time (pointing ~12 and 3) -->
  <line x1="228" y1="58" x2="228" y2="38" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="228" y1="58" x2="244" y2="58" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
