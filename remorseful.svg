  <!-- Eyebrows - slanted down inward (guilty/sorry look) -->
  <path d="M108 97 Q120 93 130 98" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M160 98 Q170 93 182 97" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
