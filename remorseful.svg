  <ellipse cx="120" cy="110" rx="12" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="120" cy="116" r="7" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <circle cx="122" cy="114" r="2" fill="#ffffff"/>
  <ellipse cx="170" cy="110" rx="12" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="170" cy="116" r="7" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
