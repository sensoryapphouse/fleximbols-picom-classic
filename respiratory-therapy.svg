<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- ground -->
  <rect x="0" y="218" width="290" height="22" fill="#f5e7c4" stroke="#000000" stroke-width="2.5"/>

  <!-- lung diagram on wall (background) -->
  <rect x="14" y="20" width="80" height="80" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <!-- trachea -->
  <rect x="50" y="32" width="8" height="18" fill="#f4a4b2" stroke="#000000" stroke-width="2"/>
  <!-- left lung -->
  <path d="M40 50 Q24 54 26 78 Q28 92 44 90 Q48 78 46 60 Z" fill="#f266aa" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- right lung -->
  <path d="M68 50 Q84 54 82 78 Q80 92 64 90 Q60 78 62 60 Z" fill="#f266aa" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- branches -->
  <path d="M54 50 L40 65 M54 50 L68 65 M40 65 L34 78 M40 65 L44 78 M68 65 L74 78 M68 65 L64 78" stroke="#d01424" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- PATIENT FULL BODY seated wearing nebulizer mask (centre) -->
  <g transform="translate(150 110)">
    <!-- head -->
    <circle cx="0" cy="0" r="13" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
    <path d="M-13 -4 Q-13 -15 0 -15 Q13 -15 13 -4 Q7 -10 0 -10 Q-7 -10 -13 -4 Z" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
    <circle cx="-4" cy="-2" r="1.6" fill="#000000"/>
    <circle cx="4" cy="-2" r="1.6" fill="#000000"/>
    <!-- mask covering nose+mouth -->
    <path d="M-10 4 Q-10 16 0 16 Q10 16 10 4 Q10 0 0 0 Q-10 0 -10 4 Z" fill="#dff3fd" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- mask straps -->
    <path d="M-10 5 L-16 2" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 5 L16 2" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
    <!-- tube going down -->
    <path d="M0 16 Q-2 26 6 36 Q14 46 28 46" fill="none" stroke="#7f7f7f" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 16 Q-2 26 6 36 Q14 46 28 46" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <!-- neck -->
    <rect x="-5" y="15" width="10" height="4" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
    <!-- torso -->
    <rect x="-18" y="19" width="36" height="40" rx="3" fill="#529929" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- arms -->
    <rect x="-26" y="21" width="8" height="30" fill="#529929" stroke="#000000" stroke-width="2"/>
    <rect x="18" y="21" width="8" height="30" fill="#529929" stroke="#000000" stroke-width="2"/>
    <circle cx="-22" cy="54" r="4" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
    <circle cx="22" cy="54" r="4" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
    <!-- legs (pants) -->
    <rect x="-15" y="59" width="12" height="44" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
    <rect x="3" y="59" width="12" height="44" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
    <ellipse cx="-9" cy="105" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="1.8"/>
    <ellipse cx="9" cy="105" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="1.8"/>
  </g>

  <!-- nebulizer machine on the floor right of patient -->
  <rect x="180" y="155" width="40" height="40" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="186" y="162" width="28" height="14" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <circle cx="190" cy="186" r="3" fill="#529929" stroke="#000000" stroke-width="1.5"/>
  <circle cx="200" cy="186" r="3" fill="#d01424" stroke="#000000" stroke-width="1.5"/>
  <circle cx="210" cy="186" r="3" fill="#000000"/>

  <!-- THERAPIST FULL BODY (right) holding stethoscope -->
  <g transform="translate(255 100)">
    <circle cx="0" cy="0" r="11" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
    <path d="M-11 -3 Q-11 -13 0 -13 Q11 -13 11 -3 Q6 -8 0 -8 Q-6 -8 -11 -3 Z" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
    <circle cx="-3.5" cy="0" r="1.4" fill="#000000"/>
    <circle cx="3.5" cy="0" r="1.4" fill="#000000"/>
    <path d="M-3 6 Q0 8 3 6" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="-5" y="11" width="10" height="4" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
    <rect x="-15" y="15" width="30" height="38" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- stethoscope on chest -->
    <path d="M-6 17 Q-10 26 -4 32 Q0 36 4 32 Q10 26 6 17" fill="none" stroke="#000000" stroke-width="2"/>
    <circle cx="0" cy="34" r="3" fill="#7f7f7f" stroke="#000000" stroke-width="1.5"/>
    <!-- left arm extended toward patient -->
    <path d="M-16 18 L-30 26 L-26 32 L-12 24 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="-28" cy="28" r="4" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
    <rect x="15" y="17" width="7" height="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <circle cx="18" cy="50" r="4" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
    <rect x="-13" y="53" width="11" height="52" fill="#7f7f7f" stroke="#000000" stroke-width="2.5"/>
    <rect x="2" y="53" width="11" height="52" fill="#7f7f7f" stroke="#000000" stroke-width="2.5"/>
    <ellipse cx="-7" cy="107" rx="7" ry="3.5" fill="#000000" stroke="#000000" stroke-width="1.8"/>
    <ellipse cx="7" cy="107" rx="7" ry="3.5" fill="#000000" stroke="#000000" stroke-width="1.8"/>
  </g>
</svg>
