  <!-- palm / fist body -->
  <rect x="88" y="122" width="114" height="86" rx="22" ry="22" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- knuckle division lines: middle + ring curled -->
  <line x1="123" y1="122" x2="123" y2="146" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="152" y1="122" x2="152" y2="146" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="181" y1="122" x2="181" y2="146" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- wrist base -->
  <rect x="110" y="196" width="70" height="26" rx="10" ry="10" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- index finger (left up) -->
  <rect x="88" y="36" width="36" height="100" rx="18" ry="18" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- index knuckle crease -->
  <line x1="90" y1="108" x2="122" y2="108" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- pinky finger (right up) -->
  <rect x="166" y="46" width="32" height="88" rx="16" ry="16" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- pinky knuckle crease -->
  <line x1="168" y1="108" x2="196" y2="108" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- middle finger curled over (rounded bump at top of palm) -->
  <path d="M124 125 Q134 108 145 122" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- ring finger curled over -->
  <path d="M153 125 Q163 108 174 122" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- thumb folded across front of fist -->
  <rect x="96" y="148" width="52" height="28" rx="14" ry="14" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- thumb nail hint -->
  <ellipse cx="138" cy="160" rx="8" ry="6" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
</svg>
