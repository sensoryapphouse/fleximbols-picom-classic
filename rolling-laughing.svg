  <path d="M86 148 Q155 220 222 148" fill="#d01424" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- teeth inside mouth -->
  <path d="M86 148 Q155 172 222 148" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- motion lines from face -->
