  <!-- motion arc behind the face -->
  <path d="M22 200 Q40 80 145 24" fill="none" stroke="#b8b8b8" stroke-width="7" stroke-linecap="round"/>
  <!-- yellow face tilted ~20 degrees -->
  <circle cx="155" cy="124" r="96" fill="#f7de58" stroke="#000000" stroke-width="5"/>
  <!-- left closed laughing eye (X shape = squinting) -->
