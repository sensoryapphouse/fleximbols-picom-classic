  <!-- Room service: domed cloche on a tray on a trolley, with a small bell -->
  <!-- Trolley base / wheels -->
  <rect x="68" y="185" width="154" height="14" rx="5" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left wheel -->
  <circle cx="100" cy="207" r="14" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>
  <circle cx="100" cy="207" r="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Right wheel -->
  <circle cx="190" cy="207" r="14" fill="#7f7f7f" stroke="#000000" stroke-width="5"/>
  <circle cx="190" cy="207" r="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Trolley upright handles (sides) -->
  <rect x="64" y="130" width="10" height="60" rx="5" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="216" y="130" width="10" height="60" rx="5" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Handle bar across top -->
  <rect x="64" y="118" width="162" height="16" rx="8" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Tray (flat oval plate) -->
  <ellipse cx="145" cy="150" rx="80" ry="14" fill="#efefef" stroke="#000000" stroke-width="5"/>
  <ellipse cx="145" cy="148" rx="76" ry="10" fill="#ffffff" stroke="none"/>
  <!-- Cloche dome -->
  <path d="M75 150 Q75 78 145 78 Q215 78 215 150 Z" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Cloche dome highlight sheen -->
  <path d="M90 130 Q95 98 125 88" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Cloche handle on top (knob) -->
  <ellipse cx="145" cy="76" rx="14" ry="8" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <ellipse cx="145" cy="72" rx="8" ry="5" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <!-- Bell (small, to the right of tray) -->
  <path d="M222 138 Q222 118 235 116 Q248 114 248 130 Q248 138 240 140 Z" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="231" y="140" width="14" height="5" rx="2" fill="#f2e40d" stroke="#000000" stroke-width="3"/>
  <!-- Bell clapper -->
  <line x1="238" y1="145" x2="238" y2="152" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="238" cy="155" r="4" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- Bell handle top -->
  <path d="M232 116 Q235 108 238 108 Q241 108 244 116" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
