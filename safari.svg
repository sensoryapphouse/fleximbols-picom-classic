  <!-- savanna sky -->
  <rect x="0" y="0" width="290" height="140" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <!-- savanna ground -->
  <rect x="0" y="140" width="290" height="100" fill="#f5e7c4" stroke="#000000" stroke-width="2"/>
  <!-- sun -->
  <circle cx="245" cy="40" r="16" fill="#fff200" stroke="#000000" stroke-width="3"/>
  <!-- acacia tree trunk -->
  <path d="M30 200 L34 130 L38 200 Z" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- acacia canopy (flat-top) -->
  <ellipse cx="34" cy="120" rx="30" ry="10" fill="#67832d" stroke="#000000" stroke-width="3"/>
  <!-- giraffe body -->
  <rect x="80" y="120" width="55" height="40" rx="6" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- giraffe neck -->
  <rect x="120" y="70" width="14" height="55" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- giraffe head -->
  <ellipse cx="130" cy="68" rx="12" ry="8" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- giraffe legs -->
  <rect x="85" y="160" width="6" height="22" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <rect x="125" y="160" width="6" height="22" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <!-- giraffe spots -->
  <circle cx="95" cy="135" r="4" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <circle cx="115" cy="140" r="4" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <circle cx="125" cy="90" r="3" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <!-- giraffe ear & horn -->
  <path d="M128 60 L130 52 L132 60 Z" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <!-- safari vehicle body -->
  <rect x="155" y="155" width="100" height="30" fill="#67832d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- vehicle cab (open top - roll bars) -->
  <rect x="170" y="125" width="70" height="30" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
  <!-- roll bars -->
  <line x1="170" y1="125" x2="170" y2="115" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="205" y1="125" x2="205" y2="115" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="125" x2="240" y2="115" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="115" x2="240" y2="115" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- tourist 1 FULL BODY -->
  <circle cx="183" cy="105" r="7" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <rect x="178" y="100" width="10" height="3" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <rect x="178" y="112" width="10" height="14" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <!-- binoculars -->
  <rect x="178" y="103" width="10" height="4" fill="#000000" stroke="#000000" stroke-width="1"/>
  <!-- arms -->
  <line x1="178" y1="118" x2="172" y2="125" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="188" y1="118" x2="194" y2="125" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- legs visible through cab window -->
  <line x1="181" y1="140" x2="181" y2="152" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="186" y1="140" x2="186" y2="152" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- tourist 2 FULL BODY -->
  <circle cx="222" cy="105" r="7" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <rect x="217" y="100" width="10" height="3" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <rect x="217" y="112" width="10" height="14" fill="#d01424" stroke="#000000" stroke-width="2"/>
  <rect x="217" y="103" width="10" height="4" fill="#000000" stroke="#000000" stroke-width="1"/>
  <line x1="217" y1="118" x2="211" y2="125" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="227" y1="118" x2="233" y2="125" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="220" y1="140" x2="220" y2="152" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="225" y1="140" x2="225" y2="152" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- vehicle wheels -->
  <circle cx="175" cy="190" r="10" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <circle cx="235" cy="190" r="10" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <circle cx="175" cy="190" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="235" cy="190" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <!-- grass tufts -->
  <path d="M60 215 L62 205 L64 215 L66 207 L68 215" fill="none" stroke="#529929" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M260 215 L262 205 L264 215 L266 207 L268 215" fill="none" stroke="#529929" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
