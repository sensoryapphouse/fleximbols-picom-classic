  <!-- Ground line -->
  <line x1="40" y1="228" x2="250" y2="228" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs - standing straight -->
  <line x1="128" y1="228" x2="130" y2="188" stroke="#eed5b6" stroke-width="16" stroke-linecap="round"/>
  <line x1="162" y1="228" x2="160" y2="188" stroke="#eed5b6" stroke-width="16" stroke-linecap="round"/>
  <!-- Boots/shoes -->
  <ellipse cx="129" cy="228" rx="14" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <ellipse cx="161" cy="228" rx="14" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Trousers -->
  <rect x="122" y="180" width="46" height="22" rx="7" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Torso (uniform) -->
  <rect x="120" y="128" width="50" height="54" rx="10" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Uniform collar -->
  <path d="M130 128 L145 140 L160 128" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left arm at side (at attention) -->
  <line x1="120" y1="145" x2="104" y2="178" stroke="#529929" stroke-width="14" stroke-linecap="round"/>
  <line x1="104" y1="178" x2="102" y2="185" stroke="#eed5b6" stroke-width="13" stroke-linecap="round"/>
  <!-- Left hand at side -->
  <ellipse cx="102" cy="188" rx="8" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right arm - raised in salute (upper arm goes up and out) -->
  <line x1="170" y1="138" x2="192" y2="118" stroke="#529929" stroke-width="14" stroke-linecap="round"/>
  <!-- Right forearm - flat across brow (horizontal) -->
  <line x1="192" y1="118" x2="170" y2="105" stroke="#eed5b6" stroke-width="13" stroke-linecap="round"/>
  <!-- Right hand at brow -->
  <ellipse cx="167" cy="103" rx="12" ry="7" fill="#eed5b6" stroke="#000000" stroke-width="4" transform="rotate(-15 167 103)"/>
  <!-- Fingers on salute hand (flat edge detail) -->
  <line x1="158" y1="101" x2="156" y2="96" stroke="#5e1f0a" stroke-width="2" stroke-linecap="round"/>
  <line x1="163" y1="98" x2="161" y2="93" stroke="#5e1f0a" stroke-width="2" stroke-linecap="round"/>
  <line x1="168" y1="97" x2="167" y2="92" stroke="#5e1f0a" stroke-width="2" stroke-linecap="round"/>
  <!-- Head upright (proud) -->
  <circle cx="145" cy="107" r="26" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Military cap -->
  <path d="M118 102 Q118 90 145 88 Q172 90 172 102" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="112" y="100" width="66" height="6" rx="3" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Cap badge (simple shape) -->
  <polygon points="145,91 148,97 155,97 149,101 152,107 145,103 138,107 141,101 135,97 142,97" fill="#f7de58" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Eyes (forward-looking, determined) -->
  <ellipse cx="136" cy="107" rx="6" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="137" cy="108" r="3.5" fill="#1d0e82"/>
  <circle cx="138" cy="107" r="1.5" fill="#ffffff"/>
  <ellipse cx="154" cy="107" rx="6" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="155" cy="108" r="3.5" fill="#1d0e82"/>
  <circle cx="156" cy="107" r="1.5" fill="#ffffff"/>
  <!-- Neutral confident mouth -->
  <line x1="138" y1="120" x2="152" y2="120" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
