  <ellipse cx="76" cy="88" rx="6" ry="8" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <path d="M 70 84 Q 76 74 82 84" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
