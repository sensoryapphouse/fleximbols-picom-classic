  <path d="M 130 130 L 130 142" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M 145 130 L 145 142" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M 160 130 L 160 142" fill="none" stroke="#000000" stroke-width="2"/>
