  <rect x="120" y="160" width="50" height="30" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Head -->
  <ellipse cx="145" cy="100" rx="72" ry="73" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M 73 88 Q 78 22 145 20 Q 212 22 217 88 Q 200 46 145 44 Q 90 46 73 88 Z" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Left brow - raised and straight (scared) -->
  <path d="M 88 66 Q 107 54 125 62" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Right brow - raised and straight -->
  <path d="M 165 62 Q 183 54 202 66" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Left eye - wide open -->
  <ellipse cx="110" cy="88" rx="18" ry="18" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="110" cy="88" r="9" fill="#4d4d4d"/>
  <circle cx="113" cy="85" r="3" fill="#ffffff"/>
  <!-- Right eye - wide open -->
  <ellipse cx="180" cy="88" rx="18" ry="18" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="180" cy="88" r="9" fill="#4d4d4d"/>
  <circle cx="183" cy="85" r="3" fill="#ffffff"/>
  <!-- Gritted teeth / scared mouth -->
  <path d="M 108 136 Q 110 144 145 145 Q 180 144 182 136" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Teeth showing -->
  <rect x="115" y="130" width="60" height="12" rx="3" fill="#ffffff" stroke="#000000" stroke-width="3"/>
