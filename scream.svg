  <!-- scream: face with huge wide-open mouth, terror, very large jagged sound burst -->
  <!-- Head (centered, slightly wider distorted expression) -->
  <ellipse cx="145" cy="105" rx="58" ry="64" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair wild/standing up from terror -->
  <path d="M 90 75 Q 88 30 120 18 Q 145 10 170 18 Q 198 30 200 75 Q 188 48 170 42 L 158 52 L 145 38 L 132 52 L 120 42 Q 102 48 90 75 Z" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Terror eyes: very wide, whites showing -->
  <ellipse cx="124" cy="90" rx="13" ry="15" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="124" cy="92" rx="8" ry="9" fill="#000000"/>
  <ellipse cx="127" cy="89" rx="3" ry="3" fill="#ffffff"/>
  <ellipse cx="166" cy="90" rx="13" ry="15" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="166" cy="92" rx="8" ry="9" fill="#000000"/>
  <ellipse cx="169" cy="89" rx="3" ry="3" fill="#ffffff"/>
  <!-- Raised terror eyebrows (arched high) -->
  <path d="M 110 72 Q 124 63 138 70" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 152 70 Q 166 63 180 72" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Hands on cheeks (terror pose - Munch scream inspired) -->
  <!-- Left hand on cheek -->
  <ellipse cx="88" cy="108" rx="16" ry="22" fill="#e6b98a" stroke="#000000" stroke-width="4" transform="rotate(10,88,108)"/>
  <path d="M 80 90 Q 74 82 78 76" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 86 88 Q 82 78 86 72" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 92 87 Q 90 76 94 70" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 98 88 Q 98 78 102 74" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Right hand on cheek -->
  <ellipse cx="202" cy="108" rx="16" ry="22" fill="#e6b98a" stroke="#000000" stroke-width="4" transform="rotate(-10,202,108)"/>
  <path d="M 210 90 Q 216 82 212 76" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 204 88 Q 208 78 204 72" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 198 87 Q 200 76 196 70" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 192 88 Q 192 78 188 74" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Mouth: HUGE open oval, terror shape -->
  <ellipse cx="145" cy="145" rx="34" ry="28" fill="#000000" stroke="#000000" stroke-width="5"/>
  <ellipse cx="145" cy="148" rx="26" ry="20" fill="#d01424"/>
  <ellipse cx="145" cy="152" rx="18" ry="14" fill="#4d4d4d"/>
  <!-- Top teeth row -->
  <rect x="118" y="120" width="54" height="12" rx="4" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Neck (below chin) -->
  <rect x="133" y="167" width="24" height="18" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Torso (partial, bottom of frame) -->
  <path d="M 88 238 L 100 185 Q 145 178 190 185 L 202 238 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Very large jagged sound burst (top, radiating outward) -->
  <polygon points="145,10 152,22 165,12 162,26 178,20 170,32 185,30 175,42 192,44 178,52 194,58 178,62" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
