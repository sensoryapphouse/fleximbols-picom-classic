  <!-- Round handle - large, at top -->
  <ellipse cx="145" cy="65" rx="38" ry="52" fill="#2a4ec0" stroke="#000000" stroke-width="5"/>
  <!-- Handle grip lines -->
  <line x1="111" y1="55" x2="179" y2="55" stroke="#000000" stroke-width="3"/>
  <line x1="111" y1="67" x2="179" y2="67" stroke="#000000" stroke-width="3"/>
  <line x1="111" y1="79" x2="179" y2="79" stroke="#000000" stroke-width="3"/>
  <!-- Shank - thin metal rod -->
  <rect x="138" y="112" width="14" height="90" rx="2" ry="2" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <!-- Ferrule (collar between handle and shank) -->
  <rect x="130" y="108" width="30" height="14" rx="3" ry="3" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Phillips cross tip - drawn as two crossing tapered wedges -->
  <!-- Vertical bar of cross tip -->
  <polygon points="141,202 149,202 152,226 138,226" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Horizontal bar of cross tip -->
  <polygon points="128,208 162,208 158,220 132,220" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Centre of cross (overlap in same fill) -->
  <rect x="138" y="208" width="14" height="12" fill="#b8b8b8"/>
</svg>
