<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- scrum-master-modern: full body scrum master + standup meeting circle + sticky notes board -->

  <!-- Person: full body, standing left -->
  <!-- Head -->
  <circle cx="60" cy="56" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="60" cy="42" rx="20" ry="10" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <rect x="40" y="78" width="40" height="52" rx="6" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm -->
  <line x1="40" y1="88" x2="22" y2="124" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="22" cy="126" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right arm gesturing toward board -->
  <line x1="80" y1="88" x2="108" y2="86" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="110" cy="86" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Hips -->
  <rect x="38" y="128" width="44" height="22" rx="4" fill="#392170" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect x="38" y="148" width="16" height="52" rx="4" fill="#392170" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="66" y="148" width="16" height="52" rx="4" fill="#392170" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left foot -->
  <rect x="32" y="196" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right foot -->
  <rect x="64" y="196" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Standup meeting circle (3 small figures arranged in a circle) -->
  <circle cx="180" cy="56" r="22" fill="none" stroke="#2a4ec0" stroke-width="3" stroke-dasharray="4,3"/>
  <!-- Figure 1 (top) -->
  <circle cx="180" cy="38" r="6" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <rect x="174" y="44" width="12" height="14" rx="2" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <!-- Figure 2 (bottom-left) -->
  <circle cx="164" cy="68" r="6" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <rect x="158" y="74" width="12" height="14" rx="2" fill="#529929" stroke="#000000" stroke-width="2"/>
  <!-- Figure 3 (bottom-right) -->
  <circle cx="196" cy="68" r="6" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <rect x="190" y="74" width="12" height="14" rx="2" fill="#ff9900" stroke="#000000" stroke-width="2"/>

  <!-- Sticky notes board -->
  <rect x="138" y="108" width="120" height="92" rx="4" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Column dividers -->
  <line x1="178" y1="108" x2="178" y2="200" stroke="#7f7f7f" stroke-width="2"/>
  <line x1="218" y1="108" x2="218" y2="200" stroke="#7f7f7f" stroke-width="2"/>
  <!-- Header band -->
  <rect x="138" y="108" width="120" height="14" fill="#90a7d6" stroke="#000000" stroke-width="3"/>

  <!-- Sticky notes (TO DO column) -->
  <rect x="146" y="128" width="24" height="20" fill="#fff200" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="146" y="154" width="24" height="20" fill="#fff200" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- DOING column -->
  <rect x="186" y="128" width="24" height="20" fill="#f4a4b2" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="186" y="154" width="24" height="20" fill="#f4a4b2" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="186" y="180" width="24" height="14" fill="#f4a4b2" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- DONE column -->
  <rect x="226" y="128" width="24" height="20" fill="#529929" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="226" y="154" width="24" height="20" fill="#529929" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
</svg>
