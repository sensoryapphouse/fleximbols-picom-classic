  <!-- Seizure: head with bilateral jagged electrical activity lines across the brain -->

  <!-- Neck -->
  <rect x="128" y="168" width="34" height="28" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Head -->
  <ellipse cx="145" cy="138" rx="52" ry="58" fill="#eed5b6" stroke="#000000" stroke-width="5"/>

  <!-- Brain region (top of head, inside skull - drawn as a lighter dome) -->
  <ellipse cx="145" cy="108" rx="38" ry="30" fill="#dff3fd" stroke="#000000" stroke-width="3"/>

  <!-- Bilateral jagged electrical lines - LEFT side -->
  <polyline points="82,105 90,95 96,112 104,88 110,108 116,90 122,105" fill="none" stroke="#f7de58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bilateral jagged electrical lines - RIGHT side -->
  <polyline points="168,105 174,90 180,108 186,88 192,112 198,95 206,105" fill="none" stroke="#f7de58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bolt symbols on each side -->
  <polygon points="88,118 94,108 91,108 97,98 91,98 97,88 84,104 90,104 84,118" fill="#fff200" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="202,118 196,108 199,108 193,98 199,98 193,88 206,104 200,104 206,118" fill="#fff200" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Face features -->
  <!-- Eyes (closed/tense during seizure) -->
  <line x1="124" y1="148" x2="136" y2="145" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="154" y1="145" x2="166" y2="148" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- Mouth (clenched) -->
  <line x1="130" y1="165" x2="160" y2="165" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
