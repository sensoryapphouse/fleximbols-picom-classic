  <!-- Mirror frame -->
  <rect x="148" y="28" width="118" height="148" rx="12" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="158" y="38" width="98" height="118" rx="8" fill="#90a7d6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Mirror stand base -->
  <rect x="188" y="176" width="38" height="10" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <line x1="207" y1="176" x2="207" y2="216" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <rect x="180" y="216" width="54" height="8" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Figure in mirror: star/glowing self (larger, idealized) -->
  <!-- Star shape in mirror -->
  <polygon points="207,52 213,70 232,70 218,81 223,99 207,88 191,99 196,81 182,70 201,70" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Real figure standing left, looking right at mirror -->
  <!-- Body -->
  <rect x="42" y="118" width="30" height="52" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="57" cy="104" r="16" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Eye looking right -->
  <circle cx="62" cy="104" r="4" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <!-- Right arm pointing toward mirror -->
  <line x1="72" y1="130" x2="110" y2="142" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Left arm down -->
  <line x1="42" y1="130" x2="28" y2="150" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="52" y1="170" x2="44" y2="212" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="68" y1="170" x2="76" y2="212" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Small sparkles near mirror reflection -->
  <line x1="164" y1="112" x2="164" y2="104" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="108" x2="168" y2="108" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="246" y1="112" x2="246" y2="104" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="242" y1="108" x2="250" y2="108" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
