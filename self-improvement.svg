  <!-- Staircase steps rising left to right -->
  <rect x="22" y="168" width="46" height="30" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="68" y="138" width="46" height="60" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="114" y="108" width="46" height="90" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Upward arrow on far right -->
  <line x1="220" y1="195" x2="220" y2="48" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <polyline points="205,72 220,45 235,72" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Figure on top step, arms raised in victory pose -->
  <!-- Body -->
  <line x1="140" y1="90" x2="140" y2="58" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Left arm raised -->
  <line x1="140" y1="68" x2="122" y2="50" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Right arm raised -->
  <line x1="140" y1="68" x2="158" y2="50" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="140" y1="90" x2="128" y2="108" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="140" y1="90" x2="152" y2="108" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="140" cy="48" r="12" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Star burst on arrow shaft indicating growth -->
  <circle cx="220" cy="120" r="10" fill="#f7de58" stroke="#000000" stroke-width="4"/>
