  <rect x="115" y="30" width="60" height="28" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- digits "42" drawn as paths -->
  <!-- digit 4 -->
  <path d="M130 38 L130 48 L142 48 M142 38 L142 52" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- digit 2 -->
  <path d="M150 40 C155 36 162 36 162 42 C162 47 150 50 150 52 L162 52" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- roll-up door frame -->
  <rect x="55" y="68" width="180" height="145" fill="#7f7f7f" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- the orange roll-up door (closed) -->
  <rect x="65" y="75" width="160" height="135" fill="#ff9900" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- horizontal slat lines -->
  <line x1="65" y1="90" x2="225" y2="90" stroke="#000000" stroke-width="1.5"/>
  <line x1="65" y1="105" x2="225" y2="105" stroke="#000000" stroke-width="1.5"/>
  <line x1="65" y1="120" x2="225" y2="120" stroke="#000000" stroke-width="1.5"/>
