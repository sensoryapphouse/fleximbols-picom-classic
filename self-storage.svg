  <line x1="65" y1="150" x2="225" y2="150" stroke="#000000" stroke-width="1.5"/>
  <line x1="65" y1="165" x2="225" y2="165" stroke="#000000" stroke-width="1.5"/>
  <line x1="65" y1="180" x2="225" y2="180" stroke="#000000" stroke-width="1.5"/>
  <line x1="65" y1="195" x2="225" y2="195" stroke="#000000" stroke-width="1.5"/>
