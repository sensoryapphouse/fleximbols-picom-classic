  <!-- person looking in mirror + speech bubble + thought bubble -->
  <!-- mirror on right -->
  <rect x="180" y="20" width="86" height="180" rx="10" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
  <rect x="190" y="30" width="66" height="160" rx="4" fill="#dff3fd" stroke="#000000" stroke-width="2.5"/>
  <!-- shine -->
  <path d="M198 42 Q196 60 198 76" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- person on left looking right -->
  <!-- head -->
  <circle cx="86" cy="80" r="24" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M62 76 Q66 52 86 48 Q106 52 110 76 Q106 64 86 60 Q66 64 62 76 Z" fill="#7d5e23" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- eyes looking right -->
  <ellipse cx="90" cy="80" rx="4" ry="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <ellipse cx="100" cy="80" rx="4" ry="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="92" cy="81" r="2" fill="#000000"/>
  <circle cx="102" cy="81" r="2" fill="#000000"/>
  <!-- mouth talking (open) -->
  <ellipse cx="92" cy="94" rx="6" ry="4" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- neck -->
  <rect x="80" y="100" width="14" height="12" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <!-- torso -->
  <path d="M52 112 L120 112 L128 200 L44 200 Z" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arms -->
  <rect x="32" y="116" width="16" height="64" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <rect x="124" y="116" width="16" height="64" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <!-- legs (cropped at bottom edge) -->
  <rect x="56" y="200" width="22" height="36" rx="5" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <rect x="94" y="200" width="22" height="36" rx="5" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>

  <!-- reflection in mirror (smaller, mirrored - facing left) -->
  <circle cx="222" cy="72" r="18" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
  <path d="M204 70 Q206 52 222 50 Q238 52 240 70 Q236 60 222 58 Q208 60 204 70 Z" fill="#7d5e23" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- reflection eyes looking left -->
  <circle cx="216" cy="72" r="2" fill="#000000"/>
  <circle cx="226" cy="72" r="2" fill="#000000"/>
  <ellipse cx="218" cy="84" rx="4" ry="3" fill="#5e1f0a" stroke="#000000" stroke-width="1.5"/>
  <!-- reflection torso -->
  <path d="M200 92 L246 92 L250 160 L196 160 Z" fill="#f8130d" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- speech bubble (from person's mouth, pointing right) -->
  <path d="M118 32 Q156 28 170 44 Q176 60 158 70 Q146 74 132 70 L124 78 L126 68 Q108 60 110 46 Q112 36 118 32 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- dots in speech bubble -->
  <circle cx="128" cy="50" r="3" fill="#000000"/>
  <circle cx="140" cy="50" r="3" fill="#000000"/>
  <circle cx="152" cy="50" r="3" fill="#000000"/>

  <!-- thought bubble (above person's head) -->
  <circle cx="60" cy="38" r="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="50" cy="28" r="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <ellipse cx="34" cy="16" rx="14" ry="10" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <circle cx="34" cy="16" r="3" fill="#7c3fac"/>
</svg>
