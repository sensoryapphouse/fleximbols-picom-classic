<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Shamisen: square/rectangular drum-like body, very long thin fretless neck, 3 strings, large plectrum (bachi) -->
  <!-- Square/rectangular drum-like body (skin-covered, small) -->
  <rect x="98" y="138" width="94" height="80" rx="8" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <!-- Skin covering on body (light parchment) -->
  <rect x="98" y="138" width="94" height="80" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Body frame/edge details -->
  <rect x="104" y="144" width="82" height="68" rx="5" fill="none" stroke="#9d7246" stroke-width="3"/>
  <!-- Corner brackets (typical shamisen body) -->
  <rect x="98" y="138" width="14" height="14" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
  <rect x="178" y="138" width="14" height="14" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
  <rect x="98" y="204" width="14" height="14" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
  <rect x="178" y="204" width="14" height="14" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
  <!-- Very long thin fretless neck (no fret lines) -->
  <rect x="138" y="10" width="14" height="135" rx="4" fill="#5e1f0a" stroke="#000000" stroke-width="5"/>
  <!-- Headstock -->
  <rect x="132" y="8" width="26" height="18" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="5"/>
  <!-- 3 tuning pegs -->
  <circle cx="139" cy="5" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="145" cy="5" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="151" cy="5" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <!-- 3 strings from headstock to body bottom -->
  <line x1="139" y1="8" x2="136" y2="218" stroke="#000000" stroke-width="2"/>
  <line x1="145" y1="8" x2="145" y2="218" stroke="#000000" stroke-width="2"/>
  <line x1="151" y1="8" x2="154" y2="218" stroke="#000000" stroke-width="2"/>
  <!-- Large plectrum (bachi) — distinctive fan/triangle shape near body -->
  <polygon points="200,148 228,135 232,175 200,175" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Bachi handle -->
  <line x1="214" y1="148" x2="218" y2="128" stroke="#9d7246" stroke-width="5" stroke-linecap="round"/>
</svg>
