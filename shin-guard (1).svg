  <!-- modern shin guard: shield shape + straps + ankle cup -->
  <!-- main shin shield (elongated shield) -->
  <path d="M 145 20 C 105 20, 95 50, 100 100 C 105 145, 110 180, 145 200 C 180 180, 185 145, 190 100 C 195 50, 185 20, 145 20 Z" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- inner shield panel -->
  <path d="M 145 35 C 115 35, 110 55, 115 100 C 118 135, 122 165, 145 182 C 168 165, 172 135, 175 100 C 180 55, 175 35, 145 35 Z" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- central reinforcement ridge -->
  <path d="M 145 45 L 145 175" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- horizontal segment lines (ribbed reinforcement) -->
  <path d="M 120 80 L 170 80" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 118 110 L 172 110" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 122 140 L 168 140" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- upper strap -->
  <rect x="60" y="60" width="170" height="16" rx="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <rect x="60" y="62" width="170" height="6" fill="#4d4d4d"/>
  <!-- velcro buckle -->
  <rect x="210" y="56" width="22" height="24" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- lower strap -->
  <rect x="65" y="150" width="160" height="16" rx="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <rect x="65" y="152" width="160" height="6" fill="#4d4d4d"/>
  <rect x="205" y="146" width="22" height="24" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- ankle protection cup at bottom -->
  <ellipse cx="145" cy="210" rx="55" ry="20" fill="#1d0e82" stroke="#000000" stroke-width="4"/>
  <ellipse cx="145" cy="210" rx="44" ry="13" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
