  <!-- Door frame (right side open) -->
  <rect x="80" y="40" width="90" height="160" rx="4" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Door threshold line -->
  <line x1="80" y1="200" x2="170" y2="200" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Door panel (left half, slightly ajar to show opening) -->
  <rect x="80" y="40" width="60" height="160" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Door knob -->
  <circle cx="136" cy="125" r="7" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- Arrow pointing INTO the door opening (from right, going left into the gap) -->
  <!-- Arrow shaft -->
  <line x1="220" y1="120" x2="160" y2="120" stroke="#2a4ec0" stroke-width="7" stroke-linecap="round"/>
  <!-- Arrow head pointing left -->
  <polygon points="148,120 168,108 168,132" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Person figure entering (right side of door, body entering) -->
  <!-- Head -->
  <circle cx="215" cy="80" r="18" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Body -->
  <rect x="202" y="98" width="26" height="38" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="4"/>
  <!-- Legs -->
  <line x1="210" y1="136" x2="205" y2="172" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="220" y1="136" x2="225" y2="172" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Arms reaching forward -->
  <line x1="202" y1="108" x2="183" y2="118" stroke="#eed5b6" stroke-width="5" stroke-linecap="round"/>
  <line x1="228" y1="108" x2="235" y2="120" stroke="#eed5b6" stroke-width="5" stroke-linecap="round"/>
</svg>
