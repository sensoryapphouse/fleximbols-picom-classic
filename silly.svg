<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Silly-modern: tongue out, crossed/wonky eyes, party hat, streamers -->
  <!-- Party hat -->
  <polygon points="145,10 112,78 178,78" fill="#f266aa" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hat stripes -->
  <line x1="132" y1="22" x2="122" y2="50" stroke="#fff200" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="18" x2="145" y2="52" stroke="#fff200" stroke-width="4" stroke-linecap="round"/>
  <line x1="158" y1="22" x2="168" y2="50" stroke="#fff200" stroke-width="4" stroke-linecap="round"/>
  <!-- Hat pompom -->
  <circle cx="145" cy="10" r="8" fill="#f7de58" stroke="#000000" stroke-width="4"/>
  <!-- Hat elastic -->
  <path d="M112,78 Q100,90 108,100" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Head - big round joyful face -->
  <circle cx="145" cy="128" r="54" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Ears -->
  <ellipse cx="91" cy="128" rx="12" ry="15" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <ellipse cx="199" cy="128" rx="12" ry="15" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Crossed/wonky eyes - one looking up, one looking sideways -->
  <circle cx="122" cy="118" r="15" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="168" cy="118" r="15" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Left eye pupil - looking up-right (crossed) -->
  <circle cx="127" cy="112" r="8" fill="#529929"/>
  <circle cx="129" cy="111" r="5" fill="#000000"/>
  <!-- Right eye pupil - looking up-left (crossed) -->
  <circle cx="163" cy="112" r="8" fill="#f8130d"/>
  <circle cx="161" cy="111" r="5" fill="#000000"/>
  <!-- X marks on eyes for wonky look -->
  <line x1="114" y1="110" x2="120" y2="116" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="110" x2="114" y2="116" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <ellipse cx="104" cy="136" rx="14" ry="10" fill="#f4a4b2"/>
  <ellipse cx="186" cy="136" rx="14" ry="10" fill="#f4a4b2"/>
  <!-- Nose - button -->
  <circle cx="145" cy="130" r="8" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Big grin with tongue out -->
  <path d="M110,148 Q145,174 180,148" fill="#000000" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Teeth row -->
  <rect x="118" y="148" width="12" height="12" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="132" y="148" width="12" height="12" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="146" y="148" width="12" height="12" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="160" y="148" width="12" height="12" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Tongue sticking out -->
  <ellipse cx="145" cy="172" rx="16" ry="12" fill="#f8130d" stroke="#000000" stroke-width="4"/>
  <line x1="145" y1="162" x2="145" y2="180" stroke="#d01424" stroke-width="3" stroke-linecap="round"/>
  <!-- Party streamers -->
  <path d="M40,30 Q60,50 50,70 Q70,80 60,100" fill="none" stroke="#f266aa" stroke-width="4" stroke-linecap="round"/>
  <path d="M50,20 Q80,40 70,65" fill="none" stroke="#f7de58" stroke-width="4" stroke-linecap="round"/>
  <path d="M240,25 Q220,50 235,70 Q215,80 225,105" fill="none" stroke="#2a4ec0" stroke-width="4" stroke-linecap="round"/>
  <path d="M250,38 Q228,55 238,80" fill="none" stroke="#529929" stroke-width="4" stroke-linecap="round"/>
  <!-- Confetti dots -->
  <circle cx="48" cy="110" r="5" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <circle cx="72" cy="95" r="4" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <circle cx="228" cy="108" r="5" fill="#f266aa" stroke="#000000" stroke-width="2"/>
  <circle cx="250" cy="88" r="4" fill="#529929" stroke="#000000" stroke-width="2"/>
  <rect x="62" y="50" width="8" height="8" rx="1" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <rect x="228" y="60" width="8" height="8" rx="1" fill="#ff9900" stroke="#000000" stroke-width="2"/>
</svg>
