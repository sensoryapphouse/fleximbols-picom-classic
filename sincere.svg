  <!-- Sincere: warm earnest face, both hands open over heart, single soft heart -->
  <!-- Head -->
  <circle cx="145" cy="52" r="32" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eyes: warm, earnest, slightly crinkled -->
  <ellipse cx="133" cy="46" rx="6" ry="7" fill="#000000"/>
  <ellipse cx="157" cy="46" rx="6" ry="7" fill="#000000"/>
  <circle cx="135" cy="44" r="2" fill="#ffffff"/>
  <circle cx="159" cy="44" r="2" fill="#ffffff"/>
  <!-- Warm upward-curving eyes (squinted sincerely) -->
  <path d="M126 44 Q133 38 140 44" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M150 44 Q157 38 164 44" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyebrows: high, gentle -->
  <path d="M126 37 Q133 32 140 36" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M150 36 Q157 32 164 37" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Big warm smile -->
  <path d="M130 64 Q145 78 160 64" fill="#f4a4b2" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130 64 Q145 78 160 64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <ellipse cx="120" cy="60" rx="10" ry="7" fill="#f4a4b2"/>
  <ellipse cx="170" cy="60" rx="10" ry="7" fill="#f4a4b2"/>
  <!-- Neck -->
  <rect x="137" y="82" width="16" height="14" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Torso / shirt (warm yellow) -->
  <path d="M100 96 Q108 86 136 88 L154 88 Q182 86 190 96 L196 172 L94 172 Z" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left arm: bent inward, hand over heart area -->
  <path d="M101 100 Q80 112 78 134 Q78 148 98 152" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M101 100 Q80 112 78 134 Q78 148 98 152" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left open hand over chest -->
  <ellipse cx="108" cy="140" rx="17" ry="14" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <line x1="97" y1="132" x2="94" y2="124" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="103" y1="128" x2="101" y2="119" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="127" x2="110" y2="118" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="117" y1="128" x2="119" y2="119" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="122" y1="133" x2="126" y2="126" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Right arm: bent inward, hand over heart area -->
  <path d="M189 100 Q210 112 212 134 Q212 148 192 152" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M189 100 Q210 112 212 134 Q212 148 192 152" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right open hand over chest -->
  <ellipse cx="182" cy="140" rx="17" ry="14" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <line x1="172" y1="133" x2="168" y2="126" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="178" y1="128" x2="175" y2="119" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="183" y1="127" x2="183" y2="118" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="188" y1="128" x2="190" y2="119" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="193" y1="132" x2="197" y2="126" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Single large soft heart on chest (between hands) -->
  <path d="M136 116 Q136 108 145 114 Q154 108 154 116 Q154 128 145 136 Q136 128 136 116 Z" fill="#f266aa" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Legs -->
  <rect x="116" y="170" width="24" height="46" rx="8" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <rect x="150" y="170" width="24" height="46" rx="8" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <ellipse cx="128" cy="217" rx="18" ry="8" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="162" cy="217" rx="18" ry="8" fill="#000000" stroke="#000000" stroke-width="3"/>
</svg>
