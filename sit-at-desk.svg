<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Figure seated at desk with computer, settling in -->
  <!-- Floor -->
  <line x1="20" y1="228" x2="270" y2="228" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Desk surface -->
  <rect x="40" y="158" width="220" height="14" rx="5" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Desk left leg -->
  <rect x="48" y="172" width="12" height="56" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <!-- Desk right leg -->
  <rect x="200" y="172" width="12" height="56" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <!-- Monitor on desk -->
  <rect x="130" y="90" width="90" height="66" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Monitor screen (dark/on but settling — showing desktop) -->
  <rect x="136" y="96" width="78" height="54" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <!-- Screen content - simple desktop icons suggestion -->
  <rect x="142" y="102" width="12" height="10" rx="2" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <rect x="158" y="102" width="12" height="10" rx="2" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <rect x="142" y="118" width="12" height="10" rx="2" fill="#529929" stroke="#000000" stroke-width="2"/>
  <!-- Taskbar at bottom of screen -->
  <rect x="136" y="141" width="78" height="9" rx="2" fill="#2a4ec0" stroke="none"/>
  <!-- Monitor stand neck -->
  <rect x="168" y="156" width="14" height="8" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <!-- Monitor stand base -->
  <rect x="156" y="156" width="38" height="6" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <!-- Keyboard on desk -->
  <rect x="100" y="152" width="72" height="10" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- Key rows suggestion -->
  <rect x="104" y="154" width="8" height="4" rx="1" fill="#7f7f7f" stroke="none"/>
  <rect x="115" y="154" width="8" height="4" rx="1" fill="#7f7f7f" stroke="none"/>
  <rect x="126" y="154" width="8" height="4" rx="1" fill="#7f7f7f" stroke="none"/>
  <rect x="137" y="154" width="8" height="4" rx="1" fill="#7f7f7f" stroke="none"/>
  <rect x="148" y="154" width="8" height="4" rx="1" fill="#7f7f7f" stroke="none"/>
  <rect x="159" y="154" width="8" height="4" rx="1" fill="#7f7f7f" stroke="none"/>
  <!-- Mouse -->
  <ellipse cx="88" cy="156" rx="9" ry="12" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <line x1="88" y1="150" x2="88" y2="156" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Chair body / back -->
  <rect x="44" y="132" width="52" height="46" rx="8" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Chair seat -->
  <rect x="38" y="172" width="64" height="14" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Chair leg post -->
  <rect x="64" y="186" width="12" height="30" rx="4" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Chair wheels -->
  <ellipse cx="50" cy="222" rx="10" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <ellipse cx="90" cy="222" rx="10" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Figure seated -->
  <!-- Torso (sitting upright) -->
  <rect x="52" y="110" width="38" height="46" rx="8" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="71" cy="90" r="23" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M49 86 Q52 68 71 66 Q90 68 93 86" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- Eyes (looking at screen) -->
  <circle cx="64" cy="88" r="3" fill="#000000"/>
  <circle cx="78" cy="88" r="3" fill="#000000"/>
  <!-- Neutral/settling expression -->
  <path d="M64 99 Q71 103 78 99" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right arm reaching toward keyboard -->
  <path d="M90 132 Q108 148 120 156" fill="none" stroke="#eed5b6" stroke-width="12" stroke-linecap="round"/>
  <!-- Right hand on keyboard -->
  <ellipse cx="122" cy="157" rx="11" ry="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left arm on desk -->
  <path d="M52 132 Q48 148 48 160" fill="none" stroke="#eed5b6" stroke-width="12" stroke-linecap="round"/>
  <!-- Left hand on desk -->
  <ellipse cx="48" cy="162" rx="10" ry="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Legs (seated, thighs on chair seat) -->
  <rect x="46" y="172" width="18" height="16" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <rect x="70" y="172" width="18" height="16" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Lower legs down -->
  <rect x="46" y="188" width="14" height="30" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <rect x="74" y="188" width="14" height="30" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Shoes -->
  <ellipse cx="53" cy="220" rx="13" ry="6" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="81" cy="220" rx="13" ry="6" fill="#000000" stroke="#000000" stroke-width="3"/>
</svg>
