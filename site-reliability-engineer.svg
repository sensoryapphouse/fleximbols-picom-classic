<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- site-reliability-engineer: full body person at monitoring dashboard with uptime graph + alert bell + shield -->

  <!-- Monitor -->
  <rect x="128" y="56" width="134" height="98" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Screen -->
  <rect x="136" y="64" width="118" height="82" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Uptime graph on screen (green line, spike) -->
  <polyline points="142,132 154,132 162,116 170,132 182,132 190,108 200,132 212,132 220,120 240,120 248,132" fill="none" stroke="#529929" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Graph baseline -->
  <line x1="142" y1="138" x2="248" y2="138" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
  <!-- Alert spike label: small red dot at spike -->
  <circle cx="190" cy="108" r="4" fill="#f8130d" stroke="#000000" stroke-width="2"/>

  <!-- Monitor stand -->
  <rect x="187" y="154" width="16" height="18" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="174" y="170" width="42" height="6" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Alert bell (top right area) -->
  <!-- Bell body -->
  <path d="M245,48 Q235,50 232,64 L232,76 L258,76 L258,64 Q255,50 245,48 Z" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="240" y="76" width="10" height="5" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="245" cy="82" rx="5" ry="3" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- Bell clapper -->
  <circle cx="245" cy="80" r="3" fill="#9d7246" stroke="#000000" stroke-width="2"/>
  <!-- Alert squiggle lines -->
  <line x1="262" y1="56" x2="268" y2="52" stroke="#f8130d" stroke-width="3" stroke-linecap="round"/>
  <line x1="264" y1="64" x2="271" y2="64" stroke="#f8130d" stroke-width="3" stroke-linecap="round"/>

  <!-- Shield (right side) -->
  <path d="M254,178 Q254,210 245,218 Q236,210 236,178 L236,166 L254,166 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shield tick -->
  <polyline points="239,190 243,196 251,182" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Person: full body, standing left -->
  <!-- Head -->
  <circle cx="56" cy="58" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="56" cy="44" rx="20" ry="10" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <rect x="36" y="80" width="40" height="52" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm -->
  <line x1="36" y1="90" x2="18" y2="120" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="18" cy="122" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right arm toward screen -->
  <line x1="76" y1="88" x2="112" y2="104" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="114" cy="105" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Hips -->
  <rect x="34" y="130" width="44" height="22" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect x="34" y="150" width="16" height="52" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="62" y="150" width="16" height="52" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left foot -->
  <rect x="28" y="198" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right foot -->
  <rect x="60" y="198" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
</svg>
