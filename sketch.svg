<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Paper/sketchpad background -->
  <rect x="12" y="12" width="200" height="215" rx="6" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sketchpad top edge (binding) -->
  <rect x="12" y="12" width="200" height="16" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Binding holes -->
  <circle cx="50" cy="20" r="5" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="100" cy="20" r="5" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="150" cy="20" r="5" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Subject being sketched: a simple house taking shape -->
  <!-- House body - rough construction lines (lighter, slightly offset) -->
  <rect x="40" y="110" width="110" height="80" rx="2" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8,5"/>
  <!-- Roof construction lines -->
  <line x1="30" y1="112" x2="95" y2="58" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="8,5"/>
  <line x1="160" y1="112" x2="95" y2="58" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="8,5"/>
  <!-- House body firmer lines being drawn -->
  <rect x="42" y="112" width="108" height="78" rx="2" fill="none" stroke="#4d4d4d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Roof firmer lines -->
  <line x1="35" y1="114" x2="95" y2="62" stroke="#4d4d4d" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="155" y1="114" x2="95" y2="62" stroke="#4d4d4d" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Door sketch -->
  <rect x="75" y="152" width="30" height="38" rx="2" fill="none" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Window sketch -->
  <rect x="116" y="128" width="24" height="22" rx="2" fill="none" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="128" y1="128" x2="128" y2="150" stroke="#4d4d4d" stroke-width="2" stroke-linecap="round"/>
  <line x1="116" y1="139" x2="140" y2="139" stroke="#4d4d4d" stroke-width="2" stroke-linecap="round"/>
  <!-- Faint extra construction cross-lines (deliberate rough) -->
  <line x1="42" y1="112" x2="150" y2="190" stroke="#b8b8b8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,6"/>
  <line x1="150" y1="112" x2="42" y2="190" stroke="#b8b8b8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,6"/>
  <!-- Hand holding pencil (lower right, diagonal) -->
  <!-- Pencil body -->
  <rect x="215" y="95" width="14" height="100" rx="4" transform="rotate(-30 215 95)" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pencil eraser end -->
  <rect x="215" y="88" width="14" height="12" rx="3" transform="rotate(-30 215 88)" fill="#f4a4b2" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pencil metal ferrule -->
  <rect x="215" y="98" width="14" height="9" rx="0" transform="rotate(-30 215 98)" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pencil tip - wood -->
  <polygon points="215,195 229,195 222,213" transform="rotate(-30 222 195)" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pencil graphite tip -->
  <polygon points="218,207 226,207 222,215" transform="rotate(-30 222 207)" fill="#4d4d4d" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Fingers holding pencil -->
  <rect x="224" y="140" width="13" height="38" rx="6" transform="rotate(-30 224 140)" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="237" y="133" width="13" height="40" rx="6" transform="rotate(-30 237 133)" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Thumb -->
  <ellipse cx="218" cy="165" rx="10" ry="17" transform="rotate(-30 218 165)" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Palm -->
  <ellipse cx="252" cy="185" rx="22" ry="30" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
