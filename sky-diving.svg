  <!-- Sky background clouds -->
  <ellipse cx="60" cy="45" rx="38" ry="18" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <ellipse cx="88" cy="38" rx="30" ry="16" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <ellipse cx="220" cy="55" rx="34" ry="16" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <ellipse cx="248" cy="48" rx="26" ry="14" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <!-- Ground far below — horizon strip -->
  <rect x="20" y="205" width="250" height="15" rx="4" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Freefalling figure — belly-down, arms and legs spread, open sky -->
  <!-- Head -->
  <ellipse cx="145" cy="105" rx="16" ry="16" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Helmet -->
  <path d="M129 101 Q145 85 161 101" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Goggles -->
  <rect x="132" y="101" width="26" height="9" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Jumpsuit torso -->
  <rect x="129" y="119" width="32" height="26" rx="7" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm spread wide-left -->
  <line x1="129" y1="125" x2="82" y2="108" stroke="#f8130d" stroke-width="10" stroke-linecap="round"/>
  <!-- Right arm spread wide-right -->
  <line x1="161" y1="125" x2="208" y2="108" stroke="#f8130d" stroke-width="10" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="80" cy="107" r="7" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <circle cx="210" cy="107" r="7" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left leg spread lower-left -->
  <line x1="135" y1="144" x2="98" y2="178" stroke="#f8130d" stroke-width="10" stroke-linecap="round"/>
  <!-- Right leg spread lower-right -->
  <line x1="155" y1="144" x2="192" y2="178" stroke="#f8130d" stroke-width="10" stroke-linecap="round"/>
  <!-- Shoes -->
  <ellipse cx="95" cy="181" rx="11" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <ellipse cx="195" cy="181" rx="11" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Altimeter on wrist (left) -->
  <rect x="70" y="102" width="12" height="10" rx="3" fill="#efefef" stroke="#000000" stroke-width="3"/>
