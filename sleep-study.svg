<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Sleep study: patient sleeping with multiple electrodes on head + sleep-tracking monitor screen -->
  <!-- Floor -->
  <path d="M10 226 L280 226" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Bed -->
  <rect x="20" y="160" width="180" height="50" rx="4" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Mattress line -->
  <path d="M20 175 L200 175" stroke="#000000" stroke-width="2"/>
  <!-- Pillow -->
  <rect x="28" y="138" width="60" height="28" rx="6" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Blanket over body -->
  <path d="M85 175 L195 175 L195 210 L85 210 Z" fill="#7c3fac" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Blanket fold detail -->
  <path d="M85 175 Q90 188 100 192" fill="none" stroke="#392170" stroke-width="2"/>

  <!-- Patient head on pillow -->
  <circle cx="58" cy="138" r="24" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Hair -->
  <path d="M36 132 Q36 116 58 114 Q80 116 80 132 L78 124 Q70 118 58 118 Q46 118 38 124 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Sleeping eyes (closed - curved lines) -->
  <path d="M48 138 Q52 142 56 138" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M62 138 Q66 142 70 138" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Mouth (sleeping) -->
  <path d="M54 148 Q58 150 62 148" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- Z's for sleep -->
  <path d="M88 90 L102 90 L88 106 L102 106" fill="none" stroke="#1d0e82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M108 70 L120 70 L108 82 L120 82" fill="none" stroke="#1d0e82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M126 52 L136 52 L126 62 L136 62" fill="none" stroke="#1d0e82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Electrodes on head/scalp (multiple, scattered) -->
  <circle cx="46" cy="120" r="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="58" cy="116" r="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="70" cy="120" r="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="40" cy="134" r="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="76" cy="134" r="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="50" cy="156" r="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="66" cy="156" r="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Wires from electrodes going to monitor -->
  <path d="M46 120 Q180 80 230 70" fill="none" stroke="#f8130d" stroke-width="2" stroke-linecap="round"/>
  <path d="M58 116 Q180 75 230 75" fill="none" stroke="#137827" stroke-width="2" stroke-linecap="round"/>
  <path d="M70 120 Q180 90 230 80" fill="none" stroke="#2a4ec0" stroke-width="2" stroke-linecap="round"/>
  <path d="M76 134 Q180 100 230 90" fill="none" stroke="#7c3fac" stroke-width="2" stroke-linecap="round"/>
  <path d="M66 156 Q180 130 230 105" fill="none" stroke="#ff9900" stroke-width="2" stroke-linecap="round"/>
  <path d="M50 156 Q180 135 230 110" fill="none" stroke="#3aa6a0" stroke-width="2" stroke-linecap="round"/>

  <!-- Sleep monitor / tracking screen -->
  <rect x="216" y="40" width="64" height="100" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Screen -->
  <rect x="222" y="46" width="52" height="68" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- Sleep stages waveforms (multiple stacked traces) -->
  <path d="M224 56 L228 54 L232 58 L236 52 L240 58 L244 54 L248 56 L252 53 L256 57 L260 54 L264 56 L268 55 L272 56" fill="none" stroke="#3aa6a0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M224 72 L228 70 L232 76 L236 66 L240 78 L244 68 L248 74 L252 70 L256 76 L260 68 L264 74 L268 70 L272 72" fill="none" stroke="#f2e40d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M224 90 L232 86 L236 94 L244 84 L252 92 L260 84 L268 92 L272 88" fill="none" stroke="#ff9900" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M224 106 L230 102 L240 110 L250 100 L260 108 L272 104" fill="none" stroke="#f266aa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Moon/sleep indicator on monitor -->
  <path d="M260 122 Q254 122 254 128 Q254 134 260 134 Q256 130 256 128 Q256 124 260 122 Z" fill="#f2e40d" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Monitor stand -->
  <rect x="240" y="140" width="16" height="20" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <ellipse cx="248" cy="162" rx="18" ry="4" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
</svg>
