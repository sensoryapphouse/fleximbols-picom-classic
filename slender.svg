  <!-- Slender figure: taller and narrower than slim, elongation cue -->
  <!-- Head: slightly smaller to emphasise elongation -->
  <circle cx="145" cy="34" r="18" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Neck: longer -->
  <rect x="138" y="50" width="14" height="16" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Torso: narrower and taller -->
  <rect x="131" y="64" width="28" height="72" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm: close and slender -->
  <rect x="113" y="66" width="14" height="60" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right arm -->
  <rect x="163" y="66" width="14" height="60" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left leg: longer -->
  <rect x="132" y="134" width="13" height="80" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right leg: longer -->
  <rect x="147" y="134" width="13" height="80" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Elongation cue: vertical double-arrow beside figure -->
  <line x1="190" y1="34" x2="190" y2="214" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <polygon points="190,34 184,52 196,52" fill="#000000"/>
  <polygon points="190,214 184,196 196,196" fill="#000000"/>
</svg>
