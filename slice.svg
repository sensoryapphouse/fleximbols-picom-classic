  <!-- Chef's knife making one clean thin slice off a tomato/loaf -->

  <!-- Loaf/food body (bread loaf) -->
  <path d="M40,130 Q40,75 110,75 L185,75 Q200,75 200,130 L200,175 L40,175 Z" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Loaf top shading band -->
  <path d="M50,130 Q50,88 110,88 L180,88 Q192,88 192,130" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Thin slice that has fallen slightly to the right -->
  <rect x="207" y="100" width="22" height="75" rx="4" fill="#f5e7c4" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Slice interior detail -->
  <rect x="211" y="108" width="14" height="59" rx="3" fill="#eed5b6" stroke="#000000" stroke-width="2"/>

  <!-- Chef's knife blade -->
  <polygon points="80,30 210,30 220,65 220,78 80,78" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Blade bevel line -->
  <line x1="85" y1="73" x2="215" y2="73" stroke="#b8b8b8" stroke-width="3"/>
  <!-- Knife handle -->
  <rect x="220" y="25" width="55" height="35" rx="8" fill="#7d5e23" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Rivets on handle -->
  <circle cx="235" cy="42" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="252" cy="42" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="265" cy="42" r="3" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>

  <!-- Cut line on loaf surface -->
  <line x1="205" y1="78" x2="205" y2="175" stroke="#000000" stroke-width="4"/>
</svg>
