  <!-- slide-into-dms: paper plane sliding INTO open inbox tray + motion trail -->
  <!-- inbox tray (open top) -->
  <path d="M48,124 L48,206 L242,206 L242,124" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- tray base interior -->
  <rect x="56" y="152" width="178" height="46" rx="4" fill="#b8b8b8" stroke="none"/>
  <!-- tray divider/lip -->
  <line x1="48" y1="152" x2="242" y2="152" stroke="#000000" stroke-width="5"/>
  <!-- motion trail lines (from left, horizontal dashes) -->
  <line x1="22" y1="80" x2="80" y2="80" stroke="#b8b8b8" stroke-width="5" stroke-linecap="round"/>
  <line x1="30" y1="96" x2="78" y2="96" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="38" y1="112" x2="76" y2="112" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <!-- paper plane heading into tray (pointing bottom-right) -->
  <!-- plane body -->
  <polygon points="90,44 220,100 100,116 124,88 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- fold crease -->
  <line x1="100" y1="116" x2="124" y2="88" stroke="#000000" stroke-width="4"/>
  <line x1="124" y1="88" x2="220" y2="100" stroke="#000000" stroke-width="4"/>
  <!-- directional arrow tip indicating entry into tray -->
  <polygon points="178,130 196,118 198,140" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
</svg>
