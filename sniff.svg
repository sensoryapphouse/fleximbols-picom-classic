  <!-- Small source object (flower/smell target) at lower-left -->
  <circle cx="52" cy="188" r="14" fill="#f4a4b2" stroke="#000000" stroke-width="4"/>
  <circle cx="52" cy="188" r="6" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <!-- Stem -->
  <line x1="52" y1="202" x2="52" y2="218" stroke="#529929" stroke-width="4" stroke-linecap="round"/>
  <!-- Head - leaning forward/left (sniffing toward object) -->
  <ellipse cx="165" cy="115" rx="76" ry="82" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair -->
  <ellipse cx="165" cy="57" rx="76" ry="29" fill="#9d7246" stroke="#000000" stroke-width="5"/>
  <!-- Left eye - attentive, slightly narrowed -->
  <ellipse cx="136" cy="100" rx="14" ry="13" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="133" cy="102" r="7" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <circle cx="130" cy="99" r="2.5" fill="#ffffff"/>
  <!-- Right eye -->
  <ellipse cx="194" cy="100" rx="14" ry="13" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="191" cy="102" r="7" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <circle cx="188" cy="99" r="2.5" fill="#ffffff"/>
  <!-- Eyebrows - attentive/curious -->
  <path d="M122 85 Q136 78 150 83" fill="none" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <path d="M180 83 Q194 78 208 85" fill="none" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <!-- Nose - prominent -->
  <ellipse cx="165" cy="128" rx="13" ry="9" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <circle cx="159" cy="130" r="4" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <circle cx="171" cy="130" r="4" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- Mouth - closed, neutral/concentrating -->
  <path d="M148 157 Q165 163 182 157" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Inward dotted air lines at nose (sniffing in) -->
  <line x1="108" y1="148" x2="120" y2="138" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,5"/>
  <line x1="98" y1="160" x2="113" y2="148" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,5"/>
  <line x1="85" y1="170" x2="103" y2="158" stroke="#2a4ec0" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,5"/>
  <!-- Arrow tip pointing toward nose -->
  <polygon points="122,136 112,134 115,144" fill="#2a4ec0" stroke="#2a4ec0" stroke-width="2"/>
</svg>
