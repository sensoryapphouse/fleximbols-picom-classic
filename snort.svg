  <!-- Head bust -->
  <ellipse cx="145" cy="95" rx="62" ry="68" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="120" y="150" width="50" height="28" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Shoulders -->
  <ellipse cx="145" cy="198" rx="80" ry="28" fill="#ff9900" stroke="#000000" stroke-width="5"/>
  <!-- Eyes - scrunched laughing -->
  <path d="M106 82 Q118 70 130 82" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M160 82 Q172 70 184 82" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- BIG emphasized nose - central feature -->
  <ellipse cx="145" cy="115" rx="22" ry="16" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Nostrils prominent -->
  <ellipse cx="135" cy="118" rx="8" ry="7" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <ellipse cx="155" cy="118" rx="8" ry="7" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- Two air-puff bursts from LEFT nostril -->
  <ellipse cx="116" cy="114" rx="9" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="103" cy="107" rx="7" ry="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <ellipse cx="92" cy="98" rx="5" ry="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Two air-puff bursts from RIGHT nostril -->
  <ellipse cx="174" cy="114" rx="9" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="187" cy="107" rx="7" ry="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <ellipse cx="198" cy="98" rx="5" ry="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Laughing mouth below nose -->
  <path d="M118 138 Q145 162 172 138" fill="#f8130d" stroke="#000000" stroke-width="4"/>
  <path d="M118 138 Q145 150 172 138" fill="#ffffff" stroke="none"/>
  <!-- Teeth -->
  <rect x="130" y="138" width="30" height="10" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Rosy cheeks -->
  <ellipse cx="107" cy="120" rx="13" ry="9" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="183" cy="120" rx="13" ry="9" fill="#f4a4b2" stroke="none"/>
