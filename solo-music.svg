  <!-- stage floor -->
  <ellipse cx="145" cy="220" rx="110" ry="14" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- spotlight beam (cone from top) -->
  <path d="M 110 30 L 180 30 L 220 215 L 70 215 Z" fill="#fff200" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- spotlight source at top -->
  <rect x="115" y="20" width="60" height="15" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- singer full body in spotlight -->
  <!-- head -->
  <circle cx="145" cy="80" r="18" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M 128 75 Q 130 60 145 60 Q 160 60 162 75 Q 158 70 145 70 Q 132 70 128 75 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="139" cy="80" r="1.5" fill="#000000"/>
  <circle cx="151" cy="80" r="1.5" fill="#000000"/>
  <!-- mouth open singing -->
  <ellipse cx="145" cy="88" rx="3" ry="4" fill="#5e1f0a" stroke="#000000" stroke-width="1.5"/>
  <!-- torso -->
  <path d="M 130 100 L 160 100 L 165 160 L 125 160 Z" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arm holding microphone -->
  <line x1="160" y1="105" x2="175" y2="125" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="175" y1="125" x2="172" y2="105" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- other arm -->
  <line x1="130" y1="105" x2="115" y2="135" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="115" y1="135" x2="118" y2="150" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="135" y1="160" x2="132" y2="200" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="155" y1="160" x2="158" y2="200" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- shoes -->
  <ellipse cx="130" cy="203" rx="8" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="160" cy="203" rx="8" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- pants division -->
  <line x1="145" y1="160" x2="145" y2="195" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- microphone -->
  <ellipse cx="172" cy="100" rx="8" ry="9" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <line x1="172" y1="92" x2="172" y2="105" stroke="#b8b8b8" stroke-width="1.5"/>
  <line x1="167" y1="95" x2="177" y2="95" stroke="#b8b8b8" stroke-width="1.5"/>
  <line x1="167" y1="100" x2="177" y2="100" stroke="#b8b8b8" stroke-width="1.5"/>
  <!-- music notes around -->
  <circle cx="55" cy="80" r="5" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <line x1="60" y1="80" x2="60" y2="60" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="235" cy="100" r="5" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <line x1="240" y1="100" x2="240" y2="80" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="245" cy="155" r="5" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <line x1="250" y1="155" x2="250" y2="135" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
</svg>
