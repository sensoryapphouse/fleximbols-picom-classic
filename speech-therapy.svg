  <!-- ground -->
  <rect x="0" y="218" width="290" height="22" fill="#f5e7c4" stroke="#000000" stroke-width="2.5"/>

  <!-- Mirror behind (between them, vertical oval) -->
  <ellipse cx="145" cy="105" rx="34" ry="60" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <ellipse cx="145" cy="105" rx="28" ry="54" fill="#90a7d6" stroke="#000000" stroke-width="2"/>
  <path d="M130 70 Q138 80 134 100" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- THERAPIST FULL BODY (left) pointing to own mouth -->
  <g transform="translate(70 90)">
    <circle cx="0" cy="0" r="12" fill="#e6b98a" stroke="#000000" stroke-width="2.5"/>
    <path d="M-12 0 Q-12 -14 0 -14 Q12 -14 12 0 Q12 5 10 8 L10 -5 Q5 -9 0 -9 Q-5 -9 -10 -5 L-10 8 Q-12 5 -12 0 Z" fill="#f7de58" stroke="#000000" stroke-width="2"/>
    <circle cx="-4" cy="0" r="1.5" fill="#000000"/>
    <circle cx="4" cy="0" r="1.5" fill="#000000"/>
    <!-- open mouth saying "ah" -->
    <ellipse cx="0" cy="7" rx="3" ry="4" fill="#d01424" stroke="#000000" stroke-width="1.5"/>
    <rect x="-5" y="11" width="10" height="5" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
    <rect x="-16" y="16" width="32" height="40" rx="3" fill="#7c3fac" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- left arm down -->
    <rect x="-24" y="18" width="8" height="32" fill="#7c3fac" stroke="#000000" stroke-width="2"/>
    <circle cx="-20" cy="53" r="4" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
    <!-- right arm raised pointing at own mouth -->
    <path d="M16 18 L18 4 L12 0 L8 14 Z" fill="#7c3fac" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="15" cy="0" r="4" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
    <!-- skirt/trousers -->
    <rect x="-14" y="56" width="12" height="60" fill="#392170" stroke="#000000" stroke-width="2.5"/>
    <rect x="2" y="56" width="12" height="60" fill="#392170" stroke="#000000" stroke-width="2.5"/>
    <ellipse cx="-8" cy="118" rx="8" ry="4" fill="#000000" stroke="#000000" stroke-width="1.8"/>
    <ellipse cx="8" cy="118" rx="8" ry="4" fill="#000000" stroke="#000000" stroke-width="1.8"/>
  </g>

  <!-- speech bubble with letter A -->
  <ellipse cx="118" cy="48" rx="22" ry="15" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <polygon points="105,58 100,66 112,60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- letter A shape (no text) drawn with paths -->
  <path d="M110 56 L118 38 L126 56 M114 50 L122 50" fill="none" stroke="#d01424" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- PATIENT (child) FULL BODY (right) facing therapist, mouth open -->
  <g transform="translate(220 100)">
    <circle cx="0" cy="0" r="11" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
    <path d="M-11 -3 Q-11 -13 0 -13 Q11 -13 11 -3 Q6 -8 0 -8 Q-6 -8 -11 -3 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
    <circle cx="-3.5" cy="0" r="1.4" fill="#000000"/>
    <circle cx="3.5" cy="0" r="1.4" fill="#000000"/>
    <!-- open mouth -->
    <ellipse cx="0" cy="6" rx="2.5" ry="3" fill="#d01424" stroke="#000000" stroke-width="1.5"/>
    <rect x="-5" y="10" width="10" height="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
    <rect x="-15" y="15" width="30" height="36" rx="3" fill="#3aa6a0" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-22" y="17" width="7" height="28" fill="#3aa6a0" stroke="#000000" stroke-width="2"/>
    <rect x="15" y="17" width="7" height="28" fill="#3aa6a0" stroke="#000000" stroke-width="2"/>
    <circle cx="-18" cy="48" r="4" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
    <circle cx="18" cy="48" r="4" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
    <rect x="-12" y="51" width="11" height="50" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
    <rect x="1" y="51" width="11" height="50" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
    <ellipse cx="-6" cy="103" rx="7" ry="3.5" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <ellipse cx="7" cy="103" rx="7" ry="3.5" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  </g>
</svg>
