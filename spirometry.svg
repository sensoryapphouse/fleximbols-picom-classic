  <!-- patient bust (full head + shoulders+ arms - bust style appropriate for medical action focus on mouthpiece) -->
  <!-- shoulders/torso -->
  <path d="M30 220 q10 -50 50 -60 q12 -6 30 -6 q18 0 30 6 q40 10 50 60 z" fill="#90a7d6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- neck -->
  <rect x="100" y="135" width="20" height="22" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- head -->
  <circle cx="110" cy="105" r="34" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M76 100 q10 -38 50 -32 q26 4 32 22 q-22 -4 -82 10 z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- eye (concentrating, closed-ish) -->
  <path d="M96 100 q5 -3 10 0" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- mouthpiece tube going into mouth -->
  <rect x="130" y="118" width="50" height="14" rx="3" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <!-- flexible hose -->
  <path d="M180 125 q26 -2 32 18" fill="none" stroke="#7f7f7f" stroke-width="10" stroke-linecap="round"/>
  <path d="M180 125 q26 -2 32 18" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- spirometer machine -->
  <rect x="195" y="140" width="80" height="80" rx="5" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <!-- screen on machine with lung-volume graph -->
  <rect x="203" y="148" width="64" height="44" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- axes -->
  <path d="M208 188 l54 0" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M208 188 l0 -36" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- volume/time curve (FEV1 rising and plateau) -->
  <path d="M208 188 q6 -28 18 -32 q14 -4 26 -2" fill="none" stroke="#d01424" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- buttons -->
  <circle cx="215" cy="208" r="4" fill="#529929" stroke="#000000" stroke-width="2"/>
  <circle cx="230" cy="208" r="4" fill="#d01424" stroke="#000000" stroke-width="2"/>
  <rect x="240" y="204" width="20" height="8" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <!-- arm holding mouthpiece -->
  <path d="M150 168 q-6 -22 -8 -32" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M142 136 q14 -6 30 0" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
