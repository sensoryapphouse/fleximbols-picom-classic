  <g>
    <!-- Neck -->
    <polygon points="108,188 114,228 152,228 158,188 146,193 130,194 118,192" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Head — offset left to leave room for spit stream going right -->
    <path d="M50,100 Q55,50 130,26 Q205,50 208,100 Q210,138 190,162 Q163,188 130,188 Q97,188 70,162 Q48,138 50,100 Z" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Left ear -->
    <ellipse cx="46" cy="102" rx="13" ry="19" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Right ear -->
    <ellipse cx="214" cy="102" rx="13" ry="19" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
    <!-- Hair -->
    <path d="M62,70 Q72,22 130,18 Q188,22 198,70 Q184,38 130,36 Q76,38 62,70 Z" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Left eye — slightly squinted with effort -->
    <ellipse cx="102" cy="88" rx="10" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <circle cx="103" cy="89" r="5" fill="#000000"/>
    <!-- Right eye — squinted -->
    <ellipse cx="162" cy="88" rx="10" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <circle cx="163" cy="89" r="5" fill="#000000"/>
    <!-- Eyebrows furrowed / effort -->
    <polyline points="90,75 104,72" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <polyline points="150,72 164,76" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M126,106 Q122,117 118,120 Q125,123 130,121 Q135,123 142,120 Q138,117 134,106" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- Cheeks puffed pushing spit -->
    <ellipse cx="82" cy="138" rx="22" ry="16" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
    <ellipse cx="178" cy="138" rx="22" ry="16" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
    <!-- Mouth — pursed and forward, ejecting -->
    <ellipse cx="130" cy="148" rx="16" ry="10" fill="#f4a4b2" stroke="#000000" stroke-width="4"/>
    <!-- Spit stream going right -->
    <path d="M146,145 Q170,140 195,136" fill="none" stroke="#dff3fd" stroke-width="6" stroke-linecap="round"/>
    <path d="M146,148 Q175,145 215,142" fill="none" stroke="#dff3fd" stroke-width="8" stroke-linecap="round"/>
    <path d="M146,151 Q168,150 190,150" fill="none" stroke="#dff3fd" stroke-width="5" stroke-linecap="round"/>
    <!-- Glob at stream front -->
    <ellipse cx="218" cy="142" rx="12" ry="8" fill="#dff3fd" stroke="#000000" stroke-width="4"/>
    <!-- Droplets flying -->
    <ellipse cx="232" cy="132" rx="5" ry="4" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
    <ellipse cx="245" cy="145" rx="4" ry="3" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
    <ellipse cx="238" cy="155" rx="3" ry="3" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
    <ellipse cx="255" cy="135" rx="3" ry="2" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
