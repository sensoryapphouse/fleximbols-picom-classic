<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Squat modern: feet planted, thighs parallel to ground, arms extended forward, grounded -->
  <!-- Floor line -->
  <path d="M 40,218 L 250,218" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="145" cy="46" r="22" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M 124,40 Q 126,24 145,24 Q 164,24 166,40 Q 158,31 145,32 Q 132,31 124,40 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eyes (focused) -->
  <ellipse cx="138" cy="45" rx="2.5" ry="3" fill="#000000"/>
  <ellipse cx="152" cy="45" rx="2.5" ry="3" fill="#000000"/>
  <!-- Determined expression -->
  <path d="M 139,55 L 151,55" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Torso (upright with slight lean) -->
  <path d="M 133,66 Q 135,63 145,62 Q 155,63 157,66 L 158,112 L 132,112 Z" fill="#d01424" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- BOTH ARMS: extended forward for balance (parallel to ground) -->
  <!-- Left arm extending forward-left -->
  <path d="M 133,84 Q 112,82 90,80" stroke="#000000" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 90,80 Q 72,78 56,76" stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="52" cy="75" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right arm extending forward-right -->
  <path d="M 157,84 Q 178,82 200,80" stroke="#000000" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 200,80 Q 218,78 234,76" stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="238" cy="75" r="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- LEFT UPPER THIGH: nearly horizontal (parallel to ground) going left -->
  <path d="M 133,112 Q 110,128 86,140" stroke="#1d0e82" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Left shin: going down from knee -->
  <path d="M 86,140 Q 82,172 80,218" stroke="#1d0e82" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Left foot -->
  <path d="M 68,218 L 94,218" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <!-- RIGHT UPPER THIGH: nearly horizontal going right -->
  <path d="M 157,112 Q 180,128 204,140" stroke="#1d0e82" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Right shin: going down -->
  <path d="M 204,140 Q 208,172 210,218" stroke="#1d0e82" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Right foot -->
  <path d="M 196,218 L 222,218" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <!-- Parallel-to-ground thigh indicator (dashed horizontal) -->
  <path d="M 78,140 L 210,140" stroke="#f7de58" stroke-width="2" stroke-dasharray="5,3" stroke-linecap="round"/>
  <!-- 90-degree angle cue at knee (left) -->
  <path d="M 86,132 L 78,140 L 82,148" stroke="#2a4ec0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- 90-degree angle cue at knee (right) -->
  <path d="M 204,132 L 212,140 L 208,148" stroke="#2a4ec0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
