  <!-- sre: similar to site-reliability-engineer, slightly simpler/compact; person + uptime graph + shield -->

  <!-- Monitor (slightly smaller/simpler) -->
  <rect x="132" y="62" width="126" height="90" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Screen -->
  <rect x="140" y="70" width="110" height="74" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Uptime graph (simpler, fewer points) -->
  <polyline points="148,130 164,130 174,112 186,130 202,130 214,110 228,110 240,130" fill="none" stroke="#529929" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="148" y1="135" x2="244" y2="135" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="214" cy="110" r="4" fill="#f8130d" stroke="#000000" stroke-width="2"/>

  <!-- Monitor stand -->
  <rect x="188" y="152" width="14" height="16" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="176" y="166" width="38" height="6" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Shield (right of monitor) -->
  <path d="M252,178 Q252,208 245,216 Q238,208 238,178 L238,168 L252,168 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shield tick -->
  <polyline points="241,192 244,198 250,184" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Person: full body, standing left (slightly more compact) -->
  <!-- Head -->
  <circle cx="56" cy="56" r="20" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="56" cy="42" rx="20" ry="10" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <!-- Torso -->
  <rect x="36" y="78" width="40" height="48" rx="6" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm -->
  <line x1="36" y1="88" x2="18" y2="116" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="18" cy="118" r="6" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Right arm toward screen -->
  <line x1="76" y1="86" x2="114" y2="102" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="116" cy="103" r="6" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Hips -->
  <rect x="34" y="124" width="44" height="20" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect x="34" y="142" width="16" height="52" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="62" y="142" width="16" height="52" rx="4" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left foot -->
  <rect x="28" y="190" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right foot -->
  <rect x="60" y="190" width="22" height="10" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
</svg>
