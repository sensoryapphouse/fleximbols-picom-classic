  <!-- Shamrock - three leaves -->
  <!-- Left leaf -->
  <circle cx="102" cy="118" r="36" fill="#529929" stroke="#000000" stroke-width="5"/>
  <!-- Right leaf -->
  <circle cx="188" cy="118" r="36" fill="#529929" stroke="#000000" stroke-width="5"/>
  <!-- Top leaf -->
  <circle cx="145" cy="82" r="36" fill="#529929" stroke="#000000" stroke-width="5"/>
  <!-- Center overlap fill -->
  <circle cx="145" cy="118" r="22" fill="#529929" stroke="none"/>
  <!-- Stem -->
  <path d="M145,148 C145,148 140,175 130,195" fill="none" stroke="#529929" stroke-width="8" stroke-linecap="round"/>
  <path d="M145,148 C145,148 150,175 160,195" fill="none" stroke="#529929" stroke-width="8" stroke-linecap="round"/>
  <!-- Stem outline -->
  <path d="M145,148 C145,148 140,175 130,195" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M145,148 C145,148 150,175 160,195" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Leaf vein lines -->
  <line x1="102" y1="88" x2="102" y2="148" stroke="#67832d" stroke-width="3" stroke-linecap="round"/>
  <line x1="188" y1="88" x2="188" y2="148" stroke="#67832d" stroke-width="3" stroke-linecap="round"/>
  <line x1="118" y1="58" x2="172" y2="106" stroke="#67832d" stroke-width="3" stroke-linecap="round"/>
  <!-- Leprechaun hat brim -->
  <rect x="72" y="28" width="146" height="18" rx="4" ry="4" fill="#137827" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Leprechaun hat body -->
  <rect x="96" y="28" width="98" height="62" rx="4" ry="4" fill="#137827" stroke="#000000" stroke-width="5" stroke-linejoin="round" transform="translate(0,-62)"/>
  <!-- Hat body repositioned -->
  <rect x="96" y="28" width="98" height="60" rx="4" ry="4" fill="#137827" stroke="none"/>
  <rect x="96" y="25" width="98" height="62" rx="4" ry="4" fill="#137827" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hat band (gold) -->
  <rect x="96" y="70" width="98" height="17" rx="0" ry="0" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Hat buckle -->
  <rect x="134" y="73" width="22" height="11" rx="2" ry="2" fill="#f2e40d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="139" y="76" width="12" height="5" rx="1" ry="1" fill="none" stroke="#000000" stroke-width="2"/>
