  <!-- Water -->
  <rect x="20" y="175" width="250" height="45" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <path d="M25,188 Q65,182 105,188 Q145,194 185,188 Q225,182 265,188" fill="none" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <path d="M25,202 Q65,197 105,202 Q145,207 185,202 Q225,197 265,202" fill="none" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>

  <!-- Paddleboard (elongated, on water surface) -->
  <ellipse cx="145" cy="180" rx="108" ry="14" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Board deck detail stripe -->
  <ellipse cx="145" cy="178" rx="80" ry="6" fill="#d01424" stroke="none"/>
  <!-- Board nose fin shadow -->
  <polygon points="245,180 255,188 245,188" fill="#000000" stroke="none"/>

  <!-- Paddler figure standing on board -->
  <!-- Left leg -->
  <line x1="135" y1="165" x2="130" y2="178" stroke="#4d4d4d" stroke-width="11" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="155" y1="165" x2="160" y2="178" stroke="#4d4d4d" stroke-width="11" stroke-linecap="round"/>
  <!-- Torso -->
  <rect x="132" y="130" width="26" height="36" rx="5" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="145" cy="118" rx="14" ry="14" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair -->
  <path d="M131,116 Q131,104 145,102 Q159,104 159,116" fill="#4d4d4d" stroke="none"/>

  <!-- Right arm reaching down to paddle -->
  <line x1="158" y1="140" x2="182" y2="160" stroke="#2a4ec0" stroke-width="11" stroke-linecap="round"/>
  <!-- Left arm up on paddle shaft -->
  <line x1="132" y1="136" x2="115" y2="118" stroke="#2a4ec0" stroke-width="11" stroke-linecap="round"/>

  <!-- Long paddle shaft -->
  <line x1="108" y1="112" x2="188" y2="168" stroke="#9d7246" stroke-width="6" stroke-linecap="round"/>
  <!-- Paddle T-grip (top) -->
  <rect x="100" y="106" width="18" height="10" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Paddle blade (bottom, in water) -->
