  <!-- semicircle suggestion: 3 figures arranged in arc -->
  <!-- figure LEFT -->
  <!-- head -->
  <circle cx="65" cy="74" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- body -->
  <path d="M55 94 Q48 130 50 160 L80 160 Q82 130 75 94 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- left arm -->
  <line x1="50" y1="108" x2="36" y2="130" stroke="#2a4ec0" stroke-width="8" stroke-linecap="round"/>
  <!-- right arm angled inward (talking gesture) -->
  <line x1="76" y1="108" x2="92" y2="126" stroke="#2a4ec0" stroke-width="8" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="58" y1="158" x2="54" y2="200" stroke="#2a4ec0" stroke-width="8" stroke-linecap="round"/>
  <line x1="72" y1="158" x2="76" y2="200" stroke="#2a4ec0" stroke-width="8" stroke-linecap="round"/>

  <!-- figure CENTRE (slightly taller / forward) -->
  <circle cx="145" cy="66" r="22" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <path d="M134 88 Q126 126 128 158 L162 158 Q164 126 156 88 Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- arms spread open -->
  <line x1="128" y1="106" x2="108" y2="122" stroke="#f8130d" stroke-width="8" stroke-linecap="round"/>
  <line x1="158" y1="106" x2="178" y2="122" stroke="#f8130d" stroke-width="8" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="137" y1="156" x2="133" y2="200" stroke="#f8130d" stroke-width="8" stroke-linecap="round"/>
  <line x1="153" y1="156" x2="157" y2="200" stroke="#f8130d" stroke-width="8" stroke-linecap="round"/>

  <!-- figure RIGHT -->
  <circle cx="225" cy="74" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <path d="M215 94 Q208 130 210 160 L240 160 Q242 130 235 94 Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- left arm angled inward -->
  <line x1="212" y1="108" x2="196" y2="126" stroke="#529929" stroke-width="8" stroke-linecap="round"/>
  <!-- right arm -->
  <line x1="236" y1="108" x2="252" y2="130" stroke="#529929" stroke-width="8" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="218" y1="158" x2="214" y2="200" stroke="#529929" stroke-width="8" stroke-linecap="round"/>
  <line x1="232" y1="158" x2="236" y2="200" stroke="#529929" stroke-width="8" stroke-linecap="round"/>

  <!-- speech bubble small (centre figure talking) -->
  <path d="M152 38 Q152 22 170 22 Q188 22 188 38 Q188 50 170 50 L162 54 L164 50 Q152 50 152 38 Z"
        fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- dot dot dot in bubble -->
  <circle cx="163" cy="38" r="3" fill="#000000"/>
  <circle cx="170" cy="38" r="3" fill="#000000"/>
  <circle cx="177" cy="38" r="3" fill="#000000"/>
</svg>
