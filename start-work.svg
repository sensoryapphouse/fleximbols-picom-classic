<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Figure at desk, hands on keyboard, screen lit, play arrow indicating starting -->
  <!-- Floor -->
  <line x1="20" y1="228" x2="270" y2="228" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Desk surface -->
  <rect x="40" y="158" width="220" height="14" rx="5" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Desk left leg -->
  <rect x="48" y="172" width="12" height="56" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <!-- Desk right leg -->
  <rect x="200" y="172" width="12" height="56" rx="4" fill="#7d5e23" stroke="#000000" stroke-width="4"/>
  <!-- Monitor on desk -->
  <rect x="128" y="86" width="96" height="70" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Monitor screen — LIT and active (bright) -->
  <rect x="134" y="92" width="84" height="58" rx="4" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <!-- BIG green play triangle in center of screen (draw as path) -->
  <!-- Triangle: pointing right, centered at ~(200, 120), height 32, width 28 -->
  <polygon points="186,104 186,136 214,120" fill="#529929" stroke="#000000" stroke-width="3"/>
  <!-- Screen shine / active glow effect - bright bar at top -->
  <rect x="134" y="92" width="84" height="8" rx="4" fill="#ffffff" stroke="none"/>
  <!-- Monitor stand neck -->
  <rect x="168" y="156" width="14" height="8" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <!-- Monitor stand base -->
  <rect x="156" y="156" width="38" height="6" rx="3" fill="#7f7f7f" stroke="#000000" stroke-width="3"/>
  <!-- Keyboard on desk — hands actively on it -->
  <rect x="96" y="150" width="76" height="12" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <!-- Key rows -->
  <rect x="100" y="153" width="8" height="4" rx="1" fill="#7f7f7f" stroke="none"/>
  <rect x="112" y="153" width="8" height="4" rx="1" fill="#7f7f7f" stroke="none"/>
  <rect x="124" y="153" width="8" height="4" rx="1" fill="#7f7f7f" stroke="none"/>
  <rect x="136" y="153" width="8" height="4" rx="1" fill="#7f7f7f" stroke="none"/>
  <rect x="148" y="153" width="8" height="4" rx="1" fill="#7f7f7f" stroke="none"/>
  <rect x="160" y="153" width="8" height="4" rx="1" fill="#7f7f7f" stroke="none"/>
  <!-- Mouse -->
  <ellipse cx="86" cy="155" rx="9" ry="11" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <line x1="86" y1="149" x2="86" y2="155" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Chair back -->
  <rect x="42" y="128" width="52" height="50" rx="8" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Chair seat -->
  <rect x="36" y="170" width="64" height="14" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Chair post -->
  <rect x="62" y="184" width="12" height="30" rx="4" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Chair wheels -->
  <ellipse cx="48" cy="220" rx="10" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <ellipse cx="88" cy="220" rx="10" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Figure seated — leaning forward, engaged -->
  <!-- Torso (leaning slightly forward) -->
  <path d="M50 106 Q56 150 60 162 L96 162 Q100 150 106 106 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head (slightly forward tilt) -->
  <circle cx="78" cy="84" r="23" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M56 80 Q59 62 78 60 Q97 62 100 80" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Eyes wide/focused at screen -->
  <ellipse cx="70" cy="82" rx="4" ry="4.5" fill="#000000"/>
  <ellipse cx="86" cy="82" rx="4" ry="4.5" fill="#000000"/>
  <!-- Eye whites to show direction -->
  <circle cx="71" cy="81" r="1.5" fill="#ffffff"/>
  <circle cx="87" cy="81" r="1.5" fill="#ffffff"/>
  <!-- Focused/excited expression -->
  <path d="M69 93 Q78 100 87 93" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Both hands actively on keyboard -->
  <!-- Right arm reaching to keyboard -->
  <path d="M96 130 Q116 144 132 152" fill="none" stroke="#eed5b6" stroke-width="13" stroke-linecap="round"/>
  <!-- Right hand fingers on keys -->
  <ellipse cx="134" cy="153" rx="13" ry="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left arm reaching to keyboard -->
  <path d="M60 130 Q80 144 96 152" fill="none" stroke="#eed5b6" stroke-width="13" stroke-linecap="round"/>
  <!-- Left hand fingers on keys -->
  <ellipse cx="98" cy="153" rx="13" ry="8" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Legs seated -->
  <rect x="44" y="170" width="18" height="16" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <rect x="68" y="170" width="18" height="16" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <rect x="44" y="186" width="14" height="30" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <rect x="72" y="186" width="14" height="30" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Shoes -->
  <ellipse cx="51" cy="218" rx="13" ry="6" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="79" cy="218" rx="13" ry="6" fill="#000000" stroke="#000000" stroke-width="3"/>
</svg>
