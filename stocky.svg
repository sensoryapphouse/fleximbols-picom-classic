  <!-- Stocky: shorter + broader than chunky, compact powerful build -->
  <!-- Head: large relative to body (shorter overall) -->
  <circle cx="145" cy="50" r="26" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Neck: short, wide -->
  <rect x="133" y="74" width="24" height="10" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Torso: very wide, short height -->
  <rect x="92" y="82" width="106" height="56" fill="#ff9900" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm: very thick, short -->
  <rect x="58" y="84" width="30" height="46" rx="10" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right arm: very thick, short -->
  <rect x="202" y="84" width="30" height="46" rx="10" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left leg: thick, short -->
  <rect x="96" y="136" width="36" height="52" rx="10" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right leg: thick, short -->
  <rect x="158" y="136" width="36" height="52" rx="10" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Compactness cue: inward-pointing arrows above figure sides showing squashed height -->
  <line x1="35" y1="30" x2="35" y2="188" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <polygon points="35,30 29,48 41,48" fill="#000000"/>
  <polygon points="35,188 29,170 41,170" fill="#000000"/>
</svg>
