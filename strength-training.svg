  <!-- Floor -->
  <path d="M 30,218 L 260,218" stroke="#000000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Left leg planted -->
  <path d="M 128,160 L 118,218 L 138,218 L 144,165 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right leg planted, slight bend -->
  <path d="M 162,160 L 172,218 L 152,218 L 146,165 Z" fill="#1d0e82" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Shoes -->
