  <!-- Floor line -->
  <line x1="25" y1="210" x2="265" y2="210" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Yoga mat -->
  <path d="M 40 210 Q 145 205 250 210 L 250 218 Q 145 222 40 218 Z" fill="#3aa6a0" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Figure seated: torso leaning forward over straight leg -->
  <!-- Pelvis / seat on mat -->
  <!-- Right leg straight forward -->
  <line x1="110" y1="185" x2="235" y2="185" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Foot at end of straight leg -->
  <path d="M 235 185 Q 246 183 248 192 Q 242 198 232 194 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left leg bent back -->
  <path d="M 110 185 Q 90 192 75 205" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Left foot -->
  <path d="M 75 205 Q 66 208 65 218 Q 72 220 80 214 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Torso leaning far forward -->
  <line x1="110" y1="185" x2="185" y2="155" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head (close to knee, reaching forward) -->
  <circle cx="205" cy="145" r="17" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hair bun -->
  <circle cx="208" cy="130" r="8" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left arm reaching along leg toward foot -->
  <line x1="145" y1="168" x2="230" y2="188" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left hand near ankle -->
  <circle cx="230" cy="188" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm also reaching -->
  <line x1="160" y1="160" x2="245" y2="183" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right hand near foot -->
  <circle cx="245" cy="183" r="6" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shirt on torso -->
  <path d="M 118 182 Q 145 168 185 155 Q 190 160 165 175 Q 140 188 115 190 Z" fill="#f266aa" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
