  <!-- sky -->
  <rect x="26" y="32" width="238" height="176" fill="#392170" stroke="#000000" stroke-width="3"/>
  <!-- crescent moon top-left -->
  <path d="M48 48 A24 24 0 1 0 48 96 A18 18 0 1 1 48 48 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- heart-spiral symbol, top right -->
  <path d="M240 50 Q230 38 220 50 Q210 38 200 50 Q200 62 220 78 Q240 62 240 50 Z" fill="#f266aa" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- spiral inside heart -->
  <path d="M220 65 Q215 60 218 56 Q224 54 224 60 Q224 66 218 67 Q210 67 210 58" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- whirling dervish FULL BODY, centre -->
  <!-- tall conical hat (sikke) -->
  <polygon points="130,42 160,42 155,90 135,90" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- head -->
  <ellipse cx="145" cy="100" rx="14" ry="16" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- closed eyes (meditative) -->
  <path d="M138 100 Q140 102 142 100" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M148 100 Q150 102 152 100" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="141" y="115" width="8" height="6" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <!-- torso (white jacket) -->
  <path d="M125 122 L165 122 L168 165 L122 165 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arms extended: right arm up, left arm down (classic sema posture) -->
  <path d="M165 124 Q200 110 215 80" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M125 124 Q90 140 75 175" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- hands -->
  <circle cx="216" cy="80" r="6" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <circle cx="74" cy="178" r="6" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <!-- swirling white skirt (tennure), full body silhouette -->
  <path d="M122 165 L168 165 L220 222 L70 222 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- skirt motion lines -->
  <path d="M95 200 Q105 195 115 200" fill="none" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
  <path d="M130 205 Q145 200 160 205" fill="none" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
  <path d="M175 200 Q190 195 200 200" fill="none" stroke="#7f7f7f" stroke-width="2" stroke-linecap="round"/>
  <!-- visible legs/feet at base -->
  <rect x="135" y="222" width="8" height="10" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <rect x="147" y="222" width="8" height="10" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
</svg>
