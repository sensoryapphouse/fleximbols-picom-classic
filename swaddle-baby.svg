  <rect x="42" y="160" width="14" height="56" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
  <rect x="68" y="160" width="14" height="56" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
  <ellipse cx="49" cy="220" rx="10" ry="5" fill="#000000"/>
  <ellipse cx="75" cy="220" rx="10" ry="5" fill="#000000"/>
