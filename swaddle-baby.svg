  <path d="M82 96 Q120 112 138 132" fill="none" stroke="#529929" stroke-width="12" stroke-linecap="round"/>
  <path d="M40 96 Q70 116 96 136" fill="none" stroke="#529929" stroke-width="12" stroke-linecap="round"/>
