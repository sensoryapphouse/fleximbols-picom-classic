  <circle cx="60" cy="60" r="18" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <path d="M44 56 Q50 36 70 38 Q80 42 78 60 L78 72 L46 72 Q42 64 44 56 Z" fill="#000000"/>
  <circle cx="55" cy="62" r="1.8" fill="#000000"/>
