  <rect x="244" y="174" width="10" height="42" fill="#9d7246" stroke="#000000" stroke-width="2.5"/>
  <!-- pad on table -->
  <rect x="50" y="148" width="200" height="14" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
