  <!-- Kenya/East-Africa: black / red / green horizontal + thin yellow separators -->
  <defs>
    <clipPath id="swahili-bubble">
      <path d="M25,20 Q25,20 265,20 Q275,20 275,30 L275,175 Q275,185 265,185 L165,185 L150,215 L135,185 L35,185 Q25,185 25,175 Z"/>
    </clipPath>
  </defs>
  <!-- Green bottom -->
  <rect x="25" y="20" width="250" height="166" fill="#137827" clip-path="url(#swahili-bubble)"/>
  <!-- Red middle -->
  <rect x="25" y="68" width="250" height="50" fill="#d01424" clip-path="url(#swahili-bubble)"/>
  <!-- Black top -->
  <rect x="25" y="20" width="250" height="48" fill="#000000" clip-path="url(#swahili-bubble)"/>
  <!-- Yellow separators -->
  <rect x="25" y="66" width="250" height="6" fill="#f7de58" clip-path="url(#swahili-bubble)"/>
  <rect x="25" y="116" width="250" height="6" fill="#f7de58" clip-path="url(#swahili-bubble)"/>
  <!-- Bubble outline + tail -->
  <path d="M25,20 Q25,20 265,20 Q275,20 275,30 L275,175 Q275,185 265,185 L165,185 L150,215 L135,185 L35,185 Q25,185 25,175 Z" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Simple Maasai shield emblem (oval with stripes) on red band -->
  <ellipse cx="150" cy="93" rx="16" ry="22" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <rect x="134" y="86" width="32" height="5" fill="#d01424" stroke="none"/>
  <rect x="134" y="96" width="32" height="5" fill="#000000" stroke="none"/>
</svg>
