  <!-- Massage table -->
  <rect x="10" y="140" width="220" height="40" rx="6" fill="#f5e7c4" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Table legs -->
  <rect x="28" y="178" width="10" height="50" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="202" y="178" width="10" height="50" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Person face down -->
  <!-- Head -->
  <ellipse cx="48" cy="128" rx="22" ry="18" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M30 122 Q48 110 66 122 Q62 116 48 114 Q34 116 30 122Z" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Back/body -->
  <path d="M66 122 L180 118 Q200 128 180 140 L66 140 Q50 132 66 122 Z" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Towel on legs -->
  <rect x="130" y="124" width="100" height="30" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Towel folds -->
  <line x1="150" y1="128" x2="150" y2="150" stroke="#b8b8b8" stroke-width="2"/>
  <line x1="180" y1="128" x2="180" y2="150" stroke="#b8b8b8" stroke-width="2"/>
  <line x1="210" y1="128" x2="210" y2="150" stroke="#b8b8b8" stroke-width="2"/>
  <!-- LONG GLIDING-STROKE hands (one continuous gliding motion across back) -->
  <!-- Therapist hand -->
  <ellipse cx="100" cy="100" rx="22" ry="12" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <line x1="88" y1="106" x2="82" y2="116" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="110" x2="93" y2="121" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="104" y1="111" x2="104" y2="123" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="112" y1="110" x2="115" y2="122" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Wrist -->
  <rect x="90" y="80" width="22" height="22" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- GLIDING STROKE LINES (long flowing curves across the back - signature of Swedish) -->
  <path d="M70 132 Q120 124 175 132" fill="none" stroke="#d01424" stroke-width="3" stroke-linecap="round"/>
  <path d="M75 138 Q125 130 175 138" fill="none" stroke="#d01424" stroke-width="3" stroke-linecap="round"/>
  <!-- Arrow showing gliding direction -->
  <path d="M165 130 L178 135 L165 140" fill="none" stroke="#d01424" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- OIL BOTTLE on side (signature for Swedish massage - long gliding with oil) -->
  <rect x="245" y="155" width="34" height="55" rx="4" fill="#67832d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Bottle neck -->
  <rect x="254" y="142" width="16" height="14" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Cap -->
  <rect x="252" y="128" width="20" height="16" rx="2" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Bottle label -->
  <rect x="250" y="170" width="24" height="25" fill="#f5e7c4" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Oil drop -->
  <path d="M262 178 Q258 184 262 190 Q266 184 262 178Z" fill="#f7de58" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
