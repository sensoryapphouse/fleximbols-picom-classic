  <!-- Full body figure taking casual quick drink from tilted bottle -->
  <!-- Head -->
  <circle cx="145" cy="36" r="27" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair short casual -->
  <path d="M120 28 Q122 12 145 10 Q168 12 170 28 Q165 16 145 14 Q125 16 120 28 Z" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Eyes relaxed -->
  <ellipse cx="136" cy="33" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="154" cy="33" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="137" cy="34" r="3.5" fill="#4d4d4d"/>
  <circle cx="155" cy="34" r="3.5" fill="#4d4d4d"/>
  <!-- Brows -->
  <path d="M129 26 Q136 22 143 25" fill="none" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <path d="M147 25 Q154 22 161 26" fill="none" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/>
  <!-- Nose small -->
  <circle cx="141" cy="40" r="2.5" fill="#e6b98a"/>
  <circle cx="149" cy="40" r="2.5" fill="#e6b98a"/>
  <!-- Mouth open at bottle opening, casual -->
  <path d="M136 50 Q145 55 154 50" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="134" y="61" width="22" height="16" rx="5" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Body torso — casual stance slight lean -->
  <path d="M115 78 Q108 82 106 95 L100 158 Q100 165 114 165 L176 165 Q190 165 190 158 L184 95 Q182 82 175 78 Z" fill="#ff9900" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Legs -->
  <path d="M114 165 L108 225" stroke="#000000" stroke-width="13" stroke-linecap="round"/>
  <path d="M176 165 L182 225" stroke="#000000" stroke-width="13" stroke-linecap="round"/>
  <ellipse cx="106" cy="228" rx="16" ry="8" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <ellipse cx="184" cy="228" rx="16" ry="8" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Right arm raised, holding tilted bottle at mouth -->
  <path d="M175 95 Q200 85 218 70" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round"/>
  <path d="M175 95 Q200 85 218 70" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Left arm loosely at side -->
  <path d="M108 95 Q82 108 72 130" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round"/>
  <path d="M108 95 Q82 108 72 130" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottle tilted ~45deg at mouth -->
  <!-- Bottle body -->
  <path d="M230 20 L246 20 L252 28 L252 72 Q252 78 246 78 L230 78 Q224 78 224 72 L224 28 Z" fill="#90a7d6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Bottle neck -->
  <rect x="234" y="10" width="8" height="14" rx="3" fill="#90a7d6" stroke="#000000" stroke-width="4"/>
  <!-- Bottle cap -->
  <rect x="232" y="6" width="12" height="8" rx="3" fill="#f8130d" stroke="#000000" stroke-width="4"/>
  <!-- Liquid in bottle -->
  <path d="M225 50 L225 72 Q225 77 230 77 L246 77 Q251 77 251 72 L251 50 Z" fill="#dff3fd" stroke="none"/>
  <line x1="225" y1="50" x2="251" y2="50" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Small liquid drip at bottle mouth -->
  <circle cx="240" cy="13" r="4" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
