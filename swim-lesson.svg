  <!-- background sky -->
  <rect x="0" y="0" width="290" height="80" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <!-- pool deck -->
  <rect x="0" y="80" width="290" height="40" fill="#efefef" stroke="#000000" stroke-width="3"/>
  <!-- pool tile edge -->
  <rect x="0" y="118" width="290" height="6" fill="#90a7d6" stroke="#000000" stroke-width="2"/>
  <!-- pool water -->
  <rect x="0" y="124" width="290" height="116" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <!-- water ripples -->
  <path d="M10 160 Q30 155 50 160 Q70 165 90 160" fill="none" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <path d="M150 175 Q170 170 190 175 Q210 180 230 175" fill="none" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 210 Q50 205 70 210" fill="none" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>
  <path d="M170 220 Q190 215 210 220" fill="none" stroke="#90a7d6" stroke-width="3" stroke-linecap="round"/>

  <!-- INSTRUCTOR FULL BODY at pool edge (right side, on deck) -->
  <!-- head -->
  <circle cx="220" cy="40" r="14" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <path d="M206 38 Q210 25 220 24 Q230 25 234 38 Q228 31 220 31 Q212 31 206 38 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="216" cy="41" r="1.5" fill="#000000"/>
  <circle cx="224" cy="41" r="1.5" fill="#000000"/>
  <path d="M215 48 Q220 51 225 48" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- whistle on string -->
  <line x1="220" y1="54" x2="225" y2="68" stroke="#f7de58" stroke-width="2"/>
  <circle cx="225" cy="70" r="3" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- torso -->
  <path d="M206 56 L234 56 L236 110 L204 110 Z" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arms (one gesturing toward pool) -->
  <path d="M206 65 Q190 75 175 90" fill="none" stroke="#e6b98a" stroke-width="9" stroke-linecap="round"/>
  <path d="M206 65 Q190 75 175 90" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M234 65 Q250 70 258 80" fill="none" stroke="#e6b98a" stroke-width="9" stroke-linecap="round"/>
  <path d="M234 65 Q250 70 258 80" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- legs (standing on deck) -->
  <path d="M212 110 L210 118" fill="none" stroke="#392170" stroke-width="11" stroke-linecap="round"/>
  <path d="M228 110 L230 118" fill="none" stroke="#392170" stroke-width="11" stroke-linecap="round"/>
  <path d="M212 110 L210 118" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M228 110 L230 118" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- KICKBOARD in water -->
  <rect x="75" y="155" width="65" height="28" rx="6" fill="#ff9900" stroke="#000000" stroke-width="3"/>
  <line x1="85" y1="170" x2="135" y2="170" stroke="#e65a00" stroke-width="2"/>

  <!-- CHILD in pool FULL BODY (horizontal, kicking, holding kickboard) -->
  <!-- head emerging at front of kickboard -->
  <circle cx="65" cy="158" r="14" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <path d="M51 156 Q55 144 65 142 Q75 144 79 156 Q74 150 65 150 Q56 150 51 156 Z" fill="#7d5e23" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="60" cy="158" r="1.5" fill="#000000"/>
  <circle cx="70" cy="158" r="1.5" fill="#000000"/>
  <path d="M59 165 Q65 168 71 165" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- arms reaching forward gripping board -->
  <path d="M75 165 Q80 168 88 168" fill="none" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <path d="M75 165 Q80 168 88 168" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- torso (horizontal, partially submerged) -->
  <path d="M75 172 L140 175 L138 195 L78 195 Z" fill="#f266aa" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- legs kicking out behind -->
  <path d="M140 180 Q165 175 180 188" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M140 190 Q160 200 175 215" fill="none" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M140 180 Q165 175 180 188" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M140 190 Q160 200 175 215" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- splash -->
  <path d="M180 185 L188 175 M184 188 L195 188 M180 195 L190 205" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
