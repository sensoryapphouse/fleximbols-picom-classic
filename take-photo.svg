  <!-- flash burst behind camera -->
  <path d="M40 50 L60 80 L30 95 L65 110 L40 140 L75 130 L70 170 L100 140 L120 175 L130 135 L160 165 L160 125" fill="#fff200" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
