  <!-- Blue left block, yellow right block -->
  <rect x="20" y="20" width="125" height="175" fill="#2a4ec0" clip-path="url(#bubble-te)"/>
  <rect x="145" y="20" width="125" height="175" fill="#f7de58" clip-path="url(#bubble-te)"/>
