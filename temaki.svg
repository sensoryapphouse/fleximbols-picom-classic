  <!-- temaki hand-roll: nori cone with rice + fillings at the top opening -->
  <g transform="translate(25,18) scale(2.4)" stroke-linejoin="round">
    <!-- nori cone -->
    <path d="M18,75 Q20,30 50,15 Q70,28 82,75 Z" fill="#243a1e" stroke="#000000" stroke-width="2.6"/>
    <!-- rice at the wide opening -->
    <ellipse cx="50" cy="15" rx="21" ry="8.5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <!-- fillings poking out the top -->
    <ellipse cx="41" cy="11" rx="8.5" ry="5" fill="#ff8a5c" stroke="#000000" stroke-width="1.8" transform="rotate(-15,41,11)"/>
    <ellipse cx="59" cy="13" rx="7.5" ry="4.5" fill="#67a83a" stroke="#000000" stroke-width="1.8" transform="rotate(10,59,13)"/>
    <ellipse cx="50" cy="9" rx="6.5" ry="4.5" fill="#d01424" stroke="#000000" stroke-width="1.8"/>
    <!-- sesame on the nori -->
    <circle cx="34" cy="50" r="1.8" fill="#f5e7c4"/>
    <circle cx="66" cy="45" r="1.8" fill="#f5e7c4"/>
    <circle cx="40" cy="65" r="1.8" fill="#f5e7c4"/>
    <circle cx="58" cy="62" r="1.8" fill="#f5e7c4"/>
  </g>
</svg>
