  <!-- Government building merged with religious symbol -->
  <rect x="30" y="80" width="230" height="100" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Building pediment -->
  <path d="M 30 80 L 145 30 L 260 80 Z" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Cross atop pediment (religious symbol) -->
  <rect x="142" y="10" width="6" height="22" fill="#f2e40d" stroke="#000000" stroke-width="2"/>
  <rect x="135" y="15" width="20" height="6" fill="#f2e40d" stroke="#000000" stroke-width="2"/>
  <!-- Columns -->
  <rect x="45" y="90" width="12" height="85" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="75" y="90" width="12" height="85" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="105" y="90" width="12" height="85" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="173" y="90" width="12" height="85" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="203" y="90" width="12" height="85" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="233" y="90" width="12" height="85" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Podium (centre, in front of building) -->
  <rect x="125" y="155" width="40" height="40" fill="#9d7246" stroke="#000000" stroke-width="2.5"/>
  <rect x="120" y="150" width="50" height="8" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <!-- Religious figure FULL BODY behind/at podium -->
  <!-- Head -->
  <circle cx="145" cy="100" r="12" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <!-- Mitre/headdress -->
  <path d="M 133 95 L 133 80 Q 145 70 157 80 L 157 95 Z" fill="#f2e40d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 142 85 L 145 80 L 148 85 L 145 90 Z" fill="#d01424" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Face -->
  <circle cx="141" cy="100" r="1.5" fill="#000000"/>
  <circle cx="149" cy="100" r="1.5" fill="#000000"/>
  <path d="M 141 107 Q 145 109 149 107" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Robe -->
  <path d="M 130 112 L 122 155 L 168 155 L 160 112 Z" fill="#7c3fac" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Sash with cross -->
  <rect x="140" y="115" width="10" height="40" fill="#f2e40d" stroke="#000000" stroke-width="1.5"/>
  <rect x="143" y="125" width="4" height="10" fill="#d01424"/>
  <rect x="140" y="128" width="10" height="4" fill="#d01424"/>
  <!-- Arms holding book -->
  <path d="M 130 118 L 115 145 L 122 148 L 135 122 Z" fill="#7c3fac" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 160 118 L 175 145 L 168 148 L 155 122 Z" fill="#7c3fac" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Holy book held in front -->
  <rect x="118" y="143" width="54" height="18" fill="#d01424" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="142" y="146" width="6" height="12" fill="#f2e40d" stroke="#000000" stroke-width="1"/>
  <rect x="143" y="148" width="4" height="8" fill="#ffffff"/>
  <rect x="144" y="150" width="2" height="4" fill="#d01424"/>
  <rect x="143" y="151" width="4" height="2" fill="#d01424"/>
