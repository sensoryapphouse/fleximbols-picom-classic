<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- therapy: two whole figures — therapist on chair, client reclined on couch -->

  <!-- couch/chaise -->
  <rect x="30" y="175" width="150" height="18" rx="8" ry="8" fill="#f5e7c4" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="30" y="148" width="20" height="45" rx="8" ry="8" fill="#f5e7c4" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- couch legs -->
  <line x1="40" y1="193" x2="40" y2="210" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="168" y1="193" x2="168" y2="210" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- CLIENT (reclined on couch) -->
  <!-- legs reclined -->
  <path d="M100 175 L158 175" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- shoe -->
  <ellipse cx="162" cy="175" rx="12" ry="7" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- client torso reclined -->
  <rect x="42" y="152" width="105" height="24" rx="10" ry="10" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- client arm resting -->
  <path d="M80 152 Q90 138 100 138" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="104" cy="136" rx="10" ry="8" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- client head on pillow -->
  <ellipse cx="55" cy="148" rx="22" ry="20" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- client eyes (closed, relaxed/talking) -->
  <path d="M46 146 Q55 150 64 146" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- client mouth (talking, slight open) -->
  <path d="M48 156 Q55 160 62 156" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- speech bubble from client -->
  <ellipse cx="95" cy="122" rx="32" ry="18" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M72 134 L64 148 L80 136" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- wavy lines in bubble (talking) -->
  <path d="M72 118 Q80 114 88 118 Q96 122 104 118" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M76 126 Q84 122 92 126" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- THERAPIST (seated on chair, upright) -->
  <!-- therapist chair -->
  <rect x="195" y="165" width="60" height="12" rx="6" ry="6" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="248" y="140" width="12" height="37" rx="6" ry="6" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <line x1="200" y1="177" x2="200" y2="210" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="248" y1="177" x2="248" y2="210" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- therapist legs -->
  <path d="M210 178 L206 210" stroke="#000000" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M235 178 L239 210" stroke="#000000" stroke-width="7" fill="none" stroke-linecap="round"/>
  <ellipse cx="203" cy="212" rx="12" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="242" cy="212" rx="12" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- therapist torso -->
  <path d="M200 118 Q210 106 222 108 Q234 106 244 118 L240 178 Q222 184 204 178 Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- therapist arm with clipboard -->
  <path d="M200 124 Q186 136 184 152" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="174" y="148" width="26" height="32" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="180" y="144" width="14" height="6" rx="2" ry="2" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <line x1="178" y1="158" x2="196" y2="158" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="178" y1="164" x2="196" y2="164" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="178" y1="170" x2="190" y2="170" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- therapist other arm resting -->
  <path d="M244 124 Q254 136 252 150" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="252" cy="153" rx="10" ry="8" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- therapist neck -->
  <rect x="216" y="94" width="12" height="16" rx="4" ry="4" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- therapist head -->
  <ellipse cx="222" cy="76" rx="26" ry="28" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- therapist eyes (attentive, open) -->
  <ellipse cx="213" cy="72" rx="5" ry="5" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="231" cy="72" rx="5" ry="5" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="214" cy="73" r="3" fill="#000000"/>
  <circle cx="232" cy="73" r="3" fill="#000000"/>
  <!-- slight smile -->
  <path d="M213 84 Q222 89 231 84" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- therapist glasses -->
  <path d="M208 70 Q213 66 218 70" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M226 70 Q231 66 236 70" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="218" y1="70" x2="226" y2="70" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
</svg>
