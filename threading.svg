  <!-- face (front view, head and brows area) -->
  <ellipse cx="145" cy="135" rx="75" ry="90" fill="#eed5b6" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- hair on top -->
  <path d="M75 90 Q90 50 145 45 Q200 50 215 90 Q210 70 195 65 Q175 55 145 55 Q115 55 95 65 Q80 70 75 90 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- left eye -->
  <ellipse cx="120" cy="125" rx="8" ry="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="120" cy="125" r="3" fill="#000000"/>
  <!-- right eye -->
  <ellipse cx="170" cy="125" rx="8" ry="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="170" cy="125" r="3" fill="#000000"/>
  <!-- left eyebrow (being shaped) -->
  <path d="M105 105 Q120 95 135 105" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right eyebrow (target) -->
  <path d="M155 105 Q170 95 185 105" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- nose -->
  <path d="M145 130 L138 155 L152 155 Z" fill="#e6b98a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- mouth -->
  <path d="M130 175 Q145 180 160 175" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- threads forming X across right brow -->
  <line x1="30" y1="85" x2="220" y2="125" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="85" x2="220" y2="125" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="125" x2="220" y2="85" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="125" x2="220" y2="85" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- technician's hand left -->
  <ellipse cx="25" cy="100" rx="20" ry="14" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- technician's hand right -->
  <ellipse cx="265" cy="100" rx="20" ry="14" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- crossing point indicator on brow -->
  <circle cx="170" cy="105" r="4" fill="#f8130d" stroke="#000000" stroke-width="2"/>
