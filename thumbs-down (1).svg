  <!-- thumbs-down: fist with thumb pointing down, yellow hand -->
  <!-- fist body -->
  <rect x="80" y="36" width="132" height="86" rx="22" ry="22" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- knuckle divisions across fist bottom -->
  <line x1="118" y1="98" x2="118" y2="122" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="155" y1="98" x2="155" y2="122" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="192" y1="98" x2="192" y2="122" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- curled finger tips (rounded bumps at bottom of fist) -->
  <rect x="82" y="112" width="28" height="20" rx="10" ry="10" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="114" y="114" width="28" height="22" rx="11" ry="11" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="148" y="114" width="28" height="22" rx="11" ry="11" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="182" y="112" width="26" height="20" rx="10" ry="10" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- thumb pointing downward -->
  <rect x="56" y="102" width="50" height="100" rx="25" ry="25" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- thumb knuckle crease -->
  <line x1="57" y1="132" x2="105" y2="132" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <!-- wrist -->
  <rect x="102" y="20" width="72" height="28" rx="10" ry="10" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
