  <!-- Tiny: small object (coin/pebble) next to a large hand + inward-pointing size arrows -->
  <!-- Large hand (open palm, pointing down at object) -->
  <!-- Palm -->
  <rect x="80" y="60" width="70" height="80" rx="18" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Fingers -->
  <rect x="84" y="30" width="14" height="44" rx="7" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="101" y="22" width="14" height="48" rx="7" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="118" y="22" width="14" height="48" rx="7" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="135" y="28" width="13" height="44" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Thumb -->
  <rect x="60" y="68" width="28" height="13" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Tiny object (small coin/pebble) resting in palm area, center -->
  <circle cx="145" cy="175" r="10" fill="#f7de58" stroke="#000000" stroke-width="4"/>

  <!-- Inward-pointing size arrows around the small object (showing it is tiny) -->
  <!-- Left arrow pointing right toward object -->
  <line x1="95" y1="175" x2="128" y2="175" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <polyline points="121,168 128,175 121,182" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arrow pointing left toward object -->
  <line x1="195" y1="175" x2="162" y2="175" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <polyline points="169,168 162,175 169,182" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top arrow pointing down toward object -->
  <line x1="145" y1="130" x2="145" y2="158" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <polyline points="138,151 145,158 152,151" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom arrow pointing up toward object -->
  <line x1="145" y1="220" x2="145" y2="192" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <polyline points="138,199 145,192 152,199" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
