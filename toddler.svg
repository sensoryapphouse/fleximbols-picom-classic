  <!-- Toddler: very small chubby figure, oversized head, unsteady wide stance -->

  <!-- Big round head (40px radius = very large relative to body) -->
  <circle cx="145" cy="105" r="42" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hair (wispy tufts) -->
  <path d="M120,72 Q130,58 145,56 Q160,58 170,72" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="145" y1="56" x2="145" y2="48" stroke="#9d7246" stroke-width="4" stroke-linecap="round"/>
  <!-- Eyes (big, wide apart) -->
  <circle cx="133" cy="103" r="5" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="157" cy="103" r="5" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="134" cy="104" r="2.5" fill="#000000"/>
  <circle cx="158" cy="104" r="2.5" fill="#000000"/>
  <!-- Chubby cheeks -->
  <ellipse cx="122" cy="114" rx="9" ry="6" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="168" cy="114" rx="9" ry="6" fill="#f4a4b2" stroke="none"/>
  <!-- Nose dot -->
  <circle cx="145" cy="112" r="2.5" fill="#e6b98a"/>
  <!-- Smile -->
  <path d="M134,121 Q145,130 156,121" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Short chubby torso -->
  <rect x="120" y="145" width="50" height="38" rx="12" fill="#f4a4b2" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Chubby arms (short, raised slightly - unsteady balance) -->
  <path d="M120,155 Q100,148 92,158" fill="none" stroke="#eed5b6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170,155 Q190,148 198,158" fill="none" stroke="#eed5b6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chubby short legs (wide apart, unsteady) -->
  <path d="M125,181 Q118,195 112,210" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M165,181 Q172,195 178,210" fill="none" stroke="#eed5b6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Little shoes -->
  <ellipse cx="110" cy="213" rx="14" ry="8" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="180" cy="213" rx="14" ry="8" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nappy/diaper outline visible at trouser hem -->
  <path d="M120,168 Q145,178 170,168" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
