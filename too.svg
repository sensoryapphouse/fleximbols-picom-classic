  <!-- too = a matching second item alongside the first (me too / also / as well) -->
  <!-- left disc (the original item) -->
  <circle cx="100" cy="95" r="62" fill="#bce0f4" stroke="#1a1a1a" stroke-width="8"/>
  <!-- right disc (the matching "too" item) -->
  <circle cx="190" cy="95" r="62" fill="#f9a01b" stroke="#1a1a1a" stroke-width="8"/>
  <!-- equals sign below = "same / as well" -->
  <line x1="95" y1="195" x2="195" y2="195" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
  <line x1="95" y1="218" x2="195" y2="218" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
</svg>
