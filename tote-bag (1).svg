  <!-- tote-bag-modern: large open-top rectangular tote shopper with two parallel carry handles -->
  <!-- Left handle -->
  <path d="M100 100 Q95 58 115 55 Q135 52 135 75" fill="none" stroke="#7d5e23" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right handle -->
  <path d="M190 100 Q195 58 175 55 Q155 52 155 75" fill="none" stroke="#7d5e23" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bag body: trapezoid wider at bottom -->
  <path d="M75 100 L80 215 L210 215 L215 100 Z" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Open top edge line -->
  <line x1="75" y1="100" x2="215" y2="100" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Left handle attachment bar -->
  <rect x="88" y="95" width="26" height="10" rx="3" ry="3" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- Right handle attachment bar -->
  <rect x="176" y="95" width="26" height="10" rx="3" ry="3" fill="#9d7246" stroke="#000000" stroke-width="3"/>
  <!-- Front panel interior line (structural seam) -->
  <path d="M90 115 L90 208" fill="none" stroke="#f2e40d" stroke-width="2.5"/>
  <path d="M200 115 L200 208" fill="none" stroke="#f2e40d" stroke-width="2.5"/>
  <!-- Bottom seam -->
  <path d="M82 208 L208 208" fill="none" stroke="#9d7246" stroke-width="3"/>
</svg>
