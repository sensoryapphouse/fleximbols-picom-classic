  <rect x="212" y="80" width="48" height="72" rx="6" fill="#ff9900" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- exclamation dot -->
  <circle cx="236" cy="138" r="6" fill="#000000"/>
