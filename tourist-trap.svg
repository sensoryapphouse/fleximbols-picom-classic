  <!-- star bursts on shop wall -->
  <path d="M70 148 l5 14 l-12-8 h14 l-12 8 Z" fill="#fff200" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M120 155 l4 11 l-10-6 h12 l-10 6 Z" fill="#fff200" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
