  <line x1="232" y1="145" x2="236" y2="210" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="208" y1="210" x2="192" y2="215" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="236" y1="210" x2="252" y2="215" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- Broken heart (two halves split apart) -->
  <!-- Left half -->
  <path d="M145 105 C145 105 128 90 128 77 C128 69 133 64 138 65 C141 66 145 70 145 70 L145 105 Z" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
