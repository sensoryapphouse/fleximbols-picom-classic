  <!-- ground line -->
  <line x1="5" y1="215" x2="285" y2="215" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- footprints behind walker -->
  <ellipse cx="40" cy="208" rx="9" ry="5" fill="#7f7f7f" stroke="#000000" stroke-width="1.5" transform="rotate(-15 40 208)"/>
  <ellipse cx="60" cy="200" rx="9" ry="5" fill="#7f7f7f" stroke="#000000" stroke-width="1.5" transform="rotate(-15 60 200)"/>
  <ellipse cx="80" cy="208" rx="9" ry="5" fill="#7f7f7f" stroke="#000000" stroke-width="1.5" transform="rotate(-15 80 208)"/>
  <!-- person, full body, walking, center-left -->
  <!-- back leg -->
  <path d="M 112 150 L 100 200 L 110 200 L 122 152 Z" fill="#2a4ec0" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- front leg -->
  <path d="M 128 150 L 145 200 L 155 200 L 138 152 Z" fill="#2a4ec0" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- back shoe -->
  <ellipse cx="105" cy="205" rx="10" ry="4.5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- front shoe -->
  <ellipse cx="150" cy="205" rx="10" ry="4.5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- torso -->
  <path d="M 100 75 L 145 75 L 142 155 L 102 155 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- swinging arm (back) wearing watch -->
  <path d="M 100 80 Q 80 100 78 130 L 90 132 Q 95 105 110 88 Z" fill="#e6b98a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- watch on wrist -->
  <rect x="76" y="124" width="18" height="14" rx="3" ry="3" fill="#4d4d4d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="80" y="127" width="10" height="8" fill="#3aa6a0" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- watch strap -->
  <line x1="78" y1="120" x2="78" y2="124" stroke="#000000" stroke-width="2"/>
  <line x1="92" y1="120" x2="92" y2="124" stroke="#000000" stroke-width="2"/>
  <line x1="78" y1="138" x2="78" y2="142" stroke="#000000" stroke-width="2"/>
  <line x1="92" y1="138" x2="92" y2="142" stroke="#000000" stroke-width="2"/>
  <!-- swinging arm (front) -->
  <path d="M 145 80 Q 162 100 160 130 L 148 132 Q 145 108 135 90 Z" fill="#e6b98a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="122" cy="50" r="22" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M 102 44 Q 102 25 122 25 Q 142 25 142 44 Q 135 36 122 36 Q 108 36 102 44 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- face -->
  <circle cx="116" cy="52" r="2" fill="#000000"/>
  <circle cx="128" cy="52" r="2" fill="#000000"/>
  <path d="M 116 60 Q 122 64 128 60" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- pedometer/large step counter device, right -->
  <rect x="185" y="60" width="90" height="105" rx="10" ry="10" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="193" y="72" width="74" height="80" rx="4" ry="4" fill="#dff3fd" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- step counter footprint icon -->
  <ellipse cx="210" cy="92" rx="7" ry="4" fill="#000000"/>
  <ellipse cx="215" cy="100" rx="4" ry="2.5" fill="#000000"/>
  <!-- digit segments suggesting big number -->
  <rect x="222" y="85" width="6" height="24" fill="#000000"/>
  <rect x="232" y="85" width="14" height="6" fill="#000000"/>
  <rect x="232" y="103" width="14" height="6" fill="#000000"/>
  <rect x="240" y="85" width="6" height="24" fill="#000000"/>
  <rect x="250" y="85" width="14" height="6" fill="#000000"/>
  <rect x="250" y="93" width="6" height="8" fill="#000000"/>
  <rect x="250" y="103" width="14" height="6" fill="#000000"/>
  <rect x="258" y="103" width="6" height="6" fill="#000000"/>
  <!-- progress bar -->
  <rect x="198" y="125" width="64" height="10" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="200" y="127" width="44" height="6" fill="#529929" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- shoe-print icon -->
  <ellipse cx="210" cy="148" rx="6" ry="3.5" fill="#529929" stroke="#000000" stroke-width="1.5"/>
  <ellipse cx="225" cy="148" rx="6" ry="3.5" fill="#529929" stroke="#000000" stroke-width="1.5"/>
  <ellipse cx="240" cy="148" rx="6" ry="3.5" fill="#529929" stroke="#000000" stroke-width="1.5"/>
</svg>
