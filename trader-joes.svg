  <line x1="220" y1="115" x2="215" y2="143" stroke="#7d5e23" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="115" x2="235" y2="143" stroke="#7d5e23" stroke-width="3" stroke-linecap="round"/>
  <!-- Tiki-style roof peak above awning -->
  <polygon points="145,55 200,90 90,90" fill="#9d7246" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Tiki roof thatching lines -->
  <line x1="110" y1="90" x2="135" y2="60" stroke="#7d5e23" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="90" x2="145" y2="57" stroke="#7d5e23" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="90" x2="155" y2="57" stroke="#7d5e23" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="90" x2="162" y2="63" stroke="#7d5e23" stroke-width="2" stroke-linecap="round"/>
  <line x1="188" y1="90" x2="175" y2="72" stroke="#7d5e23" stroke-width="2" stroke-linecap="round"/>
  <!-- Store sign panel -->
  <rect x="45" y="92" width="200" height="24" rx="4" fill="#d01424" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Front door -->
  <rect x="120" y="170" width="50" height="50" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="120" y="170" width="50" height="50" rx="3" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Door window -->
  <rect x="129" y="178" width="32" height="20" rx="2" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
