  <!-- Crate slats -->
  <line x1="48" y1="175" x2="90" y2="175" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="183" x2="90" y2="183" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="165" x2="62" y2="193" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="165" x2="76" y2="193" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Orange on crate -->
  <circle cx="69" cy="160" r="8" fill="#ff9900" stroke="#000000" stroke-width="3"/>
  <!-- Parrot emblem - right window area -->
  <!-- Parrot body -->
  <ellipse cx="221" cy="183" rx="16" ry="20" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Parrot head -->
  <circle cx="221" cy="163" r="12" fill="#529929" stroke="#000000" stroke-width="3"/>
