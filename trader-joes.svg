  <line x1="60" y1="115" x2="55" y2="143" stroke="#7d5e23" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="115" x2="75" y2="143" stroke="#7d5e23" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="115" x2="95" y2="143" stroke="#7d5e23" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="115" x2="115" y2="143" stroke="#7d5e23" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="115" x2="135" y2="143" stroke="#7d5e23" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="115" x2="155" y2="143" stroke="#7d5e23" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="115" x2="175" y2="143" stroke="#7d5e23" stroke-width="3" stroke-linecap="round"/>
