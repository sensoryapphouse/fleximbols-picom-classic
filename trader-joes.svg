  <circle cx="225" cy="161" r="3" fill="#000000"/>
  <circle cx="226" cy="160" r="1" fill="#ffffff"/>
  <!-- Parrot wing -->
  <ellipse cx="210" cy="183" rx="8" ry="13" fill="#137827" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Parrot tail feathers -->
  <line x1="221" y1="200" x2="215" y2="218" stroke="#f8130d" stroke-width="4" stroke-linecap="round"/>
  <line x1="221" y1="200" x2="221" y2="220" stroke="#f7de58" stroke-width="4" stroke-linecap="round"/>
  <line x1="221" y1="200" x2="228" y2="218" stroke="#2a4ec0" stroke-width="4" stroke-linecap="round"/>
  <!-- Ground line -->
  <rect x="20" y="218" width="250" height="8" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
