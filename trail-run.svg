  <path d="M0 180 Q40 184 80 178 Q120 174 160 180 Q200 184 240 178 Q270 174 290 180 L290 188 L0 188 Z" fill="#67832d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
