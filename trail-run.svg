  <path d="M134 68 Q140 72 146 68" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="136" y="72" width="8" height="6" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
