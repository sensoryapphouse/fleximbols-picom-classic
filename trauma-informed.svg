  <path d="M40 145 Q30 128 38 115" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Finger 2 left -->
  <path d="M68 98 Q60 82 70 72" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Middle finger top -->
  <path d="M120 58 Q118 42 128 36" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Finger 4 right -->
  <path d="M170 58 Q172 42 162 36" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Finger 5 right -->
  <path d="M222 98 Q230 82 220 72" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Thumb right -->
