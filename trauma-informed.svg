  <!-- Body -->
  <path d="M131 188 Q145 182 159 188 L162 218 L128 218 Z" fill="#3aa6a0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Arms -->
  <line x1="131" y1="198" x2="118" y2="212" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="159" y1="198" x2="172" y2="212" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="136" y1="218" x2="133" y2="235" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="154" y1="218" x2="157" y2="235" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- Small heart at chest -->
  <path d="M145 195 C145 195 138 189 138 185 C138 182 140.5 180 142.5 181 C143.5 181.5 145 183 145 183 C145 183 146.5 181.5 147.5 181 C149.5 180 152 182 152 185 C152 189 145 195 145 195 Z" fill="#f4a4b2" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Large sheltering hand arching overhead -->
  <!-- Palm base (wide arc at top) -->
  <path d="M40 145 Q80 55 145 45 Q210 55 250 145" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Hand/palm fill shape -->
  <path d="M40 145 Q80 55 145 45 Q210 55 250 145 L238 158 Q195 80 145 72 Q95 80 52 158 Z" fill="#f5e7c4" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Fingers (5 gentle arcs along the top of the arc) -->
