  <rect x="30" y="67" width="8" height="58" fill="#7f7f7f" stroke="#000000" stroke-width="2.5"/>
  <rect x="252" y="67" width="8" height="58" fill="#7f7f7f" stroke="#000000" stroke-width="2.5"/>
  <!-- Monitor on desk -->
  <rect x="180" y="20" width="60" height="35" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <rect x="184" y="24" width="52" height="27" fill="#90a7d6" stroke="#000000" stroke-width="2"/>
  <!-- Treadmill base (lower, in front of/below desk) -->
  <rect x="40" y="160" width="210" height="50" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Belt area (top of treadmill) -->
  <rect x="48" y="165" width="194" height="40" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- Belt lines -->
  <line x1="80" y1="165" x2="80" y2="205" stroke="#7f7f7f" stroke-width="1.5"/>
  <line x1="120" y1="165" x2="120" y2="205" stroke="#7f7f7f" stroke-width="1.5"/>
  <line x1="160" y1="165" x2="160" y2="205" stroke="#7f7f7f" stroke-width="1.5"/>
  <line x1="200" y1="165" x2="200" y2="205" stroke="#7f7f7f" stroke-width="1.5"/>
  <!-- Side rails -->
  <rect x="40" y="155" width="210" height="8" fill="#b8b8b8" stroke="#000000" stroke-width="2.5"/>
  <!-- Small console at front -->
  <rect x="115" y="140" width="60" height="20" fill="#7f7f7f" stroke="#000000" stroke-width="2.5"/>
  <rect x="120" y="145" width="20" height="10" fill="#529929" stroke="#000000" stroke-width="1.5"/>
  <!-- Person walking (full body) -->
  <!-- Head -->
  <circle cx="145" cy="80" r="12" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Hair -->
  <path d="M 134 76 Q 145 65 156 76 Q 156 70 145 68 Q 134 70 134 76 Z" fill="#000000" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Torso -->
  <rect x="132" y="92" width="26" height="38" fill="#d01424" stroke="#000000" stroke-width="3"/>
