  <path d="M 134 130 L 128 165 L 138 167 L 144 130 Z" fill="#392170" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 146 130 L 158 165 L 168 162 L 156 130 Z" fill="#392170" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="132" cy="170" rx="10" ry="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <ellipse cx="162" cy="167" rx="10" ry="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Wheels -->
