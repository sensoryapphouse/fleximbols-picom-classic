  <path d="M 132 98 L 115 105 L 118 112 L 138 105 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Arm back -->
  <path d="M 158 98 L 175 110 L 172 117 L 152 105 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Hands -->
  <circle cx="115" cy="108" r="4" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <circle cx="176" cy="113" r="4" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
