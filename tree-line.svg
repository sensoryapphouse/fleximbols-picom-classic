  <path d="M165 152 l-6 0 l3 -6 l-4 0 l4 -8 l-3 0 l5 -8 l5 8 l-3 0 l4 8 l-4 0 l3 6 Z" fill="#137827" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M230 152 l-6 0 l3 -6 l-4 0 l4 -8 l-3 0 l5 -8 l5 8 l-3 0 l4 8 l-4 0 l3 6 Z" fill="#137827" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- horizontal tree-line indicator (red dashed) -->
  <line x1="10" y1="125" x2="280" y2="125" stroke="#f8130d" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- FOREST zone below — dense full trees -->
  <rect x="10" y="155" width="270" height="70" fill="#137827" stroke="#000000" stroke-width="2.5"/>
