  <path d="M100 220 l-10 0 l5 -10 l-7 0 l6 -12 l-5 0 l7 -14 l-4 0 l8 -16 l8 16 l-4 0 l7 14 l-5 0 l6 12 l-7 0 l5 10 Z" fill="#67832d" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M165 220 l-10 0 l5 -10 l-7 0 l6 -12 l-5 0 l7 -14 l-4 0 l8 -16 l8 16 l-4 0 l7 14 l-5 0 l6 12 l-7 0 l5 10 Z" fill="#67832d" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M230 220 l-10 0 l5 -10 l-7 0 l6 -12 l-5 0 l7 -14 l-4 0 l8 -16 l8 16 l-4 0 l7 14 l-5 0 l6 12 l-7 0 l5 10 Z" fill="#67832d" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
