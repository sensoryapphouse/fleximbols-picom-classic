  <!-- sky -->
  <rect x="10" y="20" width="270" height="50" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <!-- BARE alpine zone (above tree line) — rocky/snowy -->
  <rect x="10" y="70" width="270" height="55" fill="#b8b8b8" stroke="#000000" stroke-width="2.5"/>
  <!-- snow patches in bare zone -->
  <ellipse cx="60" cy="100" rx="20" ry="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <ellipse cx="160" cy="115" rx="24" ry="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <ellipse cx="240" cy="98" rx="22" ry="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- a few rocks -->
  <path d="M30 120 l8 -6 l8 6 Z" fill="#7f7f7f" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M110 122 l10 -8 l8 8 Z" fill="#7f7f7f" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M200 120 l8 -8 l10 8 Z" fill="#7f7f7f" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- TRANSITION ZONE — sparse stunted trees -->
  <rect x="10" y="125" width="270" height="30" fill="#7d5e23" stroke="#000000" stroke-width="2.5"/>
  <!-- stunted small trees -->
  <path d="M40 152 l-6 0 l3 -6 l-4 0 l4 -8 l-3 0 l5 -8 l5 8 l-3 0 l4 8 l-4 0 l3 6 Z" fill="#137827" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
