  <rect x="132" y="158" width="11" height="50" rx="4" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="147" y="158" width="11" height="50" rx="4" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="137" cy="210" rx="8" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <ellipse cx="152" cy="210" rx="8" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- Torso -->
  <rect x="128" y="108" width="34" height="58" rx="6" fill="#7c3fac" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="145" cy="80" r="18" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- Long hair -->
  <path d="M126 80 Q126 60 145 58 Q164 60 164 80 L164 98 L158 95 Q155 70 145 70 Q135 70 132 95 L126 98 Z" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="140" cy="80" r="2.5" fill="#000000"/>
  <circle cx="150" cy="80" r="2.5" fill="#000000"/>
  <!-- Open singing mouth -->
  <ellipse cx="145" cy="92" rx="5" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- Microphone arm raised -->
  <path d="M128 116 L114 96 L108 78" fill="none" stroke="#e6b98a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mic body -->
  <ellipse cx="106" cy="74" rx="9" ry="9" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <line x1="98" y1="74" x2="114" y2="74" stroke="#000000" stroke-width="1.5"/>
  <rect x="100" y="82" width="12" height="8" rx="2" fill="#4d4d4d" stroke="#000000" stroke-width="2.5"/>
  <!-- Other arm down -->
  <path d="M162 116 L172 138 L170 150" fill="none" stroke="#e6b98a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- FIGURE 3 RIGHT: keyboard player -->
