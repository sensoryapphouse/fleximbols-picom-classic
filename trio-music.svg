  <rect x="232" y="158" width="11" height="50" rx="4" fill="#392170" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="247" y="158" width="11" height="50" rx="4" fill="#392170" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="237" cy="210" rx="8" ry="5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="252" cy="210" rx="8" ry="5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- Torso -->
  <rect x="228" y="108" width="34" height="58" rx="6" fill="#137827" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="245" cy="82" r="18" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Hair short -->
  <path d="M228 80 Q230 62 245 60 Q260 62 262 80 L259 78 Q254 68 245 68 Q236 68 231 78 Z" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="240" cy="82" r="2.5" fill="#000000"/>
  <circle cx="250" cy="82" r="2.5" fill="#000000"/>
  <!-- Smile -->
  <path d="M240 90 Q245 94 250 90" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arms -->
  <path d="M228 118 L214 140" fill="none" stroke="#eed5b6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M262 118 L276 140" fill="none" stroke="#eed5b6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Keyboard -->
  <rect x="200" y="140" width="88" height="14" rx="2" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <line x1="210" y1="140" x2="210" y2="154" stroke="#000000" stroke-width="1.5"/>
  <line x1="220" y1="140" x2="220" y2="154" stroke="#000000" stroke-width="1.5"/>
  <line x1="230" y1="140" x2="230" y2="154" stroke="#000000" stroke-width="1.5"/>
  <line x1="240" y1="140" x2="240" y2="154" stroke="#000000" stroke-width="1.5"/>
  <line x1="250" y1="140" x2="250" y2="154" stroke="#000000" stroke-width="1.5"/>
  <line x1="260" y1="140" x2="260" y2="154" stroke="#000000" stroke-width="1.5"/>
  <line x1="270" y1="140" x2="270" y2="154" stroke="#000000" stroke-width="1.5"/>
  <line x1="280" y1="140" x2="280" y2="154" stroke="#000000" stroke-width="1.5"/>
  <rect x="206" y="140" width="6" height="9" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <rect x="216" y="140" width="6" height="9" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <rect x="236" y="140" width="6" height="9" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <rect x="246" y="140" width="6" height="9" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <rect x="256" y="140" width="6" height="9" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <rect x="276" y="140" width="6" height="9" fill="#000000" stroke="#000000" stroke-width="1.5"/>

  <!-- Music notes floating above -->
  <ellipse cx="90" cy="36" rx="5" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <line x1="95" y1="34" x2="95" y2="18" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="195" cy="32" rx="5" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <line x1="200" y1="30" x2="200" y2="14" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 14 Q210 18 208 28" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
