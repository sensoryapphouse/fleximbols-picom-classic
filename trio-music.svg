  <!-- Three musicians: guitar player (L), singer with mic (C), keyboard player (R) - all full body -->

  <!-- FIGURE 1 LEFT: guitar player -->
  <!-- Legs -->
  <rect x="32" y="158" width="11" height="50" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="47" y="158" width="11" height="50" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="37" cy="210" rx="8" ry="5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="52" cy="210" rx="8" ry="5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- Torso -->
  <rect x="28" y="108" width="34" height="58" rx="6" fill="#d01424" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="45" cy="82" r="18" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Hair -->
  <path d="M28 80 Q30 64 45 62 Q60 64 62 80 L59 78 Q54 70 45 70 Q36 70 31 78 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
