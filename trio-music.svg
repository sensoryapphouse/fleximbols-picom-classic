  <circle cx="40" cy="82" r="2.5" fill="#000000"/>
  <circle cx="50" cy="82" r="2.5" fill="#000000"/>
  <!-- Smile -->
  <path d="M40 90 Q45 94 50 90" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Guitar body (acoustic) -->
  <ellipse cx="72" cy="148" rx="22" ry="28" fill="#9d7246" stroke="#000000" stroke-width="4"/>
  <circle cx="72" cy="148" r="7" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- Guitar neck -->
  <rect x="20" y="118" width="42" height="10" rx="2" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round" transform="rotate(-20 41 123)"/>
  <!-- Arms holding guitar -->
  <path d="M28 118 L24 140 L40 152" fill="none" stroke="#eed5b6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M62 118 L78 130 L78 148" fill="none" stroke="#eed5b6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- FIGURE 2 CENTER: singer with microphone -->
