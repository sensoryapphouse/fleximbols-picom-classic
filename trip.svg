  <!-- Ground line -->
  <line x1="20" y1="205" x2="270" y2="205" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Obstacle on ground (a rock/bump) -->
  <path d="M130,205 Q140,188 155,188 Q168,188 175,205 Z" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Figure pitching forward off-balance, arms flailing -->
  <!-- Head pitched forward/down -->
  <circle cx="195" cy="108" r="19" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Eyes (alarmed) -->
  <circle cx="189" cy="104" r="3.5" fill="#000000"/>
  <circle cx="202" cy="104" r="3.5" fill="#000000"/>
  <!-- Eyebrows raised in alarm -->
  <path d="M186,99 Q190,95 194,99" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M199,99 Q203,95 207,99" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Mouth open in shock -->
  <ellipse cx="195" cy="114" rx="5" ry="4" fill="#000000"/>
  <!-- Hair -->
  <path d="M178,100 Q194,90 212,100" stroke="#7d5e23" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Neck -->
  <line x1="193" y1="126" x2="185" y2="134" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <!-- Torso (pitched forward, diagonal) -->
  <path d="M150,135 Q170,128 188,135 Q192,150 183,165 Q160,170 145,162 Z" fill="#f8130d" stroke="#000000" stroke-width="5"/>
  <!-- Right arm flailing up/forward -->
  <line x1="186" y1="140" x2="218" y2="118" stroke="#eed5b6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="224" cy="114" r="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Left arm flailing up/back -->
  <line x1="152" y1="142" x2="122" y2="125" stroke="#eed5b6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="116" cy="121" r="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right leg — foot caught on obstacle -->
  <line x1="175" y1="163" x2="168" y2="185" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <line x1="168" y1="185" x2="160" y2="200" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <!-- Foot on/near obstacle -->
  <ellipse cx="155" cy="203" rx="14" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Left leg raised behind (tripped, catching) -->
  <line x1="155" y1="160" x2="133" y2="173" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <line x1="133" y1="173" x2="118" y2="190" stroke="#e6b98a" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="113" cy="195" rx="12" ry="5" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <!-- Motion lines showing forward pitch -->
  <line x1="220" y1="130" x2="235" y2="120" stroke="#f8130d" stroke-width="3" stroke-linecap="round"/>
  <line x1="223" y1="138" x2="240" y2="132" stroke="#f8130d" stroke-width="3" stroke-linecap="round"/>
  <line x1="224" y1="146" x2="240" y2="143" stroke="#f8130d" stroke-width="3" stroke-linecap="round"/>
</svg>
