  <!-- Trustworthy: firm two-hand handshake with shield + checkmark badge above -->
  <!-- === PERSON LEFT (reaching right) === -->
  <!-- Left head -->
  <circle cx="60" cy="72" r="26" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Left eyes -->
  <ellipse cx="51" cy="67" rx="4" ry="5" fill="#000000"/>
  <ellipse cx="69" cy="67" rx="4" ry="5" fill="#000000"/>
  <circle cx="53" cy="65" r="1.5" fill="#ffffff"/>
  <circle cx="71" cy="65" r="1.5" fill="#ffffff"/>
  <!-- Left eyebrows (confident) -->
  <path d="M45 60 Q51 56 57 59" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M63 59 Q69 56 75 60" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Left smile (firm, trustworthy) -->
  <path d="M50 78 Q60 86 70 78" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
