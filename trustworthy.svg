  <path d="M198 108 Q204 99 222 100 L238 100 Q256 99 262 108 L268 192 L192 192 Z" fill="#1d0e82" stroke="#000000" stroke-width="5"/>
  <!-- Suit lapels right -->
  <path d="M222 100 L230 116 L238 100 L232 100 L230 112 L228 100 Z" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Right arm (inner, extended for handshake) -->
  <path d="M199 112 Q172 118 154 130" fill="none" stroke="#e6b98a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M199 112 Q172 118 154 130" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm (outer) -->
  <path d="M261 112 Q276 126 278 150" fill="none" stroke="#e6b98a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M261 112 Q276 126 278 150" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="279" cy="158" rx="10" ry="9" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- Right legs -->
  <rect x="208" y="190" width="18" height="40" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <rect x="230" y="190" width="18" height="40" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <ellipse cx="217" cy="231" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="239" cy="231" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- === SHIELD + CHECKMARK BADGE (top center) === -->
  <!-- Shield body -->
  <path d="M130 8 L160 8 L165 12 L165 42 Q165 58 145 66 Q125 58 125 42 L125 12 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shield inner border -->
  <path d="M134 14 L156 14 L160 18 L160 42 Q160 54 145 60 Q130 54 130 42 L130 18 Z" fill="#1d0e82" stroke="none"/>
