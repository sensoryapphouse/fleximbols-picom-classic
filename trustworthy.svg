  <ellipse cx="11" cy="158" rx="10" ry="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left legs -->
  <rect x="38" y="190" width="18" height="40" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <rect x="60" y="190" width="18" height="40" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
