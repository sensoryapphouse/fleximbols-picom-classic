  <path d="M52 100 L60 116 L68 100 L62 100 L60 112 L58 100 Z" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Left arm (inner, extended for handshake) -->
  <path d="M91 112 Q118 118 136 130" fill="none" stroke="#eed5b6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M91 112 Q118 118 136 130" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
