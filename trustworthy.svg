  <ellipse cx="69" cy="231" rx="14" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <!-- === FIRM HANDSHAKE (center) === -->
  <!-- Combined grip -->
  <rect x="122" y="126" width="46" height="28" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Top hand (person left) details -->
  <line x1="126" y1="126" x2="124" y2="116" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="133" y1="124" x2="132" y2="114" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="123" x2="140" y2="113" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="147" y1="124" x2="148" y2="114" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="154" y1="126" x2="157" y2="116" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Bottom hand (person right) details -->
  <line x1="126" y1="154" x2="124" y2="164" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="133" y1="156" x2="132" y2="166" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="157" x2="140" y2="167" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="147" y1="156" x2="148" y2="166" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="154" y1="154" x2="157" y2="164" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- === PERSON RIGHT (reaching left) === -->
  <!-- Right head -->
  <circle cx="230" cy="72" r="26" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Right eyes -->
  <ellipse cx="221" cy="67" rx="4" ry="5" fill="#000000"/>
  <ellipse cx="239" cy="67" rx="4" ry="5" fill="#000000"/>
