  <path d="M95,120 Q100,60 155,55 Q210,50 220,110" stroke="#b8b8b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="8,6"/>
  <!-- Arrow on arc -->
  <polygon points="220,110 228,100 215,100" fill="#b8b8b8"/>
  <!-- Figure INVERTED mid-somersault (upside down in the air) -->
  <!-- Head (at bottom, inverted) -->
  <circle cx="155" cy="182" r="19" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Eyes (upside down view, hair hanging down) -->
  <circle cx="148" cy="178" r="3" fill="#000000"/>
  <circle cx="162" cy="178" r="3" fill="#000000"/>
  <!-- Hair hanging down (inverted) -->
  <path d="M140,188 Q155,198 170,188" stroke="#7d5e23" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Neck (going up from inverted head) -->
  <line x1="155" y1="164" x2="155" y2="155" stroke="#eed5b6" stroke-width="8" stroke-linecap="round"/>
  <!-- Torso (inverted, going upward) -->
  <path d="M135,120 Q155,115 175,120 L178,155 Q155,162 132,155 Z" fill="#2a4ec0" stroke="#000000" stroke-width="5"/>
  <!-- Arms wide (out to sides, inverted) -->
  <line x1="135" y1="128" x2="105" y2="118" stroke="#eed5b6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="99" cy="115" r="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
