  <!-- thin mat with a bolster pillow at top edge, baby lying tummy-down -->
  <!-- mat (flat rectangle, slightly perspective) -->
  <path d="M 40 130 L 250 130 L 260 215 L 30 215 Z" fill="#90a7d6" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- mat pattern -->
  <circle cx="80" cy="180" r="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="210" cy="180" r="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <path d="M 130 195 L 145 175 L 160 195 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- bolster pillow at top edge of mat -->
  <rect x="40" y="105" width="210" height="35" rx="17" fill="#ff9900" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- bolster end caps -->
  <ellipse cx="40" cy="122" rx="6" ry="17" fill="#e65a00" stroke="#000000" stroke-width="3"/>
  <ellipse cx="250" cy="122" rx="6" ry="17" fill="#e65a00" stroke="#000000" stroke-width="3"/>
  <!-- bolster stitch detail -->
  <line x1="60" y1="115" x2="60" y2="130" stroke="#000000" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="230" y1="115" x2="230" y2="130" stroke="#000000" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- baby lying tummy-down on bolster, head up -->
  <!-- head -->
  <circle cx="145" cy="80" r="22" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair tuft -->
  <path d="M 130 64 Q 145 55 160 64" fill="#7d5e23" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- eyes (looking forward) -->
  <circle cx="138" cy="80" r="2.5" fill="#000000"/>
  <circle cx="152" cy="80" r="2.5" fill="#000000"/>
  <!-- smile -->
  <path d="M 138 90 Q 145 95 152 90" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- body (torso draped over bolster, partially visible) -->
  <path d="M 125 100 Q 145 115 165 100 L 175 140 L 115 140 Z" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arms forward -->
  <path d="M 122 105 Q 105 115 100 130" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 168 105 Q 185 115 190 130" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="130" r="6" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <circle cx="190" cy="130" r="6" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
</svg>
