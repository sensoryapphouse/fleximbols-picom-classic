  <!-- Ghost figure facing away (back view, left side) -->
  <!-- Ghost head -->
  <circle cx="72" cy="52" r="18" fill="#b8b8b8" stroke="#7f7f7f" stroke-width="3" stroke-linejoin="round"/>
  <!-- Ghost torso -->
  <rect x="56" y="72" width="32" height="44" rx="5" fill="#b8b8b8" stroke="#7f7f7f" stroke-width="3" stroke-linejoin="round"/>
  <!-- Ghost left arm -->
  <line x1="56" y1="80" x2="38" y2="108" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>
  <!-- Ghost right arm -->
  <line x1="88" y1="80" x2="106" y2="108" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>
  <!-- Ghost left leg -->
  <line x1="66" y1="116" x2="58" y2="155" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>
  <!-- Ghost right leg -->
  <line x1="78" y1="116" x2="86" y2="155" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>

  <!-- Main figure facing forward (right side) -->
  <!-- Head -->
  <circle cx="218" cy="50" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="211" cy="47" r="3" fill="#000000"/>
  <circle cx="225" cy="47" r="3" fill="#000000"/>
  <!-- Mouth -->
  <path d="M211 57 Q218 63 225 57" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Torso -->
  <rect x="200" y="72" width="36" height="48" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm -->
  <line x1="200" y1="80" x2="180" y2="112" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="180" cy="114" r="7" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right arm -->
  <line x1="236" y1="80" x2="256" y2="112" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="114" r="7" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left leg -->
  <rect x="202" y="120" width="14" height="50" rx="5" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="220" y="120" width="14" height="50" rx="5" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="209" cy="172" rx="12" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>
  <ellipse cx="227" cy="172" rx="12" ry="7" fill="#000000" stroke="#000000" stroke-width="3"/>

  <!-- U-turn curved arrow sweeping from ghost to main figure -->
  <path d="M72 185 Q145 230 218 185" fill="none" stroke="#f8130d" stroke-width="5" stroke-linecap="round"/>
  <!-- Arrowhead at end of curve (pointing up-left toward figure) -->
  <polygon points="218,185 204,180 212,170" fill="#f8130d" stroke="#f8130d" stroke-width="2" stroke-linejoin="round"/>
  <!-- 180° rotation arc above figures -->
  <path d="M80 30 Q145 -10 210 30" fill="none" stroke="#f8130d" stroke-width="5" stroke-linecap="round" stroke-dasharray="8,5"/>
  <polygon points="210,30 220,16 224,32" fill="#f8130d" stroke="#f8130d" stroke-width="2" stroke-linejoin="round"/>
</svg>
