  <!-- Tween: short pre-teen, proportional but smaller than adult, backpack cue -->

  <!-- BACKPACK (behind figure, drawn first) -->
  <rect x="158" y="110" width="28" height="36" rx="6" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- backpack top flap -->
  <rect x="160" y="106" width="24" height="10" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- backpack strap loop -->
  <path d="M161,114 Q155,118 157,128" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Head (medium, proportionate child) -->
  <circle cx="145" cy="75" r="26" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hair -->
  <path d="M119,70 Q122,52 145,50 Q168,52 171,70" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="136" cy="74" r="3.5" fill="#000000"/>
  <circle cx="154" cy="74" r="3.5" fill="#000000"/>
  <!-- Smile -->
  <path d="M136,83 Q145,90 154,83" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Torso (shorter than adult) -->
  <rect x="126" y="101" width="36" height="46" rx="6" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Arms -->
  <line x1="126" y1="110" x2="107" y2="130" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>
  <line x1="162" y1="110" x2="175" y2="128" stroke="#eed5b6" stroke-width="10" stroke-linecap="round"/>

  <!-- Legs (shorter than adult proportionally) -->
  <rect x="127" y="145" width="14" height="52" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="147" y="145" width="14" height="52" rx="6" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Trainers / shoes -->
  <ellipse cx="134" cy="197" rx="13" ry="7" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="154" cy="197" rx="13" ry="7" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shoe stripe detail -->
  <line x1="124" y1="197" x2="143" y2="194" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="144" y1="197" x2="163" y2="194" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
