<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Twister: mat with 4 colour circles + spinner with arrow -->
  <!-- mat -->
  <rect x="20" y="40" width="180" height="180" rx="8" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- 4 rows of 4 dots, classic R/Y/B/G order -->
  <!-- row 1: red -->
  <circle cx="50" cy="70" r="14" fill="#f8130d" stroke="#000000" stroke-width="2.5"/>
  <circle cx="90" cy="70" r="14" fill="#f8130d" stroke="#000000" stroke-width="2.5"/>
  <circle cx="130" cy="70" r="14" fill="#f8130d" stroke="#000000" stroke-width="2.5"/>
  <circle cx="170" cy="70" r="14" fill="#f8130d" stroke="#000000" stroke-width="2.5"/>
  <!-- row 2: yellow -->
  <circle cx="50" cy="110" r="14" fill="#fff200" stroke="#000000" stroke-width="2.5"/>
  <circle cx="90" cy="110" r="14" fill="#fff200" stroke="#000000" stroke-width="2.5"/>
  <circle cx="130" cy="110" r="14" fill="#fff200" stroke="#000000" stroke-width="2.5"/>
  <circle cx="170" cy="110" r="14" fill="#fff200" stroke="#000000" stroke-width="2.5"/>
  <!-- row 3: blue -->
  <circle cx="50" cy="150" r="14" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
  <circle cx="90" cy="150" r="14" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
  <circle cx="130" cy="150" r="14" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
  <circle cx="170" cy="150" r="14" fill="#2a4ec0" stroke="#000000" stroke-width="2.5"/>
  <!-- row 4: green -->
  <circle cx="50" cy="190" r="14" fill="#137827" stroke="#000000" stroke-width="2.5"/>
  <circle cx="90" cy="190" r="14" fill="#137827" stroke="#000000" stroke-width="2.5"/>
  <circle cx="130" cy="190" r="14" fill="#137827" stroke="#000000" stroke-width="2.5"/>
  <circle cx="170" cy="190" r="14" fill="#137827" stroke="#000000" stroke-width="2.5"/>
  <!-- spinner (square card) overlapping right side -->
  <rect x="205" y="80" width="80" height="100" rx="6" fill="#f5e7c4" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- spinner disc -->
  <circle cx="245" cy="130" r="32" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- quadrants of spinner -->
  <path d="M 245 130 L 245 98 A 32 32 0 0 1 277 130 Z" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <path d="M 245 130 L 277 130 A 32 32 0 0 1 245 162 Z" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <path d="M 245 130 L 245 162 A 32 32 0 0 1 213 130 Z" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <path d="M 245 130 L 213 130 A 32 32 0 0 1 245 98 Z" fill="#137827" stroke="#000000" stroke-width="2"/>
  <!-- arrow -->
  <path d="M 245 130 L 268 115 L 263 122 L 270 128 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="245" cy="130" r="4" fill="#000000"/>
</svg>
