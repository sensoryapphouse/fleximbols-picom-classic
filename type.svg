  <!-- Two hands over a keyboard with motion tap indicators -->

  <!-- Keyboard body -->
  <rect x="20" y="140" width="250" height="75" rx="10" fill="#efefef" stroke="#000000" stroke-width="5"/>
  <!-- Keyboard top bar (function row) -->
  <rect x="28" y="150" width="234" height="14" rx="4" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>

  <!-- Key rows -->
  <!-- Row 1 -->
  <rect x="28" y="170" width="22" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="54" y="170" width="22" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="80" y="170" width="22" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="106" y="170" width="22" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="132" y="170" width="22" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="158" y="170" width="22" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="184" y="170" width="22" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="210" y="170" width="40" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Row 2 -->
  <rect x="28" y="190" width="34" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="66" y="190" width="22" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="92" y="190" width="22" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="118" y="190" width="22" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="144" y="190" width="22" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="170" y="190" width="22" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="196" y="190" width="54" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Space bar row (bottom) -->
  <rect x="70" y="208" width="150" height="0" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Left hand over keyboard, index finger pressing a key -->
  <!-- Left palm/hand -->
  <ellipse cx="90" cy="108" rx="28" ry="20" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Left thumb -->
  <path d="M 64 112 Q 54 108 52 98 Q 54 90 62 94 L 68 104 Z" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- Left fingers -->
  <rect x="70" y="78" width="12" height="34" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <rect x="86" y="72" width="12" height="38" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <rect x="102" y="76" width="12" height="35" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <rect x="116" y="82" width="10" height="30" rx="5" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- Index finger pressing down (lower) -->
  <rect x="86" y="108" width="12" height="26" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>

  <!-- Motion tap dots on left key being pressed -->
  <circle cx="82" cy="168" r="4" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <circle cx="92" cy="165" r="4" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <circle cx="102" cy="168" r="4" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>

  <!-- Right hand over keyboard -->
  <ellipse cx="202" cy="108" rx="28" ry="20" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Right thumb -->
  <path d="M 228 112 Q 238 108 240 98 Q 238 90 230 94 L 224 104 Z" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- Right fingers -->
  <rect x="210" y="82" width="10" height="30" rx="5" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <rect x="184" y="76" width="12" height="35" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <rect x="194" y="72" width="12" height="38" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="4"/>
  <!-- Index finger pressing down (right) -->
  <rect x="194" y="108" width="12" height="26" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>

  <!-- Motion tap dots on right key being pressed -->
  <circle cx="190" cy="168" r="4" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <circle cx="200" cy="165" r="4" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>
  <circle cx="210" cy="168" r="4" fill="#2a4ec0" stroke="#000000" stroke-width="2"/>

  <!-- Small motion arcs on pressing fingers (tap cues) -->
  <path d="M 80 136 Q 92 130 104 136" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 188 136 Q 200 130 212 136" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
