  <!-- Tzatziki: small bowl of thick white yogurt dip with cucumber shreds, dill sprig, olive oil drizzle -->
  <!-- Bowl outer -->
  <path d="M40,130 Q40,220 145,220 Q250,220 250,130 Z" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Bowl rim (top ellipse) -->
  <ellipse cx="145" cy="130" rx="105" ry="28" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="145" cy="130" rx="95" ry="22" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Yogurt surface (white, slightly raised) -->
  <ellipse cx="145" cy="128" rx="90" ry="20" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Thick yogurt texture - slight shadow ring -->
  <ellipse cx="145" cy="128" rx="80" ry="16" fill="#efefef" stroke="#000000" stroke-width="2"/>
  <ellipse cx="145" cy="127" rx="70" ry="13" fill="#ffffff" stroke="none"/>
  <!-- Cucumber shreds (green strips scattered on surface) -->
  <rect x="105" y="120" width="28" height="8" rx="4" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round" transform="rotate(-20,119,124)"/>
  <rect x="148" y="118" width="30" height="7" rx="3" fill="#67832d" stroke="#000000" stroke-width="3" stroke-linejoin="round" transform="rotate(15,163,121)"/>
  <rect x="125" y="128" width="22" height="6" rx="3" fill="#529929" stroke="#000000" stroke-width="2" transform="rotate(-8,136,131)"/>
  <rect x="160" y="124" width="24" height="6" rx="3" fill="#529929" stroke="#000000" stroke-width="2" transform="rotate(25,172,127)"/>
  <!-- Olive oil drizzle (golden puddle) -->
  <ellipse cx="120" cy="130" rx="20" ry="8" fill="#ff9900" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Oil sheen -->
  <ellipse cx="120" cy="128" rx="12" ry="4" fill="#f7de58" stroke="none"/>
  <!-- Dill sprig (feathery green) -->
  <!-- Main stem -->
  <line x1="165" y1="145" x2="165" y2="108" stroke="#529929" stroke-width="3" stroke-linecap="round"/>
  <!-- Dill fronds left -->
  <line x1="165" y1="138" x2="155" y2="128" stroke="#67832d" stroke-width="2" stroke-linecap="round"/>
  <line x1="165" y1="128" x2="155" y2="118" stroke="#67832d" stroke-width="2" stroke-linecap="round"/>
  <line x1="165" y1="120" x2="157" y2="112" stroke="#67832d" stroke-width="2" stroke-linecap="round"/>
  <!-- Dill fronds right -->
  <line x1="165" y1="135" x2="175" y2="126" stroke="#67832d" stroke-width="2" stroke-linecap="round"/>
  <line x1="165" y1="126" x2="174" y2="117" stroke="#67832d" stroke-width="2" stroke-linecap="round"/>
  <line x1="165" y1="118" x2="173" y2="110" stroke="#67832d" stroke-width="2" stroke-linecap="round"/>
</svg>
