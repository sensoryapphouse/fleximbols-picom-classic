<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Single high overhead wing -->
  <polygon points="20,108 145,96 270,108 145,115" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Wing strut left to frame -->
  <line x1="80" y1="110" x2="118" y2="148" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Wing strut right to frame -->
  <line x1="210" y1="110" x2="175" y2="148" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Center wing mount post -->
  <line x1="145" y1="114" x2="145" y2="148" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Open tubular frame - main boom (horizontal) -->
  <line x1="60" y1="155" x2="260" y2="155" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Seat back (vertical) -->
  <line x1="130" y1="148" x2="130" y2="178" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Seat base -->
  <line x1="118" y1="178" x2="148" y2="178" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Seat front leg -->
  <line x1="148" y1="178" x2="148" y2="192" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Front wheel strut -->
  <line x1="85" y1="155" x2="85" y2="192" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Rear wheel strut -->
  <line x1="175" y1="155" x2="175" y2="192" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Front wheel -->
  <circle cx="85" cy="196" r="8" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Rear wheel -->
  <circle cx="175" cy="196" r="8" fill="#4d4d4d" stroke="#000000" stroke-width="4"/>
  <!-- Pusher propeller (rear, vertical) -->
  <ellipse cx="255" cy="148" rx="6" ry="24" fill="#9d7246" stroke="#000000" stroke-width="4"/>
  <!-- Prop hub -->
  <circle cx="255" cy="155" r="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Engine mount behind seat area -->
  <rect x="230" y="148" width="24" height="14" rx="4" fill="#7f7f7f" stroke="#000000" stroke-width="4"/>
  <!-- Pilot figure (simple bust) -->
  <circle cx="130" cy="138" r="11" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Pilot body in seat -->
  <rect x="120" y="149" width="20" height="18" rx="3" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <!-- Tail boom extension -->
  <line x1="230" y1="155" x2="265" y2="155" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Small tail fin -->
  <polygon points="255,155 265,130 272,155" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Small horizontal stabiliser -->
  <line x1="255" y1="138" x2="240" y2="138" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
