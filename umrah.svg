<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- sky -->
  <rect x="0" y="0" width="290" height="180" fill="#dff3fd" stroke="#000000" stroke-width="2"/>
  <!-- ground -->
  <rect x="0" y="180" width="290" height="60" fill="#eed5b6" stroke="#000000" stroke-width="2"/>
  <!-- sun -->
  <circle cx="250" cy="40" r="14" fill="#fff200" stroke="#000000" stroke-width="3"/>
  <!-- Kaaba (behind, smaller than hajj) -->
  <rect x="160" y="100" width="60" height="70" fill="#000000" stroke="#4d4d4d" stroke-width="2"/>
  <!-- gold band -->
  <rect x="160" y="118" width="60" height="8" fill="#f2e40d" stroke="#000000" stroke-width="2"/>
  <!-- door -->
  <rect x="183" y="138" width="14" height="32" fill="#f2e40d" stroke="#000000" stroke-width="2"/>
  <!-- minaret behind Kaaba -->
  <rect x="232" y="120" width="10" height="60" fill="#efefef" stroke="#000000" stroke-width="2"/>
  <path d="M230 120 L244 120 L242 112 L232 112 Z" fill="#67832d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M234 112 L240 112 L237 104 Z" fill="#efefef" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- single pilgrim FULL BODY in white ihram (foreground left, larger) -->
  <!-- head -->
  <circle cx="80" cy="105" r="13" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <!-- hair short -->
  <path d="M68 102 L92 102 L90 92 L70 92 Z" fill="#4d4d4d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- ihram top cloth draped (one shoulder) -->
  <path d="M62 122 L100 122 L98 130 L60 130 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- diagonal drape line -->
  <line x1="62" y1="125" x2="100" y2="138" stroke="#000000" stroke-width="2"/>
  <!-- torso/skin (right shoulder bare) -->
  <rect x="68" y="125" width="24" height="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- right shoulder skin patch -->
  <path d="M92 122 L100 122 L100 132 L92 130 Z" fill="#e6b98a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- arms -->
  <line x1="68" y1="135" x2="58" y2="160" stroke="#e6b98a" stroke-width="6" stroke-linecap="round"/>
  <line x1="68" y1="135" x2="58" y2="160" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none"/>
  <line x1="92" y1="135" x2="102" y2="160" stroke="#e6b98a" stroke-width="6" stroke-linecap="round"/>
  <line x1="92" y1="135" x2="102" y2="160" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- ihram bottom (wrap skirt) -->
  <path d="M62 145 L100 145 L104 200 L58 200 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- wrap fold lines -->
  <line x1="75" y1="150" x2="75" y2="198" stroke="#b8b8b8" stroke-width="2"/>
  <line x1="88" y1="150" x2="88" y2="198" stroke="#b8b8b8" stroke-width="2"/>
  <!-- legs (lower visible) -->
  <rect x="66" y="200" width="10" height="22" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <rect x="86" y="200" width="10" height="22" fill="#e6b98a" stroke="#000000" stroke-width="2"/>
  <!-- sandals -->
  <ellipse cx="71" cy="226" rx="7" ry="3" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <ellipse cx="91" cy="226" rx="7" ry="3" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
</svg>
