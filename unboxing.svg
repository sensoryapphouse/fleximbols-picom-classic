  <!-- person FULL BODY behind/beside open box -->
  <!-- head -->
  <circle cx="60" cy="50" r="18" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M 44 45 Q 60 28 76 45 L 76 40 Q 60 25 44 40 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="54" cy="50" r="1.8" fill="#000000"/>
  <circle cx="66" cy="50" r="1.8" fill="#000000"/>
  <!-- smile -->
  <path d="M 53 58 Q 60 64 67 58" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- torso -->
  <path d="M 42 70 L 42 130 L 78 130 L 78 70 Z" fill="#3aa6a0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- left arm reaching into box -->
  <path d="M 42 78 L 30 100 L 38 130 L 50 128" fill="#3aa6a0" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right arm reaching forward to box -->
  <path d="M 78 78 L 100 95 L 130 110" fill="none" stroke="#3aa6a0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 78 78 L 100 95 L 130 110" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- hands -->
  <circle cx="30" cy="128" r="6" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <circle cx="132" cy="112" r="6" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <!-- legs -->
  <rect x="44" y="130" width="14" height="60" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="62" y="130" width="14" height="60" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- feet -->
  <ellipse cx="50" cy="195" rx="9" ry="5" fill="#000000"/>
  <ellipse cx="69" cy="195" rx="9" ry="5" fill="#000000"/>
  <!-- open box - flaps splayed -->
  <path d="M 130 145 L 230 145 L 230 210 L 130 210 Z" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- back flap open -->
  <path d="M 130 145 L 125 100 L 235 100 L 230 145 Z" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- left flap -->
  <path d="M 130 145 L 108 130 L 108 195 L 130 210 Z" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- right flap -->
  <path d="M 230 145 L 252 130 L 252 195 L 230 210 Z" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- product revealed inside -->
  <rect x="160" y="115" width="50" height="50" fill="#f8130d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 160 115 L 210 115 L 210 165 L 160 165 Z" fill="#f8130d" stroke="#000000" stroke-width="3"/>
  <!-- ribbon on product -->
  <rect x="180" y="115" width="10" height="50" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <rect x="160" y="135" width="50" height="10" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <!-- sparkles around reveal -->
  <path d="M 145 90 L 148 100 L 158 103 L 148 106 L 145 116 L 142 106 L 132 103 L 142 100 Z" fill="#fff200" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 240 80 L 243 87 L 250 90 L 243 93 L 240 100 L 237 93 L 230 90 L 237 87 Z" fill="#fff200" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 265 165 L 267 171 L 273 173 L 267 175 L 265 181 L 263 175 L 257 173 L 263 171 Z" fill="#fff200" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- camera (filming the unboxing) top right -->
  <rect x="245" y="30" width="35" height="22" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="262" cy="41" r="6" fill="#1d0e82" stroke="#000000" stroke-width="2"/>
  <circle cx="262" cy="41" r="2.5" fill="#ffffff"/>
  <!-- record dot -->
  <circle cx="275" cy="35" r="2.5" fill="#f8130d"/>
</svg>
