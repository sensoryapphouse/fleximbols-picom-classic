  <!-- UNCLE PATERNAL FULL BODY + family tree branch from father's side + labelled tree -->
  <!-- ground -->
  <ellipse cx="80" cy="228" rx="60" ry="5" fill="#9d7246" stroke="#000000" stroke-width="2"/>

  <!-- FAMILY TREE on right -->
  <rect x="218" y="120" width="14" height="100" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>
  <ellipse cx="225" cy="100" rx="50" ry="40" fill="#67832d" stroke="#000000" stroke-width="3.5"/>
  <!-- father box (blue, father's side) -->
  <rect x="178" y="78" width="46" height="20" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <!-- "F" -->
  <path d="M184 94 L184 82 L196 82 M184 88 L194 88" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- uncle box -->
  <rect x="178" y="130" width="46" height="20" fill="#90a7d6" stroke="#000000" stroke-width="3"/>
  <!-- "U" -->
  <path d="M184 132 L184 144 Q184 148 190 148 Q196 148 196 144 L196 132" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- sibling link line -->
  <path d="M201 98 L201 130" fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M224 88 L218 105" fill="none" stroke="#000000" stroke-width="3"/>

  <!-- UNCLE FIGURE FULL BODY (left, male) -->
  <!-- trouser legs -->
  <path d="M62 144 L58 220 L76 220 L76 144 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M84 144 L84 220 L102 220 L98 144 Z" fill="#4d4d4d" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- shoes -->
  <ellipse cx="67" cy="222" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="93" cy="222" rx="9" ry="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- belt -->
  <rect x="50" y="140" width="60" height="6" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- shirt (orange to distinguish from maternal uncle's teal) -->
  <path d="M50 86 L48 144 L112 144 L110 86 Q80 78 50 86 Z" fill="#e65a00" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- collar -->
  <path d="M70 86 L80 96 L90 86" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- neck -->
  <rect x="74" y="70" width="12" height="14" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="80" cy="54" rx="18" ry="18" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- hair (different shade, lighter brown / blond mix) -->
  <path d="M64 52 Q64 32 80 30 Q96 32 96 52 Q92 42 80 40 Q68 42 64 52 Z" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="74" cy="56" r="2" fill="#000000"/>
  <circle cx="86" cy="56" r="2" fill="#000000"/>
  <!-- smile -->
  <path d="M73 64 Q80 69 87 64" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round"/>
  <!-- beard (distinct from maternal uncle's mustache) -->
  <path d="M68 60 Q70 76 80 78 Q90 76 92 60 Q90 70 80 72 Q70 70 68 60 Z" fill="#7d5e23" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- arm pointing at tree -->
  <path d="M112 96 L160 118 L156 126 L108 110 Z" fill="#e65a00" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="160" cy="122" r="6" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <path d="M163 122 L178 130" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- other arm -->
  <path d="M48 96 L36 144 L46 148 L58 110 Z" fill="#e65a00" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
</svg>
