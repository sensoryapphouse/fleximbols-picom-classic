  <!-- Shoulders -->
  <path d="M58,240 L58,188 Q78,170 105,164 L145,160 L185,164 Q212,170 232,188 L232,240 Z" fill="#e6b98a" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
