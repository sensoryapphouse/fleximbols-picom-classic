  <!-- Hair -->
  <path d="M90,100 Q89,64 102,52 Q116,40 145,38 Q174,40 188,52 Q201,64 200,100 Q194,76 178,66 Q162,58 145,58 Q128,58 112,66 Q96,76 90,100 Z" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left eye - normal open -->
  <ellipse cx="120" cy="107" rx="11" ry="11" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="120" cy="108" rx="6" ry="6" fill="#4d4d4d" stroke="none"/>
  <ellipse cx="122" cy="106" rx="2.5" ry="2.5" fill="#ffffff" stroke="none"/>
  <!-- Right eye - slightly raised (asymmetric unease) -->
  <ellipse cx="170" cy="105" rx="11" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="170" cy="106" rx="6" ry="6" fill="#4d4d4d" stroke="none"/>
  <ellipse cx="172" cy="104" rx="2.5" ry="2.5" fill="#ffffff" stroke="none"/>
