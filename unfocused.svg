  <!-- Bust: neck + shoulders -->
  <rect x="95" y="182" width="100" height="46" rx="8" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shirt -->
  <path d="M95 194 Q145 212 195 194" fill="#b8b8b8" stroke="#000000" stroke-width="4"/>
  <!-- Neck -->
  <rect x="128" y="165" width="34" height="24" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head — soft fuzzy double-outline (blur effect via offset outlines) -->
  <!-- Outer blur ghost 1 -->
  <ellipse cx="148" cy="116" rx="55" ry="59" fill="none" stroke="#b8b8b8" stroke-width="4"/>
  <!-- Outer blur ghost 2 -->
  <ellipse cx="142" cy="112" rx="55" ry="59" fill="none" stroke="#b8b8b8" stroke-width="3"/>
  <!-- Main head -->
  <ellipse cx="145" cy="114" rx="52" ry="56" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <path d="M95 104 Q94 66 118 56 Q145 46 172 56 Q196 66 195 104" fill="#9d7246" stroke="#000000" stroke-width="4"/>
  <!-- Eyebrows: soft, relaxed, drooping slightly -->
  <path d="M108 98 Q122 96 136 98" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M154 98 Q168 96 182 98" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes: blurry unfocused — doubled/ghosted circles suggesting blur -->
  <!-- Left eye blurry double ghost -->
  <ellipse cx="124" cy="113" rx="15" ry="11" fill="none" stroke="#b8b8b8" stroke-width="3"/>
  <ellipse cx="120" cy="113" rx="15" ry="11" fill="none" stroke="#b8b8b8" stroke-width="2"/>
  <!-- Left eye main -->
  <ellipse cx="122" cy="113" rx="14" ry="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Pupil slightly off-center/unfocused (dilated, vacant) -->
  <ellipse cx="122" cy="113" rx="9" ry="9" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <ellipse cx="120" cy="111" rx="3" ry="3" fill="#ffffff"/>
  <!-- Right eye blurry double ghost -->
  <ellipse cx="170" cy="113" rx="15" ry="11" fill="none" stroke="#b8b8b8" stroke-width="3"/>
  <ellipse cx="166" cy="113" rx="15" ry="11" fill="none" stroke="#b8b8b8" stroke-width="2"/>
  <!-- Right eye main -->
  <ellipse cx="168" cy="113" rx="14" ry="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Pupil slightly off-center/unfocused (dilated, vacant) -->
  <ellipse cx="168" cy="113" rx="9" ry="9" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <ellipse cx="166" cy="111" rx="3" ry="3" fill="#ffffff"/>
  <!-- Mouth: slightly slack, absent -->
  <path d="M130 150 Q145 153 160 150" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Fuzzy haze lines around head -->
  <path d="M80 80 Q74 74 80 68" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M76 114 Q68 114 72 106" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M210 80 Q216 74 210 68" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M214 114 Q222 114 218 106" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Blur squiggles above head -->
  <path d="M120 52 Q126 46 132 52 Q138 58 144 52" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M150 52 Q156 46 162 52 Q168 58 174 52" fill="none" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
</svg>
