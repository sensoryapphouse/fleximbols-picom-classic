  <!-- Neck -->
  <rect x="125" y="150" width="40" height="28" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Shoulders / bust -->
  <path d="M60 240 Q60 195 95 188 L145 180 L195 188 Q230 195 230 240 Z" fill="#4d4d4d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head - slightly turned away (looking to side) -->
  <ellipse cx="145" cy="108" rx="62" ry="66" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="145" cy="57" rx="62" ry="24" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <rect x="83" y="49" width="124" height="20" rx="8" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <!-- Left eyebrow - flat/level, not engaged -->
  <path d="M100 80 Q118 78 136 80" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Right eyebrow - flat -->
  <path d="M154 79 Q172 77 190 79" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Left eye - half lidded, looking to one side -->
  <ellipse cx="118" cy="101" rx="14" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="122" cy="103" r="7" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- Heavy upper lid left -->
  <rect x="104" y="91" width="28" height="11" rx="3" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right eye - half lidded, looking to same side -->
  <ellipse cx="172" cy="101" rx="14" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="176" cy="103" r="7" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- Heavy upper lid right -->
  <rect x="158" y="91" width="28" height="11" rx="3" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Nose -->
  <path d="M140 112 L136 126 L143 128 L150 126 L146 112" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Slight frown / downturned corners -->
  <path d="M120 142 Q145 136 170 142" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Looking-away indicator - small directional arrow to side -->
  <line x1="218" y1="105" x2="240" y2="105" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <polygon points="240,99 252,105 240,111" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
</svg>
