  <!-- Ground -->
  <rect x="15" y="210" width="260" height="8" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Main building body - grand, large -->
  <rect x="30" y="130" width="230" height="80" fill="#efefef" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Triangular pediment / gable at top -->
  <polygon points="22,130 145,70 268,130" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Pediment inner triangle -->
  <polygon points="40,130 145,84 250,130" fill="#efefef" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Columns (6) -->
  <rect x="44" y="130" width="14" height="80" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="74" y="130" width="14" height="80" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="104" y="130" width="14" height="80" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="172" y="130" width="14" height="80" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="202" y="130" width="14" height="80" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="232" y="130" width="14" height="80" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Column bases -->
  <rect x="40" y="206" width="210" height="6" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Door (central, between middle columns) -->
  <rect x="125" y="165" width="40" height="45" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M125,165 Q145,152 165,165" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Door knob -->
  <circle cx="158" cy="190" r="3" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <!-- OPEN BOOK emblem in pediment -->
  <!-- Left page -->
  <path d="M113,102 L116,116 Q145,108 145,112 L145,98 Q131,92 113,102 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right page -->
  <path d="M177,102 L174,116 Q145,108 145,112 L145,98 Q159,92 177,102 Z" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Book spine -->
  <line x1="145" y1="98" x2="145" y2="112" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Book bottom curve -->
  <path d="M116,116 Q145,122 174,116" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Lines left page -->
  <line x1="117" y1="105" x2="141" y2="103" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="117" y1="110" x2="141" y2="108" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Lines right page -->
  <line x1="149" y1="103" x2="173" y2="105" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="149" y1="108" x2="173" y2="110" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- GRADUATION CAP emblem (right of book, above pediment centre) -->
  <!-- Cap board -->
  <polygon points="200,88 228,80 228,86 214,90 200,94 186,90 172,86 172,80" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Cap crown -->
  <rect x="207" y="82" width="14" height="10" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Cap top button -->
  <circle cx="214" cy="80" r="3" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <!-- Tassel -->
  <line x1="228" y1="83" x2="234" y2="96" stroke="#f7de58" stroke-width="3" stroke-linecap="round"/>
  <circle cx="234" cy="98" r="3" fill="#f7de58" stroke="#000000" stroke-width="2"/>
</svg>
