  <!-- veil-bridal: long bridal veil, bride's head silhouette, flowing fabric -->

  <!-- flowing veil fabric (long, wide, flowing behind and around head) -->
  <path d="M55 70 Q40 130 65 220 L225 220 Q250 130 235 70 Q200 55 145 55 Q90 55 55 70 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- veil shading lines (subtle folds) -->
  <path d="M80 85 Q75 140 90 215" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M105 90 Q102 150 112 218" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M180 90 Q183 150 175 218" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M210 85 Q215 140 200 215" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <!-- decorative scalloped/lace edge at bottom -->
  <path d="M65 218 Q75 210 85 218 Q95 210 105 218 Q115 210 125 218 Q135 210 145 218 Q155 210 165 218 Q175 210 185 218 Q195 210 205 218 Q215 210 225 218" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- head silhouette (bride) -->
  <!-- neck/shoulders -->
  <path d="M120 135 L120 165 L170 165 L170 135 Z" fill="#eed5b6" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- dress top -->
  <path d="M105 165 L100 220 L190 220 L185 165 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="145" cy="100" r="30" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair (under veil, peeking) -->
  <path d="M115 95 Q115 73 145 70 Q175 73 175 95 Q172 80 145 78 Q118 80 115 95 Z" fill="#7d5e23" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="135" cy="100" r="2.5" fill="#000000"/>
  <circle cx="155" cy="100" r="2.5" fill="#000000"/>
  <!-- soft smile -->
  <path d="M135 113 Q145 118 155 113" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- subtle lips -->
  <path d="M140 113 L150 113" stroke="#d01424" stroke-width="2" stroke-linecap="round"/>

  <!-- tiara/crown of flowers holding veil -->
