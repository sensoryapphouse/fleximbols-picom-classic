  <!-- jury foreman FULL BODY, centred, reading paper -->
  <!-- head -->
  <circle cx="120" cy="50" r="22" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M101 45 Q101 28 120 28 Q139 28 139 45 Q139 38 130 38 L110 38 Q101 38 101 45 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="113" cy="50" r="2.2" fill="#000000"/>
  <circle cx="127" cy="50" r="2.2" fill="#000000"/>
  <!-- mouth open (reading) -->
  <ellipse cx="120" cy="62" rx="4" ry="3" fill="#5e1f0a" stroke="#000000" stroke-width="1.5"/>
  <!-- torso jacket -->
  <path d="M95 78 Q95 73 105 73 L135 73 Q145 73 145 78 L150 145 L90 145 Z" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- collar/shirt -->
  <path d="M114 73 L120 84 L126 73 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- arms holding paper up -->
  <path d="M95 90 Q80 105 95 130" fill="none" stroke="#2a4ec0" stroke-width="11" stroke-linecap="round"/>
  <path d="M145 90 Q160 105 145 130" fill="none" stroke="#2a4ec0" stroke-width="11" stroke-linecap="round"/>
  <!-- legs -->
  <rect x="100" y="145" width="16" height="55" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <rect x="124" y="145" width="16" height="55" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <ellipse cx="108" cy="206" rx="12" ry="5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <ellipse cx="132" cy="206" rx="12" ry="5" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- paper in hands -->
  <rect x="78" y="98" width="84" height="42" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <line x1="86" y1="108" x2="154" y2="108" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="86" y1="118" x2="154" y2="118" stroke="#7f7f7f" stroke-width="1.5"/>
  <line x1="86" y1="126" x2="140" y2="126" stroke="#7f7f7f" stroke-width="1.5"/>
  <line x1="86" y1="134" x2="148" y2="134" stroke="#7f7f7f" stroke-width="1.5"/>
  <!-- gavel top right -->
  <rect x="195" y="120" width="80" height="22" rx="4" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="200" y="116" width="10" height="30" fill="#7d5e23" stroke="#000000" stroke-width="2.5"/>
  <rect x="260" y="116" width="10" height="30" fill="#7d5e23" stroke="#000000" stroke-width="2.5"/>
  <line x1="220" y1="142" x2="220" y2="195" stroke="#9d7246" stroke-width="11" stroke-linecap="round"/>
  <line x1="220" y1="142" x2="220" y2="195" stroke="#000000" stroke-width="2.5" fill="none"/>
  <!-- gavel block -->
  <rect x="195" y="200" width="80" height="14" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
  <!-- reaction: exclamation + gasp lines above paper -->
  <path d="M170 75 L177 60 M185 80 L196 70 M200 95 L213 92" fill="none" stroke="#f7de58" stroke-width="3" stroke-linecap="round"/>
  <circle cx="225" cy="50" r="14" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <rect x="223" y="42" width="4" height="10" fill="#000000"/>
  <circle cx="225" cy="57" r="2" fill="#000000"/>
