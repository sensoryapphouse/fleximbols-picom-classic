  <!-- Vertigo: head with room/spiral spinning around it + tilted horizon line -->

  <!-- Tilted horizon line (environment spinning) -->
  <line x1="25" y1="175" x2="265" y2="145" stroke="#4d4d4d" stroke-width="4" stroke-linecap="round"/>

  <!-- Spinning spiral around head -->
  <!-- Outer spiral arc 1 -->
  <path d="M 60 80 Q 55 30 120 22 Q 195 12 225 75 Q 250 130 210 175 Q 170 215 110 200 Q 58 185 48 135 Q 40 95 70 72" fill="none" stroke="#2a4ec0" stroke-width="5" stroke-linecap="round"/>
  <!-- Inner spiral arc 2 -->
  <path d="M 80 90 Q 78 50 130 44 Q 185 38 205 85 Q 222 128 192 160 Q 162 190 118 178 Q 78 166 74 128 Q 70 100 90 85" fill="none" stroke="#90a7d6" stroke-width="4" stroke-linecap="round"/>

  <!-- Spiral motion arrows -->
  <polygon points="62,78 55,62 72,70" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="228,78 238,64 232,82" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="126" y="172" width="32" height="26" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Head (slightly tilted) -->
  <ellipse cx="142" cy="130" rx="46" ry="50" fill="#eed5b6" stroke="#000000" stroke-width="5"/>

  <!-- Eyes (wide, disoriented) -->
  <ellipse cx="125" cy="128" rx="9" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="127" cy="130" r="5" fill="#000000"/>
  <ellipse cx="158" cy="128" rx="9" ry="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="156" cy="130" r="5" fill="#000000"/>

  <!-- Mouth (open, distressed) -->
  <path d="M 128 155 Q 142 163 156 155" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- Small tilt-indicator marks on either side -->
  <line x1="32" y1="185" x2="48" y2="178" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>
  <line x1="242" y1="138" x2="258" y2="131" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round"/>
</svg>
