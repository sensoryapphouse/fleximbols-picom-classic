  <path d="M161 80 Q165 83 169 80" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M171 80 Q175 83 179 80" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
