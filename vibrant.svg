  <!-- 8 petals — alternating hot pink and vivid red -->
  <!-- petal up -->
  <ellipse cx="145" cy="88" rx="20" ry="36" fill="#f266aa" stroke="#000000" stroke-width="4"/>
  <!-- petal up-right -->
  <ellipse cx="173" cy="97" rx="20" ry="36" fill="#f8130d" stroke="#000000" stroke-width="4" transform="rotate(45,173,97)"/>
  <!-- petal right -->
  <ellipse cx="182" cy="120" rx="20" ry="36" fill="#f266aa" stroke="#000000" stroke-width="4" transform="rotate(90,182,120)"/>
  <!-- petal down-right -->
  <ellipse cx="173" cy="143" rx="20" ry="36" fill="#f8130d" stroke="#000000" stroke-width="4" transform="rotate(135,173,143)"/>
  <!-- petal down -->
  <ellipse cx="145" cy="152" rx="20" ry="36" fill="#f266aa" stroke="#000000" stroke-width="4"/>
  <!-- petal down-left -->
  <ellipse cx="117" cy="143" rx="20" ry="36" fill="#f8130d" stroke="#000000" stroke-width="4" transform="rotate(45,117,143)"/>
  <!-- petal left -->
  <ellipse cx="108" cy="120" rx="20" ry="36" fill="#f266aa" stroke="#000000" stroke-width="4" transform="rotate(90,108,120)"/>
  <!-- petal up-left -->
  <ellipse cx="117" cy="97" rx="20" ry="36" fill="#f8130d" stroke="#000000" stroke-width="4" transform="rotate(135,117,97)"/>
  <!-- flower centre -->
  <circle cx="145" cy="120" r="28" fill="#fff200" stroke="#000000" stroke-width="5"/>
  <!-- centre detail dots -->
  <circle cx="138" cy="114" r="5" fill="#ff9900" stroke="#000000" stroke-width="2"/>
  <circle cx="152" cy="114" r="5" fill="#ff9900" stroke="#000000" stroke-width="2"/>
  <circle cx="145" cy="128" r="5" fill="#ff9900" stroke="#000000" stroke-width="2"/>
  <!-- energy sparks around flower -->
  <!-- spark top-right -->
  <polygon points="200,54 204,62 196,60" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <line x1="192" y1="68" x2="200" y2="54" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- spark left -->
  <polygon points="70,100 78,96 76,105" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <line x1="86" y1="100" x2="70" y2="100" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- spark bottom-right -->
  <polygon points="205,170 210,162 214,170" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <line x1="198" y1="162" x2="210" y2="162" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- spark top-left -->
  <polygon points="78,52 84,60 76,62" fill="#f7de58" stroke="#000000" stroke-width="2"/>
  <line x1="90" y1="66" x2="80" y2="56" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
</svg>
