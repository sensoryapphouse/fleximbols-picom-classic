<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- victory V-sign: back of hand facing viewer, wider V, with small star motif -->
  <!-- palm body (back of hand) -->
  <rect x="90" y="126" width="112" height="88" rx="22" ry="22" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- knuckle dots on back of hand -->
  <circle cx="112" cy="132" r="5" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="146" cy="130" r="5" fill="none" stroke="#000000" stroke-width="3"/>
  <!-- ring finger curled (tucked, small bump) -->
  <rect x="154" y="114" width="22" height="24" rx="11" ry="11" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- little finger curled -->
  <rect x="180" y="118" width="20" height="22" rx="10" ry="10" fill="#f7de58" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- thumb tucked at side (back-of-hand view, thumb points slightly right) -->
  <rect x="182" y="148" width="40" height="44" rx="18" ry="18" fill="#f7de58" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" transform="rotate(15 202 170)"/>
  <!-- index finger raised left (wider V spread) -->
  <rect x="88" y="26" width="26" height="112" rx="13" ry="13" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round" transform="rotate(-8 101 82)"/>
  <!-- middle finger raised right (wider V spread) -->
  <rect x="132" y="22" width="26" height="116" rx="13" ry="13" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round" transform="rotate(8 145 80)"/>
  <!-- wrist -->
  <rect x="106" y="202" width="74" height="26" rx="10" ry="10" fill="#f7de58" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- small star motif top-right (celebratory indicator) -->
  <line x1="232" y1="32" x2="232" y2="48" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="224" y1="40" x2="240" y2="40" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="226" y1="34" x2="238" y2="46" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="238" y1="34" x2="226" y2="46" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
</svg>
