  <path d="M 48 168 L 65 175 L 60 195 L 45 188 Z" fill="#b8b8b8" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- legs -->
  <rect x="82" y="144" width="11" height="50" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="97" y="144" width="11" height="50" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="78" y="194" width="16" height="10" rx="2" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <rect x="96" y="194" width="16" height="10" rx="2" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
