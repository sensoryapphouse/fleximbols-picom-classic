  <!-- sky -->
  <rect x="0" y="0" width="290" height="180" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <!-- earth/ground -->
  <rect x="0" y="180" width="290" height="60" fill="#9d7246" stroke="#000000" stroke-width="3"/>

  <!-- globe (top right) -->
  <circle cx="240" cy="55" r="32" fill="#2a4ec0" stroke="#000000" stroke-width="4"/>
  <path d="M 215 45 Q 230 50 240 45 Q 252 40 265 50 L 263 60 Q 250 55 235 62 Q 225 67 213 60 Z" fill="#529929" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 220 75 Q 235 70 250 78 Q 258 82 263 78 L 261 84 Q 252 88 240 84 Q 230 80 218 84 Z" fill="#529929" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>

  <!-- heart (top left) -->
  <path d="M 50 35 Q 35 20 25 35 Q 25 50 50 70 Q 75 50 75 35 Q 65 20 50 35 Z" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- tree being planted (right of person) -->
  <rect x="175" y="155" width="10" height="30" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="180" cy="130" r="22" fill="#137827" stroke="#000000" stroke-width="3"/>
  <circle cx="165" cy="140" r="14" fill="#529929" stroke="#000000" stroke-width="3"/>
  <circle cx="195" cy="140" r="14" fill="#529929" stroke="#000000" stroke-width="3"/>
  <!-- dirt mound -->
  <ellipse cx="180" cy="195" rx="28" ry="8" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>

  <!-- person FULL BODY planting (left) -->
  <circle cx="95" cy="80" r="14" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <path d="M 82 75 Q 95 65 108 75 L 108 83 Q 95 79 82 83 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- torso -->
  <rect x="80" y="94" width="30" height="50" fill="#ff9900" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arm to tree (reaching right) -->
  <line x1="110" y1="105" x2="155" y2="140" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="110" y1="105" x2="155" y2="140" stroke="#e6b98a" stroke-width="2" stroke-linecap="round"/>
  <!-- arm left (holding shovel handle) -->
  <line x1="80" y1="105" x2="60" y2="160" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
