  <!-- water background -->
  <rect x="20" y="150" width="250" height="70" rx="5" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- boat (hint, far left) -->
  <path d="M22 148 L22 135 L75 128 L90 135 L90 148 Z" fill="#b8b8b8" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- boat hull bottom -->
  <path d="M22 148 Q56 158 90 148" fill="#7f7f7f" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- wake wave -->
  <path d="M90 165 Q120 152 155 165 Q180 175 210 162 Q235 152 265 158" fill="none" stroke="#2a4ec0" stroke-width="5" stroke-linecap="round"/>
  <path d="M90 178 Q118 165 150 178 Q175 188 205 175 Q232 163 265 170" fill="none" stroke="#2a4ec0" stroke-width="4" stroke-linecap="round"/>
  <!-- board riding wave -->
  <ellipse cx="185" cy="173" rx="42" ry="8" fill="#ff9900" stroke="#000000" stroke-width="5"/>
  <!-- figure legs bent (surfing stance) -->
  <line x1="183" y1="167" x2="174" y2="173" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="188" y1="167" x2="196" y2="173" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- figure body leaning back -->
  <line x1="185" y1="135" x2="185" y2="167" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- arms out for balance -->
  <line x1="185" y1="148" x2="168" y2="140" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="185" y1="148" x2="202" y2="140" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="185" cy="123" r="12" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- torso colour -->
  <rect x="180" y="135" width="10" height="30" rx="4" fill="#f8130d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
