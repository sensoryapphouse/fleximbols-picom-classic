  <!-- wheeled frame baby sits inside with toy tray -->
  <!-- base frame (wide, with wheels) -->
  <ellipse cx="145" cy="210" rx="105" ry="14" fill="#7c3fac" stroke="#000000" stroke-width="3"/>
  <!-- wheels -->
  <circle cx="55" cy="218" r="10" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <circle cx="145" cy="222" r="10" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <circle cx="235" cy="218" r="10" fill="#4d4d4d" stroke="#000000" stroke-width="2"/>
  <!-- vertical supports -->
  <line x1="75" y1="200" x2="80" y2="140" stroke="#7c3fac" stroke-width="6" stroke-linecap="round"/>
  <line x1="215" y1="200" x2="210" y2="140" stroke="#7c3fac" stroke-width="6" stroke-linecap="round"/>
  <line x1="75" y1="200" x2="80" y2="140" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="215" y1="200" x2="210" y2="140" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- toy tray (round, with toys) -->
  <ellipse cx="145" cy="140" rx="90" ry="22" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="145" cy="135" rx="90" ry="22" fill="#f2e40d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- toys on tray -->
  <circle cx="95" cy="128" r="8" fill="#f8130d" stroke="#000000" stroke-width="2"/>
  <rect x="180" y="118" width="16" height="16" fill="#2a4ec0" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 130 125 L 138 138 L 122 138 Z" fill="#529929" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- seat hole rim behind baby -->
  <ellipse cx="145" cy="120" rx="38" ry="10" fill="#392170" stroke="#000000" stroke-width="2"/>
  <!-- baby (head above tray, arms reaching to toys) -->
  <!-- body (small, peeking from seat hole) -->
  <ellipse cx="145" cy="105" rx="22" ry="14" fill="#dff3fd" stroke="#000000" stroke-width="3"/>
  <!-- arms over tray -->
  <path d="M 125 110 Q 110 120 100 125" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 165 110 Q 180 118 188 122" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="145" cy="75" r="25" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M 125 60 Q 145 48 165 60 L 162 70 Q 145 62 128 70 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="137" cy="76" r="2.5" fill="#000000"/>
  <circle cx="153" cy="76" r="2.5" fill="#000000"/>
  <!-- smile -->
  <path d="M 137 86 Q 145 92 153 86" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
