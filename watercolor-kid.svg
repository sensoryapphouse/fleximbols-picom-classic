  <!-- BACKGROUND PANEL -->
  <rect x="22" y="22" width="246" height="196" rx="14" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- COLOURFUL PAINTING (right, on easel-less paper) -->
  <rect x="156" y="40" width="100" height="100" rx="3" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Sun on painting -->
  <circle cx="180" cy="68" r="12" fill="#fff200" stroke="#000000" stroke-width="3"/>
  <!-- House on painting -->
  <rect x="200" y="86" width="40" height="30" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M196 86 L220 70 L244 86 Z" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="216" y="96" width="8" height="20" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <!-- Ground -->
  <path d="M160 116 L252 116 L252 136 L160 136 Z" fill="#529929" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- WATERCOLOUR PALETTE (bottom, oval with paint wells) -->
  <ellipse cx="145" cy="190" rx="100" ry="22" fill="#efefef" stroke="#000000" stroke-width="5"/>
  <!-- Mixing area in centre -->
  <ellipse cx="145" cy="190" rx="22" ry="8" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Paint wells (8 colours) -->
  <circle cx="64" cy="186" r="8" fill="#d01424" stroke="#000000" stroke-width="3"/>
  <circle cx="84" cy="184" r="8" fill="#ff9900" stroke="#000000" stroke-width="3"/>
  <circle cx="104" cy="184" r="8" fill="#fff200" stroke="#000000" stroke-width="3"/>
  <circle cx="124" cy="184" r="8" fill="#529929" stroke="#000000" stroke-width="3"/>
  <circle cx="166" cy="184" r="8" fill="#2a4ec0" stroke="#000000" stroke-width="3"/>
  <circle cx="186" cy="184" r="8" fill="#7c3fac" stroke="#000000" stroke-width="3"/>
  <circle cx="206" cy="184" r="8" fill="#f266aa" stroke="#000000" stroke-width="3"/>
  <circle cx="226" cy="186" r="8" fill="#5e1f0a" stroke="#000000" stroke-width="3"/>

  <!-- WATER CUP (top-left) -->
  <path d="M36 88 L42 156 Q42 162 48 162 L82 162 Q88 162 88 156 L94 88 Z" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="65" cy="88" rx="29" ry="6" fill="#90a7d6" stroke="#000000" stroke-width="4"/>
  <!-- Water surface ripple -->
  <path d="M44 100 Q56 96 65 100 Q74 104 86 100" fill="none" stroke="#2a4ec0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Water -->
  <path d="M44 102 L48 156 Q48 158 50 158 L80 158 Q82 158 82 156 L86 102 Q74 106 65 102 Q56 98 44 102 Z" fill="#90a7d6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Drips inside water (blue swirl) -->
  <path d="M58 130 Q66 124 74 130" fill="none" stroke="#1d0e82" stroke-width="2"/>

  <!-- PAINTBRUSH (centre, diagonal, dipped in cup) -->
  <!-- Handle -->
  <rect x="92" y="42" width="14" height="76" rx="4" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round" transform="rotate(30 99 80)"/>
  <!-- Ferrule -->
  <rect x="92" y="118" width="14" height="14" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round" transform="rotate(30 99 125)"/>
