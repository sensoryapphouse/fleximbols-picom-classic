  <circle cx="182" cy="140" r="10" fill="none" stroke="#f7de58" stroke-width="5"/>

  <!-- === PERSON (left, clipboard) === -->
  <!-- Head -->
  <circle cx="64" cy="50" r="20" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair (bun/updo) -->
  <path d="M44 48 Q48 28 64 26 Q80 28 84 48 Q79 36 64 34 Q49 36 44 48Z" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
