  <!-- Central planner figure -->
  <!-- Head -->
  <circle cx="145" cy="52" r="18" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hair -->
  <path d="M127 48 q0-22 18-24 q18 2 18 24" fill="#5e1f0a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="138" cy="50" r="2.5" fill="#000000"/>
  <circle cx="152" cy="50" r="2.5" fill="#000000"/>
  <!-- Focused expression -->
  <line x1="136" y1="44" x2="142" y2="46" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="148" y1="44" x2="154" y2="46" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M138 58 q7 5 14 0" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="130" y="72" width="30" height="48" rx="6" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect x="130" y="118" width="12" height="44" rx="5" fill="#392170" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right leg -->
  <rect x="148" y="118" width="12" height="44" rx="5" fill="#392170" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left arm (holding clipboard) -->
  <line x1="130" y1="84" x2="102" y2="96" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Right arm (gesturing) -->
  <line x1="160" y1="84" x2="178" y2="72" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Hand right -->
  <circle cx="180" cy="70" r="7" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Clipboard/binder held by left arm -->
  <rect x="76" y="88" width="32" height="40" rx="4" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Clipboard clip -->
  <rect x="86" y="84" width="12" height="10" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Checklist lines -->
  <line x1="84" y1="104" x2="100" y2="104" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="82" cy="104" r="2.5" fill="#529929" stroke="#000000" stroke-width="2"/>
  <line x1="84" y1="114" x2="100" y2="114" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="82" cy="114" r="2.5" fill="#529929" stroke="#000000" stroke-width="2"/>
  <line x1="84" y1="124" x2="98" y2="124" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="82" cy="124" r="2.5" fill="#efefef" stroke="#000000" stroke-width="2"/>

  <!-- Small cake icon (top-right area) -->
  <!-- Cake base -->
  <rect x="196" y="136" width="36" height="28" rx="4" fill="#f4a4b2" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Cake tier top -->
  <rect x="202" y="118" width="24" height="20" rx="4" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Candle / topper -->
  <rect x="212" y="110" width="6" height="10" rx="2" fill="#f7de58" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Flame -->
  <ellipse cx="215" cy="108" rx="4" ry="5" fill="#f8130d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Cake decoration dots -->
  <circle cx="206" cy="148" r="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="214" cy="148" r="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="222" cy="148" r="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Small arch icon (top-left area) -->
  <path d="M32 148 l0 -40 q0 -32 26 -32 q26 0 26 32 l0 40" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 148 l0 -36 q0 -20 16 -20 q16 0 16 20 l0 36" fill="#dff3fd" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Flowers on arch -->
  <circle cx="32" cy="108" r="6" fill="#f266aa" stroke="#000000" stroke-width="3"/>
  <circle cx="84" cy="108" r="6" fill="#f266aa" stroke="#000000" stroke-width="3"/>
  <circle cx="58" cy="76" r="6" fill="#f266aa" stroke="#000000" stroke-width="3"/>

  <!-- Ground line -->
  <line x1="28" y1="170" x2="262" y2="170" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
