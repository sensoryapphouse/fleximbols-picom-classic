  <rect x="52" y="190" width="16" height="22" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="4"/>
  <path d="M70 190 Q78 198 82 210 L72 210 Q68 202 68 195 Z" fill="#1d0e82" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="58" y="98" width="20" height="22" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Head -->
  <ellipse cx="70" cy="76" rx="36" ry="36" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="70" cy="46" rx="36" ry="13" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <rect x="34" y="41" width="72" height="14" rx="7" fill="#4d4d4d" stroke="#000000" stroke-width="5"/>
  <!-- Brows - pleased, friendly -->
  <path d="M50 66 Q61 59 70 63" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M70 63 Q79 59 90 66" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="58" cy="76" rx="9" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="58" cy="75" rx="5" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <ellipse cx="82" cy="76" rx="9" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="82" cy="75" rx="5" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Warm smile -->
  <path d="M50 90 Q70 104 90 90" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <ellipse cx="44" cy="80" rx="9" ry="6" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="96" cy="80" rx="9" ry="6" fill="#f4a4b2" stroke="none"/>
