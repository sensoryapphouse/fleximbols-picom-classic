  <!-- Floor -->
  <rect x="10" y="210" width="270" height="10" rx="2" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <!-- WELCOME MAT -->
  <rect x="96" y="200" width="100" height="18" rx="4" fill="#529929" stroke="#000000" stroke-width="4"/>
  <!-- Mat stripes decoration -->
  <line x1="114" y1="203" x2="114" y2="215" stroke="#f7de58" stroke-width="3"/>
  <line x1="130" y1="203" x2="130" y2="215" stroke="#f7de58" stroke-width="3"/>
  <line x1="146" y1="203" x2="146" y2="215" stroke="#f7de58" stroke-width="3"/>
  <line x1="162" y1="203" x2="162" y2="215" stroke="#f7de58" stroke-width="3"/>
  <line x1="178" y1="203" x2="178" y2="215" stroke="#f7de58" stroke-width="3"/>

  <!-- DOOR FRAME -->
  <rect x="144" y="40" width="130" height="172" rx="6" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Door fill (open door pushed back) -->
  <rect x="148" y="44" width="62" height="164" rx="4" fill="#9d7246" stroke="#000000" stroke-width="4"/>
  <!-- Door panel details -->
  <rect x="154" y="54" width="50" height="60" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
  <rect x="154" y="124" width="50" height="60" rx="3" fill="#7d5e23" stroke="#000000" stroke-width="3"/>
  <!-- Doorknob -->
  <circle cx="204" cy="122" r="7" fill="#f7de58" stroke="#000000" stroke-width="3"/>

  <!-- HOST FIGURE with open arms in doorway (right side) -->
  <!-- Body -->
  <rect x="196" y="110" width="44" height="80" rx="8" fill="#2a4ec0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right arm reaching wide open to welcome -->
  <path d="M240 125 L268 105" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="270" cy="102" r="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Left arm reaching toward guest -->
  <path d="M196 125 L170 110" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="167" cy="107" r="9" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Legs -->
  <rect x="200" y="186" width="16" height="22" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="4"/>
  <rect x="220" y="186" width="16" height="22" rx="4" fill="#1d0e82" stroke="#000000" stroke-width="4"/>
  <!-- Neck -->
  <rect x="208" y="90" width="20" height="22" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Head -->
  <ellipse cx="218" cy="68" rx="36" ry="36" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="218" cy="38" rx="36" ry="13" fill="#7d5e23" stroke="#000000" stroke-width="5"/>
  <rect x="182" y="33" width="72" height="14" rx="7" fill="#7d5e23" stroke="#000000" stroke-width="5"/>
  <!-- Happy brows -->
  <path d="M198 58 Q209 51 218 56" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M218 56 Q227 51 238 58" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="206" cy="68" rx="9" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="206" cy="67" rx="5" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <ellipse cx="230" cy="68" rx="9" ry="9" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="230" cy="67" rx="5" ry="5" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Big welcoming smile -->
  <path d="M198 82 Q218 96 238 82" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <ellipse cx="193" cy="72" rx="9" ry="6" fill="#f4a4b2" stroke="none"/>
  <ellipse cx="243" cy="72" rx="9" ry="6" fill="#f4a4b2" stroke="none"/>

  <!-- ARRIVING GUEST FIGURE (left side, stepping up) -->
  <!-- Body -->
  <rect x="48" y="118" width="44" height="76" rx="8" fill="#f8130d" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
