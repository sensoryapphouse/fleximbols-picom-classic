<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- whisper-modern: face with hand cupped to mouth, tiny soft dashed speech bubble, leaning toward listener ear -->
  <!-- Speaker head (left, leaning right) -->
  <g transform="rotate(-8, 75, 90)">
    <circle cx="75" cy="72" r="36" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Eyes (looking right toward listener) -->
    <ellipse cx="63" cy="65" rx="5" ry="6" fill="#000000"/>
    <ellipse cx="83" cy="64" rx="5" ry="6" fill="#000000"/>
    <ellipse cx="85" cy="63" rx="2" ry="2" fill="#ffffff"/>
    <ellipse cx="65" cy="64" rx="2" ry="2" fill="#ffffff"/>
    <!-- Hair -->
    <path d="M 40 58 Q 42 30 75 28 Q 108 30 110 58 Q 100 38 75 38 Q 50 38 40 58 Z" fill="#7d5e23" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Neck -->
    <rect x="63" y="106" width="24" height="18" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
    <!-- Torso -->
    <path d="M 28 200 L 38 124 Q 75 116 112 124 L 122 200 Z" fill="#529929" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Cupped hand over mouth -->
    <path d="M 85 85 Q 105 80 115 92 Q 110 105 95 108 Q 80 108 75 98 Q 74 90 85 85 Z" fill="#e6b98a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Fingers of cupped hand -->
    <path d="M 88 84 Q 92 74 98 76" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <path d="M 96 82 Q 102 73 108 77" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <path d="M 103 88 Q 112 82 115 87" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <!-- Mouth (lips slightly open behind hand) -->
    <path d="M 72 95 Q 80 99 88 95" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Soft dashed small speech bubble (center) -->
  <path d="M 140 55 Q 140 30 175 30 Q 210 30 210 55 Q 210 78 185 80 L 178 95 L 172 80 Q 140 80 140 55 Z" fill="#dff3fd" stroke="#000000" stroke-width="3" stroke-dasharray="5,4" stroke-linejoin="round"/>
  <!-- Tiny dots inside bubble (whisper = near empty) -->
  <circle cx="162" cy="55" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="175" cy="55" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <circle cx="188" cy="55" r="4" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <!-- Listener (right side) — just an ear visible -->
  <circle cx="248" cy="118" r="32" fill="#e6b98a" stroke="#000000" stroke-width="5"/>
  <!-- Ear detail -->
  <path d="M 232 105 Q 228 118 232 131" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 236 110 Q 234 118 236 126" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Eye of listener (right profile) -->
  <ellipse cx="256" cy="112" rx="5" ry="6" fill="#000000"/>
  <!-- Hair listener -->
  <path d="M 220 95 Q 225 70 248 68 Q 275 70 280 95 Q 270 80 248 80 Q 228 80 220 95 Z" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
</svg>
