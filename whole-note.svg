  <!-- whole note: hollow oval, no stem, tilted slightly -->
  <ellipse cx="145" cy="130" rx="48" ry="30" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
