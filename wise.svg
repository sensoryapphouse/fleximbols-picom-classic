  <circle cx="222" cy="76" r="11" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="242" cy="76" r="11" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="222" cy="76" r="7" fill="#529929"/>
  <circle cx="242" cy="76" r="7" fill="#529929"/>
  <circle cx="222" cy="76" r="4" fill="#000000"/>
  <circle cx="242" cy="76" r="4" fill="#000000"/>
  <!-- Owl beak -->
  <polygon points="232,82 226,90 238,90" fill="#ff9900" stroke="#000000" stroke-width="3"/>
  <!-- Owl ear tufts -->
  <polygon points="218,56 214,46 222,52" fill="#f7de58" stroke="#000000" stroke-width="3"/>
  <polygon points="246,56 250,46 242,52" fill="#f7de58" stroke="#000000" stroke-width="3"/>
