  <line x1="222" y1="120" x2="222" y2="130" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="222" y1="120" x2="226" y2="128" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="242" y1="120" x2="238" y2="128" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="242" y1="120" x2="242" y2="130" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="242" y1="120" x2="246" y2="128" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
