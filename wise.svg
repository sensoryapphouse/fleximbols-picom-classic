  <path d="M108,78 Q113,74 118,78" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M138,78 Q143,74 150,78" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="130" cy="96" rx="8" ry="6" fill="#e6b98a" stroke="#000000" stroke-width="3"/>
  <!-- Knowing smile -->
  <path d="M112,110 Q130,124 148,110" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- White beard -->
  <path d="M92,110 Q88,130 94,150 Q110,168 130,170 Q150,168 166,150 Q172,130 168,110 Q150,106 130,108 Q110,106 92,110Z" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Beard lines -->
  <path d="M108,120 Q112,140 118,155" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M130,122 Q130,145 130,160" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M152,120 Q148,140 142,155" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Robe body -->
  <path d="M90,168 Q80,185 78,220 L182,220 Q180,185 170,168 Q155,158 130,160 Q105,158 90,168Z" fill="#7c3fac" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
