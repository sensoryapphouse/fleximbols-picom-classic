  <rect x="82" y="188" width="50" height="32" rx="2" fill="#f5e7c4" stroke="#000000" stroke-width="4"/>
  <rect x="128" y="188" width="50" height="32" rx="2" fill="#f5e7c4" stroke="#000000" stroke-width="4"/>
  <line x1="82" y1="200" x2="130" y2="200" stroke="#000000" stroke-width="2"/>
