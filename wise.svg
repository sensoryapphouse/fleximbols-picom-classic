  <line x1="130" y1="200" x2="178" y2="200" stroke="#000000" stroke-width="2"/>
  <line x1="130" y1="210" x2="178" y2="210" stroke="#000000" stroke-width="2"/>
  <!-- Owl upper right -->
  <ellipse cx="232" cy="88" rx="26" ry="32" fill="#f7de58" stroke="#000000" stroke-width="4"/>
  <!-- Owl wing marks -->
  <ellipse cx="232" cy="92" rx="18" ry="24" fill="#ff9900" stroke="#000000" stroke-width="3"/>
