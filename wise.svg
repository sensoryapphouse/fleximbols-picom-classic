  <!-- Wise elderly figure: white beard, calm knowing smile, owl -->
  <!-- Head -->
  <ellipse cx="130" cy="82" rx="40" ry="46" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- White hair / bald top with side hair -->
  <ellipse cx="130" cy="50" rx="40" ry="16" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <ellipse cx="92" cy="72" rx="12" ry="20" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="168" cy="72" rx="12" ry="20" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Eyebrows - bushy white -->
  <path d="M108,72 Q118,66 128,70" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M132,70 Q142,66 152,72" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Eyes - calm knowing, slightly crinkled -->
  <ellipse cx="117" cy="82" rx="9" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <ellipse cx="143" cy="82" rx="9" ry="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="118" cy="83" r="5" fill="#9d7246"/>
  <circle cx="144" cy="83" r="5" fill="#9d7246"/>
