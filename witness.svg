  <!-- courtroom back wall -->
  <rect x="0" y="0" width="290" height="190" fill="#f5e7c4" stroke="#000000" stroke-width="2"/>
  <!-- judge bench silhouette in background -->
  <rect x="20" y="80" width="60" height="50" fill="#9d7246" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="14" y="76" width="72" height="8" fill="#7d5e23" stroke="#000000" stroke-width="2"/>
  <!-- gavel hint -->
  <rect x="36" y="68" width="28" height="6" rx="2" fill="#5e1f0a" stroke="#000000" stroke-width="2"/>
  <!-- witness stand -->
  <rect x="160" y="150" width="120" height="78" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="154" y="146" width="132" height="10" fill="#7d5e23" stroke="#000000" stroke-width="2.5"/>
  <path d="M180 170 L260 170" stroke="#5e1f0a" stroke-width="2" stroke-linecap="round"/>
  <path d="M180 196 L260 196" stroke="#5e1f0a" stroke-width="2" stroke-linecap="round"/>
  <!-- floor -->
  <rect x="0" y="190" width="290" height="50" fill="#b8b8b8" stroke="#000000" stroke-width="2"/>
  <!-- witness full body, behind the stand -->
  <!-- head -->
  <circle cx="120" cy="60" r="20" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- hair -->
  <path d="M100 56 Q100 38 120 36 Q140 38 140 56 Q140 50 120 48 Q104 50 100 56" fill="#5e1f0a" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- eyes & mouth -->
  <circle cx="113" cy="60" r="2" fill="#000000"/>
  <circle cx="127" cy="60" r="2" fill="#000000"/>
  <path d="M114 70 Q120 73 126 70" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- torso (shirt) -->
  <path d="M94 86 L146 86 L154 160 L86 160 Z" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- collar -->
  <path d="M110 86 L120 100 L130 86" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- raised right arm (oath, palm out) -->
  <path d="M146 92 L168 60 L182 60 L178 80 L160 110 Z" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- hand palm out -->
  <path d="M168 60 Q170 40 178 40 Q180 40 180 42 L180 46 Q186 44 188 50 Q186 56 184 60 L182 60 Z" fill="#eed5b6" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M180 48 L188 50" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- left arm down on rail -->
  <path d="M94 92 L70 140 L84 146 L106 110 Z" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="76" cy="144" r="8" fill="#eed5b6" stroke="#000000" stroke-width="2.5"/>
  <!-- legs visible below the stand front (we draw two legs sticking down) -->
  <rect x="96" y="160" width="20" height="62" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="124" y="160" width="20" height="62" fill="#4d4d4d" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- feet -->
  <rect x="92" y="218" width="28" height="10" rx="3" fill="#000000" stroke="#000000" stroke-width="2"/>
  <rect x="120" y="218" width="28" height="10" rx="3" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- speech / oath bubble -->
  <path d="M30 14 L100 14 Q110 14 110 24 L110 38 Q110 48 100 48 L60 48 L48 60 L52 48 L30 48 Q20 48 20 38 L20 24 Q20 14 30 14 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- truth check mark in bubble -->
  <path d="M40 32 L52 42 L92 22" fill="none" stroke="#529929" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
