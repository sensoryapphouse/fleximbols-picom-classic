<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Witty: clever sly grin, lightbulb + speech spark — quick clever humour, NOT slapstick -->
  <!-- Bust: shoulders + head -->
  <rect x="88" y="152" width="114" height="72" rx="14" fill="#3aa6a0" stroke="#000000" stroke-width="5"/>
  <!-- Left arm -->
  <line x1="90" y1="165" x2="56" y2="180" stroke="#3aa6a0" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="50" cy="183" rx="11" ry="10" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Right arm — one finger raised (eureka/wit gesture) -->
  <line x1="200" y1="163" x2="228" y2="145" stroke="#3aa6a0" stroke-width="16" stroke-linecap="round"/>
  <!-- Hand with raised index finger -->
  <ellipse cx="232" cy="141" rx="12" ry="13" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <rect x="228" y="116" width="8" height="26" rx="4" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Neck -->
  <rect x="130" y="132" width="30" height="24" rx="6" fill="#eed5b6" stroke="#000000" stroke-width="4"/>
  <!-- Head -->
  <ellipse cx="145" cy="96" rx="44" ry="42" fill="#eed5b6" stroke="#000000" stroke-width="5"/>
  <!-- Hair -->
  <ellipse cx="145" cy="58" rx="42" ry="16" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- Sly eyes — asymmetric, one arched higher (sly look) -->
  <ellipse cx="130" cy="90" rx="8" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <ellipse cx="160" cy="89" rx="8" ry="7" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="132" cy="90" r="4" fill="#000000"/>
  <circle cx="162" cy="90" r="4" fill="#000000"/>
  <!-- Sly eyebrows — one raised higher -->
  <path d="M120 78 Q130 73 140 78" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 76 Q160 68 170 74" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Sly smirk — one-sided grin -->
  <path d="M128 110 Q140 108 158 116" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Small dimple on smirk side -->
  <circle cx="160" cy="114" r="3" fill="#e6b98a" stroke="#000000" stroke-width="1"/>
  <!-- Lightbulb above head (top-left area) -->
  <!-- Bulb glass -->
  <ellipse cx="82" cy="45" rx="20" ry="22" fill="#f2e40d" stroke="#000000" stroke-width="4"/>
  <!-- Bulb base -->
  <rect x="74" y="64" width="16" height="8" rx="3" fill="#b8b8b8" stroke="#000000" stroke-width="3"/>
  <rect x="76" y="70" width="12" height="5" rx="2" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- Filament inside bulb -->
  <path d="M82 58 Q76 48 82 38 Q88 28 82 20" fill="none" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <!-- Light rays from bulb -->
  <line x1="58" y1="38" x2="50" y2="30" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="50" x2="44" y2="48" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <line x1="82" y1="22" x2="82" y2="12" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <line x1="104" y1="38" x2="112" y2="30" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <line x1="106" y1="50" x2="116" y2="47" stroke="#f2e40d" stroke-width="3" stroke-linecap="round"/>
  <!-- Speech spark / zap between lightbulb and head -->
  <polyline points="99,52 110,62 104,68 118,78" fill="none" stroke="#f8130d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
