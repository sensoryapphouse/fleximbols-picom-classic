  <!-- start box (oval) green -->
  <ellipse cx="50" cy="100" rx="35" ry="20" fill="#529929" stroke="#000000" stroke-width="3"/>
  <!-- middle decision box (diamond) yellow -->
  <polygon points="145,70 195,110 145,150 95,110" fill="#fff200" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- end box red rect -->
  <rect x="210" y="80" width="70" height="40" fill="#d01424" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- lower process box blue -->
  <rect x="100" y="180" width="90" height="40" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- arrows -->
  <!-- start -> diamond -->
  <line x1="85" y1="100" x2="92" y2="108" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <polygon points="92,108 84,106 88,114" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- diamond -> end -->
  <line x1="195" y1="110" x2="207" y2="100" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <polygon points="207,100 200,98 203,107" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- diamond -> lower -->
  <line x1="145" y1="150" x2="145" y2="177" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <polygon points="145,180 140,172 150,172" fill="#000000" stroke="#000000" stroke-width="2"/>

  <!-- checkmark inside end box (completed flow step) -->
  <path d="M220 95 L228 106 L248 86" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
