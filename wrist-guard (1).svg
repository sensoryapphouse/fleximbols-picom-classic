  <path d="M 30 70 L 160 65 L 165 130 L 35 135 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- hand -->
  <path d="M 160 65 L 220 60 C 235 60, 245 70, 245 85 L 245 115 C 245 130, 235 140, 220 140 L 165 130 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
