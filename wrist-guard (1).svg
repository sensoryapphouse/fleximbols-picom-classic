  <rect x="55" y="55" width="155" height="95" rx="14" fill="#3aa6a0" stroke="#000000" stroke-width="4"/>
  <!-- plastic support splint (rigid panel on top) -->
  <rect x="75" y="75" width="120" height="55" rx="10" fill="#efefef" stroke="#000000" stroke-width="4"/>
  <!-- splint ridges -->
  <path d="M 95 80 L 95 125" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 115 80 L 115 125" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 135 80 L 135 125" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 155 80 L 155 125" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 175 80 L 175 125" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- velcro strap 1 (left) -->
  <rect x="50" y="60" width="14" height="90" rx="3" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <!-- velcro hook texture -->
  <path d="M 53 70 L 61 70 M 53 80 L 61 80 M 53 90 L 61 90 M 53 100 L 61 100 M 53 110 L 61 110 M 53 120 L 61 120 M 53 130 L 61 130 M 53 140 L 61 140" stroke="#b8b8b8" stroke-width="2"/>
  <!-- velcro strap 2 (right) -->
  <rect x="202" y="60" width="14" height="90" rx="3" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <path d="M 205 70 L 213 70 M 205 80 L 213 80 M 205 90 L 213 90 M 205 100 L 213 100 M 205 110 L 213 110 M 205 120 L 213 120 M 205 130 L 213 130 M 205 140 L 213 140" stroke="#b8b8b8" stroke-width="2"/>
