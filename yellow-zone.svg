  <!-- yellow zone marker (caution rectangle on ground) -->
  <rect x="20" y="170" width="250" height="55" fill="#fff200" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- caution stripes -->
  <line x1="40" y1="170" x2="20" y2="195" stroke="#000000" stroke-width="4"/>
  <line x1="70" y1="170" x2="20" y2="220" stroke="#000000" stroke-width="4"/>
  <line x1="100" y1="170" x2="50" y2="225" stroke="#000000" stroke-width="4"/>
  <line x1="130" y1="170" x2="80" y2="225" stroke="#000000" stroke-width="4"/>
  <line x1="160" y1="170" x2="110" y2="225" stroke="#000000" stroke-width="4"/>
  <line x1="190" y1="170" x2="140" y2="225" stroke="#000000" stroke-width="4"/>
  <line x1="220" y1="170" x2="170" y2="225" stroke="#000000" stroke-width="4"/>
  <line x1="250" y1="170" x2="200" y2="225" stroke="#000000" stroke-width="4"/>
  <line x1="270" y1="180" x2="230" y2="225" stroke="#000000" stroke-width="4"/>
  <line x1="270" y1="210" x2="260" y2="225" stroke="#000000" stroke-width="4"/>
  <!-- full body figure standing on zone, concerned -->
  <!-- head -->
  <circle cx="145" cy="40" r="20" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- worried eyes -->
  <circle cx="138" cy="38" r="2.5" fill="#000000"/>
  <circle cx="152" cy="38" r="2.5" fill="#000000"/>
  <!-- worried eyebrows angled in -->
  <line x1="132" y1="30" x2="142" y2="33" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="158" y1="30" x2="148" y2="33" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- concerned wavy mouth -->
  <path d="M138 50 Q142 46 145 50 Q148 54 152 50" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- sweat drop -->
  <path d="M165 45 C162 50 168 52 168 47 C168 44 165 42 165 45 Z" fill="#90a7d6" stroke="#000000" stroke-width="2"/>
  <!-- torso -->
  <rect x="130" y="60" width="30" height="55" fill="#ff9900" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- arms -->
  <path d="M130 70 L110 105" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M110 105 L110 105" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M130 70 L110 105" stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M160 70 L180 105" stroke="#eed5b6" stroke-width="9" stroke-linecap="round"/>
  <path d="M160 70 L180 105" stroke="#000000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- legs -->
  <rect x="132" y="115" width="11" height="55" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="147" y="115" width="11" height="55" fill="#2a4ec0" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- feet -->
  <ellipse cx="137" cy="173" rx="8" ry="4" fill="#000000"/>
  <ellipse cx="153" cy="173" rx="8" ry="4" fill="#000000"/>
</svg>
