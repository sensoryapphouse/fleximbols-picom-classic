<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Tree pose: standing on one leg, other foot pressed to inner thigh, hands in prayer above head -->
  <!-- Head -->
  <circle cx="145" cy="48" r="14" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Neck -->
  <line x1="145" y1="62" x2="145" y2="75" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Torso -->
  <line x1="145" y1="75" x2="145" y2="138" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Arms raised above head, palms together (prayer) -->
  <!-- Left arm up and inward -->
  <line x1="145" y1="80" x2="135" y2="35" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="135" y1="35" x2="142" y2="15" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Right arm up and inward -->
  <line x1="145" y1="80" x2="155" y2="35" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="155" y1="35" x2="148" y2="15" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Praying hands joined at top -->
  <path d="M138 18 L152 18 L150 8 L140 8 Z" fill="#eed5b6" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Yoga top -->
  <path d="M132 80 L132 128 L158 128 L158 80 Z" fill="#7c3fac" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Yoga shorts -->
  <rect x="130" y="125" width="30" height="22" rx="4" ry="4" fill="#3aa6a0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Standing leg (right) straight -->
  <line x1="148" y1="145" x2="152" y2="210" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Standing foot -->
  <line x1="152" y1="210" x2="170" y2="215" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Bent leg (left): thigh out to side, foot tucked to inner thigh of standing leg -->
  <line x1="142" y1="145" x2="115" y2="170" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="115" y1="170" x2="140" y2="180" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Foot pressed against inner thigh -->
  <ellipse cx="143" cy="180" rx="8" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Ground line -->
  <line x1="80" y1="222" x2="210" y2="222" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
