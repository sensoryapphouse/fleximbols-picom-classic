<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Warrior II pose: full body, wide stance, front knee bent, arms outstretched horizontally -->
  <!-- Head -->
  <circle cx="145" cy="42" r="15" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Neck -->
  <line x1="145" y1="57" x2="145" y2="70" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Torso -->
  <line x1="145" y1="70" x2="145" y2="140" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Arms outstretched horizontally at shoulder height (Warrior II) -->
  <!-- Left arm extended out -->
  <line x1="145" y1="80" x2="65" y2="80" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Left hand -->
  <circle cx="60" cy="80" r="5" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Right arm extended out -->
  <line x1="145" y1="80" x2="225" y2="80" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Right hand -->
  <circle cx="230" cy="80" r="5" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- Front leg (right) bent at knee, thigh horizontal, shin vertical -->
  <line x1="145" y1="140" x2="200" y2="155" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="155" x2="205" y2="210" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Front foot -->
  <line x1="205" y1="210" x2="225" y2="212" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Back leg (left) straight, angled back -->
  <line x1="145" y1="140" x2="85" y2="200" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Back foot turned out -->
  <line x1="85" y1="200" x2="65" y2="212" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="65" y1="212" x2="78" y2="212" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Yoga shorts (clothing block at hips) -->
  <rect x="130" y="125" width="30" height="22" rx="4" ry="4" fill="#2a4ec0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Yoga top (tank, blue) -->
  <path d="M132 75 L132 128 L158 128 L158 75 Z" fill="#3aa6a0" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Ground line -->
  <line x1="40" y1="220" x2="250" y2="220" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>
