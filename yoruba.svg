  <path d="M 225,180 L 215,185 L 215,220 L 225,225 Z" fill="#9d7246" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 155,185 Q 185,180 215,185 L 215,220 Q 185,225 155,220 Z" fill="#e6b98a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Drum tension cords -->
