  <!-- Adire textile pattern backdrop (indigo with white motifs) -->
  <rect x="15" y="20" width="100" height="200" fill="#1d0e82" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Adire diamond motifs -->
  <path d="M 40,45 L 55,55 L 40,65 L 25,55 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 90,45 L 105,55 L 90,65 L 75,55 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 40,95 L 55,105 L 40,115 L 25,105 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 90,95 L 105,105 L 90,115 L 75,105 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 40,145 L 55,155 L 40,165 L 25,155 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 90,145 L 105,155 L 90,165 L 75,155 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 40,195 L 55,205 L 40,215 L 25,205 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 90,195 L 105,205 L 90,215 L 75,205 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Yoruba traditional mask (Gelede style) -->
  <ellipse cx="175" cy="100" rx="50" ry="62" fill="#9d7246" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Mask forehead band -->
  <path d="M 130,75 Q 175,55 220,75" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes (closed slit style) -->
  <path d="M 150,98 Q 160,92 168,98" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 182,98 Q 190,92 200,98" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M 175,105 L 170,125 L 180,125 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Mouth -->
  <path d="M 162,140 Q 175,148 188,140 Q 175,145 162,140 Z" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Mask scarification marks -->
  <line x1="140" y1="110" x2="148" y2="118" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="143" y1="105" x2="151" y2="113" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="210" y1="110" x2="202" y2="118" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="207" y1="105" x2="199" y2="113" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Mask top crest -->
  <path d="M 145,55 Q 175,30 205,55 Q 195,48 175,46 Q 155,48 145,55 Z" fill="#7d5e23" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Talking drum (Dundun) -->
