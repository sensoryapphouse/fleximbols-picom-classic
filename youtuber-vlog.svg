<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- outdoor vlog setting: ground + sun -->
  <line x1="10" y1="220" x2="280" y2="220" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- sun -->
  <circle cx="40" cy="40" r="16" fill="#fff200" stroke="#000000" stroke-width="3"/>
  <line x1="40" y1="16" x2="40" y2="22" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="40" x2="26" y2="40" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="40" x2="54" y2="40" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <line x1="26" y1="26" x2="30" y2="30" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <line x1="54" y1="26" x2="50" y2="30" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  <!-- tree -->
  <rect x="250" y="160" width="10" height="60" fill="#5e1f0a" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="255" cy="150" r="22" fill="#529929" stroke="#000000" stroke-width="4"/>

  <!-- VLOGGER (full body) - walking and holding camera at arm's length (selfie style) -->
  <!-- head -->
  <ellipse cx="130" cy="80" rx="20" ry="20" fill="#eed5b6" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- hair -->
  <path d="M112 76 Q114 60 130 60 Q146 60 148 76 Q144 66 130 66 Q116 66 112 76Z" fill="#5e1f0a" stroke="none"/>
  <!-- eyes -->
  <circle cx="123" cy="80" r="3" fill="#000000"/>
  <circle cx="137" cy="80" r="3" fill="#000000"/>
  <!-- big smile -->
  <path d="M120 88 Q130 96 140 88" fill="#5e1f0a" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- ear visible -->
  <ellipse cx="110" cy="82" rx="3" ry="5" fill="#eed5b6" stroke="#000000" stroke-width="2"/>

  <!-- neck -->
  <rect x="123" y="98" width="14" height="8" rx="3" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- torso (t-shirt) -->
  <path d="M104 108 L156 108 L162 168 L98 168 Z" fill="#fff200" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- LEFT arm extended OUT holding camera (selfie) -->
  <path d="M104 116 L70 100 L48 90" fill="none" stroke="#fff200" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="45" cy="89" rx="8" ry="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>
  <!-- RIGHT arm waving/gesturing -->
  <path d="M156 116 L184 100 L186 80" fill="none" stroke="#fff200" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="186" cy="76" rx="8" ry="7" fill="#eed5b6" stroke="#000000" stroke-width="3"/>

  <!-- legs (walking) -->
  <path d="M116 168 L106 210" fill="none" stroke="#1d0e82" stroke-width="14" stroke-linecap="round"/>
  <path d="M144 168 L156 210" fill="none" stroke="#1d0e82" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="103" cy="215" rx="14" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>
  <ellipse cx="160" cy="215" rx="14" ry="6" fill="#4d4d4d" stroke="#000000" stroke-width="3"/>

  <!-- CAMERA in extended left hand -->
  <rect x="22" y="74" width="40" height="28" rx="4" fill="#4d4d4d" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- lens facing the vlogger -->
  <circle cx="56" cy="88" r="10" fill="#1d0e82" stroke="#000000" stroke-width="3"/>
  <circle cx="56" cy="88" r="5" fill="#90a7d6" stroke="#000000" stroke-width="2"/>
  <!-- record light -->
  <circle cx="30" cy="80" r="3" fill="#f8130d" stroke="#000000" stroke-width="1"/>
  <!-- flip screen -->
  <rect x="20" y="76" width="6" height="20" rx="1" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
</svg>
