  <!-- small hand-stapled zine, DIY photocopy aesthetic -->
  <!-- back page (slightly offset) -->
  <rect x="68" y="38" width="150" height="180" fill="#efefef" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- front cover (photocopy off-white) -->
  <rect x="58" y="30" width="150" height="180" fill="#f5e7c4" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- photocopy smudges / toner streaks -->
  <rect x="58" y="56" width="150" height="3" fill="#b8b8b8"/>
  <rect x="58" y="120" width="150" height="2" fill="#b8b8b8"/>
  <rect x="58" y="180" width="150" height="4" fill="#7f7f7f"/>
  <!-- staples on left edge -->
  <rect x="56" y="60" width="6" height="3" fill="#7f7f7f" stroke="#000000" stroke-width="1.5"/>
  <rect x="56" y="115" width="6" height="3" fill="#7f7f7f" stroke="#000000" stroke-width="1.5"/>
  <rect x="56" y="170" width="6" height="3" fill="#7f7f7f" stroke="#000000" stroke-width="1.5"/>
  <!-- masthead band (DIY photocopy header strip, text-free) -->
  <rect x="74" y="58" width="118" height="34" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="80" y="64" width="106" height="22" fill="#f5e7c4" stroke="none"/>
  <rect x="80" y="70" width="80" height="3" fill="#7f7f7f"/>
  <rect x="80" y="78" width="62" height="3" fill="#b8b8b8"/>
  <!-- cut-and-paste image rectangle (newspaper clip vibe) -->
  <rect x="74" y="118" width="56" height="40" fill="#ffffff" stroke="#000000" stroke-width="2.5" transform="rotate(-4 102 138)"/>
  <!-- doodle face inside clipping -->
  <circle cx="102" cy="138" r="12" fill="#fff200" stroke="#000000" stroke-width="2"/>
  <circle cx="98" cy="135" r="1.5" fill="#000000"/>
  <circle cx="106" cy="135" r="1.5" fill="#000000"/>
  <path d="M 96,142 Q 102,146 108,142" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- second clip -->
  <rect x="138" y="125" width="58" height="38" fill="#dff3fd" stroke="#000000" stroke-width="2.5" transform="rotate(5 167 144)"/>
  <!-- handwritten lines (ragged paths) -->
  <path d="M 144,135 L 188,132" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none" transform="rotate(5 167 144)"/>
  <path d="M 144,144 L 182,143" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none" transform="rotate(5 167 144)"/>
  <path d="M 144,153 L 186,152" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none" transform="rotate(5 167 144)"/>
  <!-- DIY scribble lines at bottom -->
  <path d="M 72,184 Q 90,180 110,184 T 148,184 T 192,184" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 72,194 Q 92,190 112,194 T 150,194 T 192,194" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- folded corner -->
  <path d="M 208,30 L 208,46 L 192,30 Z" fill="#b8b8b8" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
</svg>
